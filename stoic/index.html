<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stoic Girl Workbook</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap');
:root{
  --blush:#f2c4ce;--rose:#e8a0b0;--mauve:#c9a0b4;--lavender:#d4b8e0;
  --sage:#b8cfb0;--cream:#fdf6f0;--warm:#f7ece4;--ink:#3a2a2e;--muted:#9a8088;--rule:#e0cec8;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f0e8e4;font-family:'Jost',sans-serif;color:var(--ink);min-height:100vh;}

.topbar{background:var(--cream);border-bottom:1px solid var(--rule);padding:14px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;}
.topbar-title{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:300;letter-spacing:2px;}
.topbar-title em{font-style:italic;color:var(--mauve);}
.topbar-right{display:flex;align-items:center;gap:10px;}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border:1.5px solid var(--rule);border-radius:20px;font-size:0.72rem;color:var(--muted);cursor:pointer;background:transparent;font-family:'Jost',sans-serif;text-decoration:none;transition:all .15s;}
.back-btn:hover{border-color:var(--rose);color:var(--ink);}
.topbar-date{font-size:0.66rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}

.view{display:none;} .view.active{display:block;}

/* OVERVIEW */
.overview{max-width:980px;margin:0 auto;padding:28px 24px 60px;}
.ov-header{text-align:center;margin-bottom:36px;}
.ov-eyebrow{font-size:0.62rem;letter-spacing:4px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.ov-title{font-family:'Cormorant Garamond',serif;font-size:3rem;font-weight:300;letter-spacing:2px;line-height:1.1;}
.ov-title em{font-style:italic;color:var(--mauve);}
.ov-quote{font-family:'Cormorant Garamond',serif;font-size:0.95rem;font-style:italic;color:var(--muted);margin-top:10px;}
.module-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.module-card{background:var(--cream);border:1px solid var(--rule);border-radius:14px;padding:20px 18px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.module-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;}
.module-card:nth-child(1)::before{background:#f2c4ce;}
.module-card:nth-child(2)::before{background:#d4b8e0;}
.module-card:nth-child(3)::before{background:#b8cfb0;}
.module-card:nth-child(4)::before{background:#e8a0b0;}
.module-card:nth-child(5)::before{background:#c9a0b4;}
.module-card:nth-child(6)::before{background:#b8d4f0;}
.module-card:nth-child(7)::before{background:#f7d9b0;}
.module-card:nth-child(8)::before{background:#a8d8d0;}
.module-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(180,130,140,.14);border-color:var(--mauve);}
.mc-num{font-size:0.58rem;letter-spacing:3px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px;}
.mc-title{font-family:'Cormorant Garamond',serif;font-size:1.05rem;font-weight:600;line-height:1.3;margin-bottom:3px;}
.mc-sub{font-size:0.68rem;color:var(--muted);font-style:italic;margin-bottom:10px;}
.mc-ex-count{font-size:0.62rem;color:var(--mauve);font-weight:600;margin-bottom:6px;}
.mc-prog{height:3px;background:var(--rule);border-radius:2px;overflow:hidden;}
.mc-prog-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--blush),var(--mauve));}
.mc-entries{font-size:0.6rem;color:var(--muted);margin-top:4px;}

/* MODULE VIEW */
.mod-view{max-width:900px;margin:0 auto;padding:0 24px 60px;}
.mod-nav{display:flex;align-items:center;gap:12px;padding:16px 0 20px;}
.mod-back{padding:6px 14px;border:1.5px solid var(--rule);border-radius:20px;font-size:0.72rem;color:var(--muted);cursor:pointer;background:var(--cream);font-family:'Jost',sans-serif;transition:all .15s;}
.mod-back:hover{border-color:var(--rose);color:var(--ink);}
.mod-badge{font-size:0.58rem;letter-spacing:3px;text-transform:uppercase;color:var(--muted);font-weight:600;}
.mod-heading{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:400;font-style:italic;flex:1;}
.mod-intro{background:linear-gradient(135deg,#fce8ef,#f7f0f9);border:1px solid var(--blush);border-radius:12px;padding:16px 20px;margin-bottom:22px;}
.mod-intro-quote{font-family:'Cormorant Garamond',serif;font-size:1rem;font-style:italic;color:var(--mauve);margin-bottom:8px;}
.mod-intro-desc{font-size:0.76rem;color:var(--muted);line-height:1.7;}

/* Exercise tabs */
.ex-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
.ex-tab{padding:6px 16px;border:1.5px solid var(--rule);border-radius:20px;font-family:'Jost',sans-serif;font-size:0.7rem;font-weight:500;cursor:pointer;background:var(--cream);color:var(--muted);transition:all .15s;}
.ex-tab:hover{border-color:var(--mauve);}
.ex-tab.active{background:var(--mauve);border-color:var(--mauve);color:white;}
.ex-tab.has-entries{border-color:var(--sage);color:#2a6a30;}
.ex-tab.active.has-entries{background:var(--sage);border-color:var(--sage);color:white;}

/* Exercise page */
.ex-page{display:none;} .ex-page.active{display:block;}
.ex-hdr{margin-bottom:18px;}
.ex-eyebrow{font-size:0.6rem;letter-spacing:3px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px;}
.ex-title{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:400;font-style:italic;}
.ex-purpose{font-size:0.74rem;color:var(--muted);line-height:1.6;margin-top:5px;}
.ex-time{display:inline-block;background:var(--warm);border:1px solid var(--rule);border-radius:10px;padding:3px 10px;font-size:0.62rem;color:var(--muted);margin-top:5px;}

/* Entries */
.entries-sec{margin-bottom:22px;}
.entries-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.entries-lbl{font-size:0.62rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:600;}
.new-btn{padding:7px 18px;border:none;border-radius:20px;background:var(--mauve);color:white;font-family:'Jost',sans-serif;font-size:0.72rem;font-weight:600;cursor:pointer;transition:all .15s;}
.new-btn:hover{background:var(--rose);}
.entry-list{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;}
.entry-chip{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--cream);border:1px solid var(--rule);border-radius:10px;cursor:pointer;transition:all .15s;}
.entry-chip:hover{border-color:var(--mauve);}
.entry-chip.active-entry{background:linear-gradient(135deg,#fce8ef,#f0e0f0);border-color:var(--blush);}
.entry-date{font-family:'Cormorant Garamond',serif;font-size:0.9rem;font-weight:600;color:var(--mauve);white-space:nowrap;}
.entry-preview{font-size:0.7rem;color:var(--muted);font-style:italic;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.entry-del{background:none;border:none;font-size:0.62rem;color:#ccc;cursor:pointer;padding:2px 5px;transition:color .15s;flex-shrink:0;}
.entry-del:hover{color:#a0304a;}
.empty-state{text-align:center;padding:28px 20px;color:var(--muted);background:var(--warm);border:1px dashed var(--rule);border-radius:12px;}
.empty-icon{font-size:1.8rem;margin-bottom:6px;}
.empty-text{font-family:'Cormorant Garamond',serif;font-size:0.95rem;font-style:italic;}

/* Entry form */
.entry-form{background:var(--cream);border:1px solid var(--rule);border-radius:14px;padding:22px 26px;}
.entry-form-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--rule);}
.entry-form-date{font-family:'Cormorant Garamond',serif;font-size:1rem;font-style:italic;color:var(--mauve);}
.saved-indicator{font-size:0.7rem;color:var(--sage);font-weight:600;}

/* Form elements */
.f-group{margin-bottom:16px;}
.f-label{font-size:0.62rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:5px;display:block;}
.f-sub{font-size:0.7rem;color:var(--muted);font-style:italic;margin-bottom:7px;}
.write{background:var(--warm);border:1px solid var(--rule);border-radius:8px;padding:10px 13px;min-height:72px;font-family:'Jost',sans-serif;font-size:0.8rem;line-height:1.75;color:var(--ink);outline:none;width:100%;transition:border-color .15s;}
.write:focus{border-color:var(--blush);box-shadow:0 0 0 3px rgba(242,196,206,.18);}
.write[contenteditable]:empty:before{content:attr(data-ph);color:#c8aab0;font-style:italic;}
.write.sh{min-height:50px;}
.write.ta{min-height:110px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
hr.r{border:none;border-top:1px solid var(--rule);margin:18px 0;}
.sec-lbl{font-size:0.62rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 0 6px;display:block;}
.sec-sub{font-size:0.7rem;color:var(--muted);font-style:italic;margin-bottom:10px;}

/* Colored boxes */
.box{border-radius:10px;padding:14px 16px;margin-bottom:10px;}
.box-pink{background:#fce8ef;border:1.5px solid var(--blush);}
.box-purple{background:#f0e0f0;border:1.5px solid var(--lavender);}
.box-green{background:#e8f5e9;border:1.5px solid var(--sage);}
.box-amber{background:#fff8e1;border:1.5px solid #e0c870;}
.box-blue{background:#e3f0ff;border:1.5px solid #b8d4f0;}
.box-teal{background:#e0f4f2;border:1.5px solid #a8d8d0;}
.box-title{font-size:0.68rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;}
.box-sub{font-size:0.67rem;color:var(--muted);font-style:italic;margin-bottom:8px;line-height:1.5;}

/* Distortions checklist */
.distortion-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px;}
.distortion-item{display:flex;align-items:flex-start;gap:8px;padding:6px 10px;background:var(--warm);border:1px solid var(--rule);border-radius:8px;cursor:pointer;transition:all .15s;}
.distortion-item:hover{border-color:var(--mauve);}
.distortion-item.checked{background:#fce8ef;border-color:var(--blush);}
.di-check{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--rule);flex-shrink:0;margin-top:1px;transition:all .15s;}
.distortion-item.checked .di-check{background:var(--rose);border-color:var(--rose);}
.di-label{font-size:0.72rem;color:var(--ink);line-height:1.4;}

/* Weather tracking */
.weather-table{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:0.74rem;}
.weather-table th{font-size:0.6rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 10px;text-align:left;border-bottom:1px solid var(--rule);}
.weather-table td{padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top;}
.weather-table tr:last-child td{border-bottom:none;}
.weather-day{font-weight:600;font-size:0.72rem;width:40px;}

/* Intensity slider */
.intensity-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.intensity-label{font-size:0.72rem;color:var(--muted);min-width:80px;}
.intensity-input{flex:1;accent-color:var(--mauve);}
.intensity-val{font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:600;color:var(--mauve);min-width:20px;text-align:right;}

/* Ornament */
.ornament{text-align:center;color:var(--blush);font-size:0.9rem;letter-spacing:10px;margin:22px 0 0;}

@media(max-width:700px){.module-grid{grid-template-columns:1fr 1fr;}.two-col,.three-col{grid-template-columns:1fr;}}
.pdf-btn{padding:6px 14px;border:none;border-radius:20px;background:var(--rose);color:white;font-family:'Jost',sans-serif;font-size:0.7rem;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;}
.pdf-btn:hover{background:var(--mauve);}

@media print{
  .topbar,.mod-nav,.ex-tabs,.new-btn,.entry-del,.pdf-btn{display:none!important;}
  body{background:white!important;}
  .mod-view{padding:20px!important;}
  .ex-page{display:block!important;}
  .entry-form{break-inside:avoid;}
  .entry-chip.active-entry{background:#fce8ef!important;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">Stoic Girl <em>Workbook</em></div>
  <div class="topbar-right">
    <a href="../" class="back-btn">← Brain 2.0</a>
    <span class="topbar-date" id="today-date"></span>
  </div>
</div>

<div class="view active" id="view-overview">
  <div class="overview">
    <div class="ov-header">
      <div class="ov-eyebrow">Stoicism · Psychology · Self-Compassion</div>
      <div class="ov-title">The <em>Living</em> Workbook</div>
      <div class="ov-quote">"Harness inner strength, embrace outer peace."</div>
    </div>
    <div class="module-grid" id="module-grid"></div>
  </div>
</div>

<div class="view" id="view-module">
  <div class="mod-view">
    <div class="mod-nav">
      <button class="mod-back" onclick="goOverview()">← All Modules</button>
      <span class="mod-badge" id="mod-badge"></span>
      <span class="mod-heading" id="mod-heading"></span>
      <button class="pdf-btn" onclick="saveModulePDF()">⬇ Save PDF</button>
    </div>
    <div class="mod-intro" id="mod-intro"></div>
    <div class="ex-tabs" id="ex-tabs"></div>
    <div id="ex-pages"></div>
  </div>
</div>

<script>
var SK = 'stoicWorkbook2';
var activeModIdx = null;
var activeExIdx  = 0;
var activeEntryId = null;

var DAYS_FULL   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MONTHS_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var MONTHS_S    = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// ─────────────────────────────────────────────────────────────
// MODULE & EXERCISE DEFINITIONS — faithful to PDF
// ─────────────────────────────────────────────────────────────
var MODULES = [

// ── MODULE 1 ─────────────────────────────────────────────────
{num:'01',title:'The Foundation',sub:'Who You Are Beneath the Chaos',
 quote:'"Your mind is your most intimate space."',
 desc:'These three exercises transform you from someone who experiences thoughts and feelings to someone who can also observe and understand them. That shift changes everything.',
 exercises:[
  {id:'tfb',label:'Ex 1.1',title:'Thought-Feeling-Behavior Tracker',
   purpose:'Learn to identify the connection between your thoughts, emotions, and actions by analyzing a specific situation step-by-step.',time:'10–15 minutes',
   fields:[
    {t:'sec',label:'Think of a recent moment when you felt a strong emotion — overwhelmed, anxious, or upset. Break it down step by step. Stay curious, not judgmental.'},
    {t:'write',id:'situation',label:'1. The Situation — What Actually Happened',sub:'Describe what happened as if you were a neutral observer. What would a security camera have recorded?',ph:'Just the facts — no story, no interpretation. What literally happened?'},
    {t:'write',id:'thought',label:'2. The Thought — What Went Through Your Mind',sub:'What was your first thought? What story did your brain create about this situation?',ph:'My first thought was... The story I told myself was...'},
    {t:'write',id:'feeling',label:'3. The Feeling — What Emotion Showed Up',sub:'What emotion(s) did you experience? Where did you feel it in your body?',ph:'I felt... I noticed it in my body as...'},
    {t:'write',id:'behavior',label:'4. The Behavior — What You Did or Wanted to Do',sub:'How did you react? What did you do, say, or want to do in response?',ph:'My reaction was... I wanted to...'},
    {t:'hr'},
    {t:'sec',label:'Reflection Questions'},
    {t:'two',fields:[
     {id:'notice',label:'Looking at this triangle, what do you notice?',ph:'What patterns do you see between thought, feeling, and behavior?'},
     {id:'balanced',label:'What would a more balanced thought sound like?',ph:'Rewrite the thought from curiosity rather than reactivity...'},
    ]},
    {t:'two',fields:[
     {id:'change',label:'If you could change your initial thought, how might your feeling and behavior have been different?',ph:''},
     {id:'further',label:'How has your behavior influenced further thoughts about the situation?',ph:''},
    ]},
   ]},

  {id:'observer',label:'Ex 1.2',title:'Observer Mode Journal',
   purpose:'Practice stepping back from intense emotions and observing your thoughts with gentle curiosity rather than being consumed by them.',time:'15–20 minutes',
   fields:[
    {t:'sec',label:'Think of yourself as a kind, curious scientist studying your own mind.'},
    {t:'sec',label:'Current Moment Check-In'},
    {t:'two',fields:[
     {id:'feeling_now',label:'Right now, what am I feeling?',ph:''},
     {id:'body_sensation',label:'Where do I feel this in my body?',ph:''},
    ]},
    {t:'sec',label:'The Trigger Hunt'},
    {t:'two',fields:[
     {id:'trigger_recent',label:'What happened recently that might have stirred this up?',ph:''},
     {id:'when_noticed',label:'When did I first notice this feeling today?',ph:''},
    ]},
    {t:'sec',label:'The Story Detective'},
    {t:'two',fields:[
     {id:'story_telling',label:'What story am I telling myself about this situation?',ph:''},
     {id:'meaning_making',label:'What meaning am I making of what happened?',ph:''},
    ]},
    {t:'sec',label:'The Gentle Inquiry'},
    {t:'two',fields:[
     {id:'is_true',label:'Is this story definitely true, or is it one possible interpretation?',ph:''},
     {id:'friend_advice',label:'What would I tell a friend who was having this same thought?',ph:''},
    ]},
    {t:'sec',label:'The Wise Observer'},
    {t:'two',fields:[
     {id:'wise_observe',label:'If I could step outside this feeling and observe it with compassion, what would I notice?',ph:''},
     {id:'emotion_needs',label:'What does this emotion need from me right now?',ph:''},
    ]},
   ]},

  {id:'distortions',label:'Ex 1.3',title:'Cognitive Distortions Bingo',
   purpose:'Recognize common thinking patterns that create unnecessary emotional drama, and learn to reframe them with more balanced perspectives.',time:'10–15 minutes',
   fields:[
    {t:'sec',label:'Step 1 — Circle any distortions that showed up for you this week.',sub:'Tap each one to mark it.'},
    {t:'distortions',id:'dist_checked'},
    {t:'hr'},
    {t:'sec',label:'Step 2 — Now pick your top 2–3 to reflect on.'},
    {t:'box3',
     items:[
      {id:'dist1_which',label:'Distortion 1 — Which one?',ph:'e.g. Catastrophizing'},
      {id:'dist1_how',label:'How it showed up:',ph:'What happened, what you thought...'},

      {id:'dist3_how',label:'How it showed up:',ph:''},

     ]},
   ]},
 ]},

// ── MODULE 2 ─────────────────────────────────────────────────
{num:'02',title:'The Dichotomy of Control',sub:'But Make It Relatable',
 quote:'"Control your controllables, release the rest."',
 desc:'Most suffering comes from trying to control things that were never ours to control. These four exercises retrain your brain from "I need to control this" to "where can I best invest my energy?"',
 exercises:[
  {id:'circle_control',label:'Ex 2.1',title:'Circle of Control Diagram',
   purpose:'Visually categorize your current worries to see clearly what deserves your energy and what doesn\'t.',time:'10–15 minutes',
   fields:[
    {t:'write',id:'brain_dump',label:'Brain Dump — What\'s currently on your mind?',sub:'List everything that\'s been worrying, frustrating, or occupying you lately. Get it all out.',ph:'Everything taking up space: the relationship thing, the work situation, the what-ifs, the regrets, the fears...', ta:true},
    {t:'hr'},
    {t:'sec',label:'Now sort each item from your brain dump into its circle.'},
    {t:'three',fields:[
     {id:'full_control',label:'🟢 Full Control',sub:'Your thoughts, responses, actions, effort, words',ph:'What from your brain dump sits here?'},
     {id:'influence',label:'🟡 Influence',sub:'Relationships through your behavior, outcomes through prep',ph:'What can you affect but not fully control?'},
     {id:'no_control',label:'🔴 No Control',sub:'Other people\'s choices, the past, future, timing',ph:'What needs to be released?'},
    ]},
    {t:'hr'},
    {t:'sec',label:'Reflection Questions'},
    {t:'two',fields:[
     {id:'energy_going',label:'What do you notice about where most of your mental energy has been going?',ph:''},
     {id:'no_control_headspace',label:'Which items in the "No Control" circle have been taking up the most headspace?',ph:''},
    ]},
    {t:'two',fields:[
     {id:'redirect_energy',label:'What would change if you redirected that energy to your "Full Control" circle?',ph:''},
     {id:'focus_this_week',label:'Pick one item from Full Control to focus extra energy on this week:',ph:''},
    ]},
   ]},

  {id:'control_inventory',label:'Ex 2.2',title:'Control Inventory Journal',
   purpose:'Transform a specific frustrating situation into an empowered action plan by identifying what you can actually do next.',time:'15–20 minutes',
   fields:[
    {t:'sec',label:'Think of a recent situation that left you feeling powerless or frustrated.'},
    {t:'three',fields:[
     {id:'what_happened',label:'What Happened',sub:'Describe the situation objectively — just the facts.',ph:'What would a neutral observer have seen?'},
     {id:'what_wanted',label:'What I Wanted to Happen',sub:'What were you hoping for or expecting instead?',ph:'What outcome were you attached to?'},
     {id:'what_can_do',label:'What I Can Do Next',sub:'Given reality, what actions are available now?',ph:'Focus only on your choices and responses moving forward.'},

    {t:'hr'},
    {t:'sec',label:'Deeper Reflection'},

    {t:'two',fields:[

{num:'03',title:'The Four Virtues',sub:'Character Building, Soft Girl Edition',

    {t:'write',id:'challenge',label:'1. Current Challenge — What situation or decision are you currently struggling with?',ph:''},

    {t:'two',fields:[

{num:'04',title:'Emotional Regulation',sub:'For Sensitive Souls',
 quote:'"Feel deeply, respond wisely."',
 desc:'You don\'t have to choose between feeling deeply and thinking clearly. Between stimulus and response, there is a space. These four exercises help you find that space and make it bigger.',
 exercises:[
  {id:'gap_pause',label:'Ex 4.1',title:'The Gap Pause Practice',
   purpose:'Learn to identify and expand the space between emotional triggers and your responses, building the skill of conscious choice over automatic reaction.',time:'10–15 min daily + 5 min reflection',
   fields:[
    {t:'sec',label:'1. Understanding Your Current Patterns'},
    {t:'two',fields:[
     {id:'regret_moment',label:'Think of a time this week when you reacted emotionally in a way you later regretted. What happened?',ph:''},
     {id:'trigger_was',label:'What was the trigger that set you off?',ph:''},
    ]},
    {t:'two',fields:[
     {id:'how_quickly',label:'How quickly did you react? (Instantly / Seconds / A minute / Had time to think)',ph:''},
     {id:'different_pause',label:'What would you have done differently if you\'d had more time to pause?',ph:''},
    ]},
    {t:'hr'},
    {t:'sec',label:'2. The Gap Practice — Choose your technique.'},
    {t:'write',id:'technique_choice',label:'Which pause technique will you practice this week?',sub:'4-7-8 Breathing (inhale 4, hold 7, exhale 8) · Box Breathing (4-4-4-4) · 5-4-3-2-1 Grounding · Body Scan · Count to 10',ph:'I choose ___ because it works for me when...'},
    {t:'write',id:'choice_point',label:'When I feel the urge to react, I will ask myself:',sub:'"What would my wisest self do?" / "How do I want to feel about this later?" / "What response aligns with my values?"',ph:'My go-to pause question is...',sh:true},
    {t:'hr'},
    {t:'sec',label:'3. Weekly Practice Log — Note key moments from each day.'},
    {t:'weather',id:'gap_log',days:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
     cols:['Trigger','Intensity (1-10)','Pause Used','Chosen Response','How It Felt']},
    {t:'hr'},
    {t:'sec',label:'4. Weekly Reflection'},
    {t:'two',fields:[
     {id:'trigger_patterns',label:'What patterns do you notice in your triggers?',ph:''},
     {id:'pause_feeling',label:'How did it feel to choose your response rather than react automatically?',ph:''},
    ]},
    {t:'two',fields:[
     {id:'best_technique',label:'Which pause technique worked best for you?',ph:''},
     {id:'hardest_gap',label:'What made it hardest to find the gap?',ph:''},
    ]},
   ]},

{num:'05',title:'Relationships & Boundaries',sub:'The Hardest Part',
 quote:'"Attachment creates suffering, love creates freedom."',

// ─────────────────────────────────────────────────────────────
// STORAGE
// ─────────────────────────────────────────────────────────────
function entryKey(mi,ei){ return SK+'_m'+mi+'_e_'+ei; }
function getEntries(mi,ei){ var r=localStorage.getItem(entryKey(mi,ei)); try{return r?JSON.parse(r):[]}catch(e){return [];} }
function saveEntries(mi,ei,arr){ localStorage.setItem(entryKey(mi,ei),JSON.stringify(arr)); }

function todayLabel(){
  var d=new Date();
  return DAYS_FULL[d.getDay()].slice(0,3)+' '+MONTHS_S[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();
}

// ─────────────────────────────────────────────────────────────
// OVERVIEW
// ─────────────────────────────────────────────────────────────
function renderOverview(){
  var g=document.getElementById('module-grid'); g.innerHTML='';
  MODULES.forEach(function(m,mi){
    var total=m.exercises.reduce(function(s,ex){return s+getEntries(mi,ex.id).length;},0);
    var tile=document.createElement('div'); tile.className='module-card';
    tile.innerHTML=
      '<div class="mc-num">Module '+m.num+'</div>'+
      '<div class="mc-title">'+m.title+'</div>'+
      '<div class="mc-sub">'+m.sub+'</div>'+
      '<div class="mc-ex-count">'+m.exercises.length+' exercises</div>'+
      '<div class="mc-prog"><div class="mc-prog-fill" style="width:'+Math.min(100,total*10)+'%"></div></div>'+
      '<div class="mc-entries">'+(total>0?total+' entr'+(total===1?'y':'ies')+' saved':'No entries yet')+'</div>';
    tile.onclick=(function(i){return function(){openModule(i);};})(mi);
    g.appendChild(tile);
  });
}

// ─────────────────────────────────────────────────────────────
// OPEN MODULE
// ─────────────────────────────────────────────────────────────
function openModule(mi){
  activeModIdx=mi; activeExIdx=0; activeEntryId=null;
  var m=MODULES[mi];
  document.getElementById('mod-badge').textContent='Module '+m.num;
  document.getElementById('mod-heading').textContent=m.title+' — '+m.sub;
  document.getElementById('mod-intro').innerHTML=
    '<div class="mod-intro-quote">'+m.quote+'</div>'+
    '<div class="mod-intro-desc">'+m.desc+'</div>';
  buildExTabs(mi);
  renderExPage(mi,0);
  document.getElementById('view-overview').classList.remove('active');
  document.getElementById('view-module').classList.add('active');
}

function goOverview(){
  document.getElementById('view-module').classList.remove('active');
  document.getElementById('view-overview').classList.add('active');
  renderOverview();
}

// ─────────────────────────────────────────────────────────────
// EXERCISE TABS
// ─────────────────────────────────────────────────────────────
function buildExTabs(mi){
  var m=MODULES[mi];
  var c=document.getElementById('ex-tabs'); c.innerHTML='';
  m.exercises.forEach(function(ex,ei){
    var entries=getEntries(mi,ex.id);
    var btn=document.createElement('button');
    btn.className='ex-tab'+(ei===0?' active':'')+(entries.length?' has-entries':'');
    btn.id='extab-'+ei;
    btn.textContent=ex.label+(entries.length?' ('+entries.length+')':'');
    btn.onclick=(function(i){return function(){
      document.querySelectorAll('.ex-tab').forEach(function(b){b.classList.remove('active');});
      document.getElementById('extab-'+i).classList.add('active');
      activeEntryId=null;
      renderExPage(mi,i);
    };})(ei);
    c.appendChild(btn);
  });
}

// ─────────────────────────────────────────────────────────────
// RENDER EXERCISE PAGE
// ─────────────────────────────────────────────────────────────
function renderExPage(mi,ei){
  activeExIdx=ei;
  var ex=MODULES[mi].exercises[ei];
  var entries=getEntries(mi,ex.id);
  var c=document.getElementById('ex-pages'); c.innerHTML='';
  var page=document.createElement('div'); page.className='ex-page active';

  // Header
  var hdr=document.createElement('div'); hdr.className='ex-hdr';
  hdr.innerHTML=
    '<div class="ex-eyebrow">'+ex.label+'</div>'+
    '<div class="ex-title">'+ex.title+'</div>'+
    '<div class="ex-purpose">'+ex.purpose+'</div>'+
    '<span class="ex-time">⏱ '+ex.time+'</span>';
  page.appendChild(hdr);

  // Entries section
  var sec=document.createElement('div'); sec.className='entries-sec';
  var hd=document.createElement('div'); hd.className='entries-hdr';
  var lbl=document.createElement('div'); lbl.className='entries-lbl';
  lbl.textContent='Your Entries'+(entries.length?' ('+entries.length+')':'');
  var nb=document.createElement('button'); nb.className='new-btn'; nb.textContent='＋ New Entry';
  nb.onclick=function(){ createEntry(mi,ei); };
  hd.appendChild(lbl); hd.appendChild(nb); sec.appendChild(hd);

  if(entries.length){
    var list=document.createElement('div'); list.className='entry-list';
    entries.slice().reverse().forEach(function(en){
      list.appendChild(buildChip(en,mi,ei));
    });
    sec.appendChild(list);
  } else {
    var empty=document.createElement('div'); empty.className='empty-state';
    empty.innerHTML='<div class="empty-icon">✦</div><div class="empty-text">No entries yet — start your first one.</div>';
    sec.appendChild(empty);
  }
  page.appendChild(sec);

  // Form area
  var formWrap=document.createElement('div'); formWrap.id='entry-form-area'; page.appendChild(formWrap);
  c.appendChild(page);

  // ── BUG FIX: always render form if there's an active entry ──
  if(activeEntryId){
    var entryExists=entries.some(function(e){return e.id===activeEntryId;});
    if(entryExists){
      renderEntryForm(mi,ei,activeEntryId);
      document.querySelectorAll('.entry-chip').forEach(function(ch){
        ch.classList.toggle('active-entry', ch.dataset.id===activeEntryId);
      });
    } else {
      activeEntryId=null;
      if(entries.length){ renderLatestEntry(mi,ei,entries); }
    }
  } else if(entries.length){
    renderLatestEntry(mi,ei,entries);
  }
}

function renderLatestEntry(mi,ei,entries){
  activeEntryId=entries[entries.length-1].id;
  renderEntryForm(mi,ei,activeEntryId);
  document.querySelectorAll('.entry-chip').forEach(function(ch){
    ch.classList.toggle('active-entry', ch.dataset.id===activeEntryId);
  });
}

function buildChip(en,mi,ei){
  var exId=MODULES[mi].exercises[ei].id;
  var chip=document.createElement('div'); chip.className='entry-chip'; chip.dataset.id=en.id;
  var preview=getFirstText(en);
  chip.innerHTML=
    '<span class="entry-date">'+en.date+'</span>'+
    '<span class="entry-preview">'+(preview||'(no content yet)')+'</span>';
  var del=document.createElement('button'); del.className='entry-del'; del.textContent='✕';
  del.onclick=function(e){
    e.stopPropagation();
    if(!confirm('Delete this entry?')) return;
    var arr=getEntries(mi,exId).filter(function(x){return x.id!==en.id;});
    saveEntries(mi,exId,arr);
    if(activeEntryId===en.id) activeEntryId=null;
    renderExPage(mi,ei);
    buildExTabs(mi);
    renderOverview();
  };
  chip.appendChild(del);
  chip.onclick=function(){
    document.querySelectorAll('.entry-chip').forEach(function(c){c.classList.remove('active-entry');});
    chip.classList.add('active-entry');
    activeEntryId=en.id;
    renderEntryForm(mi,ei,en.id);
  };
  return chip;
}

function getFirstText(en){
  var f=en.fields||{};
  for(var k in f){ if(f[k]&&typeof f[k]==='string'&&f[k].trim()) return f[k].replace(/<[^>]+>/g,'').slice(0,60); }
  return '';
}

function createEntry(mi,ei){
  var exId=MODULES[mi].exercises[ei].id;
  var en={id:'e_'+Date.now(), date:todayLabel(), fields:{}};
  var arr=getEntries(mi,exId); arr.push(en);
  saveEntries(mi,exId,arr);
  activeEntryId=en.id;
  renderExPage(mi,ei);
  buildExTabs(mi);
  renderOverview();
  setTimeout(function(){
    var f=document.getElementById('entry-form-area');
    if(f) f.scrollIntoView({behavior:'smooth',block:'start'});
  },80);
}

// ─────────────────────────────────────────────────────────────
// RENDER ENTRY FORM
// ─────────────────────────────────────────────────────────────
function renderEntryForm(mi,ei,entryId){
  var exId=MODULES[mi].exercises[ei].id;
  var arr=getEntries(mi,exId);
  var en=arr.find(function(x){return x.id===entryId;});
  if(!en) return;
  var ex=MODULES[mi].exercises[ei];
  var wrap=document.getElementById('entry-form-area');
  if(!wrap) return;
  wrap.innerHTML='';
  var form=document.createElement('div'); form.className='entry-form';
  var fhdr=document.createElement('div'); fhdr.className='entry-form-hdr';
  fhdr.innerHTML='<span class="entry-form-date">'+en.date+'</span><span class="saved-indicator" id="saved-ind">✓ Auto-saved</span>';
  form.appendChild(fhdr);
  buildFields(form, ex.fields, en, mi, ei);
  var orn=document.createElement('div'); orn.className='ornament'; orn.textContent='✦ ✿ ✦';
  form.appendChild(orn);
  wrap.appendChild(form);
}

function autoSave(mi,ei,entryId,fieldId,val){
  var exId=MODULES[mi].exercises[ei].id;
  var arr=getEntries(mi,exId);
  var en=arr.find(function(x){return x.id===entryId;});
  if(!en) return;
  if(!en.fields) en.fields={};
  en.fields[fieldId]=val;
  saveEntries(mi,exId,arr);
  var ind=document.getElementById('saved-ind');
  if(ind) ind.textContent='✓ Saved';
}

function buildFields(parent, fields, en, mi, ei){
  fields.forEach(function(f){
    if(f.t==='hr'){
      var hr=document.createElement('hr'); hr.className='r'; parent.appendChild(hr);
    } else if(f.t==='sec'){
      var s=document.createElement('div');
      s.innerHTML='<span class="sec-lbl">'+f.label+'</span>'+(f.sub?'<span class="sec-sub">'+f.sub+'</span>':'');
      parent.appendChild(s);
    } else if(f.t==='write'){
      var g=makeWriteGroup(f,en,mi,ei);
      parent.appendChild(g);
    } else if(f.t==='two'){
      var row=document.createElement('div'); row.className='two-col';
      f.fields.forEach(function(ff){row.appendChild(makeWriteGroup(ff,en,mi,ei));});
      parent.appendChild(row);
    } else if(f.t==='three'){
      var row=document.createElement('div'); row.className='three-col';
      f.fields.forEach(function(ff){row.appendChild(makeWriteGroup(ff,en,mi,ei));});
      parent.appendChild(row);
    } else if(f.t==='distortions'){
      parent.appendChild(buildDistortions(f,en,mi,ei));
    } else if(f.t==='box3'){
      var box=document.createElement('div'); box.className='box box-pink';
      box.style.marginBottom='12px';
      f.items.forEach(function(item){
        var g=makeWriteGroup(item,en,mi,ei); g.style.marginBottom='10px'; box.appendChild(g);
      });
      parent.appendChild(box);
    } else if(f.t==='box-write'){
      var colors={'pink':'box-pink','purple':'box-purple','green':'box-green','amber':'box-amber','blue':'box-blue','teal':'box-teal'};
      var box=document.createElement('div'); box.className='box '+(colors[f.color]||'box-pink');
      box.style.marginBottom='12px';
      if(f.title){var ttl=document.createElement('div');ttl.className='box-title';ttl.textContent=f.title;box.appendChild(ttl);}
      f.fields.forEach(function(ff){
        var g=makeWriteGroup(ff,en,mi,ei); g.style.marginBottom='10px'; box.appendChild(g);
      });
      parent.appendChild(box);
    } else if(f.t==='weather'){
      parent.appendChild(buildWeatherTable(f,en,mi,ei));
    }
  });
}

function makeWriteGroup(f,en,mi,ei){
  var g=document.createElement('div'); g.className='f-group';
  var lbl=document.createElement('label'); lbl.className='f-label'; lbl.textContent=f.label;
  g.appendChild(lbl);
  if(f.sub){var sub=document.createElement('div');sub.className='f-sub';sub.textContent=f.sub;g.appendChild(sub);}
  var w=document.createElement('div');
  w.className='write'+(f.sh?' sh':f.ta?' ta':'');
  w.contentEditable='true';
  w.setAttribute('data-ph',f.ph||'');
  var val=(en.fields[f.id]||'');
  if(val) w.innerHTML=val;
  w.oninput=(function(fid){return function(){
    autoSave(mi,ei,en.id,fid,this.innerHTML);
  };})(f.id);
  g.appendChild(w);
  return g;
}

function buildDistortions(f,en,mi,ei){
  var exId=MODULES[mi].exercises[ei].id;
  var wrap=document.createElement('div');
  var grid=document.createElement('div'); grid.className='distortion-grid';
  var checked=(en.fields[f.id]||[]);
  DISTORTIONS.forEach(function(d){
    var item=document.createElement('div'); item.className='distortion-item'+(checked.indexOf(d)>=0?' checked':'');
    item.innerHTML='<div class="di-check"></div><div class="di-label">'+d+'</div>';
    item.onclick=function(){
      var arr=getEntries(mi,exId);
      var entry=arr.find(function(x){return x.id===en.id;});
      if(!entry) return;
      if(!entry.fields[f.id]) entry.fields[f.id]=[];
      var idx=entry.fields[f.id].indexOf(d);
      if(idx>=0) entry.fields[f.id].splice(idx,1); else entry.fields[f.id].push(d);
      saveEntries(mi,exId,arr);
      item.classList.toggle('checked', entry.fields[f.id].indexOf(d)>=0);
    };
    grid.appendChild(item);
  });
  wrap.appendChild(grid);
  return wrap;
}

function buildWeatherTable(f,en,mi,ei){
  var wrap=document.createElement('div');
  var tableData=(en.fields[f.id]||{});
  var table=document.createElement('table'); table.className='weather-table';
  // Header
  var thead=document.createElement('thead');
  var hr=document.createElement('tr');
  var th0=document.createElement('th'); th0.textContent='Day'; hr.appendChild(th0);
  f.cols.forEach(function(col){var th=document.createElement('th');th.textContent=col;hr.appendChild(th);});
  thead.appendChild(hr); table.appendChild(thead);
  // Rows
  var tbody=document.createElement('tbody');
  f.days.forEach(function(day){
    var tr=document.createElement('tr');
    var td0=document.createElement('td'); td0.className='weather-day'; td0.textContent=day; tr.appendChild(td0);
    f.cols.forEach(function(col,ci){
      var td=document.createElement('td');
      var cellId=f.id+'_'+day+'_'+ci;
      var val=(tableData[cellId]||'');
      var input=document.createElement('div'); input.contentEditable='true';
      input.style.cssText='min-width:60px;outline:none;font-size:0.74rem;line-height:1.4;';
      if(val) input.innerHTML=val;
      else { input.setAttribute('data-ph','—'); }
      input.oninput=(function(cid){return function(){
        var exId=MODULES[mi].exercises[ei].id;
        var arr=getEntries(mi,exId); var entry=arr.find(function(x){return x.id===en.id;});
        if(!entry) return;
        if(!entry.fields[f.id]) entry.fields[f.id]={};
        entry.fields[f.id][cid]=this.innerHTML;
        saveEntries(mi,exId,arr);
      };})(cellId);
      td.appendChild(input); tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  return wrap;
}

function autoSave(mi,ei,entryId,fieldId,val){
  var arr=getEntries(mi,ei);
  var en=arr.find(function(x){return x.id===entryId;});
  if(!en) return;
  if(!en.fields) en.fields={};
  en.fields[fieldId]=val;
  saveEntries(mi,ei,arr);
  var ind=document.getElementById('saved-ind');
  if(ind) ind.textContent='✓ Saved';
}

// ─────────────────────────────────────────────────────────────
// PDF
// ─────────────────────────────────────────────────────────────
function saveModulePDF(){
  // Show all entry forms for every exercise in this module
  var mi = activeModIdx;
  var m = MODULES[mi];
  var pdfContainer = document.createElement('div');
  pdfContainer.id = 'pdf-print-area';
  pdfContainer.style.cssText = 'display:none;';

  // Module header
  var mhdr = document.createElement('div');
  mhdr.style.cssText = 'text-align:center;margin-bottom:28px;padding-bottom:16px;border-bottom:1px solid #e0cec8;';
  mhdr.innerHTML = '<div style="font-size:0.6rem;letter-spacing:3px;text-transform:uppercase;color:#9a8088;margin-bottom:4px;">Module '+m.num+'</div>'+
    '<div style="font-family:\'Cormorant Garamond\',serif;font-size:2rem;font-weight:300;font-style:italic;">'+m.title+'</div>'+
    '<div style="font-size:0.7rem;color:#9a8088;margin-top:4px;">'+m.sub+'</div>'+
    '<div style="font-family:\'Cormorant Garamond\',serif;font-style:italic;color:#c9a0b4;margin-top:8px;">'+m.quote+'</div>';
  pdfContainer.appendChild(mhdr);

  // Each exercise
  m.exercises.forEach(function(ex){
    var entries = getEntries(mi, ex.id);
    if(!entries.length) return;

    var exSection = document.createElement('div');
    exSection.style.cssText = 'margin-bottom:32px;page-break-before:auto;';
    exSection.innerHTML = '<div style="font-size:0.6rem;letter-spacing:2px;text-transform:uppercase;color:#9a8088;font-weight:600;margin-bottom:3px;">'+ex.label+'</div>'+
      '<div style="font-family:\'Cormorant Garamond\',serif;font-size:1.3rem;font-style:italic;margin-bottom:12px;border-bottom:1px solid #e0cec8;padding-bottom:8px;">'+ex.title+'</div>';

    entries.forEach(function(en, idx){
      var enDiv = document.createElement('div');
      enDiv.style.cssText = 'margin-bottom:20px;padding:14px 18px;background:#f7ece4;border-radius:8px;page-break-inside:avoid;';
      var dateLine = document.createElement('div');
      dateLine.style.cssText = 'font-family:\'Cormorant Garamond\',serif;font-style:italic;color:#c9a0b4;font-size:0.9rem;margin-bottom:10px;';
      dateLine.textContent = en.date;
      enDiv.appendChild(dateLine);

      // Print all field values
      var fields = en.fields || {};
      ex.fields.forEach(function(f){
        if(f.t==='hr'||f.t==='sec') return;
        var printFields = [];
        if(f.t==='write') printFields=[f];
        else if(f.t==='two'||f.t==='three') printFields=f.fields;
        else if(f.t==='box-write') printFields=f.fields;
        else if(f.t==='box3') printFields=f.items;
        printFields.forEach(function(ff){
          var val = fields[ff.id];
          if(!val||!val.replace(/<[^>]+>/g,'').trim()) return;
          var row = document.createElement('div');
          row.style.cssText = 'margin-bottom:8px;';
          row.innerHTML = '<div style="font-size:0.58rem;letter-spacing:1.5px;text-transform:uppercase;color:#9a8088;font-weight:600;margin-bottom:2px;">'+ff.label+'</div>'+
            '<div style="font-size:0.8rem;line-height:1.7;color:#3a2a2e;">'+val+'</div>';
          enDiv.appendChild(row);
        });
        // Distortions
        if(f.t==='distortions'&&fields[f.id]&&fields[f.id].length){
          var row=document.createElement('div');row.style.marginBottom='8px';
          row.innerHTML='<div style="font-size:0.58rem;letter-spacing:1.5px;text-transform:uppercase;color:#9a8088;font-weight:600;margin-bottom:4px;">Distortions Checked</div>'+
            '<div style="font-size:0.8rem;color:#3a2a2e;">'+fields[f.id].join(', ')+'</div>';
          enDiv.appendChild(row);
        }
      });
      exSection.appendChild(enDiv);
    });
    pdfContainer.appendChild(exSection);
  });

  document.body.appendChild(pdfContainer);
  pdfContainer.style.display = 'block';

  // Hide main content, print, restore
  var modView = document.getElementById('view-module');
  modView.style.display = 'none';
  window.print();
  modView.style.display = 'block';
  document.body.removeChild(pdfContainer);
}

// ─────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────
var now=new Date();
document.getElementById('today-date').textContent=DAYS_FULL[now.getDay()]+', '+MONTHS_FULL[now.getMonth()]+' '+now.getDate()+', '+now.getFullYear();
renderOverview();
</script>
