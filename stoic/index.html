<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stoic Girl Workbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f3ecd8;--surface:#fff;--sidebar:#f8f1dd;--sidebar-line:#e6dec5;
  --ink:#1a1612;--muted:#7a7468;--line:#ececec;--warm:#faf6ec;
  --accent:#c9b6ee;--accent-deep:#b099e0;--accent-soft:#ede5fb;
}
html,body{background:var(--bg);font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}

/* TOPBAR */
.topbar{background:var(--sidebar);border-bottom:1px solid var(--sidebar-line);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:300;}
.topbar-left{display:flex;align-items:center;gap:14px;}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1.5px solid #d9d2bd;border-radius:20px;font-size:12px;color:var(--muted);cursor:pointer;background:transparent;font-family:inherit;text-decoration:none;transition:all .15s;}
.back-btn:hover{border-color:var(--accent-deep);color:var(--ink);}
.topbar-title{font-family:'Fraunces',serif;font-size:22px;font-weight:600;letter-spacing:-0.4px;}
.topbar-date{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:500;}

/* DAILY TOOLKIT BAR */
.toolkit-bar{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 32px;display:flex;align-items:center;gap:8px;position:sticky;top:57px;z-index:200;}
.toolkit-label{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;flex-shrink:0;margin-right:4px;}
.toolkit-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border:1.5px solid var(--line);border-radius:14px;font-family:inherit;font-size:11.5px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--muted);transition:all .15s;white-space:nowrap;}
.toolkit-btn:hover{border-color:var(--accent-deep);color:var(--ink);background:var(--accent-soft);}

/* VIEWS */
.view{display:none;}.view.active{display:block;}

/* OVERVIEW */
.overview{max-width:1020px;margin:0 auto;padding:28px 24px 60px;}

/* MOOD ROUTER */
.mood-router{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 26px;margin-bottom:24px;}
.mood-router-title{font-family:'Fraunces',serif;font-size:20px;font-weight:600;letter-spacing:-.3px;margin-bottom:5px;}
.mood-router-sub{font-size:12px;color:var(--muted);margin-bottom:16px;}
.mood-chips{display:flex;flex-wrap:wrap;gap:8px;}
.mood-chip{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border:1.5px solid var(--line);border-radius:20px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;background:var(--warm);color:var(--ink);transition:all .18s;}
.mood-chip:hover{border-color:var(--accent-deep);background:var(--accent-soft);transform:translateY(-1px);}

/* JUMP BACK IN */
.jump-banner{background:var(--accent-soft);border:1.5px solid var(--accent);border-radius:16px;padding:14px 20px;margin-bottom:22px;display:flex;align-items:center;gap:14px;}
.jump-icon{font-size:20px;flex-shrink:0;}
.jump-text{flex:1;}
.jump-label{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:2px;}
.jump-title{font-family:'Fraunces',serif;font-size:16px;font-weight:600;color:var(--accent-deep);letter-spacing:-.2px;}
.jump-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.jump-btn{padding:9px 18px;background:var(--ink);color:#fff;border:none;border-radius:16px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;transition:all .15s;}
.jump-btn:hover{background:#2a2218;transform:translateY(-1px);}

/* OVERVIEW HEADER */
.ov-header{text-align:center;margin-bottom:28px;}
.ov-eyebrow{font-size:9.5px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px;}
.ov-title{font-family:'Fraunces',serif;font-size:2.8rem;font-weight:600;letter-spacing:-1px;line-height:1.1;}
.ov-title em{font-style:italic;color:var(--accent-deep);}
.ov-quote{font-family:'Fraunces',serif;font-size:14px;font-style:italic;color:var(--muted);margin-top:10px;}

/* MODULE GRID */
.module-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.module-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 18px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.module-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px;}
.module-card:nth-child(1)::before{background:#f2c4ce;}
.module-card:nth-child(2)::before{background:#d4b8e0;}
.module-card:nth-child(3)::before{background:#b8cfb0;}
.module-card:nth-child(4)::before{background:#e8a0b0;}
.module-card:nth-child(5)::before{background:#c9b6ee;}
.module-card:nth-child(6)::before{background:#b8d4f0;}
.module-card:nth-child(7)::before{background:#f7d9b0;}
.module-card:nth-child(8)::before{background:#a8d8d0;}
.module-card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.1);border-color:#d9d2bd;}
.mc-num{font-size:9.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px;}
.mc-title{font-family:'Fraunces',serif;font-size:16px;font-weight:600;line-height:1.3;margin-bottom:3px;letter-spacing:-.2px;}
.mc-sub{font-size:11px;color:var(--muted);font-style:italic;margin-bottom:10px;}
.mc-ex-count{font-size:10.5px;color:var(--accent-deep);font-weight:600;margin-bottom:7px;}
.mc-prog{height:4px;background:var(--line);border-radius:3px;overflow:hidden;}
.mc-prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent-deep));}
.mc-entries{font-size:10px;color:var(--muted);margin-top:4px;}

/* MODULE VIEW */
.mod-view{max-width:860px;margin:0 auto;padding:0 24px 60px;}
.mod-nav{display:flex;align-items:center;gap:12px;padding:18px 0 20px;}
.mod-back{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border:1.5px solid var(--line);border-radius:20px;font-size:12px;color:var(--muted);cursor:pointer;background:var(--surface);font-family:inherit;transition:all .15s;}
.mod-back:hover{border-color:var(--accent-deep);color:var(--ink);}
.mod-badge{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700;}
.mod-heading{font-family:'Fraunces',serif;font-size:20px;font-weight:600;flex:1;letter-spacing:-.3px;}
.pdf-btn{padding:7px 14px;border:1.5px solid var(--line);border-radius:16px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;background:transparent;font-family:inherit;transition:all .15s;}
.pdf-btn:hover{border-color:var(--accent-deep);color:var(--ink);}

/* Module intro */
.mod-intro{background:var(--accent-soft);border:1px solid var(--accent);border-radius:16px;padding:16px 20px;margin-bottom:22px;}
.mod-intro-quote{font-family:'Fraunces',serif;font-size:15px;font-style:italic;color:var(--accent-deep);margin-bottom:7px;}
.mod-intro-desc{font-size:12.5px;color:var(--muted);line-height:1.7;}

/* EXERCISE TABS */
.ex-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px;}
.ex-tab{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border:1.5px solid var(--line);border-radius:16px;font-family:inherit;font-size:11.5px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--muted);transition:all .15s;}
.ex-tab:hover{border-color:var(--accent-deep);color:var(--ink);}
.ex-tab.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.ex-tab.has-entries{border-color:#a8d8d0;color:#1a4a44;}
.ex-tab.active.has-entries{background:var(--ink);border-color:var(--ink);color:#fff;}
.ex-recur-icon{font-size:9px;opacity:.7;}

/* EXERCISE PAGE */
.ex-page{display:none;}.ex-page.active{display:block;}
.ex-hdr{margin-bottom:20px;}
.ex-eyebrow{font-size:9.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px;}
.ex-title{font-family:'Fraunces',serif;font-size:22px;font-weight:600;letter-spacing:-.3px;}
.ex-purpose{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:6px;}
.ex-meta{display:flex;align-items:center;gap:8px;margin-top:8px;}
.ex-time{display:inline-flex;align-items:center;gap:4px;background:var(--warm);border:1px solid var(--line);border-radius:10px;padding:4px 11px;font-size:11px;color:var(--muted);}
.ex-recur-badge{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:4px 11px;font-size:11px;color:var(--accent-deep);font-weight:600;}

/* ENTRIES */
.entries-sec{margin-bottom:22px;}
.entries-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.entries-lbl{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;}
.new-btn{padding:8px 18px;border:none;border-radius:20px;background:var(--ink);color:#fff;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;}
.new-btn:hover{background:#2a2218;transform:translateY(-1px);}
.entry-list{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;}
.entry-chip{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:all .15s;}
.entry-chip:hover{border-color:#d9d2bd;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.entry-chip.active-entry{background:var(--accent-soft);border-color:var(--accent);}
.entry-date{font-family:'Fraunces',serif;font-size:14px;font-weight:600;color:var(--accent-deep);white-space:nowrap;}
.entry-preview{font-size:11.5px;color:var(--muted);font-style:italic;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.entry-del{background:none;border:none;font-size:11px;color:#ccc;cursor:pointer;padding:2px 5px;transition:color .15s;flex-shrink:0;}
.entry-del:hover{color:#a0304a;}
.chip-edit-btn{padding:4px 10px;border:1.5px solid var(--line);border-radius:9px;font-family:inherit;font-size:11px;cursor:pointer;background:transparent;color:var(--muted);transition:all .15s;flex-shrink:0;}
.chip-edit-btn:hover{border-color:var(--accent-deep);color:var(--ink);}
.empty-state{text-align:center;padding:28px 20px;color:var(--muted);background:var(--warm);border:1.5px dashed var(--line);border-radius:14px;}
.empty-icon{font-size:1.8rem;margin-bottom:7px;}
.empty-text{font-family:'Fraunces',serif;font-size:15px;font-style:italic;}

/* ENTRY FORM */
.entry-form{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 28px;}
.entry-form-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line);}
.entry-form-date{font-family:'Fraunces',serif;font-size:15px;font-style:italic;color:var(--accent-deep);}
.saved-indicator{font-size:11px;color:#1a4a44;font-weight:600;}
.complete-btn{padding:7px 16px;border:none;border-radius:14px;background:#d8eee8;color:#1a4a44;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;border:1px solid #a8d8d0;}
.complete-btn:hover{background:#a8d8d0;}

/* FORM FIELDS */
.f-group{margin-bottom:16px;}
.f-label{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:5px;display:block;}
.f-sub{font-size:11.5px;color:var(--muted);font-style:italic;margin-bottom:8px;line-height:1.5;}
.write{background:var(--warm);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:13px;line-height:1.75;color:var(--ink);outline:none;width:100%;resize:none;overflow:hidden;display:block;transition:border .15s;}
.write:focus{border-color:var(--accent-deep);}
.write::placeholder{color:#b8b0a8;font-style:italic;}
.write.sh{min-height:54px;}
.write.ta{min-height:110px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
hr.r{border:none;border-top:1px solid var(--line);margin:20px 0;}
.sec-lbl{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:14px 0 4px;display:block;}
.sec-sub{font-size:11.5px;color:var(--muted);font-style:italic;margin-bottom:10px;line-height:1.5;}

/* COLORED BOXES */
.box{border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.box-pink{background:#fce8ef;border:1.5px solid #f2c4ce;}
.box-purple{background:#f0e0f0;border:1.5px solid var(--accent);}
.box-green{background:#e8f5e9;border:1.5px solid #b8cfb0;}
.box-amber{background:#fff8e1;border:1.5px solid #e0c870;}
.box-blue{background:#e3f0ff;border:1.5px solid #b8d4f0;}
.box-teal{background:#e0f4f2;border:1.5px solid #a8d8d0;}
.box-title{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:7px;color:var(--ink);}

/* DISTORTIONS */
.distortion-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px;}
.distortion-item{display:flex;align-items:flex-start;gap:8px;padding:7px 10px;background:var(--warm);border:1.5px solid var(--line);border-radius:10px;cursor:pointer;transition:all .15s;}
.distortion-item:hover{border-color:var(--accent-deep);}
.distortion-item.checked{background:var(--accent-soft);border-color:var(--accent);}
.di-check{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--line);flex-shrink:0;margin-top:1px;transition:all .15s;}
.distortion-item.checked .di-check{background:var(--accent-deep);border-color:var(--accent-deep);}
.di-label{font-size:12px;color:var(--ink);line-height:1.4;}

/* WEATHER TABLE */
.weather-table{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:12px;}
.weather-table th{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);}
.weather-table td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
.weather-table tr:last-child td{border-bottom:none;}
.weather-day{font-weight:700;font-size:11.5px;width:36px;color:var(--muted);}
.weather-cell{width:100%;border:none;background:transparent;font-family:inherit;font-size:12px;outline:none;resize:none;overflow:hidden;min-height:24px;color:var(--ink);line-height:1.4;}
.weather-cell::placeholder{color:#b8b0a8;}

/* ORNAMENT */
.ornament{text-align:center;color:var(--accent);font-size:1rem;letter-spacing:10px;margin:24px 0 0;}

@media(max-width:700px){
  .module-grid{grid-template-columns:1fr 1fr;}
  .two-col,.three-col{grid-template-columns:1fr;}
  .topbar,.toolkit-bar{padding:14px 16px;}
  .overview,.mod-view{padding-left:14px;padding-right:14px;}
  .mood-chips{gap:6px;}
}
@media print{
  .topbar,.toolkit-bar,.mod-nav,.ex-tabs,.new-btn,.entry-del,.pdf-btn,.chip-edit-btn,.complete-btn{display:none!important;}
  body{background:white!important;}
}
</style>
</head>

      <div class="ov-quote">"Harness inner strength, embrace outer peace."</div>
    </div>

    <div class="module-grid" id="module-grid"></div>
  </div>
</div>

<!-- MODULE VIEW -->
<div class="view" id="view-module">

        All Modules

    </div>
    <div class="mod-intro" id="mod-intro"></div>
    <div class="ex-tabs" id="ex-tabs"></div>
    <div id="ex-pages"></div>
  </div>
</div>

{num:'02',title:'The Dichotomy of Control',sub:'But Make It Relatable',
 quote:'"Control your controllables, release the rest."',
 desc:'Most suffering comes from trying to control things that were never ours to control. These exercises retrain your brain from "I need to control this" to "where can I best invest my energy?"',
 exercises:[
  {id:'circle_control',label:'Ex 2.1',title:'Circle of Control Diagram',recurring:false,
   purpose:'Visually categorize your current worries to see clearly what deserves your energy and what does not.',time:'10–15 minutes',
   fields:[
    {t:'write',id:'brain_dump',label:'Brain Dump — What\'s currently on your mind?',sub:'List everything that\'s been worrying, frustrating, or occupying you lately.',ph:'Everything taking up space: the relationship thing, the work situation, the what-ifs, the regrets, the fears...',ta:true},
    {t:'hr'},
    {t:'sec',label:'Now sort each item into its circle.'},
    {t:'three',fields:[{id:'full_control',label:'🟢 Full Control',sub:'Your thoughts, responses, actions, effort, words',ph:'What from your brain dump sits here?'},{id:'influence',label:'🟡 Influence',sub:'Relationships through your behavior, outcomes through prep',ph:'What can you affect but not fully control?'},{id:'no_control',label:'🔴 No Control',sub:'Other people\'s choices, the past, future, timing',ph:'What needs to be released?'}]},
    {t:'hr'},
    {t:'two',fields:[{id:'energy_going',label:'What do you notice about where most of your mental energy has been going?',ph:''},{id:'redirect_energy',label:'What would change if you redirected that energy to your "Full Control" circle?',ph:''}]},
   ]},
  {id:'control_inventory',label:'Ex 2.2',title:'Control Inventory Journal',recurring:false,
   purpose:'Transform a specific frustrating situation into an empowered action plan by identifying what you can actually do next.',time:'15–20 minutes',
   fields:[
    {t:'three',fields:[{id:'what_happened',label:'What Happened',sub:'Describe the situation objectively.',ph:'What would a neutral observer have seen?'},{id:'what_wanted',label:'What I Wanted to Happen',sub:'What were you hoping for or expecting instead?',ph:'What outcome were you attached to?'},{id:'what_can_do',label:'What I Can Do Next',sub:'Given reality, what actions are available now?',ph:'Focus only on your choices and responses moving forward.'}]},
    {t:'hr'},
    {t:'two',fields:[{id:'outside_control',label:'What parts were genuinely outside your control?',ph:''},{id:'could_influence',label:'What parts could you influence through your actions/responses?',ph:''}]},
    {t:'write',id:'one_action',label:'One specific action you will take this week:',ph:'',sh:true},
   ]},
  {id:'decision_framework',label:'Ex 2.3',title:'Decision-Making Framework',recurring:false,
   purpose:'Make clearer decisions by filtering choices through what you can control and your core values rather than anxiety and fear.',time:'15–20 minutes',
   fields:[
    {t:'write',id:'decision',label:'Current Decision — What decision are you currently facing?',sub:'It can be big OR small.',ph:'',sh:true},
    {t:'hr'},
    {t:'two',fields:[{id:'can_control',label:'What aspects of this situation can I actually control?',sub:'Focus on your actions, responses, and choices.',ph:''},{id:'cannot_control',label:'What aspects are completely outside my control?',sub:'Other people\'s reactions, timing, external circumstances...',ph:''}]},
    {t:'two',fields:[{id:'from_values',label:'If I was acting from my values rather than my fears, what would I choose?',ph:''},{id:'can_handle',label:'Can I handle the uncertainty and potential challenges of either path?',ph:''}]},
    {t:'hr'},
    {t:'three',fields:[{id:'value1',label:'Value 1',ph:''},{id:'value2',label:'Value 2',ph:''},{id:'value3',label:'Value 3',ph:''}]},
    {t:'hr'},
    {t:'write',id:'aligned_choice',label:'Your Aligned Choice — What feels like the most values-aligned decision?',ph:''},
    {t:'write',id:'acceptance',label:'The Acceptance Practice — Complete this statement:',sub:'"I\'m choosing [your decision] and I accept that I cannot control [specific outcome/response]."',ph:'I\'m choosing... and I accept that I cannot control...',sh:true},
   ]},
  {id:'energy_audit',label:'Ex 2.4',title:'Energy Audit',recurring:false,
   purpose:'Identify exactly where your mental energy is going and consciously redirect it toward what actually serves your peace and goals.',time:'15–20 minutes',
   fields:[
    {t:'two',fields:[{id:'drain_relationship',label:'Relationship Concerns',sub:'Overthinking texts, replaying arguments, managing others\' emotions...',ph:'Which ones hit closest to home?'},{id:'drain_future',label:'Future Anxiety',sub:'Planning for worst-case scenarios, catastrophizing...',ph:''}]},
    {t:'two',fields:[{id:'drain_past',label:'Past Rumination',sub:'Regretting what you said/did, replaying embarrassing moments...',ph:''},{id:'drain_external',label:'External Control Attempts',sub:'Trying to influence things through worry, needing validation...',ph:''}]},
    {t:'hr'},
    {t:'two',fields:[{id:'biggest_drain',label:'Biggest Energy Drain — What\'s been consuming the most mental energy?',ph:'Choose your top 1-2.'},{id:'redirect_plan',label:'The Redirect Plan — When I catch myself going down this path, I will instead:',ph:'Be specific. What will you do instead?'}]},
   ]},
 ]},
{num:'03',title:'The Four Virtues',sub:'Character Building, Soft Girl Edition',
 quote:'"Be the person your younger self needed."',
 desc:'The four virtues — Wisdom, Courage, Justice, Temperance — are your inner GPS with 2,000 years of field testing. These exercises make them personal and practical in your life.',
 exercises:[
  {id:'perspective_shifter',label:'Ex 3.1',title:'Perspective Shifter (Wisdom)',recurring:false,
   purpose:'Break out of limited thinking patterns by exploring challenges from multiple viewpoints.',time:'15–20 minutes',
   fields:[
    {t:'write',id:'challenge',label:'Current Challenge — What situation or decision are you currently struggling with?',ph:''},
    {t:'two',fields:[{id:'initial_reaction',label:'Your first instinct / immediate reaction',ph:''},{id:'emotions_present',label:'What emotions are coming up for you around this?',ph:''}]},
    {t:'hr'},
    {t:'two',fields:[{id:'time_lens',label:'The Time Lens',sub:'How might you view this in 5 years? What would your 80-year-old self advise?',ph:''},{id:'assumption_detective',label:'The Assumption Detective',sub:'What am I assuming that might not be true? What information am I missing?',ph:''}]},
    {t:'two',fields:[{id:'compassionate_observer',label:'The Compassionate Observer',sub:'If my best friend was facing this, what would I tell them?',ph:''},{id:'learning_lens',label:'The Learning Lens',sub:'What is this situation trying to teach me?',ph:''}]},
    {t:'hr'},
    {t:'two',fields:[{id:'wiser_perspective',label:'After considering these viewpoints, how do you see the situation now?',ph:''},{id:'wisest_next_step',label:'What feels like the wisest next step?',ph:''}]},
   ]},
  {id:'comfort_zone',label:'Ex 3.2',title:'Comfort Zone Challenge (Courage)',recurring:false,
   purpose:'Identify where fear is keeping you small and create a manageable plan for taking brave action.',time:'15–20 minutes',
   fields:[
    {t:'write',id:'avoidance',label:'Avoidance Inventory — What have you been avoiding or putting off due to fear or discomfort?',ph:'List whatever comes to mind — conversations, decisions, attempts, vulnerability...',ta:true},
    {t:'write',id:'chosen_challenge',label:'Choose Your Challenge — Pick one item that feels important but manageable. What is it?',ph:'',sh:true},
    {t:'hr'},
    {t:'two',fields:[{id:'specific_fears',label:'Name Your Fears — What specifically are you afraid might happen?',ph:''},{id:'worst_realistic',label:'Reality Check — What\'s the worst realistic outcome if you take this action?',ph:''}]},
    {t:'write',id:'values_connection',label:'Values Connection — Why does this action matter to you?',ph:'What would it mean about you as a person if you took this brave step?'},
    {t:'hr'},
    {t:'three',fields:[{id:'step1',label:'Step 1 — Easiest',sub:'The smallest possible step.',ph:''},{id:'step2',label:'Step 2 — Medium',sub:'The next slightly braver action.',ph:''},{id:'step3',label:'Step 3 — Full Action',sub:'What taking complete action looks like.',ph:''}]},
    {t:'write',id:'courage_when',label:'When specifically will you take Step 1?',ph:'I will ___ on ___ at ___.',sh:true},
   ]},
  {id:'boundary_blueprint',label:'Ex 3.3',title:'Boundary Blueprint (Justice)',recurring:false,

   fields:[
    {t:'write',id:'energy_balance',label:'Rate your key relationships — who gives you energy vs. drains it?',ph:'Partner: energizing / neutral / draining\nFamily: ...\nFriend 1: ...',ta:true},
    {t:'hr'},
    {t:'two',fields:[{id:'over_give',label:'Where do I consistently over-give?',ph:''},{id:'afraid_of',label:'What am I afraid will happen if I give less or ask for more?',ph:''}]},
    {t:'two',fields:[{id:'under_receive',label:'Where am I not getting my needs met?',ph:''},{id:'need_more',label:'What do I need more of in my relationships?',ph:''}]},
    {t:'write',id:'self_justice',label:'Justice to Self Check — How do I treat myself compared to how I treat my friends?',ph:''},
    {t:'hr'},
    {t:'two',fields:[{id:'which_relationship',label:'Which relationship needs a boundary adjustment?',ph:''},{id:'say_no',label:'What will you say no to?',ph:''}]},
    {t:'two',fields:[{id:'how_communicate',label:'How will you communicate this change?',ph:'"When ___, I feel ___. I need ___."'},{id:'say_yes',label:'What will you say yes to?',ph:''}]},
   ]},
  {id:'balance_check',label:'Ex 3.4',title:'Balance Check (Temperance)',recurring:false,

    {t:'two',fields:[{id:'mantra_justice',label:'My Justice mantra:',ph:'e.g. "I deserve what I give to others."'},{id:'mantra_temp',label:'My Temperance mantra:',ph:'e.g. "Enough is enough."'}]},

{num:'04',title:'Emotional Regulation',sub:'For Sensitive Souls',
 quote:'"Feel deeply, respond wisely."',
 desc:'You don\'t have to choose between feeling deeply and thinking clearly. Between stimulus and response, there is a space. These exercises help you find that space and make it bigger.',
 exercises:[
  {id:'gap_pause',label:'Ex 4.1',title:'The Gap Pause Practice',recurring:true,
   purpose:'Learn to identify and expand the space between emotional triggers and your responses, building the skill of conscious choice over automatic reaction.',time:'10–15 min daily + 5 min reflection',
   fields:[
    {t:'two',fields:[{id:'regret_moment',label:'Think of a time this week when you reacted emotionally in a way you later regretted. What happened?',ph:''},{id:'trigger_was',label:'What was the trigger that set you off?',ph:''}]},
    {t:'two',fields:[{id:'how_quickly',label:'How quickly did you react?',ph:'Instantly / Seconds / A minute / Had time to think'},{id:'different_pause',label:'What would you have done differently if you\'d had more time to pause?',ph:''}]},
    {t:'hr'},
    {t:'write',id:'technique_choice',label:'Which pause technique will you practice this week?',sub:'4-7-8 Breathing · Box Breathing · 5-4-3-2-1 Grounding · Body Scan · Count to 10',ph:'I choose ___ because it works for me when...'},
    {t:'hr'},
    {t:'weather',id:'gap_log',days:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],cols:['Trigger','Intensity (1-10)','Pause Used','Chosen Response','How It Felt']},
    {t:'hr'},
    {t:'two',fields:[{id:'trigger_patterns',label:'What patterns do you notice in your triggers?',ph:''},{id:'pause_feeling',label:'How did it feel to choose your response rather than react automatically?',ph:''}]},
   ]},
  {id:'wise_mind',label:'Ex 4.2',title:'Wise Mind Worksheet',recurring:false,
   purpose:'Learn to integrate emotional wisdom and logical thinking to make balanced decisions that honor both your feelings and your reasoning.',time:'15–20 minutes',
   fields:[
    {t:'write',id:'wise_challenge',label:'Current Challenge or Decision',ph:'What situation could benefit from a Wise Mind perspective?'},
    {t:'hr'},
    {t:'box-write',color:'pink',title:'Emotion Mind — What Your Feelings Are Telling You',fields:[{id:'emotions_present_wm',label:'What emotions are present?',ph:''},{id:'if_followed_emotions',label:'If you followed your emotions completely, what would you do?',ph:''},{id:'valid_info',label:'What valid information are these emotions giving you?',ph:''}]},
    {t:'box-write',color:'blue',title:'Rational Mind — What Logic and Facts Suggest',fields:[{id:'objective_facts',label:'What are the objective facts of this situation?',ph:''},{id:'pure_logic',label:'If you removed all emotions, what would pure logic suggest?',ph:''},{id:'friend_advice_wm',label:'What would you advise a friend in this exact situation?',ph:''}]},
    {t:'box-write',color:'teal',title:'Finding Your Wise Mind — Integration',fields:[{id:'both_agree',label:'What do both your emotions AND logic agree on?',ph:''},{id:'balanced_response',label:'What would the most balanced response look like?',ph:''},{id:'honors_both',label:'What choice honors both your feelings and your wisdom?',ph:''}]},
    {t:'hr'},
    {t:'two',fields:[{id:'wise_decision',label:'Your Wise Mind Decision — What feels like the most balanced path forward?',ph:''},{id:'wise_step',label:'What\'s one small step you can take this week?',ph:''}]},
   ]},
  {id:'distress_menu',label:'Ex 4.3',title:'Distress Tolerance Menu',recurring:false,
   purpose:'Create a personalized toolkit of healthy strategies for managing intense emotions without making the situation worse.',time:'20–25 minutes',
   fields:[
    {t:'two',fields:[{id:'helpful_current',label:'Helpful strategies I already use:',ph:'Talk to a friend, exercise, journal, breathe, hot shower...'},{id:'unhelpful_current',label:'Unhelpful strategies I reach for (no judgment):',ph:'Scroll social media, isolate, send impulsive texts...'}]},
    {t:'hr'},
    {t:'box-write',color:'blue',title:'♦ DISTRACT — Healthy ways to shift focus temporarily',fields:[{id:'distract_activities',label:'Activities (what you\'ll do):',ph:'Clean, puzzle, funny videos, creative work, exercise, call a friend...'},{id:'distract_others',label:'Contributing to Others:',ph:'Encouraging text, small favor, help with household tasks...'}]},
    {t:'box-write',color:'pink',title:'♦ SOOTHE — Ways to comfort yourself with kindness',fields:[{id:'soothe_physical',label:'Physical Soothing:',ph:'Warm bath, soft clothes, warm tea, pleasant scents...'},{id:'soothe_emotional',label:'Emotional Soothing:',ph:'Self-compassion phrases, calming music, imagining a safe place...'}]},
    {t:'box-write',color:'green',title:'♦ GROUND — Ways to reconnect with the present moment',fields:[{id:'ground_sensory',label:'Sensory Grounding:',ph:'5-4-3-2-1, cold water on face, breath counting, body scan...'},{id:'ground_mental',label:'Mental Grounding:',ph:'Name categories, plan something positive tomorrow...'}]},
    {t:'hr'},
    {t:'write',id:'redirect_from',label:'The unhelpful strategy I most often reach for vs. what I\'ll try instead:',ph:'When I\'m tempted to ___, I will try ___ instead.',sh:true},

  {id:'weather_report',label:'Ex 4.4',title:'Daily Weather Report',recurring:true,

 ]},
{num:'05',title:'Relationships & Boundaries',sub:'The Hardest Part',
 quote:'"Attachment creates suffering, love creates freedom."',
 desc:'Relationships are where all inner work gets tested. These exercises help you understand your patterns, set boundaries with clarity, and love without losing yourself.',
 exercises:[
  {id:'boundary_clarity',label:'Ex 5.1',title:'Boundary Clarification',recurring:false,
   purpose:'Define your limits, needs, and non-negotiables across different relationship types to build clarity and confidence.',time:'20–25 minutes',
   fields:[
    {t:'two',fields:[{id:'b_consistently_cross',label:'Where do people consistently cross a line with you?',ph:'Think about recurring situations where you feel drained, resentful, or violated...'},{id:'b_currently_allow',label:'What behaviors are you currently allowing that you don\'t actually want to?',ph:'What have you been tolerating out of fear, guilt, or habit?'}]},
    {t:'two',fields:[{id:'b_afraid',label:'What are you afraid will happen if you enforce a boundary?',ph:'Rejection? Conflict? Losing the relationship?'},{id:'b_self_boundary',label:'What boundary do you need to set with YOURSELF?',ph:'An internal limit — a thought pattern, a habit, how you spend time...'}]},
    {t:'hr'},

    {t:'write',id:'b_script2',label:'For a situation where you under-receive:',sub:'"I need [specific thing] to feel supported. It would mean a lot to me if you could ___."',ph:'Write your specific version here...'},
    {t:'hr'},
    {t:'write',id:'b_one_action',label:'One boundary I will communicate or enforce this week:',ph:'What, with whom, and how?',sh:true},
   ]},
  {id:'attachment',label:'Ex 5.2',title:'Attachment Style Reflection',recurring:false,
   purpose:'Reflect on your relationship patterns and triggers to bring unconscious dynamics into awareness so you can choose more intentional responses.',time:'20–25 minutes',
   fields:[
    {t:'write',id:'att_distance',label:'How do you tend to behave when you feel close to someone and then sense distance or disconnection?',sub:'Do you chase? Pull away? Get anxious? Shut down?',ph:'',ta:true},
    {t:'two',fields:[{id:'att_fear',label:'What is your deepest fear in close relationships?',ph:'Abandonment? Being too much? Being trapped? Not being chosen?'},{id:'att_childhood',label:'How did the important people in your early life respond to your needs and emotions?',ph:'Were your needs generally met? Were you soothed, dismissed, inconsistently responded to?'}]},
    {t:'hr'},
    {t:'two',fields:[{id:'att_gives_energy',label:'What does a relationship look and feel like when it\'s going well for you?',ph:''},{id:'att_drains',label:'What patterns do you notice in relationships that drain you?',ph:''}]},
    {t:'write',id:'att_secure',label:'What does a SECURE relationship feel like to you — even if you\'ve only glimpsed it?',ph:'What would it feel like to give and receive love without fear driving the interaction?'},
    {t:'hr'},
    {t:'write',id:'att_practice',label:'One thing you can practice this week to move toward more security in your relationships:',ph:'',sh:true},
   ]},
  {id:'hard_conversations',label:'Ex 5.3',title:'Hard Conversations',recurring:false,
   purpose:'Prepare for difficult but necessary conversations using assertive communication to build courage and communication skills.',time:'20–25 minutes',
   fields:[
    {t:'write',id:'hc_what',label:'What conversation do you need to have that you\'ve been avoiding?',ph:'Who is it with? What does it need to address?',sh:true},
    {t:'two',fields:[{id:'hc_why_avoiding',label:'Why have you been avoiding it?',ph:'Fear of their reaction? Not knowing what to say?'},{id:'hc_cost',label:'What is the cost of not having it?',ph:'To the relationship, to yourself, to your self-respect?'}]},
    {t:'hr'},
    {t:'two',fields:[{id:'hc_my_truth',label:'What is the truth I need to express?',sub:'Strip away the fear-story. What is actually true for you?',ph:''},{id:'hc_need',label:'What do I need from this conversation?',sub:'Understanding? A change? To be heard?',ph:''}]},
    {t:'write',id:'hc_their_world',label:'What might be going on for the other person?',sub:'Can you hold their perspective with some compassion, even if you\'re hurt?',ph:''},

// ── STORAGE ──
function entryKey(mi,ei){ return SK+'_m'+mi+'_e_'+ei; }
function getEntries(mi,ei){ var r=localStorage.getItem(entryKey(mi,ei));try{return r?JSON.parse(r):[]}catch(e){return[];} }
function saveEntries(mi,ei,arr){ localStorage.setItem(entryKey(mi,ei),JSON.stringify(arr)); }
function todayLabel(){ var d=new Date();return DAYS_FULL[d.getDay()].slice(0,3)+' '+MONTHS_S[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear(); }

// ── LAST VISITED tracking ──
function saveLastVisited(mi,exId){ localStorage.setItem(SK+'_last',JSON.stringify({mi:mi,exId:exId,ts:Date.now()})); }
function loadLastVisited(){ var r=localStorage.getItem(SK+'_last');try{return r?JSON.parse(r):null;}catch(e){return null;} }

// ── JUMP BANNER ──
function renderJumpBanner(){
  var lv=loadLastVisited();
  if(!lv)return;
  var m=MODULES[lv.mi];if(!m)return;
  var ex=m.exercises.find(function(e){return e.id===lv.exId;});if(!ex)return;
  var banner=document.getElementById('jump-banner');
  document.getElementById('jump-title').textContent=ex.title;
  document.getElementById('jump-sub').textContent='Module '+m.num+' — '+m.title;
  document.getElementById('jump-btn').onclick=function(){routeToExercise(lv.mi,lv.exId);};
  banner.style.display='flex';
}

// ── MOOD ROUTER ──
function routeToExercise(mi,exId){
  var m=MODULES[mi];if(!m)return;
  var ei=m.exercises.findIndex(function(e){return e.id===exId;});
  if(ei<0)return;
  openModule(mi,ei);
}

function openDailyTool(mi,exId){ routeToExercise(mi,exId); }

// ── PROGRESS (fixed: unique exercises with entries / total) ──
function modulePct(mi){
  var m=MODULES[mi];
  var withEntries=m.exercises.filter(function(ex){ return getEntries(mi,ex.id).length>0; }).length;
  return Math.round(withEntries/m.exercises.length*100);
}

// ── OVERVIEW ──
function renderOverview(){
  var g=document.getElementById('module-grid');g.innerHTML='';
  MODULES.forEach(function(m,mi){
    var pct=modulePct(mi);
    var totalEntries=m.exercises.reduce(function(s,ex){return s+getEntries(mi,ex.id).length;},0);
    var tile=document.createElement('div');tile.className='module-card';
    tile.innerHTML=
      '<div class="mc-num">Module '+m.num+'</div>'+
      '<div class="mc-title">'+m.title+'</div>'+
      '<div class="mc-sub">'+m.sub+'</div>'+
      '<div class="mc-ex-count">'+m.exercises.length+' exercises</div>'+
      '<div class="mc-prog"><div class="mc-prog-fill" style="width:'+pct+'%"></div></div>'+
      '<div class="mc-entries">'+(totalEntries>0?totalEntries+' entr'+(totalEntries===1?'y':'ies')+' saved':'No entries yet')+'</div>';
    tile.onclick=(function(i){return function(){openModule(i,0);};})(mi);
    g.appendChild(tile);
  });
  renderJumpBanner();
}

// ── OPEN MODULE ──
function openModule(mi, ei_start){
  activeModIdx=mi;
  activeExIdx=typeof ei_start==='number'?ei_start:0;
  activeEntryId=null;
  var m=MODULES[mi];
  document.getElementById('mod-badge').textContent='Module '+m.num;
  document.getElementById('mod-heading').textContent=m.title+' — '+m.sub;
  document.getElementById('mod-intro').innerHTML=
    '<div class="mod-intro-quote">'+m.quote+'</div>'+
    '<div class="mod-intro-desc">'+m.desc+'</div>';
  buildExTabs(mi);
  renderExPage(mi,activeExIdx);
  document.getElementById('view-overview').classList.remove('active');
  document.getElementById('view-module').classList.add('active');
}

function goOverview(){
  document.getElementById('view-module').classList.remove('active');
  document.getElementById('view-overview').classList.add('active');
  renderOverview();
}

// ── EX TABS ──
function buildExTabs(mi){
  var m=MODULES[mi];
  var c=document.getElementById('ex-tabs');c.innerHTML='';
  m.exercises.forEach(function(ex,ei){
    var entries=getEntries(mi,ex.id);
    var btn=document.createElement('button');
    btn.className='ex-tab'+(ei===activeExIdx?' active':'')+(entries.length?' has-entries':'');
    btn.id='extab-'+ei;
    var recurHtml=ex.recurring?'<span class="ex-recur-icon">↻</span>':'';
    btn.innerHTML=ex.label+recurHtml+(entries.length?' ('+entries.length+')':'');
    btn.title=ex.title+(ex.recurring?' — Recurring practice':'');
    btn.onclick=(function(i){return function(){
      document.querySelectorAll('.ex-tab').forEach(function(b){b.classList.remove('active');});
      document.getElementById('extab-'+i).classList.add('active');
      activeExIdx=i;activeEntryId=null;
      renderExPage(mi,i);
    };})(ei);
    c.appendChild(btn);
  });
}

// ── RENDER EXERCISE PAGE ──
function renderExPage(mi,ei){
  activeExIdx=ei;
  var ex=MODULES[mi].exercises[ei];
  var entries=getEntries(mi,ex.id);
  var c=document.getElementById('ex-pages');c.innerHTML='';
  var page=document.createElement('div');page.className='ex-page active';

  // Header
  var hdr=document.createElement('div');hdr.className='ex-hdr';
  var recurBadge=ex.recurring?'<span class="ex-recur-badge">↻ Recurring Practice</span>':'';
  hdr.innerHTML=
    '<div class="ex-eyebrow">'+ex.label+'</div>'+
    '<div class="ex-title">'+ex.title+'</div>'+
    '<div class="ex-purpose">'+ex.purpose+'</div>'+
    '<div class="ex-meta"><span class="ex-time">⏱ '+ex.time+'</span>'+recurBadge+'</div>';
  page.appendChild(hdr);

  // Entries
  var sec=document.createElement('div');sec.className='entries-sec';
  var hd=document.createElement('div');hd.className='entries-hdr';
  var lbl=document.createElement('div');lbl.className='entries-lbl';
  lbl.textContent='Your Entries'+(entries.length?' ('+entries.length+')':'');
  var nb=document.createElement('button');nb.className='new-btn';nb.textContent='+ New Entry';
  nb.onclick=function(){createEntry(mi,ei);};
  hd.appendChild(lbl);hd.appendChild(nb);sec.appendChild(hd);

  if(entries.length){
    var list=document.createElement('div');list.className='entry-list';
    entries.slice().reverse().forEach(function(en){list.appendChild(buildChip(en,mi,ei));});
    sec.appendChild(list);
  } else {
    var empty=document.createElement('div');empty.className='empty-state';
    empty.innerHTML='<div class="empty-icon">✦</div><div class="empty-text">No entries yet — start your first one.</div>';
    sec.appendChild(empty);
  }
  page.appendChild(sec);

  var formWrap=document.createElement('div');formWrap.id='entry-form-area';page.appendChild(formWrap);
  c.appendChild(page);

  if(activeEntryId){
    var exists=entries.some(function(e){return e.id===activeEntryId;});
    if(exists){
      renderEntryForm(mi,ei,activeEntryId);
      document.querySelectorAll('.entry-chip').forEach(function(ch){ch.classList.toggle('active-entry',ch.dataset.id===activeEntryId);});
    } else {activeEntryId=null;}
  }
}

function buildChip(en,mi,ei){
  var exId=MODULES[mi].exercises[ei].id;
  var chip=document.createElement('div');chip.className='entry-chip';chip.dataset.id=en.id;
  var preview=getFirstText(en);
  chip.innerHTML=
    '<span class="entry-date">'+en.date+'</span>'+
    '<span class="entry-preview">'+(preview||'(no content yet)')+'</span>';

  var editBtn=document.createElement('button');editBtn.className='chip-edit-btn';editBtn.textContent='Edit';
  editBtn.onclick=function(e){
    e.stopPropagation();
    document.querySelectorAll('.entry-chip').forEach(function(c){c.classList.remove('active-entry');});
    chip.classList.add('active-entry');
    activeEntryId=en.id;
    renderEntryForm(mi,ei,en.id);
    setTimeout(function(){var f=document.getElementById('entry-form-area');if(f)f.scrollIntoView({behavior:'smooth',block:'start'});},80);
  };

  var del=document.createElement('button');del.className='entry-del';del.textContent='✕';
  del.onclick=function(e){
    e.stopPropagation();
    if(!confirm('Delete this entry?'))return;
    var arr=getEntries(mi,exId).filter(function(x){return x.id!==en.id;});
    saveEntries(mi,exId,arr);
    if(activeEntryId===en.id){activeEntryId=null;var fw=document.getElementById('entry-form-area');if(fw)fw.innerHTML='';}
    renderExPage(mi,ei);buildExTabs(mi);renderOverview();
  };

  chip.appendChild(editBtn);chip.appendChild(del);
  chip.onclick=function(e){if(e.target===editBtn||e.target===del)return;editBtn.click();};
  return chip;
}

function getFirstText(en){
  var f=en.fields||{};
  for(var k in f){if(f[k]&&typeof f[k]==='string'&&f[k].trim())return f[k].slice(0,60);}
  return '';
}

function createEntry(mi,ei){
  var exId=MODULES[mi].exercises[ei].id;
  var en={id:'e_'+Date.now(),date:todayLabel(),fields:{}};
  var arr=getEntries(mi,exId);arr.push(en);
  saveEntries(mi,exId,arr);
  activeEntryId=en.id;
  saveLastVisited(mi,exId);
  renderExPage(mi,ei);buildExTabs(mi);renderOverview();
  setTimeout(function(){var f=document.getElementById('entry-form-area');if(f)f.scrollIntoView({behavior:'smooth',block:'start'});},80);
}

// ── RENDER ENTRY FORM ──
function renderEntryForm(mi,ei,entryId){
  var exId=MODULES[mi].exercises[ei].id;
  var arr=getEntries(mi,exId);
  var en=arr.find(function(x){return x.id===entryId;});if(!en)return;
  var ex=MODULES[mi].exercises[ei];
  var wrap=document.getElementById('entry-form-area');if(!wrap)return;
  wrap.innerHTML='';
  var form=document.createElement('div');form.className='entry-form';
  var fhdr=document.createElement('div');fhdr.className='entry-form-hdr';
  var dateSpan=document.createElement('span');dateSpan.className='entry-form-date';dateSpan.textContent=en.date;
  var savedSpan=document.createElement('span');savedSpan.className='saved-indicator';savedSpan.id='saved-ind';savedSpan.textContent='✓ Auto-saved';
  var completeBtn=document.createElement('button');completeBtn.className='complete-btn';
  completeBtn.textContent='✓ Complete';
  completeBtn.onclick=function(){
    activeEntryId=null;wrap.innerHTML='';
    renderExPage(mi,ei);buildExTabs(mi);renderOverview();
  };
  fhdr.appendChild(dateSpan);fhdr.appendChild(savedSpan);fhdr.appendChild(completeBtn);
  form.appendChild(fhdr);
  buildFields(form,ex.fields,en,mi,ei);
  var orn=document.createElement('div');orn.className='ornament';orn.textContent='✦ ✿ ✦';
  form.appendChild(orn);
  wrap.appendChild(form);
}

function autoSave(mi,ei,entryId,fieldId,val){
  var exId=MODULES[mi].exercises[ei].id;
  var arr=getEntries(mi,exId);
  var en=arr.find(function(x){return x.id===entryId;});if(!en)return;
  if(!en.fields)en.fields={};
  en.fields[fieldId]=val;
  saveEntries(mi,exId,arr);
  saveLastVisited(mi,exId);
  var ind=document.getElementById('saved-ind');if(ind)ind.textContent='✓ Saved';
}

// ── BUILD FIELDS (textarea-based) ──
function buildFields(parent,fields,en,mi,ei){
  fields.forEach(function(f){
    if(f.t==='hr'){var hr=document.createElement('hr');hr.className='r';parent.appendChild(hr);}
    else if(f.t==='sec'){
      var s=document.createElement('div');
      s.innerHTML='<span class="sec-lbl">'+f.label+'</span>'+(f.sub?'<span class="sec-sub">'+f.sub+'</span>':'');
      parent.appendChild(s);
    }
    else if(f.t==='write'){parent.appendChild(makeWriteGroup(f,en,mi,ei));}
    else if(f.t==='two'){var row=document.createElement('div');row.className='two-col';f.fields.forEach(function(ff){row.appendChild(makeWriteGroup(ff,en,mi,ei));});parent.appendChild(row);}
    else if(f.t==='three'){var row=document.createElement('div');row.className='three-col';f.fields.forEach(function(ff){row.appendChild(makeWriteGroup(ff,en,mi,ei));});parent.appendChild(row);}
    else if(f.t==='distortions'){parent.appendChild(buildDistortions(f,en,mi,ei));}
    else if(f.t==='box3'){
      var box=document.createElement('div');box.className='box box-pink';box.style.marginBottom='12px';
      f.items.forEach(function(item){var g=makeWriteGroup(item,en,mi,ei);g.style.marginBottom='10px';box.appendChild(g);});
      parent.appendChild(box);
    }
    else if(f.t==='box-write'){
      var colors={pink:'box-pink',purple:'box-purple',green:'box-green',amber:'box-amber',blue:'box-blue',teal:'box-teal'};
      var box=document.createElement('div');box.className='box '+(colors[f.color]||'box-pink');box.style.marginBottom='12px';
      if(f.title){var ttl=document.createElement('div');ttl.className='box-title';ttl.textContent=f.title;box.appendChild(ttl);}
      f.fields.forEach(function(ff){var g=makeWriteGroup(ff,en,mi,ei);g.style.marginBottom='10px';box.appendChild(g);});
      parent.appendChild(box);
    }
    else if(f.t==='weather'){parent.appendChild(buildWeatherTable(f,en,mi,ei));}
  });
}

function makeWriteGroup(f,en,mi,ei){
  var g=document.createElement('div');g.className='f-group';
  var lbl=document.createElement('label');lbl.className='f-label';lbl.textContent=f.label;
  g.appendChild(lbl);
  if(f.sub){var sub=document.createElement('div');sub.className='f-sub';sub.textContent=f.sub;g.appendChild(sub);}
  var ta=document.createElement('textarea');
  ta.className='write'+(f.sh?' sh':f.ta?' ta':'');
  ta.placeholder=f.ph||'';
  ta.value=(en.fields[f.id]||'');
  ta.oninput=function(){
    this.style.height='auto';this.style.height=this.scrollHeight+'px';
    autoSave(mi,ei,en.id,f.id,this.value);
  };
  // auto-expand on load
  setTimeout(function(){if(ta.value){ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';}},50);
  g.appendChild(ta);
  return g;
}

function buildDistortions(f,en,mi,ei){
  var exId=MODULES[mi].exercises[ei].id;
  var wrap=document.createElement('div');
  var grid=document.createElement('div');grid.className='distortion-grid';
  var checked=(en.fields[f.id]||[]);
  DISTORTIONS.forEach(function(d){
    var item=document.createElement('div');item.className='distortion-item'+(checked.indexOf(d)>=0?' checked':'');
    item.innerHTML='<div class="di-check"></div><div class="di-label">'+d+'</div>';
    item.onclick=function(){
      var arr=getEntries(mi,exId);var entry=arr.find(function(x){return x.id===en.id;});if(!entry)return;
      if(!entry.fields[f.id])entry.fields[f.id]=[];
      var idx=entry.fields[f.id].indexOf(d);
      if(idx>=0)entry.fields[f.id].splice(idx,1);else entry.fields[f.id].push(d);
      saveEntries(mi,exId,arr);
      item.classList.toggle('checked',entry.fields[f.id].indexOf(d)>=0);
    };
    grid.appendChild(item);
  });
  wrap.appendChild(grid);return wrap;
}

function buildWeatherTable(f,en,mi,ei){
  var exId=MODULES[mi].exercises[ei].id;
  var wrap=document.createElement('div');
  var tableData=(en.fields[f.id]||{});
  var table=document.createElement('table');table.className='weather-table';
  var thead=document.createElement('thead');var hr=document.createElement('tr');
  var th0=document.createElement('th');th0.textContent='Day';hr.appendChild(th0);
  f.cols.forEach(function(col){var th=document.createElement('th');th.textContent=col;hr.appendChild(th);});
  thead.appendChild(hr);table.appendChild(thead);
  var tbody=document.createElement('tbody');
  f.days.forEach(function(day){
    var tr=document.createElement('tr');
    var td0=document.createElement('td');td0.className='weather-day';td0.textContent=day;tr.appendChild(td0);
    f.cols.forEach(function(col,ci){
      var td=document.createElement('td');
      var cellId=f.id+'_'+day+'_'+ci;
      var val=(tableData[cellId]||'');
      var ta=document.createElement('textarea');ta.className='weather-cell';
      ta.placeholder='—';ta.value=val;ta.rows=1;
      ta.oninput=function(){
        this.style.height='auto';this.style.height=this.scrollHeight+'px';
        var arr=getEntries(mi,exId);var entry=arr.find(function(x){return x.id===en.id;});if(!entry)return;
        if(!entry.fields[f.id])entry.fields[f.id]={};
        entry.fields[f.id][cellId]=this.value;
        saveEntries(mi,exId,arr);
      };
      setTimeout(function(){if(ta.value){ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';}},50);
      td.appendChild(ta);tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);wrap.appendChild(table);return wrap;
}

// ── PDF ──
function saveModulePDF(){
  var mi=activeModIdx;var m=MODULES[mi];
  var pc=document.createElement('div');pc.id='pdf-print-area';
  pc.style.cssText='display:none;font-family:Plus Jakarta Sans,sans-serif;padding:20px;';
  var mh=document.createElement('div');
  mh.style.cssText='text-align:center;margin-bottom:28px;padding-bottom:16px;border-bottom:2px solid var(--line);';
  mh.innerHTML='<div style="font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;">Module '+m.num+'</div>'+
    '<div style="font-family:Fraunces,serif;font-size:2rem;font-weight:600;color:var(--ink);">'+m.title+'</div>'+
    '<div style="font-size:11px;color:var(--muted);margin-top:4px;">'+m.sub+'</div>'+
    '<div style="font-family:Fraunces,serif;font-style:italic;color:var(--accent-deep);margin-top:8px;">'+m.quote+'</div>';
  pc.appendChild(mh);

  m.exercises.forEach(function(ex){
    var entries=getEntries(mi,ex.id);if(!entries.length)return;
    var xs=document.createElement('div');xs.style.cssText='margin-bottom:36px;';
    xs.innerHTML='<div style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:3px;">'+ex.label+'</div>'+
      '<div style="font-family:Fraunces,serif;font-size:1.3rem;font-style:italic;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:8px;">'+ex.title+'</div>';
    entries.forEach(function(en){
      if(!en.fields||!Object.keys(en.fields).length)return;
      var ed=document.createElement('div');ed.style.cssText='margin-bottom:18px;padding:14px 18px;background:var(--warm);border-radius:8px;page-break-inside:avoid;';
      var dl=document.createElement('div');dl.style.cssText='font-family:Fraunces,serif;font-style:italic;color:var(--accent-deep);font-size:13px;margin-bottom:10px;border-bottom:1px dashed var(--line);padding-bottom:6px;';
      dl.textContent=en.date;ed.appendChild(dl);
      var fields=en.fields;
      Object.keys(fields).forEach(function(k){
        var val=fields[k];if(!val||typeof val!=='string'||!val.trim())return;
        var r=document.createElement('div');r.style.cssText='margin-bottom:8px;';
        r.innerHTML='<div style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:2px;">'+k.replace(/_/g,' ')+'</div>'+
          '<div style="font-size:13px;line-height:1.7;color:var(--ink);">'+val+'</div>';
        ed.appendChild(r);
      });
      xs.appendChild(ed);
    });
    pc.appendChild(xs);
  });

  document.body.appendChild(pc);
  pc.style.display='block';
  var mv=document.getElementById('view-module');var ov=document.getElementById('view-overview');
  mv.style.display='none';ov.style.display='none';
  window.print();
  mv.style.display='block';ov.style.display='';
  document.body.removeChild(pc);
}

// ── INIT ──
var now=new Date();
document.getElementById('today-date').textContent=DAYS_FULL[now.getDay()]+', '+MONTHS_FULL[now.getMonth()]+' '+now.getDate()+', '+now.getFullYear();
renderOverview();
</script>
