<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meals & Groceries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);font-family:var(--b2-sans,'Plus Jakarta Sans',system-ui,sans-serif);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}
button,input,select{font-family:inherit;}

/* ── TITLE ROW (brain.css turns .topbar into the title row) ── */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.topbar-left{display:flex;align-items:center;gap:14px;}
.topbar-title{font-family:var(--b2-serif);font-size:34px;font-weight:600;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.back-btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border:1px solid var(--line);border-radius:10px;font:650 12.5px var(--b2-sans);color:var(--ink-2);background:var(--raised);text-decoration:none;cursor:pointer;transition:border-color .15s,color .15s;white-space:nowrap;}
.back-btn:hover{border-color:var(--accent-line);color:var(--accent-deep);}
.back-btn svg{width:14px;height:14px;flex-shrink:0;}

/* ── PAGE TABS: segmented control in the title row ── */
.tab-bar-inner{display:inline-flex;gap:2px;padding:4px;background:var(--warm-deep);border-radius:13px;}
.tab-btn{padding:8px 16px;border:none;border-radius:10px;background:transparent;font:650 13px var(--b2-sans);color:var(--muted);cursor:pointer;white-space:nowrap;transition:color .15s,background .15s;}
.tab-btn:hover{color:var(--ink);}
.tab-btn.active{background:var(--raised);color:var(--ink);box-shadow:0 1px 3px rgba(60,50,30,.1);}

/* ── FRAME ── */
.view{display:none;max-width:1280px;margin:0 auto;padding:20px 40px 80px;}
.view.active{display:block;}

/* ── CARD ── */
.stat-card,.store-group,.shop-store-card,.meal-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(60,50,30,.04),0 8px 24px rgba(60,50,30,.05);}

/* ── STATS ── */
.stats-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-bottom:26px;}
.stat-card{padding:20px 24px;}
.stat-num{font-family:var(--b2-serif);font-size:32px;font-weight:600;line-height:1;letter-spacing:-.6px;}
.stat-num.warn{color:var(--over);}
.stat-num.good{color:var(--ok);}
.stat-label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:10px;font-weight:750;}

/* ── SECTION HEADER ── */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap;}
.sec-title{font-family:var(--b2-serif);font-size:24px;font-weight:600;letter-spacing:-.4px;}
.sec-sub{font-size:12.5px;color:var(--muted);margin-top:3px;max-width:520px;line-height:1.45;}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap;}
.pill-btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 15px;border:1px solid var(--line);border-radius:10px;font:650 12.5px var(--b2-sans);cursor:pointer;white-space:nowrap;transition:opacity .15s,border-color .15s,color .15s;}
.pill-dark{background:var(--ink);border-color:var(--ink);color:#fff;}
.pill-dark:hover{opacity:.88;}
.pill-ghost{background:var(--raised);color:var(--ink-2);}
.pill-ghost:hover{border-color:var(--accent-line);color:var(--accent-deep);}

/* ── FILTERS ── */
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}
.search-box{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:500 13px var(--b2-sans);color:var(--ink);background:var(--raised);outline:none;transition:border-color .15s,box-shadow .15s;width:280px;max-width:100%;margin-right:6px;}
.search-box:focus,.f-inp:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft);}
.f-chip{padding:6px 12px;border:none;border-radius:20px;font:600 12.5px var(--b2-sans);cursor:pointer;background:var(--warm-deep);color:var(--ink-2);transition:background .15s,color .15s;}
.f-chip:hover{color:var(--ink);}
.f-chip.active{background:var(--ink);color:#fff;}

/* ── STORE GROUPS (one card per store) ── */
#staples-list,.shop-by-store{columns:2;column-gap:18px;}
.store-group,.shop-store-card{break-inside:avoid;margin-bottom:18px;display:inline-block;width:100%;vertical-align:top;}
.store-group{padding:20px 24px 10px;min-width:0;}
.store-group-hdr{display:flex;align-items:center;gap:9px;margin-bottom:6px;}
.store-dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.sg-name{font-family:var(--b2-serif);font-size:19px;font-weight:600;letter-spacing:-.2px;}
.sg-count{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--warm);color:var(--muted);margin-left:auto;}
.staple-row{display:flex;align-items:center;gap:12px;padding:11px 0;}
.staple-row+.staple-row{border-top:1px solid var(--hair);}
.sr-main{flex:1;min-width:0;}
.sr-name{font-size:14px;font-weight:650;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sr-cat{font-size:12px;color:var(--muted);font-weight:550;margin-top:2px;}
.sr-tools{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;height:28px;min-width:28px;padding:0 9px;border:1px solid transparent;border-radius:8px;background:none;color:var(--faint);cursor:pointer;font:650 11.5px var(--b2-sans);transition:all .15s;line-height:1;}
.icon-btn:hover{border-color:var(--line);background:var(--raised);color:var(--ink-2);}
.icon-btn.danger{padding:0;}
.icon-btn.danger:hover{border-color:var(--over-bg);background:var(--over-bg);color:var(--over);}

/* stock toggle — the shared segmented control, small; colour = stock status */
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--warm-deep);border-radius:10px;flex-shrink:0;}
.seg-btn{padding:4px 10px;border:none;border-radius:7px;background:transparent;font:650 11.5px var(--b2-sans);cursor:pointer;color:var(--muted);white-space:nowrap;transition:background .12s,color .12s;}
.seg-btn:hover{color:var(--ink);}
.seg-btn.active{background:var(--raised);box-shadow:0 1px 3px rgba(60,50,30,.1);}
.seg-btn.active.stocked{color:var(--ok);}
.seg-btn.active.low{color:var(--warn);}
.seg-btn.active.out{color:var(--over);}

.empty-note{grid-column:1/-1;column-span:all;text-align:center;padding:48px 20px;color:var(--muted);font-family:var(--b2-serif);font-style:italic;font-size:17px;background:var(--surface);border:1px dashed var(--line);border-radius:18px;}

/* ── SHOPPING ── */
.shop-total-bar{display:flex;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:14px;padding:14px 20px;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
.shop-total-left{font-size:13px;font-weight:600;color:var(--ink-2);}
.shop-total-left b{font-weight:750;color:var(--ink);}
.shop-total-right{display:flex;align-items:baseline;gap:6px;}
.shop-total-num{font-family:var(--b2-serif);font-size:24px;font-weight:600;color:var(--accent-deep);}
.shop-total-lbl{font-size:12px;color:var(--muted);font-weight:600;}
.shop-store-card{padding:20px 24px 10px;min-width:0;}
.shop-store-hdr{display:flex;align-items:center;gap:9px;margin-bottom:6px;}
.shop-store-name{font-family:var(--b2-serif);font-size:19px;font-weight:600;letter-spacing:-.2px;flex:1;}
.shop-store-total{font-size:12.5px;font-weight:650;color:var(--accent-deep);}
.shop-item{display:flex;align-items:center;gap:12px;padding:11px 0;}
.shop-item+.shop-item{border-top:1px solid var(--hair);}
.shop-chk{width:22px;height:22px;border-radius:7px;border:1.6px solid var(--line);background:var(--raised);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.shop-chk:hover{border-color:var(--accent);}
.shop-chk.done{background:var(--accent-deep);border-color:var(--accent-deep);}
.shop-chk.done::after{content:'\2713';color:#fff;font-size:12px;font-weight:800;}
.shop-name{font-size:14px;font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.shop-name.done{text-decoration:line-through;color:var(--faint);}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;flex-shrink:0;white-space:nowrap;}
.badge-low{background:var(--warn-bg);color:var(--warn);}
.badge-out{background:var(--over-bg);color:var(--over);}
.badge-manual{background:var(--warm);color:var(--muted);}
.shop-cost{font-size:12.5px;font-weight:650;color:var(--ink-2);flex-shrink:0;min-width:48px;text-align:right;}
.shop-del{width:24px;height:24px;border:none;border-radius:7px;background:none;color:var(--faint);cursor:pointer;font-size:11px;flex-shrink:0;}
.shop-del:hover{background:var(--over-bg);color:var(--over);}

/* ── GO-TO MEALS ── */
.meal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;}
.meal-card{padding:22px 24px 18px;display:flex;flex-direction:column;}
.mc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.mc-name{font-family:var(--b2-serif);font-size:19px;font-weight:600;letter-spacing:-.2px;line-height:1.25;}
.mc-type{font-size:10.5px;font-weight:750;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:5px;}
.mc-status{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;flex-shrink:0;white-space:nowrap;}
.mc-status.ready{background:var(--ok-bg);color:var(--ok);}
.mc-status.need{background:var(--warn-bg);color:var(--warn);}
.ing-tags{display:flex;flex-wrap:wrap;gap:5px;margin:14px 0 16px;flex:1;align-content:flex-start;}
.ing-tag{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--warm);color:var(--muted);}
.ing-tag.miss-low{background:var(--warn-bg);color:var(--warn);}
.ing-tag.miss-out{background:var(--over-bg);color:var(--over);}
.mc-actions{display:flex;gap:6px;padding-top:14px;border-top:1px solid var(--hair);}
.mc-btn{display:inline-flex;align-items:center;height:28px;padding:0 11px;border:1px solid var(--line);border-radius:8px;font:650 11.5px var(--b2-sans);cursor:pointer;background:var(--raised);color:var(--ink-2);transition:all .15s;}
.mc-btn:hover{border-color:var(--accent-line);color:var(--accent-deep);}
.mc-btn.danger:hover{border-color:var(--over-bg);background:var(--over-bg);color:var(--over);}

/* ── MODALS ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(36,31,23,.28);backdrop-filter:blur(3px);z-index:1000;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;animation:fadeIn .2s;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:18px;border:1px solid var(--line);padding:24px 26px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 30px 70px rgba(36,31,23,.22);animation:popIn .2s;}
@keyframes popIn{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}
.modal-sm{max-width:420px;}
.modal-title{font-family:var(--b2-serif);font-size:22px;font-weight:600;letter-spacing:-.3px;margin-bottom:18px;}
.f-field{margin-bottom:14px;}
.f-lbl{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:750;margin-bottom:6px;display:block;}
.f-hint{font-size:11.5px;color:var(--faint);font-weight:500;text-transform:none;letter-spacing:0;}
.f-inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:500 13px var(--b2-sans);color:var(--ink);background:var(--raised);outline:none;transition:border-color .15s,box-shadow .15s;}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.m-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--hair);}
.m-btn{display:inline-flex;align-items:center;height:34px;padding:0 16px;border-radius:10px;font:650 12.5px var(--b2-sans);cursor:pointer;border:1px solid;transition:opacity .15s,border-color .15s;}
.m-cancel{background:var(--raised);border-color:var(--line);color:var(--ink-2);}
.m-cancel:hover{border-color:var(--accent-line);color:var(--accent-deep);}
.m-save{background:var(--ink);border-color:var(--ink);color:#fff;}
.m-save:hover{opacity:.88;}
.m-delete{background:var(--over-bg);border-color:var(--over-bg);color:var(--over);margin-right:auto;order:-1;}

/* status picker in staple modal */
.status-pick{display:flex;gap:2px;padding:4px;background:var(--warm-deep);border-radius:13px;}
.sp-btn{flex:1;padding:8px;border:none;border-radius:10px;font:650 13px var(--b2-sans);cursor:pointer;background:transparent;color:var(--muted);transition:all .12s;}
.sp-btn.on{background:var(--raised);box-shadow:0 1px 3px rgba(60,50,30,.1);}
.sp-btn.on.stocked{color:var(--ok);}
.sp-btn.on.low{color:var(--warn);}
.sp-btn.on.out{color:var(--over);}

/* ingredient chip picker in meal modal */
.chip-picker{display:flex;flex-wrap:wrap;gap:6px;max-height:210px;overflow-y:auto;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--warm);}
.pick-chip{padding:6px 12px;border-radius:20px;border:none;background:var(--raised);font:600 12.5px var(--b2-sans);cursor:pointer;color:var(--ink-2);box-shadow:0 0 0 1px var(--line) inset;transition:all .12s;}
.pick-chip:hover{box-shadow:0 0 0 1px var(--accent-line) inset;}
.pick-chip.on{background:var(--ink);color:#fff;box-shadow:none;}
.pick-empty{font-size:12.5px;color:var(--muted);padding:6px;}

@media(max-width:1100px){
  #staples-list,.shop-by-store{columns:1;}
}
@media(max-width:760px){
  body.b2-shell .topbar{flex-wrap:wrap;align-items:center;}
  .stats-row{gap:8px;}
  .staple-row{flex-wrap:wrap;}
  .sr-tools{width:100%;justify-content:flex-end;}
  .view{padding:16px 16px 60px;}
}
</style>
<link rel="stylesheet" href="../assets/brain.css">
</head>
<body>
<script src="../assets/shell.js"></script>

<!-- STAPLE MODAL -->
<div class="modal-overlay" id="staple-modal">
  <div class="modal">
    <div class="modal-title" id="sm-title">Add Staple</div>
    <div class="f-field"><label class="f-lbl">Item name</label><input class="f-inp" id="st-name" placeholder="e.g. Eggs"></div>
    <div class="f-row">
      <div class="f-field"><label class="f-lbl">Store</label>
        <select class="f-inp" id="st-store"></select>
      </div>
      <div class="f-field"><label class="f-lbl">Category</label>
        <select class="f-inp" id="st-cat"></select>
      </div>
    </div>
    <div class="f-field"><label class="f-lbl">Status</label>
      <div class="status-pick">
        <button type="button" class="sp-btn stocked" id="st-status-stocked" onclick="pickStapleStatus('stocked')">Stocked</button>
        <button type="button" class="sp-btn low" id="st-status-low" onclick="pickStapleStatus('low')">Low</button>
        <button type="button" class="sp-btn out" id="st-status-out" onclick="pickStapleStatus('out')">Out</button>
      </div>
    </div>
    <div class="f-field"><label class="f-lbl">Typical price <span class="f-hint">— optional, for a rough list total</span></label><input class="f-inp" id="st-price" type="number" min="0" step="0.01" placeholder="e.g. 5.84"></div>
    <div class="m-actions">
      <button class="m-btn m-cancel" onclick="closeStapleModal()">Cancel</button>
      <button class="m-btn m-delete" id="st-del-btn" style="display:none;" onclick="deleteStapleFromModal()">Delete</button>
      <button class="m-btn m-save" onclick="saveStaple()">Save</button>
    </div>
  </div>
</div>

<!-- MEAL MODAL -->
<div class="modal-overlay" id="meal-modal">
  <div class="modal">
    <div class="modal-title" id="mm-title">Add Go-To Meal</div>
    <div class="f-row">
      <div class="f-field"><label class="f-lbl">Meal name</label><input class="f-inp" id="ml-name" placeholder="e.g. Bacon & Eggs"></div>
      <div class="f-field"><label class="f-lbl">When</label>
        <select class="f-inp" id="ml-type"></select>
      </div>
    </div>
    <div class="f-field"><label class="f-lbl">Ingredients <span class="f-hint">— tap the staples this meal uses</span></label>
      <div class="chip-picker" id="ml-chips"></div>
    </div>
    <div class="m-actions">
      <button class="m-btn m-cancel" onclick="closeMealModal()">Cancel</button>
      <button class="m-btn m-delete" id="ml-del-btn" style="display:none;" onclick="deleteMealFromModal()">Delete</button>
      <button class="m-btn m-save" onclick="saveMeal()">Save</button>
    </div>
  </div>
</div>

<!-- SHOPPING ADD MODAL -->
<div class="modal-overlay" id="shop-modal">
  <div class="modal modal-sm">
    <div class="modal-title">Add One-Off Item</div>
    <div class="f-field"><label class="f-lbl">Item <span class="f-hint">— something you don't keep as a staple</span></label><input class="f-inp" id="so-name" placeholder="e.g. Birthday candles"></div>
    <div class="f-row">
      <div class="f-field"><label class="f-lbl">Store</label>
        <select class="f-inp" id="so-store"></select>
      </div>
      <div class="f-field"><label class="f-lbl">Est. price <span class="f-hint">— optional</span></label><input class="f-inp" id="so-cost" type="number" min="0" step="0.01" placeholder="0.00"></div>
    </div>
    <div class="m-actions">
      <button class="m-btn m-cancel" onclick="closeShopModal()">Cancel</button>
      <button class="m-btn m-save" onclick="saveShopItem()">Add</button>
    </div>
  </div>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-left">
    <a href="../" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      Brain 2.0
    </a>
    <div class="topbar-title">Meals &amp; Groceries</div>
  </div>
  <div class="topbar-right">
    <div class="tab-bar-inner" role="tablist">
      <button class="tab-btn active" id="tab-staples"  onclick="setTab('staples')">Staples</button>
      <button class="tab-btn"        id="tab-shopping" onclick="setTab('shopping')">Shopping</button>
      <button class="tab-btn"        id="tab-meals"    onclick="setTab('meals')">Go-To Meals</button>
    </div>
    <a href="https://www.instacart.com/store" target="_blank" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
      Instacart <span aria-hidden="true">&#8599;</span>
    </a>
    <span class="topbar-date" id="today-date"></span>
  </div>
</div>

<!-- STAPLES VIEW -->
<div class="view active" id="view-staples">
  <div class="stats-row" id="staples-stats"></div>
  <div class="sec-hdr">
    <div>
      <div class="sec-title">Staples</div>
    </div>
    <div class="hdr-actions"><button class="pill-btn pill-dark" onclick="openStapleModal()">+ Add Staple</button></div>
  </div>
  <div class="filter-row">
    <input class="search-box" id="staple-search" placeholder="Search staples..." oninput="renderStaples()">
    <button class="f-chip active" id="sf-all"   onclick="setStapleFilter('all')">All</button>
    <button class="f-chip"        id="sf-buy"   onclick="setStapleFilter('buy')">Need to buy</button>
    <button class="f-chip"        id="sf-stocked" onclick="setStapleFilter('stocked')">Stocked</button>
  </div>
  <div id="staples-list"></div>
</div>

<!-- SHOPPING VIEW -->
<div class="view" id="view-shopping">
  <div class="sec-hdr">
    <div>
      <div class="sec-title">Shopping List</div>
    </div>
    <div class="hdr-actions">
      <button class="pill-btn pill-ghost pill-sm" onclick="openShopModal()">+ One-off</button>
      <button class="pill-btn pill-dark pill-sm" onclick="doneShopping()">Done shopping</button>
    </div>
  </div>
  <div id="shop-total-bar"></div>
  <div class="shop-by-store" id="shop-by-store"></div>
</div>

<!-- MEALS VIEW -->
<div class="view" id="view-meals">
  <div class="sec-hdr">
    <div>
      <div class="sec-title">Go-To Meals</div>
    </div>
    <div class="hdr-actions"><button class="pill-btn pill-dark" onclick="openMealModal()">+ Add Meal</button></div>
  </div>
  <div class="meal-grid" id="meal-grid"></div>
</div>

<script>
var SK='mealPlanner1';
var DAYS_FULL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MONTHS_FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
var STORES=['Walmart','Costco','Safeway','Whole Foods',"Trader Joe's",'Target','Amazon','Aldi','Other'];
var STORE_COLORS={Walmart:'#0071ce',Costco:'#e3261c',Safeway:'#cc0000','Whole Foods':'#2b6e2b',"Trader Joe's":'#c0392b',Target:'#cc0000',Amazon:'#ff9900',Aldi:'#00a0e0',Other:'#7a7468'};
var CATEGORIES=['Protein','Dairy','Produce','Bread','Pantry','Sauce','Snack','Dessert','Drink','Frozen','Household','Other'];
var MEAL_TYPES=['Breakfast','Lunch','Dinner','Snack','Any'];

var data={staples:[],goto:[],shopping:[],picked:[]};

var DEFAULT_STAPLES=[
  {id:'s1', name:'Celsius Energy Drink',              store:'Costco',  category:'Drink',   status:'stocked', price:19.79},
  {id:'s2', name:'Seasoned St. Louis Ribs',           store:'Costco',  category:'Protein', status:'stocked', price:23.65},
  {id:'s3', name:'BelGioioso Fresh Mozzarella',       store:'Walmart', category:'Dairy',   status:'out',     price:2.58},
  {id:'s4', name:'Palmini Hearts of Palm Linguine',   store:'Walmart', category:'Pantry',  status:'stocked', price:3.98},
  {id:'s5', name:"Thomas' Bagel Thins",               store:'Walmart', category:'Bread',   status:'stocked', price:5.62},
  {id:'s6', name:'Great Value Large White Eggs',      store:'Walmart', category:'Protein', status:'stocked', price:5.84},
  {id:'s7', name:'Great Value Hickory Smoked Bacon',  store:'Walmart', category:'Protein', status:'low',     price:4.24},
  {id:'s8', name:'Mission Jalapeño Flour Tortillas',  store:'Safeway', category:'Bread',   status:'stocked', price:3.63},
  {id:'s9', name:'Great Value Original Pepperoni',    store:'Walmart', category:'Protein', status:'stocked', price:2.88},
  {id:'s10',name:"Rao's Marinara Sauce",              store:'Walmart', category:'Sauce',   status:'stocked', price:6.98},
  {id:'s11',name:'Rebel Vanilla Ice Cream',           store:'Walmart', category:'Dessert', status:'out',     price:5.48},
  {id:'s12',name:'Coca Cola Zero',                    store:'Costco',  category:'Drink',   status:'stocked', price:21.99},
];
var DEFAULT_GOTO=[
  {id:'g1', name:'Bacon & Eggs',            type:'Breakfast', staples:['s6','s7']},
  {id:'g2', name:'Breakfast Sandwich',      type:'Breakfast', staples:['s5','s6','s7']},
  {id:'g3', name:'Pepperoni Pizza Bowl',    type:'Dinner',    staples:['s9','s10','s3']},
  {id:'g4', name:'Palmini Pasta with Sauce',type:'Dinner',    staples:['s4','s10','s9']},
];

/* ── STORAGE + MIGRATION ── */
function save(){localStorage.setItem(SK,JSON.stringify(data));}
function load(){
  var raw=localStorage.getItem(SK);
  if(!raw){
    data={staples:JSON.parse(JSON.stringify(DEFAULT_STAPLES)),goto:JSON.parse(JSON.stringify(DEFAULT_GOTO)),shopping:[],picked:[]};
    save();
    return;
  }
  var parsed;
  try{parsed=JSON.parse(raw);}catch(e){parsed=null;}
  if(!parsed){data={staples:JSON.parse(JSON.stringify(DEFAULT_STAPLES)),goto:JSON.parse(JSON.stringify(DEFAULT_GOTO)),shopping:[],picked:[]};save();return;}

  if(parsed.staples){
    // already new format
    data=parsed;
    data.staples=data.staples||[];
    data.goto=data.goto||[];
    data.shopping=data.shopping||[];
    data.picked=data.picked||[];
  } else if(parsed.pantry){
    // migrate from the old pantry/recipe/planner format
    data={staples:[],goto:[],shopping:[],picked:[]};
    (parsed.pantry||[]).forEach(function(p){
      var status='stocked';
      if(p.remaining!==undefined){
        if(p.remaining<=0)status='out';
        else if(p.reorderAt>0&&p.remaining<=p.reorderAt)status='low';
      }
      data.staples.push({id:p.id||('s_'+Math.random().toString(36).slice(2,8)),name:p.name,store:p.store||'Other',category:mapCat(p.category),status:status,price:(p.totalPrice!==undefined?p.totalPrice:null)});
    });
    (parsed.recipes||[]).forEach(function(r){
      data.goto.push({id:r.id||('g_'+Math.random().toString(36).slice(2,8)),name:r.name,type:MEAL_TYPES.indexOf(r.type)>=0?r.type:'Any',staples:(r.ingredients||[]).map(function(i){return i.itemId;}).filter(Boolean)});
    });
    (parsed.shopping||[]).forEach(function(s){
      data.shopping.push({id:s.id||('m_'+Math.random().toString(36).slice(2,8)),name:s.name,store:s.store||'Other',cost:(s.cost!==undefined?s.cost:null),checked:!!s.checked});
    });
    save();
  } else {
    data={staples:JSON.parse(JSON.stringify(DEFAULT_STAPLES)),goto:JSON.parse(JSON.stringify(DEFAULT_GOTO)),shopping:[],picked:[]};
    save();
  }
}
function mapCat(c){
  if(!c)return 'Other';
  var m={Carb:'Pantry','Fat/Oil':'Pantry',Vegetable:'Produce',Fruit:'Produce',Spice:'Pantry',Can:'Pantry'};
  if(m[c])return m[c];
  return CATEGORIES.indexOf(c)>=0?c:'Other';
}

/* ── HELPERS ── */
function getStaple(id){return data.staples.find(function(s){return s.id===id;});}
function needBuy(s){return s&&(s.status==='low'||s.status==='out');}
function storeIdx(store){var i=STORES.indexOf(store);return i<0?98:i;}
function storeSort(a,b){return storeIdx(a)-storeIdx(b)||String(a).localeCompare(String(b));}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* ── TABS ── */
function setTab(tab){
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});
  document.getElementById('tab-'+tab).classList.add('active');
  document.getElementById('view-'+tab).classList.add('active');
  ({staples:renderStaples,shopping:renderShopping,meals:renderMeals}[tab])();
}

/* ══════════════ STAPLES ══════════════ */
var stapleFilter='all';
function setStapleFilter(f){
  stapleFilter=f;
  ['all','buy','stocked'].forEach(function(x){document.getElementById('sf-'+x).classList.toggle('active',x===f);});
  renderStaples();
}
function renderStaples(){
  var q=(document.getElementById('staple-search').value||'').toLowerCase();
  var total=data.staples.length;
  var buy=data.staples.filter(needBuy).length;
  var estCost=data.staples.filter(function(s){return needBuy(s)&&s.price;}).reduce(function(t,s){return t+(s.price||0);},0);
  document.getElementById('staples-stats').innerHTML=
    '<div class="stat-card"><div class="stat-num">'+total+'</div><div class="stat-label">Staples Tracked</div></div>'+
    '<div class="stat-card"><div class="stat-num'+(buy?' warn':' good')+'">'+buy+'</div><div class="stat-label">Need To Buy</div></div>'+
    '<div class="stat-card"><div class="stat-num">'+(estCost>0?'$'+estCost.toFixed(0):'—')+'</div><div class="stat-label">Est. To Restock</div></div>';

  var items=data.staples.filter(function(s){
    if(q&&s.name.toLowerCase().indexOf(q)<0&&String(s.category||'').toLowerCase().indexOf(q)<0)return false;
    if(stapleFilter==='buy'&&!needBuy(s))return false;
    if(stapleFilter==='stocked'&&s.status!=='stocked')return false;
    return true;
  });

  var wrap=document.getElementById('staples-list');wrap.innerHTML='';
  if(!items.length){
    wrap.innerHTML='<div class="empty-note">'+(total===0?'No staples yet — add the groceries you normally keep.':'Nothing matches this filter.')+'</div>';
    return;
  }
  var byStore={};
  items.forEach(function(s){(byStore[s.store]=byStore[s.store]||[]).push(s);});
  Object.keys(byStore).sort(storeSort).forEach(function(store){
    var group=document.createElement('div');group.className='store-group';
    group.innerHTML='<div class="store-group-hdr"><span class="store-dot" style="background:'+(STORE_COLORS[store]||'#aaa')+'"></span><span class="sg-name">'+esc(store)+'</span><span class="sg-count">'+byStore[store].length+'</span></div>';
    byStore[store].forEach(function(s){
      var row=document.createElement('div');row.className='staple-row status-'+s.status;
      row.innerHTML=
        '<div class="sr-main"><div class="sr-name">'+esc(s.name)+'</div><div class="sr-cat">'+esc(s.category||'')+'</div></div>'+
        '<div class="sr-tools">'+
          '<div class="seg">'+
            '<button class="seg-btn stocked'+(s.status==='stocked'?' active':'')+'" onclick="setStatus(\''+s.id+'\',\'stocked\')">Stocked</button>'+
            '<button class="seg-btn low'+(s.status==='low'?' active':'')+'" onclick="setStatus(\''+s.id+'\',\'low\')">Low</button>'+
            '<button class="seg-btn out'+(s.status==='out'?' active':'')+'" onclick="setStatus(\''+s.id+'\',\'out\')">Out</button>'+
          '</div>'+
          '<button class="icon-btn" title="Edit" onclick="editStaple(\''+s.id+'\')">Edit</button>'+
          '<button class="icon-btn danger" title="Remove" onclick="deleteStapleDirect(\''+s.id+'\')">\u2715</button>'+
        '</div>';
      group.appendChild(row);
    });
    wrap.appendChild(group);
  });
}
function setStatus(id,status){
  var s=getStaple(id);if(!s)return;
  s.status=status;
  if(status==='stocked'){var pi=data.picked.indexOf(id);if(pi>=0)data.picked.splice(pi,1);}
  save();renderStaples();
}

/* ── STAPLE MODAL ── */
var editingStapleId=null;
var pendingStatus='stocked';
function fillSelect(el,opts,val){el.innerHTML='';opts.forEach(function(o){var op=document.createElement('option');op.value=o;op.textContent=o;if(o===val)op.selected=true;el.appendChild(op);});}
function pickStapleStatus(st){
  pendingStatus=st;
  ['stocked','low','out'].forEach(function(x){document.getElementById('st-status-'+x).classList.toggle('on',x===st);});
}
function openStapleModal(){
  editingStapleId=null;pendingStatus='stocked';
  document.getElementById('sm-title').textContent='Add Staple';
  document.getElementById('st-name').value='';
  document.getElementById('st-price').value='';
  fillSelect(document.getElementById('st-store'),STORES,'Walmart');
  fillSelect(document.getElementById('st-cat'),CATEGORIES,'Protein');
  pickStapleStatus('stocked');
  document.getElementById('st-del-btn').style.display='none';
  document.getElementById('staple-modal').classList.add('open');
  setTimeout(function(){document.getElementById('st-name').focus();},100);
}
function editStaple(id){
  var s=getStaple(id);if(!s)return;
  editingStapleId=id;pendingStatus=s.status;
  document.getElementById('sm-title').textContent='Edit Staple';
  document.getElementById('st-name').value=s.name;
  document.getElementById('st-price').value=(s.price!=null?s.price:'');
  fillSelect(document.getElementById('st-store'),STORES,s.store);
  fillSelect(document.getElementById('st-cat'),CATEGORIES,CATEGORIES.indexOf(s.category)>=0?s.category:'Other');
  pickStapleStatus(s.status);
  document.getElementById('st-del-btn').style.display='inline-flex';
  document.getElementById('staple-modal').classList.add('open');
}
function closeStapleModal(){document.getElementById('staple-modal').classList.remove('open');editingStapleId=null;}
function saveStaple(){
  var name=document.getElementById('st-name').value.trim();if(!name){document.getElementById('st-name').focus();return;}
  var priceRaw=document.getElementById('st-price').value;
  var rec={
    id:editingStapleId||('s_'+Date.now()),
    name:name,
    store:document.getElementById('st-store').value,
    category:document.getElementById('st-cat').value,
    status:pendingStatus,
    price:priceRaw!==''?(parseFloat(priceRaw)||0):null
  };
  if(editingStapleId){var i=data.staples.findIndex(function(s){return s.id===editingStapleId;});if(i>=0)data.staples[i]=rec;}
  else data.staples.push(rec);
  if(rec.status==='stocked'){var pi=data.picked.indexOf(rec.id);if(pi>=0)data.picked.splice(pi,1);}
  save();closeStapleModal();renderStaples();
}
function deleteStapleFromModal(){
  if(!editingStapleId)return;
  if(!confirm('Remove this staple?'))return;
  removeStaple(editingStapleId);
  closeStapleModal();renderStaples();
}
function deleteStapleDirect(id){
  if(!confirm('Remove this staple?'))return;
  removeStaple(id);renderStaples();
}
function removeStaple(id){
  data.staples=data.staples.filter(function(s){return s.id!==id;});
  var pi=data.picked.indexOf(id);if(pi>=0)data.picked.splice(pi,1);
  data.goto.forEach(function(m){m.staples=m.staples.filter(function(x){return x!==id;});});
  save();
}
document.getElementById('staple-modal').addEventListener('click',function(e){if(e.target===this)closeStapleModal();});

/* ══════════════ SHOPPING ══════════════ */
function cleanPicked(){data.picked=data.picked.filter(function(id){var s=getStaple(id);return s&&needBuy(s);});}
function shopRows(){
  cleanPicked();
  var byStore={};
  data.staples.forEach(function(s){
    if(needBuy(s)){(byStore[s.store]=byStore[s.store]||[]).push({kind:'staple',id:s.id,name:s.name,status:s.status,cost:s.price||0,checked:data.picked.indexOf(s.id)>=0});}
  });
  data.shopping.forEach(function(m){
    (byStore[m.store]=byStore[m.store]||[]).push({kind:'manual',id:m.id,name:m.name,status:null,cost:m.cost||0,checked:!!m.checked});
  });
  return byStore;
}
function renderShopping(){
  var byStore=shopRows();
  var stores=Object.keys(byStore).sort(storeSort);
  var totalItems=0,totalCost=0;
  stores.forEach(function(st){byStore[st].forEach(function(r){totalItems++;totalCost+=r.cost||0;});});

  var bar=document.getElementById('shop-total-bar');
  if(totalItems){
    bar.innerHTML='<div class="shop-total-bar"><div class="shop-total-left"><b>'+totalItems+'</b> item'+(totalItems!==1?'s':'')+' to pick up across <b>'+stores.length+'</b> store'+(stores.length!==1?'s':'')+'</div><div class="shop-total-right"><span class="shop-total-num">'+(totalCost>0?'~$'+totalCost.toFixed(2):'—')+'</span><span class="shop-total-lbl">est. total</span></div></div>';
  } else { bar.innerHTML=''; }

  var wrap=document.getElementById('shop-by-store');wrap.innerHTML='';
  if(!totalItems){
    wrap.innerHTML='<div class="empty-note" style="grid-column:1/-1;">You\u2019re all stocked up \u2014 nothing to buy right now.</div>';
    return;
  }
  stores.forEach(function(store){
    var rows=byStore[store];
    var subtotal=rows.reduce(function(t,r){return t+(r.cost||0);},0);
    var card=document.createElement('div');card.className='shop-store-card';
    card.innerHTML='<div class="shop-store-hdr"><span class="store-dot" style="background:'+(STORE_COLORS[store]||'#aaa')+'"></span><span class="shop-store-name">'+esc(store)+'</span><span class="shop-store-total">'+(subtotal>0?'~$'+subtotal.toFixed(2):'')+'</span></div>';
    rows.forEach(function(r){
      var row=document.createElement('div');row.className='shop-item';
      var badge=r.kind==='staple'?('<span class="badge badge-'+r.status+'">'+(r.status==='out'?'Out':'Low')+'</span>'):'<span class="badge badge-manual">One-off</span>';
      var cost=r.cost>0?'<span class="shop-cost">$'+r.cost.toFixed(2)+'</span>':'';
      var del=r.kind==='manual'?('<button class="shop-del" title="Remove" onclick="deleteShopItem(\''+r.id+'\')">\u2715</button>'):'';
      row.innerHTML=
        '<div class="shop-chk'+(r.checked?' done':'')+'" onclick="toggleShopCheck(\''+r.kind+'\',\''+r.id+'\')"></div>'+
        '<span class="shop-name'+(r.checked?' done':'')+'">'+esc(r.name)+'</span>'+
        badge+cost+del;
      card.appendChild(row);
    });
    wrap.appendChild(card);
  });
}
function toggleShopCheck(kind,id){
  if(kind==='staple'){
    var i=data.picked.indexOf(id);
    if(i>=0)data.picked.splice(i,1);else data.picked.push(id);
  } else {
    var m=data.shopping.find(function(x){return x.id===id;});
    if(m)m.checked=!m.checked;
  }
  save();renderShopping();
}
function doneShopping(){
  cleanPicked();
  var pickedCount=data.picked.length;
  var checkedManual=data.shopping.filter(function(m){return m.checked;}).length;
  if(pickedCount+checkedManual===0){alert('Check off what you bought first, then tap Done shopping.');return;}
  // picked staples become stocked
  data.picked.forEach(function(id){var s=getStaple(id);if(s)s.status='stocked';});
  data.picked=[];
  // checked one-offs get removed
  data.shopping=data.shopping.filter(function(m){return !m.checked;});
  save();renderShopping();
}
/* ── ONE-OFF MODAL ── */
function openShopModal(){
  document.getElementById('so-name').value='';
  document.getElementById('so-cost').value='';
  fillSelect(document.getElementById('so-store'),STORES,'Walmart');
  document.getElementById('shop-modal').classList.add('open');
  setTimeout(function(){document.getElementById('so-name').focus();},100);
}
function closeShopModal(){document.getElementById('shop-modal').classList.remove('open');}
function saveShopItem(){
  var name=document.getElementById('so-name').value.trim();if(!name){document.getElementById('so-name').focus();return;}
  var costRaw=document.getElementById('so-cost').value;
  data.shopping.push({id:'m_'+Date.now(),name:name,store:document.getElementById('so-store').value,cost:costRaw!==''?(parseFloat(costRaw)||0):null,checked:false});
  save();closeShopModal();renderShopping();
}
function deleteShopItem(id){data.shopping=data.shopping.filter(function(x){return x.id!==id;});save();renderShopping();}
document.getElementById('shop-modal').addEventListener('click',function(e){if(e.target===this)closeShopModal();});

/* ══════════════ GO-TO MEALS ══════════════ */
function renderMeals(){
  var grid=document.getElementById('meal-grid');grid.innerHTML='';
  if(!data.goto.length){
    grid.innerHTML='<div class="empty-note" style="grid-column:1/-1;">No go-to meals yet \u2014 add the ones you make on repeat.</div>';
    return;
  }
  data.goto.forEach(function(m){
    var ings=m.staples.map(getStaple).filter(Boolean);
    var missing=ings.filter(needBuy);
    var card=document.createElement('div');card.className='meal-card';
    var statusHtml=missing.length
      ? '<span class="mc-status need">Need '+missing.length+'</span>'
      : '<span class="mc-status ready">Ready</span>';
    var tags=ings.length
      ? ings.map(function(s){var cls=s.status==='out'?' miss-out':s.status==='low'?' miss-low':'';return '<span class="ing-tag'+cls+'">'+esc(s.name)+'</span>';}).join('')
      : '<span class="ing-tag">No ingredients set</span>';
    card.innerHTML=
      '<div class="mc-top"><div><div class="mc-name">'+esc(m.name)+'</div><div class="mc-type">'+esc(m.type)+'</div></div>'+statusHtml+'</div>'+
      '<div class="ing-tags">'+tags+'</div>'+
      '<div class="mc-actions">'+
        '<button class="mc-btn" onclick="editMeal(\''+m.id+'\')">Edit</button>'+
        '<button class="mc-btn danger" onclick="deleteMealDirect(\''+m.id+'\')">Delete</button>'+
      '</div>';
    grid.appendChild(card);
  });
}
/* ── MEAL MODAL ── */
var editingMealId=null;
var mealStaples=[];
function renderMealChips(){
  var c=document.getElementById('ml-chips');c.innerHTML='';
  if(!data.staples.length){c.innerHTML='<div class="pick-empty">Add some staples first, then you can attach them to meals.</div>';return;}
  data.staples.slice().sort(function(a,b){return a.name.localeCompare(b.name);}).forEach(function(s){
    var on=mealStaples.indexOf(s.id)>=0;
    var chip=document.createElement('button');chip.type='button';chip.className='pick-chip'+(on?' on':'');chip.textContent=s.name;
    chip.onclick=(function(id){return function(){var i=mealStaples.indexOf(id);if(i>=0)mealStaples.splice(i,1);else mealStaples.push(id);renderMealChips();};})(s.id);
    c.appendChild(chip);
  });
}
function openMealModal(){
  editingMealId=null;mealStaples=[];
  document.getElementById('mm-title').textContent='Add Go-To Meal';
  document.getElementById('ml-name').value='';
  fillSelect(document.getElementById('ml-type'),MEAL_TYPES,'Breakfast');
  document.getElementById('ml-del-btn').style.display='none';
  renderMealChips();
  document.getElementById('meal-modal').classList.add('open');
  setTimeout(function(){document.getElementById('ml-name').focus();},100);
}
function editMeal(id){
  var m=data.goto.find(function(x){return x.id===id;});if(!m)return;
  editingMealId=id;mealStaples=m.staples.slice();
  document.getElementById('mm-title').textContent='Edit Go-To Meal';
  document.getElementById('ml-name').value=m.name;
  fillSelect(document.getElementById('ml-type'),MEAL_TYPES,m.type);
  document.getElementById('ml-del-btn').style.display='inline-flex';
  renderMealChips();
  document.getElementById('meal-modal').classList.add('open');
}
function closeMealModal(){document.getElementById('meal-modal').classList.remove('open');editingMealId=null;}
function saveMeal(){
  var name=document.getElementById('ml-name').value.trim();if(!name){document.getElementById('ml-name').focus();return;}
  var rec={id:editingMealId||('g_'+Date.now()),name:name,type:document.getElementById('ml-type').value,staples:mealStaples.slice()};
  if(editingMealId){var i=data.goto.findIndex(function(x){return x.id===editingMealId;});if(i>=0)data.goto[i]=rec;}
  else data.goto.push(rec);
  save();closeMealModal();renderMeals();
}
function deleteMealFromModal(){
  if(!editingMealId)return;if(!confirm('Delete this meal?'))return;
  data.goto=data.goto.filter(function(x){return x.id!==editingMealId;});
  save();closeMealModal();renderMeals();
}
function deleteMealDirect(id){
  if(!confirm('Delete this meal?'))return;
  data.goto=data.goto.filter(function(x){return x.id!==id;});
  save();renderMeals();
}
document.getElementById('meal-modal').addEventListener('click',function(e){if(e.target===this)closeMealModal();});

/* ── INITA ── */
var now=new Date();
document.getElementById('today-date').textContent=DAYS_FULL[now.getDay()]+', '+MONTHS_FULL[now.getMonth()]+' '+now.getDate()+', '+now.getFullYear();
load();
renderStaples();
</script>
</body>
</html>
