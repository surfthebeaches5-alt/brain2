<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,560;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f3ecd8; --surface:#fffdf9; --sidebar:#f8f1dd; --warm:#f4eddb; --warm-deep:#efe7d2;
  --ink:#241f17; --muted:#8c8374; --line:#ece3d0; --hair:#efe8d8;
  --accent:#b099e0; --accent-deep:#9a7fd4; --accent-soft:#efe9fb; --accent-line:#ddcef4;
  --ok:#3f9866; --ok-bg:#e3f0e7; --warn:#c2882f; --warn-bg:#f6ecd7; --over:#cf5d72; --over-bg:#f8e2e6; --info:#4d84a6;
  --fs-eyebrow:11px; --fs-meta:12px; --fs-body:13.5px; --fs-strong:14px;
  --fs-title:19px; --fs-stat:15px; --fs-hero:30px;
  --sb-w:230px; --sb-col:58px; --rp-w:312px; --r:16px;
}
html,body{background:var(--bg);font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:var(--fs-body);}
body{display:flex;}
a{color:inherit;}

/* ───────── MAIN ───────── */
.main{margin-right:var(--rp-w);flex:1;padding:26px 28px 70px;min-width:0;}

/* hero */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:22px;padding:2px 4px;}
.hero-greet{font-family:'Fraunces',serif;font-size:var(--fs-hero);font-weight:600;letter-spacing:-.5px;line-height:1.05;}
.hero-date{font-size:var(--fs-meta);color:var(--muted);font-weight:600;margin-top:8px;}
.hero-right{flex-shrink:0;}
.yr{width:240px;}
.yr-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;color:#5e5648;margin-bottom:8px;}
.yr-track{height:7px;width:100%;background:var(--warm-deep);border-radius:5px;overflow:hidden;}
.yr-fill{height:100%;background:var(--accent);border-radius:5px;}

/* grid */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;margin-bottom:14px;}
.c4{grid-column:span 4;}.c5{grid-column:span 5;}.c6{grid-column:span 6;}.c7{grid-column:span 7;}.c12{grid-column:span 12;}

/* tile — whole card is the entrance to its page */
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 21px;box-shadow:0 1px 2px rgba(60,50,30,.03);transition:box-shadow .18s,transform .18s;cursor:pointer;}
.tile:hover{box-shadow:0 8px 26px rgba(60,50,30,.09);transform:translateY(-2px);}
.tile.lead{border-color:var(--accent-line);box-shadow:0 6px 26px rgba(176,153,224,.14);}
.tile-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
.ttl{font-family:'Fraunces',serif;font-size:var(--fs-title);font-weight:560;letter-spacing:-.2px;display:flex;align-items:center;gap:9px;min-width:0;white-space:nowrap;}
.chip:empty{display:none;}
.ey-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0;}
.head-right{display:flex;align-items:center;gap:9px;flex-shrink:0;}
.go{width:27px;height:27px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px;transition:all .16s;background:var(--warm);}
.tile:hover .go{background:var(--accent-soft);color:var(--accent-deep);transform:translateX(2px);}
.divider{height:1px;background:var(--hair);margin:15px 0;}

/* secondary (external / extra) links — stop the card click */
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.lnk{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:11px;font-size:12px;font-weight:600;text-decoration:none;cursor:pointer;transition:all .14s;border:1px solid var(--line);color:var(--muted);background:transparent;}
.lnk:hover{color:var(--ink);border-color:var(--accent-line);}
.lnk.go-lnk{background:var(--accent-soft);color:var(--accent-deep);border-color:var(--accent-line);}
.lnk.go-lnk:hover{background:#e7defa;}

/* status chip */
.chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.chip-ok{background:var(--ok-bg);color:var(--ok);}
.chip-warn{background:var(--warn-bg);color:var(--warn);}
.chip-over{background:var(--over-bg);color:var(--over);}
.chip-mut{background:var(--warm);color:var(--muted);}

/* empty state */
.empty-line{padding:14px 2px;color:var(--muted);font-size:12.5px;font-style:italic;line-height:1.5;}

/* split (learning) */
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;}
.col-hdr{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.ring-row{display:flex;align-items:center;gap:11px;padding:8px 0;}
.ring-row + .ring-row{border-top:1px solid var(--hair);}
.ring{flex-shrink:0;transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--warm-deep);stroke-width:3.5;}
.ring-fl{fill:none;stroke-width:3.5;stroke-linecap:round;}
.ring-pct{transform:rotate(90deg);font-family:'Fraunces',serif;font-size:9px;font-weight:600;text-anchor:middle;dominant-baseline:middle;}
.ring-name{font-size:var(--fs-strong);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ring-sub{font-size:11.5px;font-weight:600;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* languages strip */
.lang-strip{display:flex;gap:8px;flex-wrap:wrap;}
.lang-chip{display:flex;align-items:center;gap:7px;background:var(--warm);border:1px solid var(--hair);border-radius:11px;padding:6px 11px;font-size:12px;font-weight:600;text-decoration:none;color:inherit;cursor:pointer;transition:all .14s;}
.lang-chip:hover{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent-deep);}
.lang-chip small{color:var(--muted);font-weight:600;}

/* bills due */
.due{display:flex;align-items:center;gap:11px;padding:9px 0;}
.due + .due{border-top:1px solid var(--hair);}
.due-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);}
.due-main{flex:1;min-width:0;}
.due-name{font-weight:650;font-size:var(--fs-strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.due-date{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:1px;}
.due-btn{font-size:11.5px;font-weight:700;text-decoration:none;color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:5px 10px;white-space:nowrap;transition:all .14s;}
.due-btn:hover{color:var(--accent-deep);border-color:var(--accent-line);background:var(--accent-soft);}
.due-check{width:28px;height:28px;border-radius:9px;border:1.5px solid var(--line);background:#fff;color:#c9bfab;font-size:13px;font-weight:800;cursor:pointer;flex-shrink:0;transition:all .14s;font-family:inherit;}
.due-check:hover{border-color:var(--ok);color:var(--ok);background:var(--ok-bg);}
.due-more{font-size:11.5px;color:var(--muted);font-weight:600;padding-top:8px;}
.fin-foot{display:flex;align-items:center;gap:12px;margin-top:12px;padding-top:13px;border-top:1px solid var(--hair);font-size:11.5px;color:var(--muted);font-weight:600;}
.fin-foot:empty{display:none;}
.fin-bar{flex:0 0 120px;height:6px;border-radius:4px;background:var(--warm-deep);overflow:hidden;}
.fin-bar div{height:100%;background:var(--ok);border-radius:4px;}

/* tiles that aren't a doorway to a page */
.tile.static{cursor:default;}
.tile.static:hover{transform:none;box-shadow:0 1px 2px rgba(60,50,30,.03);}
.mini-btn{border:1px solid var(--line);background:transparent;color:var(--muted);font:700 11.5px 'Plus Jakarta Sans',sans-serif;padding:5px 11px;border-radius:9px;cursor:pointer;transition:all .14s;}
.mini-btn:hover{color:var(--ink);border-color:var(--accent-line);}
.mini-btn.solid{background:var(--ink);border-color:var(--ink);color:#fff;}
.mini-btn.solid:hover{background:#000;}

/* quick links */
.ql-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;}
.ql{position:relative;display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:12px;background:var(--warm);border:1px solid transparent;text-decoration:none;color:var(--ink);font-size:12.5px;font-weight:650;min-width:0;transition:all .14s;}
.ql:hover{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-deep);}
.ql-ic{position:relative;width:24px;height:24px;border-radius:7px;background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--accent-deep);overflow:hidden;box-shadow:0 0 0 1px var(--line);}
.ql-ic img{position:absolute;inset:4px;width:16px;height:16px;background:#fff;}
.ql-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ql-ord{display:none;}
.editing .ql-grid{grid-template-columns:1fr;gap:6px;}
.editing .ql{padding-right:76px;background:#fff;border-color:var(--line);color:var(--ink);cursor:default;}
.editing .ql-ord{display:flex;gap:2px;position:absolute;right:6px;top:50%;transform:translateY(-50%);}
.ql-ord button{width:19px;height:22px;border:none;border-radius:6px;background:var(--warm);color:var(--muted);cursor:pointer;font-size:13px;line-height:1;font-family:inherit;}
.ql-ord button:hover{background:var(--warm-deep);color:var(--ink);}
.ql-ord .ql-x:hover{background:var(--over-bg);color:var(--over);}
.ql-add{display:none;gap:7px;margin-top:12px;}
.editing .ql-add{display:flex;}
.ql-in{flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font:500 12.5px 'Plus Jakarta Sans',sans-serif;color:var(--ink);}
.ql-in:first-child{flex:0 0 32%;}
.ql-in:focus{outline:none;border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft);}
.ql-hint{margin-top:12px;font-size:11px;color:var(--muted);}
.ql-hint b{font-weight:700;background:var(--warm);border-radius:5px;padding:1px 5px;}
.editing .ql-hint{display:none;}

/* fitness */
.wo{font-family:'Fraunces',serif;font-size:17px;font-weight:560;}
.wo-sub{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px;margin-bottom:14px;}
.nn{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;background:var(--warm);font-size:13px;font-weight:600;margin-bottom:6px;cursor:pointer;transition:background .15s;}
.nn:hover{background:var(--warm-deep);}
.nn.done{background:var(--ok-bg);color:var(--ok);}
.box{width:18px;height:18px;border-radius:6px;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;background:#fff;}
.nn.done .box{background:var(--ok);border-color:var(--ok);color:#fff;}

/* reading & watching — a little shelf of covers */
.shelf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;}
.shelf-item{min-width:0;}
.cv{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;box-shadow:0 1px 2px rgba(60,50,30,.08),0 6px 16px rgba(60,50,30,.10);margin-bottom:9px;transition:transform .18s;}
.tile:hover .cv{transform:translateY(-1px);}
.cv img,.cv .gen{position:absolute;inset:0;width:100%;height:100%;}
.cv img{object-fit:cover;}
.cv .gen{display:flex;align-items:flex-end;padding:10px 9px;}
.cv .gen::before{content:"";position:absolute;left:7px;top:0;bottom:0;width:1px;background:rgba(255,255,255,.55);}
.cv .gen b{font-family:'Fraunces',serif;font-weight:600;font-size:13px;line-height:1.15;color:#3a3226;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;}
.sh-t{font-size:12.5px;font-weight:700;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.sh-a{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sh-bar{height:4px;border-radius:3px;background:var(--warm-deep);margin-top:7px;overflow:hidden;}
.sh-bar div{height:100%;background:var(--accent);border-radius:3px;}
.sh-p{font-size:10.5px;font-weight:700;color:var(--muted);margin-top:5px;letter-spacing:.02em;}
.sh-p.on{color:var(--accent-deep);}
.up-next{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;margin-top:15px;padding-top:13px;border-top:1px solid var(--hair);font-size:12px;color:var(--muted);}
.up-next span{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-right:4px;}
.up-next b{font-weight:600;color:var(--ink);}
.up-next i{font-style:normal;color:#cfc6b4;}

/* language challenge */
.lc-hero{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px;}
.lc-day{font-family:'Fraunces',serif;font-size:15px;font-weight:560;color:var(--muted);}
.lc-day b{font-size:34px;font-weight:600;color:var(--ink);letter-spacing:-.5px;margin-left:3px;}
.lc-streak{font-size:11.5px;font-weight:700;color:var(--warn);}
.lc-bar{height:6px;border-radius:4px;background:var(--warm-deep);overflow:hidden;margin-bottom:14px;}
.lc-bar div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-deep));border-radius:4px;}
.lc-l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lc-open{font-size:11px;font-weight:700;color:var(--accent-deep);text-decoration:none;padding:3px 8px;border-radius:7px;background:#fff;border:1px solid var(--accent-line);white-space:nowrap;}
.lc-open:hover{background:var(--accent-soft);}
.nn.done .lc-open{border-color:transparent;background:rgba(255,255,255,.6);color:var(--ok);}
.lc-cta-t{font-family:'Fraunces',serif;font-size:17px;font-weight:560;margin-bottom:4px;}
.lc-cta-s{font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:14px;}

/* dc guide */
.dc{display:flex;align-items:center;gap:11px;padding:9px 0;}
.dc + .dc{border-top:1px solid var(--hair);}
.dc-ic{width:26px;height:26px;border-radius:8px;background:var(--warm);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.dc-n{flex:1;min-width:0;}
.dc-t{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dc-s{font-size:11px;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ───────── RIGHT PANEL — TODAY ───────── */
.right{position:fixed;right:0;top:0;bottom:0;width:var(--rp-w);background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;padding:22px 20px;overflow-y:auto;z-index:100;}
.right::-webkit-scrollbar{width:0;}
.rp-head{font-family:'Fraunces',serif;font-size:21px;font-weight:600;}
.rp-sub{font-size:11.5px;color:var(--muted);font-weight:600;margin:2px 0 16px;}
.mini{margin-bottom:18px;}
.mini-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
.mini-mo{font-size:13px;font-weight:700;}
.mini-nav{display:flex;gap:4px;}
.mini-nav button{width:24px;height:24px;border:none;background:var(--warm);border-radius:7px;cursor:pointer;color:var(--muted);font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;transition:background .14s,color .14s;}
.mini-nav button:hover{background:var(--warm-deep);color:var(--ink);}
.mini-today{width:auto !important;padding:0 9px;color:var(--accent-deep) !important;font-size:10.5px !important;font-weight:800;}
.mini-today:hover{background:var(--accent-soft) !important;color:var(--accent-deep) !important;}
.mini-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center;}
.mini-dow{font-size:9px;font-weight:700;color:var(--muted);padding-bottom:4px;}
.mini-d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;border-radius:50%;position:relative;cursor:pointer;}
.mini-d:hover{background:var(--warm);}
.mini-d.mut{color:#cfc6b4;}
.mini-d.sel:not(.today){box-shadow:inset 0 0 0 1.5px var(--accent-deep);color:var(--accent-deep);font-weight:800;}
.mini-d.today{background:var(--accent);color:#fff;font-weight:800;}
.mini-d .ev{position:absolute;bottom:3px;width:3px;height:3px;border-radius:50%;background:var(--accent-deep);}
.mini-d.today .ev{background:#fff;}
.rp-sec{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:6px 0 9px;display:flex;align-items:center;justify-content:space-between;}
.rp-add{border:none;background:var(--warm);color:var(--accent-deep);font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px;cursor:pointer;text-decoration:none;}
.rp-add:hover{background:var(--accent-soft);}
.task{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:10px;cursor:pointer;transition:background .14s;}
.task:hover{background:var(--warm);}
.task.done .tx{text-decoration:line-through;color:var(--muted);}
.t-box{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;background:#fff;}
.task.done .t-box{background:var(--accent);border-color:var(--accent);color:#fff;}
.tx{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.t-due{font-size:10px;font-weight:700;padding:2px 7px;border-radius:7px;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;}
.t-del{margin-left:auto;border:none;background:transparent;color:var(--muted);font-size:12px;line-height:1;cursor:pointer;padding:3px 5px;border-radius:6px;flex-shrink:0;font-family:inherit;opacity:.5;transition:opacity .14s,background .14s,color .14s;}
.t-del:hover{opacity:1;background:var(--warm-deep);color:var(--over,#cf5d72);}
.sched{display:flex;flex-direction:column;gap:7px;margin-top:4px;}
.ev-row{display:grid;grid-template-columns:46px 1fr;gap:9px;align-items:start;}
.ev-time{font-size:10px;color:var(--muted);font-weight:700;padding-top:9px;}
.ev-time.now{background:var(--accent);color:#fff;border-radius:7px;text-align:center;padding:3px 4px;width:fit-content;}
.ev-card{background:var(--warm);border-radius:11px;padding:9px 11px;display:flex;gap:9px;align-items:flex-start;border-left:3px solid var(--cat,#b099e0);}
.ev-dot{width:7px;height:7px;border-radius:50%;background:var(--cat,#b099e0);margin-top:5px;flex-shrink:0;}
.ev-t{font-size:12.5px;font-weight:700;line-height:1.3;}
.ev-l{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:1px;}
.mini-d.has-ev{} /* clickable days inherit pointer from .mini-d */
.qa{background:var(--warm);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:-4px 0 16px;}
.qa-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
.qa-date{font-size:12px;font-weight:800;color:var(--accent-deep);}
.qa-x{border:none;background:transparent;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 2px;}
.qa-x:hover{color:var(--ink);}
.qa-exist{display:flex;flex-direction:column;gap:4px;margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid var(--line);}
.qa-ev{font-size:11.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px;}
.qa-ev-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.qa-in{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;font-family:inherit;font-size:12.5px;color:var(--ink);margin-bottom:7px;}
.qa-in:focus{outline:none;border-color:var(--accent-line);}
.qa-row{display:flex;gap:7px;}
.qa-row .qa-in{flex:1;min-width:0;}
.qa-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px;}
.qa-save{border:none;background:var(--accent);color:#fff;font-weight:700;font-size:12px;padding:8px 14px;border-radius:9px;cursor:pointer;font-family:inherit;transition:background .14s;}
.qa-save:hover{background:var(--accent-deep);}
.qa-more{font-size:11px;font-weight:700;color:var(--muted);text-decoration:none;white-space:nowrap;}
.qa-more:hover{color:var(--accent-deep);}

/* ───────── HELPERS ───────── */
function lsGet(key){try{var r=localStorage.getItem(key);return r?JSON.parse(r):null;}catch(e){return null;}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function todayMidnight(){var d=new Date();d.setHours(0,0,0,0);return d;}
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function daysUntilISO(iso){if(!iso)return null;var d=new Date(iso+'T00:00:00');return Math.round((d-todayMidnight())/86400000);}
function fmtG(n){var r=Math.round(n*10)/10;return r%1?r.toFixed(1):String(Math.round(r));}

/* ───────── LEARNING & CLASSES (classTracker1 + profDevData2) ───────── */
function ringRow(pct,name,sub,subColor){
  var off=(113.1*(1-pct/100)).toFixed(1);
  return '<div class="ring-row">'+
    '<svg class="ring" width="40" height="40" viewBox="0 0 44 44"><circle class="ring-bg" cx="22" cy="22" r="18"/>'+
    '<circle class="ring-fl" cx="22" cy="22" r="18" stroke="#9a7fd4" stroke-dasharray="113.1" stroke-dashoffset="'+off+'"/>'+
    '<text class="ring-pct" x="22" y="23" fill="#9a7fd4">'+pct+'%</text></svg>'+
    '<div style="min-width:0;"><div class="ring-name">'+esc(name)+'</div>'+
    '<div class="ring-sub" style="color:'+subColor+'">'+esc(sub)+'</div></div></div>';
}
function renderLearning(){
  var db=lsGet('classTracker1'); var classes=db?(Array.isArray(db)?db:(db.classes||[])):[];
  var enrolled=document.getElementById('enrolled-list'); var dueSoon=0;
  if(!classes.length){enrolled.innerHTML=emptyRow('No classes yet.');}
  else{
    enrolled.innerHTML=classes.slice(0,2).map(function(c){
      var done=0,total=0,next=null;
      (c.modules||[]).forEach(function(m){(m.tasks||[]).forEach(function(t){
        total++; if(t.done){done++;return;}
        var eff=t.due||m.due||'';
        if(!next || (eff && (!next.eff || eff<next.eff))) next={label:t.label,eff:eff};
      });});
      var pct=total?Math.round(done/total*100):0;
      var sub='All done ✓', col='var(--ok)';
      if(next){
        var d=next.eff?daysUntilISO(next.eff):null;
        if(d!==null&&d<=3)dueSoon++;
        sub=next.label+(d!==null?' · '+d+'d':'');
        col=(d!==null&&d<=3)?'var(--warn)':'var(--muted)';
      }
      return ringRow(pct,c.name||'Class',sub,col);
    }).join('');
  }
  var chip=document.getElementById('learn-chip');
  chip.textContent=dueSoon?dueSoon+' due soon':'on track';
  chip.className='chip '+(dueSoon?'chip-warn':'chip-mut');

  var progs=lsGet('profDevData2'); if(!Array.isArray(progs))progs=[];
  /* front page priority is driven by STATUS: active first, then on hold, then queued.
     within a status, the program with the most work left surfaces first (so new/in-progress
     work rises and nearly-finished stale programs sink). No dates involved. */
  var RANK={active:0,hold:1,queued:2};
  var picks=progs.map(function(p){
    var cs=p.courses||[];
    var pct=cs.length?Math.round(cs.reduce(function(s,c){return s+(c.pct||0);},0)/cs.length):0;
    var remaining=cs.filter(function(c){return (c.pct||0)<100;}).length;
    return {name:p.name,pct:pct,total:cs.length,remaining:remaining,status:(p.status||'active')};
  }).sort(function(a,b){
    var ra=(a.status in RANK)?RANK[a.status]:0, rb=(b.status in RANK)?RANK[b.status]:0;
    if(ra!==rb)return ra-rb;
    return a.pct-b.pct;
  }).slice(0,2);
  var ss=document.getElementById('selfstudy-list');
  if(!picks.length){ss.innerHTML=emptyRow('No programs yet.');return;}
  var STAG={active:'',hold:'On hold · ',queued:'Queued · '};
  ss.innerHTML=picks.map(function(p){
    var base=p.remaining>0?(p.remaining+' of '+p.total+' courses left'):'complete ✓';
    return ringRow(p.pct,p.name,(STAG[p.status]||'')+base,'var(--muted)');
  }).join('');
}

/* ───────── FINANCES (finTrackerState2) ───────── */
function daysUntilDay(day){
  var now=todayMidnight();
  var due=new Date(now.getFullYear(),now.getMonth(),day);
  if(due<now)due=new Date(now.getFullYear(),now.getMonth()+1,day);
  return Math.ceil((due-now)/86400000);
}
function dueStr(day){
  var now=todayMidnight();
  var due=new Date(now.getFullYear(),now.getMonth(),day);
  if(due<now)due=new Date(now.getFullYear(),now.getMonth()+1,day);
  return MS[due.getMonth()]+' '+due.getDate();
}
var FIN_SK='finTrackerState2';
function finMonthKey(){var n=new Date();return n.getFullYear()+'-'+(n.getMonth()+1);}
/* same rules as the Finances page: a new month clears every paid flag */
function finLoad(){
  var s=lsGet(FIN_SK); if(!s||!Array.isArray(s.cards))return null;
  if(s.lastReset&&s.lastReset!==finMonthKey()){
    s.cards.forEach(function(c){c.paid=false;c.paid2=false;});
    s.lastReset=finMonthKey();
    try{localStorage.setItem(FIN_SK,JSON.stringify(s));}catch(e){}
  }
  return s;
}
function finMarkPaid(id,which,ev){
  ev.stopPropagation();
  var s=finLoad(); if(!s)return;
  var c=s.cards.find(function(x){return x.id===id;}); if(!c)return;
  c[which]=!c[which];
  s.lastReset=finMonthKey();
  try{localStorage.setItem(FIN_SK,JSON.stringify(s));}catch(e){}
  renderFinances();
}
function renderFinances(){
  var s=finLoad(); var cards=s?s.cards:[];
  var el=document.getElementById('fin-list'), chip=document.getElementById('fin-chip'), foot=document.getElementById('fin-foot');
  if(!s){
    chip.textContent='set up';chip.className='chip chip-mut';
    el.innerHTML=emptyRow('Open Finances once to load your cards — due dates will show up here.');
    foot.innerHTML='';return;
  }
  var rows=[],paidCount=0,activeCount=0;
  cards.forEach(function(c){
    if(!c.active)return; activeCount++;
    if(c.paid)paidCount++;
    if(c.day&&!c.paid)rows.push({c:c,kind:'Statement',which:'paid',day:c.day,d:daysUntilDay(c.day)});
    if(c.day2&&!c.paid2)rows.push({c:c,kind:'Mid-cycle',which:'paid2',day:c.day2,d:daysUntilDay(c.day2)});
  });
  rows.sort(function(a,b){return a.d-b.d;});
  var soon=rows.filter(function(r){return r.d<=7;}).length;
  chip.textContent=soon?soon+' due this week':(rows.length?'nothing urgent':'all paid');
  chip.className='chip '+(soon?'chip-over':(rows.length?'chip-mut':'chip-ok'));
  if(!rows.length){el.innerHTML=emptyRow('Every card is paid for this month. Nice.');}
  else el.innerHTML=rows.slice(0,6).map(function(r){
    var cls=r.d<=3?'chip-over':(r.d<=7?'chip-warn':'chip-mut');
    var when=r.d===0?'today':(r.d===1?'tomorrow':'in '+r.d+'d');
    var pay=r.c.url?'<a class="due-btn" href="'+esc(r.c.url)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">Pay ↗</a>':'';
    return '<div class="due"><span class="due-dot" style="background:'+esc(r.c.color||'#d8cdea')+'"></span>'+
      '<div class="due-main"><div class="due-name">'+esc(r.c.name)+'</div><div class="due-date">'+r.kind+' · '+dueStr(r.day)+'</div></div>'+
      '<span class="chip '+cls+'">'+when+'</span>'+pay+
      '<button class="due-check" title="Mark paid" aria-label="Mark '+esc(r.c.name)+' paid" onclick="finMarkPaid(\''+esc(r.c.id)+'\',\''+r.which+'\',event)">✓</button></div>';
  }).join('')+(rows.length>6?'<div class="due-more">+'+(rows.length-6)+' more in Finances</div>':'');
  var pct=activeCount?Math.round(paidCount/activeCount*100):0;
  foot.innerHTML='<div class="fin-bar"><div style="width:'+pct+'%"></div></div><span>'+paidCount+' of '+activeCount+' statements paid this month</span>';
}

/* ───────── QUICK LINKS (brain2QuickLinks1 — also listed in the Ctrl K jump menu) ───────── */
var QL_SK='brain2QuickLinks1';
var QL_DEFAULT=[
  {id:'q1',name:'SoFi',url:'https://login.sofi.com/'},

];

function qlLoad(){var l=lsGet(QL_SK);if(!Array.isArray(l)){l=QL_DEFAULT.slice();qlSave(l);}return l;}
function qlSave(l){try{localStorage.setItem(QL_SK,JSON.stringify(l));}catch(e){}}
function qlHost(u){try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return '';}}
function renderQuickLinks(){
  var l=qlLoad(), g=document.getElementById('ql-grid');
  document.getElementById('ql-tile').classList.toggle('editing',qlEditing);
  document.getElementById('ql-edit').textContent=qlEditing?'Done':'Edit';

var MEDIA_TYPES=[
  {key:'books',   icon:IC_BOOK, prog:'progress', queue:'want', labels:{progress:'Reading',  want:'Up Next'}},
  {key:'screen',  icon:IC_FILM, prog:'progress', queue:'want', labels:{progress:'Watching', want:'Up Next'}},

];
function pickRR(pools,limit){
  var out=[],idx=0,added=true;
  while(out.length<limit&&added){
    added=false;
    for(var i=0;i<pools.length;i++){
      if(pools[i][idx]){out.push(pools[i][idx]);added=true;if(out.length>=limit)return out;}
    }
    idx++;
  }
  return out;
}
var COVER_TONES=[['#efe6fb','#d9c8f3'],['#fbe7ea','#f2c9d1'],['#e5f0e8','#c6dfcd'],['#fbefdc','#f1d6ac'],['#e4eef6','#c4d8ea'],['#f4e7f3','#e3c6e1']];
function coverTone(t){var h=0;t=String(t||'');for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))>>>0;return COVER_TONES[h%COVER_TONES.length];}
function coverHtml(it){
  var tone=coverTone(it.title);
  var gen='<span class="gen" style="background:linear-gradient(160deg,'+tone[0]+','+tone[1]+')"><b>'+esc(it.title)+'</b></span>';
  return '<div class="cv">'+gen+(it.cover?'<img src="'+esc(it.cover)+'" alt="" loading="lazy" onerror="this.remove()">':'')+'</div>';
}
function mediaProgress(t,it){
  if(t.key==='books'){
    var tot=+it.pages||0, at=+it.progress||0;
    if(tot&&at)return {pct:Math.min(100,Math.round(at/tot*100)),txt:'p. '+at+' of '+tot};
    return {pct:null,txt:'Reading'};
  }
  if(t.key==='screen'){
    if(SCREEN_SERIES.indexOf(it.category)>=0||it.kind==='tv')return {pct:null,txt:'S'+(it.season||1)+' · E'+(it.episode||1)};
    return {pct:null,txt:'Watching'};
  }
  if(t.key==='videos'&&it.epCurrent)return {pct:null,txt:'Ep '+it.epCurrent};
  return {pct:null,txt:t.labels.progress};
}
function renderMedia(){
  var d=lsGet('mediaTracker3')||{};
  var now=[],next=[],yr=String(new Date().getFullYear()),readYr=0;
  MEDIA_TYPES.forEach(function(t){
    (d[t.key]||[]).forEach(function(it){
      if(it.status===t.prog)now.push({t:t,it:it});
      else if(it.status===t.queue&&(t.key==='books'||t.key==='screen'))next.push({t:t,it:it});
      if(t.key==='books'&&it.status==='done'&&String(it.date||'').slice(0,4)===yr)readYr++;
    });
  });
  // books and screen first, then everything else
  var ORDER={books:0,screen:1,videos:2,articles:3,music:4};
  now.sort(function(a,b){return ORDER[a.t.key]-ORDER[b.t.key];});
  var chip=document.getElementById('media-chip');
  chip.textContent=readYr+' read in '+yr; chip.className='chip '+(readYr?'chip-ok':'chip-mut');
  var el=document.getElementById('media-list');
  if(!now.length&&!next.length){el.innerHTML=emptyRow('Nothing on the go — add a book or a show in Books & Screen.');return;}
  var shelf=(now.length?now:next).slice(0,4).map(function(p){
    var it=p.it, isNow=p.it.status===p.t.prog, pr=isNow?mediaProgress(p.t,it):{pct:null,txt:'Up next'};
    return '<div class="shelf-item">'+coverHtml(it)+
      '<div class="sh-t">'+esc(it.title)+'</div>'+
      (it.creator?'<div class="sh-a">'+esc(it.creator)+'</div>':'')+
      (pr.pct!=null?'<div class="sh-bar"><div style="width:'+pr.pct+'%"></div></div>':'')+
      '<div class="sh-p'+(isNow?' on':'')+'">'+esc(pr.txt)+'</div></div>';
  }).join('');
  var upNext=now.length&&next.length?'<div class="up-next"><span>Up next</span>'+next.slice(0,3).map(function(p){return '<b>'+esc(p.it.title)+'</b>';}).join('<i>·</i>')+'</div>':'';
  el.innerHTML='<div class="shelf">'+shelf+'</div>'+upNext;
}

  var isToday=(iso===dateKey(new Date()));
  var rh=document.getElementById('rp-head'); if(rh)rh.textContent=isToday?'Today':DF[d.getDay()];
  var rd=document.getElementById('rp-date'); if(rd)rd.textContent=MF[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();

  var all=calEvents().filter(function(e){return e.date===iso;});
  var untimed=all.filter(function(e){return !e.time;});
  var timed=all.filter(function(e){return e.time;}).sort(function(a,b){return (a.time||'').localeCompare(b.time||'');});
  var clsItems=classEvents().filter(function(e){return e.date===iso;});
  var studyItems=studyEvents().filter(function(e){return e.date===iso;});

  var tasksHtml=untimed.map(function(e){
    var col=catColor(e.cat);
    var bs=e.done ? ('border-color:'+col+';background:'+col+';color:#fff;') : ('border-color:'+col+';');
    return '<div class="task'+(e.done?' done':'')+'" onclick="dayToggleDone(\''+e.id+'\')" title="'+esc(catLabel(e.cat))+'">'+
      '<span class="t-box" style="'+bs+'">'+(e.done?'✓':'')+'</span><span class="tx">'+esc(e.title)+'</span>'+
      '<button class="t-del" onclick="event.stopPropagation();dayDeleteEvent(\''+e.id+'\')" aria-label="Delete task" title="Delete">✕</button></div>';
  }).join('')+clsItems.map(function(e){
    return '<div class="task'+(e.done?' done':'')+'" onclick="location.href=\'learning/\'" style="cursor:pointer" title="'+esc(e.cls)+' — manage in Learning">'+
      '<span class="t-box" style="border-color:'+e.color+';background:'+e.color+';color:#fff;">'+IC_CAP+'</span>'+
      '<span class="tx">'+esc(e.title)+'</span><span class="t-due chip-mut">'+esc(e.cls)+'</span></div>';
  }).join('')+studyItems.map(function(e){
    return '<div class="task'+(e.done?' done':'')+'" onclick="location.href=\'learning/\'" style="cursor:pointer" title="'+esc(e.plan)+' — manage in Learning">'+
      '<span class="t-box" style="border-color:'+e.color+';background:'+e.color+';color:#fff;font-size:9px;">✦</span>'+
      '<span class="tx">'+esc(e.title)+'</span><span class="t-due chip-mut">'+esc(e.plan)+'</span></div>';
  }).join('');

  var schedHtml=timed.length?timed.map(function(e){
    return '<div class="ev-row"><div class="ev-time">'+fmtTime(e.time)+'</div>'+
      '<div class="ev-card" style="--cat:'+catColor(e.cat)+';"><div class="ev-dot"></div><div>'+
      '<div class="ev-t">'+esc(e.title)+'</div>'+
      (e.note?'<div class="ev-l">'+esc(e.note)+'</div>':(e.cat?'<div class="ev-l">'+esc(catLabel(e.cat))+'</div>':''))+
      '</div>'+
      '<button class="t-del" onclick="event.stopPropagation();dayDeleteEvent(\''+e.id+'\')" aria-label="Delete event" title="Delete">✕</button>'+
      '</div></div>';
  }).join(''):'';

  var opts=HP_CATS.map(function(c){return '<option value="'+esc(c.id)+'"'+(c.id===lastCatSel?' selected':'')+'>'+esc(c.label)+'</option>';}).join('');
  var secHtml='';
  if(tasksHtml) secHtml+='<div class="qa-sec">Tasks</div><div class="qa-list">'+tasksHtml+'</div>';
  if(schedHtml) secHtml+='<div class="qa-sec">Schedule</div><div class="sched">'+schedHtml+'</div>';
  if(!secHtml) secHtml='<div class="qa-empty">Nothing for this day yet</div>';

  var composeHtml=composeOpen?('<div class="qa-compose">'+
      '<input id="qa-title" class="qa-in" placeholder="New item \u2014 add a time to schedule it" autocomplete="off" onkeydown="if(event.key===\'Enter\')saveDayEvent()">'+
      '<div class="qa-crow">'+
        '<input id="qa-time" type="time" class="qa-in">'+
        '<select id="qa-cat" class="qa-in">'+opts+'</select>'+
        '<button class="qa-save" onclick="saveDayEvent()">Add</button>'+
      '</div>'+
    '</div>'):'';

  host.innerHTML='<div class="qa">'+secHtml+composeHtml+
    '<div class="qa-foot"><button class="qa-toggle" onclick="toggleCompose()">'+(composeOpen?'Done':'+ Add')+'</button><a class="qa-more" href="calendar/">Open Calendar \u2192</a></div>'+
  '</div>';
}
function toggleCalDone(id){
  var d=lsGet('lifeCalendar1'); if(!d)return;
  var obj=Array.isArray(d)?{events:d}:d;
  var ev=(obj.events||[]).find(function(e){return e.id===id;});
  if(ev){ev.done=!ev.done;localStorage.setItem('lifeCalendar1',JSON.stringify(obj));renderRightPanel();if(dayIso)renderDay();}
}

/* ───────── HERO (greeting + year progress) ───────── */
function renderHero(){
  var now=new Date(), h=now.getHours();
  document.getElementById('greet').textContent=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  var soy=new Date(now.getFullYear(),0,1);
  var doy=Math.floor((now-soy)/86400000)+1;
  var tot=(now.getFullYear()%4===0)?366:365;
  var wk=Math.ceil((doy+soy.getDay())/7);
  var pctExact=(doy/tot*100).toFixed(1);
  document.getElementById('date').textContent=DF[now.getDay()]+', '+MF[now.getMonth()]+' '+now.getDate()+' · Week '+wk;
  document.getElementById('yr-left').textContent=(tot-doy)+' days left';
  document.getElementById('yr-pct').textContent=pctExact+'%';
  document.getElementById('yrfill').style.width=pctExact+'%';
}
