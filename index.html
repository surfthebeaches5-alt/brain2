<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f3ecd8;--surface:#fff;--sidebar:#f8f1dd;--sidebar-line:#e6dec5;
  --ink:#1a1612;--muted:#7a7468;--line:#ececec;--warm:#faf6ec;
  --accent:#c9b6ee;--accent-deep:#b099e0;--accent-soft:#ede5fb;
  --green:#3aaa6a;--green-bg:#d8f0e4;
  --red:#e05070;--red-bg:#fde0e8;
  --amber:#e07a20;--amber-bg:#fdf0d8;
  --blue:#3a8ab0;--blue-bg:#d4eaf7;
  --sb-w:224px;--sb-w-col:54px;
}
html,body{background:var(--bg);font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}
body{display:flex;}

/* ── SIDEBAR ── */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sb-w);background:var(--sidebar);border-right:1px solid var(--sidebar-line);display:flex;flex-direction:column;z-index:200;overflow-y:auto;transition:width .22s ease;}
.sidebar::-webkit-scrollbar{width:0;}
body.collapsed .sidebar{width:var(--sb-w-col);}
body.collapsed .main{margin-left:var(--sb-w-col);}

.sb-toggle{position:absolute;top:16px;left:14px;width:26px;height:26px;display:flex;flex-direction:column;justify-content:center;gap:4px;background:transparent;border:none;cursor:pointer;padding:4px;border-radius:6px;transition:background .15s;z-index:10;}
.sb-toggle:hover{background:rgba(170,145,120,.2);}
.sb-toggle span{display:block;height:1.5px;background:var(--muted);border-radius:1px;transition:all .2s;}
.sb-toggle span:nth-child(1){width:14px;}
.sb-toggle span:nth-child(2){width:11px;}
.sb-toggle span:nth-child(3){width:14px;}

.sb-brand{padding:16px 18px 14px 46px;border-bottom:1px solid var(--sidebar-line);}
.sb-logo{font-family:'Fraunces',serif;font-size:20px;font-weight:600;
