<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Out in DC</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,500;9..144,0,600;9..144,0,700;9..144,1,400;9..144,1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Out in DC — what's around, pick one thing, put it on the calendar, go.
   Merges the old DC Passport (saved spots on a map, key dcPassport1) and DC Guide
   (monthly / anytime suggestions + quick links, key dcGuide1). Tokens come from ../assets/brain.css;
   the category colours below are data colours (they encode the category of a pin / row). */
*{box-sizing:border-box;margin:0;padding:0;}
:root{--shadow:0 1px 2px rgba(60,50,30,.04),0 8px 24px rgba(60,50,30,.05);
  --c-food:#e0855e;--c-drinks:#cf6a7e;--c-arts:#6b8bd0;--c-outdoors:#5f9f72;--c-events:#d79a3c;--c-markets:#a7825a;--c-night:#9a72d0;--c-other:#8a9090;}
html,body{background:var(--bg);font-family:var(--b2-sans,'Plus Jakarta Sans',system-ui,sans-serif);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px;}
button,input,select,textarea{font-family:inherit;}
a{color:inherit;text-decoration:none;}

/* ── title row (brain.css styles .topbar) ── */
.topbar{display:flex;align-items:flex-end;justify-content:space-between;}
.topbar-left{display:flex;align-items:center;gap:14px;}
.topbar-title{font-family:var(--b2-serif);font-size:34px;font-weight:600;}
.topbar-sub{color:var(--muted);font-size:13.5px;font-weight:500;margin-top:8px;}
.topbar-right{display:flex;align-items:center;gap:10px;}
body.b2-shell .topbar .topbar-right{flex-shrink:1;min-width:0;}
.back-btn{display:none;}

/* ── "Find more" dock: the user's DC event sites ── */
.dock{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;position:relative;}
.dock-l{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:750;margin-right:4px;}
.dk{position:relative;width:38px;height:38px;border-radius:11px;background:var(--raised);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font:800 11.5px var(--b2-sans);color:var(--ink-2);box-shadow:0 1px 2px rgba(60,50,30,.05);transition:transform .14s,border-color .14s;flex-shrink:0;}
.dk:hover{transform:translateY(-1px);border-color:var(--accent-line);}
.dk img{position:absolute;inset:0;margin:auto;width:20px;height:20px;border-radius:4px;background:var(--raised);}
.dk .tip{position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font:600 11px var(--b2-sans);padding:4px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;z-index:5;}
.dk:hover .tip{opacity:1;}
.dk.plus{border-style:dashed;color:var(--faint);background:transparent;box-shadow:none;font:500 17px var(--b2-sans);cursor:pointer;}
.dk.plus:hover{color:var(--accent-deep);}

/* ── frame + shared parts ── */
.hub{max-width:1280px;margin:0 auto;padding:20px 40px 80px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 24px;box-shadow:var(--shadow);}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;}
.card-t{font-family:var(--b2-serif);font-size:19px;font-weight:600;letter-spacing:-.2px;}
.card-m{font-size:12px;color:var(--muted);font-weight:600;}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:750;}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 15px;border-radius:10px;font:650 12.5px var(--b2-sans);border:1px solid var(--line);background:var(--raised);color:var(--ink-2);cursor:pointer;white-space:nowrap;transition:border-color .15s,color .15s,opacity .15s;}
.btn:hover{border-color:var(--accent-line);color:var(--accent-deep);}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;}
.btn.primary:hover{opacity:.88;color:#fff;}
.btn.soft{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-deep);}
.btn.ok{background:var(--ok-bg);border-color:var(--ok-bg);color:var(--ok);}
.btn.sm{height:28px;padding:0 11px;font-size:11.5px;border-radius:8px;}
.btn.icon{width:28px;padding:0;justify-content:center;letter-spacing:1px;color:var(--muted);}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block;}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px;margin-top:18px;align-items:start;}
.s7{grid-column:span 7;}.s5{grid-column:span 5;}

/* ── this weekend ── */
.wk{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;padding:18px 24px;margin-bottom:18px;}
.wk .when{padding-right:22px;border-right:1px solid var(--hair);}
.wk .when b{display:block;font-family:var(--b2-serif);font-size:20px;font-weight:600;white-space:nowrap;margin-top:2px;}
.wk .t{font-size:16px;font-weight:700;line-height:1.35;}
.wk .t em{font-style:normal;color:var(--accent-deep);cursor:pointer;}
.wk .t em:hover{text-decoration:underline;}
.wk .s{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:3px;}
.wk .wk-acts{display:flex;gap:8px;}
.wk .t.empty{font-weight:600;color:var(--ink-2);font-size:14.5px;}

/* ── map ── */
.mapcard{padding:0;overflow:hidden;position:relative;isolation:isolate;}
#map{height:470px;background:#efe9da;z-index:0;}
#map.picking{cursor:crosshair;}
#map .leaflet-tile-pane{filter:grayscale(.85) sepia(.2) brightness(1.05) contrast(.86);}
.leaflet-container{font-family:var(--b2-sans);}
.overlay{position:absolute;left:18px;right:18px;top:16px;z-index:500;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;}
.overlay>*{pointer-events:auto;}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;}
.fpill{display:inline-flex;align-items:center;gap:7px;font:600 12.5px var(--b2-sans);padding:6px 12px;border-radius:20px;background:var(--raised);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;cursor:pointer;box-shadow:0 2px 8px rgba(60,50,30,.12);}
.fpill:hover{color:var(--ink);}
.fpill i{width:8px;height:8px;border-radius:50%;}
.fpill small{font-size:11px;color:var(--faint);font-weight:700;}
.fpill.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.fpill.on small{color:rgba(255,255,255,.6);}
.seg{display:inline-flex;gap:2px;padding:3px;background:rgba(255,253,248,.96);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 8px rgba(60,50,30,.12);flex-shrink:0;}
.seg button{padding:6px 12px;border:none;background:transparent;border-radius:9px;font:650 12px var(--b2-sans);color:var(--muted);cursor:pointer;white-space:nowrap;}
.seg button:hover{color:var(--ink);}
.seg button.on{background:var(--ink);color:#fff;}
.legend{position:absolute;left:18px;bottom:14px;z-index:500;display:flex;gap:14px;align-items:center;padding:8px 12px;border-radius:10px;background:rgba(255,253,248,.95);border:1px solid var(--line);font-size:11.5px;font-weight:650;color:var(--muted);}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ink-2);margin-right:6px;vertical-align:-1px;}
.legend i.evp{border-radius:3px;transform:rotate(45deg);}
.pickbar{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:600;display:none;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:12px;background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;box-shadow:0 8px 24px rgba(36,31,23,.25);white-space:nowrap;}
.pickbar.on{display:flex;}
.pickbar b{color:#d9ccf6;}
.pickbar button{height:26px;padding:0 10px;border-radius:7px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;font:650 11.5px var(--b2-sans);cursor:pointer;}
.pin{width:16px;height:16px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .15s;}
.pin.evp{border-radius:5px;transform:rotate(45deg);}
.pin.done{opacity:.45;}
.pin.approx{border-style:dashed;}
.pin.big{width:22px;height:22px;box-shadow:0 0 0 5px rgba(142,113,211,.25),0 1px 4px rgba(0,0,0,.35);}
.leaflet-popup-content-wrapper{border-radius:14px;border:1px solid var(--line);background:var(--surface);box-shadow:0 12px 34px rgba(60,50,30,.18);}
.leaflet-popup-tip{background:var(--surface);}
.leaflet-popup-content{margin:14px 16px;font-size:13px;color:var(--ink);min-width:220px;}
.pp b{font-size:14.5px;font-weight:700;display:block;}
.pp .pm{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:3px 0 10px;line-height:1.45;}
.pp p{font-size:12.5px;color:var(--ink-2);margin:0 0 12px;line-height:1.45;}
.pp .pa{display:flex;gap:6px;flex-wrap:wrap;}
.pp .pl{font-size:11.5px;font-weight:700;color:var(--ok);margin:-4px 0 10px;}
.pp .px{font-size:11.5px;color:var(--muted);margin-top:10px;}
.pp .px a{color:var(--accent-deep);font-weight:650;cursor:pointer;}

/* ── this month list ── */
.tabs{display:inline-flex;gap:2px;padding:4px;background:var(--warm-deep);border-radius:13px;}
.tabs button{padding:5px 11px;border:none;background:transparent;border-radius:10px;font:650 12px var(--b2-sans);color:var(--muted);cursor:pointer;white-space:nowrap;}
.tabs button:hover{color:var(--ink);}
.tabs button.on{background:var(--raised);color:var(--ink);box-shadow:0 1px 3px rgba(60,50,30,.1);}
.ev{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;}
.ev+.ev{border-top:1px solid var(--hair);}
.ev.done .ev-main,.ev.done .date{opacity:.55;}
.date{text-align:center;border-radius:12px;background:var(--warm);padding:7px 0;}
.date span{display:block;font-size:10px;letter-spacing:.12em;font-weight:800;color:var(--muted);white-space:nowrap;}
.date b{display:block;font-family:var(--b2-serif);font-size:19px;font-weight:600;line-height:1.1;}
.date.any b{font-size:12.5px;font-family:var(--b2-sans);font-weight:750;color:var(--ink-2);padding:3px 0;}
.date.any span:empty{display:none;}
.ev .t{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;min-width:0;}
.ev .t .nm{cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ev .t .nm:hover{color:var(--accent-deep);}
.ev .t .dot{width:8px;height:8px;}
.ev .m{font-size:12px;color:var(--muted);font-weight:600;margin-top:3px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.acts{display:flex;gap:6px;align-items:center;justify-content:flex-end;}
.planned{font-size:11.5px;font-weight:700;color:var(--ok);white-space:nowrap;cursor:pointer;}
.planned:hover{text-decoration:underline;}
.planned.past{color:var(--muted);}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--warm);color:var(--muted);white-space:nowrap;}
.chip.ok{background:var(--ok-bg);color:var(--ok);}
.empty-l{padding:22px 4px 10px;color:var(--muted);font-size:13px;line-height:1.55;}
.empty-l b{display:block;font-family:var(--b2-serif);font-style:italic;font-weight:500;font-size:17px;color:var(--ink-2);margin-bottom:4px;}
.addrow{display:flex;align-items:center;gap:8px;margin-top:10px;padding:0 6px 0 12px;height:40px;border-radius:10px;border:1.5px dashed var(--line);color:var(--faint);transition:border-color .15s;}
.addrow:focus-within{border-color:var(--accent-line);border-style:solid;background:var(--raised);}
.addrow b{color:var(--accent-deep);font-size:15px;}
.addrow input{flex:1;min-width:0;border:none;background:transparent;outline:none;font:550 13px var(--b2-sans);color:var(--ink);}
.addrow input::placeholder{color:var(--faint);}
.later{margin-top:12px;font-size:12px;color:var(--muted);font-weight:600;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.later button{border:none;background:var(--warm);color:var(--ink-2);font:650 11.5px var(--b2-sans);padding:3px 9px;border-radius:20px;cursor:pointer;}
.later button:hover,.later button.on{background:var(--accent-soft);color:var(--accent-deep);}

/* ── want to try ── */
.row{display:flex;align-items:center;gap:12px;padding:11px 0;}
.row+.row{border-top:1px solid var(--hair);}
.grow{flex:1;min-width:0;}
.r-t{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
.r-t:hover{color:var(--accent-deep);}
.r-s{font-size:12px;color:var(--muted);font-weight:550;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.want-more{margin-top:8px;border:none;background:none;font:650 12.5px var(--b2-sans);color:var(--accent-deep);cursor:pointer;padding:4px 0;}
.want-more:hover{text-decoration:underline;}
.foot-note{margin-top:12px;}

/* ── floating layers: popover, menus, link editor, toast (all above the nav, which is z 500) ── */
.pop{position:absolute;z-index:1000;width:310px;background:var(--raised);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(60,50,30,.2);padding:16px;display:none;}
.pop.open{display:block;animation:popIn .15s;}
@keyframes popIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.pop .pt{font-family:var(--b2-serif);font-size:16px;font-weight:600;}
.pop .ps{font-size:12px;color:var(--muted);font-weight:600;margin:2px 0 12px;line-height:1.4;}
.dchips{display:flex;gap:6px;margin-bottom:10px;}
.dchips button{flex:1;min-width:0;text-align:center;padding:7px 0;border-radius:10px;border:1px solid var(--line);background:var(--raised);font:700 11.5px var(--b2-sans);color:var(--ink-2);line-height:1.25;cursor:pointer;}
.dchips button small{display:block;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.06em;}
.dchips button:hover:not(:disabled){border-color:var(--accent-line);}
.dchips button.on{background:var(--accent-soft);border-color:var(--accent-deep);color:var(--accent-deep);}
.dchips button.on small{color:var(--accent-deep);}
.dchips button:disabled{opacity:.4;cursor:default;}
.prow{display:flex;gap:8px;margin-bottom:12px;}
.prow > *{flex:1;min-width:0;}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.pmsg{font-size:11.5px;color:var(--over);font-weight:600;margin-top:8px;display:none;}
.f-inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:500 13px var(--b2-sans);color:var(--ink);background:var(--raised);outline:none;transition:border-color .15s,box-shadow .15s;height:38px;}
textarea.f-inp{height:auto;}
.f-inp:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft);}
.menu{position:absolute;z-index:1000;background:var(--raised);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(60,50,30,.16);min-width:170px;padding:6px;display:none;}
.menu.open{display:block;animation:popIn .12s;}
.menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;border:none;background:transparent;font:600 12.5px var(--b2-sans);color:var(--ink-2);cursor:pointer;}
.menu button:hover{background:var(--accent-soft);color:var(--accent-deep);}
.menu button.danger{color:var(--over);}
.menu button.danger:hover{background:var(--over-bg);color:var(--over);}
.links-ed{width:380px;}
.lrow{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
.lrow .f-inp{height:32px;padding:6px 10px;font-size:12.5px;}
.lrow .f-inp:first-child{flex:0 0 36%;}
.lrow button{width:26px;height:26px;border:none;border-radius:7px;background:transparent;color:var(--faint);cursor:pointer;font-size:13px;flex-shrink:0;}
.lrow button:hover{background:var(--warm-deep);color:var(--ink);}
.lrow button.x:hover{background:var(--over-bg);color:var(--over);}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:1200;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:12px;background:var(--ink);color:#fff;font:600 13px var(--b2-sans);box-shadow:0 12px 34px rgba(36,31,23,.3);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:calc(100vw - 32px);}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto;}
.toast button{height:26px;padding:0 10px;border-radius:7px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;font:650 11.5px var(--b2-sans);cursor:pointer;}
.toast button:empty{display:none;}

/* ── modals ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(36,31,23,.28);backdrop-filter:blur(3px);z-index:1100;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;animation:fadeIn .2s;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:18px;border:1px solid var(--line);padding:24px 26px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 30px 70px rgba(36,31,23,.22);}
.modal-title{font-family:var(--b2-serif);font-size:22px;font-weight:600;margin-bottom:18px;letter-spacing:-.3px;}
.f-field{margin-bottom:14px;}
.f-lbl{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:750;margin-bottom:6px;display:block;}
.f-lbl span{color:var(--faint);font-weight:500;letter-spacing:0;text-transform:none;font-size:11px;}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.f-hint{font-size:11.5px;color:var(--muted);margin-top:5px;}
.f-loc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);font-weight:600;}
.f-loc .grow{min-width:140px;}
.m-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--hair);}
.m-del{background:var(--over-bg);border-color:var(--over-bg);color:var(--over);margin-right:auto;}
.m-del:hover{border-color:var(--over);color:var(--over);}
.cat-selector,.tag-picker{display:flex;gap:5px;flex-wrap:wrap;}
.cat-sel-btn,.tag-option{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:none;border-radius:20px;font:600 12px var(--b2-sans);cursor:pointer;background:var(--warm-deep);color:var(--ink-2);transition:background .15s,color .15s;}
.cat-sel-btn::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--c,var(--accent));}
.cat-sel-btn.on{background:var(--ink);color:#fff;}
.tag-option.selected{background:var(--accent-soft);color:var(--accent-deep);box-shadow:0 0 0 1px var(--accent-line) inset;}
.img-preview{width:100%;height:120px;border-radius:10px;object-fit:cover;margin-top:8px;display:none;border:1px solid var(--line);}
.img-preview.show{display:block;}
#sp-geo-status{font-size:12px;margin-top:5px;min-height:16px;}

@media(max-width:1100px){
  .s7,.s5{grid-column:span 12;}
}
@media(max-width:860px){
  body.b2-shell .topbar{flex-wrap:wrap;align-items:flex-start;}
  .hub{padding:16px 16px 60px;}
  .wk{grid-template-columns:1fr;gap:12px;}
  .wk .when{border-right:none;padding-right:0;}
  .overlay{flex-direction:column;}
  .chiprow .fpill{padding:5px 10px;font-size:12px;}
  #map{height:420px;}
  .legend{display:none;}
  .ev{grid-template-columns:48px minmax(0,1fr);}
  .ev .acts{grid-column:2;justify-content:flex-start;}
  .links-ed,.pop{width:calc(100vw - 32px);max-width:380px;}
  .card-h{flex-wrap:wrap;}
  .card:not(.mapcard){padding:18px;}
}
</style>

<body>
<script src="../assets/shell.js?v=1025b"></script>

<!-- TITLE ROW -->
<div class="topbar">
  <div class="topbar-left">
    <a href="../" class="back-btn">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      Brain 2.0

var MON_RX=/\b(?:(early|mid|late)[\s-]+)?(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|june?|july?|aug(?:ust)?|sept?(?:ember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\b\.?(?:\s+(\d{1,2})(?:st|nd|rd|th)?\b(?!\s*(?::|am|pm)))?(?:\s*-\s*(\d{1,2})(?:st|nd|rd|th)?\b(?!\s*(?::|am|pm|\/)))?/gi;

    var days={};
    if(/\bweekends?\b/.test(lo)){days[6]=1;days[0]=1;}
    if(/\bweekdays\b/.test(lo)){[1,2,3,4,5].forEach(function(d){days[d]=1;});}
    var DN={sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
    var rng=/\b(sun|mon|tue|wed|thu|fri|sat)[a-z]*\s*-\s*(sun|mon|tue|wed|thu|fri|sat)[a-z]*/g,m;
    while((m=rng.exec(lo))){var a=DN[m[1]],b=DN[m[2]];for(var i=0;i<7;i++){var d=(a+i)%7;days[d]=1;if(d===b)break;}}

    while((m=one.exec(lo))){var k=(m[1]||m[2]).slice(0,3);days[DN[k]]=1;}

    }

    if(!pts.length)while((m3=nr.exec(t))){var mm=+m3[1]-1,dd=+m3[2];if(mm>=0&&mm<12&&dd>=1&&dd<=31)pts.push({q:'',m:mm,d1:dd,d2:0});}

        if(p.q==='early')return new Date(yr,p.m,end?10:1);
        if(p.q==='mid')return new Date(yr,p.m,end?20:10);
        if(p.q==='late')return new Date(yr,p.m,end?lastDay(yr,p.m):20);
        return new Date(yr,p.m,end?lastDay(yr,p.m):1);

function parseTime(text){
  var m=/(\d{1,2})(?::(\d{2}))?\s*(?:-\s*\d{1,2}(?::\d{2})?\s*)?(am|pm)\b/i.exec(String(text||'').replace(/[–—]/g,'-'));
  if(!m)return '';var h=+m[1]%12;if(m[3].toLowerCase()==='pm')h+=12;return pad(h)+':'+(m[2]||'00');
}

/* ═════════════════ ONE VIEW OF EVERYTHING ═════════════════ */
function spotThing(s){
  var area=s.city&&s.city!=='DC'?{MD:'Maryland',VA:'Virginia'}[s.city]||s.city:'';
  if(!area&&s.lat&&s.lng)area=nearestArea(s.lat,s.lng);
  var cat=SPOT_CATS.find(function(c){return c.val===s.category;})||SPOT_CATS[SPOT_CATS.length-1];
  return {key:'spot:'+s.id,kind:'spot',ref:s,name:s.name||'Untitled',group:cat.group,catLabel:cat.label,hood:area,
    price:(s.tags||[]).indexOf('splurge')>=0?'$$$':'',note:s.note||'',link:s.link||'',tags:s.tags||[],
    lat:s.lat||null,lng:s.lng||null,exact:!!(s.lat&&s.lng),done:!!s.visited,evergreen:true,month:'evergreen',when:null};
}
function itemThing(i){
  var c=CATS.find(function(x){return x.id===i.category;})||CATS[0];
  var ll=(i.lat!=null&&i.lng!=null)?[i.lat,i.lng]:(HOOD_LL[i.hood]||null);
  return {key:'item:'+i.id,kind:'item',ref:i,name:i.name||'Untitled',group:c.group,catLabel:c.label,hood:i.hood&&i.hood!=='Other'?i.hood:'',
    price:i.price||'',note:i.note||'',link:i.link||'',tags:[],lat:ll?ll[0]:null,lng:ll?ll[1]:null,exact:i.lat!=null&&i.lng!=null,
    done:i.status==='done',evergreen:i.month==='evergreen'||i.month==null,month:i.month,when:parseWhen(i.dates,i.month),dates:i.dates||''};
}
var THINGS=[];
function rebuild(){THINGS=spots.map(spotThing).concat(guide.items.map(itemThing));}
function thing(key){return THINGS.find(function(t){return t.key===key;});}
function priceLabel(p){return p==='free'?'Free':(p||'');}

/* planned = a date on the calendar that hasn't passed (and, for local events, still exists) */
function calEvents(){var d=lsGet(CAL_KEY,null);return d?(Array.isArray(d)?d:(d.events||[])):[];}
function planOf(t){
  var r=t.ref;if(!r.plannedFor)return null;
  if(r.plannedVia!=='google'&&r.plannedEventId){if(!calEvents().some(function(e){return e.id===r.plannedEventId;}))return null;}
  var d=fromDk(r.plannedFor);return {date:d,time:r.plannedTime||'',past:d<today()};
}
function planLabel(p){var d=p.date;var near=(d-today())/864e5<7;return (near?DS[d.getDay()]:DS[d.getDay()]+' '+MS[d.getMonth()]+' '+d.getDate())+(p.time?' '+fmtTime(p.time):'');}

/* ═════════════════ THIS WEEKEND ═════════════════
   No AI, no internet: candidates are your own things —
   • guide items whose dates fall on the coming Fri–Sun, or that repeat weekly on those days,
   • everything on your Want to try list (saved spots + anytime items you haven't been to).
   Ranked: actually happening that weekend first, then free / cheaper, then not suggested lately.
   A nearby second thing (same neighborhood or a short walk) is paired with it when there is one.
   dcWeekendSeen1 remembers what was suggested, so it rotates week to week, and "Another idea" cycles. */
function weekendOf(now){
  var d=sod(now),dow=d.getDay();
  var fri=dow===0?addDays(d,5):addDays(d,5-dow);       // Sunday → look at next weekend
  if(dow===6)fri=addDays(d,-1);
  var days=[fri,addDays(fri,1),addDays(fri,2)].filter(function(x){return x>=d;});
  return {fri:fri,sun:addDays(fri,2),days:days,key:dk(fri),next:dow===0};
}
function seenLoad(){var s=lsGet(SEEN_KEY,null);if(!s||!Array.isArray(s.list))s={list:[]};return s;}
function seenSave(s){
  var cut=Date.now()-60*864e5;s.list=s.list.filter(function(e){return e.at>cut;}).slice(-200);lsSet(SEEN_KEY,s);
}
function hash(str){var h=0;for(var i=0;i<str.length;i++){h=(h*31+str.charCodeAt(i))|0;}return Math.abs(h);}
var PRICE_SCORE={free:30,'$':20,'':10,'$$':6,'$$$':0};
function isWant(t){return t.evergreen&&!t.done;}
function weekendCandidates(wk,seen){
  var wkDows=wk.days.map(function(d){return d.getDay();});
  var out=[];
  THINGS.forEach(function(t){
    if(t.done)return;
    var p=planOf(t);if(p&&!p.past)return;                  // already on the calendar
    var c={t:t,score:0,day:null,why:'',happening:false},w=t.when;
    if(w&&w.kind==='weekly'){
      var hit=wk.days.filter(function(d){return w.days.indexOf(d.getDay())>=0;});
      if(!hit.length)return;                                  // e.g. Thursday nights: not a weekend thing
      c.day=pickDay(hit);c.score+=80;c.happening=true;
      c.why=w.days.indexOf(6)>=0&&w.days.indexOf(0)>=0?'every weekend':'every '+DAYS[c.day.getDay()];
    }else if(w&&w.kind==='daily'){c.day=pickDay(wk.days);c.score+=60;c.happening=true;c.why='on every day';}
    else if(w&&w.kind==='dates'){
      var ov=wk.days.filter(function(d){return d>=w.s&&d<=w.e;});
      var len=(w.e-w.s)/864e5;
      if(ov.length){
        c.day=pickDay(ov);
        if(w.precise&&len<=21){c.score+=100;c.happening=true;c.why=len<1?'on '+DS[c.day.getDay()]+' '+MS[c.day.getMonth()]+' '+c.day.getDate():'on through '+DS[w.e.getDay()]+' '+MS[w.e.getMonth()]+' '+w.e.getDate();}
        else if(len<=31){c.score+=45;c.happening=true;c.why='around this weekend';}
        else{c.score+=10;c.why='in season';}
      }else{
        if(!t.evergreen||(w.precise&&len<=21))return;        // dated and not this weekend
        c.score-=30;                                          // out of season ("Best May–Sept")
      }
    }else if(!t.evergreen){
      var months=wk.days.map(function(d){return d.getMonth();});
      if(months.indexOf(t.month)<0)return;
      c.score+=15;c.why='this month';
    }
    if(!c.happening&&!isWant(t)&&t.evergreen)return;
    c.score+=PRICE_SCORE[t.price]!=null?PRICE_SCORE[t.price]:10;
    c.score+=seenPenalty(seen,t.key,wk.key);
    c.score+=(hash(t.key+wk.key)%10)/2;                      // a little week-to-week variety
    if(!c.day)c.day=pickDay(wk.days);
    out.push(c);
  });
  out.sort(function(a,b){return b.score-a.score;});
  return out;
}
function pickDay(list){
  var sat=list.find(function(d){return d.getDay()===6;});if(sat)return sat;
  var sun=list.find(function(d){return d.getDay()===0;});return sun||list[0];
}
function seenPenalty(seen,key,wkKey){
  var p=0,now=Date.now();
  seen.list.forEach(function(e){
    if(e.k!==key)return;
    if(e.wk===wkKey){if(e.skip)p=Math.min(p,-1000-e.skip/1e13);}       // skipped this weekend: to the back, oldest skip first
    else if(now-e.at<28*864e5)p=Math.min(p,now-e.at<14*864e5?-40:-25);  // suggested on a recent weekend
  });
  return p;
}
var RANK={markets:0,outdoors:1,arts:2,events:3,other:3,food:4,drinks:5,night:6};
function rk(g){return RANK[g]!=null?RANK[g]:3;}
function isEat(g){return g==='food'||g==='drinks';}
function findPartner(a,cands,seen,wk){
  if(a.t.lat==null)return null;
  var best=null,bs=-1e9;
  cands.forEach(function(c){
    var t=c.t;if(t===a.t||t.lat==null)return;
    if(!c.happening&&!isWant(t))return;
    var d=km(a.t.lat,a.t.lng,t.lat,t.lng);
    var same=a.t.hood&&t.hood&&a.t.hood===t.hood;
    if(d>1.6&&!same)return;
    if(c.happening&&!c.day)return;
    var s=0;
    if(isEat(a.t.group)!==isEat(t.group))s+=30;else if(a.t.group!==t.group)s+=8;else s-=15;
    if(a.t.group==='night'&&t.group==='night')s-=30;
    s-=d*12;s+=(PRICE_SCORE[t.price]!=null?PRICE_SCORE[t.price]:10)/3;
    s+=Math.max(-60,seenPenalty(seen,t.key,wk.key))/2;
    if(c.happening&&a.happening&&dk(c.day)!==dk(a.day))s-=50;
    var PO={brunch:0,morning:0,afternoon:1,evening:2,night:3};                   // keep the pair to one stretch of the day
    if(Math.abs(PO[partOfDay(a.t)]-PO[partOfDay(t)])>=2)s-=45;
    if(s>bs){bs=s;best=c;}
  });
  return bs>-25?best:null;   // a poor match is worse than a single good idea
}
function isBrunch(t){return t.group==='food'&&(/brunch/i.test(t.note)||(t.tags||[]).indexOf('brunch')>=0);}
// same clock as the Plan it default time, so the headline and the calendar entry agree
function partOfDay(t){
  if(isBrunch(t)&&!(t.when&&t.when.time))return 'brunch';
  var h=+defaultTime(t).split(':')[0];return h<12?'morning':h<17?'afternoon':h<21?'evening':'night';
}
function suggestion(){
  var wk=weekendOf(new Date()),seen=seenLoad();
  var cands=weekendCandidates(wk,seen);
  if(!cands.length)return {wk:wk,none:true};
  var a=cands[0],b=findPartner(a,cands,seen,wk);
  var pair=[a].concat(b?[b]:[]);
  pair.sort(function(x,y){return rk(x.t.group)-rk(y.t.group);});
  if(pair.length>1&&isBrunch(pair[1].t)&&partOfDay(pair[0].t)!=='morning')pair.reverse();   // brunch goes first
  var first=pair[0],second=pair[1]||null;
  var day=a.happening?a.day:(b&&b.happening?b.day:a.day);
  var part=partOfDay(first.t);
  // record what we showed for this weekend (once), so next weekend leans to something else
  var changed=false;
  pair.forEach(function(c){if(!seen.list.some(function(e){return e.k===c.t.key&&e.wk===wk.key;})){seen.list.push({k:c.t.key,wk:wk.key,at:Date.now()});changed=true;}});
  if(changed)seenSave(seen);
  return {wk:wk,a:a,b:b,first:first,second:second,day:day,part:part,count:cands.length};
}
function headline(s){
  var dayName=DAYS[s.day.getDay()];
  var h=s.part==='brunch'?dayName+' brunch: ':dayName+' '+s.part+': ';
  h+='<em data-act="show" data-k="'+esc(s.first.t.key)+'">'+esc(s.first.t.name)+'</em>';
  if(s.second){
    var t=s.second.t,link='<em data-act="show" data-k="'+esc(t.key)+'">'+esc(t.name)+'</em>';
    if(t.group==='food'){var meal=s.part==='morning'||s.part==='brunch'?(isBrunch(t)?'brunch':'lunch'):s.part==='afternoon'?'an early dinner':'dinner';h+=', then '+meal+' at '+link;}
    else if(t.group==='drinks')h+=', then drinks at '+link;
    else h+=', then '+link;
  }
  return h+'?';
}
function reasonLine(s){
  var ts=[s.first.t].concat(s.second?[s.second.t]:[]),bits=[];
  var prices=ts.map(function(t){return t.price;});
  if(prices.every(function(p){return p==='free';}))bits.push('Free');
  else{var known=prices.filter(Boolean).map(priceLabel);if(known.length)bits.push(known.filter(function(v,i,a){return a.indexOf(v)===i;}).join(' + '));}
  var hoods=ts.map(function(t){return t.hood;}).filter(Boolean).filter(function(v,i,a){return a.indexOf(v)===i;});
  if(hoods.length)bits.push(hoods.join(' + '));
  if(s.second&&s.first.t.lat!=null&&s.second.t.lat!=null){
    var mins=Math.round(km(s.first.t.lat,s.first.t.lng,s.second.t.lat,s.second.t.lng)*1.3/5*60);
    if(mins>=3&&mins<=25&&s.first.t.exact&&s.second.t.exact)bits.push(mins+' min walk apart');
  }
  var all=[s.a].concat(s.b?[s.b]:[]);
  all.forEach(function(c){if(c.happening&&c.why)bits.push(all.length>1?esc(c.t.name)+' '+c.why:c.why);});
  var saved=all.filter(function(c){return isWant(c.t);});
  if(saved.length===2)bits.push('you saved both in “Want to try”');
  else if(saved.length===1)bits.push(all.length>1?esc(saved[0].t.name)+' is on your “Want to try”':'you saved it in “Want to try”');
  return bits.map(function(b){return b;}).join(' · ');
}
var currentSug=null;
function renderWeekend(){
  var s=suggestion();currentSug=s;var wk=s.wk;
  var range=wk.days[0],end=wk.sun;
  var label=MS[range.getMonth()]+' '+range.getDate()+(dk(range)===dk(end)?'':' – '+(end.getMonth()!==range.getMonth()?MS[end.getMonth()]+' ':'')+end.getDate());
  var whenHtml='<div class="when"><span class="eyebrow">'+(wk.next?'Next weekend':'This weekend')+'</span><b>'+label+'</b></div>';
  if(s.none){
    $('wk').innerHTML=whenHtml+'<div><div class="t empty">Nothing lined up yet.</div><div class="s">Save a place you want to try, or paste an event you saw — ideas for the weekend come from what you save here.</div></div>'+
      '<div class="wk-acts"><button class="btn primary" type="button" data-act="focus-add">+ Add something</button></div>';
    return;
  }
  $('wk').innerHTML=whenHtml+'<div><div class="t">'+headline(s)+'</div><div class="s">'+reasonLine(s)+'</div></div>'+
    '<div class="wk-acts">'+(s.count>1?'<button class="btn" type="button" data-act="another">Another idea ↻</button>':'')+'<button class="btn primary" type="button" data-act="plan-weekend">Plan it</button></div>';
}
function anotherIdea(){
  if(!currentSug||currentSug.none)return;
  var seen=seenLoad(),wkKey=currentSug.wk.key,seq=Date.now();
  [currentSug.a].concat(currentSug.b?[currentSug.b]:[]).forEach(function(c,i){
    var e=seen.list.find(function(x){return x.k===c.t.key&&x.wk===wkKey;});
    if(!e){e={k:c.t.key,wk:wkKey,at:Date.now()};seen.list.push(e);}
    e.skip=seq+i;
  });
  seenSave(seen);renderWeekend();
}

/* ═════════════════ MAP ═════════════════ */
var map=null,layer=null,markers={},mapGroup='all',mapMode='all',pickCb=null,selKey=null;
function initMap(){
  map=L.map('map',{zoomControl:false,scrollWheelZoom:false,zoomSnap:0.1}).setView([38.9035,-77.031],13.8);
  L.control.zoom({position:'bottomright'}).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);
  layer=L.layerGroup().addTo(map);
  // the wheel zooms the map only after you click into it, so the page still scrolls past it
  map.on('click',function(e){
    map.scrollWheelZoom.enable();
    if(pickCb){var cb=pickCb;stopPick();cb(e.latlng.lat,e.latlng.lng);}
  });
  map.on('mouseout',function(){map.scrollWheelZoom.disable();});
  if(window.ResizeObserver)new ResizeObserver(function(){map.invalidateSize();}).observe($('map'));
}
function evMonth(){return typeof monthTab==='number'?monthTab:today().getMonth();}
function mapThings(){
  var em=evMonth();
  return THINGS.filter(function(t){
    if(t.lat==null||t.lng==null)return false;
    if(mapGroup!=='all'&&t.group!==mapGroup)return false;
    var isEvent=!t.evergreen;
    if(isEvent&&t.month!==em)return false;
    if(mapMode==='month')return isEvent;
    if(mapMode==='want')return isWant(t);
    return true;
  });
}
function pinIcon(t,big){
  var cls='pin'+(t.evergreen?'':' evp')+(t.done?' done':'')+(t.exact?'':' approx')+(big?' big':'');
  var s=big?22:16;
  return L.divIcon({className:'',html:'<div class="'+cls+'" style="background:'+grp(t.group).color+'"></div>',iconSize:[s,s],iconAnchor:[s/2,s/2],popupAnchor:[0,-s/2]});
}
function popupHtml(t){
  var meta=[t.catLabel===grp(t.group).label?t.catLabel:grp(t.group).label,t.hood,priceLabel(t.price)].concat((t.tags||[]).map(tagLabel)).filter(Boolean);
  if(!t.evergreen&&t.dates)meta.push(t.dates);
  var p=planOf(t),k=esc(t.key),link=safeUrl(t.link);
  return '<div class="pp"><b>'+esc(t.name)+'</b><span class="pm">'+esc(meta.join(' · '))+'</span>'+
    (t.note?'<p>'+esc(t.note)+'</p>':'')+
    (p&&!p.past?'<div class="pl">✓ on your calendar · '+esc(planLabel(p))+'</div>':'')+
    '<div class="pa"><button class="btn sm primary" type="button" data-act="plan" data-k="'+k+'">Plan it</button>'+
    (t.done?'<button class="btn sm ok" type="button" data-act="unbeen" data-k="'+k+'">Been ✓</button>':'<button class="btn sm" type="button" data-act="been" data-k="'+k+'">Been ✓</button>')+
    (link?'<a class="btn sm" href="'+esc(link)+'" target="_blank" rel="noopener">Site ↗</a>':'')+
    '<button class="btn sm" type="button" data-act="edit" data-k="'+k+'">Edit</button></div>'+
    (t.kind==='item'?'<div class="px">'+(t.exact?'Pinned exactly · <a data-act="pick" data-k="'+k+'">move pin</a>':'Pin is the middle of '+esc(t.hood)+' · <a data-act="pick" data-k="'+k+'">set exact spot</a>')+'</div>':'')+
    '</div>';
}
function renderMap(){
  if(map){layer.clearLayers();markers={};}
  if(map)mapThings().forEach(function(t){
    var big=t.key===selKey;
    var mk=L.marker([t.lat,t.lng],{icon:pinIcon(t,big),zIndexOffset:big?1000:(t.evergreen?0:200),title:t.name});
    mk.bindPopup(function(){return popupHtml(thing(t.key)||t);},{closeButton:false,offset:[0,-2],maxWidth:300});
    mk.on('click',function(){selKey=t.key;});
    mk.addTo(layer);markers[t.key]=mk;
  });
  // chips: All + the groups that exist
  var pool=THINGS.filter(function(t){return t.lat!=null;});
  var counts={};pool.forEach(function(t){counts[t.group]=(counts[t.group]||0)+1;});
  var g0=mapGroup;mapGroup='all';var allCount=mapThings().length;mapGroup=g0;
  var hasShop=spots.some(function(s){return s.category==='Shop';});
  $('chips').innerHTML='<button class="fpill'+(mapGroup==='all'?' on':'')+'" type="button" data-act="grp" data-g="all">All <small>'+allCount+'</small></button>'+
    GROUPS.filter(function(g){return counts[g.id];}).map(function(g){
      var label=g.id==='markets'&&hasShop?'Markets & shops':g.label;
      return '<button class="fpill'+(mapGroup===g.id?' on':'')+'" type="button" data-act="grp" data-g="'+g.id+'"><i style="background:'+g.color+'"></i>'+esc(label)+'</button>';
    }).join('');
  var mName=MONTHS[evMonth()];
  $('seg').innerHTML=[['all','Everything'],['month',mName],['want','Want to try']].map(function(o){
    return '<button type="button" class="'+(mapMode===o[0]?'on':'')+'" data-act="mode" data-m="'+o[0]+'">'+esc(o[1])+'</button>';}).join('');
  $('legend').innerHTML='<span><i></i>Saved spot</span><span><i class="evp"></i>Happening in '+esc(mName)+'</span>';
}
function showOnMap(key){
  var t=thing(key);if(!t)return;
  if(t.lat==null){startPickFor(key);return;}
  selKey=key;
  if(!t.evergreen&&t.month!==evMonth()&&typeof t.month==='number'){monthTab=t.month;renderMonth();}
  if(mapGroup!=='all'&&mapGroup!==t.group)mapGroup='all';
  if(mapMode==='want'&&!isWant(t))mapMode='all';
  if(mapMode==='month'&&t.evergreen)mapMode='all';
  renderMap();
  var card=document.querySelector('.mapcard');var r=card.getBoundingClientRect();
  if(r.top<70||r.bottom>innerHeight)window.scrollTo({top:scrollY+r.top-90,behavior:'smooth'});
  map.flyTo([t.lat,t.lng],Math.max(map.getZoom(),15),{duration:.6});
  setTimeout(function(){var m=markers[key];if(m)m.openPopup();},650);
}
/* pick a point on the map (exact spot for a guide item, or a place's location from its modal) */
function startPick(text,cb){
  pickCb=cb;$('pick-text').innerHTML=text;$('pickbar').classList.add('on');$('map').classList.add('picking');map.closePopup();
  var card=document.querySelector('.mapcard');var r=card.getBoundingClientRect();
  if(r.top<70||r.bottom>innerHeight)window.scrollTo({top:scrollY+r.top-90,behavior:'smooth'});
}
function stopPick(){pickCb=null;$('pickbar').classList.remove('on');$('map').classList.remove('picking');}
function startPickFor(key){
  var t=thing(key);if(!t)return;
  startPick('Click the map where <b>'+esc(t.name)+'</b> is',function(lat,lng){
    t.ref.lat=+lat.toFixed(5);t.ref.lng=+lng.toFixed(5);
    if(t.kind==='spot')saveSpots();else saveGuide();
    selKey=key;render();toast('Pinned '+t.name);
  });
}

/* ═════════════════ THIS MONTH ═════════════════
   Tabs are computed from today's date: <this month> · <next month> · Anytime. */
var monthTab=today().getMonth();
function badge(t){
  var w=t.when,n=today();
  if(w&&w.kind==='dates'){
    var len=(w.e-w.s)/864e5;
    if(len<1)return {span:DS[w.s.getDay()].toUpperCase(),b:w.s.getDate()};
    if(len<=6)return {span:DS[w.s.getDay()].toUpperCase()+'–'+DS[w.e.getDay()].toUpperCase(),b:w.s.getDate()};
    if(len>31&&t.evergreen)return {span:'',b:MS[w.s.getMonth()]+'–'+MS[w.e.getMonth()],any:true};   // a season ("Best May–Sept")
    if(w.s<n&&w.e>=n)return {span:'UNTIL',b:MS[w.e.getMonth()]+' '+w.e.getDate(),any:true};
    return {span:MS[w.s.getMonth()].toUpperCase(),b:w.s.getDate()};
  }
  if(w&&w.kind==='weekly'){
    if(w.days.length===2&&w.days.indexOf(6)>=0&&w.days.indexOf(0)>=0)return {span:'',b:'Wknds',any:true};

function defaultTime(t){

  var tm=(t.when&&t.when.time)||(/weekday|mon\s*[-–]\s*fri/i.test(t.note)?'':parseTime(t.note));if(tm)return tm;
  var brunch=/brunch/i.test(t.note)||(t.tags||[]).indexOf('brunch')>=0;
  if((t.tags||[]).indexOf('happyhour')>=0&&t.group==='drinks')return '17:30';
  return {markets:'10:00',outdoors:'10:30',arts:'13:00',events:'18:00',other:'14:00',food:brunch?'11:00':'19:00',drinks:'19:00',night:'21:30'}[t.group]||'18:00';
}
function nextDow(from,dow){var d=sod(from);while(d.getDay()!==dow)d=addDays(d,1);return d;}
function defaultDate(t){
  var n=today(),wk=weekendOf(new Date()),w=t.when;
  if(w&&w.kind==='dates'&&w.e>=n){var s=w.s<n?n:w.s;if((w.e-w.s)/864e5<=6)return s;var ov=wk.days.filter(function(d){return d>=w.s&&d<=w.e;});return ov.length?pickDay(ov):s;}
  if(w&&w.kind==='weekly'){var hit=wk.days.filter(function(d){return w.days.indexOf(d.getDay())>=0;});if(hit.length)return pickDay(hit);
    var best=null;w.days.forEach(function(dw){var d=nextDow(n,dw);if(!best||d<best)best=d;});return best;}
  return pickDay(wk.days);
}

var editingItem=null,itemLL=null,pickReopen=null;
function fillSelects(){
  $('m-month').innerHTML='<option value="evergreen">Anytime / year-round</option>'+MONTHS.map(function(m,i){return '<option value="'+i+'">'+m+'</option>';}).join('');
  $('m-hood').innerHTML='<option value="">— Any / TBD —</option>'+HOODS.map(function(h){return '<option>'+esc(h)+'</option>';}).join('');
  $('sp-category').innerHTML=SPOT_CATS.map(function(c){return '<option value="'+c.val+'">'+esc(c.label)+'</option>';}).join('');
}
function buildModalCats(sel){
  $('cat-selector').innerHTML=CATS.map(function(c){return '<button type="button" class="cat-sel-btn'+(c.id===(sel||'food')?' on':'')+'" data-id="'+c.id+'" style="--c:'+grp(c.group).color+'">'+esc(c.label)+'</button>';}).join('');
}
$('cat-selector').addEventListener('click',function(e){var b=e.target.closest('.cat-sel-btn');if(!b)return;this.querySelectorAll('.cat-sel-btn').forEach(function(x){x.classList.toggle('on',x===b);});});
function locText(){
  var h=$('m-hood').value;
  $('m-loc-text').textContent=itemLL?'Exact spot set ('+itemLL[0].toFixed(4)+', '+itemLL[1].toFixed(4)+')':(HOOD_LL[h]?'Middle of '+h+' (approximate)':'Not on the map yet — pick a neighborhood or a spot');
  $('m-loc-reset').style.display=itemLL?'':'none';
}
$('m-hood').addEventListener('change',locText);
$('m-loc-reset').addEventListener('click',function(){itemLL=null;locText();});
$('m-loc-pick').addEventListener('click',function(){
  var name=$('m-name').value.trim()||'it';
  $('modal').classList.remove('open');
  pickReopen=function(){pickReopen=null;$('modal').classList.add('open');};
  startPick('Click the map where <b>'+esc(name)+'</b> is',function(lat,lng){itemLL=[+lat.toFixed(5),+lng.toFixed(5)];locText();var r=pickReopen;if(r)r();});
});
$('m-img').addEventListener('input',function(){previewImg(this.value);});
function previewImg(url){var p=$('img-preview');var u=safeUrl(url);if(u){p.src=u;p.classList.add('show');p.onerror=function(){p.classList.remove('show');};}else p.classList.remove('show');}
function openItemModal(item,pre){
  editingItem=item;pre=pre||{};
  $('modal-title').textContent=item?'Edit':'Add something';
  $('m-del-btn').style.display=item?'':'none';
  var src=item||{};
  $('m-name').value=src.name||pre.name||'';
  $('m-dates').value=src.dates||'';
  $('m-link').value=src.link||pre.link||'';
  $('m-note').value=src.note||'';
  $('m-img').value=src.img||'';
  $('m-price').value=src.price||'free';
  $('m-hood').value=src.hood||'';
  var mo=item?src.month:(pre.month!=null?pre.month:'evergreen');
  $('m-month').value=mo==null?'evergreen':String(mo);
  itemLL=item&&item.lat!=null&&item.lng!=null?[item.lat,item.lng]:null;
  buildModalCats(src.category);previewImg(src.img||'');locText();
  $('modal').classList.add('open');
  setTimeout(function(){(item||!pre.name?$('m-name'):$('m-dates')).focus();},60);
}
$('m-save').addEventListener('click',function(){
  var name=$('m-name').value.trim();if(!name){$('m-name').focus();return;}
  var on=document.querySelector('#cat-selector .cat-sel-btn.on');
  var mv=$('m-month').value;
  var fields={name:name,category:on?on.getAttribute('data-id'):'food',month:mv==='evergreen'?'evergreen':parseInt(mv,10),
    price:$('m-price').value,hood:$('m-hood').value,dates:$('m-dates').value.trim(),img:$('m-img').value.trim(),
    link:$('m-link').value.trim(),note:$('m-note').value.trim()};
  if(editingItem){
    Object.assign(editingItem,fields);
    if(itemLL){editingItem.lat=itemLL[0];editingItem.lng=itemLL[1];}else{delete editingItem.lat;delete editingItem.lng;}
  }else{
    var it=Object.assign({id:'i_'+Date.now()},fields,{status:'want',addedAt:Date.now()});
    if(itemLL){it.lat=itemLL[0];it.lng=itemLL[1];}
    guide.items.push(it);
  }
  saveGuide();
  var m=fields.month,cur=today().getMonth();
  if(m==='evergreen')monthTab='any';else if(m===cur||m===(cur+1)%12||!editingItem)monthTab=m;
  closeModals();render();
});
$('m-del-btn').addEventListener('click',function(){if(editingItem)deleteThing('item:'+editingItem.id);});

/* ═════════════════ SPOT MODAL (dcPassport1) ═════════════════ */
var editingSpot=null,spotTags=[];
function openSpotModal(spot){
  editingSpot=spot;spotTags=spot?(spot.tags||[]).slice():[];
  $('sp-title').textContent=spot?'Edit place':'Add a place';
  $('sp-del-btn').style.display=spot?'':'none';
  $('sp-name').value=spot?spot.name:'';
  $('sp-category').value=spot?spot.category:'Restaurant';
  $('sp-city').value=spot?spot.city||'DC':'DC';
  $('sp-note').value=spot?spot.note||'':'';
  $('sp-link').value=spot?spot.link||'':'';
  $('sp-search').value='';$('sp-geo-status').textContent='';
  setSpotLL(spot&&spot.lat?spot.lat:null,spot&&spot.lng?spot.lng:null);
  buildTagPicker();
  $('sp-modal').classList.add('open');
  setTimeout(function(){$('sp-name').focus();},60);
}
function setSpotLL(lat,lng){
  $('sp-lat').value=lat==null?'':lat;$('sp-lng').value=lng==null?'':lng;
  $('sp-coords').value=lat==null?'':lat+', '+lng;
  $('sp-ll-text').textContent=lat==null?'No location yet — search, paste, or pick on the map.':'Pinned at '+(+lat).toFixed(5)+', '+(+lng).toFixed(5);
}
function buildTagPicker(){
  $('tag-picker').innerHTML=PRESET_TAGS.map(function(t){return '<button type="button" class="tag-option'+(spotTags.indexOf(t.val)>=0?' selected':'')+'" data-t="'+t.val+'">'+esc(t.label)+'</button>';}).join('');
}
$('tag-picker').addEventListener('click',function(e){
  var b=e.target.closest('.tag-option');if(!b)return;var v=b.getAttribute('data-t'),i=spotTags.indexOf(v);
  if(i>=0)spotTags.splice(i,1);else spotTags.push(v);b.classList.toggle('selected',i<0);
});
$('sp-coords').addEventListener('input',function(){
  var parts=this.value.trim().split(/[\s,]+/).filter(Boolean);
  if(parts.length>=2){var la=parseFloat(parts[0]),ln=parseFloat(parts[1]);
    if(!isNaN(la)&&!isNaN(ln)&&la>=-90&&la<=90&&ln>=-180&&ln<=180){$('sp-lat').value=la;$('sp-lng').value=ln;$('sp-ll-text').textContent='Pinned at '+la.toFixed(5)+', '+ln.toFixed(5);}}
});
$('sp-pick').addEventListener('click',function(){
  var name=$('sp-name').value.trim()||'it';
  $('sp-modal').classList.remove('open');
  pickReopen=function(){pickReopen=null;$('sp-modal').classList.add('open');};
  startPick('Click the map where <b>'+esc(name)+'</b> is',function(lat,lng){setSpotLL(+lat.toFixed(5),+lng.toFixed(5));var r=pickReopen;if(r)r();});
});
function geocodeName(){
  var q=$('sp-search').value.trim();if(!q)return;
  var st=$('sp-geo-status');st.style.color='var(--muted)';st.textContent='Searching…';
  fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q+' Washington DC'),{headers:{'Accept':'application/json'}})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d&&d.length){var la=+(+d[0].lat).toFixed(5),ln=+(+d[0].lon).toFixed(5);setSpotLL(la,ln);
        st.style.color='var(--ok)';st.textContent='✓ Found: '+d[0].display_name.split(',').slice(0,3).join(',');}
      else{st.style.color='var(--over)';st.textContent='✗ Not found — try adding “DC”, paste coordinates, or pick on the map';}
    }).catch(function(){st.style.color='var(--over)';st.textContent='✗ Search failed — paste coordinates or pick on the map';});
}
$('sp-search-btn').addEventListener('click',geocodeName);
$('sp-search').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();geocodeName();}});
$('sp-save').addEventListener('click',function(){
  var name=$('sp-name').value.trim();if(!name){$('sp-name').focus();return;}
  var la=parseFloat($('sp-lat').value),ln=parseFloat($('sp-lng').value);
  var fields={name:name,category:$('sp-category').value,city:$('sp-city').value,lat:isNaN(la)?null:la,lng:isNaN(ln)?null:ln,
    note:$('sp-note').value.trim(),link:$('sp-link').value.trim(),tags:spotTags.slice()};
  var key;
  if(editingSpot){Object.assign(editingSpot,fields);key='spot:'+editingSpot.id;}
  else{var s=Object.assign({id:'s_'+Date.now()},fields,{visited:false,rating:0,addedAt:Date.now()});spots.push(s);key='spot:'+s.id;}
  saveSpots();closeModals();render();
  if(fields.lat!=null)showOnMap(key);
});
$('sp-del-btn').addEventListener('click',function(){if(editingSpot)deleteThing('spot:'+editingSpot.id);});

function openEdit(key){var t=thing(key);if(!t)return;if(t.kind==='spot')openSpotModal(t.ref);else openItemModal(t.ref);}
function closeModals(){['modal','sp-modal'].forEach(function(id){$(id).classList.remove('open');});editingItem=null;editingSpot=null;}
document.querySelectorAll('[data-close]').forEach(function(b){b.addEventListener('click',closeModals);});
['modal','sp-modal'].forEach(function(id){$(id).addEventListener('mousedown',function(e){if(e.target===this)closeModals();});});

/* ═════════════════ RENDER ═════════════════ */
function render(){rebuild();renderDock();renderWeekend();renderMap();renderMonth();renderWant();}
window.addEventListener('storage',function(e){
  if(e.key===SPOT_KEY||e.key===GUIDE_KEY){load();render();}
  else if(e.key===CAL_KEY){render();}
});

fillSelects();
load();
try{initMap();}catch(e){$('map').innerHTML='<div class="empty-l" style="padding:24px">The map couldn’t load (offline?). Everything else still works.</div>';map=null;}
render();
</script>
</body>
</html>
