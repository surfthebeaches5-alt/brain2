<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f3ecd8;--surface:#fff;--sidebar:#f8f1dd;--sidebar-line:#e6dec5;
  --ink:#1a1612;--muted:#7a7468;--line:#ececec;--warm:#faf6ec;
  --accent:#c9b6ee;--accent-deep:#b099e0;--accent-soft:#ede5fb;
}
html,body{background:var(--bg);font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}

/* TOPBAR */
.topbar{background:var(--sidebar);border-bottom:1px solid var(--sidebar-line);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;}
.topbar-left{display:flex;align-items:center;gap:14px;}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1.5px solid #d9d2bd;border-radius:20px;font-size:12px;color:var(--muted);cursor:pointer;background:transparent;font-family:inherit;text-decoration:none;transition:all .15s;}
.back-btn:hover{border-color:var(--accent-deep);color:var(--ink);}
.topbar-title{font-family:'Fraunces',serif;font-size:22px;font-weight:600;letter-spacing:-0.4px;}
.topbar-right{display:flex;align-items:center;gap:12px;}
.topbar-date{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:500;}
.add-btn-top{padding:8px 18px;border:none;border-radius:20px;background:var(--ink);color:#fff;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;}
.add-btn-top:hover{background:#2a2218;transform:translateY(-1px);}

.hub{max-width:1000px;margin:0 auto;padding:28px 24px 80px;}

/* SUMMARY */
.summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
.sum-card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:16px;padding:16px 20px;text-align:center;}
.sum-num{font-family:'Fraunces',serif;font-size:28px;font-weight:600;line-height:1;letter-spacing:-.5px;}
.sum-label{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:5px;font-weight:700;}

/* CONTROLS */
.controls-wrap{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:22px;}
.controls-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.filter-pill{padding:5px 13px;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:14px;background:transparent;font-family:inherit;font-size:11.5px;font-weight:600;cursor:pointer;color:var(--muted);transition:all .15s;white-space:nowrap;}
.filter-pill:hover{border-color:var(--accent-deep);color:var(--ink);}
.filter-pill.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.filter-pill.p-active{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff;}
.filter-pill svg{width:13px;height:13px;flex-shrink:0;}
.pri-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.filter-sep{width:1px;height:18px;background:var(--line);flex-shrink:0;margin:0 2px;}
.search-input{padding:7px 14px;border:1.5px solid var(--line);border-radius:14px;font-family:inherit;font-size:12px;color:var(--ink);background:var(--warm);outline:none;transition:border .15s;min-width:150px;}
.search-input:focus{border-color:var(--accent-deep);}
.view-toggle{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin-left:auto;}
.view-btn{padding:5px 12px;border:none;background:transparent;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;color:var(--muted);transition:all .15s;}
.view-btn.active{background:var(--ink);color:#fff;}

/* PRIORITY SECTION HEADERS */
.priority-section{margin-bottom:28px;}
.priority-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:8px 0;}
.priority-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.priority-title{font-family:'Fraunces',serif;font-size:18px;font-weight:600;letter-spacing:-.2px;}
.priority-count{font-size:10.5px;color:var(--muted);font-weight:600;}
.priority-total{margin-left:auto;font-family:'Fraunces',serif;font-size:16px;font-weight:600;color:var(--muted);}

/* CATEGORY SECTION */
.cat-section{margin-bottom:26px;}
.cat-header{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.cat-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.cat-title{font-family:'Fraunces',serif;font-size:17px;font-weight:600;letter-spacing:-.2px;}
.cat-icon{display:inline-flex;align-items:center;flex-shrink:0;}
.cat-icon svg{width:17px;height:17px;}
.cat-count{font-size:10.5px;color:var(--muted);font-weight:600;}
.cat-total{margin-left:auto;font-family:'Fraunces',serif;font-size:15px;font-weight:600;color:var(--muted);}

/* ITEM ROWS */
.item-row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:7px;transition:all .18s;}
.item-row:hover{border-color:#d9d2bd;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.item-row.purchased{opacity:0.45;}
.item-row.purchased .item-name{text-decoration:line-through;color:var(--muted);}

/* Thumbnail */
.item-thumb{width:46px;height:46px;border-radius:10px;object-fit:cover;border:1px solid var(--line);flex-shrink:0;background:var(--warm);}
.item-thumb-placeholder{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--warm);}
.item-thumb-placeholder svg{width:22px;height:22px;}

.item-priority-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.item-info{flex:1;min-width:0;}
.item-name{font-size:13px;font-weight:700;line-height:1.3;}
.item-note{font-size:11px;color:var(--muted);font-style:italic;margin-top:2px;}
.item-cat-badge{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-top:3px;}
.item-cat-badge svg{width:11px;height:11px;margin-right:4px;vertical-align:-1px;}

.item-price{font-family:'Fraunces',serif;font-size:16px;font-weight:600;color:var(--ink);flex-shrink:0;min-width:50px;text-align:right;}

.item-actions{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.item-link-btn{display:inline-flex;align-items:center;padding:4px 10px;border:1.5px solid var(--line);border-radius:10px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;transition:all .15s;font-family:inherit;}
.item-link-btn:hover{border-color:var(--accent-deep);color:var(--ink);}
.item-bought-btn{padding:4px 10px;border:1.5px solid var(--line);border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;background:transparent;color:var(--muted);}
.item-bought-btn:hover{border-color:#a8d8d0;color:#1a4a44;}
.item-bought-btn.is-bought{background:#d8eee8;border-color:#a8d8d0;color:#1a4a44;}
.item-edit-btn{padding:4px 9px;border:1.5px solid var(--line);border-radius:10px;font-size:11px;cursor:pointer;background:transparent;color:var(--muted);font-family:inherit;transition:all .15s;}
.item-edit-btn:hover{border-color:var(--accent-deep);color:var(--ink);}
.item-del-btn{padding:3px 6px;border:none;background:transparent;font-size:11px;color:#ddd;cursor:pointer;transition:color .15s;}
.item-del-btn:hover{color:#a0304a;}
.item-date{font-size:10.5px;color:var(--accent-deep);font-weight:600;flex-shrink:0;}

/* EMPTY */
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-icon{font-size:2.5rem;margin-bottom:12px;}
.empty-icon svg{width:44px;height:44px;color:var(--accent-deep);}
.empty-text{font-family:'Fraunces',serif;font-size:17px;font-style:italic;}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);z-index:300;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;animation:fadeIn .2s;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:22px;border:1px solid var(--line);padding:26px 28px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 30px 60px -20px rgba(0,0,0,.25);animation:popIn .2s;}
@keyframes popIn{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-title{font-family:'Fraunces',serif;font-size:22px;font-weight:600;margin-bottom:20px;letter-spacing:-.3px;}
.f-field{margin-bottom:13px;}
.f-label{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:5px;display:block;font-weight:700;}
.f-input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;font-family:inherit;color:var(--ink);background:var(--warm);outline:none;transition:border .15s;}
.f-input:focus{border-color:var(--accent-deep);}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.m-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
.m-btn{padding:10px 22px;border-radius:22px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid;transition:all .15s;}
.m-cancel{background:var(--warm);border-color:var(--line);color:var(--muted);}
.m-save{background:var(--ink);border-color:var(--ink);color:#fff;}
.m-save:hover{transform:translateY(-1px);}
.m-delete{background:#fce4ec;border-color:#f2c4ce;color:#a0304a;}

.recur-badge{font-size:10px;font-weight:700;color:var(--accent-deep);background:var(--accent-soft);border:1px solid var(--accent);border-radius:6px;padding:2px 6px;flex-shrink:0;}
.aging-badge{font-size:10px;font-weight:600;color:var(--muted);background:var(--warm);border:1px solid var(--line);border-radius:6px;padding:2px 7px;flex-shrink:0;}
.aging-badge.stale{color:#a06020;background:#fff5d6;border-color:#f6d6a0;}
</style>
</head>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modal-title">Add to Wishlist</div>
    <div class="f-field">
      <label class="f-label">Item Name</label>
      <input class="f-input" id="m-name" type="text" placeholder="What do you want?">
    </div>
    <div class="f-row">
      <div class="f-field">
        <label class="f-label">Category</label>
        <select class="f-input" id="m-category">
          <option value="BeautyCare">Beauty &amp; Care</option>
          <option value="Style">Style &amp; Wardrobe</option>
          <option value="Home">Home</option>
          <option value="Art">Art &amp; Creative</option>
          <option value="Tech">Tech &amp; Gadgets</option>
          <option value="Books">Books &amp; Media</option>
          <option value="Health">Health &amp; Wellness</option>
        </select>
      </div>
      <div class="f-field">
        <label class="f-label">Priority</label>
        <select class="f-input" id="m-priority">
          <option value="high">High — Need it soon</option>
          <option value="medium" selected>Medium — Want it</option>
          <option value="someday">Someday — Nice to have</option>
        </select>
      </div>
    </div>
    <div class="f-row">
      <div class="f-field">
        <label class="f-label">Price (optional)</label>
        <input class="f-input" id="m-price" type="number" min="0" step="0.01" placeholder="0.00">
      </div>
      <div class="f-field">
        <label class="f-label">Target Date (optional)</label>
        <input class="f-input" id="m-date" type="month">
      </div>
    </div>
    <div class="f-field">
      <label class="f-label">Link (optional)</label>
      <input class="f-input" id="m-link" type="text" placeholder="Amazon, brand website...">
    </div>
    <div class="f-field">
      <label class="f-label">Note (optional)</label>
      <input class="f-input" id="m-note" type="text" placeholder="Size, color, why you want it...">
    </div>
    <div class="f-field" style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--warm);border-radius:10px;border:1.5px solid var(--line);">
      <input type="checkbox" id="m-recurring" style="width:16px;height:16px;accent-color:var(--accent-deep);cursor:pointer;flex-shrink:0;">
      <div>
        <label for="m-recurring" style="font-size:13px;font-weight:600;cursor:pointer;">Recurring / Subscription</label>
        <div style="font-size:10.5px;color:var(--muted);margin-top:2px;">Check if this is a monthly or yearly charge</div>
      </div>
      <select id="m-recur-period" style="margin-left:auto;border:1.5px solid var(--line);border-radius:8px;padding:5px 10px;font-family:inherit;font-size:12px;color:var(--ink);background:var(--surface);outline:none;">
        <option value="mo">/ month</option>
        <option value="yr">/ year</option>
      </select>
    </div>
    <div class="m-actions">
      <button class="m-btn m-cancel" onclick="closeModal()">Cancel</button>
      <button class="m-btn m-delete" id="m-delete-btn" style="display:none;" onclick="deleteFromModal()">Delete</button>
      <button class="m-btn m-save" onclick="saveItem()">Save</button>
    </div>
  </div>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-left">
    <a href="../" class="back-btn">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      Brain 2.0
    </a>
    <div class="topbar-title">Wishlist</div>
  </div>
  <div class="topbar-right">
    <span class="topbar-date" id="today-date"></span>
    <button class="add-btn-top" onclick="openAddModal()">+ Add Item</button>
  </div>
</div>

<div class="hub">
  <div class="summary-row" id="summary-row"></div>
  <div class="controls-wrap">
    <div class="controls-row" id="controls-row"></div>
  </div>
  <div id="wishlist-content"></div>
</div>

var currentPriority='all';
var searchQuery='';
var viewMode='priority'; // 'priority' or 'category'
var editingId=null;

/* ── STORAGE ── */
function save(){localStorage.setItem(SK,JSON.stringify(items));}
function load(){
  var raw=localStorage.getItem(SK);
  if(raw){
    try{
      items=JSON.parse(raw);
      // Migrate: add image field if missing
      items.forEach(function(i){
      if(i.image===undefined)i.image='';
      if(i.recurring===undefined)i.recurring=false;
      if(i.recurPeriod===undefined)i.recurPeriod='mo';
      if(i.addedOn===undefined)i.addedOn=new Date().toISOString().slice(0,10);
      // migrate old category names
      if(i.category==='Beauty'||i.category==='Hair')i.category='BeautyCare';
      if(i.category==='Health')i.category='Health';
      if(i.category==='Clothing')i.category='Style';
      if(i.category==='Home & Lifestyle')i.category='Home';
      if(i.category==='Other')i.category='Art';
    });
    }catch(e){}
  } else {
    items=JSON.parse(JSON.stringify(DEFAULT_ITEMS));save();
  }
}

function getCat(val){return CATS.find(function(c){return c.val===val;})||CATS[CATS.length-1];}
function getPri(val){return PRIORITIES.find(function(p){return p.val===val;})||PRIORITIES[1];}
function formatPrice(p){if(!p||p<=0)return null;return '$'+parseFloat(p).toFixed(2).replace(/\.00$/,'');}
function formatMonth(m){
  if(!m)return null;
  var parts=m.split('-');
  return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(parts[1])-1]+' '+parts[0];
}
function escHtml(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* ── SUMMARY ── */
function renderSummary(){
  var total=items.length;
  var pending=items.filter(function(i){return !i.purchased;}).length;
  var bought=items.filter(function(i){return i.purchased;}).length;
  var oneTimeVal=items.filter(function(i){return !i.purchased&&i.price>0&&!i.recurring;}).reduce(function(s,i){return s+(parseFloat(i.price)||0);},0);
  var recurVal=items.filter(function(i){return !i.purchased&&i.price>0&&i.recurring&&i.recurPeriod==='mo';}).reduce(function(s,i){return s+(parseFloat(i.price)||0);},0);
  document.getElementById('summary-row').innerHTML=
    '<div class="sum-card"><div class="sum-num">'+total+'</div><div class="sum-label">Total Items</div></div>'+
    '<div class="sum-card"><div class="sum-num">'+pending+'</div><div class="sum-label">Still Wanting</div></div>'+
    '<div class="sum-card"><div class="sum-num">'+(oneTimeVal>0?'$'+oneTimeVal.toFixed(0):'—')+'</div><div class="sum-label">One-Time Pending</div></div>'+
    '<div class="sum-card"><div class="sum-num">'+(recurVal>0?'$'+recurVal.toFixed(0)+'/mo':'—')+'</div><div class="sum-label">Monthly Recurring</div></div>';
}

/* ── CONTROLS ── */
function renderControls(){
  var html='';
  html+='<button class="filter-pill'+(currentFilter==='all'?' active':'')+'" onclick="setFilter(\'all\')">All</button>';
  CATS.forEach(function(c){
    if(items.some(function(i){return i.category===c.val;}))
      html+='<button class="filter-pill'+(currentFilter===c.val?' active':'')+'" onclick="setFilter(\''+c.val+'\')">'+c.icon+escHtml(c.label)+'</button>';
  });
  html+='<div class="filter-sep"></div>';
  html+='<button class="filter-pill'+(currentPriority==='all'?' active':'')+'" onclick="setPriority(\'all\')">All</button>';
  html+='<button class="filter-pill'+(currentPriority==='high'?' p-active':'')+'" onclick="setPriority(\'high\')"><span class="pri-dot" style="background:'+getPri('high').dot+'"></span>High</button>';
  html+='<button class="filter-pill'+(currentPriority==='medium'?' p-active':'')+'" onclick="setPriority(\'medium\')"><span class="pri-dot" style="background:'+getPri('medium').dot+'"></span>Medium</button>';
  html+='<button class="filter-pill'+(currentPriority==='someday'?' p-active':'')+'" onclick="setPriority(\'someday\')"><span class="pri-dot" style="background:'+getPri('someday').dot+'"></span>Someday</button>';
  html+='<div class="filter-sep"></div>';
  html+='<input class="search-input" type="text" placeholder="Search..." value="'+escHtml(searchQuery)+'" oninput="setSearch(this.value)">';
  html+='<div class="view-toggle">'+
    '<button class="view-btn'+(viewMode==='priority'?' active':'')+'" onclick="setView(\'priority\')">By Priority</button>'+
    '<button class="view-btn'+(viewMode==='category'?' active':'')+'" onclick="setView(\'category\')">By Category</button>'+
  '</div>';
  document.getElementById('controls-row').innerHTML=html;
}

function setFilter(v){currentFilter=v;render();}
function setPriority(v){currentPriority=v;render();}
function setSearch(v){searchQuery=v;render();}
function setView(v){viewMode=v;render();}

/* ── FILTER ── */
function getFiltered(){
  return items.filter(function(i){
    if(currentFilter!=='all'&&i.category!==currentFilter)return false;
    if(currentPriority!=='all'&&i.priority!==currentPriority)return false;
    if(searchQuery){var q=searchQuery.toLowerCase();return(i.name||'').toLowerCase().includes(q)||(i.note||'').toLowerCase().includes(q);}
    return true;
  });
}

/* ── RENDER LIST ── */
function renderList(){
  var content=document.getElementById('wishlist-content');content.innerHTML='';
  var filtered=getFiltered();
  if(!filtered.length){
    content.innerHTML='<div class="empty-state"><div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.4 5.4 1.8-5.4 1.8L12 17.4l-1.8-5.4L4.8 10.2l5.4-1.8z"/></svg></div><div class="empty-text">Nothing here yet — add something you\'re dreaming of.</div></div>';
    return;
  }

  // Flat if filtering by single cat or searching
  if(currentFilter!=='all'||searchQuery){
    var sec=document.createElement('div');sec.className='cat-section';
    filtered.sort(function(a,b){
      if(a.purchased!==b.purchased)return a.purchased?1:-1;
      var o={high:0,medium:1,someday:2};return(o[a.priority]||1)-(o[b.priority]||1);
    });
    filtered.forEach(function(item){sec.appendChild(buildRow(item));});
    content.appendChild(sec);
    return;
  }

  if(viewMode==='priority'){
    PRIORITIES.forEach(function(pri){
      var priItems=filtered.filter(function(i){return i.priority===pri.val;});
      if(!priItems.length)return;
      // separate purchased
      priItems.sort(function(a,b){return a.purchased?1:b.purchased?-1:0;});
      var priTotal=priItems.filter(function(i){return !i.purchased&&i.price>0;}).reduce(function(s,i){return s+(parseFloat(i.price)||0);},0);
      var sec=document.createElement('div');sec.className='priority-section';
      var hdr=document.createElement('div');hdr.className='priority-header';
      hdr.innerHTML=
        '<div class="priority-dot" style="background:'+pri.dot+'"></div>'+
        '<span class="priority-title">'+pri.label+'</span>'+
        '<span class="priority-count">('+priItems.length+')</span>'+
        (priTotal>0?'<span class="priority-total">$'+priTotal.toFixed(0)+'</span>':'');
      sec.appendChild(hdr);
      priItems.forEach(function(item){sec.appendChild(buildRow(item,true));});
      content.appendChild(sec);
    });
  } else {
    CATS.forEach(function(cat){
      var catItems=filtered.filter(function(i){return i.category===cat.val;});
      if(!catItems.length)return;
      catItems.sort(function(a,b){
        if(a.purchased!==b.purchased)return a.purchased?1:-1;
        var o={high:0,medium:1,someday:2};return(o[a.priority]||1)-(o[b.priority]||1);
      });
      var catTotal=catItems.filter(function(i){return !i.purchased&&i.price>0;}).reduce(function(s,i){return s+(parseFloat(i.price)||0);},0);
      var sec=document.createElement('div');sec.className='cat-section';
      var hdr=document.createElement('div');hdr.className='cat-header';
      hdr.innerHTML=
        '<span class="cat-icon" style="color:'+cat.dark+'">'+cat.icon+'</span>'+
        '<span class="cat-title">'+escHtml(cat.label)+'</span>'+
        '<span class="cat-count">('+catItems.length+')</span>'+
        (catTotal>0?'<span class="cat-total">$'+catTotal.toFixed(0)+'</span>':'');
      sec.appendChild(hdr);
      catItems.forEach(function(item){sec.appendChild(buildRow(item));});
      content.appendChild(sec);
    });
  }
}

/* ── BUILD ROW ── */
function buildRow(item, showCat){
  var cat=getCat(item.category);
  var pri=getPri(item.priority);
  var row=document.createElement('div');
  row.className='item-row'+(item.purchased?' purchased':'');

  // Category icon tile
  var ph=document.createElement('div');ph.className='item-thumb-placeholder';
  ph.innerHTML=cat.icon;ph.style.color=cat.dark;
  row.appendChild(ph);

  // Priority dot
  var dot=document.createElement('div');dot.className='item-priority-dot';
  dot.style.background=pri.dot;dot.title=item.priority+' priority';
  row.appendChild(dot);

  // Info
  var info=document.createElement('div');info.className='item-info';
  var name=document.createElement('div');name.className='item-name';name.textContent=item.name;
  info.appendChild(name);
  if(item.note){var note=document.createElement('div');note.className='item-note';note.textContent=item.note;info.appendChild(note);}
  if(showCat){var cb=document.createElement('span');cb.className='item-cat-badge';cb.style.color=cat.dark;cb.innerHTML=cat.icon+escHtml(cat.label);info.appendChild(cb);}
  row.appendChild(info);

  // Price + recurring badge
  var priceStr=formatPrice(item.price);
  if(priceStr){
    var priceWrap=document.createElement('div');priceWrap.style.cssText='display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;';
    var price=document.createElement('div');price.className='item-price';price.textContent=priceStr;priceWrap.appendChild(price);
    if(item.recurring){var rb=document.createElement('span');rb.className='recur-badge';rb.textContent='/'+( item.recurPeriod||'mo');priceWrap.appendChild(rb);}
    row.appendChild(priceWrap);
  }
  // Aging badge for Someday items
  if(item.priority==='someday'&&item.addedOn&&!item.purchased){
    var added=new Date(item.addedOn);var days=Math.floor((Date.now()-added.getTime())/(1000*60*60*24));
    if(days>0){var ab=document.createElement('span');ab.className='aging-badge'+(days>=60?' stale':'');ab.textContent=days+'d';ab.title='Added '+days+' days ago';row.appendChild(ab);}
  }

  // Actions
  var acts=document.createElement('div');acts.className='item-actions';
  var dateStr=formatMonth(item.date);
  if(dateStr){var de=document.createElement('span');de.className='item-date';de.textContent='by '+dateStr;acts.appendChild(de);}
  if(item.link){var lk=document.createElement('a');lk.className='item-link-btn';lk.textContent='Link ↗';lk.href=item.link;lk.target='_blank';lk.style.textDecoration='none';acts.appendChild(lk);}
  var bb=document.createElement('button');bb.className='item-bought-btn'+(item.purchased?' is-bought':'');
  bb.textContent=item.purchased?'✓ Got it':'Mark Bought';
  bb.onclick=(function(id){return function(){togglePurchased(id);};})(item.id);acts.appendChild(bb);
  var eb=document.createElement('button');eb.className='item-edit-btn';eb.textContent='Edit';
  eb.onclick=(function(id){return function(){openEditModal(id);};})(item.id);acts.appendChild(eb);
  var db=document.createElement('button');db.className='item-del-btn';db.textContent='✕';
  db.onclick=(function(id){return function(){if(confirm('Remove this item?'))deleteItem(id);};})(item.id);acts.appendChild(db);
  row.appendChild(acts);
  return row;
}

function togglePurchased(id){var item=items.find(function(i){return i.id===id;});if(!item)return;item.purchased=!item.purchased;save();render();}
function deleteItem(id){items=items.filter(function(i){return i.id!==id;});save();render();}

/* ── MODAL ── */
function openAddModal(){
  editingId=null;
  document.getElementById('modal-title').textContent='Add to Wishlist';
  ['m-name','m-price','m-date','m-link','m-note'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('m-recurring').checked=false;
  document.getElementById('m-recur-period').value='mo';
  document.getElementById('m-category').value='BeautyCare';
  document.getElementById('m-priority').value='medium';
  document.getElementById('m-delete-btn').style.display='none';
  document.getElementById('modal').classList.add('open');
  setTimeout(function(){document.getElementById('m-name').focus();},100);
}
function openEditModal(id){
  var item=items.find(function(i){return i.id===id;});if(!item)return;
  editingId=id;
  document.getElementById('modal-title').textContent='Edit Item';
  document.getElementById('m-name').value=item.name;
  document.getElementById('m-category').value=item.category;
  document.getElementById('m-priority').value=item.priority;
  document.getElementById('m-price').value=item.price||'';
  document.getElementById('m-date').value=item.date||'';
  document.getElementById('m-link').value=item.link||'';
  document.getElementById('m-note').value=item.note||'';
  document.getElementById('m-recurring').checked=!!item.recurring;
  document.getElementById('m-recur-period').value=item.recurPeriod||'mo';
  document.getElementById('m-delete-btn').style.display='inline-flex';
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open');editingId=null;}
function saveItem(){
  var name=document.getElementById('m-name').value.trim();
  if(!name){document.getElementById('m-name').focus();return;}
  var old=editingId?items.find(function(i){return i.id===editingId;})||{}:{};
  var item={
    id:editingId||'w_'+Date.now(),
    name:name,
    category:document.getElementById('m-category').value,
    priority:document.getElementById('m-priority').value,
    price:parseFloat(document.getElementById('m-price').value)||0,
    date:document.getElementById('m-date').value,
    link:document.getElementById('m-link').value.trim(),
    note:document.getElementById('m-note').value.trim(),
    image:old.image||'',
    recurring:document.getElementById('m-recurring').checked,
    recurPeriod:document.getElementById('m-recur-period').value,
    purchased:old.purchased||false,
    addedOn:old.addedOn||(new Date().toISOString().slice(0,10)),
  };
  if(editingId){var idx=items.findIndex(function(i){return i.id===editingId;});if(idx>=0)items[idx]=item;}
  else items.push(item);
  save();closeModal();render();
}
function deleteFromModal(){if(!editingId)return;if(!confirm('Delete this item?'))return;deleteItem(editingId);closeModal();}

document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});

function render(){renderSummary();renderControls();renderList();}

var DS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MF=['January','February','March','April','May','June','July','August','September','October','November','December'];
var now=new Date();
document.getElementById('today-date').textContent=DS[now.getDay()]+', '+MF[now.getMonth()]+' '+now.getDate()+', '+now.getFullYear();

load();render();
</script>
