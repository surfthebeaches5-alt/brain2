<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);font-family:var(--b2-sans);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;}
a{color:inherit;}

/* ── title row (brain.css restyles .topbar) ── */
.topbar{display:flex;align-items:center;justify-content:space-between;}
body.b2-shell .topbar.wl-top{align-items:center;}
.topbar-left{display:flex;align-items:center;gap:14px;}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--line);border-radius:20px;font-size:12px;color:var(--muted);background:transparent;text-decoration:none;}
.topbar-title{font-family:var(--b2-serif);font-size:22px;font-weight:600;letter-spacing:-0.4px;}
.wl-sub{color:var(--muted);font-size:13.5px;font-weight:500;margin-top:6px;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.wl-search{display:flex;align-items:center;gap:8px;height:38px;width:260px;padding:0 10px 0 13px;border-radius:11px;border:1px solid var(--line);background:var(--raised);transition:border-color .15s,box-shadow .15s;}
.wl-search:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft);}
.wl-search svg{width:15px;height:15px;stroke:var(--accent-deep);fill:none;stroke-width:2;flex-shrink:0;}
.wl-search input{flex:1;min-width:0;border:none;outline:none;background:transparent;font:550 13px var(--b2-sans);color:var(--ink);}
.wl-search input::placeholder{color:var(--faint);}
.wl-search kbd{font:700 10.5px var(--b2-sans);color:var(--muted);background:var(--warm);border-radius:5px;padding:2px 6px;}
.wl-search input:not(:placeholder-shown) ~ kbd{display:none;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 15px;border-radius:10px;font:650 12.5px var(--b2-sans);border:1px solid var(--line);background:var(--raised);color:var(--ink-2);cursor:pointer;white-space:nowrap;text-decoration:none;transition:transform .15s,border-color .15s,color .15s;}
.btn:hover{border-color:var(--accent-line);color:var(--accent-deep);}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;}
.btn.primary:hover{transform:translateY(-1px);color:#fff;}
.btn.lg{height:38px;padding:0 16px;font-size:13px;}
.btn.sm{height:28px;padding:0 11px;font-size:11.5px;border-radius:8px;}

/* ── frame ── */
.hub{max-width:1280px;margin:0 auto;padding:16px 40px 80px;box-sizing:border-box;width:100%;}

/* ── one-line summary strip ── */
.strip{display:flex;align-items:center;flex-wrap:wrap;row-gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(60,50,30,.04),0 8px 24px rgba(60,50,30,.05);padding:12px 6px;margin-bottom:16px;}
.st{padding:0 22px;display:flex;align-items:baseline;gap:9px;white-space:nowrap;}
.st+.st{border-left:1px solid var(--hair);}
.st b{font-family:var(--b2-serif);font-size:23px;font-weight:600;letter-spacing:-.3px;}
.st b small{font-size:14px;color:var(--muted);font-weight:500;}
.st b .dim{color:var(--faint);}
.st span{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:750;}
.mix{margin-left:auto;padding:0 20px;display:flex;flex-direction:column;gap:6px;min-width:250px;}
.mixbar{display:flex;height:7px;border-radius:5px;overflow:hidden;background:var(--warm-2);gap:2px;}
.mixbar i{display:block;height:100%;}
.mixleg{display:flex;gap:12px;font-size:11px;font-weight:650;color:var(--muted);white-space:nowrap;}
.mixleg i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px;}

/* ── controls ── */
.ctrl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
.seg-tabs{display:inline-flex;gap:2px;padding:4px;background:var(--warm-deep);border-radius:13px;flex-shrink:0;}
.seg-tabs button{padding:6px 12px;border:none;border-radius:10px;background:transparent;font:650 12px var(--b2-sans);color:var(--muted);cursor:pointer;white-space:nowrap;transition:color .15s,background .15s;}
.seg-tabs button:hover{color:var(--ink);}
.seg-tabs button.on{background:var(--raised);color:var(--ink);box-shadow:0 1px 3px rgba(60,50,30,.1);}
.seg-tabs small{font-size:11px;color:var(--faint);margin-left:5px;font-weight:700;}
.cats{display:flex;gap:6px;flex-wrap:wrap;}
.cats button{display:inline-flex;align-items:center;gap:6px;font:650 12px var(--b2-sans);padding:6px 11px;border-radius:20px;border:1px solid var(--line);color:var(--ink-2);background:transparent;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s;}
.cats button:hover{background:var(--raised);border-color:var(--accent-line);}
.cats button i{width:8px;height:8px;border-radius:50%;}
.cats button em{font-style:normal;color:var(--faint);font-weight:700;font-size:11px;}
.cats button.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.cats button.on em{color:rgba(255,255,255,.55);}
.grp{margin-left:auto;display:flex;align-items:center;gap:8px;}
.grp .lbl{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;}
.grp.hide{visibility:hidden;}

/* ── groups ── */
#groups{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:10px;row-gap:16px;margin-top:16px;}
.sec{min-width:0;}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:9px;min-width:0;}
.sec-h .pd{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.sec-h .ci{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sec-h .ci svg{width:13px;height:13px;}
.sec-h b{font-family:var(--b2-serif);font-size:17px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sec-h .n{font-size:12px;color:var(--faint);font-weight:700;}
.sec-h .line{flex:1;height:1px;background:var(--line);min-width:8px;}
.sec-h .tot{font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap;}
.sec-h .tot small{color:var(--muted);font-weight:600;}
.wgrid{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px;}

/* ── item card ── */
.it{position:relative;display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;align-items:center;padding:9px 12px 9px 9px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 2px rgba(60,50,30,.04);min-height:80px;cursor:pointer;outline:none;transition:border-color .15s,box-shadow .15s;}
.it:hover,.it:focus-visible{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft),0 6px 16px rgba(60,50,30,.07);}
.th{width:62px;height:62px;border-radius:11px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.th img{width:92%;height:92%;object-fit:contain;mix-blend-mode:multiply;}
.th svg{width:24px;height:24px;opacity:.9;}
.nm{font-size:13px;font-weight:650;line-height:1.3;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;}
.meta{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:nowrap;overflow:hidden;}
.pr{font-family:var(--b2-serif);font-size:14.5px;font-weight:600;color:var(--ink);white-space:nowrap;}
.pr small{font-family:var(--b2-sans);font-size:11px;color:var(--muted);font-weight:650;}
.pr.none{font-family:var(--b2-sans);font-size:11.5px;color:var(--faint);font-weight:600;}
.tg{font-size:10.5px;font-weight:750;padding:2px 7px;border-radius:12px;background:var(--warm);color:var(--muted);white-space:nowrap;}
.tg.soon{background:var(--over-soft);color:var(--over);}
.tg.mo{background:var(--accent-soft);color:var(--accent-deep);}
.tg.age{background:transparent;color:var(--faint);padding:0;}
.lk{margin-left:auto;font-size:12px;color:var(--faint);font-weight:700;text-decoration:none;padding:2px 3px;border-radius:5px;flex-shrink:0;}
.lk:hover{color:var(--accent-deep);background:var(--accent-soft);}
.pdot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;}
.acts{position:absolute;right:9px;bottom:9px;display:flex;gap:4px;opacity:0;pointer-events:none;transition:opacity .12s;}
.it:hover .acts,.it:focus-within .acts{opacity:1;pointer-events:auto;}
.it:hover .lk,.it:focus-within .lk{visibility:hidden;}
.acts button{height:24px;padding:0 8px;border-radius:7px;background:var(--raised);border:1px solid var(--line);font:700 11px var(--b2-sans);color:var(--ink-2);display:flex;align-items:center;cursor:pointer;}
.acts button:hover{border-color:var(--accent-line);color:var(--accent-deep);}
.acts button.got{background:var(--ok-soft);border-color:#cfe5d6;color:var(--ok);}
.acts button.got:hover{border-color:var(--ok);color:var(--ok);}

/* ── empty ── */
.empty{grid-column:1/-1;text-align:center;padding:44px 20px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:18px;}
.empty p{font-family:var(--b2-serif);font-size:17px;font-style:italic;margin-bottom:12px;color:var(--ink-2);}
.linkbtn{border:none;background:none;color:var(--accent-deep);font:650 12.5px var(--b2-sans);cursor:pointer;padding:0;}
.linkbtn:hover{text-decoration:underline;}

/* ── bought list ── */
.bcard{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 22px;box-shadow:0 1px 2px rgba(60,50,30,.04),0 8px 24px rgba(60,50,30,.05);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:36px;}
.brow{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--hair);min-width:0;cursor:pointer;}
.brow:nth-child(-n+2){border-top:none;}
.bhead{grid-column:1/-1;margin-bottom:-7px;}
.brow .th{width:38px;height:38px;border-radius:9px;}
.brow .th svg{width:17px;height:17px;}
.brow .bi{flex:1;min-width:0;}
.brow .bn{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brow:hover .bn{color:var(--accent-deep);}
.brow .bm{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ── footer ── */
.foot{display:flex;align-items:center;gap:10px;margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);font-weight:600;}
.foot b{color:var(--ink-2);font-weight:700;}
.foot .mini{display:flex;}
.foot .mini .th{width:32px;height:32px;border-radius:9px;border:2px solid var(--bg);margin-left:-7px;}
.foot .mini .th:first-child{margin-left:0;}
.foot .mini .th img{width:90%;height:90%;}
.foot .mini .th svg{width:13px;height:13px;}
.foot .more{margin-left:auto;}
.foot.hide{display:none;}

/* ── drawer ── */
.scrim{position:fixed;inset:0;background:rgba(36,31,23,.18);z-index:1000;opacity:0;pointer-events:none;transition:opacity .2s;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100vw;background:var(--surface);border-left:1px solid var(--line);box-shadow:-20px 0 50px rgba(60,50,30,.14);z-index:1001;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .22s ease;visibility:hidden;}
body.dr-open .scrim{opacity:1;pointer-events:auto;}
body.dr-open .drawer{transform:none;visibility:visible;}
.dr-h{display:flex;align-items:center;justify-content:space-between;padding:22px 24px 14px;}
.dr-t{font-family:var(--b2-serif);font-size:21px;font-weight:600;letter-spacing:-.2px;}
.x{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700;background:var(--raised);cursor:pointer;font-size:13px;}
.x:hover{color:var(--ink);}
.dr-b{flex:1;padding:4px 24px 20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;}
.hero{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center;}
.hero .th{width:96px;height:96px;border-radius:14px;}
.hero .th svg{width:34px;height:34px;}
.drop{font-size:12px;color:var(--muted);font-weight:550;line-height:1.45;}
.drop .linkbtn{display:block;font-size:12.5px;font-weight:700;margin-bottom:2px;}
.img-row{display:none;flex-direction:column;gap:6px;}
.img-row.show{display:flex;}
.img-row .row2{display:flex;gap:8px;align-items:center;}
.img-err{font-size:11.5px;color:var(--over);font-weight:600;display:none;}
.img-err.show{display:block;}
.lk-st{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:5px;min-height:0;}
.lk-st:empty{display:none;}
.fl{display:flex;flex-direction:column;gap:6px;min-width:0;}
.fl > label,.fl > .lab{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:750;}
.in{width:100%;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--raised);padding:0 12px;font:600 13.5px var(--b2-sans);color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s;}
.in::placeholder{color:var(--faint);font-weight:550;}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.in.empty{color:var(--faint);}
.in.bad{border-color:var(--over);box-shadow:0 0 0 3px var(--over-soft);}
.in-pre{position:relative;}
.in-pre span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font:600 13.5px var(--b2-sans);color:var(--muted);pointer-events:none;}
.in-pre .in{padding-left:24px;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.seg{display:flex;background:var(--warm-2);border-radius:10px;padding:3px;gap:2px;}
.seg button{flex:1;border:none;background:transparent;text-align:center;padding:7px 4px;border-radius:8px;font:700 12px var(--b2-sans);color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;white-space:nowrap;}
.seg button:hover{color:var(--ink);}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(60,50,30,.1);}
.seg button i{width:8px;height:8px;border-radius:50%;}
.catpick{display:flex;flex-wrap:wrap;gap:6px;}
.catpick button{display:inline-flex;align-items:center;gap:6px;font:650 12px var(--b2-sans);padding:6px 10px;border-radius:9px;border:1px solid var(--line);color:var(--ink-2);background:var(--raised);cursor:pointer;}
.catpick button i{width:8px;height:8px;border-radius:50%;}
.catpick button.on{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent-deep);}
.dr-info{margin-top:auto;font-size:12px;color:var(--muted);font-weight:600;line-height:1.5;}
.dr-info span{color:var(--faint);}
.dr-f{display:flex;align-items:center;gap:8px;padding:16px 24px;border-top:1px solid var(--line);}
.del{border:none;background:none;font:700 12.5px var(--b2-sans);color:var(--over);margin-right:auto;cursor:pointer;padding:6px 0;}
.del:hover{text-decoration:underline;}
.del.arm{background:var(--over-soft);padding:6px 10px;border-radius:8px;text-decoration:none;}
.dr-f .spacer{margin-right:auto;}

/* ── toast ── */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#fff;font:600 13px var(--b2-sans);padding:10px 12px 10px 16px;border-radius:12px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(36,31,23,.25);z-index:1100;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:calc(100vw - 32px);}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
.toast button{border:none;background:rgba(255,255,255,.14);color:#fff;font:700 12px var(--b2-sans);padding:5px 10px;border-radius:8px;cursor:pointer;}
.toast button:hover{background:rgba(255,255,255,.24);}

@media(max-width:1100px){.mix{margin-left:0;}}
@media(max-width:900px){
  #groups{grid-template-columns:minmax(0,1fr);}
  .sec{grid-column:1/-1 !important;}
  .wgrid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;}
  .bcard{grid-template-columns:minmax(0,1fr);}
  .wl-search{width:200px;}
}
@media(max-width:700px){
  .hub{padding:12px 16px 60px;}
  body.b2-shell .topbar.wl-top{flex-wrap:wrap;}
  .topbar-right{width:100%;}
  .wl-search{flex:1;width:auto;}
  .st{padding:0 14px;}
  .grp{margin-left:0;}
}
@media(max-width:560px){.wgrid{grid-template-columns:minmax(0,1fr) !important;}}
</style>

<body>
<script src="../assets/shell.js?v=1026a"></script>

<!-- TITLE ROW -->
<div class="topbar wl-top">
  <div class="topbar-left">
    <a href="../" class="back-btn">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      Brain 2.0
    </a>
    <div>
      <div class="topbar-title">Wishlist</div>
      <div class="wl-sub">Things you want, in one glance</div>
    </div>
  </div>
  <div class="topbar-right">
    <label class="wl-search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="text" placeholder="Search your list…" autocomplete="off" aria-label="Search your list">
      <kbd>/</kbd>
    </label>
    <button class="btn primary lg" id="add-btn" type="button">+ Add item</button>
  </div>
</div>

<div class="hub">
  <div class="strip" id="strip"></div>
  <div class="ctrl">
    <div class="seg-tabs" id="state"></div>
    <div class="cats" id="cats"></div>
    <div class="grp" id="grp-wrap"><span class="lbl">Group by</span>
      <div class="seg-tabs" id="grp"><button type="button" data-g="priority">Priority</button><button type="button" data-g="category">Category</button></div>
    </div>
  </div>
  <div id="groups"></div>
  <div class="foot" id="foot"></div>
</div>

<!-- EDIT / ADD DRAWER -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-title">
  <div class="dr-h"><div class="dr-t" id="dr-title">Edit item</div><button class="x" id="dr-x" type="button" aria-label="Close">✕</button></div>
  <div class="dr-b">
    <div class="hero">
      <div class="th" id="d-thumb"></div>
      <div class="drop"><button type="button" class="linkbtn" id="d-pic-btn">Change picture</button>Paste an image link, or right-click any image → Copy Image Address</div>
    </div>
    <div class="img-row" id="d-img-row">
      <div class="row2"><input class="in" id="d-image" type="text" placeholder="https://… image link" autocomplete="off"><button type="button" class="btn sm" id="d-img-clear">Remove</button></div>
      <div class="img-err" id="d-img-err">That doesn't look like an image link — it should start with https://</div>
    </div>
    <div class="fl"><label for="d-name">Name</label><input class="in" id="d-name" type="text" placeholder="What do you want?" autocomplete="off"></div>
    <div class="two">
      <div class="fl"><label for="d-price">Price</label><div class="in-pre"><span>$</span><input class="in" id="d-price" type="number" min="0" step="0.01" placeholder="0"></div></div>
      <div class="fl"><label for="d-date">Needed by</label><input class="in" id="d-date" type="month" placeholder="Month (optional)"></div>
    </div>
    <div class="fl"><span class="lab">Cost type</span><div class="seg" id="d-cost">
      <button type="button" data-v="one">One-time</button><button type="button" data-v="mo">Monthly</button><button type="button" data-v="yr">Yearly</button>
    </div></div>
    <div class="fl"><span class="lab">Priority</span><div class="seg" id="d-pri"></div></div>
    <div class="fl"><span class="lab">Category</span><div class="catpick" id="d-cat"></div></div>
    <div class="fl"><label for="d-link">Link</label><input class="in" id="d-link" type="text" placeholder="Shop or product page (optional)" autocomplete="off"><div class="lk-st" id="d-link-st"></div></div>
    <div class="fl"><label for="d-note">Note</label><input class="in" id="d-note" type="text" placeholder="Size, colour, why you want it…" autocomplete="off"></div>
    <div class="dr-info"><div id="d-added"></div><span>Esc closes · changes save when you press Save</span></div>
  </div>
  <div class="dr-f">
    <button type="button" class="del" id="d-del">Delete</button>
    <span class="spacer" id="d-spacer"></span>
    <button type="button" class="btn" id="d-bought">✓ Mark bought</button>
    <button type="button" class="btn primary" id="d-save">Save</button>
  </div>
</aside>

<div class="toast" id="toast" role="status"><span id="toast-msg"></span><button type="button" id="toast-undo">Undo</button></div>

<script>
var SK='wishlist1';
var GROUP_KEY='wishlistGroup1'; // view preference only

var CATS=[
  {val:'BeautyCare', label:'Beauty & Care',    color:'#f2c4ce', dark:'#c25b73', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.4 5.4 1.8-5.4 1.8L12 17.4l-1.8-5.4L4.8 10.2l5.4-1.8z"/></svg>'},
  {val:'Style',      label:'Style & Wardrobe', color:'#d4b8e0', dark:'#9159b0', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>'},
  {val:'Home',       label:'Home',             color:'#b8cfb0', dark:'#5e8a55', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>'},
  {val:'Art',        label:'Art & Creative',   color:'#b8d4f0', dark:'#4f86c0', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".8" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".8" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".8" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".8" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.65-.75 1.65-1.69 0-.43-.18-.83-.44-1.12-.29-.29-.44-.65-.44-1.12a1.64 1.64 0 0 1 1.67-1.67H16c3.05 0 5.55-2.5 5.55-5.55C21.5 6 17.5 2 12 2z"/></svg>'},
  {val:'Tech',       label:'Tech & Gadgets',   color:'#c9b6ee', dark:'#7a5fb0', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>'},
  {val:'Books',      label:'Books & Media',    color:'#f0dea0', dark:'#b08e2e', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>'},
  {val:'Health',     label:'Health & Wellness', color:'#a8d8d0', dark:'#4f9387', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>'},
];

var PRIORITIES=[
  {val:'high',   label:'Need it soon', dot:'#cc5a70'},
  {val:'medium', label:'Want it',      dot:'#d9a54a'},
  {val:'someday',label:'Someday',      dot:'#c9bfa9'},
];

var DEFAULT_ITEMS=[];

var items=[];
var stateView='wanting';      // 'wanting' | 'bought'
var catFilter='all';
var searchQuery='';
var groupMode=lsGetRaw(GROUP_KEY)==='category'?'category':'priority';
var editingId=null;
var draft=null;

var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ── STORAGE ── */
function lsGetRaw(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSetRaw(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
function save(){
  if(!lsSetRaw(SK,JSON.stringify(items)))toast("Couldn't save — browser storage is full or blocked",null);
}
function load(){
  var raw=lsGetRaw(SK);
  if(raw){
    try{
      items=JSON.parse(raw);
      if(!Array.isArray(items))items=[];
      items.forEach(function(i){
        if(i.image===undefined)i.image='';
        if(i.recurring===undefined)i.recurring=false;
        if(i.recurPeriod===undefined)i.recurPeriod='mo';
        if(i.addedOn===undefined)i.addedOn=new Date().toISOString().slice(0,10);
        // migrate old category names
        if(i.category==='Beauty'||i.category==='Hair')i.category='BeautyCare';
        if(i.category==='Clothing')i.category='Style';
        if(i.category==='Home & Lifestyle')i.category='Home';
        if(i.category==='Other')i.category='Art';
      });
    }catch(e){items=[];}
  } else {
    items=JSON.parse(JSON.stringify(DEFAULT_ITEMS));save();
  }
}

/* ── HELPERS ── */
function getCat(val){return CATS.find(function(c){return c.val===val;})||CATS[CATS.length-1];}
function getPri(val){return PRIORITIES.find(function(p){return p.val===val;})||PRIORITIES[1];}
function catOf(i){return getCat(i.category).val;}
function priOf(i){return getPri(i.priority).val;}
function shortCat(c){return c.label.split(' &')[0];}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(p){var n=parseFloat(p);return isFinite(n)&&n>0?n:0;}
function money(n){
  var r=Math.round(n*100)/100;
  return '$'+(r%1===0?r.toLocaleString('en-US'):r.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}));
}
function pad(n){return (n<10?'0':'')+n;}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function thisMonth(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function validMonth(m){return typeof m==='string'&&/^\d{4}-\d{2}$/.test(m)&&+m.slice(5)>=1&&+m.slice(5)<=12;}
function fmtDue(m){
  if(!validMonth(m))return '';
  var mon=MON[+m.slice(5)-1],y=m.slice(0,4);
  return y===String(new Date().getFullYear())?mon:mon+" '"+y.slice(2);
}
function isSoon(m){return validMonth(m)&&m<=thisMonth();}
function parseDay(s){
  var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');if(!m)return null;
  return new Date(+m[1],+m[2]-1,+m[3]);
}
function daysSince(s){
  var d=parseDay(s);if(!d)return null;
  var t=new Date();t=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  return Math.max(0,Math.round((t-d)/864e5));
}
function fmtDay(s){var d=parseDay(s);if(!d)return '';var y=d.getFullYear()===new Date().getFullYear()?'':', '+d.getFullYear();return MON[d.getMonth()]+' '+d.getDate()+y;}
function safeImg(u){u=String(u||'').trim();return /^https?:\/\/\S+$/i.test(u)||/^data:image\/[a-z0-9.+-]+[;,]/i.test(u)?u:'';}
function safeLink(u){
  u=String(u||'').trim();if(!u||/\s/.test(u))return '';
  if(/^https?:\/\//i.test(u))return u;
  if(/^[a-z][a-z0-9+.-]*:/i.test(u))return '';
  return /\./.test(u)?'https://'+u.replace(/^\/+/,''):'';
}
function costType(i){return i.recurring?(i.recurPeriod==='yr'?'yr':'mo'):'one';}
function sums(list){
  var s={one:0,mo:0,yr:0};
  list.forEach(function(i){s[costType(i)]+=num(i.price);});
  return s;
}
function sumHtml(s,emptyText){
  var parts=[];
  if(s.one)parts.push(money(s.one));
  if(s.mo)parts.push(money(s.mo)+'<small>/mo</small>');
  if(s.yr)parts.push(money(s.yr)+'<small>/yr</small>');
  return parts.length?parts.join(' + '):(emptyText||'');
}
function wanting(){return items.filter(function(i){return !i.purchased;});}
function bought(){return items.filter(function(i){return !!i.purchased;});}
function matches(i){
  if(catFilter!=='all'&&catOf(i)!==catFilter)return false;
  if(searchQuery){
    var q=searchQuery.toLowerCase();
    return [i.name,i.note,getCat(i.category).label].some(function(s){return String(s||'').toLowerCase().indexOf(q)>=0;});
  }
  return true;
}
function byDue(a,b){
  var da=validMonth(a.date)?a.date:'9999-99',db=validMonth(b.date)?b.date:'9999-99';
  return da<db?-1:da>db?1:0;
}
var PRI_ORDER={high:0,medium:1,someday:2};

function thumb(i){
  var c=getCat(i.category),src=safeImg(i.image);
  if(src)return '<div class="th" style="background:'+c.color+'40;color:'+c.dark+'" data-cat="'+c.val+'"><img src="'+esc(src)+'" alt="" loading="lazy" referrerpolicy="no-referrer"></div>';
  return '<div class="th" style="background:'+c.color+'99;color:'+c.dark+'">'+c.icon+'</div>';
}

/* ── SUMMARY STRIP ── */
function renderStrip(){
  var w=wanting(),s=sums(w),tm=thisMonth();
  var soon=w.filter(function(i){return isSoon(i.date);}).length;
  var cnt={high:0,medium:0,someday:0};w.forEach(function(i){cnt[priOf(i)]++;});
  var rec=[];
  if(s.mo)rec.push(money(s.mo)+'<small>/mo</small>');
  if(s.yr)rec.push(money(s.yr)+'<small>/yr</small>');
  var html=
    '<div class="st"><b>'+w.length+'</b><span>wanting</span></div>'+
    '<div class="st"><b>'+(s.one?money(s.one):'<span class="dim">—</span>')+'</b><span>one-time</span></div>'+
    '<div class="st"><b>'+(rec.length?rec.join(' + '):'<span class="dim">—</span>')+'</b><span>recurring</span></div>'+
    '<div class="st" title="Due this month or already past the month you set"><b>'+soon+'</b><span>needed by '+MON[+tm.slice(5)-1]+'</span></div>';
  html+='<div class="mix"><div class="mixbar">'+(w.length?PRIORITIES.map(function(p){return cnt[p.val]?'<i style="width:'+(cnt[p.val]/w.length*100)+'%;background:'+p.dot+'"></i>':'';}).join(''):'')+'</div>'+
    '<div class="mixleg">'+PRIORITIES.map(function(p){return '<span><i style="background:'+p.dot+'"></i>'+p.label+' '+cnt[p.val]+'</span>';}).join('')+'</div></div>';
  document.getElementById('strip').innerHTML=html;
}

/* ── CONTROLS ── */
function renderControls(){
  var w=wanting().length,b=bought().length;
  document.getElementById('state').innerHTML=
    '<button type="button" data-state="wanting" class="'+(stateView==='wanting'?'on':'')+'">Wanting<small>'+w+'</small></button>'+
    '<button type="button" data-state="bought" class="'+(stateView==='bought'?'on':'')+'">Bought<small>'+b+'</small></button>';
  var pool=stateView==='bought'?bought():wanting();
  var cc={};pool.forEach(function(i){var k=catOf(i);cc[k]=(cc[k]||0)+1;});
  document.getElementById('cats').innerHTML=
    '<button type="button" data-cat="all" class="'+(catFilter==='all'?'on':'')+'">All <em>'+pool.length+'</em></button>'+
    CATS.filter(function(c){return cc[c.val]||catFilter===c.val;}).map(function(c){
      return '<button type="button" data-cat="'+c.val+'" class="'+(catFilter===c.val?'on':'')+'" title="'+esc(c.label)+'"><i style="background:'+c.dark+'"></i>'+esc(shortCat(c))+' <em>'+(cc[c.val]||0)+'</em></button>';
    }).join('');
  document.querySelectorAll('#grp button').forEach(function(bt){bt.classList.toggle('on',bt.getAttribute('data-g')===groupMode);});
  document.getElementById('grp-wrap').classList.toggle('hide',stateView==='bought');
}

/* ── CARDS + GROUPS ── */
function card(i,showPri){
  var c=getCat(i.category),p=getPri(i.priority),ct=costType(i);
  var price=num(i.price);
  var pr=price?'<span class="pr">'+money(price)+(ct!=='one'?'<small>/'+ct+'</small>':'')+'</span>':'<span class="pr none">no price</span>';
  var tags='';
  var due=fmtDue(i.date);
  if(due)tags+='<span class="tg'+(isSoon(i.date)?' soon':'')+'" title="Needed by '+esc(due)+'">by '+esc(due)+'</span>';
  if(ct!=='one')tags+='<span class="tg mo">subscription</span>';
  if(priOf(i)==='someday'){var d=daysSince(i.addedOn);if(d!==null)tags+='<span class="tg age">'+(d?d+'d on list':'new')+'</span>';}
  var lk=safeLink(i.link);
  return '<div class="it" tabindex="0" data-id="'+esc(i.id)+'" title="'+esc(i.note||'')+'">'+thumb(i)+
    '<div style="min-width:0"><div class="nm">'+esc(i.name)+'</div><div class="meta">'+pr+tags+
    (lk?'<a class="lk" href="'+esc(lk)+'" target="_blank" rel="noopener noreferrer" title="Open link" aria-label="Open link">↗</a>':'')+'</div></div>'+
    (showPri?'<i class="pdot" style="background:'+p.dot+'" title="'+esc(p.label)+'"></i>':'')+
    '<div class="acts"><button type="button" class="got" data-act="got">✓ Got it</button><button type="button" data-act="edit">Edit</button></div></div>';
}
function section(head,list,showPri){
  var n=Math.min(list.length,4);
  return '<section class="sec" style="grid-column:span '+n+';--n:'+n+'"><div class="sec-h">'+head+
    '<span class="n">'+list.length+'</span><span class="line"></span><span class="tot">'+sumHtml(sums(list))+'</span></div>'+
    '<div class="wgrid">'+list.map(function(i){return card(i,showPri);}).join('')+'</div></section>';
}
function emptyHtml(){
  var anyFilter=catFilter!=='all'||searchQuery;
  if(anyFilter)return '<div class="empty"><p>Nothing matches'+(searchQuery?' “'+esc(searchQuery)+'”':' this filter')+'.</p><button type="button" class="linkbtn" data-act="clear">Clear search &amp; filters</button></div>';
  if(stateView==='bought')return '<div class="empty"><p>Nothing marked bought yet.</p><button type="button" class="linkbtn" data-state="wanting">Back to your list</button></div>';
  return '<div class="empty"><p>Your wishlist is empty — add the first thing you’re eyeing.</p><button type="button" class="btn primary" data-act="add">+ Add item</button></div>';
}
function renderGroups(){
  var el=document.getElementById('groups');
  if(stateView==='bought'){renderBought(el);return;}
  var list=wanting().filter(matches);
  if(!list.length){el.innerHTML=emptyHtml();return;}
  var h='';
  if(groupMode==='priority'){
    PRIORITIES.forEach(function(p){
      var g=list.filter(function(i){return priOf(i)===p.val;}).sort(byDue);
      if(g.length)h+=section('<i class="pd" style="background:'+p.dot+'"></i><b>'+esc(p.label)+'</b>',g,false);
    });
  } else {
    CATS.forEach(function(c){
      var g=list.filter(function(i){return catOf(i)===c.val;});
      if(!g.length)return;
      g.sort(function(a,b){return (PRI_ORDER[priOf(a)]-PRI_ORDER[priOf(b)])||byDue(a,b);});
      h+=section('<span class="ci" style="background:'+c.color+'99;color:'+c.dark+'">'+c.icon+'</span><b title="'+esc(c.label)+'">'+esc(c.label)+'</b>',g,true);
    });
  }
  el.innerHTML=h;
}
function boughtSort(a,b){var x=a.boughtOn||'',y=b.boughtOn||'';return x<y?1:x>y?-1:0;}
function renderBought(el){
  var list=bought().filter(matches).sort(boughtSort);
  if(!list.length){el.innerHTML=emptyHtml();return;}
  var spent=list.reduce(function(s,i){return s+num(i.price);},0);
  el.innerHTML='<div class="sec-h bhead"><i class="pd" style="background:var(--ok)"></i><b>Bought</b><span class="n">'+list.length+'</span><span class="line"></span><span class="tot">'+(spent?money(spent)+' <small>spent</small>':'')+'</span></div>'+
    '<div class="bcard">'+list.map(function(i){
    var c=getCat(i.category),ct=costType(i),price=num(i.price);
    var meta=[esc(shortCat(c))];
    if(i.boughtOn&&parseDay(i.boughtOn))meta.push('bought '+esc(fmtDay(i.boughtOn)));
    if(price)meta.push(money(price)+(ct!=='one'?'/'+ct:''));
    return '<div class="brow" data-id="'+esc(i.id)+'">'+thumb(i)+'<div class="bi"><div class="bn">'+esc(i.name)+'</div><div class="bm">'+meta.join(' · ')+'</div></div>'+
      '<button type="button" class="btn sm" data-act="undo-bought" title="Move back to your list">Undo</button></div>';
  }).join('')+'</div>';
}

/* ── FOOTER ── */
function renderFoot(){
  var el=document.getElementById('foot');
  var b=bought();
  if(stateView==='bought'||!b.length){el.classList.add('hide');el.innerHTML='';return;}
  el.classList.remove('hide');
  var y=String(new Date().getFullYear());
  var yr=b.filter(function(i){return String(i.boughtOn||'').slice(0,4)===y;});
  var spent=yr.reduce(function(s,i){return s+num(i.price);},0);
  var recent=b.slice().sort(boughtSort).slice(0,7);
  var other=b.length-yr.length;
  el.innerHTML='<div class="mini">'+recent.map(thumb).join('')+'</div>'+
    '<span><b>'+yr.length+' bought</b> this year'+(spent?' · '+money(spent)+' spent':'')+(other?' · '+other+' more all-time':'')+'</span>'+
    '<button type="button" class="linkbtn more" data-state="bought">See bought →</button>';
}

function render(){renderStrip();renderControls();renderGroups();renderFoot();}

/* ── ACTIONS ── */
function findItem(id){return items.find(function(i){return String(i.id)===String(id);});}
var undoFn=null,toastT=null;
function toast(msg,undo){
  undoFn=undo||null;
  document.getElementById('toast-msg').textContent=msg;
  document.getElementById('toast-undo').style.display=undo?'':'none';
  var t=document.getElementById('toast');t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');undoFn=null;},5000);
}
function setBought(it,on){
  var prev={purchased:it.purchased,had:Object.prototype.hasOwnProperty.call(it,'boughtOn'),boughtOn:it.boughtOn};
  it.purchased=on;
  if(on)it.boughtOn=todayISO();else delete it.boughtOn;
  save();render();
  return function(){
    it.purchased=prev.purchased;
    if(prev.had)it.boughtOn=prev.boughtOn;else delete it.boughtOn;
    save();render();
  };
}
function markBought(id){
  var it=findItem(id);if(!it)return;
  var undo=setBought(it,true);
  toast('Marked bought — '+String(it.name||'').slice(0,40),undo);
}
function unmarkBought(id){
  var it=findItem(id);if(!it)return;
  var undo=setBought(it,false);
  toast('Moved back to your list',undo);
}
function deleteItem(id){
  var idx=items.findIndex(function(i){return String(i.id)===String(id);});if(idx<0)return;
  var gone=items.splice(idx,1)[0];save();render();
  toast('Deleted — '+String(gone.name||'').slice(0,40),function(){items.splice(Math.min(idx,items.length),0,gone);save();render();});
}

/* ── DRAWER ── */
var $=function(id){return document.getElementById(id);};
function paintDraft(){
  var c=getCat(draft.category),src=safeImg(draft.image);
  var th=$('d-thumb');
  th.style.background=c.color+(src?'40':'99');th.style.color=c.dark;
  th.innerHTML=src?'<img src="'+esc(src)+'" alt="" referrerpolicy="no-referrer">':c.icon;
  document.querySelectorAll('#d-cost button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-v')===draft.cost);});
  document.querySelectorAll('#d-pri button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-v')===draft.priority);});
  document.querySelectorAll('#d-cat button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-v')===draft.category);});
  $('d-pic-btn').textContent=src?'Change picture':'Add a picture';
}
function openDrawer(id){
  var it=id!=null?findItem(id):null;
  editingId=it?it.id:null;
  draft={
    category:it?getCat(it.category).val:(catFilter!=='all'?catFilter:'BeautyCare'),
    priority:it?priOf(it):'medium',
    cost:it?costType(it):'one',
    image:it?String(it.image||''):''
  };
  $('dr-title').textContent=it?'Edit item':'Add item';
  $('d-name').value=it?(it.name||''):'';
  $('d-name').classList.remove('bad');
  $('d-price').value=it&&num(it.price)?it.price:'';
  $('d-date').value=it&&validMonth(it.date)?it.date:'';
  $('d-date').classList.toggle('empty',!$('d-date').value);
  $('d-link').value=it?(it.link||''):'';
  $('d-link-st').textContent='';lastLook=$('d-link').value.trim();
  $('d-note').value=it?(it.note||''):'';
  $('d-image').value=draft.image;
  $('d-img-err').classList.remove('show');
  $('d-img-row').classList.toggle('show',!!(draft.image&&!safeImg(draft.image)));
  if(it){
    var d=daysSince(it.addedOn);
    $('d-added').textContent=d!==null?('Added '+fmtDay(it.addedOn)+' · on your list '+d+(d===1?' day':' days')):'Added date not recorded';
    if(it.purchased&&it.boughtOn&&parseDay(it.boughtOn))$('d-added').textContent+=' · bought '+fmtDay(it.boughtOn);
  } else $('d-added').textContent='';
  $('d-del').style.display=it?'':'none';
  $('d-spacer').style.display=it?'none':'';
  resetDel();
  $('d-bought').style.display=it?'':'none';
  $('d-bought').textContent=it&&it.purchased?'↩ Back to wanting':'✓ Mark bought';
  paintDraft();
  document.body.classList.add('dr-open');
  $('drawer').scrollTop=0;
  setTimeout(function(){$('d-name').focus();},60);
}
function closeDrawer(){document.body.classList.remove('dr-open');editingId=null;draft=null;resetDel();}
function drawerOpen(){return document.body.classList.contains('dr-open');}
function collect(){
  var name=$('d-name').value.trim();
  if(!name){$('d-name').classList.add('bad');$('d-name').focus();return null;}
  var img=$('d-image').value.trim();
  if(img&&!safeImg(img)){$('d-img-row').classList.add('show');$('d-img-err').classList.add('show');$('d-image').focus();return null;}
  return {
    name:name,
    category:draft.category,
    priority:draft.priority,
    price:parseFloat($('d-price').value)||0,
    date:$('d-date').value,
    link:$('d-link').value.trim(),
    note:$('d-note').value.trim(),
    image:img,
    recurring:draft.cost!=='one',
    recurPeriod:draft.cost==='yr'?'yr':'mo'
  };
}
function saveDrawer(thenToggleBought){
  var f=collect();if(!f)return;
  var it;
  if(editingId!=null){
    it=findItem(editingId);if(!it)return closeDrawer();
    if(!f.recurring)f.recurPeriod=it.recurPeriod||'mo';
    Object.keys(f).forEach(function(k){it[k]=f[k];});
  } else {
    it={id:'w_'+Date.now(),name:f.name,category:f.category,priority:f.priority,price:f.price,date:f.date,link:f.link,note:f.note,image:f.image,
        recurring:f.recurring,recurPeriod:f.recurPeriod,purchased:false,addedOn:todayISO()};
    items.push(it);
  }
  var id=it.id;
  closeDrawer();
  if(thenToggleBought){
    save();
    if(it.purchased)unmarkBought(id);else markBought(id);
  } else {save();render();}
}
var delT=null;
function resetDel(){clearTimeout(delT);var b=$('d-del');b.classList.remove('arm');b.textContent='Delete';}

/* drawer wiring */
$('d-pri').innerHTML=PRIORITIES.map(function(p){return '<button type="button" data-v="'+p.val+'"><i style="background:'+p.dot+'"></i>'+esc(p.label)+'</button>';}).join('');
$('d-cat').innerHTML=CATS.map(function(c){return '<button type="button" data-v="'+c.val+'" title="'+esc(c.label)+'"><i style="background:'+c.dark+'"></i>'+esc(shortCat(c))+'</button>';}).join('');
$('d-cost').addEventListener('click',function(e){var b=e.target.closest('button');if(b&&draft){draft.cost=b.getAttribute('data-v');paintDraft();}});
$('d-pri').addEventListener('click',function(e){var b=e.target.closest('button');if(b&&draft){draft.priority=b.getAttribute('data-v');paintDraft();}});
$('d-cat').addEventListener('click',function(e){var b=e.target.closest('button');if(b&&draft){draft.category=b.getAttribute('data-v');paintDraft();}});
$('d-pic-btn').addEventListener('click',function(){var r=$('d-img-row');r.classList.add('show');$('d-image').focus();$('d-image').select();});
$('d-image').addEventListener('input',function(){
  var v=this.value.trim(),ok=!v||!!safeImg(v);
  $('d-img-err').classList.toggle('show',!ok);
  if(ok&&draft){draft.image=v;paintDraft();}
});
$('d-img-clear').addEventListener('click',function(){$('d-image').value='';$('d-img-err').classList.remove('show');if(draft){draft.image='';paintDraft();}});
$('d-name').addEventListener('input',function(){this.classList.remove('bad');});
/* paste a product link → its picture (and name, if blank) fill in from the page's preview image */
var linkLook=0,lastLook='';
function lookupLink(){
  var u=$('d-link').value.trim(),st=$('d-link-st');
  if(!/^https?:\/\//i.test(u)||!draft){st.textContent='';return;}
  if(u===lastLook)return;lastLook=u;
  if(safeImg(draft.image)&&$('d-name').value.trim()){st.textContent='';return;}
  var n=++linkLook;st.textContent='Looking for a picture…';
  fetch('https://api.microlink.io/?url='+encodeURIComponent(u)).then(function(r){return r.json();}).then(function(j){
    if(n!==linkLook||!draft)return;
    var d=(j&&j.status==='success'&&j.data)||{},img=d.image&&d.image.url,got=[];
    if(img&&safeImg(img)&&!safeImg(draft.image)){draft.image=img;$('d-image').value=img;paintDraft();got.push('picture');}
    if(d.title&&!$('d-name').value.trim()){$('d-name').value=String(d.title).slice(0,90);got.push('name');}
    st.textContent=got.length?'Added the '+got.join(' and ')+' from the link — change anything you like.':'Couldn’t find a picture on that page — you can paste an image link above.';
  }).catch(function(){if(n===linkLook)st.textContent='Couldn’t reach that page — you can paste an image link above.';});
}
$('d-link').addEventListener('change',lookupLink);
$('d-link').addEventListener('paste',function(){setTimeout(lookupLink,0);});
$('d-date').addEventListener('input',function(){this.classList.toggle('empty',!this.value);});
$('d-save').addEventListener('click',function(){saveDrawer(false);});
$('d-bought').addEventListener('click',function(){saveDrawer(true);});
$('d-del').addEventListener('click',function(){
  var b=this;
  if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='Click again to delete';delT=setTimeout(resetDel,3000);return;}
  var id=editingId;closeDrawer();deleteItem(id);
});
$('dr-x').addEventListener('click',closeDrawer);
$('scrim').addEventListener('click',closeDrawer);
$('drawer').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.id!=='d-image'){e.preventDefault();saveDrawer(false);}
});

/* page wiring */
$('add-btn').addEventListener('click',function(){openDrawer(null);});
$('search').addEventListener('input',function(){searchQuery=this.value.trim();renderControls();renderGroups();});
$('grp').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  groupMode=b.getAttribute('data-g');lsSetRaw(GROUP_KEY,groupMode);render();
});
$('toast-undo').addEventListener('click',function(){var f=undoFn;undoFn=null;$('toast').classList.remove('show');if(f)f();});
document.addEventListener('click',function(e){
  var t=e.target;
  var st=t.closest('[data-state]');if(st){stateView=st.getAttribute('data-state');catFilter='all';render();window.scrollTo({top:0});return;}
  var cf=t.closest('#cats [data-cat]');if(cf){catFilter=cf.getAttribute('data-cat');renderControls();renderGroups();return;}
  var act=t.closest('[data-act]');
  if(act){
    var a=act.getAttribute('data-act'),host=act.closest('[data-id]'),id=host&&host.getAttribute('data-id');
    e.stopPropagation();
    if(a==='got')markBought(id);
    else if(a==='edit')openDrawer(id);
    else if(a==='undo-bought')unmarkBought(id);
    else if(a==='add')openDrawer(null);
    else if(a==='clear'){catFilter='all';searchQuery='';$('search').value='';renderControls();renderGroups();}
    return;
  }
  if(t.closest('.lk'))return;
  var row=t.closest('#groups [data-id]');if(row)openDrawer(row.getAttribute('data-id'));
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(drawerOpen()){e.preventDefault();closeDrawer();return;}
    if(document.activeElement===$('search')&&$('search').value){$('search').value='';searchQuery='';renderControls();renderGroups();}
    return;
  }
  var tag=(e.target.tagName||'').toLowerCase();
  var typing=tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable;
  if(e.key==='/'&&!typing&&!drawerOpen()&&!e.metaKey&&!e.ctrlKey){e.preventDefault();$('search').focus();return;}
  if(e.key==='Enter'&&!typing&&e.target.classList&&e.target.classList.contains('it')){openDrawer(e.target.getAttribute('data-id'));}
});
/* broken picture links fall back to the category tile */
document.addEventListener('error',function(e){
  var img=e.target;if(!img||img.tagName!=='IMG')return;
  var th=img.closest('.th');if(!th)return;
  var c=getCat(th.getAttribute('data-cat')||(draft&&th.id==='d-thumb'?draft.category:''));
  th.style.background=c.color+'99';th.style.color=c.dark;th.innerHTML=c.icon;
},true);

load();render();
</script>
</body>
</html>
