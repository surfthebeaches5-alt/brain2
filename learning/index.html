  }else if(s.tt){up='<div class="soft-empty" style="color:var(--ok)">✓ Everything complete — nice work.</div>';}
  else{up='<div class="soft-empty">Nothing tracked yet — add the courses or modules below.</div>';}
  /* pace — calm, never "overdue" */
  var remaining=s.mt?s.mt-s.md:(s.tt-s.dn), unitW=s.mt?'module':'course', paceH='';
  if(p.targetDate&&remaining>0){
    var dl=U.diff(U.today(),p.targetDate);
    var need=dl>0?remaining/Math.max(1,dl/7):remaining;
    var needTxt=dl>0?'~'+(Math.round(need*2)/2)+' '+unitW+(need>1?'s':'')+' a week':'a gentle new goal date might help';
    var recent=0;p.courses.forEach(function(c){c.modules.forEach(function(m){if(m.done&&m.doneOn&&U.diff(m.doneOn,U.today())<28)recent++;});});
    paceH='<div class="pace"><div><span>To make '+esc(U.md(p.targetDate))+'</span><b>'+esc(needTxt)+'</b></div>'+
      (s.mt?'<div><span>Last 4 weeks</span><b>'+(Math.round(recent/4*10)/10)+' a week'+(dl>0?(recent/4>=need?' · on track':' · a bit more would do it'):'')+'</b></div>':'')+'</div>';
  }else if(remaining>0){paceH='<div class="pace"><div><span>Left to go</span><b>'+remaining+' '+unitW+(remaining===1?'':'s')+'</b></div><div><span>Goal date</span><b><button class="more" onclick="CO.openEditModal('+A(p.id)+')">Set one</button></b></div></div>';}
  var linksHtml=(p.links||[]).map(function(l,i){var u=U.safeUrl(l.url);return '<a class="tool" href="'+esc(u||'#')+'" target="_blank" rel="noopener"><span class="av" style="background:'+LINKC[i%LINKC.length]+'">'+esc((l.label||'?').trim().charAt(0).toUpperCase())+'</span><span class="lt">'+esc(l.label)+'</span><span class="ar">↗</span><button class="tx" title="Remove link" onclick="event.preventDefault();event.stopPropagation();CO.delLink('+i+')">✕</button></a>';}).join('');
  var goal=p.targetDate?('goal '+U.md(p.targetDate)+(U.diff(U.today(),p.targetDate)>0?' · '+U.diff(U.today(),p.targetDate)+' days':'')):'';
  host.innerHTML=switcher()+
    '<div class="print-stamp">'+esc(p.name)+' — printed '+esc(U.longDate(U.today()))+'</div>'+
    '<section class="card ch"><div style="min-width:0"><div class="eb" style="color:var(--on)">'+esc(eb)+'</div><h2>'+esc(p.name)+'</h2><div class="meta">'+meta.join('')+'</div></div>'+
      '<div class="side">'+(p.url?'<a class="btn sm primary" href="'+esc(U.safeUrl(p.url))+'" target="_blank" rel="noopener">Open course ↗</a>':'')+'<button class="btn sm" onclick="CO.openEditModal('+A(p.id)+')">Edit</button></div></section>'+
    '<div class="grid">'+
      '<div class="s7 stack">'+
        '<section class="card"><div class="card-h"><div class="card-t">Up next</div><span class="card-m">picks up where you left off</span></div>'+up+'</section>'+
        '<section class="card"><div class="card-h"><div class="card-t">'+(isFlat(p)?'Modules':'Courses')+'</div><div style="display:flex;gap:10px;align-items:center"><span class="card-m">'+s.dn+' of '+s.tt+' complete</span>'+(isFlat(p)?'':'<button class="btn sm soft" onclick="CO.addCourse()">+ Course</button>')+'</div></div>'+coursesHtml(p)+'</section>'+
      '</div>'+
      '<div class="s5 stack">'+
        '<section class="card"><div class="card-h"><div class="card-t">Progress</div><span class="card-m">'+esc(goal)+'</span></div>'+
          '<div class="ringwrap">'+U.ring(s.pct,TR.online.hex,92)+'<div><div class="big2">'+s.dn+' <small>of '+s.tt+' '+s.unit+'</small></div>'+(s.mt&&!isFlat(p)?'<div class="card-m" style="margin-top:6px">'+s.md+' of '+s.mt+' modules done</div>':'')+'</div></div>'+paceH+'</section>'+
        '<section class="card"><div class="card-h"><div class="card-t">Why I’m taking it</div><button class="more" onclick="CO.editWhy()">Edit</button></div>'+(p.purpose?'<div class="notes" style="font-weight:550;line-height:1.55">'+esc(p.purpose)+'</div>':'<div class="soft-empty">What it’s for and what you want out of it.</div>')+'</section>'+
        '<section class="card"><div class="card-h"><div class="card-t">Links</div><button class="more" onclick="CO.addLink()">+ Add link</button></div>'+(linksHtml?'<div class="tools">'+linksHtml+'</div>':'<div class="soft-empty">Course home, your notebook, the forum…</div>')+'</section>'+
        '<section class="card"><div class="card-h"><div class="card-t">Notes</div><button class="more" onclick="CO.editNotes()">'+(editingNotes?'Done':'Edit')+'</button></div>'+
          (editingNotes?'<textarea class="notes-ed" id="co-notes" placeholder="What to focus on, where you left off…" onchange="CO.saveNotes(this.value)">'+esc(p.notes)+'</textarea>':'<div class="notes notes-screen">'+(U.bullets(p.notes)||'<div class="soft-empty" style="padding:0">What to focus on, where you left off…</div>')+'</div>')+
          '<div class="notes-print">'+esc(p.notes||'')+'</div></section>'+
      '</div>'+
    '</div>';
}
function cur(){return getById(activeId);}
function done(m,v){m.done=v;if(v)m.doneOn=U.today();else delete m.doneOn;}
function markNext(pid){
  var p=pid?getById(pid):cur();if(!p)return;var k=cursor(p);if(!k)return;var c=p.courses[k.ci];
  if(k.mi>=0)done(c.modules[k.mi],true);else{c.done=true;c.doneOn=U.today();}
  saveData();APP.render();
}
var api={
  load:loadData,render:render,seasonChanged:seasonChanged,inSeason:inSeason,inSeasonList:inSeasonList,seasonId:seasonId,stats:stats,nextLabel:nextLabel,cursor:cursor,complete:complete,
  all:function(){return programs;},get:getById,markNext:markNext,
  setActive:function(id){activeId=id;openCourse={};editingNotes=false;APP.render();},
  toggleExpand:function(cid){openCourse[cid]=!openCourse[cid];APP.render();},
  toggleCourse:function(ci){const p=cur();if(!p||!p.courses[ci])return;const c=p.courses[ci];if(c.modules.length){const all=c.modules.every(function(m){return m.done;});c.modules.forEach(function(m){done(m,!all);});}else{c.done=!c.done;}saveData();APP.render();},
  toggleModule:function(ci,mi){const p=cur();if(!p||!p.courses[ci]||!p.courses[ci].modules[mi])return;var m=p.courses[ci].modules[mi];done(m,!m.done);saveData();APP.render();},
  addModule:function(ci){const p=cur();if(!p)return;if(!p.courses[ci])p.courses[ci]={cid:cuid(),name:p.name,link:'',done:false,modules:[]};const inp=document.getElementById('co-newmod-'+ci);const name=inp?inp.value.trim():'';if(!name)return;p.courses[ci].modules.push({id:cuid(),name:name,done:false});saveData();APP.render();const fresh=document.getElementById('co-newmod-'+ci);if(fresh)fresh.focus();},
  delModule:function(ci,mi){const p=cur();if(!p||!p.courses[ci])return;p.courses[ci].modules.splice(mi,1);saveData();APP.render();},
  addCourse:function(){const p=cur();if(!p)return;FORM.open({title:'Add a course',sub:p.name,fields:[{name:'name',label:'Course name',placeholder:'Course name'},{name:'link',label:'Link',opt:'optional',placeholder:'https://…'}],
    onSave:function(v){if(!v.name.trim())return false;p.courses.push({cid:cuid(),name:v.name.trim(),link:U.safeUrl(v.link),done:false,modules:[]});saveData();APP.render();}});},
  delCourse:function(ci){const p=cur();if(!p)return;if(!confirm('Remove this course and its modules?'))return;p.courses.splice(ci,1);saveData();APP.render();},
  editCourseLink:function(ci){const p=cur();if(!p||!p.courses[ci])return;var c=p.courses[ci];FORM.open({title:'Course details',fields:[{name:'name',label:'Name',value:c.name},{name:'link',label:'Link (course page or study notes)',value:c.link||'',placeholder:'https://…'}],
    onSave:function(v){if(v.name.trim())c.name=v.name.trim();c.link=U.safeUrl(v.link);saveData();APP.render();}});},
  addLink:function(){const p=cur();if(!p)return;FORM.open({title:'Add a link',fields:[{name:'label',label:'Label',placeholder:'e.g. Course home'},{name:'url',label:'URL',placeholder:'https://…'}],
    onSave:function(v){if(!v.label.trim())return false;var u=U.safeUrl(v.url);p.links.push({label:v.label.trim(),url:u});saveData();if(u)LIB.linkUp(u,v.label.trim(),'online',p.id);APP.render();}});},
  delLink:function(i){const p=cur();if(!p)return;var l=p.links[i];p.links.splice(i,1);saveData();if(l)LIB.detachUrl(l.url,'online',p.id,'link');APP.render();},
  editWhy:function(){const p=cur();if(!p)return;FORM.open({title:'Why I’m taking it',fields:[{name:'why',type:'textarea',label:'Purpose',value:p.purpose||'',placeholder:'What it’s for, what you want out of it…'}],onSave:function(v){p.purpose=v.why.trim();saveData();APP.render();}});},
  editNotes:function(){if(editingNotes){var n=document.getElementById('co-notes');if(n)api.saveNotes(n.value);}editingNotes=!editingNotes;APP.render();if(editingNotes){var x=document.getElementById('co-notes');if(x)x.focus();}},
  saveNotes:function(v){const p=cur();if(p){p.notes=v;saveData();}},

    editingId=null;var g=function(i){return document.getElementById(i);};

  saveProgram:function(){

    var f={name:name,platform:g('pm-platform').value.trim(),category:g('pm-category').value,status:g('pm-status').value,targetDate:g('pm-target').value,
      startDate:g('pm-start').value,url:U.safeUrl(g('pm-url').value),purpose:g('pm-purpose').value.trim(),notes:g('pm-notes').value.trim()};

  }
};
return api;
})();

<script>
/* ════════════ SELF-STUDY (curriculum1) ════════════
   A personal syllabus: no sessions or timers — each unit has dates, a guiding question and a short to-do list.
   [{id,title,subtitle?,theme,status:'catalog'|'next'|'active'|'done',seasonId?,start,end,why,goals:[str],project{text,due,done},
     units[{id,title,question,start,end,todos[{id,kind:'read'|'watch'|'listen'|'do'|'write',text,note,url,image,done,doneOn?,resId?,auto?}]}],
     notes[{id,date,title?,text,words?}],calendarSync}]
   A to-do with a link is also saved in Resources (learnLibrary1) with a "For" link back to its topic (resId).
   Older saves (sessions, rhythm, proof week, proof of learning, materials) are migrated on load. */
var SS=(function(){
var KEY='curriculum1', list=[], activeId=null, sel=null, editId=null, editVals=null, importHidden=false, P=null, showAllNotes=false, pendingMat=[];
var draft={kind:'read',text:'',kindSet:false}, look=null, lookT=null, busy={};
var esc=U.esc, A=U.a;
var KINDS={read:'Read',watch:'Watch',listen:'Listen',do:'Do',write:'Write'};
var GLYPH={read:'📖',watch:'▶',listen:'🎧',do:'✋',write:'✎'};
var THEMEC=['#c25b73','#5f9568','#c0863a','#5f88b8','#8e71d3','#5fa39a'];
var STATUS={catalog:'In catalog',next:'Maybe next season',active:'Studying now',done:'Done'};
var MATT={book:'book',podcast:'podcast',youtube:'video',video:'video',talk:'video',article:'article',course:'course',website:'website'};
var ORD=['first','second','third','fourth','fifth','sixth'];

/* ── data ── */
function trim(s){return String(s==null?'':s).trim();}
function kindOf(k){k=String(k||'').toLowerCase();return KINDS[k]?k:'do';}
function normTodo(t){
  t=t||{};var o={id:t.id||U.uid('t'),kind:kindOf(t.kind),text:trim(t.text),note:trim(t.note),url:t.url?U.safeUrl(t.url):'',image:t.image?U.safeUrl(t.image):'',done:!!t.done};
  if(o.done&&U.valid(t.doneOn))o.doneOn=t.doneOn;if(t.resId)o.resId=String(t.resId);if(t.auto&&o.url)o.auto=true;return o;
}
function normUnit(u){
  u=u||{};var todos=Array.isArray(u.todos)?u.todos.map(normTodo):[];
  /* old shape: dated sessions become plain to-dos (only the ones with something written in them) */
  if(Array.isArray(u.sessions))u.sessions.forEach(function(s){if(s&&trim(s.text))todos.push(normTodo({id:s.id,kind:s.kind,text:s.text,done:s.done}));});
  return {id:u.id||U.uid('u'),title:trim(u.title),question:trim(u.question),start:U.valid(u.start)?u.start:'',end:U.valid(u.end)?u.end:'',todos:todos};
}
function normNote(n){n=n||{};var o={id:n.id||U.uid('n'),date:U.valid(n.date)?n.date:'',title:trim(n.title),text:String(n.text||'')};if(!trim(o.text)&&+n.words)o.words=+n.words;return o;}
function words(n){return trim(n.text)?U.words(n.text):(+n.words||0);}
function norm(c){
  c=c&&typeof c==='object'?c:{};
  var se=c.season&&typeof c.season==='object'?c.season:{}, pw=c.proofWeek&&typeof c.proofWeek==='object'?c.proofWeek:null, pj=c.project&&typeof c.project==='object'?c.project:{};
  var o={id:c.id||U.uid('c'),title:trim(c.title)||'Untitled',subtitle:trim(c.subtitle),theme:trim(c.theme),status:STATUS[c.status]?c.status:'catalog',
    start:U.valid(c.start)?c.start:U.valid(se.start)?se.start:'',end:U.valid(c.end)?c.end:U.valid(se.end)?se.end:'',
    why:[trim(c.why),trim(c.intention)].filter(Boolean).join('\n\n'),
    goals:(Array.isArray(c.goals)?c.goals:[]).map(trim).filter(Boolean),
    project:{text:trim(pj.text)||(pw?trim(pw.idea):''),due:U.valid(pj.due)?pj.due:pw&&U.valid(pw.end)?pw.end:pw&&U.valid(pw.start)?pw.start:'',done:!!pj.done},

/* past · cur · future — by dates when a unit has them, otherwise by what's ticked */
function unitState(c,u,i){
  var t=U.today();
  if(U.valid(u.start)&&U.valid(u.end)){if(u.end<t)return 'past';if(u.start<=t)return 'cur';return 'future';}
  var fo=-1;c.units.some(function(x,j){if(!unitDone(x)){fo=j;return true;}return false;});
  return fo<0||i<fo?'past':i===fo?'cur':'future';

/* the unit the top card shows by default: the current one, else the next one, else the last */
function nowIndex(c){

  c.units.forEach(function(u,j){if(i<0&&unitState(c,u,j)==='future')i=j;});return i>=0?i:c.units.length-1;
}
function curUnit(c){var i=-1;c.units.forEach(function(u,j){if(i<0&&unitState(c,u,j)==='cur')i=j;});return i>=0?{u:c.units[i],ui:i}:null;}

function span(a,b){if(!U.valid(a)||!U.valid(b))return '';var d=U.diff(a,b)+1;if(d<7)return d+' day'+(d===1?'':'s');var w=Math.floor(d/7);return w+' week'+(w===1?'':'s');}

  return plans.filter(function(p){return p&&typeof p==='object'&&!list.some(function(c){return c.importedFrom==='selfStudy1:'+(p.id||p.title);});});

function importLegacy(){
  var plans=legacyPlans(), n=0;
  plans.forEach(function(p){
    function mk(text,done){return normTodo({kind:'do',text:String(text||''),done:!!done});}
    var c=norm({title:p.title||p.name||'Self-study plan',subtitle:p.subtitle||p.description||'',theme:p.theme||p.category||'',why:p.why||p.purpose||p.goal||'',intention:p.intention||''});
    c.importedFrom='selfStudy1:'+(p.id||p.title);
    c.units=(Array.isArray(p.modules)?p.modules:[]).map(function(m,i){
      m=m||{};var td=[], ds=[];
      (m.tasks||[]).forEach(function(t){if(!t)return;td.push(mk(t.label||t.title,t.done));if(U.valid(t.due))ds.push(t.due);});
      (m.coursework||[]).forEach(function(w){if(!w)return;td.push(mk(w.title||w.source,w.done));if(U.valid(w.due))ds.push(w.due);});
      if(!td.length&&m.title)td.push(mk(m.title,m.done));
      if(U.valid(m.due))ds.push(m.due);ds.sort();
      return {id:U.uid('u'),title:trim(m.title)||('Unit '+(i+1)),question:trim(m.question||m.objective||m.description),start:ds[0]||'',end:ds[ds.length-1]||'',todos:td.filter(function(t){return t.text;})};
    });
    var extra=[], eds=[];
    (p.tasks||[]).forEach(function(t){if(!t)return;extra.push(mk(t.label||t.title,t.done));if(U.valid(t.due))eds.push(t.due);});
    (p.milestones||[]).forEach(function(m){if(!m)return;extra.push(mk(m.text||m.title,m.done));if(U.valid(m.due))eds.push(m.due);});
    extra=extra.filter(function(t){return t.text;});eds.sort();
    if(extra.length)c.units.push({id:U.uid('u'),title:'Tasks & milestones',question:'',start:eds[0]||'',end:eds[eds.length-1]||'',todos:extra});
    var all=[];c.units.forEach(function(u){if(u.start)all.push(u.start);if(u.end)all.push(u.end);});all.sort();
    if(all.length){c.start=all[0];c.end=all[all.length-1];var se=SEA.ensure(all[0]);if(se)c.seasonId=se.id;}
    var open=c.units.some(function(u){return u.todos.some(function(t){return !t.done;});});
    c.status=p.archived?'done':(open?(all.length?'active':'next'):(all.length?'done':'catalog'));
    list.push(c);n++;

  save();if(list[list.length-1])activeId=list[list.length-1].id;sel=null;APP.render();U.toast('Imported '+n+' plan'+(n===1?'':'s')+' into your curriculum');
}

/* ── Plan a topic / Edit plan drawer ── */
function weeksOf(a,b){return U.valid(a)&&U.valid(b)?Math.max(1,Math.floor((U.diff(a,b)+1)/7)):0;}
function evenWeeks(){
  var n=P.units.length;if(!n)return;
  var total=Math.max(1,Math.floor((U.diff(P.start,P.end)+1)/7)), avail=Math.max(n,total-(P.project?P.pweeks:0)), each=Math.max(1,Math.floor(avail/n)), rem=Math.max(0,avail-each*n);
  P.units.forEach(function(u,i){u.weeks=each+(i<rem?1:0);});
}
function layout(){
  var cur0=P.start, out=[];
  P.units.forEach(function(u){var e=U.add(cur0,Math.max(1,u.weeks)*7-1);out.push({start:cur0,end:e});cur0=U.add(e,1);});
  var proj=P.project?{start:cur0,end:U.add(cur0,Math.max(1,P.pweeks)*7-1)}:null;
  /* a leftover tail shorter than a week goes to the last block, so the plan ends with the season */
  var last=proj||out[out.length-1];
  if(last&&last.end<P.end&&U.diff(last.end,P.end)<7)last.end=P.end;
  return {units:out,project:proj,end:last?last.end:P.start};
}
function openPlan(id,seasonOverride){
  var c=id?get(id):null;
  var s=SEA.get(seasonOverride)||(c&&SEA.get(seasonId(c)))||(SEA.status(SEA.selected())!=='past'?SEA.selected():SEA.current());
  var t=U.today(), dated=c&&U.valid(c.start)&&U.valid(c.end)&&c.units.length&&!seasonOverride;
  var units=c&&c.units.length?c.units.map(function(u){return {id:u.id,title:u.title,question:u.question,weeks:dated?weeksOf(u.start,u.end):0,todos:u.todos.length};})
    :[0,1,2].map(function(){return {id:null,title:'',question:'',weeks:0,todos:0};});
  var pr=c?projRange(c):null;
  P={cid:c?c.id:null,title:c?c.title:'',theme:c?c.theme:'',seasonId:s.id,start:dated?c.start:(t>s.start&&t<=s.end?t:s.start),end:dated?c.end:s.end,
    why:c?c.why:'',goals:c?c.goals.join('\n'):'',units:units,project:c?hasProject(c)||!c.units.length:true,ptext:c?c.project.text:'',pweeks:pr&&dated?weeksOf(pr.start,pr.end):1,calendarSync:c?c.calendarSync:false};
  if(P.units.some(function(u){return !u.weeks;}))evenWeeks();

  if(!P.cid)setTimeout(function(){var el=document.getElementById('pl-title');if(el)try{el.focus();}catch(e){}},40);
}
function closePlan(){P=null;document.getElementById('planScrim').classList.remove('show');document.getElementById('planDrawer').classList.remove('show');}
function previewHtml(){
  var L=layout(), h=L.units.map(function(r,i){var u=P.units[i];return '<div class="pl-pr"><span>'+esc(fullRange(r.start,r.end))+'</span><b>'+(i+1)+' · '+esc(trim(u.title)||'Unit '+(i+1))+'</b><small>'+esc(span(r.start,r.end))+'</small></div>';}).join('');

  var msg='';

  else if(U.diff(L.end,P.end)>=7)msg='<div class="pl-msg">Leaves '+span(U.add(L.end,1),P.end)+' free before '+esc(U.md(P.end))+' — room to breathe, or give a unit more time.</div>';
  return h+msg;
}
function drawPreview(){var el=document.getElementById('pl-prev');if(el)el.innerHTML=previewHtml();}
function drawPlan(){
  if(!P)return;var dr=document.getElementById('planDrawer'), bd=dr.querySelector('.dr-b'), st=bd?bd.scrollTop:0;
  var sOpts=SEA.all().slice().reverse().map(function(s){return '<option value="'+esc(s.id)+'"'+(s.id===P.seasonId?' selected':'')+'>'+esc(s.name)+' · '+esc(U.range(s.start,s.end))+'</option>';}).join('');
  var unitsH=P.units.map(function(u,i){
    return '<div class="pl-u"><span class="k">'+(i+1)+'</span><div class="f"><input class="in2" id="pl-u'+i+'" value="'+esc(u.title)+'" placeholder="Unit name" oninput="SS.planU('+i+',\'title\',this.value)" aria-label="Unit '+(i+1)+' name">'+
      '<input class="in2" value="'+esc(u.question)+'" placeholder="Guiding question — what do you want to understand?" oninput="SS.planU('+i+',\'question\',this.value)" aria-label="Unit '+(i+1)+' guiding question">'+
      '<div class="pl-w"><button onclick="SS.planWeeks('+i+',-1)" aria-label="Fewer weeks">−</button><b>'+u.weeks+' wk'+(u.weeks===1?'':'s')+'</b><button onclick="SS.planWeeks('+i+',1)" aria-label="More weeks">+</button>'+
      '<small>'+(u.todos?u.todos+' to-do'+(u.todos===1?'':'s')+' — they stay with the unit':'')+'</small>'+
      (P.units.length>1?'<button class="rm" onclick="SS.planUnit('+i+')" title="Remove unit" aria-label="Remove unit">✕</button>':'')+'</div></div></div>';
  }).join('');
  var themesDl=themes().filter(Boolean);
  dr.innerHTML=
    '<div class="dr-h"><span class="eyebrow" style="color:var(--ss)">Self-study</span><div class="card-t" style="margin-top:4px">'+(P.cid?'Edit plan':'Plan a topic')+'</div><div class="card-m" style="margin-top:4px;font-weight:550;line-height:1.45">A few units back to back, each with a guiding question. To-dos come later — add them to each unit as you go.'+(P.cid?' Existing to-dos and ticks stay with their units.':'')+'</div></div>'+
    '<div class="dr-b">'+
      '<div class="stp"><span class="n">1</span><div class="col"><div class="l" style="margin-bottom:0">Topic</div><input class="in2" id="pl-title" value="'+esc(P.title)+'" placeholder="What do you want to learn about?" oninput="SS.planSet(\'title\',this.value)" aria-label="Topic name">'+
        '<input class="in2" id="pl-theme" value="'+esc(P.theme)+'" placeholder="Theme (optional) — groups it in your curriculum" list="pl-themes" oninput="SS.planSet(\'theme\',this.value)" aria-label="Theme"><datalist id="pl-themes">'+themesDl.map(function(x){return '<option value="'+esc(x)+'">';}).join('')+'</datalist></div></div>'+
      '<div class="stp"><span class="n">2</span><div class="col"><div class="l" style="margin-bottom:0">When</div><select class="in2" id="pl-season" onchange="SS.planSet(\'season\',this.value)" aria-label="Season">'+sOpts+'</select>'+
        '<div style="display:flex;gap:8px;align-items:center"><input class="in2" type="date" id="pl-start" value="'+esc(P.start)+'" onchange="SS.planSet(\'start\',this.value)" aria-label="Start" style="flex:1"><span class="card-m">→</span><input class="in2" type="date" id="pl-end" value="'+esc(P.end)+'" onchange="SS.planSet(\'end\',this.value)" aria-label="End" style="flex:1"></div></div></div>'+
      '<div class="stp"><span class="n">3</span><div class="col"><div class="l" style="margin-bottom:0">Why &amp; goals</div><textarea class="in2" id="pl-why" placeholder="Why this topic, and why now?" oninput="SS.planSet(\'why\',this.value)" aria-label="Why">'+esc(P.why)+'</textarea>'+
        '<textarea class="in2" id="pl-goals" placeholder="By the end I want to… (one per line)" oninput="SS.planSet(\'goals\',this.value)" aria-label="Goals, one per line">'+esc(P.goals)+'</textarea></div></div>'+
      '<div class="stp"><span class="n">4</span><div class="col"><div class="l" style="margin-bottom:0">Units</div>'+unitsH+

        (P.project?'<div class="pl-u" style="grid-template-columns:minmax(0,1fr)"><div class="f"><input class="in2" id="pl-ptext" value="'+esc(P.ptext)+'" placeholder="What will you make? (you can decide later)" oninput="SS.planSet(\'ptext\',this.value)" aria-label="Final project">'+
          '<div class="pl-w"><button onclick="SS.planPWeeks(-1)" aria-label="Fewer weeks">−</button><b>'+P.pweeks+' wk'+(P.pweeks===1?'':'s')+'</b><button onclick="SS.planPWeeks(1)" aria-label="More weeks">+</button></div></div></div>':'')+
      '</div></div>'+
      '<div class="stp"><span class="n">5</span><div class="col"><div class="l" style="margin-bottom:0">Preview</div><div id="pl-prev">'+previewHtml()+'</div></div></div>'+
      '<div class="stp"><span class="n">6</span><div><button class="tg2" onclick="SS.planSet(\'calendarSync\','+!P.calendarSync+')" aria-pressed="'+P.calendarSync+'"><span class="sw'+(P.calendarSync?' on':'')+'"></span><div>Show on Today &amp; Calendar<small>unit dates and the project due date</small></div></button></div></div>'+
    '</div>'+
    '<div class="dr-f">'+(P.cid?'<button class="btn del" onclick="SS.planDelete()">Delete topic</button>':'')+'<button class="btn" style="margin-left:auto" onclick="SS.closePlan()">Cancel</button><button class="btn go" id="pl-go" onclick="SS.applyPlan()">Save plan</button></div>';
  var nb=dr.querySelector('.dr-b');if(nb)nb.scrollTop=st;

var LIVE={title:1,theme:1,why:1,goals:1,ptext:1};
function planSet(k,v){
  if(!P)return;
  if(LIVE[k]){P[k]=v;return;}
  if(k==='season'){var s=SEA.get(v);if(s){P.seasonId=s.id;var t=U.today();P.start=t>s.start&&t<=s.end?t:s.start;P.end=s.end;evenWeeks();}}
  else if(k==='start'||k==='end'){if(U.valid(v))P[k]=v;if(P.end<P.start)P.end=P.start;}
  else if(k==='project'||k==='calendarSync')P[k]=!!v;
  drawPlan();
}
function planU(i,k,v){if(!P||!P.units[i])return;P.units[i][k]=v;if(k==='title')drawPreview();}
function planWeeks(i,d){if(!P)return;P.units[i].weeks=Math.max(1,P.units[i].weeks+d);drawPlan();}
function planPWeeks(d){if(!P)return;P.pweeks=Math.max(1,P.pweeks+d);drawPlan();}
function planUnit(i){
  if(!P)return;
  if(i<0)P.units.push({id:null,title:'',question:'',weeks:2,todos:0});
  else{var u=P.units[i];if(u.todos&&!confirm('This unit has '+u.todos+' to-do'+(u.todos===1?'':'s')+'. Remove the unit and its to-dos when you save?'))return;P.units.splice(i,1);}
  drawPlan();if(i<0){var el=document.getElementById('pl-u'+(P.units.length-1));if(el)el.focus();}
}
function planEven(){if(!P)return;evenWeeks();drawPlan();}
function planDelete(){
  if(!P||!P.cid)return;var c=get(P.cid);if(!c)return;
  if(!confirm('Delete “'+c.title+'” with its units, to-dos and notes?'))return;
  removeTopic(c);save();closePlan();APP.render();U.toast('Topic deleted');
}
function applyPlan(){
  if(!P)return;var title=trim(P.title);
  if(!title){alert('Give the topic a name.');var el=document.getElementById('pl-title');if(el)el.focus();return;}
  if(!P.units.length){alert('Add at least one unit.');return;}
  var isNew=!P.cid, c=isNew?norm({status:'active'}):get(P.cid);if(!c)return;
  var L=layout(), old=c.units.slice();
  c.units=P.units.map(function(pu,i){
    var u=(pu.id&&old.find(function(x){return x.id===pu.id;}))||{id:U.uid('u'),todos:[]};
    u.title=trim(pu.title);u.question=trim(pu.question);u.start=L.units[i].start;u.end=L.units[i].end;return u;
  });
  old.forEach(function(u){if(c.units.indexOf(u)<0)u.todos.forEach(function(t){unlinkTodo(c,t);});});
  c.title=title;c.theme=trim(P.theme);c.why=trim(P.why);c.goals=String(P.goals||'').split('\n').map(function(g){return trim(g.replace(/^\s*[-•*→]\s*/,''));}).filter(Boolean);
  c.project=L.project?{text:trim(P.ptext),due:L.project.end,done:!!c.project.done}:{text:'',due:'',done:false};
  c.start=P.start;c.end=L.end>P.end?L.end:P.end;c.seasonId=P.seasonId;c.calendarSync=!!P.calendarSync;
  if(c.status!=='done')c.status='active';
  if(isNew)list.push(c);
  activeId=c.id;sel=null;editId=null;save();closePlan();
  if(SEA.selected().id!==c.seasonId)SEA.select(c.seasonId);else APP.render();
  U.toast(isNew?'Planned '+c.units.length+' unit'+(c.units.length===1?'':'s')+(L.project?' and a final project':''):'Plan saved');
}

/* ── for the overview ── */
function topics(s){return (s?inSeasonList(s):list).filter(function(c){return c.status==='active'||c.status==='done';});}
/* open to-dos of the unit happening now, per active topic */
function weekTodos(s){var out=[];activeIn(s).forEach(function(c){var k=curUnit(c);if(!k)return;k.u.todos.forEach(function(t){if(!t.done)out.push({c:c,u:k.u,ui:k.ui,t:t});});});return out;}
function projectsDue(from,to,s){var out=[];topics(s).forEach(function(c){var d=c.project.due;if(hasProject(c)&&U.valid(d)&&d>=from&&d<=to)out.push({c:c,date:d});});return out;}
/* "due" this week: open to-dos of units that end this week + projects due */
function dueCount(from,to,s){var n=0;activeIn(s).forEach(function(c){c.units.forEach(function(u){if(U.valid(u.end)&&u.end>=from&&u.end<=to)n+=u.todos.filter(function(t){return !t.done;}).length;});if(hasProject(c)&&!c.project.done&&c.project.due>=from&&c.project.due<=to)n++;});return n;}
/* chart marks: unit starts + project due dates */
function marksBetween(from,to,s){var n=0;topics(s).forEach(function(c){c.units.forEach(function(u){if(U.valid(u.start)&&u.start>=from&&u.start<=to)n++;});if(hasProject(c)&&U.valid(c.project.due)&&c.project.due>=from&&c.project.due<=to)n++;});return n;}
function milestones(from,to,s){var out=[], t=U.today();inSeasonList(s).forEach(function(c){
  c.units.forEach(function(u,i){if(U.valid(u.start)&&u.start>=from&&u.start<=to)out.push({date:u.start,title:short(c)+' · Unit '+(i+1)+' begins',sub:u.title||u.question||'',track:'self'});});
  if(hasProject(c)&&!c.project.done&&U.valid(c.project.due)&&c.project.due>=from&&c.project.due<=to)out.push({date:c.project.due,title:short(c)+' · final project due',sub:c.project.text||'Show what I learned',track:'self',chip:c.project.due>=t?U.due(U.diff(t,c.project.due)+'d','gentle'):''});});return out;}

return {load:load,afterLib:afterLib,render:render,seasonChanged:seasonChanged,inSeason:inSeason,inSeasonList:inSeasonList,activeIn:activeIn,stats:stats,short:short,seasonId:seasonId,
  unitDone:unitDone,curUnit:curUnit,weekTodos:weekTodos,projectsDue:projectsDue,dueCount:dueCount,marksBetween:marksBetween,milestones:milestones,all:function(){return list;},get:get,KINDS:KINDS,
  setActive:function(id){activeId=id;sel=null;editId=null;editVals=null;APP.render();},
  toggleTodo:toggleTodo,draftKind:draftKind,draftInput:draftInput,addTodo:addTodo,editTodo:editTodo,cancelEdit:cancelEdit,saveEdit:saveEdit,delTodo:delTodo,moveTodo:moveTodo,
  toggleProject:toggleProject,pick:pick,backNow:backNow,addUnit:addUnit,editUnit:editUnit,editWhy:editWhy,writeNote:writeNote,setSync:setSync,
  toggleAllNotes:function(){showAllNotes=!showAllNotes;APP.render();},openCourse:openCourse,startCourse:startCourse,importLegacy:importLegacy,hideImport:function(){importHidden=true;APP.render();},
  newPlan:function(){openPlan(null);},editPlan:function(id){openPlan(id||activeId);},openPlan:openPlan,closePlan:closePlan,planSet:planSet,planU:planU,planWeeks:planWeeks,planPWeeks:planPWeeks,
  planUnit:planUnit,planEven:planEven,planDelete:planDelete,applyPlan:applyPlan,planOpen:function(){return !!P;}};
})();

<script>
/* ════════════ RESOURCES (learnLibrary1 — was the "Library" tab) ════════════
   Items {id,title,url,type,subject,status:'queued'|'doing'|'done'} + optional links[{track,id}], image, author,
   progress{at,of}, addedOn, doneOn, autoFrom:'todo'|'link' (made automatically from a self-study to-do or a class/course link),
   autoTitle (title still the one we filled in). Types: video, playlist, podcast, article, book, course, website, tool. */
var LIB=(function(){
  var KEY='learnLibrary1';
  var DB, editId=null, fType='all', fStatus='all', fFor='all', q='', sug=null;
  var TYPEMETA={video:'Video',playlist:'Playlist',podcast:'Podcast',article:'Article',book:'Book',course:'Course',website:'Website',tool:'Tool'};
  var SUBJECTS=['Philosophy','Personal Development','Psychology','Health & Wellness','Technology & AI','Business & Career','Finance & Money','Politics & Society','History','Science','Languages','Arts & Culture','Other'];
  var TABS=[['all','All',null],['article','Articles',['article']],['video','Videos',['video','playlist']],['podcast','Podcasts',['podcast']],['book','Books',['book']],['course','Courses',['course']],['web','Websites & tools',['website','tool']]];
  var GEN=['linear-gradient(135deg,#d9ccf3,#bfaee8)','linear-gradient(135deg,#cfe3c9,#a9cfa3)','linear-gradient(135deg,#d6e3f2,#aec6e4)','linear-gradient(135deg,#f3e2c4,#e3c58f)','linear-gradient(135deg,#f2d3d9,#e0a9b4)','linear-gradient(135deg,#d3ebe7,#a2d0c8)'];
  var SOFT=['#f0eafc','#e4efe3','#e5edf7','#f7eedb','#f9e4e8','#e3f1ee'];
  var AV=['#cb9a4f','#5f88b8','#5f9568','#7e9cc4','#a98fe0','#cf8a93'];
  var esc=U.esc, A=U.a;
  function uid(){return Math.random().toString(36).slice(2,9)}
  function g(id){return document.getElementById(id)}
  function find(id){return DB.items.filter(function(x){return x.id===id})[0]}
  function load(){
    try{var r=localStorage.getItem(KEY); DB=r?JSON.parse(r):null;}catch(e){DB=null;}
    if(!DB||!Array.isArray(DB.items)){DB=seed();return;}
    DB.items.forEach(function(it){
      if(!it.id)it.id=uid();
      if(['queued','doing','done'].indexOf(it.status)<0)it.status='queued';
      if(!TYPEMETA[it.type])it.type=guessType(it.url||'');
      if(!Array.isArray(it.links))delete it.links;
    });
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
  function seed(){
    return {items:[
      {id:uid(),title:'Crash Course Philosophy (full playlist)',url:'https://www.youtube.com/playlist?list=PL8dPuuaLjXtNgK6MZucdYldNkMybYIHKR',type:'playlist',subject:'Philosophy',status:'queued'},
      {id:uid(),title:'But what is a neural network? — 3Blue1Brown',url:'https://www.youtube.com/watch?v=aircAruvnKk',type:'video',subject:'Technology & AI',status:'queued'},
      {id:uid(),title:'Huberman Lab — Sleep toolkit',url:'https://open.spotify.com/show/79CkJF3UJTHFV8Dse3Oy0P',type:'podcast',subject:'Health & Wellness',status:'queued'},
      {id:uid(),title:'How to take smart notes (talk)',url:'https://www.youtube.com/watch?v=Xc2vmsTODGY',type:'video',subject:'Personal Development',status:'done'}
    ]};
  }
  function host(u){return U.host(u);}
  function platLabel(u){var hh=host(u);if(/youtube\.com|youtu\.be/.test(hh))return 'YouTube';if(/spotify\.com/.test(hh))return 'Spotify';if(/podcasts\.apple\.com/.test(hh))return 'Apple Podcasts';if(/vimeo\.com/.test(hh))return 'Vimeo';if(/ted\.com/.test(hh))return 'TED';return hh||'';}
  function guessType(u){
    u=String(u||'');var hh=host(u), path='';try{path=new URL(u).pathname;}catch(e){}
    if(/youtube\.com|youtu\.be/.test(hh)&&/[?&]list=|\/playlist/.test(u)&&!/[?&]v=/.test(u))return 'playlist';
    if(/youtube\.com\/(watch|shorts|embed)|youtu\.be\/|vimeo\.com|ted\.com\/talks|dailymotion|nebula\.tv/.test(u))return 'video';
    if(/spotify\.com\/(show|episode)|podcasts\.apple|overcast\.fm|pocketcasts|podbean|libsyn|anchor\.fm|\/podcast/.test(u))return 'podcast';
    if(/goodreads\.com|openlibrary\.org|books\.google|bookshop\.org|gutenberg\.org|\/dp\/|\/book\//.test(u))return 'book';
    if(/coursera\.org|edx\.org|udemy\.com|khanacademy\.org|skillshare\.com|futurelearn|masterclass\.com|codecademy|domestika|linkedin\.com\/learning/.test(u))return 'course';
    if(/github\.com|notion\.so|figma\.com|observablehq|chrome\.google\.com\/webstore|apps\.apple\.com|play\.google\.com/.test(u))return 'tool';
    if(/medium\.com|substack\.com|\/blog\/|\/article|\/news\/|\/\d{4}\/\d{2}\//.test(u)||path.split('/').filter(Boolean).pop()&&/[-_]/.test(path.split('/').filter(Boolean).pop()))return 'article';
    return 'website';
  }
  function guessTitle(u){
    try{var x=new URL(u);var seg=x.pathname.split('/').filter(Boolean).pop()||'';seg=decodeURIComponent(seg).replace(/\.(html?|php|aspx?)$/,'');
      if(/youtube|youtu\.be|spotify|apple\.com/.test(x.hostname)||!seg||/^[\w-]{8,}$/.test(seg)&&!/[-_]/.test(seg))return '';
      seg=seg.replace(/[-_]+/g,' ').trim();if(!/[a-z]/i.test(seg))return '';return seg.charAt(0).toUpperCase()+seg.slice(1);}catch(e){return '';}
  }
  function ytId(u){var m=/(?:[?&]v=|youtu\.be\/|\/embed\/|\/shorts\/)([\w-]{11})/.exec(u||'');return m?m[1]:'';}
  function thumb(it){if(it.image)return U.safeUrl(it.image);var id=ytId(it.url);return id?'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg':'';}
  function typeLabel(t){return TYPEMETA[t]||'Link';}
  function isUrl(s){return /^(https?:\/\/)?([\w-]+\.)+[a-z]{2,}(\/\S*)?$/i.test(String(s||'').trim())&&!/\s/.test(String(s).trim());}

  /* "For" targets: formal classes, online courses, self-study topics */
  function targets(){
    var out=[];
    CL.all().forEach(function(c){out.push({track:'formal',id:c.id,label:CL.shortCode(c)||c.name,full:CL.label(c),color:'var(--fm)'});});
    CO.all().forEach(function(p){out.push({track:'online',id:p.id,label:p.name,full:p.name,color:'var(--on)'});});
    SS.all().forEach(function(c){var idea=c.status==='catalog'||c.status==='next';out.push({track:'self',id:c.id,label:c.title+(idea?' · idea':''),full:c.title,color:idea?'var(--idea)':'var(--ss)',idea:idea});});
    return out;
  }
  function targetOf(l){if(!l)return null;var ts=targets();for(var i=0;i<ts.length;i++){if(ts[i].track===l.track&&ts[i].id===l.id)return ts[i];}return null;}
  function link(it){return it.links&&it.links[0]?targetOf(it.links[0]):null;}
  function tag(it){var ts=(it.links||[]).map(targetOf).filter(Boolean), t=ts[0];if(!t)return '';

/* ════════════ LINK LOOKUP (linkMeta1 cache) ════════════
   LK.lookup(url) → Promise<{title,image,author,site,type,ok}> — the real title and picture for a pasted link.
   YouTube / Spotify oEmbed, Apple Podcasts via iTunes (JSONP — it has no CORS), Wikipedia summaries,
   Open Library covers for books, and microlink.io for everything else (free, ~25 a day). Each link is fetched
   once: good results are cached in localStorage; failures fall back to a title guessed from the link and are
   only remembered for this visit. Nothing waits on it — callers add right away and fill in later. */
var LK=(function(){
  var KEY='linkMeta1', MAX=400, cache=null, mem={}, pending={}, jn=0;
  function store(){if(!cache){cache=U.lsGet(KEY);if(!cache||typeof cache!=='object'||Array.isArray(cache))cache={};}return cache;}
  function put(url,r){var c=store();c[url]={title:r.title||'',image:r.image||'',author:r.author||'',site:r.site||'',type:r.type||'',ok:true,at:Date.now()};
    var ks=Object.keys(c);if(ks.length>MAX)ks.sort(function(x,y){return (c[x].at||0)-(c[y].at||0);}).slice(0,ks.length-MAX).forEach(function(k){delete c[k];});
    U.lsSet(KEY,c);}
  function peek(url){url=U.safeUrl(url);if(!url)return null;var c=store()[url];return c&&typeof c==='object'?c:(mem[url]||null);}
  function timeout(p,ms){return new Promise(function(res,rej){var t=setTimeout(function(){rej(new Error('timeout'));},ms);p.then(function(v){clearTimeout(t);res(v);},function(e){clearTimeout(t);rej(e);});});}
  function getJson(u){return timeout(fetch(u,{credentials:'omit'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}),9000);}
  function jsonp(u){
    return new Promise(function(res,rej){
      var cb='__lk'+(++jn)+Date.now().toString(36), sc=document.createElement('script'), over=false;
      function end(){over=true;try{delete window[cb];}catch(e){window[cb]=undefined;}if(sc.parentNode)sc.parentNode.removeChild(sc);}
      window[cb]=function(d){if(over)return;end();res(d);};
      sc.onerror=function(){if(over)return;end();rej(new Error('jsonp'));};
      setTimeout(function(){if(!over){end();rej(new Error('timeout'));}},9000);
      sc.src=u+(u.indexOf('?')<0?'?':'&')+'callback='+cb;document.head.appendChild(sc);
    });
  }
  function isbnOf(u){var m=/isbn[\/=:_-]?((?:97[89])?\d{9}[\dXx])\b/i.exec(u)||/\/(?:dp|gp\/product)\/(\d{9}[\dXx])\b/i.exec(u)||/\/(97[89]\d{10})\b/.exec(u);return m?m[1].toUpperCase():'';}
  function olSearch(qs){return getJson('https://openlibrary.org/search.json?'+qs+'&limit=1&fields=title,author_name,cover_i').then(function(d){var x=d&&d.docs&&d.docs[0];if(!x)throw new Error('none');
    return {title:x.title||'',author:(x.author_name||[])[0]||'',image:x.cover_i?'https://covers.openlibrary.org/b/id/'+x.cover_i+'-M.jpg':''};});}
  function microlink(url,base){
    return getJson('https://api.microlink.io/?url='+encodeURIComponent(url)).then(function(j){
      if(!j||j.status!=='success'||!j.data)throw new Error('microlink');var d=j.data;
      return Object.assign({},base,{title:d.title||'',image:(d.image&&d.image.url)||(d.logo&&d.logo.url)||'',author:d.author||'',site:d.publisher||base.site,ok:!!(d.title||d.image)});
    });
  }
  function run(url){
    var h=U.host(url), yid=LIB.ytId(url), base={title:'',image:'',author:'',site:LIB.platLabel(url)||h,type:LIB.guessType(url),ok:true};
    function ok(o){return Object.assign({},base,o,{ok:true});}
    function generic(){return microlink(url,base);}
    if(/(^|\.)youtube\.com$|(^|\.)youtu\.be$/.test(h)){
      var hq=yid?'https://i.ytimg.com/vi/'+yid+'/hqdefault.jpg':'';
      return getJson('https://www.youtube.com/oembed?url='+encodeURIComponent(url)+'&format=json')
        .then(function(d){return ok({title:d.title||'',author:d.author_name||'',image:hq||d.thumbnail_url||'',site:'YouTube'});})
        .catch(function(){return generic().then(function(r){if(!r.image&&hq)r.image=hq;return r;});});
    }
    var ap=/podcasts\.apple\.com/.test(h)&&/\/id(\d+)/.exec(url);
    if(ap)return jsonp('https://itunes.apple.com/lookup?id='+ap[1]).then(function(d){var x=d&&d.results&&d.results[0];if(!x)throw new Error('none');
      return ok({title:x.collectionName||x.trackName||'',image:x.artworkUrl600||x.artworkUrl100||'',author:x.artistName||'',site:'Apple Podcasts',type:'podcast'});}).catch(generic);
    if(/(^|\.)spotify\.com$/.test(h))return getJson('https://open.spotify.com/oembed?url='+encodeURIComponent(url)).then(function(d){return ok({title:d.title||'',image:d.thumbnail_url||'',site:'Spotify'});}).catch(generic);
    var wk=/^([a-z-]+)\.(?:m\.)?wikipedia\.org$/.exec(h), wp=/\/wiki\/([^?#]+)/.exec(url);
    if(wk&&wp)return getJson('https://'+wk[1]+'.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(decodeURIComponent(wp[1]))).then(function(d){
      return ok({title:d.title||'',image:(d.thumbnail&&d.thumbnail.source)||'',author:'',site:'Wikipedia',type:'article'});}).catch(generic);
    var isbn=isbnOf(url);
    if(isbn){
      var cover='https://covers.openlibrary.org/b/isbn/'+isbn+'-M.jpg?default=false';
      return olSearch('isbn='+isbn).then(function(r){return ok({title:r.title,author:r.author,image:cover,site:'Open Library',type:'book'});})
        .catch(function(){return generic().then(function(r){r.image=cover;r.type='book';return r;},function(){return Object.assign({},base,{title:LIB.guessTitle(url),image:cover,type:'book',ok:false});});});
    }
    return generic().then(function(r){
      if(r.type==='book'&&r.title&&(!r.image||/logo|favicon/i.test(r.image)))return olSearch('q='+encodeURIComponent(r.title)).then(function(b){if(b.image)r.image=b.image;if(!r.author&&b.author)r.author=b.author;return r;},function(){return r;});
      return r;
    });
  }
  function lookup(url){
    url=U.safeUrl(url);if(!url)return Promise.resolve(null);
    var c=peek(url);if(c)return Promise.resolve(c);
    if(pending[url])return pending[url];
    var p=new Promise(function(res){try{run(url).then(res,function(){res(null);});}catch(e){res(null);}}).then(function(r){
      delete pending[url];
      if(!r||!r.ok||!(r.title||r.image)){r=Object.assign({title:LIB.guessTitle(url),image:'',author:'',site:LIB.platLabel(url)||U.host(url),type:LIB.guessType(url)},r||{},{ok:false});if(!r.title)r.title=LIB.guessTitle(url);mem[url]=r;}
      else put(url,r);
      return r;
    });
    pending[url]=p;return p;
  }
  return {lookup:lookup,peek:peek,isPending:function(url){return !!pending[U.safeUrl(url)];}};
})();

    formalItems(s).forEach(function(x){
      if(!x.due)return;var c=x.c;
      if(x.t.done){if(x.due<t||x.due>r[1])return;done++;}else if(x.due>r[1]||x.due<U.add(t,-30))return;
      total++;
      var late=!x.t.done&&x.due<t;
      push(late?t:x.due,tk('formal','CL.toggleTask('+A(x.m.id)+','+A(x.t.id)+','+A(c.id)+')',x.t.label,(CL.shortCode(c)||c.name)+' · '+(late?'was due '+U.wd(x.due):x.m.title),x.t.done?'':U.dueChip(x.due),x.t.done));
    });
    SS.projectsDue(t,r[1],s).forEach(function(x){
      var pd=x.c.project.done;total++;if(pd)done++;
      push(x.date,tk('self','SS.toggleProject('+A(x.c.id)+')','Final project'+(x.c.project.text?' · '+x.c.project.text:''),x.c.title+' · due '+U.wd(x.date),pd?'':U.due(x.date===t?'today':'due','gentle'),pd));
    });
    var unit=SS.weekTodos(s).map(function(x){total++;
      return tk('self','SS.toggleTodo('+A(x.c.id)+','+A(x.u.id)+','+A(x.t.id)+')',SS.KINDS[x.t.kind]+' · '+x.t.text,x.c.title+' · Unit '+(x.ui+1)+(x.u.end?' · until '+U.md(x.u.end):''),'',false);});
    var any=[];CO.inSeasonList(s).forEach(function(p){if(p.status!=='active')return;var k=CO.cursor(p);if(!k)return;total++;
      any.push(tk('online','CO.markNext('+A(p.id)+')',CO.nextLabel(p),p.name,U.due('this week','plain'),false));});
    var keys=Object.keys(days).sort();
    var h=keys.map(function(d){return '<div class="day"><div class="d">'+(d===t?'Today':esc(U.wd(d)))+'<b>'+U.dnum(d)+'</b></div><div>'+days[d].join('')+'</div></div>';}).join('');
    if(unit.length)h+='<div class="day"><div class="d">This<b style="font-size:13px;font-family:var(--b2-sans);font-weight:700;padding-top:2px">unit</b></div><div>'+unit.slice(0,5).join('')+(unit.length>5?'<button class="more" style="margin-top:4px" onclick="APP.tab(\'self\')">+'+(unit.length-5)+' more in Self-study →</button>':'')+'</div></div>';
    if(any.length)h+='<div class="day"><div class="d">Any<b style="font-size:13px;font-family:var(--b2-sans);font-weight:700;padding-top:2px">time</b></div><div>'+any.slice(0,4).join('')+'</div></div>';
    return '<section class="card s7"><div class="card-h"><div><div class="card-t">This week</div><div class="card-m" style="margin-top:3px">'+esc(U.range(r[0],r[1]))+' · all tracks</div></div>'+(total?'<span class="chip">'+done+' of '+total+' done</span>':'')+'</div>'+
      (h||'<div class="soft-empty">A clear week. Enjoy it — or pull something forward.</div>')+'</section>';
  }
  function seasonList(s){
    /* past/future season: what was on, with progress */
    var rows=[];
    CL.inSeasonList(s).forEach(function(c){var p=CL.prog(c);rows.push({k:'formal',t:CL.label(c),sub:[c.inst,p.done+' of '+p.total+' tasks'].filter(Boolean).join(' · '),pct:p.pct,go:'CL.setActive('+A(c.id)+');APP.tab(\'formal\')'});});
    CO.inSeasonList(s).forEach(function(p){var x=CO.stats(p);rows.push({k:'online',t:p.name,sub:[p.platform,x.dn+' of '+x.tt+' '+x.unit].filter(Boolean).join(' · '),pct:x.pct,go:'CO.setActive('+A(p.id)+');APP.tab(\'online\')'});});
    SS.inSeasonList(s).forEach(function(c){var x=SS.stats(c);rows.push({k:'self',t:c.title,sub:c.units.length+' unit'+(c.units.length===1?'':'s')+' · '+x.done+' of '+x.total+' to-dos',pct:x.pct,go:'SS.setActive('+A(c.id)+');APP.tab(\'self\')'});});
    return '<section class="card s7"><div class="card-h"><div><div class="card-t">'+(SEA.status(s)==='past'?'What was on':'What’s planned')+'</div><div class="card-m" style="margin-top:3px">'+esc(s.name)+' · all tracks</div></div><span class="chip">'+rows.length+'</span></div>'+
      (rows.length?rows.map(function(r){return '<div class="tk" style="cursor:pointer" onclick="'+r.go+'"><span class="sw" style="background:'+TR[r.k].c+'"></span><span class="t">'+esc(r.t)+'<small>'+esc(r.sub)+'</small></span>'+U.due(r.pct+'%',r.pct>=100?'':'plain')+'</div>';}).join(''):
        '<div class="soft-empty">Nothing in '+esc(s.name)+' yet. Classes, courses and self-study land here by their dates.</div>')+'</section>';
  }
  function comingUp(s){
    var t=U.today(), cur=SEA.status(s)==='now', from=cur?U.add(t,1):s.start, to=cur?U.add(t,42):s.end, out=[];
    CL.inSeasonList(s).forEach(function(c){
      CL.sortedModules(c).forEach(function(m){if(m.due&&m.due>=from&&m.due<=to&&!CL.modProg(m).full)out.push({date:m.due,title:(CL.shortCode(c)?CL.shortCode(c)+' ':'')+m.title,sub:m.short||m.objective||'',track:'formal',chip:U.dueChip(m.due)});});
      if(c.end&&c.end>=from&&c.end<=to)out.push({date:c.end,title:(CL.shortCode(c)||c.name)+' · last day',sub:'term ends',track:'formal',chip:cur?U.due(U.diff(t,c.end)+'d','plain'):''});
    });
    CO.inSeasonList(s).forEach(function(p){if(p.targetDate&&p.targetDate>=from&&p.targetDate<=to)out.push({date:p.targetDate,title:'Finish '+p.name,sub:'your goal date',track:'online',chip:cur?U.due(U.diff(t,p.targetDate)+'d','plain'):''});});
    SS.milestones(from,to,s).forEach(function(m){out.push(m);});
    out.sort(function(x,y){return x.date.localeCompare(y.date);});out=out.slice(0,cur?5:7);
    return '<section class="card s5"><div class="card-h"><div class="card-t">Coming up</div><span class="card-m">'+(cur?'next 6 weeks':esc(s.name))+'</span></div>'+
      (out.length?out.map(function(m){return '<div class="ms"><div class="dt"'+(m.track==='self'?' style="background:var(--ss-s)"':m.track==='online'?' style="background:var(--on-s)"':'')+'><small>'+esc(U.mon(m.date))+'</small><b>'+U.dnum(m.date)+'</b></div><div class="t">'+esc(m.title)+(m.sub?'<small>'+esc(m.sub)+'</small>':'')+'</div>'+(m.chip||'')+'</div>';}).join(''):
        '<div class="soft-empty">No milestones '+(cur?'in the next 6 weeks':'this season')+'.</div>')+'</section>';
  }
  function pastSeasons(){
    var cur=SEA.current(), seas=SEA.all().filter(function(s){return s.end<cur.start;}).sort(function(x,y){return y.start.localeCompare(x.start);});
    var rows=seas.map(function(s){
      var cls=CL.inSeasonList(s), pr=CO.inSeasonList(s), ss=SS.inSeasonList(s);
      var n=cls.length+pr.length+ss.length;if(!n)return '';
      var title=n===1?(cls[0]?CL.label(cls[0]):pr[0]?pr[0].name:ss[0].title):[cls.length?cls.length+' formal class'+(cls.length===1?'':'es'):'',pr.length?pr.length+' online course'+(pr.length===1?'':'s'):'',ss.length?ss.length+' self-study':''].filter(Boolean).join(' · ');
      var names=[cls.map(function(c){return CL.shortCode(c)||c.name;}).join(', '),pr.map(function(p){return p.name;}).join(', '),ss.map(function(c){return c.title;}).join(', ')].filter(Boolean).join(' · ');
      var allDone=cls.every(function(c){return CL.prog(c).pct>=100;})&&pr.every(CO.complete)&&ss.every(function(c){var x=SS.stats(c);return x.total&&x.done===x.total;});
      var dots='';
      cls.forEach(function(c){c.modules.forEach(function(m){dots+='<i style="background:'+(CL.modProg(m).full?'var(--fm)':'var(--warm-2)')+';opacity:'+(CL.modProg(m).full?.55:1)+'"></i>';});});
      pr.forEach(function(p){p.courses.forEach(function(c){var d=c.modules.length?c.modules.every(function(m){return m.done;}):c.done;dots+='<i style="background:'+(d?'var(--on)':'var(--warm-2)')+';opacity:'+(d?.55:1)+'"></i>';});});
      ss.forEach(function(c){c.units.forEach(function(u){var d=SS.unitDone(u);dots+='<i style="background:'+(d?'var(--ss)':'var(--warm-2)')+';opacity:'+(d?.55:1)+'"></i>';});});
      return '<button class="card pterm" onclick="SEA.select('+A(s.id)+');window.scrollTo(0,0)"><span class="chip">'+esc(s.name)+'</span><div class="nm">'+esc(title)+'<small>'+esc((n===1?'':names)+(n===1?'':' · ')+(allDone?'all finished':'see how it went'))+'</small></div><div class="dots">'+dots+'</div></button>';
    }).filter(Boolean);
    if(!rows.length)return '';
    return '<div class="sec-l" style="margin-top:30px"><span class="eyebrow">Past seasons</span>'+(rows.length>2?'<button class="more" onclick="OV.togglePast()">'+(showAllPast?'Show fewer':'See all '+rows.length+' →')+'</button>':'')+'</div>'+(showAllPast?rows:rows.slice(0,2)).join('');
  }
  function render(){
    var s=SEA.selected();
    document.getElementById('tab-overview').innerHTML=
      '<div class="seasons">'+SEA.switcherHtml()+'<button class="btn sm" style="margin-left:auto" onclick="SEA.openEdit()">Edit season dates</button></div>'+
      hero(s)+trackCards(s)+
      '<div class="grid" style="margin-top:18px">'+(SEA.status(s)==='now'?thisWeek(s):seasonList(s))+comingUp(s)+'</div>'+
      pastSeasons();
  }
  return {render:render,togglePast:function(){showAllPast=!showAllPast;APP.render();}};
})();

/* ════════════ APP: tabs, modals, init ════════════ */
var APP=(function(){
  var TABS=['overview','formal','online','self','resources'], cur='overview';
  var LEGACY={classes:'formal',courses:'online',library:'resources'};
  function tab(t){
    t=LEGACY[t]||t;if(TABS.indexOf(t)<0)t='overview';
    if(SW.isOpen())SW.close();
    cur=t;
    TABS.forEach(function(x){var b=document.getElementById('lt-'+x),p=document.getElementById('tab-'+x);if(b){b.classList.toggle('active',x===t);b.setAttribute('aria-selected',x===t);}if(p)p.classList.toggle('show',x===t);});
    try{localStorage.setItem('learningTab',t);}catch(e){}
    render();window.scrollTo(0,0);
  }
  function render(){
    var rc=document.getElementById('res-count');if(rc)rc.textContent=LIB.count()||'';
    try{
      if(cur==='overview')OV.render();else if(cur==='formal')CL.render();else if(cur==='online')CO.render();else if(cur==='self')SS.render();else LIB.render();
    }catch(e){console.error(e);document.getElementById('tab-'+cur).innerHTML='<div class="empty"><h3>Something went wrong showing this tab</h3><p>'+U.esc(e.message)+'</p></div>';}
  }
  function openModal(id){document.getElementById(id).classList.add('show');}
  function closeModal(id){document.getElementById(id).classList.remove('show');}
  document.querySelectorAll('.modal-bg').forEach(function(bg){bg.addEventListener('mousedown',function(e){if(e.target===bg){if(bg.id==='formModal')FORM.close();else bg.classList.remove('show');}});});
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    var open=[].slice.call(document.querySelectorAll('.modal-bg.show'));
    if(open.length){var top=open[open.length-1];if(top.id==='formModal')FORM.close();else top.classList.remove('show');return;}
    if(SS.planOpen()){SS.closePlan();return;}
    if(SW.isOpen())SW.close();
  });
  window.addEventListener('storage',function(e){if(['classTracker1','profDevData2','learnLibrary1','curriculum1','learnSeasons1'].indexOf(e.key)>=0){init(true);}});
  function init(again){
    SEA.load();CL.load();CO.load();SS.load();LIB.load();SS.afterLib();
    if(!again){
      var t=null;try{t=localStorage.getItem('learningTab');}catch(e){}
      CL.seasonChanged();CO.seasonChanged();SS.seasonChanged();
      tab(t||'overview');
    }else render();
  }
  var api={tab:tab,render:render,openModal:openModal,closeModal:closeModal,init:init,cur:function(){return cur;},printing:false};
  window.addEventListener('beforeprint',function(){api.printing=true;render();});
  window.addEventListener('afterprint',function(){api.printing=false;render();});
  return api;
})();
(function(){
  var DS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var MF=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var n=new Date(), el=document.getElementById('today-date');
  if(el)el.textContent=DS[n.getDay()]+', '+MF[n.getMonth()]+' '+n.getDate()+', '+n.getFullYear();
})();
APP.init();
</script>
