<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classes · Brain 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
<style>
  /* Page aliases onto the shared Brain 2.0 tokens (brain.css defines the palette). */
  :root{
    --lilac:var(--accent); --lilac-d:var(--accent-deep); --line-soft:var(--hair);
    --rose:var(--over); --amber:var(--warn); --sage:var(--ok);
    --shadow:0 1px 2px rgba(60,50,30,.04),0 8px 24px rgba(60,50,30,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--b2-sans);background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font-family:inherit}
  a{color:inherit}

  /* ── title row (brain.css styles .topbar) ── */
  .topbar-left{display:flex;align-items:center;gap:14px}
  .topbar-title{font-family:var(--b2-serif);font-size:34px;font-weight:600}
  .back-btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border:1px solid var(--line);border-radius:8px;font:650 11.5px var(--b2-sans);color:var(--muted);text-decoration:none;background:var(--raised)}

  /* page tabs: segmented control */
  .tabnav{display:inline-flex;gap:2px;padding:4px;background:var(--warm-deep);border-radius:13px}
  .tabnav button{border:0;background:transparent;padding:8px 16px;border-radius:10px;font:650 13px var(--b2-sans);color:var(--muted);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
  .tabnav button:hover{color:var(--ink)}
  .tabnav button.active{background:var(--raised);color:var(--ink);box-shadow:0 1px 3px rgba(60,50,30,.1)}

  /* ── frame ── */
  .wrap{max-width:1280px;margin:0 auto;padding:20px 40px 80px}
  .ltab-pane{display:none}
  .ltab-pane.show{display:block}
  .print-stamp,.notes-print{display:none}

  /* ── shared atoms ── */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 24px;box-shadow:var(--shadow)}
  .mini-label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:750;margin-bottom:14px}
  .btn,.add-btn,.lib-add-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 15px;border-radius:10px;font:650 12.5px var(--b2-sans);border:1px solid var(--line);background:var(--raised);color:var(--ink-2);cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s,color .15s,box-shadow .15s}
  .btn:hover,.add-btn:hover,.lib-add-btn:hover{border-color:var(--accent-line);color:var(--ink)}
  .btn svg{width:14px;height:14px}
  .btn-primary,.lib-add-btn{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn-primary:hover,.lib-add-btn:hover{background:var(--ink);color:#fff;box-shadow:0 6px 16px rgba(36,31,23,.18)}
  .add-btn{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-deep)}
  .add-btn:hover{color:var(--accent-deep);background:#e8defa}
  .add-btn.ghost{height:28px;padding:0 11px;font-size:11.5px;border-radius:8px}
  .btn-ghost{background:var(--raised)}
  .btn-del{background:transparent;border-color:transparent;color:var(--over);padding:0 8px}
  .btn-del:hover{background:var(--over-bg);border-color:transparent;color:var(--over)}
  .icon-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--raised);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .15s}
  .icon-btn:hover{color:var(--accent-deep);border-color:var(--accent-line)}
  .tx{background:none;border:none;cursor:pointer;color:var(--faint);font-size:12px;padding:3px 6px;border-radius:6px;transition:opacity .14s,color .14s,background .14s}
  .tx:hover{color:var(--over);background:var(--over-bg)}
  .empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:48px 30px;text-align:center;color:var(--muted)}
  .empty h3{font-family:var(--b2-serif);font-weight:600;color:var(--ink);font-size:19px;margin-bottom:6px}
  .empty p{font-size:13px;line-height:1.55;max-width:440px;margin:0 auto}
  /* chips */
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--warm);border-radius:20px;padding:4px 11px;font-size:12px;color:var(--ink-2);font-weight:600}
  .chip b{font-weight:600;font-size:11px}
  .chip a{color:var(--accent-deep);text-decoration:none}
  .countdown,.tdue,.due-badge,.status-pill,.mod-prog{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;letter-spacing:0;text-transform:none;font-family:var(--b2-sans)}
  .cd-over,.due-overdue{background:var(--over-bg);color:var(--over)}
  .cd-soon,.due-soon,.status-queued{background:var(--warn-bg);color:var(--warn)}
  .cd-ok,.due-ok,.status-active{background:var(--ok-bg);color:var(--ok)}
  .status-hold{background:var(--warm);color:var(--muted)}
  .mod-prog{background:var(--warm);color:var(--muted)}
  .mod-prog.full{background:var(--accent-soft);color:var(--accent-deep)}
  /* inputs */
  .fld input,.fld textarea,.fld select,.add-task input,.mod-add input,textarea.notes,.search-input,.filter-select,.inline-course-input{border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:9px 12px;font:500 13px var(--b2-sans);color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
  .fld input:focus,.fld textarea:focus,.fld select:focus,.add-task input:focus,.mod-add input:focus,textarea.notes:focus,.search-input:focus,.filter-select:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
  /* checkbox */
  .chk{width:20px;height:20px;border:1.6px solid var(--line);border-radius:6px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--raised);color:#fff;font-size:11px;font-weight:800;transition:all .13s}
  .chk:hover{border-color:var(--accent)}
  .chk.on{background:var(--accent-deep);border-color:var(--accent-deep)}

  /* ── CLASSES ── */
  .pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;align-items:center}
  .pill{border:1px solid var(--line);background:var(--raised);color:var(--ink-2);padding:6px 13px;border-radius:20px;font:600 12.5px var(--b2-sans);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:8px}
  .pill:hover{border-color:var(--accent-line);color:var(--ink)}
  .pill .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .pill.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pill-add{border:1px dashed var(--accent-line);background:transparent;color:var(--accent-deep);padding:6px 13px;border-radius:20px;font:600 12.5px var(--b2-sans);cursor:pointer;transition:all .15s}
  .pill-add:hover{background:var(--accent-soft)}

  .ov{margin-bottom:18px;position:relative;padding-right:64px}
  .ov .code{color:var(--accent-deep);font-weight:750;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px}
  .ov h2{font-family:var(--b2-serif);font-size:26px;font-weight:600;letter-spacing:-.4px;line-height:1.15}
  .ov-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .ov-actions{position:absolute;top:22px;right:24px;display:flex;gap:6px}

  .row3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.3fr);gap:18px;margin-bottom:28px}
  .ring-wrap{display:flex;align-items:center;gap:18px}
  .ring{position:relative;width:84px;height:84px;flex-shrink:0}
  .ring svg{transform:rotate(-90deg);display:block}
  .ring svg circle{stroke-width:7}
  .ring svg circle:first-child{stroke:var(--warm-deep)}
  .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--b2-serif);font-size:19px;font-weight:600;letter-spacing:-.3px}
  .ring-txt .big{font-family:var(--b2-serif);font-size:22px;font-weight:600;letter-spacing:-.3px}
  .ring-txt .sub{font-size:12px;color:var(--muted);margin-top:2px;font-weight:550}
  .next-title{font-family:var(--b2-serif);font-size:19px;font-weight:600;letter-spacing:-.2px;margin-bottom:4px}
  .next-due{font-size:12px;color:var(--muted);margin-bottom:12px;font-weight:550;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .next-due .countdown{margin-left:0}
  .next-tasks{list-style:none;font-size:13px}
  .next-tasks li{padding:8px 0;display:flex;gap:10px;align-items:center;border-top:1px solid var(--hair);font-weight:600}
  .next-tasks li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint);flex-shrink:0}
  .nt-d{font-size:11.5px;font-weight:700;margin-left:auto;white-space:nowrap}
  .nt-d.cd-over,.nt-d.cd-soon,.nt-d.cd-ok{background:transparent;padding:0}
  .nt-d.cd-over{color:var(--over)} .nt-d.cd-soon{color:var(--warn)} .nt-d.cd-ok{color:var(--ok)} .nt-d.ok{color:var(--muted)}
  .all-done{color:var(--ok);font-weight:650;font-size:13.5px}
  .grade-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--hair);font-size:13px}
  .grade-row:first-of-type{border-top:none;padding-top:0}
  .grade-row .wt{font-weight:750;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .grade-row .lbl{color:var(--ink);padding-right:10px;font-weight:600}
  .grade-row .lbl small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
  .scale{margin-top:10px;font-size:11.5px;color:var(--muted);background:var(--warm);border-radius:10px;padding:7px 11px;text-align:center;font-weight:600}

  .sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 14px}
  .sec-head h3{font-family:var(--b2-serif);font-size:24px;font-weight:600;letter-spacing:-.4px}
  .card .sec-head h3,.card > h3{font-family:var(--b2-serif);font-size:19px !important;font-weight:600 !important;letter-spacing:-.2px}

  /* module cards */
  .mod{margin-bottom:14px;padding:20px 24px;transition:opacity .2s}
  .mod.done{opacity:.6}
  .mod-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .mod-title{font-family:var(--b2-serif);font-size:19px;font-weight:600;letter-spacing:-.2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .mod-actions{display:flex;gap:5px;flex-shrink:0}
  .mod-obj{color:var(--muted);font-size:13px;margin:6px 0 12px;line-height:1.5;font-weight:500}
  .tasks{list-style:none}
  .task{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--hair)}
  .task:first-child{border-top:none}
  .task .tlabel{flex:1;font-size:14px;font-weight:650;cursor:pointer;min-width:0}
  .task.checked .tlabel{text-decoration:line-through;color:var(--muted);font-weight:550}
  .task .tx{opacity:0}
  .task:hover .tx{opacity:1}
  .tdue-wrap{position:relative;display:inline-flex;flex-shrink:0}
  .tdue-wrap input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:none;pointer-events:none}
  .tdue{cursor:pointer}
  .tdue.empty{color:var(--muted);background:var(--warm);opacity:0;transition:opacity .14s}
  .task:hover .tdue.empty{opacity:1}
  .tdue.ok{background:var(--warm);color:var(--muted)}
  .task.checked .tdue{background:var(--warm);color:var(--faint)}
  .add-task{display:flex;gap:8px;margin-top:10px;padding-top:12px;border-top:1px solid var(--hair)}
  .add-task input{flex:1;min-width:0;height:34px;padding:0 12px}
  .add-task input[type=date]{flex:0 0 auto;width:150px;color:var(--muted)}
  .add-task button,.mod-add button,.inline-save-btn{height:34px;padding:0 15px;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--ink-2);font:650 12.5px var(--b2-sans);cursor:pointer}
  .add-task button:hover,.mod-add button:hover{border-color:var(--accent-line);color:var(--accent-deep)}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px}
  .link-list{list-style:none;margin-top:6px}
  .link-list li{display:flex;align-items:center;gap:8px;padding:10px 0;font-size:14px;font-weight:650;border-top:1px solid var(--hair)}
  .link-list li:first-child{border-top:none}
  .link-list a{color:var(--ink);text-decoration:none;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .link-list a::after{content:" ↗";color:var(--faint);font-size:12px}
  .link-list a:hover{color:var(--accent-deep)}
  .link-list .tx{opacity:0}
  .link-list li:hover .tx{opacity:1}
  textarea.notes{width:100%;min-height:128px;resize:vertical;line-height:1.55;margin-top:12px;display:block}

  /* ── COURSES ── */
  .co-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
  .co-coursera{font-size:12.5px;font-weight:650;color:var(--accent-deep);text-decoration:none}
  .co-coursera:hover{text-decoration:underline}
  .filter-section{margin-bottom:20px;display:flex;flex-direction:column;gap:10px}
  .filter-row,.filter-group{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .filter-label,.filter-group-label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:750;min-width:76px}
  .filter-pill,.filter-btn{padding:6px 12px;border:none;border-radius:20px;background:var(--warm-deep);font:600 12.5px var(--b2-sans);cursor:pointer;color:var(--ink-2);transition:all .15s;white-space:nowrap}
  .filter-pill:hover,.filter-btn:hover{color:var(--ink);background:#e6dcc6}
  .filter-pill.active,.filter-btn.active{background:var(--ink);color:#fff}
  .pg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
  .pg-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 24px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .15s,transform .15s;display:flex;flex-direction:column;gap:10px}
  .pg-card:hover{border-color:var(--accent-line);transform:translateY(-1px)}
  .pg-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .pg-top::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pc,var(--accent));flex-shrink:0}
  .pg-plat{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:750;margin-right:4px}
  .pg-name{font-family:var(--b2-serif);font-size:19px;font-weight:600;letter-spacing:-.2px;line-height:1.25;color:var(--ink)}
  .pg-why{font-size:12.5px;color:var(--muted);line-height:1.5;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pg-bar{height:5px;background:var(--warm-deep);border-radius:4px;overflow:hidden;margin-top:auto}
  .pg-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .4s}
  .pg-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);font-weight:600}
  .pg-next{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pg-next b{color:var(--muted);font-weight:600}
  .ss-back{background:none;border:none;font:650 12.5px var(--b2-sans);color:var(--muted);cursor:pointer;padding:4px 0;margin-bottom:12px;transition:color .15s}
  .ss-back:hover{color:var(--accent-deep)}
  /* course rows / modules in program detail */
  .co-expand{background:none;border:none;cursor:pointer;color:var(--muted);font-size:11px;transition:transform .2s,color .15s;padding:3px 6px;flex-shrink:0;border-radius:6px}
  .co-expand:hover{color:var(--ink);background:var(--warm)}
  .co-expand.open{transform:rotate(180deg)}
  .task .mod-prog{margin-left:8px;vertical-align:1px}
  .course-link-btn{background:none;border:none;font-size:13px;cursor:pointer;padding:2px 5px;border-radius:6px;flex-shrink:0;text-decoration:none;opacity:.6}
  .course-link-btn:hover,.course-link-btn.has-link{opacity:1}
  .mods{list-style:none;margin:2px 0 10px 32px;padding-left:14px;border-left:2px solid var(--hair)}
  .mod-row{display:flex;align-items:center;gap:10px;padding:6px 0}
  .mod-row .chk{width:18px;height:18px;border-radius:5px;font-size:10px}
  .mod-row span{flex:1;font-size:13px;font-weight:600}
  .mod-row.done span{text-decoration:line-through;color:var(--muted)}
  .mod-row .tx{opacity:0}
  .mod-row:hover .tx{opacity:1}
  .mod-add{display:flex;gap:7px;margin-top:6px}
  .mod-add input{flex:1;min-width:0;height:30px;padding:0 10px;font-size:12.5px}
  .mod-add button{height:30px;padding:0 12px;font-size:11.5px;border-radius:8px}
  .add-course-link{font:650 12.5px var(--b2-sans);color:var(--accent-deep);background:none;border:none;cursor:pointer;margin-top:12px;padding:4px 0}
  .add-course-link:hover{text-decoration:underline}

  /* ── LIBRARY ── */
  .lib-statsbar{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:18px;padding:18px 24px;background:var(--surface);border:1px solid var(--line);border-radius:18px;align-items:center;box-shadow:var(--shadow)}
  .lib-stat-num{font-family:var(--b2-serif);font-size:26px;font-weight:600;color:var(--ink);line-height:1;letter-spacing:-.4px}
  .lib-stat-label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:6px;font-weight:750}
  .lib-stat-divider{width:1px;height:34px;background:var(--hair);flex-shrink:0}
  .controls-wrap{margin-bottom:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 24px;box-shadow:var(--shadow)}
  .filter-group{margin-bottom:10px}
  .filter-select{min-width:180px;cursor:pointer;height:34px;padding:0 30px 0 12px;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%238c8374' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 11px center}
  .controls-row2{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--hair)}
  .search-input{flex:1;min-width:120px;max-width:360px;height:34px}
  .lib-add-btn{margin-left:auto;flex-shrink:0}
  .lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
  .lib-tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px 14px;cursor:pointer;transition:border-color .15s,transform .15s;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
  .lib-tile:hover{border-color:var(--accent-line);transform:translateY(-1px)}
  .lib-tile.done{opacity:.66}
  .lib-meta{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:750;line-height:1.45}
  .lib-title{font-family:var(--b2-serif);font-size:16.5px;font-weight:600;color:var(--ink);line-height:1.3;letter-spacing:-.15px}
  .lib-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:4px}
  .lib-pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font:700 11px var(--b2-sans);border:none;cursor:pointer;transition:filter .14s}
  .lib-pill:hover{filter:brightness(.97)}
  .lib-pill-q{background:var(--warn-bg);color:var(--warn)}
  .lib-pill-d{background:var(--ok-bg);color:var(--ok)}
  .lib-kebab{background:transparent;border:none;color:var(--faint);cursor:pointer;font-size:16px;line-height:1;padding:3px 7px;border-radius:7px;transition:all .14s}
  .lib-kebab:hover{background:var(--warm);color:var(--ink)}

  /* ── MODALS ── */
  .modal-bg{position:fixed;inset:0;background:rgba(36,31,23,.28);z-index:1000;display:none;align-items:flex-start;justify-content:center;padding:6vh 20px;overflow-y:auto}
  .modal-bg.show{display:flex}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:100%;max-width:520px;padding:26px 28px;box-shadow:0 30px 70px rgba(60,50,30,.22);margin:auto 0}

<script>

(function(){
const KEY='classTracker1';
const PALETTE=['#b099e0','#7e9cc4','#7aa37a','#cf8a93','#cb9a4f','#5fa39a'];
let DB, editClsId=null, editModId=null, pickedColor=PALETTE[0];

function seed(){

    modules:[
      {id:uid(), title:'Start Here', due:'2026-06-19', objective:'Onboarding — complete by end of the first week or risk being dropped as a no-show.',
        tasks:[{id:uid(),label:'Course Contract',done:false},{id:uid(),label:'Introduce yourself to the class',done:false}]},
      {id:uid(), title:'Pluma 1', due:'2026-06-24', objective:'I can share short-term and long-term plans, goals, objectives, and predictions for the future.',
        tasks:[{id:uid(),label:'Prep Comunicativa 1',done:false},{id:uid(),label:'Reading Summary 1',done:false},{id:uid(),label:'Vodcast 1',done:false},{id:uid(),label:'Artículo 1',done:false}]},

        tasks:[{id:uid(),label:'Prep Comunicativa 5',done:false},{id:uid(),label:'Reading Summary 5',done:false},{id:uid(),label:'Vodcast 5',done:false},{id:uid(),label:'Evento Cultural (extra credit)',done:false}]},

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw){DB=seed();save();return;}
    const p=JSON.parse(raw);
    if(Array.isArray(p)){DB={classes:p,active:(p[0]&&p[0].id)||null};}
    else{DB=p;}
    if(!DB.classes)DB.classes=[];
    if(!DB.active||!DB.classes.some(c=>c.id===DB.active))DB.active=(DB.classes[0]&&DB.classes[0].id)||null;
  }catch(e){DB=seed();save();}
}
function save(){localStorage.setItem(KEY,JSON.stringify(DB))}
function activeCls(){return DB.classes.find(c=>c.id===DB.active)}

function daysUntil(iso){if(!iso)return null;const t=new Date();t.setHours(0,0,0,0);const d=new Date(iso+'T00:00:00');return Math.round((d-t)/86400000);}
function fmtDate(iso){if(!iso)return '—';const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
function cdChip(iso){const n=daysUntil(iso);if(n===null)return '';if(n<0)return `<span class="countdown cd-over">${Math.abs(n)}d overdue</span>`;if(n===0)return `<span class="countdown cd-soon">due today</span>`;if(n<=3)return `<span class="countdown cd-soon">${n}d left</span>`;return `<span class="countdown cd-ok">${n}d left</span>`;}
function fmtShort(iso){if(!iso)return '';const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function tdClass(iso){const n=daysUntil(iso);if(n===null)return 'ok';if(n<0)return 'cd-over';if(n<=3)return 'cd-soon';return 'cd-ok';}
function esc(s){return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}

function sortTasksForDisplay(tasks){
  return tasks.slice().sort((a,b)=>{
    if(!a.due&&!b.due)return 0; if(!a.due)return 1; if(!b.due)return -1;
    return a.due.localeCompare(b.due);
  });
}
function clsProgress(c){let done=0,total=0;c.modules.forEach(m=>m.tasks.forEach(t=>{total++;if(t.done)done++}));return {done,total,pct:total?Math.round(done/total*100):0};}
function modProgress(m){const done=m.tasks.filter(t=>t.done).length;return {done,total:m.tasks.length};}
function nextTasks(c){
  const arr=[];
  c.modules.forEach(m=>m.tasks.forEach(t=>{if(t.done)return;arr.push({label:t.label, mod:m.title, eff:t.due||m.due||''});}));
  arr.sort((a,b)=>{if(!a.eff&&!b.eff)return 0;if(!a.eff)return 1;if(!b.eff)return -1;return a.eff.localeCompare(b.eff);});
  return arr;
}

function render(){
  const pills=document.getElementById('cl-pills');
  pills.innerHTML=DB.classes.map(c=>
    `<button class="pill ${c.id===DB.active?'active':''}" onclick="CL.setActive('${c.id}')"><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</button>`
  ).join('')+`<button class="pill-add" onclick="CL.openClass()">+ Add class</button>`;

  const c=activeCls();
  const det=document.getElementById('cl-detail');
  if(!c){det.innerHTML=`<div class="empty"><h3>No classes yet</h3><p>Add a class with a syllabus to start tracking modules and deadlines.</p></div>`;return;}
  document.documentElement.style.setProperty('--cls',c.color);

  const prog=clsProgress(c), nts=nextTasks(c);
  const r=33, circ=2*Math.PI*r, off=circ*(1-prog.pct/100);

  const chips=[];
  if(c.instr)chips.push(`<span class="chip"><b>👤</b>${esc(c.instr)}</span>`);
  if(c.email)chips.push(`<span class="chip"><b>✉️</b><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></span>`);
  if(c.format)chips.push(`<span class="chip"><b>💻</b>${esc(c.format)}</span>`);
  if(c.units)chips.push(`<span class="chip"><b>🎓</b>${esc(c.units)} units</span>`);
  if(c.start||c.end)chips.push(`<span class="chip"><b>📆</b>${fmtDate(c.start)} – ${fmtDate(c.end)}</span>`);
  if(c.inst)chips.push(`<span class="chip"><b>🏫</b>${esc(c.inst)}</span>`);

  const gradeHtml=(c.grading||[]).map(g=>
    `<div class="grade-row"><span class="lbl">${esc(g.label)}${g.note?`<small>${esc(g.note)}</small>`:''}</span><span class="wt">${g.pct}%</span></div>`
  ).join('')+(c.scale?`<div class="scale">${esc(c.scale)}</div>`:'');

  let nextHtml;
  if(nts.length){
    const top=nts[0];
    nextHtml=`<div class="next-title">${esc(top.label)}</div>
      <div class="next-due">${esc(top.mod)} · ${top.eff?fmtDate(top.eff):'no date'} ${cdChip(top.eff)}</div>
      <ul class="next-tasks">${nts.slice(1,5).map(t=>`<li>${esc(t.label)}<span class="nt-d ${tdClass(t.eff)}">${t.eff?fmtShort(t.eff):'—'}</span></li>`).join('')}</ul>`;
  }else{nextHtml=`<div class="all-done">✓ Everything's done — nice work.</div>`;}

  const modsHtml=c.modules.map(m=>{
    const mp=modProgress(m), full=mp.total>0&&mp.done===mp.total;
    const tasks=sortTasksForDisplay(m.tasks).map(t=>{
      const chip=t.due?`<span class="tdue ${tdClass(t.due)}">${fmtShort(t.due)}</span>`:`<span class="tdue empty">＋ date</span>`;
      return `<li class="task ${t.done?'checked':''}">
        <div class="chk ${t.done?'on':''}" onclick="CL.toggleTask('${m.id}','${t.id}')">${t.done?'✓':''}</div>
        <span class="tlabel" onclick="CL.toggleTask('${m.id}','${t.id}')">${esc(t.label)}</span>
        <span class="tdue-wrap" onclick="CL.pickTaskDue(this)">${chip}<input type="date" value="${t.due||''}" onchange="CL.setTaskDue('${m.id}','${t.id}',this.value)"></span>
        <button class="tx" onclick="CL.delTask('${m.id}','${t.id}')">✕</button>
      </li>`;
    }).join('');
    return `<div class="card card-accent mod ${full?'done':''}">
      <div class="mod-top">
        <div class="mod-title">${esc(m.title)}<span class="mod-prog ${full?'full':''}">${full?'✓ complete':`${mp.done}/${mp.total}`}</span>${full?'':cdChip(m.due)}</div>
        <div class="mod-actions"><button class="icon-btn" onclick="CL.openModule('${m.id}')">✎</button></div>

function setActive(id){DB.active=id;save();render()}
function toggleTask(mid,tid){const c=activeCls();const m=c.modules.find(x=>x.id===mid);const t=m.tasks.find(x=>x.id===tid);t.done=!t.done;save();render();}
function addTask(mid){const inp=document.getElementById('nt-'+mid);const v=inp.value.trim();if(!v)return;const dd=document.getElementById('ntd-'+mid);const due=dd?dd.value:'';const c=activeCls();c.modules.find(x=>x.id===mid).tasks.push({id:uid(),label:v,done:false,due});save();render();}
function pickTaskDue(wrap){const inp=wrap.querySelector('input[type=date]');if(!inp)return;try{inp.showPicker();}catch(e){inp.focus();}}
function setTaskDue(mid,tid,val){const c=activeCls();const m=c.modules.find(x=>x.id===mid);const t=m.tasks.find(x=>x.id===tid);if(t){t.due=val||'';save();render();}}
function delTask(mid,tid){const c=activeCls();const m=c.modules.find(x=>x.id===mid);m.tasks=m.tasks.filter(x=>x.id!==tid);save();render();}
function saveNotes(){activeCls().notes=document.getElementById('notesBox').value;save()}
function addLink(){const label=prompt('Link label:');if(!label)return;let url=prompt('URL:');if(!url)return;if(!/^https?:\/\//i.test(url))url='https://'+url;activeCls().links.push({label,url});save();render();}
function delLink(i){activeCls().links.splice(i,1);save();render()}

function openClass(id){
  editClsId=id||null;
  const m=document.getElementById('classModal');
  const sw=document.getElementById('cmSwatches');
  sw.innerHTML=PALETTE.map(p=>`<div class="swatch" data-c="${p}" style="background:${p}" onclick="CL.pickColor('${p}')"></div>`).join('');
  if(id){
    const c=DB.classes.find(x=>x.id===id);
    document.getElementById('cmTitle').textContent='Edit class';
    cmName.value=c.name||'';cmCode.value=c.code||'';cmInst.value=c.inst||'';
    cmInstr.value=c.instr||'';cmEmail.value=c.email||'';cmFormat.value=c.format||'';
    cmUnits.value=c.units||'';cmStart.value=c.start||'';cmEnd.value=c.end||'';cmScale.value=c.scale||'';
    pickColor(c.color);
    document.getElementById('cmDelete').style.display='block';
  }else{
    document.getElementById('cmTitle').textContent='Add a class';
    ['cmName','cmCode','cmInst','cmInstr','cmEmail','cmFormat','cmUnits','cmStart','cmEnd','cmScale'].forEach(i=>document.getElementById(i).value='');
    pickColor(PALETTE[DB.classes.length%PALETTE.length]);
    document.getElementById('cmDelete').style.display='none';
  }
  m.classList.add('show');
}
function pickColor(c){pickedColor=c;document.querySelectorAll('#cmSwatches .swatch').forEach(s=>s.classList.toggle('sel',s.dataset.c===c))}
function saveClass(){
  const name=cmName.value.trim();if(!name){alert('Class name is required.');return;}
  const data={name,code:cmCode.value.trim(),inst:cmInst.value.trim(),instr:cmInstr.value.trim(),
    email:cmEmail.value.trim(),format:cmFormat.value.trim(),units:cmUnits.value.trim(),
    start:cmStart.value,end:cmEnd.value,scale:cmScale.value.trim(),color:pickedColor};
  if(editClsId){Object.assign(DB.classes.find(x=>x.id===editClsId),data);}
  else{const c={id:uid(),...data,grading:[],links:[],notes:'',modules:[]};DB.classes.push(c);DB.active=c.id;}
  save();closeModal('classModal');render();
}
function deleteClass(){
  if(!editClsId)return;
  if(!confirm('Delete this class and all its modules?'))return;
  DB.classes=DB.classes.filter(x=>x.id!==editClsId);
  DB.active=(DB.classes[0]&&DB.classes[0].id)||null;
  save();closeModal('classModal');render();
}
function openModule(id){
  editModId=id||null;
  if(id){
    const m=activeCls().modules.find(x=>x.id===id);
    document.getElementById('mmTitle').textContent='Edit module';
    mmName.value=m.title||'';mmObj.value=m.objective||'';mmDue.value=m.due||'';
    document.getElementById('mmDelete').style.display='block';
  }else{
    document.getElementById('mmTitle').textContent='Add a module';
    mmName.value='';mmObj.value='';mmDue.value='';
    document.getElementById('mmDelete').style.display='none';
  }
  document.getElementById('modModal').classList.add('show');
}
function saveModule(){
  const title=mmName.value.trim();if(!title){alert('Module title is required.');return;}
  const c=activeCls();
  if(editModId){const m=c.modules.find(x=>x.id===editModId);m.title=title;m.objective=mmObj.value.trim();m.due=mmDue.value;}
  else{c.modules.push({id:uid(),title,objective:mmObj.value.trim(),due:mmDue.value,tasks:[]});}
  c.modules.sort((a,b)=>(a.due||'9').localeCompare(b.due||'9'));
  save();closeModal('modModal');render();
}
function deleteModule(){
  if(!editModId)return;
  if(!confirm('Delete this module?'))return;
  const c=activeCls();c.modules=c.modules.filter(x=>x.id!==editModId);
  save();closeModal('modModal');render();
}
function closeModal(id){document.getElementById(id).classList.remove('show')}
document.querySelectorAll('#classModal,#modModal').forEach(bg=>bg.addEventListener('click',e=>{if(e.target===bg)bg.classList.remove('show')}));

window.CL={setActive,toggleTask,addTask,pickTaskDue,setTaskDue,delTask,saveNotes,addLink,delLink,openClass,pickColor,saveClass,deleteClass,openModule,saveModule,deleteModule,closeModal,init:function(){load();render();}};
})();
</script>

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return 'p_'+Math.random().toString(36).slice(2,8);}
function cuid(){return 'c_'+Math.random().toString(36).slice(2,8);}

function loadData(){
  let raw=null;try{raw=localStorage.getItem(SK);}catch(e){}
  if(raw){try{programs=JSON.parse(raw);}catch(e){programs=JSON.parse(JSON.stringify(DEFAULT_PROGRAMS));}}
  else{programs=JSON.parse(JSON.stringify(DEFAULT_PROGRAMS));}
  if(!Array.isArray(programs))programs=[];
  programs.forEach(function(p){
    if(!p.id)p.id=uid();
    if(typeof p.purpose!=='string')p.purpose='';
    if(!Array.isArray(p.links))p.links=[];
    if(!p.status)p.status='active'; if(!p.url)p.url=''; if(!p.targetDate)p.targetDate=''; if(!p.notes)p.notes='';
    if(!Array.isArray(p.courses))p.courses=[];
    p.courses.forEach(function(c){
      if(!c.cid)c.cid=cuid();
      if(!Array.isArray(c.modules))c.modules=[];
      c.modules.forEach(function(m){if(!m.id)m.id=cuid();if(typeof m.done!=='boolean')m.done=false;});
      if(typeof c.done!=='boolean')c.done=(typeof c.pct==='number'&&c.pct>=100);
      if(!c.link)c.link='';
    });
  });
  saveData();
}
function saveData(){try{localStorage.setItem(SK,JSON.stringify(programs));}catch(e){}}
function getById(id){return programs.find(function(p){return p.id===id;});}

function courseComplete(c){return c.modules.length?c.modules.every(function(m){return m.done;}):!!c.done;}
function courseFrac(c){return c.modules.length?(c.modules.filter(function(m){return m.done;}).length/c.modules.length):(c.done?1:0);}
function isFlat(p){return p.courses.length<=1;}

function stats(p){
  if(isFlat(p)){
    const c=p.courses[0];
    if(!c)return {pct:0,dn:0,tt:0,unit:'modules'};
    if(c.modules.length){const dn=c.modules.filter(function(m){return m.done;}).length;return {pct:Math.round(dn/c.modules.length*100),dn:dn,tt:c.modules.length,unit:'modules'};}
    return {pct:c.done?100:0,dn:c.done?1:0,tt:1,unit:'course'};
  }
  const fr=p.courses.map(courseFrac);
  const pct=Math.round(fr.reduce(function(a,b){return a+b;},0)/fr.length*100);
  return {pct:pct,dn:p.courses.filter(courseComplete).length,tt:p.courses.length,unit:'courses'};
}
function nextLabel(p){
  if(isFlat(p)){
    const c=p.courses[0];if(!c)return null;
    if(c.modules.length){const m=c.modules.find(function(x){return !x.done;});return m?m.name:null;}
    return c.done?null:c.name;
  }
  const c=p.courses.find(function(x){return !courseComplete(x);});
  return c?c.name:null;
}
function daysUntil(d){if(!d)return null;const now=new Date();now.setHours(0,0,0,0);const t=new Date(d+'T00:00:00');return Math.ceil((t-now)/86400000);}
function dueBadge(d){const n=daysUntil(d);if(n===null)return '';if(n<0)return '<span class="due-badge due-overdue">Overdue</span>';if(n===0)return '<span class="due-badge due-soon">Due today</span>';if(n<=7)return '<span class="due-badge due-soon">'+n+'d left</span>';return '<span class="due-badge due-ok">'+n+'d left</span>';}
function statusPill(s){const map={active:['status-active','Active'],queued:['status-queued','Queued'],hold:['status-hold','On Hold']};const x=map[s]||map.active;return '<span class="status-pill '+x[0]+'">'+x[1]+'</span>';}
function fmtDate(iso){if(!iso)return '';const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function cd(d){const n=daysUntil(d);if(n===null)return '';if(n<0)return '<span class="countdown cd-over">'+Math.abs(n)+'d ago</span>';if(n===0)return '<span class="countdown cd-soon">today</span>';if(n<=7)return '<span class="countdown cd-soon">'+n+'d</span>';return '<span class="countdown cd-ok">'+n+'d</span>';}

/* ---- filters ---- */
function renderFilters(){
  const host=document.getElementById('co-filters');
  let statusHtml='<div class="filter-row"><span class="filter-label">Status</span>'+
    ['all','active','queued','hold'].map(function(s){
      const labels={all:'All',active:'Active',queued:'Queued',hold:'On Hold'};
      return '<button class="filter-pill'+(currentStatusFilter===s?' active':'')+'" onclick="CO.setStatusFilter(\''+s+'\')">'+labels[s]+'</button>';
    }).join('')+'</div>';
  const usedCats={};programs.forEach(function(p){usedCats[p.category]=true;});
  const cats=Object.keys(usedCats).sort();
  let catHtml='';
  if(cats.length>1){
    catHtml='<div class="filter-row"><span class="filter-label">Category</span>'+
      '<button class="filter-pill'+(currentCatFilter==='all'?' active':'')+'" onclick="CO.setCatFilter(\'all\')">All</button>'+
      cats.map(function(cat){
        const isA=currentCatFilter===cat, color=CAT_COLORS[cat]||'#b8b0a8';
        const style=isA?'background:'+color+';border-color:'+color+';color:#fff;':'';
        return '<button class="filter-pill'+(isA?' active':'')+'" style="'+style+'" onclick="CO.setCatFilter(\''+esc(cat)+'\')">'+esc(cat)+'</button>';
      }).join('')+'</div>';
  }
  host.innerHTML=statusHtml+catHtml;
}
function getFiltered(){
  return programs.filter(function(p){
    if(currentStatusFilter!=='all'&&p.status!==currentStatusFilter)return false;
    if(currentCatFilter!=='all'&&p.category!==currentCatFilter)return false;
    return true;
  });
}

/* ---- grid ---- */
function renderGrid(){
  renderFilters();

      const accent=CAT_COLORS[p.category]||'#b8b0a8', s=stats(p), nx=nextLabel(p);

        '<div class="pg-top"><span class="pg-plat">'+esc(p.platform)+'</span>'+statusPill(p.status)+dueBadge(p.targetDate)+'</div>'+

        '<div class="pg-bar"><div class="pg-fill" style="width:'+s.pct+'%"></div></div>'+
        '<div class="pg-foot"><span class="pg-next">'+(nx?'<b>Next:</b> '+esc(nx):'\u2713 All done')+'</span><span>'+s.dn+'/'+s.tt+' \u00b7 '+s.pct+'%</span></div>'+
      '</div>';
    }).join('');
  }
  document.getElementById('co-grid-view').style.display='block';
  document.getElementById('co-detail').style.display='none';
}

/* ---- detail ---- */
function modListHtml(ci,c){
  let rows=c.modules.map(function(m,mi){
    return '<li class="mod-row '+(m.done?'done':'')+'"><div class="chk '+(m.done?'on':'')+'" onclick="CO.toggleModule('+ci+','+mi+')">'+(m.done?'\u2713':'')+'</div><span>'+esc(m.name)+'</span><button class="tx" onclick="CO.delModule('+ci+','+mi+')">\u2715</button></li>';
  }).join('');
  rows+='<li class="mod-add"><input id="co-newmod-'+ci+'" placeholder="Add a module\u2026" onkeydown="if(event.key===\'Enter\')CO.addModule('+ci+')"><button onclick="CO.addModule('+ci+')">Add</button></li>';
  return '<ul class="mods">'+rows+'</ul>';
}

function renderDetail(){
  const p=getById(openId), host=document.getElementById('co-detail');
  if(!p){renderGrid();return;}
  const accent=CAT_COLORS[p.category]||'#b8b0a8', s=stats(p), nx=nextLabel(p);
  const r=33, circ=2*Math.PI*r, off=circ*(1-s.pct/100);
  host.style.setProperty('--cls',accent);

  const chips=[];
  chips.push('<span class="chip"><b>\ud83d\udcda</b>'+esc(p.platform)+'</span>');
  chips.push('<span class="chip"><b>\ud83c\udff7</b>'+esc(p.category)+'</span>');
  if(p.targetDate)chips.push('<span class="chip"><b>\ud83c\udfaf</b>'+fmtDate(p.targetDate)+' '+cd(p.targetDate)+'</span>');
  if(p.url)chips.push('<span class="chip"><b>\ud83d\udd17</b><a href="'+esc(p.url)+'" target="_blank" rel="noopener">Open program</a></span>');

  let upHtml;
  if(nx){upHtml='<div class="next-title">'+esc(nx)+'</div>';}
  else if(s.tt){upHtml='<div class="all-done">\u2713 Everything complete \u2014 nice work.</div>';}
  else{upHtml='<div style="color:var(--muted);font-size:.86rem">Nothing tracked yet \u2014 add modules below.</div>';}

  const aboutHtml=(p.purpose?'<div style="font-size:.86rem;line-height:1.5;color:var(--ink)">'+esc(p.purpose)+'</div>':'<div style="font-size:.84rem;color:var(--muted)">No purpose noted \u2014 add one with \u270e.</div>')+
    '<div class="ov-meta" style="margin-top:10px">'+statusPill(p.status)+(p.targetDate?'<span class="chip"><b>\ud83c\udfaf</b>'+fmtDate(p.targetDate)+'</span>':'')+'</div>';

  /* ---- courses / modules section ---- */
  let workHtml;
  if(isFlat(p)){
    const c=p.courses[0];
    let body;
    if(c&&c.modules.length){
      body=modListHtml(0,c);
    }else if(c){
      body='<ul class="tasks"><li class="task '+(c.done?'checked':'')+'"><div class="chk '+(c.done?'on':'')+'" onclick="CO.toggleCourse(0)">'+(c.done?'\u2713':'')+'</div><span class="tlabel" onclick="CO.toggleCourse(0)">'+esc(c.name)+'</span></li></ul>'+modListHtml(0,c);
    }else{
      body=modListHtml(0,{modules:[]});
    }
    workHtml='<div class="sec-head"><h3>Modules</h3></div><div class="card">'+body+
      '<button class="add-course-link" onclick="CO.addCourse()">+ This is actually multiple courses \u2014 add another</button></div>';
  }else{
    const rows=p.courses.map(function(c,ci){
      const complete=courseComplete(c), hasMods=c.modules.length>0, open=!!expanded[c.cid];
      const mDone=c.modules.filter(function(m){return m.done;}).length;
      const badge=hasMods?' <span class="mod-prog '+(complete?'full':'')+'">'+mDone+'/'+c.modules.length+'</span>':'';
      const linkHtml=c.link?'<a class="course-link-btn has-link" href="'+esc(c.link)+'" target="_blank" rel="noopener" title="Open study notes" onclick="event.stopPropagation()">\ud83d\udd17</a>':'';
      return '<li class="task '+(complete?'checked':'')+'">'+
          '<div class="chk '+(complete?'on':'')+'" onclick="CO.toggleCourse('+ci+')">'+(complete?'\u2713':'')+'</div>'+
          '<span class="tlabel" onclick="CO.toggleExpand(\''+c.cid+'\')">'+esc(c.name)+badge+'</span>'+
          '<button class="co-expand '+(open?'open':'')+'" onclick="CO.toggleExpand(\''+c.cid+'\')" title="Modules">\u25be</button>'+
          linkHtml+
          '<button class="tx" onclick="CO.editCourseLink('+ci+')" title="Study-notes link">\u270e</button>'+
          '<button class="tx" onclick="CO.delCourse('+ci+')">\u2715</button>'+
        '</li>'+(open?modListHtml(ci,c):'');
    }).join('');
    workHtml='<div class="sec-head"><h3>Courses</h3></div><div class="card"><ul class="tasks">'+rows+'</ul>'+
      '<div class="add-task"><input id="co-newcourse" placeholder="Add a course\u2026" onkeydown="if(event.key===\'Enter\')CO.addCourse()"><button onclick="CO.addCourse()">Add</button></div></div>';
  }

  const linksHtml=(p.links||[]).map(function(l,i){
    return '<li><a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+'</a><button class="tx" onclick="CO.delLink('+i+')">\u2715</button></li>';
  }).join('')||'<li style="color:var(--muted);border:none">No resources yet.</li>';

  host.innerHTML=
    '<button class="ss-back" onclick="CO.closeProgram()">\u2190 All programs</button>'+
    '<div class="print-stamp">'+esc(p.name)+' \u2014 printed '+new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})+'</div>'+
    '<div class="card card-accent ov">'+
      '<div class="code">'+esc(p.platform)+'</div>'+
      '<h2>'+esc(p.name)+'</h2>'+
      '<div class="ov-meta">'+chips.join('')+'</div>'+
      '<div class="ov-actions"><button class="icon-btn" onclick="CO.openEditModal(\''+p.id+'\')">\u270e</button></div>'+
    '</div>'+
    '<div class="row3">'+
      '<div class="card"><div class="mini-label">Progress</div>'+
        '<div class="ring-wrap"><div class="ring">'+
          '<svg width="84" height="84" viewBox="0 0 84 84">'+
            '<circle cx="42" cy="42" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="9"/>'+
            '<circle cx="42" cy="42" r="'+r+'" fill="none" stroke="'+accent+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+off+'"/>'+
          '</svg><div class="pct">'+s.pct+'%</div></div>'+
          '<div class="ring-txt"><div class="big">'+s.dn+' of '+s.tt+'</div><div class="sub">'+s.unit+' done</div></div>'+
        '</div></div>'+
      '<div class="card"><div class="mini-label">Up Next</div>'+upHtml+'</div>'+
      '<div class="card"><div class="mini-label">About</div>'+aboutHtml+'</div>'+
    '</div>'+
    workHtml+
    '<div class="two">'+
      '<div class="card"><div class="sec-head" style="margin:0 0 4px"><h3 style="font-size:1.1rem">Resources</h3><button class="add-btn ghost" onclick="CO.addLink()">+ Link</button></div><ul class="link-list">'+linksHtml+'</ul></div>'+
      '<div class="card"><h3 style="font-size:1.1rem;font-family:\'Fraunces\',serif;font-weight:500">Notes</h3><textarea class="notes" id="co-notes" placeholder="What to focus on, where you left off\u2026" onchange="CO.saveNotes(this.value)">'+esc(p.notes)+'</textarea><div class="notes-print">'+esc(p.notes||'')+'</div></div>'+
    '</div>';
  document.getElementById('co-grid-view').style.display='none';
  host.style.display='block';
  window.scrollTo(0,0);
}

function syncNotes(){const p=getById(openId);if(!p)return;const n=document.getElementById('co-notes');if(n)p.notes=n.value;}

window.CO={
  setStatusFilter:function(s){currentStatusFilter=s;renderGrid();},
  setCatFilter:function(c){currentCatFilter=c;renderGrid();},
  openProgram:function(id){openId=id;expanded={};renderDetail();},
  closeProgram:function(){syncNotes();saveData();openId=null;renderGrid();},
  toggleExpand:function(cid){expanded[cid]=!expanded[cid];renderDetail();},
  toggleCourse:function(ci){syncNotes();const p=getById(openId);if(!p||!p.courses[ci])return;const c=p.courses[ci];if(c.modules.length){const all=c.modules.every(function(m){return m.done;});c.modules.forEach(function(m){m.done=!all;});}else{c.done=!c.done;}saveData();renderDetail();},
  toggleModule:function(ci,mi){syncNotes();const p=getById(openId);if(!p||!p.courses[ci]||!p.courses[ci].modules[mi])return;p.courses[ci].modules[mi].done=!p.courses[ci].modules[mi].done;saveData();renderDetail();},
  addModule:function(ci){syncNotes();const p=getById(openId);if(!p)return;if(!p.courses[ci])p.courses[ci]={cid:cuid(),name:p.name,link:'',done:false,modules:[]};const inp=document.getElementById('co-newmod-'+ci);const name=inp?inp.value.trim():'';if(!name)return;p.courses[ci].modules.push({id:cuid(),name:name,done:false});saveData();renderDetail();const fresh=document.getElementById('co-newmod-'+ci);if(fresh)fresh.focus();},
  delModule:function(ci,mi){syncNotes();const p=getById(openId);if(!p||!p.courses[ci])return;p.courses[ci].modules.splice(mi,1);saveData();renderDetail();},
  addCourse:function(){syncNotes();const p=getById(openId);if(!p)return;const inp=document.getElementById('co-newcourse');let name;if(inp){name=inp.value.trim();if(!name)return;}else{name=prompt('Name of the next course:');if(!name)return;name=name.trim();if(!name)return;}p.courses.push({cid:cuid(),name:name,link:'',done:false,modules:[]});saveData();renderDetail();},
  delCourse:function(ci){syncNotes();const p=getById(openId);if(!p)return;if(!confirm('Remove this course and its modules?'))return;p.courses.splice(ci,1);saveData();renderDetail();},
  editCourseLink:function(ci){const p=getById(openId);if(!p||!p.courses[ci])return;let url=prompt('Study-notes link for this course:',p.courses[ci].link||'');if(url===null)return;url=url.trim();if(url&&!/^https?:\/\//i.test(url))url='https://'+url;p.courses[ci].link=url;saveData();renderDetail();},
  addLink:function(){syncNotes();const p=getById(openId);if(!p)return;const label=prompt('Resource name:');if(!label)return;let url=prompt('URL:')||'';if(url&&!/^https?:\/\//i.test(url))url='https://'+url;p.links.push({label:label.trim(),url:url.trim()});saveData();renderDetail();},
  delLink:function(i){syncNotes();const p=getById(openId);if(!p)return;p.links.splice(i,1);saveData();renderDetail();},
  saveNotes:function(v){const p=getById(openId);if(p){p.notes=v;saveData();}},
  openAddModal:function(){
    editingId=null;
    document.getElementById('pmTitle').textContent='Add program';
    document.getElementById('pm-save').textContent='Add program';
    ['pm-name','pm-platform','pm-url','pm-purpose','pm-notes','pm-first-course'].forEach(function(id){document.getElementById(id).value='';});
    document.getElementById('pm-target').value='';
    document.getElementById('pm-status').value='active';
    document.getElementById('pm-category').value='Data & Analytics';
    document.getElementById('pm-first-course-wrap').style.display='block';
    document.getElementById('pm-delete').style.display='none';
    document.getElementById('progModal').classList.add('show');
    setTimeout(function(){document.getElementById('pm-name').focus();},80);
  },
  openEditModal:function(id){
    const p=getById(id);if(!p)return;
    editingId=id;
    document.getElementById('pmTitle').textContent='Edit program';
    document.getElementById('pm-save').textContent='Save changes';
    document.getElementById('pm-name').value=p.name;
    document.getElementById('pm-platform').value=p.platform;
    document.getElementById('pm-category').value=p.category;
    document.getElementById('pm-status').value=p.status||'active';
    document.getElementById('pm-target').value=p.targetDate||'';
    document.getElementById('pm-url').value=p.url||'';
    document.getElementById('pm-purpose').value=p.purpose||'';
    document.getElementById('pm-notes').value=p.notes||'';
    document.getElementById('pm-first-course-wrap').style.display='none';
    document.getElementById('pm-delete').style.display='block';
    document.getElementById('progModal').classList.add('show');
  },
  saveProgram:function(){
    const name=document.getElementById('pm-name').value.trim();
    if(!name){document.getElementById('pm-name').focus();return;}
    const platform=document.getElementById('pm-platform').value.trim()||'Coursera';
    const category=document.getElementById('pm-category').value;
    const status=document.getElementById('pm-status').value;
    const targetDate=document.getElementById('pm-target').value;
    const url=document.getElementById('pm-url').value.trim();
    const purpose=document.getElementById('pm-purpose').value.trim();
    const notes=document.getElementById('pm-notes').value.trim();
    if(editingId){
      const p=getById(editingId);
      if(p){p.name=name;p.platform=platform;p.category=category;p.status=status;p.targetDate=targetDate;p.url=url;p.purpose=purpose;p.notes=notes;}
    }else{
      const fc=document.getElementById('pm-first-course').value.trim();
      const np={id:uid(),name:name,platform:platform,category:category,status:status,targetDate:targetDate,url:url,purpose:purpose,notes:notes,links:[],courses:fc?[{cid:cuid(),name:fc,done:false,link:'',modules:[]}]:[]};
      programs.push(np);editingId=np.id;
    }
    saveData();
    document.getElementById('progModal').classList.remove('show');
    if(openId){openId=editingId;renderDetail();}else{renderGrid();}
  },
  deleteProgram:function(){
    if(!editingId)return;
    if(!confirm('Remove this entire program?'))return;
    programs=programs.filter(function(p){return p.id!==editingId;});
    if(openId===editingId)openId=null;
    saveData();
    document.getElementById('progModal').classList.remove('show');
    renderGrid();
  },
  closeModal:function(){document.getElementById('progModal').classList.remove('show');},
  init:function(){
    loadData();renderGrid();
    document.getElementById('progModal').addEventListener('click',function(e){if(e.target===this)window.CO.closeModal();});
  }
};
})();
</script>

<script>
/* ════════════ LIBRARY TAB (learnLibrary1) ════════════ */
(function(){
  var KEY='learnLibrary1';
  var DB, editId=null, fStatus='all', fSubj='all', searchQ='';
  var SMETA={queued:{label:'Queued',cls:'lib-pill-q',color:'var(--amber)'},done:{label:'Done',cls:'lib-pill-d',color:'var(--sage)'}};
  var CYCLE={queued:'done',done:'queued'};
  var RANK={queued:0,done:1};
  var TYPEMETA={video:'Video',playlist:'Playlist',podcast:'Podcast',article:'Article'};
  var SUBJECTS=['Philosophy','Personal Development','Psychology','Health & Wellness','Technology & AI','Business & Career','Finance & Money','Politics & Society','History','Science','Languages','Arts & Culture','Other'];

  function uid(){return Math.random().toString(36).slice(2,9)}
  function g(id){return document.getElementById(id)}
  function find(id){return DB.items.filter(function(x){return x.id===id})[0]}
  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

  function load(){
    try{var r=localStorage.getItem(KEY); DB=r?JSON.parse(r):null;}catch(e){DB=null;}
    if(!DB||!DB.items){DB=seed();return;}
    DB.items.forEach(function(it){ if(it.status!=='done')it.status='queued'; if('note' in it)delete it.note; });
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
  function seed(){
    return {items:[
      {id:uid(),title:'Crash Course Philosophy (full playlist)',url:'https://www.youtube.com/playlist?list=PL8dPuuaLjXtNgK6MZucdYldNkMybYIHKR',type:'playlist',subject:'Philosophy',status:'queued'},
      {id:uid(),title:'But what is a neural network? \u2014 3Blue1Brown',url:'https://www.youtube.com/watch?v=aircAruvnKk',type:'video',subject:'Technology & AI',status:'queued'},
      {id:uid(),title:'Huberman Lab \u2014 Sleep toolkit',url:'https://open.spotify.com/show/79CkJF3UJTHFV8Dse3Oy0P',type:'podcast',subject:'Health & Wellness',status:'queued'},
      {id:uid(),title:'How to take smart notes (talk)',url:'https://www.youtube.com/watch?v=Xc2vmsTODGY',type:'video',subject:'Personal Development',status:'done'}
    ]};
  }
  function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return ''}}
  function platLabel(u){var hh=host(u);if(/youtube\.com|youtu\.be/.test(hh))return 'YouTube';if(/spotify\.com/.test(hh))return 'Spotify';if(/apple\.com/.test(hh))return 'Apple';if(/vimeo\.com/.test(hh))return 'Vimeo';return hh||'Link';}
  function guessType(u){if(/list=|\/playlist/.test(u))return 'playlist';if(/youtube\.com\/watch|youtu\.be|vimeo\.com/.test(u))return 'video';if(/spotify\.com|\/podcast|podcasts\./.test(u))return 'podcast';return 'article';}
  function counts(){var c={queued:0,done:0};DB.items.forEach(function(it){c[it.status]=(c[it.status]||0)+1});return c;}
  function subjects(){var s=[];DB.items.forEach(function(it){if(it.subject && s.indexOf(it.subject)<0)s.push(it.subject)});return s.sort();}

  function tileHtml(it){
    var sm=SMETA[it.status]||SMETA.queued;
    var meta=[platLabel(it.url),TYPEMETA[it.type]||'Link'];if(it.subject)meta.push(it.subject);
    return '<div class="lib-tile'+(it.status==='done'?' done':'')+'" style="--pc:'+sm.color+'" onclick="LIB.open(\''+it.id+'\')">'
      +'<div class="lib-meta">'+meta.map(esc).join(' \u00b7 ')+'</div>'
      +'<div class="lib-title">'+esc(it.title)+'</div>'
      +'<div class="lib-foot">'
        +'<button class="lib-pill '+sm.cls+'" onclick="event.stopPropagation();LIB.cycle(\''+it.id+'\')">'+sm.label+'</button>'
        +'<button class="lib-kebab" title="Edit" onclick="event.stopPropagation();LIB.edit(\''+it.id+'\')">\u22ee</button>'
      +'</div></div>';
  }
  function statusFilters(){
    return [['all','All'],['queued','Queued'],['done','Done']].map(function(d){
      return '<button class="filter-btn'+(fStatus===d[0]?' active':'')+'" onclick="LIB.filterStatus(\''+d[0]+'\')">'+d[1]+'</button>';
    }).join('');
  }
  function render(){
    var c=counts(), total=DB.items.length;
    g('lib-statsbar').innerHTML=
      '<div class="lib-stat"><div class="lib-stat-num">'+total+'</div><div class="lib-stat-label">Total</div></div>'+
      '<div class="lib-stat-divider"></div>'+
      '<div class="lib-stat"><div class="lib-stat-num">'+c.queued+'</div><div class="lib-stat-label">Queued</div></div>'+
      '<div class="lib-stat-divider"></div>'+
      '<div class="lib-stat"><div class="lib-stat-num">'+c.done+'</div><div class="lib-stat-label">Done</div></div>';
    g('lib-status-filters').innerHTML=statusFilters();
    var subs=subjects();
    g('lib-subject-select').innerHTML='<option value="all">All subjects</option>'+subs.map(function(s){return '<option value="'+esc(s)+'"'+(fSubj===s?' selected':'')+'>'+esc(s)+'</option>';}).join('');
    var q=searchQ.trim().toLowerCase();
    var items=DB.items.filter(function(it){
      if(fStatus!=='all'&&it.status!==fStatus)return false;
      if(fSubj!=='all'&&it.subject!==fSubj)return false;
      if(q){if((it.title||'').toLowerCase().indexOf(q)<0 && (it.subject||'').toLowerCase().indexOf(q)<0)return false;}
      return true;
    }).sort(function(a,b){return (RANK[a.status]||0)-(RANK[b.status]||0);});
    var list=g('lib-list');
    if(!items.length){list.innerHTML='<div class="empty"><h3>Nothing here</h3><p>No resources match these filters yet \u2014 clear them, or add something you want to work through.</p></div>';return;}
    list.innerHTML='<div class="lib-grid">'+items.map(tileHtml).join('')+'</div>';
  }
  function open(id){var it=find(id);if(it&&it.url){window.open(it.url,'_blank','noopener')}}
  function cycle(id){var it=find(id);if(!it)return;it.status=CYCLE[it.status]||'queued';save();render()}
  function openModal(id){
    editId=id||null;
    var it=id?find(id):{title:'',url:'',type:'article',subject:''};
    if(!it)return;
    g('lmTitle').textContent=id?'Edit resource':'Add a resource';
    g('lmName').value=it.title||'';
    g('lmUrl').value=it.url||'';
    g('lmType').value=it.type||'article';
    var subSel=g('lmSubject');
    subSel.innerHTML='<option value="">\u2014 None \u2014</option>'+SUBJECTS.map(function(s){return '<option>'+esc(s)+'</option>';}).join('');
    var curSub=it.subject||'';
    if(curSub && SUBJECTS.indexOf(curSub)<0){subSel.insertAdjacentHTML('beforeend','<option>'+esc(curSub)+'</option>');}
    subSel.value=curSub;
    g('lmSave').textContent=id?'Save':'Add resource';
    g('lmDel').style.display=id?'inline-flex':'none';
    g('libModal').classList.add('show');
  }
  function closeModal(){g('libModal').classList.remove('show');editId=null}
  function urlInput(){if(editId)return;var u=g('lmUrl').value.trim();if(u)g('lmType').value=guessType(u)}
  function saveItem(){
    var title=g('lmName').value.trim();
    if(!title){alert('Give it a title first.');return}
    var f={title:title,url:g('lmUrl').value.trim(),type:g('lmType').value,subject:g('lmSubject').value};
    if(editId){var it=find(editId);if(it){it.title=f.title;it.url=f.url;it.type=f.type;it.subject=f.subject;}}
    else{f.id=uid();f.status='queued';DB.items.unshift(f);}
    save();closeModal();render();
  }
  function delFromModal(){
    if(!editId)return;
    if(!confirm('Remove this from your library?'))return;
    DB.items=DB.items.filter(function(x){return x.id!==editId});
    save();closeModal();render();
  }
  window.LIB={
    open:open,cycle:cycle,edit:openModal,openAdd:function(){openModal(null)},
    close:closeModal,save:saveItem,delFromModal:delFromModal,urlInput:urlInput,
    filterStatus:function(s){fStatus=s;render();},
    filterSubject:function(s){fSubj=s;render();},
    search:function(v){searchQ=v;render();},
    init:function(){load();render();document.getElementById('libModal').addEventListener('click',function(e){if(e.target===this)closeModal();});}
  };
})();
</script>
