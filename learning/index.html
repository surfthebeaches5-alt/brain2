<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classes · Brain 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
<style>
  /* Track colours encode data (formal · online · self-study). Everything else uses the shared tokens from brain.css. */
  :root{
    --fm:#8e71d3; --fm-s:#f0eafc; --on:#5f88b8; --on-s:#e5edf7; --ss:#5f9568; --ss-s:#e4efe3; --ss-line:#cfe2cc; --idea:#b9b09e;
    --shadow:0 1px 2px rgba(60,50,30,.04),0 8px 24px rgba(60,50,30,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--b2-sans);background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer}
  a{color:inherit;text-decoration:none}

  /* ── title row (brain.css styles .topbar) ── */
  .topbar-left{display:flex;align-items:center;gap:14px}
  .topbar-title{font-family:var(--b2-serif);font-size:34px;font-weight:600}
  .back-btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border:1px solid var(--line);border-radius:8px;font:650 11.5px var(--b2-sans);color:var(--muted);text-decoration:none;background:var(--raised)}
  .tabnav{display:inline-flex;gap:2px;padding:4px;background:var(--warm-deep);border-radius:13px}
  .tabnav button{border:0;background:transparent;padding:8px 16px;border-radius:10px;font:650 13px var(--b2-sans);color:var(--muted);white-space:nowrap;transition:background .15s,color .15s}
  .tabnav button:hover{color:var(--ink)}
  .tabnav button.active{background:var(--raised);color:var(--ink);box-shadow:0 1px 3px rgba(60,50,30,.1)}
  .tabnav button small{font-size:11px;color:var(--faint);margin-left:5px;font-weight:700}

  /* ── frame ── */
  .wrap{max-width:1280px;margin:0 auto;padding:20px 40px 80px}
  .pane{display:none}
  .pane.show{display:block}
  .print-stamp,.notes-print{display:none}

  /* ── atoms ── */
  .grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
  .s4{grid-column:span 4}.s5{grid-column:span 5}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
  .stack{display:flex;flex-direction:column;gap:18px;min-width:0}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 24px;box-shadow:var(--shadow);min-width:0}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  .card-t{font-family:var(--b2-serif);font-size:19px;font-weight:600;letter-spacing:-.2px}
  .card-m{font-size:12px;color:var(--muted);font-weight:600}
  .more{font-size:12.5px;font-weight:650;color:var(--accent-deep);background:none;border:0;padding:0;white-space:nowrap}
  .more:hover{text-decoration:underline}
  .eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:750}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 15px;border-radius:10px;font:650 12.5px var(--b2-sans);border:1px solid var(--line);background:var(--raised);color:var(--ink-2);white-space:nowrap;transition:border-color .15s,background .15s,color .15s,box-shadow .15s}
  .btn:hover{border-color:var(--accent-line);color:var(--ink)}
  .btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn.primary:hover{box-shadow:0 6px 16px rgba(36,31,23,.18);color:#fff}
  .btn.soft{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-deep)}
  .btn.sm{height:28px;padding:0 11px;font-size:11.5px;border-radius:8px}
  .btn.ssb{border-color:var(--ss-line);color:var(--ss)}
  .btn.go{background:var(--ss);border-color:var(--ss);color:#fff}
  .btn.go:hover{color:#fff;box-shadow:0 6px 16px rgba(63,110,72,.2)}
  .btn.del{background:transparent;border-color:transparent;color:var(--over);padding:0 8px}
  .btn.del:hover{background:var(--over-bg)}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--warm);color:var(--muted);white-space:nowrap}
  .chip.ok{background:var(--ok-bg);color:var(--ok)}
  .chip.lav{background:var(--accent-soft);color:var(--accent-deep)}
  .due{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:12px;white-space:nowrap;background:var(--ok-bg);color:var(--ok);display:inline-flex;align-items:center}
  .due.soon{background:var(--warn-bg);color:var(--warn)}
  .due.over{background:var(--over-bg);color:var(--over)}
  .due.plain{background:var(--warm-2);color:var(--muted)}
  .due.gentle{background:var(--ss-s);color:var(--ss)}
  .due.blue{background:var(--on-s);color:var(--on)}
  .bar{display:block;height:5px;border-radius:4px;background:var(--warm-2);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
  .check{width:20px;height:20px;border-radius:6px;border:1.6px solid var(--line);background:var(--raised);flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;padding:0;transition:all .13s}
  .check:hover{border-color:var(--accent)}
  .check.on{background:var(--accent-deep);border-color:var(--accent-deep)}
  .tx{background:none;border:none;color:var(--faint);font-size:12px;padding:3px 6px;border-radius:6px;opacity:0;transition:opacity .14s,color .14s,background .14s;flex-shrink:0}
  .tx:hover{color:var(--over);background:var(--over-bg)}
  .tx.ed:hover{color:var(--accent-deep);background:var(--accent-soft)}
  *:hover > .tx,.tx:focus{opacity:1}
  .empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:40px 30px;text-align:center;color:var(--muted)}
  .empty h3{font-family:var(--b2-serif);font-weight:600;color:var(--ink);font-size:19px;margin-bottom:6px}
  .empty p{font-size:13px;line-height:1.55;max-width:460px;margin:0 auto}
  .empty .btn{margin-top:14px}
  .soft-empty{font-size:13px;color:var(--muted);font-weight:550;line-height:1.5;padding:6px 0}
  .ti{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .ti svg{width:17px;height:17px;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .sec-l{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 12px}
  .focus{font-family:var(--b2-serif);font-style:italic;font-size:16.5px;color:var(--ink-2);line-height:1.45;padding:10px 14px;background:var(--warm);border-radius:12px;border-left:3px solid var(--accent);cursor:pointer}
  .focus b{font-family:var(--b2-sans);font-style:normal;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;display:block;margin-bottom:3px}
  .focus.ph{color:var(--faint)}

  /* ── season switcher ── */
  .seasons{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .sea{display:inline-flex;gap:2px;padding:4px;background:var(--warm-2);border-radius:13px}
  .sea button{padding:6px 14px;border-radius:10px;text-align:center;line-height:1.2;border:0;background:transparent}
  .sea button b{display:block;font-size:12.5px;font-weight:700;color:var(--muted)}
  .sea button small{display:block;font-size:10.5px;font-weight:600;color:var(--faint)}
  .sea button.on{background:var(--raised);box-shadow:0 1px 3px rgba(60,50,30,.1)}
  .sea button.on b{color:var(--ink)}
  .sea button.on small{color:var(--muted)}
  .sea button.fut b{color:var(--faint)}
  .sea button.now b::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent-deep);margin-left:5px;vertical-align:2px}

  /* ── overview hero ── */
  .hero2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:44px;padding:26px 30px}
  .big{font-family:var(--b2-serif);font-size:50px;font-weight:600;letter-spacing:-1.6px;line-height:1;margin:10px 0 14px}
  .big small{font-size:24px;color:var(--muted);font-weight:500;letter-spacing:0}
  .kp{display:flex;gap:40px;margin:0 0 18px}
  .kp b{font-family:var(--b2-serif);font-size:26px;font-weight:600;display:block;line-height:1}
  .kp span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:750;display:block;margin-top:6px}
  .weeks{display:grid;gap:5px;align-items:end;height:84px;margin-top:14px}
  .wk{display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%;min-width:0}
  .wk i{display:block;border-radius:3px;min-height:3px}
  .wk.past i{opacity:.35}
  .wk.now{background:var(--accent-soft);border-radius:8px;box-shadow:0 0 0 1.5px var(--accent-line);padding:4px 3px 0}
  .wk.zero i{background:var(--warm-2) !important;opacity:1}
  .flags{display:grid;gap:5px;height:18px;margin-top:4px}
  .flags span{font-size:10px;font-weight:750;color:var(--over);white-space:nowrap;position:relative;padding-left:7px;overflow:visible}
  .flags span:not(:empty)::before{content:"";position:absolute;left:0;top:4px;width:4px;height:4px;border-radius:50%;background:currentColor}
  .legend{display:flex;gap:14px;margin-top:6px;font-size:11px;color:var(--muted);font-weight:650}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px;vertical-align:0}
  .tsum{display:flex;flex-direction:column;gap:14px}
  .tsum .top{display:flex;align-items:center;gap:11px}
  .tsum .top .card-t{font-size:18px}
  .tsum .top .more{margin-left:auto}
  .tsum .mid{display:flex;align-items:center;gap:16px}
  .tsum .mid b{font-family:var(--b2-serif);font-size:24px;font-weight:600;line-height:1.05;display:block}
  .tsum .mid span{font-size:12px;color:var(--muted);font-weight:600}
  .nx{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;background:var(--warm);font-size:12.5px;font-weight:600;color:var(--ink-2);min-height:34px}
  .nx em{font-style:normal;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
  .nx .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .day{display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px;padding:10px 0}
  .day+.day{border-top:1px solid var(--hair)}
  .day .d{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.06em;padding-top:9px;text-transform:uppercase}
  .day .d b{display:block;font-family:var(--b2-serif);font-size:18px;color:var(--ink);letter-spacing:0;font-weight:600}
  .tk{display:flex;align-items:center;gap:11px;padding:8px 11px;border-radius:11px;background:var(--warm);margin-bottom:5px;font-size:13.5px;font-weight:600;min-width:0}
  .tk:last-child{margin-bottom:0}
  .tk .sw{width:4px;align-self:stretch;border-radius:3px;flex-shrink:0}
  .tk .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .tk .t small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tk.done{background:var(--accent-soft);color:var(--accent-deep)}
  .tk.done .t{text-decoration:line-through;text-decoration-color:rgba(142,113,211,.45)}
  .tk.done .t small{color:var(--accent)}
  .ms{display:flex;align-items:center;gap:14px;padding:10px 0}
  .ms+.ms{border-top:1px solid var(--hair)}
  .ms .dt{width:46px;height:48px;border-radius:11px;background:var(--warm);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
  .ms .dt small{font-size:9.5px;font-weight:800;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
  .ms .dt b{font-family:var(--b2-serif);font-size:18px;font-weight:600;line-height:1}
  .ms .t{flex:1;font-weight:650;font-size:13.5px;min-width:0}
  .ms .t small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pterm{display:flex;align-items:center;gap:16px;padding:16px 22px;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
  .pterm:hover{border-color:var(--accent-line)}
  .pterm+.pterm{margin-top:10px}
  .pterm .nm{font-weight:700;font-size:14px;min-width:0}
  .pterm .nm small{display:block;font-size:12px;color:var(--muted);font-weight:550;margin-top:2px}
  .dots{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end;max-width:240px}
  .dots i{width:9px;height:9px;border-radius:3px}

  /* ── item switcher (dropdown with search) ── */
  .swrow{display:flex;align-items:center;gap:12px;margin-bottom:16px;position:relative;z-index:35}
  .switch{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:13px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font:700 14px var(--b2-sans);color:var(--ink);max-width:560px;min-width:0}
  .switch .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .switch i{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .switch small{font-weight:600;color:var(--muted);font-size:12.5px;white-space:nowrap}
  .switch .cv{margin-left:6px;color:var(--muted);font-size:12px}
  .switch.open{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
  .swrow .hint{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}
  .swrow .right{margin-left:auto;display:flex;gap:8px}
  .swmenu{position:absolute;top:52px;left:0;width:390px;max-width:calc(100vw - 32px);background:var(--raised);border:1px solid var(--line);border-radius:16px;box-shadow:0 22px 60px rgba(60,50,30,.18);padding:10px;z-index:40}
  .swmenu .srch{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:10px;background:var(--warm);margin-bottom:8px}
  .swmenu .srch svg{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2;flex-shrink:0}
  .swmenu .srch input{border:0;background:transparent;outline:none;font:550 13px var(--b2-sans);flex:1;min-width:0}
  .swlist{max-height:min(420px,60vh);overflow-y:auto}
  .swmenu .gl{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:8px 10px 4px}
  .swmenu .mi2{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font:650 13.5px var(--b2-sans);width:100%;text-align:left;border:0;background:transparent}
  .swmenu .mi2:hover,.swmenu .mi2.kb{background:var(--warm)}
  .swmenu .mi2 i{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .swmenu .mi2 div{min-width:0;flex:1}
  .swmenu .mi2 .nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .swmenu .mi2 small{display:block;font-size:11.5px;color:var(--muted);font-weight:550;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .swmenu .mi2 .r{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:700;flex-shrink:0}
  .swmenu .mi2.on{background:var(--accent-soft)}
  .swmenu .mi2.on .r{color:var(--accent-deep)}
  .swmenu .past2{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;font:650 13px var(--b2-sans);color:var(--ink-2);width:100%;border:0;background:transparent;text-align:left}
  .swmenu .past2:hover{background:var(--warm)}
  .swmenu .past2 .r{margin-left:auto;font-size:11.5px;color:var(--faint);font-weight:700}
  .swmenu .past2 .cv2{display:inline-block;transition:transform .15s;color:var(--muted)}
  .swmenu .past2.open .cv2{transform:rotate(90deg)}
  .swmenu .sub{padding-left:12px}
  .swmenu .sep{height:1px;background:var(--hair);margin:6px 4px}
  .swmenu .add{padding:9px 10px;font:700 13px var(--b2-sans);color:var(--accent-deep);border:0;background:none}
  .swmenu .none{padding:6px 10px 8px;font-size:12.5px;color:var(--faint);font-weight:600}
  .dim{position:fixed;inset:0;background:rgba(36,31,23,.06);z-index:30}

  /* ── detail header ── */
  .ch{display:flex;align-items:flex-start;gap:20px;padding:22px 26px;margin-bottom:18px}
  .ch .eb{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fm);font-weight:800}
  .ch h2{font-family:var(--b2-serif);font-size:30px;font-weight:600;letter-spacing:-.6px;margin:4px 0 12px;line-height:1.15}
  .ch .side{margin-left:auto;display:flex;gap:8px;flex-shrink:0}
  .meta{display:flex;flex-wrap:wrap;gap:6px}
  .meta span{font-size:12px;font-weight:650;color:var(--ink-2);background:var(--warm);border-radius:8px;padding:5px 10px}
  .meta span b{color:var(--muted);font-weight:700;margin-right:5px}
  .meta a{color:var(--accent-deep)}

  /* ── formal: modules ── */
  .mrow{display:grid;grid-template-columns:18px minmax(0,1fr) 120px 48px 74px;gap:12px;align-items:center;padding:12px 4px;cursor:pointer}
  .mrow+.mrow,.mopen+.mrow,.mrow+.mopen,.mopen+.mopen{border-top:1px solid var(--hair)}
  .mrow .chev{color:var(--faint);font-size:12px;font-weight:800}
  .mrow .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mrow .t small{font-weight:550;color:var(--muted);font-size:12px;margin-left:8px}
  .mrow .x{font-size:12px;font-weight:750;color:var(--muted);text-align:right}
  .mrow .dd{text-align:right}
  .mrow.done .t{color:var(--muted)}
  .mrow .bar i{background:var(--fm)}
  .mrow.done .bar i{opacity:.55}
  .mopen{border-radius:14px;background:var(--warm);padding:4px 14px 12px;margin:4px -10px}
  .mopen .mrow{padding-left:0;padding-right:0}
  .obj{font-size:12.5px;color:var(--muted);font-weight:550;line-height:1.5;margin:-4px 0 8px 30px;display:flex;gap:8px;align-items:flex-start}
  .obj span{flex:1}
  .sub-t{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;background:var(--raised);margin:0 0 5px 26px;font-size:13px;font-weight:600}
  .sub-t .t{flex:1;min-width:0;cursor:pointer}
  .sub-t.done .t{color:var(--muted);text-decoration:line-through}
  .dpk{position:relative;display:inline-flex;flex-shrink:0;cursor:pointer}
  .dpk input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:none;pointer-events:none}
  .dpk .due.add{background:var(--warm);color:var(--muted);opacity:0;transition:opacity .14s}
  .sub-t:hover .dpk .due.add{opacity:1}
  .addt{display:flex;align-items:center;gap:8px;margin:6px 0 0 26px;height:36px;padding:0 6px 0 12px;border-radius:10px;border:1.5px dashed var(--line);color:var(--faint);font-size:12.5px;font-weight:550}
  .addt b{color:var(--accent-deep)}
  .addt input{border:0;background:transparent;outline:none;font:550 12.5px var(--b2-sans);flex:1;min-width:0;color:var(--ink)}
  .addt input[type=date]{flex:0 0 auto;width:128px;color:var(--muted);font-size:11.5px}
  .addt .btn{height:26px}
  .addt span{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted)}
  button.addt{width:calc(100% - 26px);background:transparent;text-align:left}
  button.addt:hover{border-color:var(--accent-line);color:var(--accent-deep)}
  .ringwrap{display:flex;align-items:center;gap:20px}
  .big2{font-family:var(--b2-serif);font-size:30px;font-weight:600;line-height:1}
  .big2 small{font-size:15px;color:var(--muted);font-weight:500}
  .segs{display:flex;gap:4px;margin-top:16px}
  .segs i{flex:1;height:8px;border-radius:3px;background:var(--warm-2)}
  .gw{display:grid;grid-template-columns:minmax(0,1fr) 110px 40px;gap:12px;align-items:center;padding:8px 0;font-size:13px;font-weight:650}
  .gw+.gw{border-top:1px solid var(--hair)}
  .gw small{display:block;font-size:11px;color:var(--muted);font-weight:550}
  .gw .bar i{background:var(--fm);opacity:.7}
  .gw .p{font-family:var(--b2-serif);font-size:15px;font-weight:600;text-align:right}
  .scale{margin-top:10px;font-size:11.5px;font-weight:650;color:var(--muted);background:var(--warm);border-radius:9px;padding:7px 10px;text-align:center}
  .tools{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
  .tool{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--warm);font-size:13px;font-weight:650;min-width:0;position:relative}
  .tool:hover{background:var(--warm-2)}
  .tool .lt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tool .av{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
  .tool .ar{color:var(--faint);font-size:12px}
  .tool .tx{position:absolute;top:-6px;right:-6px;background:var(--raised);box-shadow:0 1px 3px rgba(0,0,0,.12);width:20px;height:20px;padding:0;border-radius:50%;font-size:10px}
  .notes{font-size:13px;line-height:1.6;color:var(--ink-2);font-weight:550}
  .notes p{display:flex;gap:9px}
  .notes p+p{margin-top:6px}
  .notes p::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:8px;flex-shrink:0}
  textarea.notes-ed{width:100%;min-height:130px;resize:vertical;line-height:1.55;display:block}

  /* ── online ── */
  .crow{display:grid;grid-template-columns:22px minmax(0,1fr) 120px 52px 80px;gap:12px;align-items:center;padding:12px 4px;cursor:pointer}
  .crow+.crow,.copen+.crow,.crow+.copen{border-top:1px solid var(--hair)}
  .crow .n{width:22px;height:22px;border-radius:7px;background:var(--warm-2);font-size:11px;font-weight:800;color:var(--muted);display:flex;align-items:center;justify-content:center;border:0;padding:0}
  .crow .n:hover{box-shadow:0 0 0 2px var(--on-s)}
  .crow.done .n{background:var(--on-s);color:var(--on)}
  .crow .t{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;min-width:0}
  .crow .t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crow.done .t{color:var(--muted)}
  .crow .x{font-size:12px;font-weight:750;color:var(--muted);text-align:right}
  .crow .dd{text-align:right;display:flex;justify-content:flex-end;gap:2px;align-items:center}
  .crow .bar i{background:var(--on)}
  .copen{border-radius:14px;background:var(--warm);padding:2px 14px 12px;margin:4px -10px}
  .copen .crow{padding-left:0;padding-right:0}
  .mod2{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;background:var(--raised);margin:0 0 5px 34px;font-size:13px;font-weight:600}
  .mod2 .t{flex:1;min-width:0;cursor:pointer}
  .mod2.done{color:var(--muted)}
  .mod2.done .t{text-decoration:line-through}
  .mod2 .check.on{background:var(--on);border-color:var(--on)}
  .mod2 .here{font-size:10.5px;font-weight:800;color:var(--on);background:var(--on-s);padding:2px 8px;border-radius:12px;white-space:nowrap}
  .flat .mod2{margin-left:0}
  .flat .addt{margin-left:0}
  .upn{display:flex;align-items:center;gap:18px}
  .upn .ic{width:54px;height:54px;border-radius:14px;background:var(--on-s);display:flex;align-items:center;justify-content:center;color:var(--on);font-size:20px;flex-shrink:0}
  .upn .tt{font-family:var(--b2-serif);font-size:21px;font-weight:600;letter-spacing:-.3px;line-height:1.2}
  .upn .ss{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:4px}
  .upn .acts{margin-left:auto;display:flex;gap:8px;flex-shrink:0}
  .pace{display:flex;flex-direction:column;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--hair)}
  .pace div{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;font-weight:600;color:var(--muted)}
  .pace div b{color:var(--ink);font-weight:700;text-align:right}

  /* ── self-study ── */
  .nextses{padding:24px 28px;border-color:var(--ss-line);box-shadow:0 0 0 4px var(--ss-s),var(--shadow);position:relative}
  .nextses .eb{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ss);font-weight:800;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .nextses .tt{font-family:var(--b2-serif);font-size:30px;font-weight:600;letter-spacing:-.6px;line-height:1.15;margin:10px 0 6px}
  .nextses .what{font-size:17px;font-weight:650;color:var(--ink);line-height:1.35}
  .nextses .what.ph{color:var(--faint);font-weight:600;cursor:pointer}
  .nextses .ss{font-size:13px;color:var(--muted);font-weight:600;margin-top:6px}
  .nextses .row2{display:flex;align-items:center;gap:8px;margin-top:18px;flex-wrap:wrap}
  .roll{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--ss);background:var(--ss-s);border-radius:12px;padding:2px 9px;letter-spacing:0;text-transform:none}
  .then{margin-top:16px;padding-top:14px;border-top:1px solid var(--hair);display:flex;gap:10px;font-size:12.5px;font-weight:600;color:var(--ink-2);flex-wrap:wrap}
  .then em{font-style:normal;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:800;padding-top:2px}
  .movepop{position:absolute;z-index:20;background:var(--raised);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(60,50,30,.16);padding:6px;display:flex;flex-direction:column;min-width:190px}
  .movepop button,.movepop label{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font:650 12.5px var(--b2-sans);color:var(--ink-2);border:0;background:none;text-align:left;cursor:pointer}
  .movepop button:hover,.movepop label:hover{background:var(--warm)}
  .movepop input{border:1px solid var(--line);border-radius:8px;padding:4px 6px;font:600 12px var(--b2-sans)}
  .gl-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;font-size:12.5px;font-weight:600;color:var(--muted)}
  .gl-row+.gl-row{border-top:1px solid var(--hair)}
  .gl-row b{color:var(--ink);font-weight:700;font-size:13px;text-align:right}
  .gl-row b.okc{color:var(--ok)}
  .tl{position:relative;margin:22px 0 18px}
  .tl .lane{display:grid;gap:4px}
  .tl .seg{height:38px;border-radius:10px;padding:0 12px;display:flex;flex-direction:column;justify-content:center;font-size:12px;font-weight:750;color:var(--ink-2);background:var(--warm-2);min-width:0;white-space:nowrap;overflow:hidden;cursor:pointer;border:0;text-align:left}
  .tl .seg small{font-size:10.5px;font-weight:650;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
  .tl .seg.done{background:var(--ss-s);color:var(--ss)}
  .tl .seg.cur{background:var(--ss);color:#fff}
  .tl .seg.cur small{color:rgba(255,255,255,.8)}
  .tl .seg.wrap{background:transparent;border:1.5px dashed var(--ss-line);color:var(--ss)}
  .tl .ticks{position:relative;height:14px;margin-top:6px}
  .tl .ticks span{position:absolute;font-size:10px;font-weight:700;color:var(--faint);white-space:nowrap}
  .tl .today{position:absolute;top:-7px;height:9px;width:2px;background:var(--ink);border-radius:2px}
  .tl .today::after{content:"today";position:absolute;top:-15px;left:-14px;font-size:9.5px;font-weight:800;color:var(--ink);letter-spacing:.06em}
  .unit{padding:12px 4px;display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:12px;align-items:center;cursor:pointer}
  .unit+.unit,.uopen+.unit,.unit+.uopen,.uopen+.uopen{border-top:1px solid var(--hair)}
  .unit .chev{color:var(--faint);font-size:12px;font-weight:800}
  .unit .q{font-weight:700;font-size:14px;min-width:0}
  .unit .q small{display:block;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ss);font-weight:800;margin-bottom:2px}
  .unit .q .ph{color:var(--faint);font-weight:600}
  .unit.done .q{color:var(--muted)}
  .unit.done .q small{color:var(--faint)}
  .unit .rr{font-size:12px;color:var(--muted);font-weight:650;text-align:right;display:flex;gap:6px;align-items:center}
  .uopen{background:var(--warm);border-radius:14px;padding:2px 14px 12px;margin:4px -10px}
  .uopen .unit{padding-left:0;padding-right:0}
  .ses{display:grid;grid-template-columns:20px 92px 52px 64px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--raised);margin:0 0 5px 30px;font-size:13px;font-weight:600}
  .ses .d{font-size:12px;font-weight:700;color:var(--ink-2)}
  .ses .m{font-size:11.5px;font-weight:700;color:var(--muted)}
  .ses .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--ss)}
  .ses .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
  .ses .t.ph{color:var(--faint)}
  .ses .acts{display:flex;align-items:center;gap:2px}
  .ses.done{color:var(--muted)}
  .ses.done .t{text-decoration:line-through}
  .ses .check.on{background:var(--ss);border-color:var(--ss)}
  .ses.today{box-shadow:0 0 0 2px var(--ss)}
  .ses .mv{font-size:10px;color:var(--ss);font-weight:700;margin-left:6px}
  .acc{padding:11px 0;display:flex;align-items:center;gap:10px;font:650 13.5px var(--b2-sans);width:100%;border:0;background:none;text-align:left}
  .acc+.acc,.acc-b+.acc{border-top:1px solid var(--hair)}
  .acc .c{margin-left:auto;color:var(--faint);font-size:12px;font-weight:800}
  .acc-b{font-size:13px;color:var(--ink-2);line-height:1.5;font-weight:550;padding:0 0 10px;margin-top:-4px;white-space:pre-wrap}
  .acc-b.ph{color:var(--faint)}
  .mini-j{display:flex;gap:10px;align-items:baseline;padding:8px 0;font:650 13px var(--b2-sans);width:100%;border:0;background:none;text-align:left}
  .mini-j+.mini-j{border-top:1px solid var(--hair)}
  .mini-j span{font-size:11px;color:var(--muted);font-weight:700;width:44px;flex-shrink:0}
  .mini-j .jt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini-j small{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
  .chipsrow{display:flex;flex-wrap:wrap;gap:6px}
  .chipsrow .mt{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;padding:6px 10px;border-radius:9px;background:var(--warm);color:var(--ink-2);max-width:100%;position:relative}
  .chipsrow .mt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chipsrow .mt em{font-style:normal;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800}
  .chipsrow a.mt:hover{background:var(--warm-2)}
  .chipsrow .mt .tx{padding:0 3px}
  .shelves{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
  .shelf .eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--ink-2)}
  .shelf .eyebrow i{width:7px;height:7px;border-radius:50%}
  .cc{padding:12px 14px;border-radius:13px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px;position:relative}
  .cc:hover,.cc:focus-within{border-color:var(--accent-line)}
  .cc .tt{font-family:var(--b2-serif);font-size:14.5px;font-weight:600;line-height:1.3;letter-spacing:-.1px}
  .cc .tt span{display:block;font-family:var(--b2-sans);font-size:12px;color:var(--muted);font-weight:600;letter-spacing:0;margin-top:3px;line-height:1.35}
  .cc .st{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
  .cc.act{border-color:var(--ss-line);box-shadow:0 0 0 3px var(--ss-s)}
  .cc .hov{display:none;gap:6px;margin-top:9px;flex-wrap:wrap}
  .cc:hover .hov,.cc:focus-within .hov{display:flex}
  .cc.add{border-style:dashed;background:transparent;color:var(--muted);font:600 12.5px var(--b2-sans);box-shadow:none;width:100%;text-align:left}
  .banner{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:14px;background:var(--accent-soft);border:1px solid var(--accent-line);margin-bottom:16px;font-size:13px;font-weight:600;color:var(--ink-2)}
  .banner .grow{flex:1;min-width:0}

  /* ── plan drawer ── */
  .scrim{position:fixed;inset:0;background:rgba(36,31,23,.22);z-index:1000;display:none}
  .scrim.show{display:block}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:100vw;background:var(--surface);border-left:1px solid var(--line);box-shadow:-20px 0 50px rgba(60,50,30,.14);z-index:1001;display:none;flex-direction:column}
  .drawer.show{display:flex}
  .dr-h{padding:22px 26px 6px}
  .dr-h .card-t{font-size:22px}
  .dr-b{flex:1;padding:10px 26px 20px;display:flex;flex-direction:column;gap:18px;overflow-y:auto}
  .stp{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px}
  .stp .n{width:24px;height:24px;border-radius:50%;background:var(--ss-s);color:var(--ss);font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .stp .l{font-size:13px;font-weight:750;margin:3px 0 8px}
  .in2{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--raised);padding:0 10px;font:650 13px var(--b2-sans);color:var(--ink);outline:none}
  .in2:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
  .dpick{display:flex;gap:5px}
  .dpick button{width:30px;height:30px;border-radius:9px;background:var(--warm-2);font-size:11.5px;font-weight:800;color:var(--muted);border:0;padding:0}
  .dpick button.on{background:var(--ss);color:#fff}
  .urow{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;background:var(--warm);margin-bottom:5px;font-size:12.5px;font-weight:650}
  .urow > span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .urow .w{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink-2);flex-shrink:0;white-space:nowrap}
  .urow .w button{width:22px;height:22px;border-radius:6px;background:var(--raised);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);padding:0}
  .prev{display:grid;gap:3px;margin-top:4px}
  .prev i{height:22px;border-radius:6px;background:var(--ss-s);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:10px;font-weight:800;color:var(--ss);white-space:nowrap;overflow:hidden;padding:0 4px}
  .prev i.w{background:transparent;border:1.5px dashed var(--ss-line)}
  .tg2{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:650;padding:4px 0;cursor:pointer;border:0;background:none;text-align:left;width:100%}
  .tg2 .sw{width:34px;height:20px;border-radius:12px;background:var(--warm-2);position:relative;flex-shrink:0;transition:background .15s}
  .tg2 .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
  .tg2 .sw.on{background:var(--ss)}
  .tg2 .sw.on::after{left:16px}
  .tg2 small{display:block;font-size:11.5px;color:var(--muted);font-weight:550}
  .dr-f{display:flex;align-items:center;gap:8px;padding:16px 26px;border-top:1px solid var(--line)}

  /* ── resources ── */
  .seg-tabs{display:inline-flex;gap:2px;padding:4px;background:var(--warm-2);border-radius:13px;flex-wrap:wrap}
  .seg-tabs button{padding:8px 14px;border-radius:10px;font:650 13px var(--b2-sans);color:var(--muted);white-space:nowrap;border:0;background:transparent}
  .seg-tabs button.on{background:var(--raised);color:var(--ink);box-shadow:0 1px 3px rgba(60,50,30,.1)}
  .seg-tabs button small{font-size:11px;color:var(--faint);margin-left:5px;font-weight:700}
  .seg-tabs.sm button{padding:6px 12px;font-size:12.5px}
  .rbar{display:flex;align-items:center;gap:14px}
  .addbox{margin-left:auto;position:relative;display:flex;align-items:center;gap:9px;height:42px;width:430px;min-width:260px;padding:0 15px;border-radius:13px;border:1px solid var(--line);background:var(--raised);box-shadow:var(--shadow)}
  .addbox:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
  .addbox svg{width:16px;height:16px;stroke:var(--accent-deep);fill:none;stroke-width:2.2;stroke-linecap:round;flex-shrink:0}
  .addbox input{border:0;outline:none;background:transparent;font:600 13.5px var(--b2-sans);flex:1;min-width:0;color:var(--ink)}
  .addbox input::placeholder{color:var(--faint)}
  .addbox .hintx{font-size:11px;color:var(--muted);font-weight:650;white-space:nowrap}
  .addsug{position:absolute;top:48px;left:0;right:0;background:var(--raised);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(60,50,30,.14);padding:6px;z-index:30}
  .addsug button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;border:0;background:none;text-align:left;font:650 13px var(--b2-sans)}
  .addsug button:hover{background:var(--accent-soft);color:var(--accent-deep)}
  .addsug small{color:var(--muted);font-weight:600;margin-left:auto}
  .fbar{display:flex;align-items:center;gap:10px;margin-top:14px}
  .fbar .lbl{font-size:11px;font-weight:750;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
  .cats2{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
  .cats2 button{display:inline-flex;align-items:center;gap:6px;font:650 12px var(--b2-sans);padding:5px 11px;border-radius:20px;border:1px solid var(--line);color:var(--ink-2);background:transparent;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
  .cats2 button i{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .cats2 button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .fbar .seg-tabs{margin-left:auto;flex-shrink:0;flex-wrap:nowrap}
  .rtag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--ink-2);background:var(--warm);border-radius:20px;padding:3px 9px 3px 7px;margin-top:7px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .rtag i{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .now{display:flex;gap:18px;align-items:flex-start}
  .now .nt{font-family:var(--b2-serif);font-size:19px;font-weight:600;letter-spacing:-.2px;margin-top:5px;line-height:1.2}
  .np{display:flex;justify-content:space-between;font-size:12px;font-weight:650;color:var(--muted);margin-top:6px}
  .np span:first-child{color:var(--ink)}
  .nb{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  .kst{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
  .kst div{background:var(--warm);border-radius:12px;padding:10px 12px}
  .kst b{display:block;font-family:var(--b2-serif);font-size:22px;font-weight:600;line-height:1}
  .kst span{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
  .byk{display:grid;grid-template-columns:150px minmax(0,1fr) 18px;gap:10px;align-items:center;font-size:12px;font-weight:650;padding:4px 0}
  .byk span:first-child{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .byk span:first-child i{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .byk b{font-size:12px;text-align:right}
  .shelf-h{display:flex;align-items:flex-end;justify-content:space-between;margin:34px 0 14px}
  .st-t{font-family:var(--b2-serif);font-size:24px;font-weight:600;letter-spacing:-.4px}

/* ════════════ UTILITIES ════════════ */
var U=(function(){
  var MS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  function wd(s){return valid(s)?DS[dow(s)]:'';}

  function dnum(s){return valid(s)?parse(s).getDate():'';}

  function ring(p,col,sz){sz=sz||56;var r=sz/2-6,C=2*Math.PI*r;p=Math.max(0,Math.min(100,Math.round(p||0)));
    return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 '+sz+' '+sz+'" aria-label="'+p+'%" style="flex-shrink:0"><circle cx="'+sz/2+'" cy="'+sz/2+'" r="'+r+'" fill="none" stroke="var(--warm-2)" stroke-width="7"/>'+
      '<circle cx="'+sz/2+'" cy="'+sz/2+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C*(1-p/100)+'" transform="rotate(-90 '+sz/2+' '+sz/2+')"/>'+

/* ════════════ SEASONS (learnSeasons1) ════════════ */
var SEA=(function(){
  var KEY='learnSeasons1', list=[], sel=null;
  var KN={winter:'Winter',spring:'Spring',summer:'Summer',fall:'Fall'};
  /* default academic-style boundaries; editable via "Edit season dates" */
  function def(d){
    var y=+d.slice(0,4), m=d.slice(5), k, s, e, yl=y;
    if(m>='12-13'){k='winter';s=y+'-12-13';e=(y+1)+'-03-21';yl=y+1;}
    else if(m<='03-21'){k='winter';s=(y-1)+'-12-13';e=y+'-03-21';}
    else if(m<='06-13'){k='spring';s=y+'-03-22';e=y+'-06-13';}
    else if(m<='08-23'){k='summer';s=y+'-06-14';e=y+'-08-23';}
    else{k='fall';s=y+'-08-24';e=y+'-12-12';}
    return {id:k+'-'+yl,name:KN[k]+' '+yl,kind:k,start:s,end:e,focus:''};
  }
  function ok(s){return s&&s.id&&U.valid(s.start)&&U.valid(s.end)&&s.start<=s.end;}
  function sort(){list.sort(function(x,y){return x.start.localeCompare(y.start);});}
  function save(){U.lsSet(KEY,list);}
  function load(){
    var l=U.lsGet(KEY);
    if(Array.isArray(l)&&l.filter(ok).length){list=l.filter(ok);list.forEach(function(s){if(!s.name)s.name=(KN[s.kind]||'Season')+' '+s.end.slice(0,4);if(typeof s.focus!=='string')s.focus='';});}
    else{
      var c=def(U.today()), p1=def(U.add(c.start,-1)), p2=def(U.add(p1.start,-1)), n1=def(U.add(c.end,1));
      list=[p2,p1,c,n1];save();
    }
    sort();sel=current().id;
  }
  function of(d){if(!U.valid(d))return null;for(var i=0;i<list.length;i++){if(list[i].start<=d&&d<=list[i].end)return list[i];}return null;}
  /* make sure a season exists for a date that belongs to an item (fills gaps with default ranges) */
  function ensure(d){
    if(!U.valid(d))return null;var f=of(d);if(f)return f;
    var n=def(d);
    list.forEach(function(s){if(s.start<=n.end&&s.end>=n.start){if(s.end<d){if(s.end>=n.start)n.start=U.add(s.end,1);}else if(s.start>d){if(s.start<=n.end)n.end=U.add(s.start,-1);}}});
    if(!(n.start<=d&&d<=n.end))return null;
    if(list.some(function(s){return s.id===n.id;}))n.id=n.id+'-'+U.uid();
    list.push(n);sort();save();return n;
  }
  function current(){var t=U.today();return of(t)||ensure(t)||list[list.length-1];}
  function get(id){for(var i=0;i<list.length;i++){if(list[i].id===id)return list[i];}return null;}
  function selected(){return get(sel)||current();}
  function shortName(s){var m=/^(\S+)\s+(\d{4})$/.exec(s.name||'');return m?m[1]+' ’'+m[2].slice(2):(s.name||'');}
  function weeks(s){return Math.max(1,Math.ceil((U.diff(s.start,s.end)+1)/7));}
  function weekNo(s,d){return Math.min(weeks(s),Math.max(1,Math.floor(U.diff(s.start,d)/7)+1));}
  function status(s){var t=U.today();return t<s.start?'future':t>s.end?'past':'now';}
  function isCurrent(s){return s&&s.id===current().id;}
  function select(id){if(!get(id))return;sel=id;CL.seasonChanged();CO.seasonChanged();SS.seasonChanged();APP.render();}
  function options(selId,autoLabel){
    var h='<option value="">'+U.esc(autoLabel||'Automatic')+'</option>';
    list.slice().reverse().forEach(function(s){h+='<option value="'+U.esc(s.id)+'"'+(s.id===selId?' selected':'')+'>'+U.esc(s.name)+' · '+U.esc(U.range(s.start,s.end))+'</option>';});
    return h;
  }
  /* ── switcher (overview) ── */
  function switcherHtml(){
    var idx=list.indexOf(selected()), from=Math.max(0,Math.min(idx-2,list.length-5)), view=list.slice(from,from+5), cur=current();
    return '<div class="sea" role="tablist" aria-label="Seasons">'+view.map(function(s){
      var st=status(s);
      return '<button class="'+(s.id===sel?'on ':'')+(st==='future'?'fut ':'')+(s.id===cur.id?'now':'')+'" onclick="SEA.select('+U.a(s.id)+')" title="'+U.esc(s.name)+'"><b>'+U.esc(shortName(s))+'</b><small>'+U.esc(U.range(s.start,s.end))+'</small></button>';
    }).join('')+'</div>';
  }
  /* ── edit dates modal ── */
  var draft=[];
  function rowHtml(s,i){
    return '<div class="sea-item"><div class="sea-row">'+
      '<input class="inp" data-k="name" data-i="'+i+'" value="'+U.esc(s.name)+'" aria-label="Season name">'+
      '<select class="inp" data-k="kind" data-i="'+i+'">'+['fall','winter','spring','summer'].map(function(k){return '<option value="'+k+'"'+(s.kind===k?' selected':'')+'>'+KN[k]+'</option>';}).join('')+'</select>'+
      '<input class="inp" type="date" data-k="start" data-i="'+i+'" value="'+U.esc(s.start)+'" aria-label="Starts">'+
      '<input class="inp" type="date" data-k="end" data-i="'+i+'" value="'+U.esc(s.end)+'" aria-label="Ends">'+
      '<button class="tx" style="opacity:1" title="Remove season" onclick="SEA.removeRow('+i+')">✕</button>'+
      '<textarea class="inp" data-k="focus" data-i="'+i+'" placeholder="This season I’m focusing on… (optional)">'+U.esc(s.focus||'')+'</textarea>'+
    '</div></div>';
  }
  function readRows(){document.querySelectorAll('#seaRows [data-k]').forEach(function(el){var d=draft[+el.dataset.i];if(d)d[el.dataset.k]=el.value;});}
  function drawRows(){document.getElementById('seaRows').innerHTML=draft.map(rowHtml).join('');}
  function openEdit(){draft=list.map(function(s){return Object.assign({},s);}).reverse();drawRows();APP.openModal('seasonModal');}
  function addRow(){readRows();var top=draft.slice().sort(function(x,y){return y.end.localeCompare(x.end);})[0];var n=top?def(U.add(top.end,1)):def(U.today());if(top&&n.start<=top.end)n.start=U.add(top.end,1);draft.unshift(n);drawRows();}
  function removeRow(i){readRows();draft.splice(i,1);drawRows();}
  function saveRows(){
    readRows();
    for(var i=0;i<draft.length;i++){var d=draft[i];if(!U.valid(d.start)||!U.valid(d.end)||d.start>d.end){alert('Each season needs a start date before its end date.');return;}if(!d.name.trim())d.name=KN[d.kind]+' '+d.end.slice(0,4);}
    if(!draft.length){alert('Keep at least one season.');return;}
    list=draft.map(function(d){return {id:d.id||U.uid('s'),name:d.name.trim(),kind:d.kind,start:d.start,end:d.end,focus:(d.focus||'').trim()};});
    sort();save();if(!get(sel))sel=current().id;APP.closeModal('seasonModal');APP.render();U.toast('Season dates saved');
  }
  function editFocus(){
    var s=selected();
    FORM.open({title:'This season I’m focusing on',sub:s.name+' · '+U.range(s.start,s.end),fields:[{name:'focus',type:'textarea',label:'Focus',value:s.focus||'',placeholder:'A sentence or two about what matters this season'}],
      onSave:function(v){s.focus=v.focus.trim();save();APP.render();}});
  }
  return {load:load,of:of,ensure:ensure,current:current,get:get,selected:selected,shortName:shortName,weeks:weeks,weekNo:weekNo,status:status,isCurrent:isCurrent,select:select,options:options,
    switcherHtml:switcherHtml,openEdit:openEdit,addRow:addRow,removeRow:removeRow,saveRows:saveRows,editFocus:editFocus,all:function(){return list;},save:save};
})();

    document.getElementById('dimmer').className='dim';}

  function search(v){q=v;var l=document.getElementById('sw-list');if(l&&cfg)l.innerHTML=listHtml(openTrack,cfg);}
  function key(e){if(e.key==='Escape'){close();}else if(e.key==='Enter'){var b=document.querySelector('#sw-list .mi2');if(b)b.click();}}
  function exp(k){expanded[k]=!expanded[k];var l=document.getElementById('sw-list');if(l&&cfg)l.innerHTML=listHtml(openTrack,cfg);}
  function pick(id){var t=openTrack;openTrack=null;q='';document.getElementById('dimmer').className='';
    if(t==='formal')CL.setActive(id);else if(t==='online')CO.setActive(id);else if(t==='self')SS.setActive(id);else APP.render();}
  function html(track,o){if(openTrack===track)cfg=o;return render(track,o);}
  document.addEventListener('click',function(e){if(e.target&&e.target.id==='dimmer')close();});
  return {html:html,toggle:toggle,close:close,search:search,key:key,exp:exp,pick:pick,isOpen:function(){return openTrack;}};
})();
</script>

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw){DB=seed();save();}
    else{
      const p=JSON.parse(raw);
      if(Array.isArray(p)){DB={classes:p,active:(p[0]&&p[0].id)||null};}
      else{DB=p||{};}
    }
  }catch(e){DB=seed();save();}
  if(!Array.isArray(DB.classes))DB.classes=[];
  DB.classes.forEach(function(c){
    if(!c.id)c.id=uid();
    if(!Array.isArray(c.modules))c.modules=[];
    if(!Array.isArray(c.grading))c.grading=[];
    if(!Array.isArray(c.links))c.links=[];
    if(!c.color)c.color=PALETTE[0];
    c.modules.forEach(function(m){if(!m.id)m.id=uid();if(!Array.isArray(m.tasks))m.tasks=[];m.tasks.forEach(function(t){if(!t.id)t.id=uid();});});
    var d=c.start||firstDue(c)||c.end;if(d)SEA.ensure(d);
  });
  if(!DB.active||!DB.classes.some(c=>c.id===DB.active))DB.active=(DB.classes[0]&&DB.classes[0].id)||null;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
function activeCls(){return DB.classes.find(c=>c.id===DB.active)}
function firstDue(c){var d='';c.modules.forEach(function(m){if(m.due&&(!d||m.due<d))d=m.due;m.tasks.forEach(function(t){if(t.due&&(!d||t.due<d))d=t.due;});});return d;}
function seasonId(c){
  if(c.seasonId&&SEA.get(c.seasonId))return c.seasonId;
  var d=c.start||firstDue(c)||c.end;var s=d?(SEA.of(d)||SEA.ensure(d)):null;
  return s?s.id:SEA.current().id;
}
function inSeason(c,s){return seasonId(c)===s.id;}
function shortCode(c){return String(c.code||'').split('·')[0].trim();}
function label(c){var sc=shortCode(c);return sc?sc+' · '+c.name:c.name;}
function eff(m,t){return t.due||m.due||'';}
function prog(c){let done=0,total=0;c.modules.forEach(m=>m.tasks.forEach(t=>{total++;if(t.done)done++}));return {done,total,pct:total?Math.round(done/total*100):0};}
function modProg(m){const done=m.tasks.filter(t=>t.done).length;return {done,total:m.tasks.length,full:m.tasks.length>0&&done===m.tasks.length};}
function allTasks(c){var out=[];c.modules.forEach(function(m){m.tasks.forEach(function(t){out.push({c:c,m:m,t:t,due:eff(m,t)});});});return out;}
function sortByDue(arr){return arr.sort(function(x,y){if(!x.due&&!y.due)return 0;if(!x.due)return 1;if(!y.due)return -1;return x.due.localeCompare(y.due);});}
function nextTasks(c){return sortByDue(allTasks(c).filter(function(x){return !x.t.done;}));}
function sortedModules(c){return c.modules.slice().sort(function(x,y){return (x.due||'9999').localeCompare(y.due||'9999');});}
function inSeasonList(s){return DB.classes.filter(function(c){return inSeason(c,s);});}
function seasonChanged(){var s=SEA.selected(), c=activeCls();if(c&&inSeason(c,s))return;var f=inSeasonList(s)[0];if(f){DB.active=f.id;save();}}

/* ── render ── */
function switcher(){
  var s=SEA.selected(), c=activeCls(), n=inSeasonList(s).length;
  var items=DB.classes.map(function(x){var p=prog(x), sid=seasonId(x), se=SEA.get(sid);
    return {id:x.id,label:label(x),sub:[x.inst,p.total?p.pct+'%':''].filter(Boolean).join(' · '),right:p.total?p.pct+'%':'',color:x.color||'var(--fm)',seasonId:sid,seasonName:se?se.name:''};});
  return SW.html('formal',{items:items,current:c?{id:c.id,label:label(c),tag:(SEA.get(seasonId(c))||{}).name||'',color:c.color||'var(--fm)'}:null,
    emptyLabel:'No classes yet',hint:n+' class'+(n===1?'':'es')+' '+(SEA.isCurrent(s)?'this season':'in '+s.name),searchPh:'Search classes…',noneInSeason:'No classes in '+s.name+' yet.',
    noun:'class',nouns:'classes',addLabel:'+ Add a class',addFn:'CL.openClass()',
    right:'<button class="btn sm" onclick="CL.openClass()">+ Add class</button>'+(c?'<button class="btn sm" onclick="window.print()" title="Print or save as PDF">PDF</button>':'')});
}
function weekItems(c){
  var t=U.today(), end=U.add(t,6);
  return sortByDue(allTasks(c).filter(function(x){if(!x.due)return false;if(x.t.done)return x.due>=t&&x.due<=end;return x.due<=end;}))
    .filter(function(x){return x.t.done||x.due>=U.add(t,-60);});
}
function taskRowWeek(x){
  var late=!x.t.done&&x.due<U.today();
  return '<div class="tk'+(x.t.done?' done':'')+'"><button class="check'+(x.t.done?' on':'')+'" aria-label="Done" onclick="CL.toggleTask('+A(x.m.id)+','+A(x.t.id)+')">'+(x.t.done?'✓':'')+'</button>'+
    '<span class="t">'+esc(x.t.label)+'<small>'+esc(x.m.title)+' · '+(late?'was due ':'')+esc(U.wmd(x.due))+'</small></span>'+(x.t.done?'':U.dueChip(x.due))+'</div>';
}
function subTask(m,t){
  var d=t.due;
  var chip=d?(t.done?U.due(U.md(d),'plain'):U.dateChip(d)):'<span class="due add">＋ date</span>';
  return '<div class="sub-t'+(t.done?' done':'')+'"><button class="check'+(t.done?' on':'')+'" aria-label="Done" onclick="CL.toggleTask('+A(m.id)+','+A(t.id)+')">'+(t.done?'✓':'')+'</button>'+
    '<span class="t" onclick="CL.toggleTask('+A(m.id)+','+A(t.id)+')">'+esc(t.label)+'</span>'+
    '<span class="dpk" title="Due date" onclick="U.pickDate(this)">'+chip+'<input type="date" value="'+esc(d||'')+'" onchange="CL.setTaskDue('+A(m.id)+','+A(t.id)+',this.value)" aria-label="Due date"></span>'+
    '<button class="tx" title="Remove task" onclick="CL.delTask('+A(m.id)+','+A(t.id)+')">✕</button></div>';
}
function modRow(m,open,chev){
  var p=modProg(m), late=!p.full&&m.due&&m.due<U.today(), pct=p.total?p.done/p.total*100:0;
  var dd=p.full?U.due('done','plain'):late?U.due('late','over'):m.due?U.dateChip(m.due):'';
  return '<div class="mrow'+(p.full?' done':'')+'" onclick="CL.toggleMod('+A(m.id)+')" role="button" aria-expanded="'+!!open+'"><span class="chev">'+(chev||(open?'⌄':'›'))+'</span>'+
    '<span class="t">'+esc(m.title)+(m.short?'<small>'+esc(m.short)+'</small>':'')+'</span><span class="bar"><i style="width:'+pct+'%"></i></span><span class="x">'+p.done+'/'+p.total+'</span><span class="dd">'+dd+'</span></div>';
}
function modulesHtml(c){
  var mods=sortedModules(c), done=mods.filter(function(m){return modProg(m).full;}), rest=mods.filter(function(m){return !modProg(m).full;});
  var firstOpen=rest[0]?rest[0].id:null;
  if(openMods.__cls!==c.id){openMods={__cls:c.id};if(firstOpen)openMods[firstOpen]=true;}
  var h='';
  if(done.length>1&&!showDone){
    var tt=done.reduce(function(s,m){return s+m.tasks.length;},0);
    h+='<div class="mrow done" onclick="CL.toggleShowDone()" role="button"><span class="chev">✓</span><span class="t">'+done.length+' completed<small>'+esc(done.map(function(m){return m.title;}).join(' · '))+'</small></span><span class="bar"><i style="width:100%"></i></span><span class="x">'+tt+'/'+tt+'</span><span class="dd">'+U.due('done','plain')+'</span></div>';
  }
  var list=(done.length>1&&!showDone)?rest:mods;
  list.forEach(function(m){
    var open=!!openMods[m.id];
    if(!open){h+=modRow(m,false);return;}
    h+='<div class="mopen">'+modRow(m,true)+
      '<div class="obj"><span>'+(m.objective?esc(m.objective):'')+'</span><button class="btn sm" onclick="CL.openModule('+A(m.id)+')">Edit module</button></div>'+
      m.tasks.slice().sort(function(x,y){return (x.due||'9').localeCompare(y.due||'9');}).map(function(t){return subTask(m,t);}).join('')+
      '<div class="addt"><b>+</b><input id="nt-'+esc(m.id)+'" placeholder="Add a task…" onkeydown="if(event.key===\'Enter\')CL.addTask('+A(m.id)+')" aria-label="New task"><input type="date" id="ntd-'+esc(m.id)+'" title="Optional due date" aria-label="Due date"><button class="btn sm" onclick="CL.addTask('+A(m.id)+')">Add</button></div>'+
    '</div>';
  });
  if(done.length>1&&showDone)h+='<div style="padding-top:8px"><button class="more" onclick="CL.toggleShowDone()">Fold completed modules</button></div>';
  return h||'<div class="soft-empty">No modules yet — add one from the syllabus.</div>';
}
function render(){
  var host=document.getElementById('tab-formal');
  var c=activeCls();
  if(!c){host.innerHTML=switcher()+'<div class="empty"><h3>No classes yet</h3><p>Add a class with its syllabus to track modules, due dates and grade weighting.</p><button class="btn primary" onclick="CL.openClass()">+ Add class</button></div>';return;}
  var p=prog(c), mods=sortedModules(c), mdone=mods.filter(function(m){return modProg(m).full;}).length;
  var wk=weekItems(c), wkDone=wk.filter(function(x){return x.t.done;}).length;
  var meta=[];
  if(c.instr)meta.push('<span><b>Prof.</b>'+esc(c.instr)+'</span>');
  if(c.format)meta.push('<span><b>Format</b>'+esc(c.format)+'</span>');
  if(c.units)meta.push('<span><b>Units</b>'+esc(c.units)+'</span>');
  if(c.start||c.end)meta.push('<span><b>Dates</b>'+esc(U.range(c.start,c.end))+'</span>');
  if(c.inst)meta.push('<span><b>School</b>'+esc(c.inst)+'</span>');
  var eb=['Formal class'].concat(String(c.code||'').split('·').map(function(x){return x.trim();}).filter(Boolean)).join(' · ');
  /* pace vs. the term */
  var termPct=null;if(U.valid(c.start)&&U.valid(c.end)&&c.end>c.start){termPct=Math.max(0,Math.min(100,Math.round(U.diff(c.start,U.today())/U.diff(c.start,c.end)*100)));}
  var pace=termPct==null?'':termPct>=100?'Term finished':(p.pct>=termPct-8?'On pace':'A little behind')+' · term is '+termPct+'% through';
  var wkLbl='';if(U.valid(c.start)&&U.valid(c.end)){var tw=Math.max(1,Math.ceil((U.diff(c.start,c.end)+1)/7));var cw=Math.floor(U.diff(c.start,U.today())/7)+1;wkLbl=cw<1?'Starts '+U.md(c.start):cw>tw?tw+' weeks · done':'Week '+cw+' of '+tw;}
  var maxG=Math.max.apply(null,(c.grading||[]).map(function(g){return +g.pct||0;}).concat([1]));
  var totalG=(c.grading||[]).reduce(function(s,g){return s+(+g.pct||0);},0);
  var gradeHtml=(c.grading||[]).map(function(g){return '<div class="gw"><span>'+esc(g.label)+(g.note?'<small>'+esc(g.note)+'</small>':'')+'</span><span class="bar"><i style="width:'+((+g.pct||0)/maxG*100)+'%"></i></span><span class="p">'+esc(g.pct)+'%</span></div>';}).join('')||'<div class="soft-empty">Add the grade breakdown from the syllabus.</div>';
  var linksHtml=(c.links||[]).map(function(l,i){var u=U.safeUrl(l.url);return '<a class="tool" href="'+esc(u||'#')+'" target="_blank" rel="noopener"><span class="av" style="background:'+LINKC[i%LINKC.length]+'">'+esc((l.label||'?').trim().charAt(0).toUpperCase())+'</span><span class="lt">'+esc(l.label)+'</span><span class="ar">↗</span><button class="tx" title="Remove link" onclick="event.preventDefault();event.stopPropagation();CL.delLink('+i+')">✕</button></a>';}).join('');
  host.innerHTML=switcher()+
    '<div class="print-stamp">'+esc(label(c))+' — printed '+esc(U.longDate(U.today()))+'</div>'+
    '<section class="card ch"><div style="min-width:0"><div class="eb">'+esc(eb)+'</div><h2>'+esc(c.name)+'</h2><div class="meta">'+meta.join('')+'</div></div>'+
      '<div class="side">'+(c.email?'<a class="btn sm" href="mailto:'+esc(c.email)+'">✉ Email prof</a>':'')+'<button class="btn sm" onclick="CL.openClass('+A(c.id)+')">Edit</button></div></section>'+
    '<div class="grid">'+
      '<div class="s7 stack">'+
        '<section class="card"><div class="card-h"><div><div class="card-t">This week</div><div class="card-m" style="margin-top:3px">'+esc(U.range(U.today(),U.add(U.today(),6)))+'</div></div>'+(wk.length?'<span class="chip">'+wkDone+' of '+wk.length+' done</span>':'')+'</div>'+
          (wk.length?wk.map(taskRowWeek).join(''):'<div class="soft-empty">Nothing due in the next 7 days.</div>')+'</section>'+
        '<section class="card"><div class="card-h"><div class="card-t">Modules</div><div style="display:flex;gap:10px;align-items:center"><span class="card-m">'+mdone+' of '+mods.length+' complete</span><button class="btn sm soft" onclick="CL.openModule()">+ Module</button></div></div>'+
          modulesHtml(c)+'</section>'+

          (mods.length?'<div class="segs">'+mods.map(function(m){var q=modProg(m),f=q.total?q.done/q.total:0;return '<i title="'+esc(m.title)+'" style="background:'+(f>=1?'#c9b6ee':f>0?'linear-gradient(90deg,#c9b6ee '+f*100+'%,var(--warm-2) 0)':'')+'"></i>';}).join('')+'</div>':'')+
        '</section>'+
        '<section class="card"><div class="card-h"><div class="card-t">Grade weighting</div><div style="display:flex;gap:10px;align-items:center">'+(totalG?'<span class="card-m">'+totalG+'%</span>':'')+'<button class="more" onclick="CL.editGrading()">Edit</button></div></div>'+gradeHtml+(c.scale?'<div class="scale">'+esc(c.scale)+'</div>':'')+'</section>'+

        '<section class="card"><div class="card-h"><div class="card-t">Notes</div><button class="more" onclick="CL.editNotes()">'+(editingNotes?'Done':'Edit')+'</button></div>'+

          '<div class="notes-print">'+esc(c.notes||'')+'</div></section>'+
      '</div>'+
    '</div>';
}

/* ── actions ── */
function findMT(mid,tid,c){c=c||activeCls();var m=c&&c.modules.find(x=>x.id===mid);return {c:c,m:m,t:m&&m.tasks.find(x=>x.id===tid)};}
function setActive(id){DB.active=id;openMods={};showDone=false;editingNotes=false;save();APP.render();}
function toggleTask(mid,tid,cid){var c=cid?DB.classes.find(x=>x.id===cid):activeCls();var r=findMT(mid,tid,c);if(!r.t)return;r.t.done=!r.t.done;save();APP.render();}
function addTask(mid){const inp=document.getElementById('nt-'+mid);const v=inp?inp.value.trim():'';if(!v)return;const dd=document.getElementById('ntd-'+mid);const due=dd?dd.value:'';const c=activeCls();c.modules.find(x=>x.id===mid).tasks.push({id:uid(),label:v,done:false,due});save();APP.render();var n=document.getElementById('nt-'+mid);if(n)n.focus();}

function courseFrac(c){return c.modules.length?(c.modules.filter(function(m){return m.done;}).length/c.modules.length):(c.done?1:0);}
function isFlat(p){return p.courses.length<=1;}
function stats(p){
  var mt=0,md=0;p.courses.forEach(function(c){mt+=c.modules.length;md+=c.modules.filter(function(m){return m.done;}).length;});
  if(isFlat(p)){
    const c=p.courses[0];
    if(!c)return {pct:0,dn:0,tt:0,unit:'modules',md:0,mt:0};
    if(c.modules.length){return {pct:Math.round(md/mt*100),dn:md,tt:mt,unit:'modules',md:md,mt:mt};}
    return {pct:c.done?100:Math.round(c.pct||0),dn:c.done?1:0,tt:1,unit:'course',md:0,mt:0};
  }
  const fr=p.courses.map(courseFrac);
  const pct=Math.round(fr.reduce(function(a,b){return a+b;},0)/fr.length*100);
  return {pct:pct,dn:p.courses.filter(courseComplete).length,tt:p.courses.length,unit:'courses',md:md,mt:mt};
}
function complete(p){var s=stats(p);return s.tt>0&&s.pct>=100;}

function cursor(p){

}

  var up;
  if(k){var c=p.courses[k.ci];
    var sub=isFlat(p)?(k.mi>=0?'module '+(k.mi+1)+' of '+c.modules.length:''):('Course '+(k.ci+1)+' · '+c.name+(k.mi>=0?' · module '+(k.mi+1)+' of '+c.modules.length:''));
    var openUrl=U.safeUrl(c.link||p.url);
    up='<div class="upn"><span class="ic">▶</span><div style="min-width:0"><div class="tt">'+esc(nx)+'</div><div class="ss">'+esc(sub)+'</div></div><div class="acts">'+(openUrl?'<a class="btn sm" href="'+esc(openUrl)+'" target="_blank" rel="noopener">Open ↗</a>':'')+'<button class="btn sm primary" onclick="CO.markNext()">Mark done ✓</button></div></div>';
  }else if(s.tt){up='<div class="soft-empty" style="color:var(--ok)">✓ Everything complete — nice work.</div>';}
  else{up='<div class="soft-empty">Nothing tracked yet — add the courses or modules below.</div>';}
  /* pace — calm, never "overdue" */
  var remaining=s.mt?s.mt-s.md:(s.tt-s.dn), unitW=s.mt?'module':'course', paceH='';
  if(p.targetDate&&remaining>0){
    var dl=U.diff(U.today(),p.targetDate);
    var need=dl>0?remaining/Math.max(1,dl/7):remaining;
    var needTxt=dl>0?'~'+(Math.round(need*2)/2)+' '+unitW+(need>1?'s':'')+' a week':'a gentle new goal date might help';
    var recent=0;p.courses.forEach(function(c){c.modules.forEach(function(m){if(m.done&&m.doneOn&&U.diff(m.doneOn,U.today())<28)recent++;});});
    paceH='<div class="pace"><div><span>To make '+esc(U.md(p.targetDate))+'</span><b>'+esc(needTxt)+'</b></div>'+
      (s.mt?'<div><span>Last 4 weeks</span><b>'+(Math.round(recent/4*10)/10)+' a week'+(dl>0?(recent/4>=need?' · on track':' · a bit more would do it'):'')+'</b></div>':'')+'</div>';
  }else if(remaining>0){paceH='<div class="pace"><div><span>Left to go</span><b>'+remaining+' '+unitW+(remaining===1?'':'s')+'</b></div><div><span>Goal date</span><b><button class="more" onclick="CO.openEditModal('+A(p.id)+')">Set one</button></b></div></div>';}
  var linksHtml=(p.links||[]).map(function(l,i){var u=U.safeUrl(l.url);return '<a class="tool" href="'+esc(u||'#')+'" target="_blank" rel="noopener"><span class="av" style="background:'+LINKC[i%LINKC.length]+'">'+esc((l.label||'?').trim().charAt(0).toUpperCase())+'</span><span class="lt">'+esc(l.label)+'</span><span class="ar">↗</span><button class="tx" title="Remove link" onclick="event.preventDefault();event.stopPropagation();CO.delLink('+i+')">✕</button></a>';}).join('');
  var goal=p.targetDate?('goal '+U.md(p.targetDate)+(U.diff(U.today(),p.targetDate)>0?' · '+U.diff(U.today(),p.targetDate)+' days':'')):'';
  host.innerHTML=switcher()+
    '<div class="print-stamp">'+esc(p.name)+' — printed '+esc(U.longDate(U.today()))+'</div>'+
    '<section class="card ch"><div style="min-width:0"><div class="eb" style="color:var(--on)">'+esc(eb)+'</div><h2>'+esc(p.name)+'</h2><div class="meta">'+meta.join('')+'</div></div>'+
      '<div class="side">'+(p.url?'<a class="btn sm primary" href="'+esc(U.safeUrl(p.url))+'" target="_blank" rel="noopener">Open course ↗</a>':'')+'<button class="btn sm" onclick="CO.openEditModal('+A(p.id)+')">Edit</button></div></section>'+
    '<div class="grid">'+
      '<div class="s7 stack">'+
        '<section class="card"><div class="card-h"><div class="card-t">Up next</div><span class="card-m">picks up where you left off</span></div>'+up+'</section>'+
        '<section class="card"><div class="card-h"><div class="card-t">'+(isFlat(p)?'Modules':'Courses')+'</div><div style="display:flex;gap:10px;align-items:center"><span class="card-m">'+s.dn+' of '+s.tt+' complete</span>'+(isFlat(p)?'':'<button class="btn sm soft" onclick="CO.addCourse()">+ Course</button>')+'</div></div>'+coursesHtml(p)+'</section>'+
      '</div>'+
      '<div class="s5 stack">'+
        '<section class="card"><div class="card-h"><div class="card-t">Progress</div><span class="card-m">'+esc(goal)+'</span></div>'+
          '<div class="ringwrap">'+U.ring(s.pct,TR.online.hex,92)+'<div><div class="big2">'+s.dn+' <small>of '+s.tt+' '+s.unit+'</small></div>'+(s.mt&&!isFlat(p)?'<div class="card-m" style="margin-top:6px">'+s.md+' of '+s.mt+' modules done</div>':'')+'</div></div>'+paceH+'</section>'+
        '<section class="card"><div class="card-h"><div class="card-t">Why I’m taking it</div><button class="more" onclick="CO.editWhy()">Edit</button></div>'+(p.purpose?'<div class="notes" style="font-weight:550;line-height:1.55">'+esc(p.purpose)+'</div>':'<div class="soft-empty">What it’s for and what you want out of it.</div>')+'</section>'+
        '<section class="card"><div class="card-h"><div class="card-t">Links</div><button class="more" onclick="CO.addLink()">+ Add link</button></div>'+(linksHtml?'<div class="tools">'+linksHtml+'</div>':'<div class="soft-empty">Course home, your notebook, the forum…</div>')+'</section>'+
        '<section class="card"><div class="card-h"><div class="card-t">Notes</div><button class="more" onclick="CO.editNotes()">'+(editingNotes?'Done':'Edit')+'</button></div>'+
          (editingNotes?'<textarea class="notes-ed" id="co-notes" placeholder="What to focus on, where you left off…" onchange="CO.saveNotes(this.value)">'+esc(p.notes)+'</textarea>':'<div class="notes notes-screen">'+(U.bullets(p.notes)||'<div class="soft-empty" style="padding:0">What to focus on, where you left off…</div>')+'</div>')+
          '<div class="notes-print">'+esc(p.notes||'')+'</div></section>'+
      '</div>'+
    '</div>';
}
function cur(){return getById(activeId);}
function done(m,v){m.done=v;if(v)m.doneOn=U.today();else delete m.doneOn;}
function markNext(pid){
  var p=pid?getById(pid):cur();if(!p)return;var k=cursor(p);if(!k)return;var c=p.courses[k.ci];
  if(k.mi>=0)done(c.modules[k.mi],true);else{c.done=true;c.doneOn=U.today();}
  saveData();APP.render();
}
var api={
  load:loadData,render:render,seasonChanged:seasonChanged,inSeason:inSeason,inSeasonList:inSeasonList,seasonId:seasonId,stats:stats,nextLabel:nextLabel,cursor:cursor,complete:complete,
  all:function(){return programs;},get:getById,markNext:markNext,
  setActive:function(id){activeId=id;openCourse={};editingNotes=false;APP.render();},
  toggleExpand:function(cid){openCourse[cid]=!openCourse[cid];APP.render();},
  toggleCourse:function(ci){const p=cur();if(!p||!p.courses[ci])return;const c=p.courses[ci];if(c.modules.length){const all=c.modules.every(function(m){return m.done;});c.modules.forEach(function(m){done(m,!all);});}else{c.done=!c.done;}saveData();APP.render();},
  toggleModule:function(ci,mi){const p=cur();if(!p||!p.courses[ci]||!p.courses[ci].modules[mi])return;var m=p.courses[ci].modules[mi];done(m,!m.done);saveData();APP.render();},
  addModule:function(ci){const p=cur();if(!p)return;if(!p.courses[ci])p.courses[ci]={cid:cuid(),name:p.name,link:'',done:false,modules:[]};const inp=document.getElementById('co-newmod-'+ci);const name=inp?inp.value.trim():'';if(!name)return;p.courses[ci].modules.push({id:cuid(),name:name,done:false});saveData();APP.render();const fresh=document.getElementById('co-newmod-'+ci);if(fresh)fresh.focus();},
  delModule:function(ci,mi){const p=cur();if(!p||!p.courses[ci])return;p.courses[ci].modules.splice(mi,1);saveData();APP.render();},
  addCourse:function(){const p=cur();if(!p)return;FORM.open({title:'Add a course',sub:p.name,fields:[{name:'name',label:'Course name',placeholder:'Course name'},{name:'link',label:'Link',opt:'optional',placeholder:'https://…'}],
    onSave:function(v){if(!v.name.trim())return false;p.courses.push({cid:cuid(),name:v.name.trim(),link:U.safeUrl(v.link),done:false,modules:[]});saveData();APP.render();}});},
  delCourse:function(ci){const p=cur();if(!p)return;if(!confirm('Remove this course and its modules?'))return;p.courses.splice(ci,1);saveData();APP.render();},
  editCourseLink:function(ci){const p=cur();if(!p||!p.courses[ci])return;var c=p.courses[ci];FORM.open({title:'Course details',fields:[{name:'name',label:'Name',value:c.name},{name:'link',label:'Link (course page or study notes)',value:c.link||'',placeholder:'https://…'}],
    onSave:function(v){if(v.name.trim())c.name=v.name.trim();c.link=U.safeUrl(v.link);saveData();APP.render();}});},
  addLink:function(){const p=cur();if(!p)return;FORM.open({title:'Add a link',fields:[{name:'label',label:'Label',placeholder:'e.g. Course home'},{name:'url',label:'URL',placeholder:'https://…'}],
    onSave:function(v){if(!v.label.trim())return false;p.links.push({label:v.label.trim(),url:U.safeUrl(v.url)});saveData();APP.render();}});},
  delLink:function(i){const p=cur();if(!p)return;p.links.splice(i,1);saveData();APP.render();},
  editWhy:function(){const p=cur();if(!p)return;FORM.open({title:'Why I’m taking it',fields:[{name:'why',type:'textarea',label:'Purpose',value:p.purpose||'',placeholder:'What it’s for, what you want out of it…'}],onSave:function(v){p.purpose=v.why.trim();saveData();APP.render();}});},
  editNotes:function(){if(editingNotes){var n=document.getElementById('co-notes');if(n)api.saveNotes(n.value);}editingNotes=!editingNotes;APP.render();if(editingNotes){var x=document.getElementById('co-notes');if(x)x.focus();}},
  saveNotes:function(v){const p=cur();if(p){p.notes=v;saveData();}},
  openAddModal:function(){
    editingId=null;var g=function(i){return document.getElementById(i);};
    g('pmTitle').textContent='Add an online course';g('pm-save').textContent='Add course';
    ['pm-name','pm-platform','pm-url','pm-purpose','pm-notes','pm-first-course','pm-target','pm-start'].forEach(function(id){g(id).value='';});
    g('pm-status').value='active';g('pm-category').value='Data & Analytics';g('pm-season').innerHTML=SEA.options('','Automatic');
    g('pm-first-course-wrap').style.display='block';g('pm-delete').style.display='none';
    APP.openModal('progModal');setTimeout(function(){g('pm-name').focus();},60);
  },
  openEditModal:function(id){
    const p=getById(id);if(!p)return;editingId=id;var g=function(i){return document.getElementById(i);};
    g('pmTitle').textContent='Edit online course';g('pm-save').textContent='Save changes';
    g('pm-name').value=p.name;g('pm-platform').value=p.platform;g('pm-category').value=p.category;g('pm-status').value=p.status||'active';
    g('pm-target').value=p.targetDate||'';g('pm-start').value=p.startDate||'';g('pm-url').value=p.url||'';g('pm-purpose').value=p.purpose||'';g('pm-notes').value=p.notes||'';
    g('pm-season').innerHTML=SEA.options(p.seasonId||'','Automatic');
    g('pm-first-course-wrap').style.display='none';g('pm-delete').style.display='inline-flex';
    APP.openModal('progModal');
  },
  saveProgram:function(){
    var g=function(i){return document.getElementById(i);};
    const name=g('pm-name').value.trim();if(!name){g('pm-name').focus();return;}
    var f={name:name,platform:g('pm-platform').value.trim(),category:g('pm-category').value,status:g('pm-status').value,targetDate:g('pm-target').value,
      startDate:g('pm-start').value,url:U.safeUrl(g('pm-url').value),purpose:g('pm-purpose').value.trim(),notes:g('pm-notes').value.trim()};
    var sid=g('pm-season').value, p;
    if(editingId){p=getById(editingId);Object.assign(p,f);}
    else{const fc=g('pm-first-course').value.trim();p=Object.assign({id:uid(),links:[],courses:fc?[{cid:cuid(),name:fc,done:false,link:'',modules:[]}]:[]},f);programs.push(p);}
    if(!p.startDate)delete p.startDate;else SEA.ensure(p.startDate);
    if(sid)p.seasonId=sid;else delete p.seasonId;
    activeId=p.id;saveData();APP.closeModal('progModal');APP.render();
  },
  deleteProgram:function(){
    if(!editingId)return;if(!confirm('Remove this course entirely?'))return;
    programs=programs.filter(function(p){return p.id!==editingId;});if(activeId===editingId)activeId=null;
    saveData();APP.closeModal('progModal');APP.render();
  }
};
return api;
})();
</script>
