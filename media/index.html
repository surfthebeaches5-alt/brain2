<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library · Brain 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --serif:'Fraunces',Georgia,serif;
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  --shadow:0 1px 2px rgba(60,50,30,.04),0 8px 24px rgba(60,50,30,.05);
  --cover-shadow:0 1px 2px rgba(40,30,20,.12),0 10px 22px rgba(40,30,20,.14);
  --cover-shadow-hi:0 2px 4px rgba(40,30,20,.14),0 18px 32px rgba(40,30,20,.2);
  --star:#e0a94a; --star-off:#e3dac6;
}
html,body{background:var(--bg);font-family:var(--sans);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px;}
button{font-family:inherit;color:inherit;}
input,select,textarea{font-family:inherit;color:inherit;}
a{color:inherit;text-decoration:none;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.13em;flex-shrink:0;}

/* ───────── title row: title + big add box ───────── */
.topbar{flex-wrap:wrap;}
.lib-head{min-width:0;}
.topbar-sub{color:var(--muted);font-size:13.5px;font-weight:500;margin-top:8px;}
.page{max-width:1280px;margin:0 auto;padding:20px 40px 80px;box-sizing:border-box;}

.add-wrap{position:relative;width:420px;max-width:100%;}
.add-box{display:flex;align-items:center;gap:12px;height:48px;padding:0 14px 0 16px;border-radius:14px;background:var(--raised);border:1px solid var(--line);box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s;cursor:text;}
.add-box:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow);}
.add-box .ic{font-size:18px;color:var(--accent-deep);}
.add-box input{flex:1;min-width:0;border:none;outline:none;background:transparent;font:550 14px var(--sans);color:var(--ink);}
.add-box input::placeholder{color:var(--faint);}
.kbd{font:700 11px var(--sans);background:var(--warm);color:var(--muted);border-radius:6px;padding:2px 7px;}
.add-spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent-line);border-top-color:var(--accent-deep);animation:spin .8s linear infinite;display:none;}
.add-box.busy .add-spin{display:block;}
@keyframes spin{to{transform:rotate(360deg)}}

/* results dropdown */
.results{position:absolute;right:0;top:calc(100% + 8px);width:min(900px,calc(100vw - 32px));background:var(--raised);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(60,50,30,.16);display:none;overflow:hidden;z-index:80;}
.results.one{width:min(560px,calc(100vw - 32px));}
.results.open{display:block;animation:pop .14s ease-out;}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.res-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));max-height:min(500px,64vh);overflow-y:auto;}
.results.one .res-cols{grid-template-columns:1fr;}
.res-col{padding:10px 8px;min-width:0;}
.res-col + .res-col{border-left:1px solid var(--hair);}
.res-col.full{grid-column:1/-1;border-left:none;border-bottom:1px solid var(--hair);}
.res-h{display:flex;align-items:center;gap:8px;padding:4px 10px 8px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:750;}
.res-h small{letter-spacing:0;text-transform:none;font-weight:500;color:var(--faint);font-size:11px;}
.rr{display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:12px;cursor:pointer;position:relative;}
.rr:hover,.rr.hl{background:var(--accent-soft);}
.rr .cv{width:36px;flex-shrink:0;border-radius:5px;}
.rr-txt{flex:1;min-width:0;}
.rr-t{font-size:13.5px;font-weight:650;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rr-m{font-size:11.5px;color:var(--muted);font-weight:550;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rr-acts{display:none;gap:4px;margin-top:5px;flex-wrap:wrap;}
.rr:hover .rr-acts,.rr.hl .rr-acts{display:flex;}
.rr-b{height:24px;padding:0 9px;border-radius:7px;border:1px solid var(--line);background:var(--raised);font:650 11px var(--sans);color:var(--ink-2);cursor:pointer;white-space:nowrap;}
.rr-b:hover{border-color:var(--accent-line);color:var(--accent-deep);}
.rr-b.main{background:var(--ink);color:#fff;border-color:var(--ink);}
.rr-b.main:hover{background:var(--ink-2);color:#fff;}
.rr-on{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;flex-shrink:0;}
.res-msg{padding:10px 12px;font-size:12px;color:var(--muted);line-height:1.5;}
.skel{display:flex;gap:11px;align-items:center;padding:7px 10px;}
.skel i{display:block;border-radius:6px;background:linear-gradient(90deg,var(--warm) 0%,var(--surface) 50%,var(--warm) 100%);background-size:200% 100%;animation:shim 1.2s infinite;}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
.res-manual{border-top:1px solid var(--hair);padding:9px 12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);background:var(--surface);}
.res-manual b{color:var(--ink);font-weight:650;}
.mbtn{height:26px;padding:0 10px;border-radius:8px;border:1px dashed var(--accent-line);background:transparent;font:650 11.5px var(--sans);color:var(--accent-deep);cursor:pointer;}
.mbtn:hover,.mbtn.hl{background:var(--accent-soft);border-style:solid;}

/* ───────── buttons (one style everywhere) ───────── */
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 15px;border-radius:10px;font:650 12.5px var(--sans);border:1px solid var(--line);background:var(--raised);color:var(--ink-2);cursor:pointer;white-space:nowrap;transition:border-color .14s,background .14s,color .14s;}
.btn:hover{border-color:var(--accent-line);color:var(--ink);}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff;}
.btn.pri:hover{background:var(--ink-2);border-color:var(--ink-2);}
.btn.soft,.btn.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-deep);}
.btn.sm,.pill{height:28px;padding:0 11px;font-size:11.5px;border-radius:8px;}
.btn[disabled]{opacity:.7;cursor:progress;}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-weight:650;border:1px solid var(--line);background:var(--raised);color:var(--ink-2);cursor:pointer;white-space:nowrap;}
.pill:hover{border-color:var(--accent-line);color:var(--accent-deep);}
.pill.pri{background:var(--ink);border-color:var(--ink);color:#fff;margin-left:auto;}
.pill.pri:hover{background:var(--ink-2);color:#fff;}
.ghost{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 15px;border-radius:10px;border:1px solid var(--accent-line);background:var(--accent-soft);font:650 12.5px var(--sans);color:var(--accent-deep);cursor:pointer;}

/* ───────── page tabs (segmented) ───────── */
.lib-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 22px;}
.tabs{display:inline-flex;gap:2px;padding:4px;background:var(--warm-deep);border-radius:13px;flex-wrap:wrap;max-width:100%;}
.tab{border:none;background:none;cursor:pointer;padding:8px 16px;border-radius:10px;font:650 13px var(--sans);color:var(--muted);white-space:nowrap;}
.tab:hover{color:var(--ink);}
.tab.on{background:var(--raised);color:var(--ink);box-shadow:0 1px 3px rgba(60,50,30,.1);}
.tab small{font-size:11px;color:var(--faint);margin-left:5px;font-weight:700;}
.lib-acts{display:flex;gap:8px;}

/* ───────── cards ───────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 24px;box-shadow:var(--shadow);}
.card-t{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.2px;}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:750;}

/* ───────── "All": right now + goal ───────── */
.feature-row{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:stretch;}
.feature-row.many{align-items:start;}
.prog-row .step{height:22px;border-radius:6px;}
.prog-row .step button{width:20px;font-size:12px;}
.prog-row .step span{min-width:28px;font-size:11px;padding:0 5px;}
.now-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:18px;}
.nc{display:grid;grid-template-columns:112px minmax(0,1fr);gap:22px;align-items:start;}
.nc.poster{grid-template-columns:104px minmax(0,1fr);}
.nc .cv{cursor:pointer;}
.nc-body{min-width:0;}
.nc-ey{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--accent-deep);margin-bottom:6px;}
.nc-t{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.3px;line-height:1.15;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.nc-t:hover{color:var(--accent-deep);}
.nc-a{color:var(--muted);font-weight:550;margin:4px 0 16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar{height:5px;border-radius:4px;background:var(--warm-deep);overflow:hidden;}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent);transition:width .35s ease;}
.prog-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:650;color:var(--ink-2);margin-top:8px;}
.prog-row .mut{color:var(--muted);}
.pg-in{width:44px;border:none;border-bottom:1.5px dashed var(--accent-line);background:transparent;font:700 12px var(--sans);color:var(--ink);text-align:center;outline:none;padding:1px 0;-moz-appearance:textfield;}
.pg-in:focus{border-bottom-color:var(--accent-deep);}
.pg-in::-webkit-inner-spin-button,.pg-in::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.nc-acts{display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap;}
.step{display:inline-flex;align-items:stretch;height:28px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--raised);}
.step button{width:24px;border:none;background:transparent;cursor:pointer;color:var(--muted);font-size:13px;}
.step button:hover{background:var(--accent-soft);color:var(--accent-deep);}
.step span{display:flex;align-items:center;padding:0 7px;font:700 11.5px var(--sans);color:var(--ink-2);border-left:1px solid var(--hair);border-right:1px solid var(--hair);min-width:34px;justify-content:center;white-space:nowrap;}
.done-box{padding:12px 14px;border-radius:12px;background:var(--accent-soft);}
.done-box .yay{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:-.2px;}
.done-box .sub{font-size:12px;color:var(--muted);margin-top:2px;font-weight:550;}
.done-box .stars{font-size:22px;margin-top:6px;}
.done-box .skip{border:none;background:none;font-size:11.5px;font-weight:650;color:var(--muted);cursor:pointer;margin-left:6px;text-decoration:underline;text-underline-offset:3px;}
.now-empty{display:flex;align-items:center;gap:24px;flex-wrap:wrap;height:100%;}
.now-empty-txt{flex:1;min-width:220px;}
.now-empty-s{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.55;font-weight:500;}
.sugg{display:flex;gap:14px;flex-wrap:wrap;}
.sg{width:78px;text-align:center;cursor:pointer;}
.sg .pill{margin-top:8px;}

.goal{display:flex;gap:18px;align-items:center;margin-top:12px;}
.ring{width:84px;height:84px;transform:rotate(-90deg);flex-shrink:0;}
.ring circle{fill:none;stroke-width:8;transition:stroke-dashoffset .4s ease;}
.goal-n{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1;display:flex;align-items:baseline;gap:3px;white-space:nowrap;}
.goal-n .of{font-size:15px;color:var(--muted);font-weight:500;}
.goal-in{width:30px;border:none;border-bottom:1px dashed var(--accent-line);background:transparent;font:500 15px var(--serif);color:var(--muted);outline:none;padding:0;-moz-appearance:textfield;}
.goal-in:focus{border-bottom-color:var(--accent-deep);color:var(--ink);}
.goal-in::-webkit-inner-spin-button,.goal-in::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.goal-p{font-size:12px;color:var(--muted);font-weight:600;margin-top:6px;}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px;}
.stat{background:var(--warm);border-radius:12px;padding:12px;min-width:0;}
.stat b{display:block;font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.15;}
.stat span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:750;}

/* ───────── shelves ───────── */
.sec{display:flex;align-items:baseline;gap:10px;margin:34px 0 16px;}
.sec.first{margin-top:20px;}
.sec h2{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:-.4px;white-space:nowrap;}
.sec .cnt{font-size:13px;color:var(--muted);font-weight:600;}
.more{margin-left:auto;border:none;background:none;cursor:pointer;font:650 12.5px var(--sans);color:var(--accent-deep);white-space:nowrap;}
.more:hover{text-decoration:underline;text-underline-offset:3px;}
.grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:26px 20px;}
.bk{cursor:pointer;min-width:0;position:relative;}
.bk .cv{width:100%;}
.bk:hover .cv{transform:translateY(-4px);box-shadow:var(--cover-shadow-hi);}
.bk-t{font-weight:700;font-size:12.5px;line-height:1.3;margin-top:11px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.bk-a{font-size:11.5px;color:var(--muted);font-weight:550;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bk-m{font-size:11px;color:var(--muted);margin-top:4px;font-weight:600;}
.bk .bar{height:4px;margin-top:8px;}
.kind{position:absolute;left:8px;top:8px;z-index:3;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,253,248,.92);color:var(--ink-2);padding:3px 7px;border-radius:6px;pointer-events:none;}
.kind.lav{color:var(--accent-deep);}
.q-act{position:absolute;left:8%;right:8%;bottom:7%;height:28px;border-radius:8px;border:none;background:rgba(36,31,23,.86);color:#fff;font:650 11.5px var(--sans);cursor:pointer;opacity:0;transform:translateY(6px);transition:all .16s;z-index:3;backdrop-filter:blur(4px);}
.bk:hover .q-act{opacity:1;transform:none;}
.q-act:hover{background:var(--accent-deep);}
.fav{position:absolute;top:8px;right:8px;z-index:3;width:22px;height:22px;border-radius:50%;background:rgba(255,253,248,.92);display:flex;align-items:center;justify-content:center;color:var(--over);font-size:12px;}
.stars{display:inline-flex;gap:0;font-size:13px;line-height:1;margin-top:5px;letter-spacing:1px;}
.stars b{color:var(--star-off);cursor:pointer;font-weight:400;transition:color .1s,transform .1s;padding:0 1px 0 0;}
.stars b.on{color:var(--star);}
.stars:hover b{color:var(--star);}
.stars b:hover ~ b{color:var(--star-off);}
.stars b:hover{transform:scale(1.2);}
.stars.ro{pointer-events:none;}
.shelf-empty{font-size:13px;color:var(--muted);font-weight:550;padding:18px 20px;border:1px dashed var(--line);border-radius:14px;}
.shelf-empty button{margin-left:8px;}

/* type-tab filters */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.fchip{height:30px;padding:0 12px;border-radius:20px;border:none;background:var(--warm);font:600 12.5px var(--sans);color:var(--muted);cursor:pointer;white-space:nowrap;transition:background .14s,color .14s;}
.fchip span{opacity:.7;margin-left:5px;font-weight:700;font-size:11px;}
.fchip:hover{color:var(--ink);background:var(--warm-deep);}
.fchip.on{background:var(--ink);color:#fff;}
.tb-sp{flex:1;}
.sel{appearance:none;-webkit-appearance:none;height:34px;padding:0 30px 0 12px;border-radius:10px;border:1px solid var(--line);background:var(--raised) url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%238c8374' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E") no-repeat right 11px center;font:500 13px var(--sans);color:var(--ink);cursor:pointer;outline:none;max-width:190px;}
.sel:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft);}
.filt{display:flex;align-items:center;gap:7px;padding:0 12px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--muted);}
.filt:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft);}
.filt input{border:none;outline:none;background:transparent;font:500 13px var(--sans);width:130px;color:var(--ink);}
.ext{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;color:var(--accent-deep);padding:5px 8px;border-radius:8px;}
.ext:hover{background:var(--accent-soft);}

/* list rows (videos / articles) inside one card */
.rows{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 20px;box-shadow:var(--shadow);}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;cursor:pointer;}
.row+.row{border-top:1px solid var(--hair);}
.row:hover .row-t{color:var(--accent-deep);}
.row .cv{width:38px;flex-shrink:0;border-radius:6px;box-shadow:0 1px 2px rgba(40,30,20,.12);}
.row-txt{flex:1;min-width:0;}
.row-t{font-weight:650;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row-m{font-size:12px;color:var(--muted);font-weight:550;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row-r{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;border:none;cursor:pointer;white-space:nowrap;}
.st::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.65;}
.st-want{background:var(--warn-bg);color:var(--warn);}
.st-progress{background:var(--accent-soft);color:var(--accent-deep);}
.st-done{background:var(--ok-bg);color:var(--ok);}

.empty{text-align:center;padding:48px 20px;background:var(--surface);border:1px dashed var(--line);border-radius:18px;color:var(--muted);font-weight:500;}
.empty-t{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.2px;color:var(--ink);margin-bottom:6px;}
.empty .ghost{margin-top:14px;}

/* ───────── covers: real art + generated fallback ───────── */
.cv{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;box-shadow:var(--cover-shadow);background:var(--warm-deep);container-type:inline-size;transition:transform .2s ease,box-shadow .2s ease;}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s;}
.cv img.ok{opacity:1;}
/* square art (albums, podcasts) sits in the same tall frame over a blurred copy of itself */
.cv.sq{display:flex;align-items:center;}
.cv.sq img.blur{inset:-20px;width:calc(100% + 40px);height:calc(100% + 40px);filter:blur(18px) saturate(1.2);}
.cv.sq img.blur.ok{opacity:.85;}
.cv.sq img.art{position:relative;inset:auto;width:86%;height:auto;aspect-ratio:1/1;margin:0 auto;border-radius:4px;box-shadow:0 8px 20px rgba(0,0,0,.28);}
.cv.sq.has-img .gc{visibility:hidden;}
/* tiny thumbs (search results, list rows): plain square */
.cv.sq.tiny{aspect-ratio:1/1;}
.cv.sq.tiny img.blur{display:none;}
.cv.sq.tiny img.art{width:100%;border-radius:0;box-shadow:none;}
.gc{position:absolute;inset:0;background:linear-gradient(160deg,var(--g1) 0%,var(--g2) 100%);color:var(--gi);display:flex;flex-direction:column;align-items:center;text-align:center;padding:16cqw 11cqw 11cqw;overflow:hidden;}
.gc-frame{position:absolute;inset:6.5cqw 6.5cqw 6.5cqw 8.5cqw;border:1px solid color-mix(in srgb,var(--gi) 28%,transparent);border-radius:2px;pointer-events:none;}
.gc-mo{position:absolute;pointer-events:none;}

.gc.m2 .gc-mo{left:0;right:0;bottom:22cqw;height:24cqw;background:repeating-linear-gradient(180deg,color-mix(in srgb,var(--gi) 22%,transparent) 0 1px,transparent 1px 6cqw);}
.gc.m3 .gc-mo{width:78cqw;height:78cqw;right:-30cqw;top:-30cqw;border-radius:50%;background:rgba(255,255,255,.3);box-shadow:-9cqw 9cqw 0 0 rgba(255,255,255,.14);}
.gc.m4 .gc-mo{left:50%;bottom:17cqw;width:30cqw;height:30cqw;transform:translateX(-50%) rotate(45deg);border:1.5px solid color-mix(in srgb,var(--gi) 35%,transparent);background:rgba(255,255,255,.25);}

.gc-rule{width:14cqw;height:1px;background:currentColor;opacity:.4;margin:6cqw 0 5cqw;position:relative;}
.gc-a{font-size:5.6cqw;letter-spacing:.16em;text-transform:uppercase;font-weight:700;opacity:.78;position:relative;line-height:1.35;}

.gc.pos .gc-t{font-size:14cqw;}.gc.pos .gc-t.l3{font-size:11cqw;}.gc.pos .gc-t.l4{font-size:9cqw;}

@container (max-width:64px){

/* ───────── year in review ───────── */
.yr-nav{display:flex;align-items:center;gap:12px;margin:4px 0 20px;}
.yr-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--raised);cursor:pointer;font-size:14px;color:var(--ink-2);}
.yr-btn:hover{border-color:var(--accent-line);color:var(--accent-deep);}
.yr-lbl{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:-.6px;}
.yr-sub{font-size:13px;color:var(--muted);font-weight:550;margin-left:6px;}
.yr-tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;margin-bottom:18px;}
.yt{padding:18px 20px;}
.yt-n{font-family:var(--serif);font-size:32px;font-weight:600;letter-spacing:-.8px;line-height:1;}
.yt-l{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:750;margin-top:8px;}
.panel{margin-bottom:18px;}
.panel-t{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.2px;margin-bottom:16px;display:flex;align-items:baseline;gap:10px;}
.panel-t small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:600;letter-spacing:0;}
.panel-e{font-size:13px;color:var(--muted);font-weight:500;}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:14px 12px;}
.wall .cv{cursor:pointer;}
.wall .cv:hover{transform:translateY(-3px);}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px;align-items:end;height:150px;}
.mo{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;}
.mo-bars{display:flex;gap:3px;align-items:flex-end;flex:1;width:100%;justify-content:center;}
.mo-bar{width:42%;max-width:16px;border-radius:5px 5px 2px 2px;min-height:3px;position:relative;}
.mo-bar.b{background:var(--accent);}
.mo-bar.s{background:#e195a2;}
.mo-bar.z{background:var(--warm-deep);}
.mo-l{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:6px;}
.mo-l.cur{color:var(--accent-deep);}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);font-weight:600;margin-top:14px;flex-wrap:wrap;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;}

/* ───────── side panel (drawer) ───────── */
.scrim{position:fixed;inset:0;background:rgba(36,31,23,.28);z-index:1000;opacity:0;pointer-events:none;transition:opacity .2s;}
.scrim.open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100vw);background:var(--surface);z-index:1010;border-left:1px solid var(--line);box-shadow:-20px 0 60px -20px rgba(40,30,20,.3);transform:translateX(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;}
.drawer.open{transform:none;}
.dr-bar{display:flex;align-items:center;gap:8px;padding:14px 20px;border-bottom:1px solid var(--hair);}
.dr-bar .eyebrow{flex:1;}
.x{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--raised);cursor:pointer;color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:center;}
.x:hover{border-color:var(--accent-line);color:var(--accent-deep);}
.dr-body{flex:1;overflow-y:auto;padding:22px 24px 30px;}
.dr-top{display:flex;gap:18px;margin-bottom:18px;}
.dr-top .cv{width:118px;flex-shrink:0;}
.dr-id{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
.dr-title{width:100%;border:none;border-bottom:1.5px solid transparent;background:transparent;font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:-.4px;line-height:1.15;outline:none;resize:none;padding:2px 0;overflow:hidden;}
.dr-title:hover,.dr-creator:hover{border-bottom-color:var(--hair);}
.dr-title:focus,.dr-creator:focus{border-bottom-color:var(--accent-line);}
.dr-creator{width:100%;border:none;border-bottom:1.5px solid transparent;background:transparent;font:500 13.5px var(--sans);color:var(--muted);outline:none;padding:3px 0;}
.dr-meta{font-size:12px;color:var(--muted);font-weight:550;margin-top:auto;line-height:1.5;}
.dr-stars{display:flex;align-items:center;gap:10px;margin-top:4px;}
.dr-stars .stars{font-size:21px;margin:0;}
.heart{border:none;background:none;cursor:pointer;font-size:19px;color:var(--star-off);line-height:1;transition:transform .12s,color .12s;}
.heart.on{color:var(--over);}
.heart:hover{transform:scale(1.15);}
.seg{display:flex;background:var(--warm-deep);border-radius:13px;padding:4px;gap:2px;margin-bottom:18px;}
.seg button{flex:1;border:none;background:transparent;padding:8px 6px;border-radius:10px;font:650 12.5px var(--sans);color:var(--muted);cursor:pointer;}
.seg button:hover{color:var(--ink);}
.seg button.on{background:var(--raised);color:var(--ink);box-shadow:0 1px 3px rgba(60,50,30,.1);}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.fg .full{grid-column:1/-1;}
.f label{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:750;margin-bottom:6px;}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:500 13px var(--sans);color:var(--ink);background:var(--raised);outline:none;transition:border-color .15s,box-shadow .15s;}
.inp:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft);}
textarea.inp{resize:vertical;min-height:74px;line-height:1.5;}
select.inp{appearance:none;-webkit-appearance:none;background:var(--raised) url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%238c8374' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E") no-repeat right 11px center;padding-right:28px;}
.f-row{display:flex;gap:6px;}
.f-row .inp{flex:1;min-width:0;}
.mini-btn{display:inline-flex;align-items:center;padding:0 11px;border-radius:10px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent-deep);font:650 12px var(--sans);cursor:pointer;white-space:nowrap;}
.mini-btn:hover{border-color:var(--accent);}
.dr-sec{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:750;margin:22px 0 10px;display:flex;align-items:center;gap:10px;}
.dr-sec::after{content:'';flex:1;height:1px;background:var(--hair);}
.songs .song{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--hair);}
.songs .song span{font-size:11px;color:var(--muted);font-weight:700;width:18px;text-align:right;}
.songs .song input{flex:1;border:none;outline:none;background:transparent;font:500 13px var(--sans);padding:5px 0;}
.songs .song button{border:none;background:none;cursor:pointer;color:var(--faint);font-size:13px;padding:2px 4px;}
.songs .song button.on{color:var(--over);}
.songs .song button:hover{color:var(--accent-deep);}
.dr-foot{display:flex;align-items:center;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--hair);}
.del{height:34px;padding:0 15px;border-radius:10px;border:1px solid var(--over-bg);background:var(--over-bg);color:var(--over);font:650 12.5px var(--sans);cursor:pointer;}
.del.arm{background:var(--over);color:#fff;border-color:var(--over);}
.saved{font-size:12px;color:var(--muted);font-weight:550;margin-left:auto;}

/* ───────── import dialog ───────── */
.modal-bg{position:fixed;inset:0;background:rgba(36,31,23,.28);z-index:1020;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-bg.open{display:flex;animation:pop .16s;}
.modal{width:min(620px,100%);max-height:90vh;overflow-y:auto;background:var(--surface);border-radius:18px;border:1px solid var(--line);box-shadow:0 30px 70px -20px rgba(40,30,20,.35);padding:24px 26px;}
.modal-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px;}
.modal-t{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:-.4px;flex:1;}
.modal-s{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:18px;font-weight:500;}
.modal-s b{color:var(--ink);font-weight:650;}
.src-tabs{display:flex;gap:6px;margin-bottom:14px;}
.drop{border:2px dashed var(--accent-line);border-radius:16px;padding:30px 20px;text-align:center;background:var(--accent-soft);cursor:pointer;transition:all .15s;}
.drop:hover,.drop.over{border-color:var(--accent-deep);}
.drop-t{font-family:var(--serif);font-size:18px;font-weight:600;margin-top:8px;}
.drop-s{font-size:12px;color:var(--muted);margin-top:4px;font-weight:550;}
.drop .big{font-size:30px;color:var(--accent-deep);}
.howto{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:14px;padding:12px 14px;background:var(--warm);border-radius:12px;font-weight:500;}
.howto b{color:var(--ink);font-weight:650;}
.prev-strip{display:flex;gap:8px;overflow:hidden;margin:4px 0 16px;mask-image:linear-gradient(90deg,#000 80%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 80%,transparent);}
.prev-strip .cv{width:56px;flex-shrink:0;}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.sum div{background:var(--warm);border-radius:12px;padding:12px 14px;}
.sum b{display:block;font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:-.5px;}
.sum span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:750;}
.imp-note{font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:6px;font-weight:500;}
.modal-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;align-items:center;}
.lb-opt{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap;}

/* ───────── toast ───────── */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);opacity:0;pointer-events:none;z-index:1100;background:var(--ink);color:#fff;border-radius:14px;padding:10px 12px 10px 18px;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:500;box-shadow:0 18px 40px -12px rgba(0,0,0,.4);transition:all .22s cubic-bezier(.2,.8,.2,1);max-width:calc(100vw - 32px);}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
.toast i{font-style:normal;font-family:var(--serif);font-weight:600;}
.toast button{border:none;background:rgba(255,255,255,.12);color:#fff;font:650 12px var(--sans);height:28px;padding:0 11px;border-radius:8px;cursor:pointer;white-space:nowrap;}
.toast button:hover{background:rgba(255,255,255,.22);}
.toast .stars{margin:0;font-size:17px;}
.toast .stars b{color:rgba(255,255,255,.3);}
.toast .stars:hover b{color:var(--star);}
.toast .stars b:hover ~ b{color:rgba(255,255,255,.3);}

/* ───────── responsive ───────── */
@media (max-width:1100px){
  .feature-row{grid-template-columns:1fr;}
  .grid{grid-template-columns:repeat(6,minmax(0,1fr));}
  .yr-tiles{grid-template-columns:repeat(3,minmax(0,1fr));}
  .results{width:min(620px,calc(100vw - 32px));}
  .res-cols{grid-template-columns:1fr 1fr;}

}
@media (max-width:760px){

  .add-wrap{width:100%;}

  .res-cols{grid-template-columns:1fr;}

  .rr-acts{opacity:1;pointer-events:auto;}
  .now-grid{grid-template-columns:1fr;}
  .nc{grid-template-columns:84px minmax(0,1fr);gap:16px;}
  .nc.poster{grid-template-columns:84px minmax(0,1fr);}
  .nc-t{font-size:19px;}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 14px;}
  .filt input{width:100px;}
  .yr-tiles{grid-template-columns:repeat(2,minmax(0,1fr));}
  .fg{grid-template-columns:1fr;}
  .row-r .ext{display:none;}
  .months{gap:3px;}
  .card{padding:18px;}
}

/* ── STORAGE ──
   data = {books,videos,articles,music,screen, meta?}
   meta (optional, page-only) = {goals:{books:{'2026':24}}}. Always iterate SEC_KEYS, never Object.keys(data). */
var data={books:[],videos:[],articles:[],music:[],screen:[]};
function save(){try{localStorage.setItem(SK,JSON.stringify(data));return true;}catch(e){toast('Couldn’t save — browser storage is full.');return false;}}
function load(){
  var raw=localStorage.getItem(SK);
  var migrated=false;
  if(raw){try{data=JSON.parse(raw);}catch(e){}}
  else{data=JSON.parse(JSON.stringify(DEFAULT_DATA));save();}
  if(!data||typeof data!=='object'||Array.isArray(data))data={};
  // Migrate the old "podcasts" section into "videos" (podcasts become one category among many)
  if(data.podcasts){
    if(!data.videos||!data.videos.length){
      data.videos=(data.podcasts||[]).map(function(it){var o=Object.assign({},it);o.category='Podcast';return o;});
    }
    delete data.podcasts;migrated=true;
  }
  Object.keys(SECTIONS).forEach(function(s){if(!Array.isArray(data[s]))data[s]=[];});
  // Normalize video statuses to the shared want/progress/done model + ensure a date field
  var VSTAT={queue:'want',watching:'progress',following:'progress',archived:'done'};
  (data.videos||[]).forEach(function(v){if(VSTAT[v.status]){v.status=VSTAT[v.status];migrated=true;}if(v.date===undefined){v.date='';}});
  // Migrate: ensure music items have songs array
  (data.music||[]).forEach(function(m){if(!m.songs)m.songs=[];m.songs.forEach(function(sg){if(sg.fav===undefined){sg.fav=((sg.rating||0)>=4);migrated=true;}});});
  // Defensive: every item needs an id + title string
  SEC_KEYS.forEach(function(s){data[s].forEach(function(it,i){if(!it.id){it.id='i_'+Date.now()+'_'+s+i;migrated=true;}if(it.title==null)it.title='';
    // the old one-shot "coverLookup:'none'" marker is superseded by coverTried (auto cover finder retries later)
    if(it.coverLookup){delete it.coverLookup;migrated=true;}});});
  if(data.meta&&typeof data.meta!=='object')delete data.meta;
  if(migrated)save();
}

/* ── UTILS ── */
function pad(n){return String(n).padStart(2,'0');}
function todayStr(){var n=new Date();return n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate());}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function safeUrl(u){u=String(u||'').trim();return /^https?:\/\//i.test(u)?u:'';}
function fmtDate(d){if(!d)return '';var p=d.split('-');if(p.length<3)return d;return MS[+p[1]-1]+' '+(+p[2])+', '+p[0];}
function fmtShort(d){if(!d)return '';var p=d.split('-');if(p.length<3)return d;var s=MS[+p[1]-1]+' '+(+p[2]);return p[0]==String(new Date().getFullYear())?s:s+', '+p[0];}
function hash(s){var h=2166136261;s=String(s||'');for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function uid(){return 'i_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);}
function num(v){var n=parseInt(v,10);return isNaN(n)?0:n;}
function isSeries(it){return it.kind==='tv'||SCREEN_SERIES.indexOf(it.category)>=0;}
function findItem(sec,id){return(data[sec]||[]).find(function(i){return i.id===id;});}
function statusLabel(sec,st){var s=SECTIONS[sec].statuses.find(function(x){return x.val===st;});return s?s.label:st;}
function normStatus(st){return st==='progress'||st==='done'?st:'want';}
function normTitle(t){return String(t||'').toLowerCase().replace(/\s*\([^)]*#[^)]*\)\s*$/,'').split(/[:;]/)[0].normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/^(the|a|an)\s+/,'').replace(/[^a-z0-9]+/g,'');}
function normAuthor(a){var f=String(a||'').split(/,|&| and /i)[0].trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');var w=f.split(/\s+/).filter(Boolean);return (w[w.length-1]||'').replace(/[^a-z]/g,'');}
function addedKey(it,idx){if(it.addedAt)return +it.addedAt;var m=/^i_(\d{12,})/.exec(it.id||'');return m?+m[1]:idx;}
function ipt(el){return el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT'||el.isContentEditable);}

  ['#ecebf9','#b9b6e6','#2e2c66'], // periwinkle

];
var ORN=['✦','❦','✧ ✧ ✧','◆','☾','✿'];
function genCover(it,sec,shape){
  var h=hash((it.title||'')+'|'+(it.creator||''));
  var p=PALETTES[h%PALETTES.length],m=(h>>>5)%5;
  var t=it.title||'Untitled',L=t.length;
  var lc=L<=10?'l1':L<=24?'':L<=44?'l3':'l4';
  var style='--g1:'+p[0]+';--g2:'+p[1]+';--gi:'+p[2];
  var ini=esc((t.replace(/^(the|a|an)\s+/i,'').trim()[0]||'?').toUpperCase());
  if(shape==='poster'){
    var yr=it.year||(it.date?String(it.date).slice(0,4):'');
    var kind=isSeries(it)?'Series':(it.category==='Documentary'?'Doc':'Film');
    return '<div class="gc pos m'+m+'" style="'+style+'"><div class="gc-mo"></div><div class="gc-orn"><span>'+kind+'</span><span>'+esc(yr)+'</span></div><div class="gc-ini">'+ini+'</div><div class="gc-t '+lc+'">'+esc(t)+'</div>'+(it.creator?'<div class="gc-rule"></div><div class="gc-a">'+esc(it.creator)+'</div>':'')+'</div>';
  }
  var cls=shape==='sq'?' sqr':'';
  return '<div class="gc m'+m+cls+'" style="'+style+'"><div class="gc-frame"></div><div class="gc-mo"></div><div class="gc-orn">'+ORN[(h>>>9)%ORN.length]+'</div><div class="gc-ini">'+ini+'</div><div class="gc-t '+lc+'">'+esc(t)+'</div>'+(it.creator?'<div class="gc-rule"></div><div class="gc-a">'+esc(it.creator.split(/\s*[,&]\s*/)[0])+'</div>':'')+'</div>';
}
function coverImgs(it,shape){
  var src=safeUrl(it.cover);if(!src)return '';
  var a=' src="'+esc(src)+'" alt="" loading="lazy" referrerpolicy="no-referrer"';
  if(shape==='sq')return '<img class="blur"'+a+' aria-hidden="true"><img class="art"'+a+' onload="coverOk(this)" onerror="coverFail(this)">';
  return '<img'+a+' onload="coverOk(this)" onerror="coverFail(this)">';
}
/* opts.tiny → square thumb (search results, list rows) */
function coverHTML(it,sec,extra,opts){
  var shape=SECTIONS[sec].shape;
  var cls=shape==='book'?'cv book':shape==='poster'?'cv poster':'cv sq'+(opts&&opts.tiny?' tiny':'');
  var ck=it.id?' data-ck="'+esc(sec+'|'+it.id)+'"':'';
  return '<div class="'+cls+'"'+ck+'>'+genCover(it,sec,shape)+coverImgs(it,shape)+(extra||'')+'</div>';
}
function coverOk(img){
  if(img.naturalWidth<8){coverFail(img);return;}
  img.classList.add('ok');
  var cv=img.parentNode;if(cv&&cv.classList.contains('sq')){cv.classList.add('has-img');var b=cv.querySelector('img.blur');if(b)b.classList.add('ok');}
}
function coverFail(img){
  var cv=img.parentNode,src=img.getAttribute('src')||'';
  if(!cv)return;
  cv.querySelectorAll('img').forEach(function(x){x.remove();});cv.classList.remove('has-img');
  // Goodreads imports point at Open Library by ISBN with ?default=false — a 404 there means "no such cover",
  // so drop it and let the background finder search by title instead.
  var ck=cv.getAttribute('data-ck');
  if(ck&&/covers\.openlibrary\.org\/b\/isbn\//.test(src)){
    var p=ck.split('|'),it=findItem(p[0],p.slice(1).join('|'));
    if(it&&it.cover===src){it.cover='';save();autoCoversSoon();}
  }
}
/* swap the art inside every rendered cover of one item, without re-rendering the page */
function patchCover(sec,it){
  var shape=SECTIONS[sec].shape;
  document.querySelectorAll('.cv[data-ck]').forEach(function(cv){
    if(cv.getAttribute('data-ck')!==sec+'|'+it.id)return;
    cv.querySelectorAll('img').forEach(function(x){x.remove();});cv.classList.remove('has-img');
    var gc=cv.querySelector('.gc');if(gc)gc.insertAdjacentHTML('afterend',coverImgs(it,shape));
  });
}

/* ── STATUS + PROGRESS ACTIONS ── */
function setStatus(sec,id,st,opts){
  var it=findItem(sec,id);if(!it)return;
  var prev=it.status;it.status=st;
  if(st==='progress'&&!it.startedAt)it.startedAt=todayStr();
  if(st==='done'){
    if(!it.date)it.date=todayStr();
    if(sec==='books'&&it.pages)it.progress=it.pages;
  }
  save();
  if(st==='done'&&prev!=='done'&&!(opts&&opts.quiet)){
    if(opts&&opts.inline)justFinished[sec+':'+id]=true;
    else toastRate(sec,it,'Marked as '+statusLabelIt(sec,it,'done').toLowerCase());
  }
  renderAll();
}
function rate(sec,id,n){
  var it=findItem(sec,id);if(!it)return;
  it.rating=(it.rating===n&&!justFinished[sec+':'+id])?0:n;save();
  if(justFinished[sec+':'+id]){setTimeout(function(){delete justFinished[sec+':'+id];renderAll();},900);}
  renderAll();if(drawerRef&&drawerRef.sec===sec&&drawerRef.id===id)renderDrawer();
}
function bumpPages(sec,id,n){
  var it=findItem(sec,id);if(!it)return;
  it.progress=Math.max(0,(it.progress||0)+n);if(it.pages)it.progress=Math.min(it.pages,it.progress);
  save();renderNow();renderShelf();
}
function setPages(sec,id,v){var it=findItem(sec,id);if(!it)return;it.progress=Math.max(0,num(v));if(it.pages&&it.progress>it.pages)it.pages=it.progress;save();renderNow();renderShelf();}
function setPageTotal(sec,id,v){var it=findItem(sec,id);if(!it)return;it.pages=Math.max(0,num(v));save();renderNow();renderShelf();}
function stepEp(sec,id,field,d){
  var it=findItem(sec,id);if(!it)return;
  if(field==='next'){it.episode=(it.episode||1)+1;}
  else if(field==='season'){it.season=Math.max(1,(it.season||1)+d);if(d>0)it.episode=1;}
  else it[field]=Math.max(1,(it[field]||1)+d);
  save();renderNow();renderShelf();
}
function starsHTML(sec,it,ro){
  var r=it.rating||0,h='<span class="stars'+(ro?' ro':'')+'" title="Rate">';
  for(var i=1;i<=5;i++)h+='<b class="'+(i<=r?'on':'')+'" data-act="rate" data-sec="'+sec+'" data-id="'+esc(it.id)+'" data-n="'+i+'">★</b>';
  return h+'</span>';
}

/* ── GOAL + STATS STRIP ── */
function yearDone(sec,yr){return(data[sec]||[]).filter(function(i){return i.status==='done'&&i.date&&String(i.date).slice(0,4)===String(yr);});}
function getGoal(yr){var g=data.meta&&data.meta.goals&&data.meta.goals.books;return g&&g[yr]?+g[yr]:0;}
function setGoal(yr,v){if(!data.meta)data.meta={};if(!data.meta.goals)data.meta.goals={};if(!data.meta.goals.books)data.meta.goals.books={};data.meta.goals.books[yr]=Math.max(0,num(v));save();renderGoal();}
function renderGoal(){
  var now=new Date(),yr=now.getFullYear();
  var books=yearDone('books',yr),goal=getGoal(yr)||24;
  var n=books.length,pct=Math.min(1,n/goal);
  var start=new Date(yr,0,1),end=new Date(yr+1,0,1);
  var expected=goal*((now-start)/(end-start));
  var diff=Math.round(n-expected),pace;
  if(n>=goal)pace='Goal reached · all bonus now';
  else if(diff>=1)pace='On pace · '+diff+' ahead';
  else if(diff===0)pace='Right on pace';
  else pace=(-diff)+' behind pace';
  var pages=books.reduce(function(s,i){return s+(+i.pages||0);},0);
  (data.books||[]).forEach(function(i){if(i.status==='progress')pages+=(+i.progress||0);});
  var scr=yearDone('screen',yr);
  var films=scr.filter(function(i){return !isSeries(i);}).length,shows=scr.length-films;
  var albums=yearDone('music',yr).length;
  var pg=pages>=10000?Math.round(pages/1000)+'k':pages>=1000?(pages/1000).toFixed(1).replace(/\.0$/,'')+'k':String(pages);
  var C=2*Math.PI*36;
  document.getElementById('goal').innerHTML=
    '<div class="eyebrow">'+yr+' reading goal</div>'+
    '<div class="goal"><svg class="ring" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="36" stroke="var(--warm-deep)"/>'+
    '<circle cx="42" cy="42" r="36" stroke="var(--accent)" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-pct)).toFixed(1)+'"'+(n?'':' style="display:none"')+'/></svg>'+
    '<div><div class="goal-n">'+n+'<span class="of">/</span><input class="goal-in" type="number" min="1" value="'+goal+'" data-chg="goal" aria-label="Yearly reading goal" title="Edit your goal"></div><div class="goal-p">'+pace+'</div></div></div>'+
    '<div class="stats"><div class="stat" title="'+pages.toLocaleString()+' pages read this year"><b>'+pg+'</b><span>Pages</span></div>'+
    '<div class="stat" title="'+shows+' show'+(shows===1?'':'s')+' finished too"><b>'+films+'</b><span>Films</span></div>'+
    '<div class="stat"><b>'+albums+'</b><span>Albums</span></div></div>';
}

        '<div class="step" title="Season"><button data-act="ep" data-f="season" data-d="-1"'+dat+' aria-label="Previous season">−</button><span>S'+s+'</span><button data-act="ep" data-f="season" data-d="1"'+dat+' aria-label="Next season">+</button></div></div>'+

    }else if(!fin){

function renderTabs(){
  var h='<button class="tab'+(ui.tab==='all'?' on':'')+'" data-act="tab" data-tab="all">All</button>';
  VIEW_KEYS.forEach(function(v){
    var n=viewItems(v).length;
    if(VIEWS[v].optional&&!n&&ui.tab!==v)return;
    h+='<button class="tab'+(ui.tab===v?' on':'')+'" data-act="tab" data-tab="'+v+'">'+esc(VIEWS[v].label)+'<small>'+n+'</small></button>';
  });
  document.getElementById('tabs').innerHTML=h;
  document.getElementById('yr-btn').classList.toggle('on',ui.tab==='year');
}
function sortItems(list,sort,st){
  var tkey=function(t){return String(t||'').toLowerCase().replace(/^(the|a|an)\s+/,'');};
  var by={
    added:function(a,b){return b.a-a.a;},
    title:function(a,b){return tkey(a.it.title).localeCompare(tkey(b.it.title));},
    author:function(a,b){return normAuthor(a.it.creator).localeCompare(normAuthor(b.it.creator))||tkey(a.it.title).localeCompare(tkey(b.it.title));},
    rating:function(a,b){return (b.it.rating||0)-(a.it.rating||0)||b.a-a.a;},
    finished:function(a,b){var da=a.it.date||'',db=b.it.date||'';if(da&&db&&da!==db)return db.localeCompare(da);if(da&&!db)return -1;if(db&&!da)return 1;return b.a-a.a;}
  };
  var fn=by[sort];
  if(!fn){fn=st==='done'?by.finished:st==='progress'?function(a,b){return (b.it.startedAt||'').localeCompare(a.it.startedAt||'')||b.a-a.a;}:by.added;}
  return list.sort(fn);
}
function filtered(view){
  var q=ui.q.trim().toLowerCase(),V=VIEWS[view];
  return (data[V.sec]||[]).map(function(it,i){return{it:it,a:addedKey(it,i)};}).filter(function(x){
    var it=x.it;
    if(V.filter&&!V.filter(it))return false;
    if(ui.cat!=='all'&&it.category!==ui.cat)return false;
    if(ui.year!=='all'&&!(it.status==='done'&&String(it.date||'').slice(0,4)===ui.year))return false;
    if(q&&((it.title||'')+' '+(it.creator||'')+' '+(it.note||'')+' '+(it.category||'')).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}
function gridCols(){var w=window.innerWidth;return w<=760?3:w<=1100?6:8;}
function renderAll(){

  var groups=ui.status==='all'?['progress','want','done']:[ui.status];

  groups.forEach(function(st){

function renderHome(){

  var cols=gridCols(),h='';
  // Want to read
  var wr=pool('books','want').sort(function(a,b){return b.a-a.a;});
  h+='<div class="sec"><h2>Want to read</h2><span class="cnt">'+wr.length+' book'+(wr.length===1?'':'s')+'</span>'+(wr.length?'<button class="more" data-act="goto" data-tab="books" data-v="want">See all →</button>':'')+'</div>';
  h+=wr.length?'<div class="grid">'+wr.slice(0,cols).map(function(x){return gridCard('books',x.it);}).join('')+'</div>'
    :'<div class="shelf-empty">Nothing queued. Search above to add a book, or <button class="btn sm" data-act="import" data-src="goodreads">Import Goodreads</button></div>';
  // Watch & listen next — screen + albums + podcasts, round-robin so every kind gets a slot
  var buckets=[pool('screen','want'),pool('music','want'),pool('videos','want',isPodcast)].map(function(b){return b.sort(function(x,y){return y.a-x.a;});});
  var take=[0,0,0],left=cols,total=buckets.reduce(function(s,b){return s+b.length;},0);
  while(left>0&&take.some(function(t,i){return t<buckets[i].length;})){for(var i=0;i<3&&left>0;i++){if(take[i]<buckets[i].length){take[i]++;left--;}}}
  var wl=[];buckets.forEach(function(b,i){wl=wl.concat(b.slice(0,take[i]));});
  h+='<div class="sec"><h2>Watch &amp; listen next</h2><span class="cnt">'+(total?total+' in the queue':'queue')+'</span>'+(buckets[0].length?'<button class="more" data-act="goto" data-tab="screen" data-v="want">See all →</button>':'')+'</div>';
  h+=wl.length?'<div class="grid">'+wl.map(function(x){return gridCard(x.sec,x.it,{tag:true});}).join('')+'</div>'
    :'<div class="shelf-empty">Your watchlist is empty — search above for a show, film, album or podcast.</div>';

  var fin=[];['books','screen','music','videos'].forEach(function(sec){yearDone(sec,yr).forEach(function(it){if(sec==='videos'&&!isPodcast(it))return;fin.push({sec:sec,it:it});});});
  fin.sort(function(a,b){return String(b.it.date).localeCompare(String(a.it.date));});

  h+=fin.length?'<div class="grid">'+fin.slice(0,cols).map(function(x){return gridCard(x.sec,x.it,{tag:x.sec!=='books',home:true});}).join('')+'</div>'
    :'<div class="shelf-empty">Finished things land here with your star ratings.</div>';

function gridCard(sec,it,opts){
  opts=opts||{};
  var id=esc(it.id),dat=' data-sec="'+sec+'" data-id="'+id+'"',st=normStatus(it.status),extra='';
  var tag=opts.tag?kindTag(sec,it):'';
  if(st==='progress')extra+='<span class="kind lav">'+esc(statusLabelIt(sec,it,'progress'))+'</span>';
  else if(tag)extra+='<span class="kind">'+esc(tag)+'</span>';
  if(it.fav)extra+='<span class="fav" title="Favorite">♥</span>';
  if(st==='want')extra+='<button class="q-act" data-act="start"'+dat+'>'+(sec==='books'?'Start reading':sec==='music'||isPodcast(it)?'Start listening':'Start watching')+'</button>';

    window[cb]=function(j){if(settled)return;fin();resolve((j&&j.d)||[]);};
    sc.onerror=function(){if(settled)return;fin();reject(new Error('imdb'));};
    t=setTimeout(function(){if(settled)return;fin();reject(new Error('timeout'));},12000);

function localMatches(q){

  SEC_KEYS.forEach(function(sec){(data[sec]||[]).forEach(function(it){if(out.length<4&&((it.title||'')+' '+(it.creator||'')).toLowerCase().indexOf(ql)>=0)out.push({sec:sec,it:it});});});
  return out;
}
function runSearch(q,mode){
  var key=mode+'|'+q.toLowerCase();
  var cur=res;
  function done(){if(res!==cur)return;var busy=['books','screen','music','pods','audio'].some(function(k){return res[k].state==='loading';});document.getElementById('add-box').classList.toggle('busy',busy);renderResults();}
  if(cache[key]){Object.assign(res,JSON.parse(JSON.stringify(cache[key])));done();return;}
  var slowT=setTimeout(function(){if(res===cur&&res.books.state==='loading'){res.books.slow=true;renderResults();}},4500);
  var jobs=[];
  if(mode==='music'){
    var c0=newCtl();jobs.push(withTimeout(searchAlbums(q,c0.signal),12000,c0).then(function(r){res.music={state:'ok',items:r};},function(e){if(e.name!=='AbortError'||res===cur)res.music={state:'err',items:[]};}).then(done));
  }else if(mode==='podcast'){
    var c5=newCtl();jobs.push(withTimeout(searchPodcasts(q,c5.signal),12000,c5).then(function(r){if(res===cur)res.pods={state:'ok',items:r};},function(){if(res===cur)res.pods={state:'err',items:[]};}).then(done));
  }else{
    var c4=newCtl(),c6=newCtl();
    jobs.push(Promise.all([withTimeout(searchAlbums(q,c4.signal),12000,c4).catch(function(){return null;}),withTimeout(searchPodcasts(q,c6.signal,4),12000,c6).catch(function(){return null;})])
      .then(function(r){if(res!==cur)return;var it=interleave((r[0]||[]).slice(0,4),r[1]||[],6);res.audio={state:it.length||r[0]||r[1]?'ok':'err',items:it};}).then(done));
    var c1=newCtl();jobs.push(withTimeout(searchBooks(q,c1.signal),25000,c1).then(function(r){if(res===cur)res.books={state:'ok',items:r.slice(0,7)};},function(e){if(res===cur)res.books={state:'err',items:[]};}).then(done));
    var tv=null,mv=null,left=2;
    function merge(){if(--left>0){if(res===cur){res.screen.items=interleave(mv||[],tv||[],7);res.screen.partial=true;renderResults();}return;}if(res===cur){var it=interleave(mv||[],tv||[],7);res.screen={state:it.length||tv||mv?'ok':'err',items:it};}done();}
    var c2=newCtl();jobs.push(withTimeout(searchTV(q,c2.signal),10000,c2).then(function(r){tv=r;},function(){tv=null;}).then(merge));
    var c3=newCtl();jobs.push(withTimeout(searchMovies(q,c3.signal),10000,c3).then(function(r){mv=r;},function(){mv=null;}).then(merge));
  }
  Promise.all(jobs).then(function(){clearTimeout(slowT);if(res===cur&&['books','screen','music','pods','audio'].every(function(k){return res[k].state!=='err';}))cache[key]={books:res.books,screen:res.screen,music:res.music,pods:res.pods,audio:res.audio};});
}

/* ── COVER FINDER ──
   Item fields: cover (url), coverTried (ms timestamp of the last lookup that found nothing),
   coverErr (true when that lookup failed on the network — retried after a day instead of a month). */
var coverJob=null;
function looseKey(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'');}
function fuzzyHit(a,b){a=looseKey(a);b=looseKey(b);return !!a&&!!b&&(a.indexOf(b)>=0||b.indexOf(a)>=0);}
/* iTunes relevance is loose: prefer the result whose title and creator actually match */
function pickBest(list,it,yearToo){
  if(!list.length)return null;
  var t=normTitle(it.title),score=function(r){var s=0;if(normTitle(r.title)===t)s+=4;else if(fuzzyHit(r.title,it.title))s+=2;if(it.creator&&fuzzyHit(r.creator,it.creator))s+=3;if(yearToo&&it.year&&r.year===String(it.year))s+=2;return s;};
  var best=list[0],bs=score(best);
  list.forEach(function(r){var sc=score(r);if(sc>bs){best=r;bs=sc;}});
  return best;
}
function lookupCover(sec,it){
  var ctl=new AbortController();
  var p,ms=15000;
  if(sec==='books'){
    ms=25000;
    var t=String(it.title||'').replace(/\s*\([^)]*#[^)]*\)\s*$/,''),au=String(it.creator||'').split(/\s*[,&]\s*|\s+and\s+/i)[0];
    var u='https://openlibrary.org/search.json?q='+encodeURIComponent((t+' '+au).trim())+'&limit=3&fields=key,cover_i,first_publish_year,number_of_pages_median';
    p=fetch(u,{signal:ctl.signal}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(function(j){var d=(j.docs||[]).find(function(x){return x.cover_i;});if(!d)return null;
      return {cover:'https://covers.openlibrary.org/b/id/'+d.cover_i+'-L.jpg',year:d.first_publish_year?String(d.first_publish_year):'',pages:d.number_of_pages_median||0,olKey:d.key};});
  }else if(sec==='music'){
    p=searchAlbums(it.title+' '+(it.creator||''),ctl.signal).then(function(r){var m=pickBest(r.slice(0,5),it);return m&&m.cover?{cover:m.cover,year:m.year,creator:m.creator}:null;});
  }else if(sec==='videos'){
    if(!isPodcast(it))return Promise.resolve(null);
    p=searchPodcasts(it.title+(it.creator?' '+it.creator:''),ctl.signal,5).then(function(r){
      if(!r.length&&it.creator)return searchPodcasts(it.title,ctl.signal,5);return r;})
      .then(function(r){var m=pickBest(r,it);return m&&m.cover?{cover:m.cover,creator:m.creator}:null;});
  }else if(isSeries(it)){
    p=fetch('https://api.tvmaze.com/singlesearch/shows?q='+encodeURIComponent(it.title),{signal:ctl.signal}).then(function(r){if(r.status===404)return null;if(!r.ok)throw new Error(r.status);return r.json();}).then(function(s){if(!s||!s.image)return null;return {cover:s.image.original||s.image.medium,year:(s.premiered||'').slice(0,4),tvmazeId:s.id};});
  }else{
    p=searchMovies(it.title,ctl.signal).then(function(r){var m=pickBest(r.slice(0,5),it,true);return m&&m.cover?{cover:m.cover,year:m.year,creator:m.creator}:null;});
  }
  return withTimeout(p,ms,ctl);
}
function applyFound(it,f){
  if(f&&f.cover){it.cover=f.cover;if(f.year&&!it.year)it.year=f.year;if(f.pages&&!it.pages)it.pages=f.pages;if(f.olKey&&!it.olKey)it.olKey=f.olKey;if(f.tvmazeId&&!it.tvmazeId)it.tvmazeId=f.tvmazeId;if(f.creator&&!it.creator)it.creator=f.creator;delete it.coverTried;delete it.coverErr;return true;}
  it.coverTried=Date.now();delete it.coverErr;return false;
}
function findCovers(){
  if(coverJob)return;
  var V=VIEWS[ui.tab];if(!V)return;var sec=V.sec;
  var queue=viewItems(ui.tab).filter(function(i){return !i.cover;});
  if(!queue.length)return;
  coverJob={sec:sec,total:queue.length,done:0,found:0};renderShelf();
  var i=0;
  function next(){
    if(i>=queue.length)return Promise.resolve();
    var it=queue[i++];
    return lookupCover(sec,it).then(function(f){if(applyFound(it,f)){coverJob.found++;patchCover(sec,it);}},function(){it.coverTried=Date.now();it.coverErr=true;}).then(function(){coverJob.done++;save();renderShelf();return new Promise(function(r){setTimeout(r,sec==='books'?150:700);}).then(next);});
  }
  var lanes=sec==='books'?3:1,ps=[];for(var l=0;l<lanes;l++)ps.push(next());
  Promise.all(ps).then(function(){var f=coverJob.found,t=coverJob.total;coverJob=null;save();renderAll();toast('Found '+f+' of '+t+' covers'+(f<t?' — the rest keep their designed covers':'')+'.');});
}

/* Background cover finder: anything without art gets looked up quietly, a few at a time per service,
   and the result is cached on the item. Misses are remembered (coverTried) so we don't re-ask every load. */
var AUTO_RETRY=30*864e5,AUTO_RETRY_ERR=864e5;
var AUTO={ol:{q:[],busy:0,conc:2,gap:300,pause:0},tv:{q:[],busy:0,conc:1,gap:600,pause:0},it:{q:[],busy:0,conc:1,gap:1300,pause:0},im:{q:[],busy:0,conc:1,gap:500,pause:0}};
var autoQueued={},autoT=null;
function coverLane(sec,it){if(sec==='books')return 'ol';if(sec==='screen')return isSeries(it)?'tv':'im';if(sec==='music')return 'it';if(sec==='videos'&&isPodcast(it))return 'it';return null;}
function wantsCover(sec,it){
  if(!it||it.cover||!String(it.title||'').trim()||/^Untitled /.test(it.title))return false;
  if(!coverLane(sec,it))return false;
  if(drawerRef&&drawerRef.sec===sec&&drawerRef.id===it.id)return false;   // still being edited
  if(it.coverTried&&Date.now()-it.coverTried<(it.coverErr?AUTO_RETRY_ERR:AUTO_RETRY))return false;
  return true;
}
function autoCoversSoon(){clearTimeout(autoT);autoT=setTimeout(autoCovers,1200);}
function autoCovers(){
  if(coverJob)return;
  var rank={progress:0,want:1,done:2},jobs=[];
  ['books','screen','music','videos'].forEach(function(sec){(data[sec]||[]).forEach(function(it){
    if(!wantsCover(sec,it))return;var k=sec+'|'+it.id;if(autoQueued[k])return;
    jobs.push({sec:sec,id:it.id,k:k,lane:coverLane(sec,it),r:rank[normStatus(it.status)]});});});
  jobs.sort(function(a,b){return a.r-b.r;});   // what's on screen first: in progress, then queues, then finished
  jobs.forEach(function(j){autoQueued[j.k]=1;AUTO[j.lane].q.push(j);});
  Object.keys(AUTO).forEach(pumpAuto);
}
function pumpAuto(lane){
  var L=AUTO[lane];
  while(L.busy<L.conc&&L.q.length){var j=L.q.shift();L.busy++;runAuto(lane,j);}
}
function runAuto(lane,j){
  var L=AUTO[lane],it=findItem(j.sec,j.id);
  function done(requeue){var wait=Math.max(L.gap,L.pause-Date.now());setTimeout(function(){L.busy--;if(requeue)L.q.push(j);else delete autoQueued[j.k];pumpAuto(lane);},wait);}
  if(!wantsCover(j.sec,it)||coverJob){L.busy--;delete autoQueued[j.k];pumpAuto(lane);return;}
  lookupCover(j.sec,it).then(function(f){
    var cur=findItem(j.sec,j.id);if(!cur||cur.cover)return;
    if(applyFound(cur,f))patchCover(j.sec,cur);
    save();
  },function(e){
    L.pause=Date.now()+(lane==='ol'?4000:20000);   // likely a hiccup or rate limit: back off this service
    if(!j.retried){j.retried=1;return true;}       // one more try later this session
    var cur=findItem(j.sec,j.id);if(cur&&!cur.cover){cur.coverTried=Date.now();cur.coverErr=true;save();}
  }).then(done);
}

/* ── CSV IMPORT (Goodreads / Letterboxd) ── */
function parseCSV(text){
  text=String(text).replace(/^﻿/,'');
  var rows=[],row=[],f='',q=false,i=0,c,n=text.length;
  for(;i<n;i++){
    c=text[i];
    if(q){
      if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}
      else f+=c;
    }else if(c==='"'){q=true;}
    else if(c===','){row.push(f);f='';}
    else if(c==='\r'){if(text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}
    else f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  rows=rows.filter(function(r){return r.some(function(x){return x.trim()!=='';});});
  if(!rows.length)return {head:[],recs:[]};
  var head=rows[0].map(function(h){return h.trim().toLowerCase();});
  var recs=rows.slice(1).map(function(r){var o={};head.forEach(function(h,j){o[h]=(r[j]==null?'':r[j]).trim();});return o;});
  return {head:head,recs:recs};
}
function cleanIsbn(v){return String(v||'').replace(/^=/,'').replace(/"/g,'').replace(/[^0-9Xx]/g,'');}
function grDate(v){var m=/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/.exec(String(v||''));return m?m[1]+'-'+pad(m[2])+'-'+pad(m[3]):'';}
function stripHtml(s){var d=document.createElement('div');d.innerHTML=String(s||'').replace(/<br\s*\/?>/gi,'\n');return (d.textContent||'').trim();}
var CAT_LOOKUP={};allCats('books').forEach(function(c){CAT_LOOKUP[c.toLowerCase().replace(/[^a-z]/g,'')]=c;});
Object.assign(CAT_LOOKUP,{scifi:'Sci-Fi',sciencefiction:'Sci-Fi',ya:'Young Adult',youngadult:'Young Adult',nonfiction:'Nonfiction',selfhelp:'Self-Help',classics:'Classic',memoir:'Biography',memoirs:'Biography',thrillers:'Thriller',mystery:'Thriller',essay:'Essays',romances:'Romance',biographies:'Biography',philosophy:'Philosophy'});
function grCategory(shelves){
  var s=String(shelves||'').split(/\s*,\s*/);
  for(var i=0;i<s.length;i++){var k=s[i].toLowerCase().replace(/[^a-z]/g,'');if(CAT_LOOKUP[k])return CAT_LOOKUP[k];}
  return 'Other';
}
function planGoodreads(recs){
  var GRS={'read':'done','currently-reading':'progress','to-read':'want'};
  var out=[],other=0;
  recs.forEach(function(r){
    var title=r['title'];if(!title)return;
    var shelf=(r['exclusive shelf']||'').toLowerCase();
    var st=GRS[shelf];if(!st){st='want';other++;}
    var series='',m=/\s*\(([^)]*#[^)]*)\)\s*$/.exec(title);if(m){series=m[1];title=title.slice(0,m.index).trim();}
    var isbn=cleanIsbn(r['isbn13'])||cleanIsbn(r['isbn']);
    var added=grDate(r['date added']);
    out.push({title:title,creator:r['author']||'',status:st,rating:Math.min(5,num(r['my rating'])),pages:num(r['number of pages']),
      year:r['original publication year']||r['year published']||'',date:st==='done'?grDate(r['date read']):'',isbn:isbn,grId:r['book id']||'',series:series,
      review:stripHtml(r['my review']),category:grCategory(r['bookshelves']),addedAt:added?new Date(added+'T12:00:00').getTime():0,
      cover:isbn?'https://covers.openlibrary.org/b/isbn/'+isbn+'-M.jpg?default=false':'',
      link:r['book id']?'https://www.goodreads.com/book/show/'+encodeURIComponent(r['book id']):''});
  });
  return {sec:'books',source:'Goodreads',items:out,other:other};
}
function planLetterboxd(recs,head,fname,asWatchlist){
  var hasRating=head.indexOf('rating')>=0,hasWatched=head.indexOf('watched date')>=0;
  var watchlist=asWatchlist!=null?asWatchlist:(/watchlist/i.test(fname||'')&&!hasRating&&!hasWatched);
  var map={};
  recs.forEach(function(r){
    var title=r['name'];if(!title)return;
    var k=normTitle(title)+'|'+(r['year']||'');
    var date=grDate(r['watched date']||r['date']);
    var rt=r['rating']?Math.max(1,Math.min(5,Math.round(parseFloat(r['rating'])))):0;
    var prev=map[k];
    if(prev){if(date>prev.date)prev.date=date;if(rt)prev.rating=rt;return;}
    map[k]={title:title,creator:'',year:r['year']||'',status:watchlist?'want':'done',rating:rt,date:watchlist?'':date,category:'Movie',kind:'movie',
      link:safeUrl(r['letterboxd uri']),lbUri:r['letterboxd uri']||'',addedAt:watchlist&&date?new Date(date+'T12:00:00').getTime():0};
  });
  return {sec:'screen',source:'Letterboxd',items:Object.keys(map).map(function(k){return map[k];}),watchlist:watchlist,canToggle:!hasRating&&!hasWatched};
}
function dedupeKey(sec,x){return sec==='books'?normTitle(x.title)+'|'+normAuthor(x.creator):normTitle(x.title);}
function annotatePlan(plan){
  var sec=plan.sec,idx={};
  data[sec].forEach(function(it){idx[dedupeKey(sec,it)]=it;if(sec==='screen'&&it.year)idx[normTitle(it.title)+'#'+it.year]=it;});
  var upd=0;
  plan.items.forEach(function(x){
    var ex=sec==='screen'?(x.year&&idx[normTitle(x.title)+'#'+x.year])||idx[dedupeKey(sec,x)]:idx[dedupeKey(sec,x)];
    if(ex&&sec==='screen'&&ex.year&&x.year&&String(ex.year)!==String(x.year))ex=null;
    x._ex=ex?ex.id:null;if(ex)upd++;
  });
  plan.updates=upd;plan.counts={want:0,progress:0,done:0};
  plan.items.forEach(function(x){plan.counts[x.status]++;});
  return plan;
}
function commitPlan(plan){
  var sec=plan.sec,added=0,updated=0,base=Date.now();
  plan.items.forEach(function(x,i){
    var ex=x._ex?findItem(sec,x._ex):null;
    var clean={};Object.keys(x).forEach(function(k){if(k[0]!=='_')clean[k]=x[k];});
    if(ex){
      ex.status=clean.status;
      if(clean.rating)ex.rating=clean.rating;
      if(clean.date)ex.date=clean.date;
      ['pages','year','isbn','grId','series','lbUri','kind'].forEach(function(k){if(clean[k]&&!ex[k])ex[k]=clean[k];});
      if(clean.review)ex.review=clean.review;
      if(clean.cover&&!ex.cover)ex.cover=clean.cover;
      if(clean.link&&!ex.link)ex.link=clean.link;
      if(ex.status==='progress'&&!ex.startedAt)ex.startedAt=todayStr();
      if(ex.status==='done'&&sec==='books'&&ex.pages)ex.progress=ex.pages;
      updated++;
    }else{
      if(!clean.addedAt)clean.addedAt=base-i;
      var it=addItemRaw(sec,clean);
      if(it.status==='progress')it.startedAt=it.startedAt||todayStr();
      if(it.status==='done'&&sec==='books'&&it.pages)it.progress=it.pages;
      added++;
    }
  });
  save();
  return {added:added,updated:updated};
}
function addItemRaw(sec,fields){
  var it={id:uid()+Math.random().toString(36).slice(2,5),title:'',creator:'',category:allCats(sec)[0],status:'want',rating:0,cover:'',link:'',note:'',date:'',pages:0};
  if(sec==='screen'){it.season=1;it.episode=1;it.seasonsTotal=0;}
  Object.keys(fields).forEach(function(k){if(fields[k]!==undefined&&fields[k]!==''&&fields[k]!==null)it[k]=fields[k];});
  data[sec].push(it);return it;
}
var imp={src:'goodreads',plan:null,parsed:null,fname:''};
function openImport(src){imp={src:src||'goodreads',plan:null,parsed:null,fname:''};renderImport();document.getElementById('import-bg').classList.add('open');}
function closeImport(){document.getElementById('import-bg').classList.remove('open');}
function renderImport(){

  if(!imp.plan){
    h+='<div class="modal-s">Drop in a CSV export and your shelves fill themselves in — ratings, dates, reviews and all. Nothing leaves your browser.</div>';
    h+='<div class="src-tabs"><button class="fchip'+(imp.src==='goodreads'?' on':'')+'" data-act="impsrc" data-v="goodreads">Goodreads</button><button class="fchip'+(imp.src==='letterboxd'?' on':'')+'" data-act="impsrc" data-v="letterboxd">Letterboxd</button></div>';
    h+='<div class="drop" id="drop" data-act="pick"><div class="big">'+(imp.src==='goodreads'?IC_BOOK:IC_FILM)+'</div><div class="drop-t">Drop your '+(imp.src==='goodreads'?'goodreads_library_export.csv':'Letterboxd CSV')+' here</div><div class="drop-s">or click to choose a file</div></div>';
    h+=imp.src==='goodreads'?'<div class="howto"><b>Where to find it:</b> on goodreads.com go to <b>My Books → Import and export</b> (left sidebar, under Tools) → <b>Export Library</b>. After a minute a download link appears.</div>'
      :'<div class="howto"><b>Where to find it:</b> on letterboxd.com go to <b>Settings → Import &amp; Export → Export your data</b>. Unzip it and drop in <b>diary.csv</b> or <b>watched.csv</b> (or <b>watchlist.csv</b> for your want-to-watch list).</div>';
    if(imp.err)h+='<div class="imp-note" style="color:var(--over);margin-top:12px">'+esc(imp.err)+'</div>';
  }else{
    var p=imp.plan,S=SECTIONS[p.sec],c=p.counts;
    h+='<div class="modal-s">Found <b>'+p.items.length+' '+(p.sec==='books'?'books':'films')+'</b> in <b>'+esc(imp.fname)+'</b>.</div>';
    var prev=p.items.filter(function(x){return x.status!=='want';}).slice(0,10);if(prev.length<10)prev=prev.concat(p.items.filter(function(x){return x.status==='want';}).slice(0,10-prev.length));
    h+='<div class="prev-strip">'+prev.map(function(x){return coverHTML(x,p.sec);}).join('')+'</div>';
    h+='<div class="sum">'+[['done',S.statuses[2].label],['progress',S.statuses[1].label],['want',S.statuses[0].label]].map(function(s){return '<div><b>'+c[s[0]]+'</b><span>'+s[1]+'</span></div>';}).join('')+'</div>';
    if(p.canToggle)h+='<div class="lb-opt">This file is my <button class="fchip'+(!p.watchlist?' on':'')+'" data-act="lbmode" data-v="0">Watched films</button><button class="fchip'+(p.watchlist?' on':'')+'" data-act="lbmode" data-v="1">Watchlist</button></div>';
    if(p.updates)h+='<div class="imp-note">'+p.updates+' already on your shelves — those get updated (status, rating, dates) instead of duplicated.</div>';
    if(p.other)h+='<div class="imp-note">'+p.other+' on custom shelves will land in '+S.statuses[0].label+'.</div>';
    if(p.sec==='books')h+='<div class="imp-note">Covers come from Open Library by ISBN; anything without one gets a designed cover.</div>';
    h+='<div class="modal-acts"><button class="btn" data-act="impback">Choose another file</button><button class="btn pri" data-act="impgo">Import '+p.items.length+'</button></div>';
  }
  el.innerHTML=h;
  var drop=document.getElementById('drop');
  if(drop){
    ['dragenter','dragover'].forEach(function(t){drop.addEventListener(t,function(e){e.preventDefault();drop.classList.add('over');});});
    ['dragleave','drop'].forEach(function(t){drop.addEventListener(t,function(e){e.preventDefault();drop.classList.remove('over');});});
    drop.addEventListener('drop',function(e){var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)readImportFile(f);});
  }
}
function readImportFile(file){
  var rd=new FileReader();
  rd.onload=function(){handleImportText(String(rd.result||''),file.name||'export.csv');};
  rd.onerror=function(){imp.err='Couldn’t read that file.';renderImport();};
  rd.readAsText(file);
}
function handleImportText(text,fname){
  var parsed=parseCSV(text);imp.fname=fname;imp.err='';
  var hd=parsed.head;
  if(hd.indexOf('exclusive shelf')>=0||(hd.indexOf('book id')>=0&&hd.indexOf('title')>=0)){imp.src='goodreads';imp.plan=annotatePlan(planGoodreads(parsed.recs));}
  else if(hd.indexOf('name')>=0&&(hd.indexOf('letterboxd uri')>=0||hd.indexOf('year')>=0)){imp.src='letterboxd';imp.parsed=parsed;imp.plan=annotatePlan(planLetterboxd(parsed.recs,hd,fname));}
  else{imp.plan=null;imp.err='That doesn’t look like a Goodreads or Letterboxd export — expected columns like “Title, Author, Exclusive Shelf” or “Name, Year, Letterboxd URI”.';}
  if(imp.plan&&!imp.plan.items.length){imp.plan=null;imp.err='The file had headers but no rows.';}
  renderImport();
}
function commitImport(){
  var p=imp.plan;if(!p)return;
  var r=commitPlan(p);closeImport();
  ui.tab=p.sec;ui.status='all';ui.cat='all';ui.year='all';ui.q='';saveUI();renderAll();
  window.scrollTo({top:0,behavior:'smooth'});
  toast('Imported from '+p.source+': <i>'+r.added+' added</i>'+(r.updated?', '+r.updated+' updated':'')+'.');
}

var toastT=null,toastActs=[];
function toast(html,acts,ms){
  var el=document.getElementById('toast');toastActs=acts||[];
  el.innerHTML='<span>'+html+'</span>'+toastActs.map(function(a,i){return a.html?a.html:'<button data-act="toast" data-i="'+i+'">'+esc(a.label)+'</button>';}).join('');
  el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('show');},ms||5200);
}
function toastRate(sec,it,msg){
  toast(msg+' · <i>'+esc(it.title)+'</i>',[{html:starsHTML(sec,it)}],7000);
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el){if(!e.target.closest('#add-wrap'))closeResults();return;}
  var act=el.getAttribute('data-act'),sec=el.getAttribute('data-sec'),id=el.getAttribute('data-id');
  if(act!=='radd'&&act!=='rman'&&act!=='ropen'&&!e.target.closest('#add-wrap'))closeResults();
  switch(act){
    case 'noop':return;
    case 'open':openDrawer(sec,id);break;
    case 'close':closeDrawer();break;
    case 'start':e.stopPropagation();setStatus(sec,id,'progress');toast('Started <i>'+esc(findItem(sec,id).title)+'</i> — it’s up top now.');break;
    case 'finish':setStatus(sec,id,'done',{inline:true});break;
    case 'unfin':delete justFinished[sec+':'+id];renderAll();break;
    case 'rate':
      if(!sec&&drawerRef){sec=drawerRef.sec;id=drawerRef.id;}
      rate(sec,id,+el.getAttribute('data-n'));
      if(el.closest('#toast')){var tst=document.getElementById('toast');tst.querySelectorAll('.stars b').forEach(function(b,i){b.classList.toggle('on',i<+el.getAttribute('data-n'));});clearTimeout(toastT);toastT=setTimeout(function(){tst.classList.remove('show');},1200);}
      break;
    case 'pg+':bumpPages(sec,id,+el.getAttribute('data-n'));break;
    case 'ep':stepEp(sec,id,el.getAttribute('data-f'),+el.getAttribute('data-d'));break;
    case 'vep':var v=findItem(sec,id);if(v){v.epCurrent=Math.max(0,(v.epCurrent||0)+(+el.getAttribute('data-d')));if(v.epCurrent&&v.status==='want'){v.status='progress';if(!v.startedAt)v.startedAt=todayStr();}save();renderNow();renderShelf();}break;
    case 'pgfocus':var pe=el.closest('.nc')&&el.closest('.nc').querySelector('.pg-in');if(pe){pe.focus();pe.select();}break;
    case 'goto':ui.tab=el.getAttribute('data-tab');ui.status=el.getAttribute('data-v')||'all';ui.cat='all';ui.year='all';ui.q='';saveUI();renderAll();window.scrollTo({top:0,behavior:'smooth'});break;
    case 'cycle':var it=findItem(sec,id);if(it){var o=['want','progress','done'];setStatus(sec,id,o[(o.indexOf(normStatus(it.status))+1)%3],{quiet:true});}break;
    case 'tab':ui.tab=el.getAttribute('data-tab');ui.status='all';ui.cat='all';ui.year='all';ui.q='';saveUI();renderAll();break;
    case 'fst':ui.status=el.getAttribute('data-v');renderShelf();break;
    case 'clearf':ui.status='all';ui.cat='all';ui.year='all';ui.q='';renderShelf();break;
    case 'yr':reviewYear+=+el.getAttribute('data-d');renderShelf();break;
    case 'findcovers':findCovers();break;
    case 'findone':findOne();break;
    case 'newitem':newItem();break;
    case 'radd':e.stopPropagation();addFromResult(+el.getAttribute('data-k'),el.getAttribute('data-st'));break;
    case 'rman':addManual(+el.getAttribute('data-k'));break;
    case 'ropen':var fl=flat[+el.getAttribute('data-k')];if(fl){document.getElementById('add-q').value='';closeResults();openDrawer(fl.sec,fl.id);}break;
    case 'dst':if(drawerRef){setStatus(drawerRef.sec,drawerRef.id,el.getAttribute('data-v'),{quiet:true});renderDrawer();}break;
    case 'fav':if(drawerRef){var fi=findItem(drawerRef.sec,drawerRef.id);fi.fav=!fi.fav;save();renderDrawer();renderAll();}break;
    case 'del':
      if(!drawerRef)break;
      if(!delArm){delArm=setTimeout(function(){delArm=null;renderDrawer();},3500);renderDrawer();break;}
      clearTimeout(delArm);delArm=null;
      var ds=drawerRef.sec,di=drawerRef.id,snap=JSON.parse(JSON.stringify(findItem(ds,di))),pos=data[ds].findIndex(function(i){return i.id===di;});
      data[ds].splice(pos,1);save();closeDrawer();
      toast('Deleted <i>'+esc(snap.title)+'</i>',[{label:'Undo',fn:function(){data[ds].splice(pos,0,snap);save();renderAll();}}]);
      break;
    case 'songadd':if(drawerRef){var m=findItem('music',drawerRef.id);if(!m.songs)m.songs=[];m.songs.push({name:'',fav:false});save();renderDrawer();var ins=document.querySelectorAll('#drawer [data-song]');if(ins.length)ins[ins.length-1].focus();}break;
    case 'songfav':if(drawerRef){var m2=findItem('music',drawerRef.id),si=+el.getAttribute('data-i');if(m2.songs[si]){m2.songs[si].fav=!m2.songs[si].fav;save();renderDrawer();}}break;
    case 'songdel':if(drawerRef){var m3=findItem('music',drawerRef.id);m3.songs.splice(+el.getAttribute('data-i'),1);save();renderDrawer();}break;
    case 'import':openImport(el.getAttribute('data-src'));break;
    case 'impclose':closeImport();break;
    case 'impsrc':imp.src=el.getAttribute('data-v');imp.err='';renderImport();break;
    case 'pick':document.getElementById('file-in').click();break;
    case 'impback':imp.plan=null;renderImport();break;
    case 'impgo':commitImport();break;
    case 'lbmode':if(imp.parsed){imp.plan=annotatePlan(planLetterboxd(imp.parsed.recs,imp.parsed.head,imp.fname,el.getAttribute('data-v')==='1'));renderImport();}break;
    case 'toast':var ta=toastActs[+el.getAttribute('data-i')];document.getElementById('toast').classList.remove('show');if(ta&&ta.fn)ta.fn();break;
  }
});

  if(!k)return;

  else if(k==='cat'){ui.cat=t.value;renderShelf();}
  else if(k==='year'){ui.year=t.value;renderShelf();}
  else if(k==='sort'){ui.sort=t.value;saveUI();renderShelf();}
});

document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.classList&&(e.target.classList.contains('pg-in')||e.target.classList.contains('dr-title')||e.target.classList.contains('goal-in'))){e.preventDefault();e.target.blur();return;}
  if(e.key==='Escape'){
    if(document.getElementById('import-bg').classList.contains('open')){closeImport();return;}
    if(drawerRef){closeDrawer();return;}
    if(res){closeResults();document.getElementById('add-q').blur();return;}
    return;
  }
  if(e.key==='/'&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!ipt(document.activeElement)){
    e.preventDefault();var q=document.getElementById('add-q');q.focus();q.select();window.scrollTo({top:0,behavior:'smooth'});
  }
});

addQ.addEventListener('input',onAddInput);

addQ.addEventListener('keydown',function(e){
  if(!res||!flat.length)return;
  if(e.key==='ArrowDown'){e.preventDefault();hl=Math.min(flat.length-1,hl+1);renderResults();}
  else if(e.key==='ArrowUp'){e.preventDefault();hl=Math.max(-1,hl-1);renderResults();}

    e.preventDefault();
    var k=hl>=0?hl:flat.findIndex(function(f){return f.type==='res';});

  }
});
