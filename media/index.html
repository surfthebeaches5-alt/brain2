<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f3ecd8; --surface: #ffffff; --sidebar: #f8f1dd;
  --sidebar-line: #e6dec5; --ink: #1a1612; --muted: #7a7468;
  --line: #ececec; --warm: #faf6ec;
  --accent: #c9b6ee; --accent-deep: #b099e0; --accent-soft: #ede5fb;
}
html,body { background:var(--bg); font-family:'Plus Jakarta Sans',system-ui,sans-serif; color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased; }

/* ── TOPBAR ── */
.topbar { background:var(--sidebar); border-bottom:1px solid var(--sidebar-line); padding:16px 32px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:200; }
.topbar-left { display:flex; align-items:center; gap:14px; }
.back-btn { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border:1.5px solid #d9d2bd; border-radius:20px; font-size:12px; color:var(--muted); cursor:pointer; background:transparent; font-family:inherit; text-decoration:none; transition:all .15s; }
.back-btn:hover { border-color:var(--accent-deep); color:var(--ink); }
.topbar-title { font-family:'Fraunces',serif; font-size:22px; font-weight:600; letter-spacing:-0.4px; }
.topbar-date { font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); font-weight:500; }

/* ── TABS ── */
.section-tabs { background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:57px; z-index:100; display:flex; overflow-x:auto; padding:0 24px; }
.section-tab { padding:14px 22px; font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer; border:none; background:transparent; color:var(--muted); border-bottom:2.5px solid transparent; margin-bottom:-1px; transition:all .15s; white-space:nowrap; }
.section-tab:hover { color:var(--ink); }
.section-tab.active { color:var(--ink); border-bottom-color:var(--accent-deep); }

/* ── HUB ── */
.hub { max-width:1240px; margin:0 auto; padding:24px 24px 60px; }

/* ── STATS BAR ── */
.stats-bar { display:flex; gap:18px; flex-wrap:wrap; margin-bottom:18px; padding:16px 22px; background:var(--surface); border:1px solid var(--line); border-radius:18px; align-items:center; }
.stat { text-align:center; }
.stat-num { font-family:'Fraunces',serif; font-size:26px; font-weight:600; color:var(--ink); line-height:1; letter-spacing:-.5px; }
.stat-label { font-size:9.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin-top:4px; font-weight:600; }
.stat-divider { width:1px; height:36px; background:var(--line); flex-shrink:0; }
.year-badges { display:flex; gap:8px; flex-wrap:wrap; margin-left:auto; }
.year-badge { padding:6px 14px; border-radius:14px; font-size:11px; font-weight:600; background:var(--accent-soft); border:1.5px solid var(--accent); color:var(--ink); display:inline-flex; align-items:center; gap:6px; }
.year-badge span { color:var(--accent-deep); font-family:'Fraunces',serif; font-size:16px; font-weight:600; }

/* ── CONTROLS ── */
.controls-wrap { margin-bottom:22px; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px 18px; }
.filter-group { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
.filter-group:last-of-type { margin-bottom:0; }
.filter-group-label { font-size:9.5px; letter-spacing:1.8px; text-transform:uppercase; color:var(--muted); font-weight:700; min-width:64px; }
.filter-btn { padding:5px 12px; border:1.5px solid var(--line); border-radius:14px; background:var(--surface); font-family:inherit; font-size:11.5px; font-weight:600; cursor:pointer; color:var(--muted); transition:all .15s; white-space:nowrap; }
.filter-btn:hover { border-color:var(--accent-deep); color:var(--ink); }
.filter-btn.active { background:var(--ink); border-color:var(--ink); color:#fff; }
.filter-select { padding:6px 28px 6px 12px; border:1.5px solid var(--line); border-radius:14px; background:var(--surface); font-family:inherit; font-size:12px; font-weight:600; color:var(--ink); cursor:pointer; appearance:none; background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%237a7468' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E"); background-repeat:no-repeat; background-position:right 10px center; transition:border .15s; outline:none; min-width:140px; }
.filter-select:focus { border-color:var(--accent-deep); }
.controls-row2 { display:flex; align-items:center; gap:10px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
.search-input { padding:8px 14px; border:1.5px solid var(--line); border-radius:18px; font-family:inherit; font-size:13px; color:var(--ink); background:var(--surface); outline:none; transition:border .15s; min-width:220px; }
.search-input:focus { border-color:var(--accent-deep); }
.add-btn { margin-left:auto; padding:9px 20px; border:none; border-radius:22px; background:var(--ink); color:#fff; font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer; transition:transform .15s; }
.add-btn:hover { transform:translateY(-1px); }

/* ── GRID CARDS ──
   NOTE: NO overflow:hidden here — that was clipping the ··· dropdown.
   Card cover gets top border-radius instead to clip the image corners.
── */
.media-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; }
.media-card { background:var(--surface); border:1px solid var(--line); border-radius:16px; display:flex; flex-direction:column; transition:transform .15s,box-shadow .15s; position:relative; cursor:pointer; }
.media-card:hover { transform:translateY(-3px); box-shadow:0 12px 28px rgba(0,0,0,.08); }
.media-card.done { opacity:0.72; }
.card-cover { width:100%; height:220px; display:flex; align-items:center; justify-content:center; background:var(--warm); flex-shrink:0; overflow:hidden; border-radius:14px 14px 0 0; }
.card-cover img { width:100%; height:100%; object-fit:cover; }
.card-cover-placeholder { font-size:3rem; }
.card-body { padding:13px 14px; flex:1; display:flex; flex-direction:column; gap:4px; }
.card-category { font-size:9.5px; letter-spacing:1.8px; text-transform:uppercase; color:var(--muted); font-weight:700; }
.card-title { font-family:'Fraunces',serif; font-size:16px; font-weight:600; line-height:1.25; letter-spacing:-.2px; }
.card-title-link { font-family:'Fraunces',serif; font-size:16px; font-weight:600; line-height:1.25; letter-spacing:-.2px; color:var(--ink); text-decoration:none; }
.card-title-link:hover { color:var(--accent-deep); text-decoration:underline; text-underline-offset:3px; }
.card-creator { font-size:11.5px; color:var(--muted); }
.card-stars { display:flex; gap:2px; margin-top:4px; }
.card-star { font-size:14px; cursor:pointer; color:#e0d8c8; transition:color .1s; }
.card-star.filled { color:var(--accent-deep); }
.card-date { font-size:10.5px; color:var(--accent-deep); font-weight:600; margin-top:3px; }
.card-note { font-size:11px; color:var(--muted); line-height:1.5; font-style:italic; flex:1; margin-top:4px; }
.card-episode { font-size:11px; font-weight:700; color:var(--accent-deep); margin-top:3px; }
.card-ep-count { font-size:11px; color:var(--muted); margin-top:2px; font-weight:500; }
.card-progress { margin-top:8px; }
.card-progress-bar { height:6px; background:var(--line); border-radius:4px; overflow:hidden; margin-bottom:4px; }
.card-progress-fill { height:100%; border-radius:4px; background:linear-gradient(90deg,var(--accent),var(--accent-deep)); transition:width .3s; }
.card-progress-label { font-size:10.5px; color:var(--muted); }
.card-progress-controls { display:flex; align-items:center; gap:6px; margin-top:5px; }
.prog-btn { width:22px; height:22px; border-radius:50%; border:1.5px solid var(--line); background:var(--surface); font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--muted); transition:all .15s; font-family:inherit; }
.prog-btn:hover { border-color:var(--accent-deep); color:var(--ink); background:var(--accent-soft); }
.prog-count { font-family:'Fraunces',serif; font-size:14px; font-weight:600; color:var(--ink); min-width:32px; text-align:center; }

/* ── INLINE ALBUM SONGS ── */
.album-songs { border-top:1px solid var(--line); background:var(--warm); border-radius:0 0 14px 14px; }
.album-songs-toggle { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; cursor:pointer; user-select:none; }
.album-songs-toggle:hover { background:rgba(0,0,0,.03); border-radius:0 0 14px 14px; }
.album-songs-header { font-size:9.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); font-weight:700; display:flex; align-items:center; gap:7px; }
.album-songs-count { font-size:9.5px; color:var(--accent-deep); font-weight:700; background:var(--accent-soft); padding:2px 7px; border-radius:8px; letter-spacing:0; text-transform:none; }
.album-songs-chevron { font-size:10px; color:var(--muted); transition:transform .2s; }
.album-songs-chevron.open { transform:rotate(180deg); }
.album-songs-body { padding:0 14px 10px; display:none; }
.album-songs-body.open { display:block; }
.album-song-row { display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid var(--line); }
.album-song-row:last-of-type { border-bottom:none; }
.album-song-num { font-size:10px; color:var(--muted); font-weight:700; min-width:16px; text-align:right; flex-shrink:0; }
.album-song-name { flex:1; font-size:12px; font-family:inherit; color:var(--ink); border:none; background:transparent; outline:none; min-width:0; }
.album-song-name::placeholder { color:#c9beb4; font-style:italic; }
.album-song-name:focus { border-bottom:1.5px solid var(--accent-deep); }
.album-song-stars { display:flex; gap:1px; flex-shrink:0; }
.album-song-star { font-size:12px; cursor:pointer; color:#e0d8c8; transition:color .1s; line-height:1; }
.album-song-star.filled { color:var(--accent-deep); }
.album-song-del { background:none; border:none; font-size:10px; color:#ccc; cursor:pointer; padding:2px 3px; flex-shrink:0; transition:color .1s; }
.album-song-del:hover { color:#c44; }
.album-add-song { margin-top:8px; width:100%; padding:7px; border:1.5px dashed var(--line); border-radius:10px; font-size:11.5px; font-weight:600; color:var(--muted); background:transparent; cursor:pointer; font-family:inherit; transition:all .15s; }
.album-add-song:hover { border-color:var(--accent-deep); color:var(--accent-deep); background:var(--accent-soft); }

/* ── STATUS CYCLE BUTTON (one button = current status, click to advance) ── */
.status-cycle-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:14px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid transparent;font-family:inherit;transition:all .15s;white-space:nowrap;}
.status-cycle-btn:hover{filter:brightness(.95);transform:translateY(-1px);}
.scb-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.6;flex-shrink:0;}
/* ── CARD ACTIONS ── */
.card-actions { display:flex; align-items:center; gap:6px; padding:10px 12px; border-top:1px solid var(--line); background:var(--warm); border-radius:0 0 14px 14px; flex-wrap:wrap; }
.cycle-btn { padding:6px 12px; border:1.5px solid var(--accent); border-radius:14px; font-family:inherit; font-size:11px; font-weight:700; cursor:pointer; background:var(--accent-soft); color:var(--accent-deep); transition:all .15s; white-space:nowrap; }
.cycle-btn:hover { background:var(--accent); color:var(--ink); }
.open-link-btn { padding:6px 12px; border:1.5px solid var(--line); border-radius:14px; font-family:inherit; font-size:11px; font-weight:600; cursor:pointer; background:var(--surface); color:var(--muted); transition:all .15s; text-decoration:none; display:inline-flex; align-items:center; gap:4px; }
.open-link-btn:hover { border-color:var(--accent-deep); color:var(--ink); background:var(--accent-soft); }

/* ── DOTS MENU (works now that card has no overflow:hidden) ── */
.dots-wrap { position:relative; margin-left:auto; flex-shrink:0; }
.dots-btn { width:30px; height:30px; border-radius:50%; border:1.5px solid var(--line); background:var(--surface); cursor:pointer; font-size:14px; color:var(--muted); display:flex; align-items:center; justify-content:center; transition:all .15s; font-family:inherit; letter-spacing:1px; }
.dots-btn:hover { border-color:var(--accent-deep); color:var(--ink); background:var(--accent-soft); }
.dots-menu { position:absolute; right:0; bottom:calc(100% + 5px); background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:0 -8px 24px rgba(0,0,0,.1); min-width:130px; overflow:hidden; display:none; z-index:50; }
.dots-menu.open { display:block; animation:popIn .15s; }
@keyframes popIn { from{opacity:0;transform:scale(.95) translateY(4px)} to{opacity:1;transform:scale(1) translateY(0)} }
.dots-item { display:flex; align-items:center; gap:8px; padding:10px 14px; font-size:12px; font-weight:600; color:var(--ink); cursor:pointer; transition:background .1s; border:none; background:transparent; font-family:inherit; width:100%; text-align:left; text-decoration:none; }
.dots-item:hover { background:var(--warm); }
.dots-item.danger { color:#c44; }
.dots-item.danger:hover { background:#fce8e8; }

/* ── STATUS COLORS ── */
.status-want      { background:#fff5d6; color:#6a4a08; }
.status-progress  { background:#d8e8f8; color:#1a3a6a; }
.status-done      { background:#d8eee8; color:#1a4a44; }
.status-archived  { background:var(--warm); color:var(--muted); }

/* ── LIST CARDS (podcasts only) ── */
.list-view { display:flex; flex-direction:column; gap:8px; }
.list-card { background:var(--surface); border:1px solid var(--line); border-radius:14px; display:flex; align-items:center; gap:14px; padding:14px 16px; transition:all .15s; position:relative; cursor:pointer; }
.list-card:hover { border-color:#d9d2bd; box-shadow:0 4px 12px rgba(0,0,0,.05); }
.list-card.done { opacity:0.65; }
.list-icon { width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; background:var(--warm); border:1px solid var(--line); overflow:hidden; }
.list-icon img { width:100%; height:100%; object-fit:cover; border-radius:9px; }
.list-body { flex:1; min-width:0; }
.list-title { font-family:'Fraunces',serif; font-size:15px; font-weight:600; line-height:1.3; letter-spacing:-.2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.list-meta { font-size:11px; color:var(--muted); margin-top:2px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.list-meta-dot { width:3px; height:3px; border-radius:50%; background:var(--muted); flex-shrink:0; }
.list-ep { font-size:10.5px; font-weight:700; color:var(--accent-deep); }
.list-note { font-size:11px; color:var(--muted); font-style:italic; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.list-right { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.list-stars { display:flex; gap:1px; }
.list-star { font-size:12px; cursor:pointer; color:#e0d8c8; transition:color .1s; }
.list-star.filled { color:var(--accent-deep); }

/* ── EMPTY STATE ── */
.empty-state { text-align:center; padding:70px 20px; color:var(--muted); background:var(--surface); border:1px dashed var(--line); border-radius:18px; }
.empty-state-icon { font-size:3rem; margin-bottom:12px; }
.empty-state-text { font-family:'Fraunces',serif; font-size:22px; font-style:italic; margin-bottom:6px; color:var(--ink); }
.empty-state-sub { font-size:13px; }

/* ── STATS TAB ── */
.stats-panel { display:block; }
.stats-year-nav { display:flex; align-items:center; gap:14px; margin-bottom:24px; padding:14px 22px; background:var(--surface); border:1px solid var(--line); border-radius:18px; }
.stats-year-btn { width:30px; height:30px; border-radius:50%; border:1.5px solid var(--line); background:var(--surface); cursor:pointer; color:var(--ink); display:flex; align-items:center; justify-content:center; transition:all .15s; font-family:inherit; font-size:14px; }
.stats-year-btn:hover { background:var(--warm); }
.stats-year-label { font-family:'Fraunces',serif; font-size:22px; font-weight:600; letter-spacing:-.4px; }
.stats-note { font-size:11.5px; color:var(--muted); margin-left:auto; }
.stats-totals { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:24px; }
.stats-total-card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px; text-align:center; transition:all .15s; }
.stats-total-card:hover { border-color:var(--accent); }
.stats-total-icon { font-size:28px; margin-bottom:8px; }
.stats-total-num { font-family:'Fraunces',serif; font-size:38px; font-weight:600; color:var(--ink); line-height:1; letter-spacing:-.8px; }
.stats-total-label { font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin-top:5px; font-weight:700; }
.stats-grid-wrap { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:22px 22px 18px; margin-bottom:16px; }
.stats-grid-title { font-family:'Fraunces',serif; font-size:17px; font-weight:600; letter-spacing:-.3px; margin-bottom:18px; }
.stats-month-grid { display:grid; grid-template-columns:90px repeat(12,1fr); gap:5px; align-items:center; }
.stats-row-label { font-size:11.5px; font-weight:600; color:var(--ink); display:flex; align-items:center; gap:6px; }
.stats-month-head { font-size:9.5px; font-weight:700; text-align:center; letter-spacing:1px; text-transform:uppercase; color:var(--muted); padding-bottom:4px; }
.stats-month-head.current-month { color:var(--accent-deep); }
.stats-cell { height:38px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--ink); position:relative; }
.stats-cell.empty { background:var(--warm); color:var(--line); font-size:10px; }
.stats-cell.has-data { color:#fff; }
.stats-cell.future { background:transparent; color:var(--line); font-size:10px; border:1.5px dashed var(--line); }
.stats-cell-tip { display:none; position:absolute; bottom:calc(100% + 5px); left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; font-size:10px; font-weight:500; padding:4px 8px; border-radius:6px; white-space:nowrap; z-index:10; }
.stats-cell:hover .stats-cell-tip { display:block; }
.stats-podcast-wrap { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:20px 22px; }
.stats-podcast-title { font-family:'Fraunces',serif; font-size:17px; font-weight:600; letter-spacing:-.3px; margin-bottom:14px; }
.stats-podcast-list { display:flex; flex-direction:column; gap:10px; }
.stats-podcast-row { display:flex; align-items:center; gap:14px; padding:12px 14px; background:var(--warm); border-radius:12px; border:1px solid var(--line); }
.stats-podcast-name { font-size:13px; font-weight:600; flex:1; }
.stats-podcast-ep { font-family:'Fraunces',serif; font-size:20px; font-weight:600; color:var(--accent-deep); }
.stats-podcast-ep-label { font-size:10px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; font-weight:600; text-align:right; }
.stats-empty { text-align:center; padding:40px 20px; color:var(--muted); font-size:13px; }
.stats-empty strong { display:block; font-family:'Fraunces',serif; font-size:18px; color:var(--ink); margin-bottom:6px; }

/* ── EXTERNAL LINK BTN ── */
.ext-link-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border:1.5px solid #d9d2bd;border-radius:20px;font-family:inherit;font-size:11.5px;font-weight:600;color:var(--muted);text-decoration:none;transition:all .15s;white-space:nowrap;flex-shrink:0;background:transparent;}
.ext-link-btn:hover{border-color:var(--accent-deep);color:var(--ink);background:var(--accent-soft);}
/* ── MODAL ── */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); backdrop-filter:blur(4px); z-index:300; align-items:center; justify-content:center; padding:20px; }
.modal-overlay.open { display:flex; animation:fadeIn .2s; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.modal { background:var(--surface); border-radius:22px; border:1px solid var(--line); padding:26px 28px; width:100%; max-width:540px; max-height:90vh; overflow-y:auto; box-shadow:0 30px 60px -20px rgba(0,0,0,.3); animation:popBig .2s; }
@keyframes popBig { from{transform:scale(.95);opacity:0} to{transform:scale(1);opacity:1} }
.modal-title { font-family:'Fraunces',serif; font-size:22px; font-weight:600; margin-bottom:20px; letter-spacing:-.3px; }
.f-field { margin-bottom:14px; }
.f-label { font-size:9.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin-bottom:6px; display:block; font-weight:700; }
.f-input { width:100%; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; font-size:13px; font-family:inherit; color:var(--ink); background:var(--surface); outline:none; transition:border .15s; }

/* ── SECTION ── */
function setSection(sec){
  currentSection=sec;currentStatus='all';currentCat='all';searchQuery='';
  document.querySelectorAll('.section-tab').forEach(function(t){t.classList.remove('active');});
  document.getElementById('stab-'+sec).classList.add('active');
  var isStats=sec==='stats';
  document.getElementById('stats-bar').style.display=isStats?'none':'';
  document.getElementById('controls-wrap').style.display=isStats?'none':'';
  render();
}

/* ── FILTER ── */
function getFiltered(){
  var items=data[currentSection]||[];
  if(currentStatus!=='all') items=items.filter(function(i){return i.status===currentStatus;});
  if(currentCat!=='all')    items=items.filter(function(i){return i.category===currentCat;});
  if(searchQuery){var q=searchQuery.toLowerCase();items=items.filter(function(i){return(i.title||'').toLowerCase().includes(q)||(i.creator||'').toLowerCase().includes(q)||(i.note||'').toLowerCase().includes(q);});}
  // "Next up" sort (all tabs): in-progress first, queued second, completed last.
  // Completed items sort by completion date, most recent first.
  var order=currentSection==='podcasts'
    ? {following:0,queue:1,archived:2}
    : {progress:0,want:1,done:2};
  var doneKey=currentSection==='podcasts'?'archived':'done';
  items=items.slice().sort(function(a,b){
    var oa=order[a.status]!==undefined?order[a.status]:1;
    var ob=order[b.status]!==undefined?order[b.status]:1;
    if(oa!==ob)return oa-ob;
    // Within completed group: newest completion date first, undated last
    if(a.status===doneKey&&b.status===doneKey){
      var da=a.date||'',db=b.date||'';
      if(da&&db)return db.localeCompare(da);
      if(da)return -1;
      if(db)return 1;
    }
    return 0;
  });
  return items;
}

      var cnt=document.createElement('span');cnt.className='prog-count';cnt.textContent=lbl+(item[field]||1);
      var plus=document.createElement('button');plus.className='prog-btn';plus.textContent='+';
      plus.onclick=(function(id,f){return function(e){e.stopPropagation();var it=findItem(id);if(!it)return;it[f]=(it[f]||1)+1;save();renderGrid();};})(item.id,field);
      epWrap.appendChild(minus);epWrap.appendChild(cnt);epWrap.appendChild(plus);

/* ── INLINE ALBUM SONGS ── */
function makeAlbumSongs(item){
  var section=document.createElement('div');section.className='album-songs';
  section.onclick=function(e){e.stopPropagation();};

  var songCount=(item.songs&&item.songs.length)||0;
  // Remember open/closed state per album
  var stateKey='albumOpen_'+item.id;
  var isOpen=sessionStorage.getItem(stateKey)==='1';

  // Toggle row
  var toggle=document.createElement('div');toggle.className='album-songs-toggle';
  var headerLeft=document.createElement('div');headerLeft.className='album-songs-header';
  headerLeft.textContent='Track List';
  if(songCount>0){var countBadge=document.createElement('span');countBadge.className='album-songs-count';countBadge.textContent=songCount+' song'+(songCount!==1?'s':'');headerLeft.appendChild(countBadge);}
  var chevron=document.createElement('span');chevron.className='album-songs-chevron'+(isOpen?' open':'');chevron.textContent='▼';
  toggle.appendChild(headerLeft);toggle.appendChild(chevron);
  section.appendChild(toggle);

  // Body (hidden by default)
  var body=document.createElement('div');body.className='album-songs-body'+(isOpen?' open':'');

  function rebuildRows(){
    body.innerHTML='';
    var currentItem=(data.music||[]).find(function(i){return i.id===item.id;})||item;
    if(currentItem.songs&&currentItem.songs.length>0){
      currentItem.songs.forEach(function(song,si){
        var row=document.createElement('div');row.className='album-song-row';
        var num=document.createElement('span');num.className='album-song-num';num.textContent=si+1+'.';
        var nameInput=document.createElement('input');nameInput.className='album-song-name';nameInput.type='text';nameInput.value=song.name||'';nameInput.placeholder='Song title...';
        nameInput.oninput=(function(itemId,idx){return function(){var it=(data.music||[]).find(function(i){return i.id===itemId;});if(it&&it.songs[idx]!==undefined)it.songs[idx].name=this.value;};})(item.id,si);
        nameInput.onblur=function(){save();};
        var stars=document.createElement('div');stars.className='album-song-stars';
        for(var s=1;s<=5;s++){
          var star=document.createElement('span');star.className='album-song-star'+(s<=(song.rating||0)?' filled':'');star.textContent='★';
          star.onclick=(function(itemId,idx,sv){return function(){var it=(data.music||[]).find(function(i){return i.id===itemId;});if(!it||!it.songs[idx])return;it.songs[idx].rating=it.songs[idx].rating===sv?0:sv;save();renderGrid();};})(item.id,si,s);
          stars.appendChild(star);
        }
        var del=document.createElement('button');del.className='album-song-del';del.textContent='✕';
        del.onclick=(function(itemId,idx){return function(){var it=(data.music||[]).find(function(i){return i.id===itemId;});if(!it)return;it.songs.splice(idx,1);save();renderGrid();};})(item.id,si);
        row.appendChild(num);row.appendChild(nameInput);row.appendChild(stars);row.appendChild(del);body.appendChild(row);
      });
    }
    var addB=document.createElement('button');addB.className='album-add-song';addB.textContent='+ Add Song';
    addB.onclick=function(){var it=(data.music||[]).find(function(i){return i.id===item.id;});if(!it)return;if(!it.songs)it.songs=[];it.songs.push({name:'',rating:0});save();renderGrid();sessionStorage.setItem(stateKey,'1');};
    body.appendChild(addB);
  }

  rebuildRows();
  section.appendChild(body);

  toggle.onclick=function(){
    var open=body.classList.toggle('open');
    chevron.classList.toggle('open',open);
    sessionStorage.setItem(stateKey,open?'1':'0');
  };

  return section;
}

}

/* ── ITEM ACTIONS ── */
function rateItem(id,rating){var item=findItem(id);if(!item)return;item.rating=item.rating===rating?0:rating;save();renderGrid();}
function cycleStatus(id,ns){
  var item=findItem(id);if(!item)return;item.status=ns;
  if(ns==='done'&&!item.date&&['books','screen','articles','music'].includes(currentSection))item.date=todayStr();
  save();render();
}
function deleteItem(id){data[currentSection]=data[currentSection].filter(function(i){return i.id!==id;});save();render();}
function findItem(id){return(data[currentSection]||[]).find(function(i){return i.id===id;});}

function showModalFields(sec){
  var sd=SECTIONS[sec].showDate;
  document.getElementById('date-field-wrap').style.display=sd?'block':'none';
  if(sd)document.getElementById('date-field-label').textContent=SECTIONS[sec].dateLabel||'Date Completed';
  document.getElementById('pages-field-wrap').style.display=sec==='books'?'block':'none';
  document.getElementById('podcast-fields-wrap').style.display=sec==='podcasts'?'block':'none';
  document.getElementById('music-fields-wrap').style.display=sec==='music'?'block':'none';
  document.getElementById('screen-fields-wrap').style.display=sec==='screen'?'block':'none';
}
function buildStatusOptions(sec,selected){var sel=document.getElementById('m-status');sel.innerHTML='';SECTIONS[sec].statuses.forEach(function(s){var o=document.createElement('option');o.value=s.val;o.textContent=s.label;if(s.val===selected)o.selected=true;sel.appendChild(o);});}
function buildCategoryOptions(sec,selected){var sel=document.getElementById('m-category');sel.innerHTML='';allCats(sec).forEach(function(c){var o=document.createElement('option');o.value=c;o.textContent=c;if(c===selected)o.selected=true;sel.appendChild(o);});}
function clearModalFields(){
  ['m-title','m-creator','m-cover','m-link'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('m-note').value='';document.getElementById('m-rating').value='0';document.getElementById('m-date').value='';
  document.getElementById('m-pages').value='';document.getElementById('m-ep-current').value='';document.getElementById('m-ep-total').value='';
  document.getElementById('m-tracks-total').value='';document.getElementById('m-season').value='';document.getElementById('m-episode').value='';document.getElementById('m-seasons-total').value='';
}
function openAddModal(){if(currentSection==='stats')return;editingId=null;document.getElementById('modal-title').textContent='Add to '+SECTIONS[currentSection].label;clearModalFields();document.getElementById('m-delete-btn').style.display='none';buildStatusOptions(currentSection,'want');buildCategoryOptions(currentSection,'');showModalFields(currentSection);document.getElementById('modal').classList.add('open');setTimeout(function(){document.getElementById('m-title').focus();},100);}
function openEditModal(id){
  var item=findItem(id);if(!item)return;editingId=id;
  document.getElementById('modal-title').textContent='Edit Item';
  document.getElementById('m-title').value=item.title;document.getElementById('m-creator').value=item.creator||'';document.getElementById('m-cover').value=item.cover||'';document.getElementById('m-link').value=item.link||'';document.getElementById('m-note').value=item.note||'';document.getElementById('m-rating').value=item.rating||0;document.getElementById('m-date').value=item.date||'';document.getElementById('m-pages').value=item.pages||'';
  document.getElementById('m-ep-current').value=item.epCurrent||'';document.getElementById('m-ep-total').value=item.epTotal||'';
  document.getElementById('m-tracks-total').value=item.tracksTotal||'';
  document.getElementById('m-season').value=item.season||'';document.getElementById('m-episode').value=item.episode||'';document.getElementById('m-seasons-total').value=item.seasonsTotal||'';
  document.getElementById('m-delete-btn').style.display='inline-flex';buildStatusOptions(currentSection,item.status);buildCategoryOptions(currentSection,item.category);showModalFields(currentSection);document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open');editingId=null;}
function saveItem(){
  var title=document.getElementById('m-title').value.trim();if(!title){document.getElementById('m-title').focus();return;}
  var status=document.getElementById('m-status').value;
  var dateVal=document.getElementById('m-date').value;
  if(SECTIONS[currentSection].showDate&&status==='done'&&!dateVal)dateVal=todayStr();
  var existing=editingId?findItem(editingId):null;
  var item={
    id:editingId||'i_'+Date.now(),title:title,creator:document.getElementById('m-creator').value.trim(),category:document.getElementById('m-category').value,
    status:status,rating:parseInt(document.getElementById('m-rating').value)||0,cover:document.getElementById('m-cover').value.trim(),link:document.getElementById('m-link').value.trim(),note:document.getElementById('m-note').value.trim(),date:dateVal,
    pages:parseInt(document.getElementById('m-pages').value)||0,epCurrent:parseInt(document.getElementById('m-ep-current').value)||0,epTotal:parseInt(document.getElementById('m-ep-total').value)||0,
    tracksTotal:parseInt(document.getElementById('m-tracks-total').value)||0,
    season:parseInt(document.getElementById('m-season').value)||1,episode:parseInt(document.getElementById('m-episode').value)||1,seasonsTotal:parseInt(document.getElementById('m-seasons-total').value)||0,
  };
  if(existing&&existing.songs)item.songs=existing.songs;
  if(!item.songs&&currentSection==='music')item.songs=[];
  if(editingId){var idx=data[currentSection].findIndex(function(i){return i.id===editingId;});if(idx>=0)data[currentSection][idx]=item;}
  else data[currentSection].push(item);
  save();closeModal();render();
}
function deleteFromModal(){if(!editingId)return;if(!confirm('Delete?'))return;deleteItem(editingId);closeModal();}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
document.addEventListener('click',function(e){if(!e.target.closest('.dots-wrap'))document.querySelectorAll('.dots-menu.open').forEach(function(m){m.classList.remove('open');});});

/* ── RENDER + INIT ── */
function render(){renderStatsBar();renderControls();renderGrid();}
var now=new Date();
document.getElementById('today-date').textContent=DAYS[now.getDay()]+', '+MF[now.getMonth()]+' '+now.getDate()+', '+now.getFullYear();
load();render();
</script>
</body>
</html>
