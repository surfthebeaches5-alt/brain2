<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DC Passport</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f3ecd8;--surface:#fff;--sidebar:#f8f1dd;--sidebar-line:#e6dec5;
  --ink:#1a1612;--muted:#7a7468;--line:#ececec;--warm:#faf6ec;
  --accent:#c9b6ee;--accent-deep:#b099e0;--accent-soft:#ede5fb;
}
html,body{height:100%;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;}

/* ── TOPBAR ── */
.topbar{background:var(--sidebar);border-bottom:1px solid var(--sidebar-line);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:500;}
.topbar-left{display:flex;align-items:center;gap:14px;}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1.5px solid #d9d2bd;border-radius:20px;font-size:12px;color:var(--muted);cursor:pointer;background:transparent;font-family:inherit;text-decoration:none;transition:all .15s;}
.back-btn:hover{border-color:var(--accent-deep);color:var(--ink);}
.topbar-title{font-family:'Fraunces',serif;font-size:22px;font-weight:600;letter-spacing:-0.4px;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.topbar-date{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:500;}
.add-btn{padding:8px 16px;border:none;border-radius:20px;background:var(--ink);color:#fff;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;}
.add-btn:hover{background:#2a2218;transform:translateY(-1px);}

/* ── LAYOUT ── */
.layout{display:flex;height:calc(100vh - 57px);}

/* ── SIDEBAR ── */
.sidebar{width:340px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--sidebar-line);display:flex;flex-direction:column;overflow:hidden;}

.sidebar-controls{padding:12px 14px;border-bottom:1px solid var(--sidebar-line);display:flex;flex-direction:column;gap:10px;}
.filter-group{display:flex;flex-direction:column;gap:5px;}
.filter-group-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700;}
.filter-row{display:flex;gap:5px;flex-wrap:wrap;}
.filter-pill{padding:4px 11px;border:1.5px solid var(--sidebar-line);border-radius:12px;background:var(--surface);font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;color:var(--muted);transition:all .15s;white-space:nowrap;}
.filter-pill:hover{border-color:var(--accent-deep);color:var(--ink);}
.filter-pill.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.filter-pill.tag-active{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff;}
.search-input{width:100%;padding:8px 12px;border:1.5px solid var(--sidebar-line);border-radius:12px;font-family:inherit;font-size:12.5px;color:var(--ink);background:var(--surface);outline:none;transition:border .15s;}
.search-input:focus{border-color:var(--accent-deep);}

/* Route bar */
.route-bar{background:var(--accent-soft);border-bottom:1px solid var(--accent);padding:9px 14px;display:none;align-items:center;gap:8px;}
.route-bar.visible{display:flex;}
.route-bar-text{font-size:11.5px;font-weight:600;color:var(--accent-deep);flex:1;}
.route-clear-btn{padding:4px 10px;border:1.5px solid var(--accent-deep);border-radius:10px;font-size:11px;font-weight:700;color:var(--accent-deep);background:transparent;cursor:pointer;font-family:inherit;transition:all .15s;}
.route-clear-btn:hover{background:var(--accent-deep);color:#fff;}

/* Stats */
.sidebar-stats{padding:10px 14px;border-bottom:1px solid var(--sidebar-line);display:flex;gap:16px;}
.sb-stat{text-align:center;}
.sb-stat-num{font-family:'Fraunces',serif;font-size:22px;font-weight:600;line-height:1;letter-spacing:-0.5px;}
.sb-stat-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:2px;}

/* Spot cards */
.sidebar-list{flex:1;overflow-y:auto;padding:8px;}
.spot-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:7px;cursor:pointer;transition:all .18s;position:relative;}
.spot-card:hover{border-color:#d9d2bd;box-shadow:0 2px 10px rgba(0,0,0,.07);}
.spot-card.visited{border-left:3.5px solid #a7c4a0;}
.spot-card.focused{border-color:var(--accent-deep);box-shadow:0 2px 14px rgba(176,153,224,.25);}
.spot-card.hovered{border-color:var(--accent-deep);background:var(--accent-soft);}
.spot-card.route-selected{border-color:#f6a050;background:#fff8f0;}

.spot-card-top{display:flex;align-items:flex-start;gap:9px;}
.spot-cat-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.spot-name{font-size:13px;font-weight:700;flex:1;line-height:1.3;}
.spot-cat-label{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-top:2px;font-weight:600;}
.spot-badge{font-size:9.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 8px;border-radius:8px;}
.spot-badge.visited{background:#d8eee8;color:#1a4a44;}
.spot-badge.unvisited{background:var(--warm);color:var(--muted);border:1px solid var(--line);}

.spot-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.spot-tag{font-size:10px;padding:2px 7px;border-radius:8px;background:var(--warm);border:1px solid var(--line);color:var(--muted);font-weight:600;cursor:pointer;transition:all .15s;}
.spot-tag:hover{border-color:var(--accent-deep);color:var(--accent-deep);}
.spot-stars{display:flex;gap:1px;margin-top:5px;}
.spot-star{font-size:12px;color:var(--line);cursor:pointer;transition:color .1s;}
.spot-star.filled{color:#e8a0b0;}
.spot-note{font-size:11px;color:var(--muted);font-style:italic;margin-top:5px;line-height:1.5;}
.spot-actions{display:flex;gap:5px;margin-top:8px;align-items:center;}
.spot-action-btn{padding:4px 10px;border:1.5px solid var(--line);border-radius:9px;font-family:inherit;font-size:10.5px;font-weight:600;cursor:pointer;background:transparent;color:var(--muted);transition:all .15s;}
.spot-action-btn:hover{border-color:var(--accent-deep);color:var(--ink);}
.spot-action-btn.visited-active{background:#d8eee8;border-color:#a8d8d0;color:#1a4a44;}
.spot-del-btn{margin-left:auto;padding:3px 6px;border:none;background:transparent;font-size:11px;color:#ccc;cursor:pointer;transition:color .15s;}
.spot-del-btn:hover{color:#a0304a;}
/* Route checkbox */
.route-check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;font-size:9px;}
.route-check.checked{background:#f6a050;border-color:#f6a050;color:#fff;}

/* ── MAP ── */
#map{flex:1;z-index:0;}

/* ── CUSTOM MARKERS ── */
.custom-marker{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:white;border:3px solid #ccc;box-shadow:0 3px 10px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;transition:all .2s;}
.custom-marker.highlight{transform:rotate(-45deg) scale(1.3);box-shadow:0 5px 18px rgba(0,0,0,.4);}
.marker-emoji{transform:rotate(45deg);font-size:14px;line-height:1;}

/* Cluster override */
.marker-cluster{background:rgba(176,153,224,.6)!important;}
.marker-cluster div{background:var(--accent-deep)!important;color:#fff!important;font-family:'Plus Jakarta Sans',sans-serif!important;font-weight:700!important;font-size:12px!important;}
.marker-cluster-small{background:rgba(176,153,224,.5)!important;}
.marker-cluster-medium{background:rgba(176,153,224,.65)!important;}
.marker-cluster-large{background:rgba(176,153,224,.8)!important;}

/* ── MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);z-index:600;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;animation:fadeIn .2s;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:22px;border:1px solid var(--line);padding:26px 28px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 30px 60px -20px rgba(0,0,0,.3);animation:popIn .2s;}
@keyframes popIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal-title{font-family:'Fraunces',serif;font-size:22px;font-weight:600;margin-bottom:20px;letter-spacing:-.3px;}
.f-field{margin-bottom:13px;}
.f-label{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:5px;display:block;font-weight:700;}
.f-input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;font-family:inherit;color:var(--ink);background:var(--surface);outline:none;transition:border .15s;}
.f-input:focus{border-color:var(--accent-deep);}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.f-hint{font-size:10px;color:var(--muted);font-style:italic;margin-top:3px;}
/* Tags multi-select */
.tag-picker{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;}
.tag-option{padding:4px 11px;border:1.5px solid var(--line);border-radius:11px;font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;background:var(--warm);color:var(--muted);transition:all .15s;user-select:none;}
.tag-option:hover{border-color:var(--accent-deep);}
.tag-option.selected{background:var(--accent-soft);border-color:var(--accent-deep);color:var(--accent-deep);}
.m-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
.m-btn{padding:10px 22px;border-radius:22px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid;transition:all .15s;}
.m-cancel{background:var(--warm);border-color:var(--line);color:var(--muted);}
.m-cancel:hover{color:var(--ink);}
.m-save{background:var(--ink);border-color:var(--ink);color:#fff;}
.m-save:hover{transform:translateY(-1px);}
.m-delete{background:#fce4ec;border-color:#f2c4ce;color:#a0304a;}

/* Leaflet popup */
.leaflet-popup-content-wrapper{border-radius:14px;border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.12);}
.leaflet-popup-content{margin:12px 16px;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;color:var(--ink);}
.popup-name{font-family:'Fraunces',serif;font-size:17px;font-weight:600;margin-bottom:2px;letter-spacing:-.2px;}
.popup-cat{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:7px;font-weight:600;}
.popup-note{font-size:11.5px;color:var(--muted);font-style:italic;margin-bottom:9px;line-height:1.5;}
.popup-btn{padding:4px 12px;border:1.5px solid var(--line);border-radius:10px;font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:600;cursor:pointer;background:transparent;color:var(--muted);margin-right:5px;transition:all .15s;}
.popup-btn:hover{border-color:var(--accent-deep);color:var(--ink);}
.popup-btn.visited{background:#d8eee8;border-color:#a8d8d0;color:#1a4a44;}
</style>
</head>
<body>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modal-title">Add a Spot</div>
    <div class="f-field">
      <label class="f-label">Name</label>
      <input class="f-input" id="m-name" type="text" placeholder="e.g. Maydan">
    </div>
    <div class="f-row">
      <div class="f-field">
        <label class="f-label">Category</label>
        <select class="f-input" id="m-category">
          <option value="Museum">🏛️ Museum & Culture</option>
          <option value="Restaurant">🍽️ Restaurant</option>
          <option value="Bar">🍷 Bar</option>
          <option value="Cafe">☕ Café</option>
          <option value="Nature">🌿 Nature</option>
          <option value="Experience">✨ Experience</option>
          <option value="Shop">🛍️ Shop</option>
          <option value="Other">📍 Other</option>
        </select>
      </div>
      <div class="f-field">
        <label class="f-label">Area</label>
        <select class="f-input" id="m-city">
          <option value="DC">Washington, DC</option>
          <option value="MD">Maryland</option>
          <option value="VA">Virginia</option>
        </select>
      </div>
    </div>
    <!-- LOCATION SECTION -->
    <div class="f-field">
      <label class="f-label">Search by Name <span style="font-weight:400;letter-spacing:0;text-transform:none;font-size:10px;color:var(--muted);">— type a place name and press Enter</span></label>
      <div style="display:flex;gap:8px;">
        <input class="f-input" id="m-search-name" type="text" placeholder="e.g. Maydan DC" style="flex:1;" onkeydown="if(event.key==='Enter'){event.preventDefault();geocodeName();}">
        <button type="button" onclick="geocodeName()" style="padding:9px 14px;background:var(--ink);color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;transition:all .15s;" onmouseover="this.style.background='#2a2218'" onmouseout="this.style.background='var(--ink)'">Search</button>
      </div>
      <div id="geocode-status" style="font-size:10.5px;margin-top:4px;min-height:16px;font-style:italic;"></div>
    </div>
    <div class="f-field">
      <label class="f-label">Paste Coordinates <span style="font-weight:400;letter-spacing:0;text-transform:none;font-size:10px;color:var(--muted);">— paste "38.9072, -77.0369" from Google Maps</span></label>
      <input class="f-input" id="m-coords-paste" type="text" placeholder="38.9072, -77.0369" oninput="splitCoords(this.value)">
      <div class="f-hint">Google Maps → right-click on location → click the coordinates to copy</div>
    </div>
    <div class="f-row">
      <div class="f-field">
        <label class="f-label">Latitude</label>
        <input class="f-input" id="m-lat" type="number" step="0.00001" placeholder="38.9072">
      </div>
      <div class="f-field">
        <label class="f-label">Longitude</label>
        <input class="f-input" id="m-lng" type="number" step="0.00001" placeholder="-77.0369">
      </div>
    </div>
    <div id="map-click-hint" style="font-size:11px;color:var(--accent-deep);font-weight:600;padding:7px 12px;background:var(--accent-soft);border-radius:10px;border:1px solid var(--accent);margin-bottom:4px;display:none;">
      &#128205; Coordinates set from map click — or use search/paste above to change
    </div>
    <div class="f-field">
      <label class="f-label">Note (optional)</label>
      <input class="f-input" id="m-note" type="text" placeholder="Happy hour times, must-orders, why you want to go...">
    </div>
    <div class="f-field">
      <label class="f-label">Link (optional)</label>
      <input class="f-input" id="m-link" type="text" placeholder="Website, Google Maps, Instagram...">
    </div>
    <div class="f-field">
      <label class="f-label">Tags</label>
      <div class="tag-picker" id="tag-picker"></div>
    </div>
    <div class="m-actions">
      <button class="m-btn m-cancel" onclick="closeModal()">Cancel</button>
      <button class="m-btn m-delete" id="m-delete-btn" style="display:none;" onclick="deleteFromModal()">Delete</button>
      <button class="m-btn m-save" onclick="saveSpot()">Save</button>
    </div>
  </div>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-left">
    <a href="../" class="back-btn">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      Brain 2.0
    </a>
    <div class="topbar-title">DC Passport</div>
  </div>
  <div class="topbar-right">
    <span class="topbar-date" id="today-date"></span>
    <button class="add-btn" onclick="openAddModal()">+ Add Spot</button>
  </div>
</div>

<!-- LAYOUT -->
<div class="layout">
  <div class="sidebar">
    <div class="sidebar-controls">
      <div class="filter-group">
        <div class="filter-group-label">Area</div>
        <div class="filter-row" id="filter-area"></div>
      </div>
      <div class="filter-group">
        <div class="filter-group-label">Status</div>
        <div class="filter-row" id="filter-status"></div>
      </div>
      <div class="filter-group">
        <div class="filter-group-label">Category</div>
        <div class="filter-row" id="filter-cat"></div>
      </div>
      <div class="filter-group" id="filter-tag-group" style="display:none;">
        <div class="filter-group-label">Tags</div>
        <div class="filter-row" id="filter-tag"></div>
      </div>
      <input class="search-input" id="search-input" type="text" placeholder="Search spots..." oninput="setSearch(this.value)">
    </div>
    <div class="route-bar" id="route-bar">
      <span class="route-bar-text" id="route-bar-text"></span>
      <button class="route-clear-btn" onclick="clearRoute()">Clear Route</button>
    </div>
    <div class="sidebar-stats" id="sidebar-stats"></div>
    <div class="sidebar-list" id="sidebar-list"></div>
  </div>
  <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>

var spots = [];
var markerObjects = {}; // id → {marker, icon}
var clusterGroup;
var routeLayer = null;
var currentCat = 'all';
var currentCity = 'DC';
var currentVisited = 'all';
var currentTag = 'all';
var searchQuery = '';
var editingId = null;
var focusedId = null;
var routeSelected = []; // ordered array of spot ids
var hoveredCardId = null;
var map;

function getCat(val){ return CATEGORIES.find(function(c){return c.val===val;})||CATEGORIES[CATEGORIES.length-1]; }

/* ── STORAGE ── */
function save(){ localStorage.setItem(SK, JSON.stringify(spots)); }
function load(){
  var raw = localStorage.getItem(SK);
  if(raw){
    try{
      spots = JSON.parse(raw);
      // Migrate: ensure tags field exists
      spots.forEach(function(s){ if(!s.tags) s.tags=[]; });
    }catch(e){}
  } else {
    spots = JSON.parse(JSON.stringify(DEFAULT_SPOTS));
    save();
  }
}

/* ── MAP INIT ── */
function initMap(){
  map = L.map('map').setView([38.9072,-77.0369], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap contributors', maxZoom:19
  }).addTo(map);
  clusterGroup = L.markerClusterGroup({
    maxClusterRadius: 60,
    showCoverageOnHover: false,
    iconCreateFunction: function(cluster){
      var n = cluster.getChildCount();
      var size = n < 10 ? 34 : n < 20 ? 40 : 46;
      return L.divIcon({
        html:'<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:var(--accent-deep);display:flex;align-items:center;justify-content:center;color:#fff;font-family:Plus Jakarta Sans,sans-serif;font-weight:700;font-size:13px;box-shadow:0 3px 10px rgba(0,0,0,.2);">'+n+'</div>',
        className:'', iconSize:[size,size]
      });
    }
  });
  map.addLayer(clusterGroup);
  map.on('click', function(e){
    document.getElementById('m-lat').value = e.latlng.lat.toFixed(5);
    document.getElementById('m-lng').value = e.latlng.lng.toFixed(5);
    document.getElementById('m-coords-paste').value = e.latlng.lat.toFixed(5)+', '+e.latlng.lng.toFixed(5);
    openAddModal();
    setTimeout(function(){
      var hint = document.getElementById('map-click-hint');
      if(hint) hint.style.display='block';
    }, 150);
  });
}

function getCityCenter(city){
  return {DC:[38.9072,-77.0369],MD:[38.9784,-76.8922],VA:[38.8462,-77.3064]}[city]||[38.9072,-77.0369];
}

/* ── ICONS ── */
function createIconHtml(cat, visited, highlight){
  var scale = highlight ? ' transform:rotate(-45deg) scale(1.35);' : '';
  var shadow = highlight ? '0 5px 20px rgba(0,0,0,.45)' : '0 3px 10px rgba(0,0,0,.28)';
  return '<div style="width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg)'+(highlight?' scale(1.35)':'')+';background:white;border:3px solid '+cat.color+';box-shadow:'+shadow+';display:flex;align-items:center;justify-content:center;transition:all .2s;opacity:'+(visited?1:0.82)+';"><span style="transform:rotate(45deg);font-size:14px;line-height:1;">'+cat.emoji+'</span></div>';
}
function makeIcon(cat, visited, highlight){
  return L.divIcon({html:createIconHtml(cat,visited,highlight), className:'', iconSize:[34,34], iconAnchor:[17,34], popupAnchor:[0,-36]});
}

/* ── MARKERS ── */
function renderMarkers(){
  clusterGroup.clearLayers();
  markerObjects = {};
  var filtered = getFiltered();
  filtered.forEach(function(spot){
    if(!spot.lat||!spot.lng) return;
    var cat = getCat(spot.category);
    var marker = L.marker([spot.lat, spot.lng], {icon: makeIcon(cat, spot.visited, false)});
    var popupHtml =
      '<div class="popup-name">'+escHtml(spot.name)+'</div>'+
      '<div class="popup-cat">'+cat.emoji+' '+cat.label+'</div>'+
      (spot.note?'<div class="popup-note">'+escHtml(spot.note)+'</div>':'')+
      '<button class="popup-btn '+(spot.visited?'visited':'')+'" onclick="toggleVisited(\''+spot.id+'\')">'+
        (spot.visited?'✓ Visited':'Mark Visited')+'</button>'+
      '<button class="popup-btn" onclick="openEditModal(\''+spot.id+'\')">Edit</button>'+
      (spot.link?'<a href="'+escHtml(spot.link)+'" target="_blank" style="text-decoration:none;"><button class="popup-btn">Link ↗</button></a>':'');
    marker.bindPopup(popupHtml);

    // Marker click → focus card
    marker.on('click', function(){ setFocus(spot.id); });

    // ── BI-DIRECTIONAL HOVER: marker → card ──
    marker.on('mouseover', function(){
      highlightCard(spot.id, true);
    });
    marker.on('mouseout', function(){
      highlightCard(spot.id, false);
    });

    clusterGroup.addLayer(marker);
    markerObjects[spot.id] = {marker: marker, cat: cat, spot: spot};
  });
}

function highlightMarker(id, on){
  var obj = markerObjects[id];
  if(!obj) return;
  obj.marker.setIcon(makeIcon(obj.cat, obj.spot.visited, on));
}
function highlightCard(id, on){
  var card = document.getElementById('card-'+id);
  if(!card) return;
  if(on){
    card.classList.add('hovered');
    card.scrollIntoView({behavior:'smooth', block:'nearest'});
  } else {
    card.classList.remove('hovered');
  }
}

/* ── FILTER ── */
function getFiltered(){
  return spots.filter(function(s){
    if(currentCity!=='all' && s.city!==currentCity) return false;
    if(currentCat!=='all' && s.category!==currentCat) return false;
    if(currentVisited==='visited' && !s.visited) return false;
    if(currentVisited==='unvisited' && s.visited) return false;
    if(currentTag!=='all' && !(s.tags||[]).includes(currentTag)) return false;
    if(searchQuery){
      var q=searchQuery.toLowerCase();
      return (s.name||'').toLowerCase().includes(q)||(s.note||'').toLowerCase().includes(q)||
        (s.tags||[]).some(function(t){return getTagLabel(t).toLowerCase().includes(q);});
    }
    return true;
  });
}

/* ── SIDEBAR ── */
function renderSidebar(){
  var citySpots = spots.filter(function(s){return currentCity==='all'||s.city===currentCity;});
  var visited = citySpots.filter(function(s){return s.visited;}).length;
  document.getElementById('sidebar-stats').innerHTML =
    '<div class="sb-stat"><div class="sb-stat-num">'+citySpots.length+'</div><div class="sb-stat-label">Total</div></div>'+
    '<div class="sb-stat"><div class="sb-stat-num">'+visited+'</div><div class="sb-stat-label">Visited</div></div>'+
    '<div class="sb-stat"><div class="sb-stat-num">'+(citySpots.length-visited)+'</div><div class="sb-stat-label">To Go</div></div>';

  // Area
  var aHtml = ['all','DC','MD','VA'].map(function(v){
    var label = {all:'All',DC:'🏛️ DC',MD:'Maryland',VA:'Virginia'}[v];
    return '<button class="filter-pill'+(currentCity===v?' active':'')+'" onclick="setCity(\''+v+'\')">'+label+'</button>';
  }).join('');
  document.getElementById('filter-area').innerHTML = aHtml;

  // Status
  document.getElementById('filter-status').innerHTML =
    '<button class="filter-pill'+(currentVisited==='all'?' active':'')+'" onclick="setVisited(\'all\')">All</button>'+
    '<button class="filter-pill'+(currentVisited==='visited'?' active':'')+'" onclick="setVisited(\'visited\')">✓ Visited</button>'+
    '<button class="filter-pill'+(currentVisited==='unvisited'?' active':'')+'" onclick="setVisited(\'unvisited\')">To Go</button>';

  // Category
  var cHtml = '<button class="filter-pill'+(currentCat==='all'?' active':'')+'" onclick="setCat(\'all\')">All</button>';
  CATEGORIES.forEach(function(c){
    if(spots.some(function(s){return s.category===c.val;}))
      cHtml+='<button class="filter-pill'+(currentCat===c.val?' active':'')+'" onclick="setCat(\''+c.val+'\')">'+c.emoji+' '+c.label+'</button>';
  });
  document.getElementById('filter-cat').innerHTML = cHtml;

  // Tags (only show tags that exist on at least one spot)
  var usedTags = {};
  spots.forEach(function(s){(s.tags||[]).forEach(function(t){usedTags[t]=true;});});
  var usedTagList = PRESET_TAGS.filter(function(t){return usedTags[t.val];});
  if(usedTagList.length){
    document.getElementById('filter-tag-group').style.display='';
    var tHtml = '<button class="filter-pill'+(currentTag==='all'?' active':'')+'" onclick="setTag(\'all\')">All</button>';
    usedTagList.forEach(function(t){
      tHtml+='<button class="filter-pill'+(currentTag===t.val?' tag-active':'')+'" onclick="setTag(\''+t.val+'\')">'+t.label+'</button>';
    });
    document.getElementById('filter-tag').innerHTML = tHtml;
  } else {
    document.getElementById('filter-tag-group').style.display='none';
  }

  // Route bar
  if(routeSelected.length>0){
    document.getElementById('route-bar').classList.add('visible');
    document.getElementById('route-bar-text').textContent = routeSelected.length+' spot'+(routeSelected.length>1?'s':'')+' selected — route drawn on map';
  } else {
    document.getElementById('route-bar').classList.remove('visible');
  }

  // List
  var list = document.getElementById('sidebar-list'); list.innerHTML='';
  var filtered = getFiltered();
  if(!filtered.length){
    list.innerHTML='<div style="text-align:center;padding:30px 20px;color:var(--muted);font-style:italic;font-size:12.5px;">No spots match your filters.</div>';
    return;
  }
  filtered.sort(function(a,b){
    if(a.visited!==b.visited) return a.visited?1:-1;
    return a.name.localeCompare(b.name);
  });
  filtered.forEach(function(spot){
    var cat = getCat(spot.category);
    var isRouteSelected = routeSelected.includes(spot.id);
    var card = document.createElement('div');
    card.className='spot-card'+(spot.visited?' visited':'')+(spot.id===focusedId?' focused':'')+(isRouteSelected?' route-selected':'');
    card.id='card-'+spot.id;

    var starsHtml='';
    for(var s=1;s<=5;s++) starsHtml+='<span class="spot-star'+(s<=(spot.rating||0)?' filled':'')+'" onclick="rateSpot(\''+spot.id+'\','+s+',event)">★</span>';

    var tagsHtml='';
    if(spot.tags&&spot.tags.length){
      tagsHtml='<div class="spot-tags">';
      spot.tags.forEach(function(t){
        tagsHtml+='<span class="spot-tag" onclick="setTag(\''+t+'\');event.stopPropagation();">'+getTagLabel(t)+'</span>';
      });
      tagsHtml+='</div>';
    }

    var routeNum = routeSelected.indexOf(spot.id);
    var routeCheckHtml = '<div class="route-check'+(isRouteSelected?' checked':'')+'" onclick="toggleRoute(\''+spot.id+'\',event)" title="Add to route">'+(isRouteSelected?'✓':'')+'</div>';

    card.innerHTML=
      '<div class="spot-card-top">'+
        routeCheckHtml+
        '<div class="spot-cat-dot" style="background:'+cat.color+';"></div>'+
        '<div style="flex:1;min-width:0;">'+
          '<div class="spot-name">'+escHtml(spot.name)+'</div>'+
          '<div class="spot-cat-label">'+cat.emoji+' '+cat.label+(spot.city&&spot.city!=='DC'?' · '+spot.city:'')+'</div>'+
        '</div>'+
        '<span class="spot-badge '+(spot.visited?'visited':'unvisited')+'">'+
          (spot.visited?'✓ Visited':'To Go')+'</span>'+
      '</div>'+
      tagsHtml+
      '<div class="spot-stars">'+starsHtml+'</div>'+
      (spot.note?'<div class="spot-note">'+escHtml(spot.note)+'</div>':'')+
      '<div class="spot-actions">'+
        '<button class="spot-action-btn'+(spot.visited?' visited-active':'')+'" onclick="toggleVisited(\''+spot.id+'\');event.stopPropagation();">'+
          (spot.visited?'✓ Visited':'Mark Visited')+'</button>'+
        '<button class="spot-action-btn" onclick="openEditModal(\''+spot.id+'\');event.stopPropagation();">Edit</button>'+
        (spot.link?'<a href="'+escHtml(spot.link)+'" target="_blank" style="text-decoration:none;" onclick="event.stopPropagation();"><button class="spot-action-btn">Link ↗</button></a>':'')+
        '<button class="spot-del-btn" onclick="deleteSpot(\''+spot.id+'\');event.stopPropagation();">✕</button>'+
      '</div>';

    // Card click → fly to marker
    card.addEventListener('click', function(e){
      if(e.target.classList.contains('route-check')||e.target.classList.contains('spot-star')||
         e.target.tagName==='BUTTON'||e.target.tagName==='A') return;
      flyTo(spot.id);
    });

    // ── BI-DIRECTIONAL HOVER: card → marker ──
    card.addEventListener('mouseenter', function(){
      highlightMarker(spot.id, true);
    });
    card.addEventListener('mouseleave', function(){
      highlightMarker(spot.id, false);
    });

    list.appendChild(card);
  });
}

/* ── FILTER SETTERS ── */
function setCity(c){ currentCity=c; render(); map.flyTo(getCityCenter(c==='all'?'DC':c),13); }
function setCat(c){ currentCat=c; render(); }
function setVisited(v){ currentVisited=v; render(); }
function setTag(t){ currentTag=t; render(); }
function setSearch(v){ searchQuery=v; render(); }

function setFocus(id){
  focusedId=id; renderSidebar();
  var card=document.getElementById('card-'+id);
  if(card) card.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function flyTo(id){
  var spot=spots.find(function(s){return s.id===id;}); if(!spot||!spot.lat) return;
  map.flyTo([spot.lat,spot.lng],16,{duration:0.8});
  var obj = markerObjects[id];
  if(obj) setTimeout(function(){obj.marker.openPopup();},800);
  setFocus(id);
}

/* ── ROUTE ── */
function toggleRoute(id, e){
  if(e) e.stopPropagation();
  var idx = routeSelected.indexOf(id);
  if(idx>=0) routeSelected.splice(idx,1);
  else routeSelected.push(id);
  drawRoute();
  renderSidebar();
}
function clearRoute(){ routeSelected=[]; drawRoute(); renderSidebar(); }
function drawRoute(){
  if(routeLayer){ map.removeLayer(routeLayer); routeLayer=null; }
  if(routeSelected.length<2) return;
  var latlngs = routeSelected.map(function(id){
    var s=spots.find(function(x){return x.id===id;});
    return s&&s.lat&&s.lng?[s.lat,s.lng]:null;
  }).filter(Boolean);
  if(latlngs.length<2) return;
  routeLayer = L.polyline(latlngs,{
    color:'#f6a050', weight:3, opacity:.8,
    dashArray:'6,6', lineCap:'round', lineJoin:'round'
  }).addTo(map);
  map.fitBounds(routeLayer.getBounds(), {padding:[40,40]});
}

/* ── ACTIONS ── */
function toggleVisited(id){
  var spot=spots.find(function(s){return s.id===id;}); if(!spot) return;
  spot.visited=!spot.visited; save(); render();
}
function rateSpot(id, rating, e){
  e.stopPropagation();
  var spot=spots.find(function(s){return s.id===id;}); if(!spot) return;
  spot.rating=spot.rating===rating?0:rating; save(); renderSidebar();
}
function deleteSpot(id){
  if(!confirm('Remove this spot?')) return;
  spots=spots.filter(function(s){return s.id!==id;});
  routeSelected=routeSelected.filter(function(r){return r!==id;});
  save(); render();
}

/* ── MODAL ── */
var modalSelectedTags = [];
function buildTagPicker(){
  var container = document.getElementById('tag-picker'); container.innerHTML='';
  PRESET_TAGS.forEach(function(t){
    var el = document.createElement('div');
    el.className = 'tag-option'+(modalSelectedTags.includes(t.val)?' selected':'');
    el.textContent = t.label;
    el.onclick = function(){
      var i = modalSelectedTags.indexOf(t.val);
      if(i>=0) modalSelectedTags.splice(i,1); else modalSelectedTags.push(t.val);
      el.classList.toggle('selected', modalSelectedTags.includes(t.val));
    };
    container.appendChild(el);
  });
}
function openAddModal(){
  editingId=null; modalSelectedTags=[];
  document.getElementById('modal-title').textContent='Add a Spot';
  document.getElementById('m-name').value='';
  document.getElementById('m-category').value='Restaurant';
  document.getElementById('m-city').value='DC';
  document.getElementById('m-note').value='';
  document.getElementById('m-link').value='';
  document.getElementById('m-delete-btn').style.display='none';
  document.getElementById('m-coords-paste').value='';
  document.getElementById('m-search-name').value='';
  document.getElementById('geocode-status').textContent='';
  document.getElementById('map-click-hint').style.display='none';
  if(window._geocodePreview){window._geocodePreview.remove();window._geocodePreview=null;}
  buildTagPicker();
  document.getElementById('modal').classList.add('open');
  setTimeout(function(){document.getElementById('m-name').focus();},100);
}
function openEditModal(id){
  var spot=spots.find(function(s){return s.id===id;}); if(!spot) return;
  editingId=id; modalSelectedTags=(spot.tags||[]).slice();
  document.getElementById('modal-title').textContent='Edit Spot';
  document.getElementById('m-name').value=spot.name;
  document.getElementById('m-category').value=spot.category;
  document.getElementById('m-city').value=spot.city||'DC';
  document.getElementById('m-lat').value=spot.lat||'';
  document.getElementById('m-lng').value=spot.lng||'';
  document.getElementById('m-note').value=spot.note||'';
  document.getElementById('m-link').value=spot.link||'';
  document.getElementById('m-delete-btn').style.display='inline-flex';
  document.getElementById('m-coords-paste').value=(spot.lat&&spot.lng)?spot.lat+', '+spot.lng:'';
  document.getElementById('m-search-name').value='';
  document.getElementById('geocode-status').textContent='';
  document.getElementById('map-click-hint').style.display='none';
  if(window._geocodePreview){window._geocodePreview.remove();window._geocodePreview=null;}
  buildTagPicker();
  document.getElementById('modal').classList.add('open');
}

/* ── GEOCODING (Nominatim) ── */
function geocodeName(){
  var query = document.getElementById('m-search-name').value.trim();
  if(!query) return;
  var status = document.getElementById('geocode-status');
  status.style.color = 'var(--muted)';
  status.textContent = 'Searching...';
  var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(query+' Washington DC');
  fetch(url, {headers:{'Accept':'application/json','User-Agent':'DCPassport/1.0'}})
    .then(function(r){return r.json();})
    .then(function(data){
      if(data&&data.length){
        var lat = parseFloat(data[0].lat).toFixed(5);
        var lng = parseFloat(data[0].lon).toFixed(5);
        document.getElementById('m-lat').value = lat;
        document.getElementById('m-lng').value = lng;
        document.getElementById('m-coords-paste').value = lat+', '+lng;
        status.style.color = '#1a4a44';
        status.textContent = '✓ Found: '+data[0].display_name.split(',').slice(0,3).join(',');
        // Preview on map
        if(window._geocodePreview) window._geocodePreview.remove();
        window._geocodePreview = L.circleMarker([lat,lng],{radius:10,color:'var(--accent-deep)',fillColor:'var(--accent-soft)',fillOpacity:.8,weight:2}).addTo(map);
        map.setView([lat,lng],16);
      } else {
        status.style.color = '#a04040';
        status.textContent = '✗ Not found — try adding "DC" or use paste/map click below';
      }
    })
    .catch(function(){
      status.style.color = '#a04040';
      status.textContent = '✗ Search failed — check connection or use paste below';
    });
}

/* ── PASTE COORDS SPLITTER ── */
function splitCoords(val){
  val = val.trim();
  // Handle "38.9072, -77.0369" or "38.9072 -77.0369" or "38.9072,-77.0369"
  var parts = val.split(/[\s,]+/).filter(function(p){return p.trim()!=='';});
  if(parts.length>=2){
    var lat = parseFloat(parts[0]);
    var lng = parseFloat(parts[1]);
    if(!isNaN(lat)&&!isNaN(lng)&&lat>=-90&&lat<=90&&lng>=-180&&lng<=180){
      document.getElementById('m-lat').value = lat.toFixed(5);
      document.getElementById('m-lng').value = lng.toFixed(5);
    }
  }
}

function closeModal(){
  document.getElementById('modal').classList.remove('open');
  editingId=null;
  if(window._geocodePreview){window._geocodePreview.remove();window._geocodePreview=null;}
}
function saveSpot(){
  var name=document.getElementById('m-name').value.trim();
  if(!name){document.getElementById('m-name').focus();return;}
  var old = editingId?spots.find(function(s){return s.id===editingId;})||{}:{};
  var spot={
    id:editingId||'s_'+Date.now(),
    name:name,
    category:document.getElementById('m-category').value,
    city:document.getElementById('m-city').value,
    lat:parseFloat(document.getElementById('m-lat').value)||null,
    lng:parseFloat(document.getElementById('m-lng').value)||null,
    note:document.getElementById('m-note').value.trim(),
    link:document.getElementById('m-link').value.trim(),
    visited:old.visited||false,
    rating:old.rating||0,
    tags:modalSelectedTags.slice(),
  };
  if(editingId){var idx=spots.findIndex(function(s){return s.id===editingId;});if(idx>=0)spots[idx]=spot;}
  else spots.push(spot);
  save(); closeModal(); render();
  if(spot.lat&&spot.lng) flyTo(spot.id);
}
function deleteFromModal(){
  if(!editingId)return;if(!confirm('Delete this spot?'))return;
  deleteSpot(editingId);closeModal();
}

document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});

/* ── UTILS ── */
function escHtml(s){ return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

/* ── RENDER ── */
function render(){ renderMarkers(); renderSidebar(); }

/* ── INIT ── */
var DS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MF=['January','February','March','April','May','June','July','August','September','October','November','December'];
var now=new Date();
document.getElementById('today-date').textContent=DS[now.getDay()]+', '+MF[now.getMonth()]+' '+now.getDate()+', '+now.getFullYear();

load();
initMap();
render();
</script>
