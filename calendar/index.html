<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f3ecd8;
    --surface: #ffffff;
    --sidebar: #f8f1dd;
    --sidebar-line: #e6dec5;
    --ink: #1a1612;
    --muted: #7a7468;
    --line: #ececec;

    --accent: #c9b6ee;
    --accent-deep: #b099e0;
    --accent-soft: #ede5fb;
  }

  html, body {
    background: var(--bg);
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body {
    padding: 28px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }

  /* ============ SHELL ============ */
  .page-shell {
    width: 100%;
    max-width: 1240px;
    background: var(--surface);
    border-radius: 28px;
    border: 1px solid #d9d2bd;
    box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 30px 80px -40px rgba(0,0,0,.18);
    overflow: hidden;
    min-height: 820px;
    display: flex;
    flex-direction: column;
  }

  /* ============ TOPBAR ============ */
  .topbar {
    background: var(--sidebar);
    border-bottom: 1px solid var(--sidebar-line);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar-left { display: flex; align-items: center; gap: 14px; }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border: 1.5px solid #d9d2bd;
    border-radius: 20px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    background: transparent;
    font-family: inherit;
    text-decoration: none;
    transition: all .15s;
  }
  .back-btn:hover { border-color: var(--accent-deep); color: var(--ink); }
  .topbar-title {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.4px;
    line-height: 1;
  }
  .topbar-date {
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }

  /* ============ CONTROLS ============ */
  .controls {
    padding: 22px 28px 14px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .view-toggle {
    display: flex;
    gap: 4px;
    background: #f3eedc;
    border-radius: 22px;
    padding: 3px;
  }
  .view-btn {
    padding: 6px 18px;
    border: none;
    border-radius: 18px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    background: transparent;
    color: var(--muted);
    transition: all .15s;
  }
  .view-btn.active {
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }

  .nav-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .nav-arrow {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1.5px solid #e2dec5;
    background: var(--surface);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    transition: background .15s;
  }
  .nav-arrow:hover { background: #f3eedc; }
  .nav-label {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -.3px;
    min-width: 200px;
    text-align: center;
  }
  .today-btn {
    padding: 7px 14px;
    border: 1.5px solid #e2dec5;
    border-radius: 20px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    background: var(--surface);
    color: var(--ink);
    transition: all .15s;
  }
  .today-btn:hover { background: #f3eedc; }

  .add-event-btn {
    padding: 9px 18px;
    border: none;
    border-radius: 22px;
    background: var(--ink);
    color: #fff;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .15s;
  }
  .add-event-btn:hover { transform: translateY(-1px); }

  /* ============ LEGEND ============ */
  .legend {
    padding: 0 28px 14px;
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
  }
  .leg-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 14px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: all .15s;
    user-select: none;
    opacity: 0.55;
  }
  .leg-chip.active { opacity: 1; }
  .leg-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* ============ MAIN ============ */
  .main {
    padding: 0 28px 28px;
    flex: 1;
  }

  /* ============ MONTHLY VIEW ============ */
  .month-grid {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
  }
  .month-header-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    background: #faf6ec;
    border-bottom: 1.5px solid var(--line);
  }
  .month-dow {
    padding: 12px 0;
    text-align: center;
    font-size: 10.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  .month-body {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }
  .month-cell {
    min-height: 110px;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 8px;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: background .12s;
  }
  .month-cell:hover { background: #faf6ec; }
  .month-cell:nth-child(7n) { border-right: none; }
  .month-cell.other-month { background: #fbf7ed; opacity: 0.55; }
  .month-cell.today .day-num {
    background: var(--accent);
    color: var(--ink);
    font-weight: 700;
  }
  .day-num {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    width: 26px; height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 4px;
  }
  .month-events {
    display: flex;
    flex-direction: column;
    gap: 3px;
    flex: 1;
    overflow: hidden;
  }
  .month-event-chip {
    border-radius: 6px;
    padding: 3px 7px;
    font-size: 10.5px;
    font-weight: 500;
    line-height: 1.4;
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    transition: opacity .15s;
    overflow: hidden;
  }
  .month-event-chip:hover { opacity: 0.82; }
  .month-event-chip.done { opacity: 0.45; text-decoration: line-through; }
  .chip-check {
    width: 11px; height: 11px;
    border-radius: 50%;
    border: 1.5px solid currentColor;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 7px;
  }
  .chip-check.checked { background: currentColor; }
  .chip-check.checked::after { content: '✓'; color: #fff; }
  .chip-text {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .chip-del {
    opacity: 0;
    font-size: 10px;
    cursor: pointer;
    flex-shrink: 0;
    transition: opacity .15s;
  }
  .month-event-chip:hover .chip-del { opacity: 0.6; }
  .chip-del:hover { opacity: 1 !important; }

  /* ============ WEEKLY VIEW ============ */
  .week-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
  }
  .week-col {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 380px;
  }
  .week-col.today-col {
    border-color: var(--accent-deep);
    border-width: 2px;
  }
  .week-col-header {
    padding: 12px 10px 10px;
    border-bottom: 1px solid var(--line);
    text-align: center;
    background: #faf6ec;
  }
  .week-dow {
    font-size: 10.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  .week-day-num {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 600;
    line-height: 1;
    margin-top: 3px;
    letter-spacing: -.5px;
  }
  .week-col.today-col .week-day-num { color: var(--accent-deep); }
  .week-events {
    flex: 1;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .week-event {
    border-radius: 10px;
    padding: 8px 10px;
    display: flex;
    align-items: flex-start;
    gap: 7px;
    cursor: pointer;
    transition: opacity .15s;
    position: relative;
  }
  .week-event:hover { opacity: 0.88; }
  .week-event.done { opacity: 0.4; }
  .week-event.done .ev-title { text-decoration: line-through; }
  .ev-check {
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 1.5px solid currentColor;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8px;
    margin-top: 1px;
    cursor: pointer;
  }
  .ev-check.checked { background: currentColor; }
  .ev-check.checked::after { content: '✓'; color: #fff; }
  .ev-body { flex: 1; min-width: 0; }
  .ev-title {
    font-size: 11.5px;
    font-weight: 600;
    line-height: 1.3;
  }
  .ev-time {
    font-size: 10px;
    opacity: 0.75;
    margin-top: 2px;
  }
  .ev-del {
    position: absolute;
    top: 4px; right: 5px;
    background: transparent;
    border: none;
    font-size: 9px;
    color: currentColor;
    cursor: pointer;
    opacity: 0;
    padding: 1px 3px;
    border-radius: 4px;
    transition: opacity .15s;
  }
  .week-event:hover .ev-del { opacity: 0.5; }
  .ev-del:hover { opacity: 1 !important; }

  .week-add-btn {
    width: 100%;
    border: none;
    background: transparent;
    padding: 7px;
    font-size: 11px;
    cursor: pointer;
    color: var(--muted);
    border-top: 1px dashed var(--line);
    transition: all .15s;
    font-family: inherit;
  }
  .week-add-btn:hover {
    background: #faf6ec;
    color: var(--ink);
  }

  /* ============ MODAL ============ */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.4);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-backdrop.show { display: flex; animation: fadeIn .2s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: #fff;
    border-radius: 22px;
    padding: 24px 26px;
    width: 100%;
    max-width: 460px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.3);
    animation: pop .2s;
    max-height: 90vh;
    overflow-y: auto;
  }
  @keyframes pop { from { transform: scale(.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .modal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  .modal-title {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -.3px;
  }
  .modal-close {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: none;
    background: #f3f3f3;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-close:hover { background: #e8e8e8; }

  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block;
    font-size: 10.5px;
    color: var(--muted);
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  .form-input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ink);
    background: #fff;
    transition: border-color .2s;
  }
  .form-input:focus {
    outline: none;
    border-color: var(--accent-deep);
  }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .cat-picker {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .cat-option {
    padding: 8px 6px;
    border-radius: 10px;
    font-size: 10.5px;
    font-weight: 600;
    cursor: pointer;
    border: 1.5px solid transparent;
    text-align: center;
    transition: all .15s;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cat-option.selected {
    border-color: var(--ink);
    transform: scale(1.04);
  }

  /* ===== category manager rows ===== */
  .cat-row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
  .cat-row-label { flex: 0 0 116px; font-weight: 600; }
  .cat-swatches { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
  .cat-sw { width: 18px; height: 18px; border-radius: 50%; cursor: pointer; padding: 0; border: 2px solid transparent; }
  .cat-ctrl { width: 26px; height: 32px; border: 1px solid #e2dec5; background: #fff; border-radius: 8px; cursor: pointer; font-size: 12px; flex-shrink: 0; }
  .cat-ctrl:hover { background: #f3eedc; }

  .form-actions {
    display: flex;
    gap: 10px;
    margin-top: 22px;
  }
  .btn {
    flex: 1;
    padding: 11px;
    border-radius: 24px;
    border: none;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all .15s;
  }
  .btn.primary { background: var(--ink); color: #fff; }
  .btn.primary:hover { transform: translateY(-1px); }
  .btn.secondary { background: #f3f3f3; color: var(--ink); }
  .btn.secondary:hover { background: #e8e8e8; }
  .btn.danger { background: #fde0e0; color: #a04040; flex: 0 0 auto; padding: 11px 18px; }
  .btn.danger:hover { background: #f8c8c8; }

  /* ============ TOAST ============ */
  .toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--ink);
    color: #fff;
    padding: 10px 18px;
    border-radius: 24px;
    font-size: 13px;
    font-weight: 500;
    transition: transform .3s;
    z-index: 200;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 900px) {
    body { padding: 10px; }
    .week-grid { grid-template-columns: 1fr; }
    .month-cell { min-height: 80px; }
    .controls { gap: 8px; }
    .nav-label { min-width: 140px; font-size: 16px; }
  }
</style>
</head>
<body>

<div class="page-shell">

  <!-- ============ TOPBAR ============ -->
  <div class="topbar">
    <div class="topbar-left">
      <a href="../" class="back-btn">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        Brain 2.0
      </a>
      <div class="topbar-title">Calendar</div>
    </div>
    <div class="topbar-date" id="today-date"></div>
  </div>

  <!-- ============ CONTROLS ============ -->
  <div class="controls">
    <div class="view-toggle">
      <button class="view-btn active" id="btn-month" onclick="setView('month')">Monthly</button>
      <button class="view-btn" id="btn-week" onclick="setView('week')">Weekly</button>
    </div>
    <div class="nav-group">
      <button class="nav-arrow" onclick="navigate(-1)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="nav-label" id="nav-label"></div>
      <button class="nav-arrow" onclick="navigate(1)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
    <button class="today-btn" onclick="goToday()">Today</button>
    <button class="today-btn" onclick="openCatManager()" style="margin-left:auto;">Categories</button>
    <button class="add-event-btn" onclick="openAddModal()" style="margin-left:8px;">+ Add Event</button>
  </div>

  <!-- ============ LEGEND ============ -->
  <div class="legend" id="legend"></div>

  <!-- ============ MAIN ============ -->
  <div class="main" id="main"></div>

</div>

<!-- ============ EVENT MODAL ============ -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modal-title">Add event</div>
      <button class="modal-close" id="modal-close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="form-group">
      <label>Title</label>
      <input class="form-input" type="text" id="ev-title" placeholder="What's happening?">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Date</label>
        <input class="form-input" type="date" id="ev-date">
      </div>
      <div class="form-group">
        <label>Time (optional)</label>
        <input class="form-input" type="time" id="ev-time">
      </div>
    </div>
    <div class="form-group">
      <label>Category</label>
      <div class="cat-picker" id="cat-picker"></div>
    </div>
    <div class="form-group">
      <label>Note (optional)</label>
      <input class="form-input" type="text" id="ev-note" placeholder="Any extra details...">
    </div>
    <div class="form-actions">
      <button class="btn danger" id="modal-delete-btn" style="display:none;">Delete</button>
      <button class="btn secondary" id="modal-cancel">Cancel</button>
      <button class="btn primary" id="modal-save">Save</button>
    </div>
  </div>
</div>

<!-- ============ CATEGORY MANAGER MODAL ============ -->
<div class="modal-backdrop" id="cat-modal">
  <div class="modal" style="max-width:540px;">
    <div class="modal-head">
      <div class="modal-title">Categories</div>
      <button class="modal-close" id="cat-modal-close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <p style="font-size:11.5px;color:var(--muted);margin:-6px 0 14px;line-height:1.5;">Rename, recolor, reorder or add categories. Changes apply here and on your homepage.</p>
    <div id="cat-manager-list"></div>
    <button class="btn secondary" id="cat-add-btn" style="width:100%;margin-top:4px;">+ Add category</button>
    <div class="form-actions">
      <button class="btn secondary" id="cat-modal-cancel">Close</button>
      <button class="btn primary" id="cat-modal-save">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">Saved ✓</div>

<script>
/* ============ STATE ============ */
const STORAGE_KEY = 'lifeCalendar1';   // events — SHARED with dashboard
const CAT_KEY = 'calCategories1';      // categories — SHARED with dashboard

/* Recommended starter set (mapped to the Brain 2.0 hub). Editable via the Categories manager. */
const DEFAULT_CATS = [
  {id:'work',     label:'Work',      bg:'#e7eef9', text:'#26405e', dot:'#a9bfdd'},
  {id:'study',    label:'Study',     bg:'#ece4fb', text:'#463586', dot:'#c1a9ee'},
  {id:'fitness',  label:'Fitness',   bg:'#e6f2d8', text:'#355010', dot:'#a9cf6e'},
  {id:'health',   label:'Health',    bg:'#d6efe9', text:'#15463f', dot:'#95d0c6'},
  {id:'finances', label:'Finances',  bg:'#fbf0d4', text:'#654807', dot:'#ddbd5c'},
  {id:'social',   label:'Social',    bg:'#dceafb', text:'#1f4a86', dot:'#9cc4f0'},
  {id:'outings',  label:'Outings',   bg:'#fbe6da', text:'#7a3417', dot:'#e2a172'},
  {id:'travel',   label:'Travel',    bg:'#ecf2dd', text:'#3a4a18', dot:'#a7b384'},
  {id:'selfcare', label:'Self-care', bg:'#fde7ef', text:'#7a2a4a', dot:'#f3b3cf'},
  {id:'personal', label:'Personal',  bg:'#fde0c8', text:'#6a3a18', dot:'#f3c193'},
];

/* Old category ids → new ones, so existing events keep meaning */
const CAT_MIGRATE = { learning: 'study', tasks: 'personal' };

/* On-brand swatch presets the manager can assign */
const PRESETS = [
  {bg:'#e7eef9',text:'#26405e',dot:'#a9bfdd'}, {bg:'#dceafb',text:'#1f4a86',dot:'#9cc4f0'},
  {bg:'#ece4fb',text:'#463586',dot:'#c1a9ee'}, {bg:'#ede5fb',text:'#4a3a8a',dot:'#c9b6ee'},
  {bg:'#d6efe9',text:'#15463f',dot:'#95d0c6'}, {bg:'#e6f2d8',text:'#355010',dot:'#a9cf6e'},
  {bg:'#ecf2dd',text:'#3a4a18',dot:'#a7b384'}, {bg:'#fbf0d4',text:'#654807',dot:'#ddbd5c'},
  {bg:'#fbe6da',text:'#7a3417',dot:'#e2a172'}, {bg:'#fde0c8',text:'#6a3a18',dot:'#f3c193'},
  {bg:'#fde7ef',text:'#7a2a4a',dot:'#f3b3cf'}, {bg:'#f1e8d6',text:'#5a4520',dot:'#cab389'},
];

let CATS = [];
function loadCats() {
  try {
    const raw = localStorage.getItem(CAT_KEY);
    if (raw) { const arr = JSON.parse(raw); if (Array.isArray(arr) && arr.length) { CATS = arr; return; } }
  } catch(e) {}
  CATS = DEFAULT_CATS.map(c => Object.assign({}, c));
  saveCats();
}
function saveCats() { localStorage.setItem(CAT_KEY, JSON.stringify(CATS)); }
function getCat(id) {
  return CATS.find(c => c.id === id) || CATS.find(c => c.id === 'personal') || CATS[0] || DEFAULT_CATS[DEFAULT_CATS.length-1];
}

let TODAY = new Date(); TODAY.setHours(0,0,0,0);
let currentView = 'month';
let currentDate = new Date(TODAY);
let events = [];
let activeCategories = {};
let editingId = null;
let pendingCat = 'personal';
let catEdit = null;

const DAYS_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function buildActiveCats() {
  const prev = activeCategories;
  activeCategories = {};
  CATS.forEach(c => { activeCategories[c.id] = (c.id in prev) ? prev[c.id] : true; });
}

/* ============ STORAGE ============ */
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({events, view: currentView}));
}
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (Array.isArray(d)) {
        events = d;
      } else {
        events = d.events || [];
        if (d.view) currentView = d.view;
      }
    }
  } catch(e) { events = []; }

  if (events.length === 0) {
    const today = dateKey(TODAY);
    events = [
      {id: id(), title: 'Morning meditation', date: today, time: '07:00', cat: 'selfcare', note: 'Home', done: false},
      {id: id(), title: 'Deep work: project plan', date: today, time: '09:00', cat: 'work', note: 'Desk', done: false},
      {id: id(), title: 'Spanish practice', date: today, time: '14:00', cat: 'study', note: '', done: false},
      {id: id(), title: 'Walk + audiobook', date: today, time: '17:30', cat: 'fitness', note: 'Park', done: false},
    ];
    save();
  }
}
function migrateEventCats() {
  let changed = false;
  events.forEach(e => { if (CAT_MIGRATE[e.cat]) { e.cat = CAT_MIGRATE[e.cat]; changed = true; } });
  if (changed) save();
}

function id() { return 'ev_' + Math.random().toString(36).slice(2,10); }

/* ============ DATE HELPERS ============ */
function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function parseDate(s) {
  const p = s.split('-');
  return new Date(parseInt(p[0]), parseInt(p[1])-1, parseInt(p[2]));
}
function isToday(d) { return dateKey(d) === dateKey(TODAY); }
function isSameMonth(d1, d2) {
  return d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth();
}
function getWeekStart(d) {
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  const start = new Date(d);
  start.setDate(d.getDate() + diff);
  return start;
}
function eventsForDate(dateStr) {
  return events
    .filter(e => e.date === dateStr && activeCategories[e.cat])
    .sort((a,b) => (a.time||'').localeCompare(b.time||''));
}
/* read-only overlay: assignment due dates pulled from the Classes page store (classTracker1) */
let showClassEvents = true;
function classEvents() {
  let db;
  try { db = JSON.parse(localStorage.getItem('classTracker1')); } catch(e) { db = null; }
  if (!db) return [];
  const classes = Array.isArray(db) ? db : (db.classes || []);
  const out = [];
  classes.forEach(c => (c.modules||[]).forEach(m => (m.tasks||[]).forEach(t => {
    const due = t.due || m.due || '';
    if (!due) return;
    out.push({ id:'class:'+t.id, title:t.label, date:due, done:!!t.done, color:c.color||'#b099e0', cls:c.name });
  })));
  return out;
}
function classForDate(dateStr) {
  if (!showClassEvents) return [];
  return classEvents().filter(e => e.date === dateStr).sort((a,b) => a.title.localeCompare(b.title));
}
function formatTime(t) {
  if (!t) return '';
  const p = t.split(':');
  let h = parseInt(p[0]);
  const m = p[1];
  const ampm = h >= 12 ? 'pm' : 'am';
  h = h % 12 || 12;
  return h + (m !== '00' ? ':'+m : '') + ampm;
}

/* ============ ESCAPE ============ */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============ LEGEND ============ */
function renderLegend() {
  const el = document.getElementById('legend');
  el.innerHTML = '';
  CATS.forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'leg-chip' + (activeCategories[c.id] ? ' active' : '');
    chip.style.background = c.bg;
    chip.style.color = c.text;
    chip.innerHTML = `<div class="leg-dot" style="background:${c.dot}"></div>${esc(c.label)}`;
    chip.addEventListener('click', () => {
      activeCategories[c.id] = !activeCategories[c.id];
      renderLegend();
      render();
    });
    el.appendChild(chip);
  });
  const clsChip = document.createElement('div');
  clsChip.className = 'leg-chip' + (showClassEvents ? ' active' : '');
  clsChip.style.background = '#fff';
  clsChip.style.color = '#7a7468';
  clsChip.style.border = '1.5px dashed #c9b6ee';
  clsChip.innerHTML = '🎓 Classes';
  clsChip.title = 'Show assignment due dates from the Classes page (read-only)';
  clsChip.addEventListener('click', () => { showClassEvents = !showClassEvents; renderLegend(); render(); });
  el.appendChild(clsChip);
}

/* ============ NAV ============ */
function updateNavLabel() {
  const label = document.getElementById('nav-label');
  if (currentView === 'month') {
    label.textContent = MONTHS_FULL[currentDate.getMonth()] + ' ' + currentDate.getFullYear();
  } else {
    const ws = getWeekStart(currentDate);
    const we = new Date(ws); we.setDate(ws.getDate()+6);
    if (ws.getMonth() === we.getMonth()) {
      label.textContent = MONTHS_SHORT[ws.getMonth()] + ' ' + ws.getDate() + '–' + we.getDate() + ', ' + ws.getFullYear();
    } else {
      label.textContent = MONTHS_SHORT[ws.getMonth()]+' '+ws.getDate()+' – '+MONTHS_SHORT[we.getMonth()]+' '+we.getDate();
    }
  }
}

function navigate(dir) {
  if (currentView === 'month') {
    currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth()+dir, 1);
  } else {
    currentDate.setDate(currentDate.getDate() + dir*7);
  }
  render();
}

function goToday() {
  currentDate = new Date(TODAY);
  render();
}

function setView(v) {
  currentView = v;
  document.getElementById('btn-month').classList.toggle('active', v === 'month');
  document.getElementById('btn-week').classList.toggle('active', v === 'week');
  save();
  render();
}

/* ============ RENDER ============ */
function render() {
  updateNavLabel();
  if (currentView === 'month') renderMonth();
  else renderWeek();
}

function renderMonth() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  const grid = document.createElement('div'); grid.className = 'month-grid';

  const hrow = document.createElement('div'); hrow.className = 'month-header-row';
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d => {
    const h = document.createElement('div');
    h.className = 'month-dow';
    h.textContent = d;
    hrow.appendChild(h);
  });
  grid.appendChild(hrow);

  const body = document.createElement('div'); body.className = 'month-body';
  const y = currentDate.getFullYear(), m = currentDate.getMonth();
  const firstDay = new Date(y, m, 1);
  const lastDay = new Date(y, m+1, 0);
  const startDow = firstDay.getDay() === 0 ? 6 : firstDay.getDay()-1;
  const totalCells = Math.ceil((startDow + lastDay.getDate()) / 7) * 7;

  for (let i = 0; i < totalCells; i++) {
    const cellDate = new Date(y, m, 1 - startDow + i);
    const isOther = !isSameMonth(cellDate, firstDay);
    const dStr = dateKey(cellDate);
    const dayEvs = eventsForDate(dStr);

    const cell = document.createElement('div');
    cell.className = 'month-cell' + (isOther?' other-month':'') + (isToday(cellDate)?' today':'');
    cell.addEventListener('click', e => {
      if (e.target === cell || e.target.classList.contains('month-events') || e.target.classList.contains('day-num')) {
        openAddModal(dStr);
      }
    });

    const num = document.createElement('div');
    num.className = 'day-num';
    num.textContent = cellDate.getDate();
    cell.appendChild(num);

    const evsWrap = document.createElement('div');
    evsWrap.className = 'month-events';

    dayEvs.forEach(ev => {
      const cat = getCat(ev.cat);
      const chip = document.createElement('div');
      chip.className = 'month-event-chip' + (ev.done?' done':'');
      chip.style.background = cat.bg;
      chip.style.color = cat.text;

      const checkEl = document.createElement('div');
      checkEl.className = 'chip-check' + (ev.done?' checked':'');
      checkEl.addEventListener('click', e => { e.stopPropagation(); toggleDone(ev.id); });

      const textEl = document.createElement('span');
      textEl.className = 'chip-text';
      textEl.textContent = (ev.time ? formatTime(ev.time) + ' ' : '') + ev.title;
      textEl.addEventListener('click', e => { e.stopPropagation(); openEditModal(ev.id); });

      const delEl = document.createElement('span');
      delEl.className = 'chip-del';
      delEl.textContent = '✕';
      delEl.addEventListener('click', e => { e.stopPropagation(); deleteEvent(ev.id); });

      chip.appendChild(checkEl);
      chip.appendChild(textEl);
      chip.appendChild(delEl);
      evsWrap.appendChild(chip);
    });

    classForDate(dStr).forEach(ce => {
      const cc = document.createElement('div');
      cc.className = 'month-event-chip' + (ce.done ? ' done' : '');
      cc.style.background = '#fff';
      cc.style.color = ce.color;
      cc.style.border = '1px dashed ' + ce.color;
      cc.title = ce.cls + ' · ' + ce.title + ' — manage in Classes';
      cc.innerHTML = `<span class="chip-text">🎓 ${esc(ce.title)}</span>`;
      cc.addEventListener('click', e => { e.stopPropagation(); window.location.href = '../classes/'; });
      evsWrap.appendChild(cc);
    });


    cell.appendChild(evsWrap);
    body.appendChild(cell);
  }

  grid.appendChild(body);
  main.appendChild(grid);
}

function renderWeek() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  const grid = document.createElement('div'); grid.className = 'week-grid';
  const ws = getWeekStart(currentDate);

  const dowLabels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  for (let i = 0; i < 7; i++) {
    const d = new Date(ws);
    d.setDate(ws.getDate()+i);
    const dStr = dateKey(d);
    const dayEvs = eventsForDate(dStr);
    const isT = isToday(d);

    const col = document.createElement('div');
    col.className = 'week-col' + (isT?' today-col':'');

    const hdr = document.createElement('div'); hdr.className = 'week-col-header';
    hdr.innerHTML = `<div class="week-dow">${dowLabels[i]}</div><div class="week-day-num">${d.getDate()}</div>`;
    col.appendChild(hdr);

    const evsWrap = document.createElement('div'); evsWrap.className = 'week-events';

    dayEvs.forEach(ev => {
      const cat = getCat(ev.cat);
      const evEl = document.createElement('div');
      evEl.className = 'week-event' + (ev.done?' done':'');
      evEl.style.background = cat.bg;
      evEl.style.color = cat.text;

      const checkEl = document.createElement('div');
      checkEl.className = 'ev-check' + (ev.done?' checked':'');
      checkEl.addEventListener('click', e => { e.stopPropagation(); toggleDone(ev.id); });

      const body = document.createElement('div'); body.className = 'ev-body';
      const titleEl = document.createElement('div'); titleEl.className = 'ev-title'; titleEl.textContent = ev.title;
      body.appendChild(titleEl);
      if (ev.time) {
        const timeEl = document.createElement('div');
        timeEl.className = 'ev-time';
        timeEl.textContent = formatTime(ev.time);
        body.appendChild(timeEl);
      }
      if (ev.note) {
        const noteEl = document.createElement('div');
        noteEl.className = 'ev-time';
        noteEl.textContent = ev.note;
        body.appendChild(noteEl);
      }

      const delBtn = document.createElement('button');
      delBtn.className = 'ev-del';
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', e => { e.stopPropagation(); deleteEvent(ev.id); });

      evEl.appendChild(checkEl);
      evEl.appendChild(body);
      evEl.appendChild(delBtn);
      evEl.addEventListener('click', e => {
        if (e.target !== checkEl && !e.target.classList.contains('ev-del')) openEditModal(ev.id);
      });
      evsWrap.appendChild(evEl);
    });

    classForDate(dStr).forEach(ce => {
      const ccEl = document.createElement('div');
      ccEl.className = 'week-event' + (ce.done ? ' done' : '');
      ccEl.style.background = '#fff';
      ccEl.style.color = ce.color;
      ccEl.style.border = '1px dashed ' + ce.color;
      ccEl.style.cursor = 'pointer';
      ccEl.innerHTML = `<div class="ev-body"><div class="ev-title">🎓 ${esc(ce.title)}</div><div class="ev-time">${esc(ce.cls)}</div></div>`;
      ccEl.addEventListener('click', () => { window.location.href = '../classes/'; });
      evsWrap.appendChild(ccEl);
    });


    col.appendChild(evsWrap);

    const addBtn = document.createElement('button');
    addBtn.className = 'week-add-btn';
    addBtn.textContent = '+ add';
    addBtn.addEventListener('click', () => openAddModal(dStr));
    col.appendChild(addBtn);

    grid.appendChild(col);
  }

  main.appendChild(grid);
}

/* ============ EVENT MODAL ============ */
function buildCatPicker(selectedCat) {
  const picker = document.getElementById('cat-picker');
  picker.innerHTML = '';
  pendingCat = (selectedCat && CATS.find(c => c.id === selectedCat)) ? selectedCat : ((CATS[0] && CATS[0].id) || 'personal');
  CATS.forEach(c => {
    const btn = document.createElement('div');
    btn.className = 'cat-option' + (c.id === pendingCat ? ' selected' : '');
    btn.style.background = c.bg;
    btn.style.color = c.text;
    btn.textContent = c.label;
    btn.dataset.cat = c.id;
    btn.addEventListener('click', () => {
      pendingCat = c.id;
      document.querySelectorAll('.cat-option').forEach(o => o.classList.remove('selected'));
      btn.classList.add('selected');
    });
    picker.appendChild(btn);
  });
}

function openAddModal(dateStr) {
  editingId = null;
  document.getElementById('modal-title').textContent = 'Add event';
  document.getElementById('ev-title').value = '';
  document.getElementById('ev-date').value = dateStr || dateKey(TODAY);
  document.getElementById('ev-time').value = '';
  document.getElementById('ev-note').value = '';
  document.getElementById('modal-delete-btn').style.display = 'none';
  buildCatPicker('personal');
  document.getElementById('modal').classList.add('show');
  setTimeout(() => document.getElementById('ev-title').focus(), 100);
}

function openEditModal(id) {
  const ev = events.find(e => e.id === id);
  if (!ev) return;
  editingId = id;
  document.getElementById('modal-title').textContent = 'Edit event';
  document.getElementById('ev-title').value = ev.title;
  document.getElementById('ev-date').value = ev.date;
  document.getElementById('ev-time').value = ev.time || '';
  document.getElementById('ev-note').value = ev.note || '';
  document.getElementById('modal-delete-btn').style.display = 'inline-flex';
  buildCatPicker(ev.cat);
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  editingId = null;
}

function saveEvent() {
  const title = document.getElementById('ev-title').value.trim();
  if (!title) { document.getElementById('ev-title').focus(); return; }
  const date = document.getElementById('ev-date').value;
  if (!date) { document.getElementById('ev-date').focus(); return; }
  const time = document.getElementById('ev-time').value;
  const note = document.getElementById('ev-note').value.trim();

  if (editingId) {
    const idx = events.findIndex(e => e.id === editingId);
    if (idx >= 0) {
      events[idx].title = title;
      events[idx].date = date;
      events[idx].time = time;
      events[idx].note = note;
      events[idx].cat = pendingCat;
    }
  } else {
    events.push({id: id(), title, date, time, cat: pendingCat, note, done: false});
  }
  save();
  closeModal();
  render();
  showToast('Event saved ✓');
}

function deleteEvent(eventId) {
  events = events.filter(e => e.id !== eventId);
  save();
  render();
  showToast('Event removed');
}

function deleteFromModal() {
  if (!editingId) return;
  if (!confirm('Delete this event?')) return;
  deleteEvent(editingId);
  closeModal();
}

function toggleDone(id) {
  const ev = events.find(e => e.id === id);
  if (!ev) return;
  ev.done = !ev.done;
  save();
  render();
}

/* ============ CATEGORY MANAGER ============ */
function openCatManager() {
  catEdit = CATS.map(c => Object.assign({}, c));
  renderCatManager();
  document.getElementById('cat-modal').classList.add('show');
}
function closeCatManager() {
  document.getElementById('cat-modal').classList.remove('show');
  catEdit = null;
}
function syncCatLabels() {
  document.querySelectorAll('#cat-manager-list .cat-row').forEach((row, i) => {
    const inp = row.querySelector('.cat-row-label');
    if (inp && catEdit[i]) catEdit[i].label = inp.value;
  });
}
function renderCatManager() {
  const list = document.getElementById('cat-manager-list');
  list.innerHTML = '';
  catEdit.forEach((c, idx) => {
    const row = document.createElement('div');
    row.className = 'cat-row';

    const inp = document.createElement('input');
    inp.className = 'form-input cat-row-label';
    inp.value = c.label;
    inp.style.background = c.bg;
    inp.style.color = c.text;
    row.appendChild(inp);

    const sw = document.createElement('div');
    sw.className = 'cat-swatches';
    PRESETS.forEach(p => {
      const dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'cat-sw';
      dot.style.background = p.dot;
      if (c.dot === p.dot) dot.style.borderColor = '#1a1612';
      dot.addEventListener('click', () => {
        syncCatLabels();
        catEdit[idx].bg = p.bg; catEdit[idx].text = p.text; catEdit[idx].dot = p.dot;
        renderCatManager();
      });
      sw.appendChild(dot);
    });
    row.appendChild(sw);

    const up = document.createElement('button');
    up.className = 'cat-ctrl'; up.textContent = '↑';
    up.addEventListener('click', () => {
      if (idx > 0) { syncCatLabels(); const t = catEdit[idx-1]; catEdit[idx-1] = catEdit[idx]; catEdit[idx] = t; renderCatManager(); }
    });
    const dn = document.createElement('button');
    dn.className = 'cat-ctrl'; dn.textContent = '↓';
    dn.addEventListener('click', () => {
      if (idx < catEdit.length-1) { syncCatLabels(); const t = catEdit[idx+1]; catEdit[idx+1] = catEdit[idx]; catEdit[idx] = t; renderCatManager(); }
    });
    const del = document.createElement('button');
    del.className = 'cat-ctrl'; del.textContent = '✕'; del.style.color = '#a04040';
    del.addEventListener('click', () => {
      if (catEdit.length > 1) { syncCatLabels(); catEdit.splice(idx, 1); renderCatManager(); }
    });
    row.appendChild(up); row.appendChild(dn); row.appendChild(del);

    list.appendChild(row);
  });
}
function addCatRow() {
  syncCatLabels();
  const p = PRESETS[catEdit.length % PRESETS.length];
  catEdit.push({id: 'cat' + Date.now().toString(36) + Math.floor(Math.random()*1000), label: 'New category', bg: p.bg, text: p.text, dot: p.dot});
  renderCatManager();
}
function saveCatManager() {
  syncCatLabels();
  if (!catEdit.length) return;
  catEdit.forEach((c, i) => { if (!c.label.trim()) c.label = 'Category ' + (i+1); });
  CATS = catEdit.map(c => Object.assign({}, c));
  saveCats();

  const ids = {}; CATS.forEach(c => ids[c.id] = true);
  const fallback = (CATS.find(c => c.id === 'personal') || CATS[0]).id;
  let changed = false;
  events.forEach(e => { if (!ids[e.cat]) { e.cat = fallback; changed = true; } });
  if (changed) save();

  buildActiveCats();
  closeCatManager();
  renderLegend();
  render();
  showToast('Categories saved ✓');
}

/* ============ TOAST ============ */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ============ EVENT BINDINGS ============ */
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-cancel').addEventListener('click', closeModal);
document.getElementById('modal-save').addEventListener('click', saveEvent);
document.getElementById('modal-delete-btn').addEventListener('click', deleteFromModal);
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});
document.getElementById('cat-modal-close').addEventListener('click', closeCatManager);
document.getElementById('cat-modal-cancel').addEventListener('click', closeCatManager);
document.getElementById('cat-modal-save').addEventListener('click', saveCatManager);
document.getElementById('cat-add-btn').addEventListener('click', addCatRow);
document.getElementById('cat-modal').addEventListener('click', e => {
  if (e.target.id === 'cat-modal') closeCatManager();
});
document.addEventListener('keydown', e => {
  const evModalOpen = document.getElementById('modal').classList.contains('show');
  const catModalOpen = document.getElementById('cat-modal').classList.contains('show');
  if (e.key === 'Escape') { if (evModalOpen) closeModal(); if (catModalOpen) closeCatManager(); }
  if (e.key === 'Enter' && evModalOpen && document.activeElement.tagName !== 'BUTTON') {
    e.preventDefault();
    saveEvent();
  }
});

/* ============ INIT ============ */
const now = new Date();
document.getElementById('today-date').textContent =
  DAYS_FULL[now.getDay()] + ', ' + MONTHS_FULL[now.getMonth()] + ' ' + now.getDate() + ', ' + now.getFullYear();

loadCats();
load();
migrateEventCats();
buildActiveCats();
renderLegend();
render();
