<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financial Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f3ecd8; --surface: #fff; --sidebar: #f8f1dd;
  --sidebar-line: #e6dec5; --ink: #1a1612; --muted: #7a7468;
  --line: #ececec; --warm: #faf6ec;
  --accent: #c9b6ee; --accent-deep: #b099e0; --accent-soft: #ede5fb;
}
html, body { background: var(--bg); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: var(--ink); min-height: 100vh; -webkit-font-smoothing: antialiased; }

.topbar { background: var(--sidebar); border-bottom: 1px solid var(--sidebar-line); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.topbar-left { display: flex; align-items: center; gap: 14px; }
.back-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border: 1.5px solid #d9d2bd; border-radius: 20px; font-size: 12px; color: var(--muted); cursor: pointer; background: transparent; font-family: inherit; text-decoration: none; transition: all .15s; }
.back-btn:hover { border-color: var(--accent-deep); color: var(--ink); }
.topbar-title { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; letter-spacing: -0.4px; }
.topbar-date { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); font-weight: 500; }

.hub { max-width: 1060px; margin: 0 auto; padding: 28px 24px 60px; }

.sec-title { font-size: 9.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
.sec-title::after { content: ''; flex: 1; height: 1px; background: var(--line); }

/* Layout */
.main-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px 22px; }
.card-blush  { border-top: 3px solid #b099e0; } /* Credit Cards — lilac */
.card-sage   { border-top: 3px solid #6f9cc4; } /* Banks — dusty blue */
.card-lav    { border-top: 3px solid #5fa8a0; } /* Investments — teal */
.card-peach  { border-top: 3px solid #cf9b7a; } /* Tools — terracotta */

.card-label { font-size: 9.5px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 3px; }
.card-title { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; letter-spacing: -.3px; margin-bottom: 16px; }
.card-head-row { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; }
.add-btn { padding: 6px 14px; background: var(--ink); color: #fff; border: none; border-radius: 14px; font-size: 11px; font-weight: 700; cursor: pointer; font-family: inherit; transition: transform .15s; flex-shrink: 0; }
.add-btn:hover { transform: translateY(-1px); }

/* CC rows */
.cc-row { padding: 11px 0; border-bottom: 1px solid var(--line); }
.cc-main { display: flex; align-items: center; gap: 9px; }
.cc-mid { display: flex; align-items: center; gap: 8px; margin: 9px 0 1px 19px; padding: 7px 11px; background: var(--warm); border: 1px solid var(--line); border-radius: 10px; }
.cc-mid-tag { font-size: 8px; letter-spacing: .6px; text-transform: uppercase; font-weight: 700; color: var(--accent-deep); background: var(--accent-soft); padding: 2px 7px; border-radius: 6px; flex-shrink: 0; }
.cc-mid-date { font-size: 10.5px; font-weight: 600; color: var(--muted); flex: 1; }
.paid-btn.sm { padding: 3px 8px; font-size: 10px; }
.cp-mid { font-size: 10.5px; color: var(--muted); font-weight: 600; margin-top: 9px; }
.cp-mid b { font-family: 'Fraunces', serif; font-size: 12px; color: var(--accent-deep); font-weight: 600; }
.cc-row:last-child { border-bottom: none; }
.cc-row.inactive { opacity: .42; }
.cc-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; border: 1.5px solid rgba(0,0,0,.08); }
.cc-info { flex: 1; min-width: 0; }
.cc-name { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cc-due { font-size: 10.5px; color: var(--muted); margin-top: 2px; }

.cc-urgency { font-size: 9.5px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; padding: 3px 9px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; }
.urgent { background: #fde0e0; color: #a04040; }
.soon   { background: #fff5d6; color: #6a4a08; }
.ok     { background: #d8eee8; color: #1a4a44; }

.cc-actions { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.portal-btn { display: inline-flex; align-items: center; padding: 4px 9px; border: 1.5px solid var(--line); border-radius: 11px; font-size: 10.5px; font-weight: 600; color: var(--muted); text-decoration: none; transition: all .15s; font-family: inherit; }
.portal-btn:hover { border-color: var(--accent-deep); color: var(--ink); background: var(--accent-soft); }
.paid-btn { padding: 4px 9px; border-radius: 11px; font-size: 10.5px; font-weight: 700; cursor: pointer; border: 1.5px solid; transition: all .15s; font-family: inherit; }
.paid-yes { background: var(--accent-soft); color: var(--accent-deep); border-color: var(--accent); }
.paid-no  { background: var(--warm); color: var(--muted); border-color: var(--line); }
.paid-no:hover { border-color: var(--accent-deep); }
.active-btn { padding: 4px 9px; border-radius: 11px; font-size: 10.5px; font-weight: 700; cursor: pointer; border: 1.5px solid; transition: all .15s; font-family: inherit; }
.is-active   { background: #d8eee8; color: #1a4a44; border-color: #a8d8d0; }
.is-inactive { background: var(--warm); color: var(--muted); border-color: var(--line); }
.del-x { background: none; border: none; font-size: 13px; color: #ccc; cursor: pointer; padding: 2px 4px; flex-shrink: 0; transition: color .15s; line-height: 1; }
.del-x:hover { color: #c44; }

/* Right stack */
.right-stack { display: flex; flex-direction: column; gap: 16px; }
.link-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); gap: 10px; }
.link-row:last-child { border-bottom: none; }
.link-label { font-size: 13px; font-weight: 600; }
.link-sub { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
.link-row-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.open-btn { display: inline-flex; align-items: center; padding: 6px 12px; border: 1.5px solid var(--line); border-radius: 14px; font-size: 11px; font-weight: 600; color: var(--muted); text-decoration: none; transition: all .15s; font-family: inherit; }
.open-btn:hover { border-color: var(--accent-deep); color: var(--ink); background: var(--accent-soft); }
.open-btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.open-btn.primary:hover { background: #2a2218; transform: translateY(-1px); }
.list-empty { font-size: 12px; color: var(--muted); padding: 6px 0; font-style: italic; }

/* Tool modal */
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); backdrop-filter: blur(4px); z-index: 300; align-items: center; justify-content: center; padding: 20px; }
.modal-bg.open { display: flex; }
.modal-box { background: #fff; border-radius: 22px; padding: 26px 28px; width: 100%; max-width: 440px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.3); border: 1px solid var(--line); }
.modal-title { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; margin-bottom: 20px; letter-spacing: -.3px; }
.f-label { font-size: 9.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 6px; display: block; }
.f-input { width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13px; font-family: inherit; color: var(--ink); background: #fff; outline: none; transition: border .15s; margin-bottom: 14px; }
.f-input:focus { border-color: var(--accent-deep); }
.check-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.check-row input { width: 15px; height: 15px; accent-color: var(--accent-deep); cursor: pointer; }
.check-row label { font-size: 13px; font-weight: 600; cursor: pointer; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }
.m-btn { padding: 10px 22px; border-radius: 22px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; border: 1.5px solid; transition: all .15s; }
.m-cancel { background: var(--warm); border-color: var(--line); color: var(--muted); }
.m-cancel:hover { color: var(--ink); }
.m-save { background: var(--ink); border-color: var(--ink); color: #fff; }
.m-save:hover { transform: translateY(-1px); }
.m-del { background: #fce4ec; border-color: #f2c4ce; color: #a0304a; }

/* Reset notice */
.reset-notice { display: none; align-items: center; gap: 8px; padding: 10px 16px; background: #d8eee8; border: 1px solid #a8d8d0; border-radius: 12px; font-size: 11.5px; color: #1a4a44; font-weight: 600; margin-bottom: 20px; }

/* Dots for tools/banks/investments */
.dots-wrap { position: relative; }
.dots-btn { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line); background: #fff; cursor: pointer; font-size: 13px; color: var(--muted); display: flex; align-items: center; justify-content: center; transition: all .15s; font-family: inherit; letter-spacing: 1px; }
.dots-btn:hover { border-color: var(--accent-deep); color: var(--ink); background: var(--accent-soft); }
.dots-menu { display: none; position: absolute; right: 0; bottom: calc(100% + 4px); background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 -6px 20px rgba(0,0,0,.1); min-width: 110px; overflow: hidden; z-index: 50; }
.dots-menu.open { display: block; }
.dots-item { display: block; padding: 10px 14px; font-size: 12px; font-weight: 600; color: var(--ink); cursor: pointer; border: none; background: transparent; font-family: inherit; width: 100%; text-align: left; }
.dots-item:hover { background: var(--warm); }
.dots-item.red { color: #c44; }
.dots-item.red:hover { background: #fce8e8; }

@media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; } }
@media (max-width: 700px) { .topbar { padding: 14px 18px; } .hub { padding: 18px 14px 60px; } }

/* card add/edit, progress, arrows, inactive divider */
.ar-ic { width:11px; height:11px; vertical-align:-1px; margin-left:2px; }
.card-progress { margin-bottom: 14px; }
.cp-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:7px; }
.cp-label { font-size:10.5px; font-weight:600; color:var(--muted); letter-spacing:.3px; }
.cp-count { font-family:'Fraunces',serif; font-size:14px; font-weight:600; color:var(--ink); }
.cp-bar { height:7px; background:var(--line); border-radius:5px; overflow:hidden; }
.cp-fill { height:100%; background:var(--accent-deep); border-radius:5px; transition:width .3s; }
.cc-divider { font-size:8.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); font-weight:700; padding:12px 0 6px; border-top:1px dashed var(--line); margin-top:6px; }
.swatch-row { display:flex; gap:9px; flex-wrap:wrap; margin-bottom:16px; }
.swatch { width:28px; height:28px; border-radius:50%; cursor:pointer; border:2px solid var(--line); transition:transform .12s; }
.swatch:hover { transform:scale(1.08); }
.swatch.sel { border-color:var(--ink); box-shadow:0 0 0 2px #fff, 0 0 0 3.5px var(--ink); }
@media (max-width:700px){ .cc-actions{ gap:4px; } .portal-btn{ padding:5px 9px; } .paid-btn{ padding:5px 9px; } .dots-btn{ width:30px; height:30px; } }
</style>
</head>
<body>

<!-- Tool/Resource Modal -->
<div class="modal-bg" id="res-modal">
  <div class="modal-box">
    <div class="modal-title" id="res-modal-title">Add Resource</div>
    <label class="f-label">Name</label>
    <input class="f-input" id="res-name" type="text" placeholder="e.g. Mint">
    <label class="f-label">Sub-label <span style="font-weight:400;letter-spacing:0;text-transform:none;font-size:9px;">(optional)</span></label>
    <input class="f-input" id="res-sub" type="text" placeholder="e.g. 401k & Roth IRA">
    <label class="f-label">URL</label>
    <input class="f-input" id="res-url" type="url" placeholder="https://...">
    <div class="check-row">
      <input type="checkbox" id="res-primary">
      <label for="res-primary">Primary <span style="font-weight:400;color:var(--muted);font-size:11px;">(dark button)</span></label>
    </div>
    <div class="modal-actions">
      <button class="m-btn m-cancel" id="res-cancel">Cancel</button>
      <button class="m-btn m-del" id="res-delete" style="display:none">Delete</button>
      <button class="m-btn m-save" id="res-save">Save</button>
    </div>
  </div>
</div>

<!-- Card Modal -->
<div class="modal-bg" id="card-modal">
  <div class="modal-box">
    <div class="modal-title" id="card-modal-title">Add Card</div>
    <label class="f-label">Card Name</label>
    <input class="f-input" id="card-name" type="text" placeholder="e.g. Chase Sapphire">
    <label class="f-label">Statement Due Day</label>
    <input class="f-input" id="card-day" type="number" min="1" max="31" placeholder="1–31">
    <label class="f-label">Mid-Cycle Payment Day <span style="font-weight:400;letter-spacing:0;text-transform:none;font-size:9px;">(optional)</span></label>
    <input class="f-input" id="card-day2" type="number" min="1" max="31" placeholder="1–31" style="margin-bottom:5px;">
    <div style="font-size:10px;color:var(--muted);margin-bottom:14px;line-height:1.4;">An optional second payment mid-cycle to keep your utilization low.</div>
    <label class="f-label">Portal URL <span style="font-weight:400;letter-spacing:0;text-transform:none;font-size:9px;">(optional)</span></label>
    <input class="f-input" id="card-url" type="url" placeholder="https://...">
    <label class="f-label">Color</label>
    <div class="swatch-row" id="card-swatches"></div>
    <div class="check-row">
      <input type="checkbox" id="card-active" checked>
      <label for="card-active">Active</label>
    </div>
    <div class="modal-actions">
      <button class="m-btn m-cancel" id="card-cancel">Cancel</button>
      <button class="m-btn m-del" id="card-delete" style="display:none">Delete</button>
      <button class="m-btn m-save" id="card-save">Save</button>
    </div>
  </div>
</div>

<!-- Topbar -->
<div class="topbar">
  <div class="topbar-left">
    <a href="../" class="back-btn">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      Brain 2.0
    </a>
    <div class="topbar-title">Financial Tracker</div>
  </div>
  <div class="topbar-date" id="today-date"></div>
</div>

<div class="hub">
  <div class="reset-notice" id="reset-notice">✓ New month — all cards reset to unpaid</div>

  <div class="main-layout">

    <!-- LEFT: CREDIT CARDS -->
    <div>
      <div class="sec-title">Credit Cards</div>
      <div class="card card-blush">
        <div class="card-head-row">
          <div>
            <div class="card-label">Due Dates & Portals</div>
            <div class="card-title" style="margin-bottom:0">All Cards</div>
          </div>
          <button class="add-btn" onclick="openAddCard()">+ Add</button>
        </div>
        <div class="card-progress" id="card-progress"></div>
        <div id="cc-list"></div>
      </div>
    </div>

    <!-- RIGHT STACK -->
    <div class="right-stack">

      <div>
        <div class="sec-title">Bank Accounts</div>
        <div class="card card-sage">
          <div class="card-head-row">
            <div class="card-title" style="margin-bottom:0">Banks</div>
            <button class="add-btn" onclick="openAddRes('banks')">+ Add</button>
          </div>
          <div id="bank-list"></div>
        </div>
      </div>

      <div>
        <div class="sec-title">Investments & Retirement</div>
        <div class="card card-lav">
          <div class="card-head-row">
            <div class="card-title" style="margin-bottom:0">Investments</div>
            <button class="add-btn" onclick="openAddRes('investments')">+ Add</button>
          </div>
          <div id="invest-list"></div>
        </div>
      </div>

      <div>
        <div class="sec-title">Financial Tools</div>
        <div class="card card-peach">
          <div class="card-head-row">
            <div class="card-title" style="margin-bottom:0">Tools & Resources</div>
            <button class="add-btn" onclick="openAddRes('tools')">+ Add</button>
          </div>
          <div id="tools-list"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
/* AUTH */
(function() {
  var p = localStorage.getItem('brain2auth');
  if (p !== 'Nikkireed234!') {
    var a = prompt('Password:');
    if (a !== 'Nikkireed234!') { document.body.innerHTML = ''; return; }
    localStorage.setItem('brain2auth', a);
  }
})();

/* CARD DATA */
var CARD_SK = 'finTrackerState2';
var MS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MF = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var DS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var ARROW_SVG = '<svg class="ar-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>';

var DEFAULT_CARDS = [
  {id:'c0', name:'Chase Sapphire Preferred', day:22, url:'https://secure.chase.com/web/auth/dashboard#/dashboard/overview', color:'#f2c4ce', active:true,  paid:false, paid2:false, day2:7},
  {id:'c1', name:'Marriott Bonvoy',          day:12, url:'https://secure.chase.com/web/auth/dashboard#/dashboard/overview', color:'#f7d9b0', active:true,  paid:false, paid2:false, day2:27},
  {id:'c2', name:'Venture X',                day:28, url:'https://myaccounts.capitalone.com/#/accountSummary',              color:'#d4b8e0', active:true,  paid:false, paid2:false, day2:13},
  {id:'c3', name:'Bilt Blue Card',           day:5,  url:'https://www.bilt.com',                                           color:'#b8d4f0', active:true,  paid:false, paid2:false, day2:20},
  {id:'c4', name:'Citi AAdvantage Platinum', day:1,  url:'https://www.citi.com/',                                          color:'#b8cfb0', active:true,  paid:false, paid2:false, day2:16},
  {id:'c5', name:'AAdvantage Aviator',       day:18, url:'https://www.aviatormastercard.com/servicing/home',               color:'#e0cec8', active:false, paid:false, paid2:false, day2:3},
  {id:'c6', name:'Discover',                 day:24, url:'https://card.discover.com/web/achome/homepage',                  color:'#c8c8d8', active:false, paid:false, paid2:false, day2:9},
];

var cards = [];
var midCycleSeeded = false;
function midFromStatement(day) { var m = (parseInt(day, 10) || 1) + 15; if (m > 30) m -= 30; if (m > 28) m = 28; if (m < 1) m = 1; return m; }

function monthKey() {
  var n = new Date(); return n.getFullYear() + '-' + (n.getMonth() + 1);
}
function saveCards() {
  localStorage.setItem(CARD_SK, JSON.stringify({ cards: cards, lastReset: monthKey(), midCycleSeeded: midCycleSeeded }));
}
function loadCards() {
  var raw = localStorage.getItem(CARD_SK);
  if (!raw) {
    cards = JSON.parse(JSON.stringify(DEFAULT_CARDS));
    midCycleSeeded = true;
    return;
  }
  try {
    var s = JSON.parse(raw);
    midCycleSeeded = !!s.midCycleSeeded;
    // New format
    if (s.cards && Array.isArray(s.cards)) {
      cards = s.cards;
    } else {
      // Old format (index-keyed object)
      cards = DEFAULT_CARDS.map(function(d, i) {
        var o = s[i] || {};
        return { id: d.id, name: d.name, day: d.day, url: d.url, color: d.color,
                 active: o.active !== undefined ? o.active : d.active,
                 paid: o.paid || false };
      });
    }
    // Ensure fields
    cards.forEach(function(c) {
      if (!c.id) c.id = 'c' + Date.now() + Math.random().toString(36).slice(2,5);
      if (c.paid === undefined) c.paid = false;
      if (c.paid2 === undefined) c.paid2 = false;
      if (c.active === undefined) c.active = true;
    });
    // One-time: seed a mid-cycle day for existing cards from their statement day (editable afterward)
    if (!midCycleSeeded) {
      cards.forEach(function(c) { if (c.day2 == null) c.day2 = midFromStatement(c.day); });
      midCycleSeeded = true;
      saveCards();
    }
    // Monthly reset
    if (s.lastReset && s.lastReset !== monthKey()) {
      cards.forEach(function(c) { c.paid = false; c.paid2 = false; });
      saveCards();
      var n = document.getElementById('reset-notice');
      n.style.display = 'flex';
      setTimeout(function() { n.style.display = 'none'; }, 4000);
    }
  } catch(e) {
    cards = JSON.parse(JSON.stringify(DEFAULT_CARDS));
    midCycleSeeded = true;
  }
}

/* DATE HELPERS */
function daysUntil(day) {
  var now = new Date(); now.setHours(0,0,0,0);
  var due = new Date(now.getFullYear(), now.getMonth(), day);
  if (due < now) due = new Date(now.getFullYear(), now.getMonth() + 1, day);
  return Math.ceil((due - now) / 86400000);
}
function dueDateStr(day) {
  var now = new Date(); now.setHours(0,0,0,0);
  var due = new Date(now.getFullYear(), now.getMonth(), day);
  if (due < now) due = new Date(now.getFullYear(), now.getMonth() + 1, day);
  return MS[due.getMonth()] + ' ' + due.getDate();
}
function urgency(d) {
  if (d <= 7)  return { cls: 'urgent', label: d === 0 ? 'Today!' : d + 'd' };
  if (d <= 14) return { cls: 'soon',   label: d + 'd' };
  return               { cls: 'ok',    label: d + 'd' };
}
function sortedCards() {
  return cards.map(function(c) {
    return { id:c.id, name:c.name, day:c.day, day2:c.day2, url:c.url, color:c.color, active:c.active, paid:c.paid, paid2:c.paid2, d:daysUntil(c.day) };
  }).sort(function(a, b) {
    if (a.active && !b.active) return -1;
    if (!a.active && b.active) return 1;
    return a.d - b.d;
  });
}

/* RENDER CARDS */
function renderCards() {
  var list = document.getElementById('cc-list');
  list.innerHTML = '';
  var sorted = sortedCards();
  var dividerShown = false;
  sorted.forEach(function(c) {
    if (!c.active && !dividerShown) {
      var dv = document.createElement('div'); dv.className = 'cc-divider'; dv.textContent = 'Inactive';
      list.appendChild(dv); dividerShown = true;
    }
    var u = urgency(c.d);
    var row = document.createElement('div');
    row.className = 'cc-row' + (c.active ? '' : ' inactive');

    var main = document.createElement('div'); main.className = 'cc-main';
    var dot = document.createElement('div'); dot.className = 'cc-dot'; dot.style.background = c.color;
    var info = document.createElement('div'); info.className = 'cc-info';
    info.innerHTML = '<div class="cc-name">' + esc(c.name) + '</div><div class="cc-due">Statement due ' + dueDateStr(c.day) + '</div>';

    var actions = document.createElement('div'); actions.className = 'cc-actions';
    if (c.active && !c.paid) {
      var badge = document.createElement('span'); badge.className = 'cc-urgency ' + u.cls; badge.textContent = u.label;
      actions.appendChild(badge);
    }
    var paidBtn = document.createElement('button');
    paidBtn.className = 'paid-btn ' + (c.paid ? 'paid-yes' : 'paid-no');
    paidBtn.textContent = c.paid ? '✓ Paid' : 'Unpaid';
    paidBtn.onclick = (function(id){ return function(){ var card = cards.find(function(x){return x.id===id;}); if(card){ card.paid = !card.paid; saveCards(); renderCards(); } }; })(c.id);
    actions.appendChild(paidBtn);
    if (c.url) {
      var portal = document.createElement('a');
      portal.className = 'portal-btn'; portal.href = c.url; portal.target = '_blank';
      portal.innerHTML = 'Portal ' + ARROW_SVG;
      actions.appendChild(portal);
    }
    var dw = document.createElement('div'); dw.className = 'dots-wrap';
    var db = document.createElement('button'); db.className = 'dots-btn'; db.textContent = '\u00b7\u00b7\u00b7';
    var dm = document.createElement('div'); dm.className = 'dots-menu';
    var editItem = document.createElement('button'); editItem.className = 'dots-item'; editItem.textContent = 'Edit';
    editItem.onclick = (function(id){ return function(e){ e.stopPropagation(); dm.classList.remove('open'); openEditCard(id); }; })(c.id);
    var actItem = document.createElement('button'); actItem.className = 'dots-item'; actItem.textContent = c.active ? 'Make Inactive' : 'Make Active';
    actItem.onclick = (function(id){ return function(e){ e.stopPropagation(); dm.classList.remove('open'); var card=cards.find(function(x){return x.id===id;}); if(card){ card.active = !card.active; saveCards(); renderCards(); } }; })(c.id);
    var delItem = document.createElement('button'); delItem.className = 'dots-item red'; delItem.textContent = 'Delete';
    delItem.onclick = (function(id){ return function(e){ e.stopPropagation(); dm.classList.remove('open'); var card=cards.find(function(x){return x.id===id;}); if(card && confirm('Delete "'+card.name+'"?\n\nTip: use Make Inactive to keep it for reference.')){ cards = cards.filter(function(x){return x.id!==id;}); saveCards(); renderCards(); } }; })(c.id);
    dm.appendChild(editItem); dm.appendChild(actItem); dm.appendChild(delItem);
    db.onclick = function(e){ e.stopPropagation(); document.querySelectorAll('.dots-menu.open').forEach(function(m){ if(m!==dm) m.classList.remove('open'); }); dm.classList.toggle('open'); };
    dw.appendChild(db); dw.appendChild(dm);
    actions.appendChild(dw);

    main.appendChild(dot); main.appendChild(info); main.appendChild(actions);
    row.appendChild(main);

    /* optional mid-cycle payment sub-row */
    if (c.day2) {
      var mid = document.createElement('div'); mid.className = 'cc-mid';
      var tag = document.createElement('span'); tag.className = 'cc-mid-tag'; tag.textContent = 'Mid-cycle';
      var mdate = document.createElement('span'); mdate.className = 'cc-mid-date'; mdate.textContent = dueDateStr(c.day2);
      var mBtn = document.createElement('button');
      mBtn.className = 'paid-btn sm ' + (c.paid2 ? 'paid-yes' : 'paid-no');
      mBtn.textContent = c.paid2 ? '✓ Paid' : 'Log payment';
      mBtn.onclick = (function(id){ return function(){ var card = cards.find(function(x){return x.id===id;}); if(card){ card.paid2 = !card.paid2; saveCards(); renderCards(); } }; })(c.id);
      mid.appendChild(tag); mid.appendChild(mdate); mid.appendChild(mBtn);
      row.appendChild(mid);
    }

    list.appendChild(row);
  });
  renderProgress();
}

function renderProgress() {
  var el = document.getElementById('card-progress');
  if (!el) return;
  var active = cards.filter(function(c){ return c.active; });
  var total = active.length;
  if (!total) { el.innerHTML = ''; return; }
  var paid = active.filter(function(c){ return c.paid; }).length;
  var pct = Math.round(paid / total * 100);
  var withMid = active.filter(function(c){ return c.day2; });
  var midDone = withMid.filter(function(c){ return c.paid2; }).length;
  var midLine = withMid.length
    ? '<div class="cp-mid">Mid-cycle payments <b>' + midDone + ' / ' + withMid.length + '</b> this month</div>'
    : '';
  el.innerHTML =
    '<div class="cp-row"><span class="cp-label">Statements paid this month</span><span class="cp-count">' + paid + ' / ' + total + '</span></div>' +
    '<div class="cp-bar"><div class="cp-fill" style="width:' + pct + '%"></div></div>' +
    midLine;
}

/* RESOURCE DATA */

var DEFAULT_RES = {
  banks: [
    { id:'b0', name:'SchoolsFirst FCU', sub:'', url:'https://online.schoolsfirstfcu.org/gateway/schoolsfirstfcu/login#/', primary:false },
    { id:'b1', name:'SoFi', sub:'', url:'https://login.sofi.com/', primary:false },
  ],
  investments: [
    { id:'i0', name:'Fidelity', sub:'401k & Roth IRA', url:'https://digital.fidelity.com/ftgw/digital/portfolio/summary?poe=wiUser', primary:false },
  ],
  tools: [
    { id:'t0', name:'Origin', sub:'', url:'https://app.useorigin.com/', primary:true },
    { id:'t1', name:'2026 Financial Allocations Spreadsheet', sub:'', url:'https://docs.google.com/spreadsheets/d/12XIOUZYGcwYSgt7mX99h6DRS3w5KgfllyZZ8VLRUIN8/edit?usp=sharing', primary:true },
    { id:'t2', name:'Venmo', sub:'', url:'https://venmo.com/', primary:false },
    { id:'t3', name:'PayPal', sub:'', url:'https://paypal.com/signin', primary:false },
  ],
};
var res = { banks:[], investments:[], tools:[] };

function saveRes() { localStorage.setItem(RES_SK, JSON.stringify(res)); }
function loadRes() {
  var raw = localStorage.getItem(RES_SK);
  if (!raw) { res = JSON.parse(JSON.stringify(DEFAULT_RES)); return; }
  try {
    var s = JSON.parse(raw);
    res.banks       = s.banks       || JSON.parse(JSON.stringify(DEFAULT_RES.banks));
    res.investments = s.investments || JSON.parse(JSON.stringify(DEFAULT_RES.investments));
    res.tools       = s.tools       || JSON.parse(JSON.stringify(DEFAULT_RES.tools));
  } catch(e) {
    res = JSON.parse(JSON.stringify(DEFAULT_RES));
  }
}

/* RENDER RESOURCE LIST */
function renderResList(elId, items, type) {
  var el = document.getElementById(elId);
  el.innerHTML = '';
  if (!items.length) {
    el.innerHTML = '<div class="list-empty">Nothing added yet.</div>';
    return;
  }
  items.forEach(function(item) {
    var row = document.createElement('div');
    row.className = 'link-row';

    var info = document.createElement('div');
    info.innerHTML = '<div class="link-label">' + esc(item.name) + '</div>' +
      (item.sub ? '<div class="link-sub">' + esc(item.sub) + '</div>' : '');

    var right = document.createElement('div');
    right.className = 'link-row-right';

    var openA = document.createElement('a');
    openA.className = 'open-btn' + (item.primary ? ' primary' : '');
    openA.href = item.url || '#';
    openA.target = '_blank';
    openA.innerHTML = 'Open '+ARROW_SVG;
    right.appendChild(openA);

    /* dots menu */
    var dw = document.createElement('div'); dw.className = 'dots-wrap';
    var db = document.createElement('button'); db.className = 'dots-btn'; db.textContent = '···';
    var dm = document.createElement('div'); dm.className = 'dots-menu';

    var editBtn = document.createElement('button'); editBtn.className = 'dots-item'; editBtn.textContent = 'Edit';
    editBtn.onclick = (function(id, t) { return function(e) { e.stopPropagation(); dm.classList.remove('open'); openEditRes(id, t); }; })(item.id, type);

    var delBtn = document.createElement('button'); delBtn.className = 'dots-item red'; delBtn.textContent = 'Delete';
    delBtn.onclick = (function(id, t) { return function(e) { e.stopPropagation(); dm.classList.remove('open'); deleteRes(id, t); }; })(item.id, type);

    dm.appendChild(editBtn); dm.appendChild(delBtn);
    db.onclick = function(e) {
      e.stopPropagation();
      document.querySelectorAll('.dots-menu.open').forEach(function(m) { if (m !== dm) m.classList.remove('open'); });
      dm.classList.toggle('open');
    };
    dw.appendChild(db); dw.appendChild(dm);
    right.appendChild(dw);

    row.appendChild(info); row.appendChild(right);
    el.appendChild(row);
  });
}

function renderAllRes() {
  renderResList('bank-list',   res.banks,       'banks');
  renderResList('invest-list', res.investments, 'investments');
  renderResList('tools-list',  res.tools,       'tools');
}

/* RESOURCE MODAL */
var editResId = null, editResType = null;

function openAddRes(type) {
  editResId = null; editResType = type;
  var labels = { banks:'Add Bank Account', investments:'Add Investment', tools:'Add Tool / Resource' };
  document.getElementById('res-modal-title').textContent = labels[type] || 'Add Resource';
  document.getElementById('res-name').value = '';
  document.getElementById('res-sub').value = '';
  document.getElementById('res-url').value = '';
  document.getElementById('res-primary').checked = false;
  document.getElementById('res-delete').style.display = 'none';
  document.getElementById('res-modal').classList.add('open');
  setTimeout(function() { document.getElementById('res-name').focus(); }, 100);
}
function openEditRes(id, type) {
  var item = res[type].find(function(x) { return x.id === id; });
  if (!item) return;
  editResId = id; editResType = type;
  document.getElementById('res-modal-title').textContent = 'Edit';
  document.getElementById('res-name').value = item.name;
  document.getElementById('res-sub').value = item.sub || '';
  document.getElementById('res-url').value = item.url || '';
  document.getElementById('res-primary').checked = item.primary || false;
  document.getElementById('res-delete').style.display = 'inline-flex';
  document.getElementById('res-modal').classList.add('open');
}
function closeResModal() {
  document.getElementById('res-modal').classList.remove('open');
  editResId = null; editResType = null;
}
function saveResModal() {
  var name = document.getElementById('res-name').value.trim();
  if (!name) { document.getElementById('res-name').focus(); return; }
  var sub     = document.getElementById('res-sub').value.trim();
  var url     = document.getElementById('res-url').value.trim();
  var primary = document.getElementById('res-primary').checked;
  if (editResId) {
    var item = res[editResType].find(function(x) { return x.id === editResId; });
    if (item) { item.name = name; item.sub = sub; item.url = url; item.primary = primary; }
  } else {
    res[editResType].push({ id: 'r' + Date.now(), name: name, sub: sub, url: url, primary: primary });
  }
  saveRes(); closeResModal(); renderAllRes();
}
function deleteRes(id, type) {
  var item = res[type].find(function(x) { return x.id === id; });
  if (!item || !confirm('Delete "' + item.name + '"?')) return;
  res[type] = res[type].filter(function(x) { return x.id !== id; });
  saveRes(); renderAllRes();
}
function deleteResFromModal() {
  if (editResId && editResType) { deleteRes(editResId, editResType); closeResModal(); }
}

document.getElementById('res-cancel').onclick = closeResModal;
document.getElementById('res-save').onclick = saveResModal;
document.getElementById('res-delete').onclick = deleteResFromModal;
document.getElementById('res-modal').addEventListener('click', function(e) { if (e.target === this) closeResModal(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') { closeResModal(); closeCardModal(); } });
document.addEventListener('click', function(e) {
  if (!e.target.closest('.dots-wrap')) {
    document.querySelectorAll('.dots-menu.open').forEach(function(m) { m.classList.remove('open'); });
  }
});

/* CARD MODAL */
var CARD_COLORS = ['#b099e0','#f2c4ce','#f7d9b0','#d4b8e0','#b8d4f0','#b8cfb0','#e0cec8','#c8c8d8','#a7cbb0','#f6c89e'];
var editCardId = null, selectedColor = CARD_COLORS[0];

function renderSwatches() {
  var wrap = document.getElementById('card-swatches'); wrap.innerHTML = '';
  CARD_COLORS.forEach(function(col) {
    var sw = document.createElement('div');
    sw.className = 'swatch' + (col === selectedColor ? ' sel' : '');
    sw.style.background = col;
    sw.onclick = function() { selectedColor = col; renderSwatches(); };
    wrap.appendChild(sw);
  });
}
function openAddCard() {
  editCardId = null; selectedColor = CARD_COLORS[0];
  document.getElementById('card-modal-title').textContent = 'Add Card';
  document.getElementById('card-name').value = '';
  document.getElementById('card-day').value = '';
  document.getElementById('card-day2').value = '';
  document.getElementById('card-url').value = '';
  document.getElementById('card-active').checked = true;
  document.getElementById('card-delete').style.display = 'none';
  renderSwatches();
  document.getElementById('card-modal').classList.add('open');
  setTimeout(function(){ document.getElementById('card-name').focus(); }, 100);
}
function openEditCard(id) {
  var c = cards.find(function(x){ return x.id === id; });
  if (!c) return;
  editCardId = id; selectedColor = c.color || CARD_COLORS[0];
  document.getElementById('card-modal-title').textContent = 'Edit Card';
  document.getElementById('card-name').value = c.name;
  document.getElementById('card-day').value = c.day;
  document.getElementById('card-day2').value = c.day2 || '';
  document.getElementById('card-url').value = c.url || '';
  document.getElementById('card-active').checked = c.active !== false;
  document.getElementById('card-delete').style.display = 'inline-flex';
  renderSwatches();
  document.getElementById('card-modal').classList.add('open');
}
function closeCardModal() {
  document.getElementById('card-modal').classList.remove('open');
  editCardId = null;
}
function saveCardModal() {
  var name = document.getElementById('card-name').value.trim();
  if (!name) { document.getElementById('card-name').focus(); return; }
  var day = parseInt(document.getElementById('card-day').value, 10);
  if (!day || day < 1) day = 1;
  if (day > 31) day = 31;
  var d2raw = document.getElementById('card-day2').value.trim();
  var day2 = d2raw ? parseInt(d2raw, 10) : null;
  if (day2 !== null) { if (!day2 || day2 < 1) day2 = 1; if (day2 > 31) day2 = 31; }
  var url = document.getElementById('card-url').value.trim();
  var active = document.getElementById('card-active').checked;
  if (editCardId) {
    var c = cards.find(function(x){ return x.id === editCardId; });
    if (c) { c.name = name; c.day = day; c.day2 = day2; c.url = url; c.color = selectedColor; c.active = active; }
  } else {
    cards.push({ id:'c' + Date.now() + Math.random().toString(36).slice(2,5), name:name, day:day, day2:day2, url:url, color:selectedColor, active:active, paid:false, paid2:false });
  }
  saveCards(); closeCardModal(); renderCards();
}
function deleteCardFromModal() {
  if (!editCardId) return;
  var c = cards.find(function(x){ return x.id === editCardId; });
  if (!c || !confirm('Delete "' + c.name + '"?')) return;
  cards = cards.filter(function(x){ return x.id !== editCardId; });
  saveCards(); closeCardModal(); renderCards();
}
document.getElementById('card-cancel').onclick = closeCardModal;
document.getElementById('card-save').onclick = saveCardModal;
document.getElementById('card-delete').onclick = deleteCardFromModal;
document.getElementById('card-modal').addEventListener('click', function(e){ if (e.target === this) closeCardModal(); });

/* UTILS */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

/* INIIT */
var now = new Date();
document.getElementById('today-date').textContent = DS[now.getDay()] + ', ' + MF[now.getMonth()] + ' ' + now.getDate() + ', ' + now.getFullYear();

loadCards();
loadRes();
renderCards();
renderAllRes();
</script>
