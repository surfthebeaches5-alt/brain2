<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel · Brain 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3ecd8; --surface:#fff; --sb-bg:#f8f1dd; --sidebar:#f8f1dd; --sidebar-line:#e6dec5;
    --lilac:#c9b6ee; --lilac-d:#b099e0;
    --ink:#1a1612; --muted:#7a7468; --line:#ececec;
    --line-soft:#f0ead9;
    --rose:#cf8a93; --amber:#cb9a4f; --sage:#7aa37a; --blue:#7e9cc4;
    --accent:var(--lilac); --accent-deep:var(--lilac-d); --accent-soft:#ede5fb; --warm:#faf6ec;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}

  /* ── TOP BAR ── */
  .topbar{background:var(--sidebar);border-bottom:1px solid var(--sidebar-line);padding:16px 32px;display:flex;align-items:center;justify-content:space-between}
  .topbar-left{display:flex;align-items:center;gap:14px}
  .back-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1.5px solid #d9d2bd;border-radius:20px;font-size:12px;color:var(--muted);cursor:pointer;background:transparent;font-family:inherit;text-decoration:none;transition:all .15s}
  .back-btn:hover{border-color:var(--accent-deep);color:var(--ink)}
  .topbar-title{font-family:'Fraunces',serif;font-size:22px;font-weight:600;letter-spacing:-0.4px}
  .topbar-date{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:500}

  /* ── TABNAV ── */
  .tabnav{background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 18px;overflow-x:auto}
  .tabnav::-webkit-scrollbar{display:none}
  .tabnav button{background:none;border:none;font-family:inherit;font-size:.84rem;font-weight:600;color:var(--muted);padding:14px 16px;border-bottom:2.5px solid transparent;margin-bottom:-1px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:all .15s}
  .tabnav button svg{width:15px;height:15px;flex-shrink:0}
  .tabnav button:hover{color:var(--ink)}
  .tabnav button.active{color:var(--lilac-d);border-bottom-color:var(--lilac-d)}

  .wrap{max-width:1080px;margin:0 auto;padding:28px 38px 80px}
  .ttab-pane{display:none}
  .ttab-pane.show{display:block}

  /* ── SHARED ── */
  .pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;align-items:center}
  .pill{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 16px;border-radius:30px;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:8px}
  .pill:hover{color:var(--ink);border-color:var(--lilac)}
  .pill .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .pill.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pill-add{border:1px dashed var(--lilac-d);background:transparent;color:var(--lilac-d);padding:8px 15px;border-radius:30px;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
  .pill-add:hover{background:rgba(176,153,224,.12)}
  .empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:44px 28px;text-align:center;color:var(--muted);font-size:.86rem}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}
  .sec-title{font-family:'Fraunces',serif;font-size:1.15rem;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:9px}
  .sec-title svg{width:16px;height:16px;color:var(--lilac-d)}
  .mini-label{font-size:9px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:700}
  .statsbar{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:18px;padding:15px 22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;align-items:center}
  .stat{text-align:center}
  .stat-num{font-family:'Fraunces',serif;font-size:24px;font-weight:600;line-height:1;letter-spacing:-.5px}
  .stat-label{font-size:9px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-top:4px;font-weight:700}
  .stat-divider{width:1px;height:32px;background:var(--line);flex-shrink:0}
  .chk{width:19px;height:19px;border:1.5px solid #d9d2bd;border-radius:6px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:all .15s}
  .chk.on{background:var(--sage);border-color:var(--sage)}
  .tx{background:none;border:none;color:#d0c9ba;cursor:pointer;font-size:13px;padding:2px 6px;font-family:inherit;flex-shrink:0;border-radius:6px}
  .tx:hover{color:var(--rose)}
  .row-input{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-family:inherit;font-size:.84rem;background:#fff;color:var(--ink);outline:none;min-width:0}
  .row-input:focus{border-color:var(--lilac-d)}
  select.row-input{cursor:pointer}
  textarea.row-input{resize:vertical;min-height:70px;width:100%;line-height:1.55}
  .add-btn{border:none;background:var(--ink);color:#fff;padding:9px 18px;border-radius:22px;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s}
  .add-btn:hover{opacity:.85}
  .ghost-btn{border:1px dashed var(--lilac-d);background:transparent;color:var(--lilac-d);padding:8px 16px;border-radius:22px;font-size:.8rem;font-weight:600;cursor:pointer;font-family:inherit}
  .ghost-btn:hover{background:rgba(176,153,224,.12)}
  .composer{display:none;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);align-items:center}
  .composer.open{display:flex}
  .bar-track{height:6px;background:var(--line-soft);border-radius:4px;overflow:hidden;flex:1;min-width:60px}
  .bar-fill{height:100%;border-radius:4px;background:var(--sage);transition:width .3s}
  .tag{font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:12px;background:var(--warm);color:var(--muted);white-space:nowrap}
  .truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

  /* ── TRIPS TAB ── */
  .status-group{margin-bottom:30px}
  .status-head{display:flex;align-items:center;gap:10px;margin-bottom:13px}
  .status-head .mini-label{font-size:10px}
  .status-head .count{font-size:.72rem;color:var(--muted);font-weight:600}
  .trip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:14px}
  .trip-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:all .15s;display:flex;flex-direction:column}
  .trip-card:hover{border-color:var(--lilac);transform:translateY(-2px)}
  .trip-cover{height:86px;position:relative;display:flex;align-items:center;justify-content:center}
  .trip-cover svg.plane{width:26px;height:26px;color:rgba(255,255,255,.85)}
  .trip-cover svg.shape{height:66px;width:auto;max-width:78%}
  .trip-cover svg.shape path{fill:rgba(255,255,255,.5);stroke:rgba(255,255,255,.8);stroke-width:.6}
  .trip-body{padding:13px 16px 15px;display:flex;flex-direction:column;gap:6px;min-width:0}
  .trip-name{font-family:'Fraunces',serif;font-size:1.02rem;font-weight:600;line-height:1.25}
  .trip-meta{font-size:.74rem;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .countdown{font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:12px;background:var(--accent-soft);color:var(--lilac-d)}
  .budget-mini{display:flex;align-items:center;gap:8px;margin-top:2px}
  .budget-mini span{font-size:.68rem;color:var(--muted);font-weight:600;white-space:nowrap}

  /* trip detail */
  .td-back{margin-bottom:16px}
  .td-head{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}
  .td-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .td-title{font-family:'Fraunces',serif;font-size:1.7rem;font-weight:600;letter-spacing:-.3px;line-height:1.2}
  .td-meta-grid{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px}
  .td-meta-item{display:flex;flex-direction:column;gap:4px;min-width:0}
  .td-meta-item .val{font-size:.86rem;font-weight:600}
  .td-actions{display:flex;gap:8px;flex-wrap:wrap}
  .sec-pills{display:flex;gap:6px;margin-bottom:18px;overflow-x:auto;padding-bottom:4px}
  .sec-pills::-webkit-scrollbar{display:none}
  .sec-pills .pill{white-space:nowrap;padding:7px 14px;font-size:.78rem}
  .list-row{display:flex;align-items:center;gap:11px;padding:9px 2px;border-bottom:1px solid var(--line-soft);min-width:0}
  .list-row:last-child{border-bottom:none}
  .list-row .lbl{flex:1;font-size:.86rem;min-width:0}
  .list-row.done .lbl{text-decoration:line-through;color:var(--muted)}
  .due-chip{font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:12px;background:var(--warm);color:var(--muted);white-space:nowrap}
  .due-chip.overdue{background:rgba(207,138,147,.16);color:var(--rose)}
  .due-chip.soon{background:rgba(203,154,79,.16);color:var(--amber)}
  .amt{font-size:.86rem;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
  .ov-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:14px}
  .cat-row{display:flex;align-items:center;gap:10px;padding:6px 0}
  .cat-row .lbl{font-size:.8rem;color:var(--muted);width:130px;flex-shrink:0}
  .cat-row .amt{font-size:.8rem}
  .itin-day{margin-bottom:18px}
  .itin-day-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
  .itin-day-head .d{font-family:'Fraunces',serif;font-weight:600;font-size:1rem}
  .itin-time{font-size:.7rem;font-weight:700;color:var(--lilac-d);width:70px;flex-shrink:0}

  /* ── MAP TAB ── */
  .map-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}
  .map-card svg{width:100%;height:auto;display:block}
  #worldmap path, #worldmap g{fill:#e9e2cd;stroke:#fff;stroke-width:.5;cursor:pointer;transition:fill .15s}
  #worldmap .visited, #worldmap .visited path{fill:var(--sage)}
  #worldmap .want, #worldmap .want path{fill:var(--blue)}
  #worldmap path:hover{fill:var(--lilac)}
  .map-legend{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:0 4px}
  .legend-item{display:flex;align-items:center;gap:7px;font-size:.74rem;color:var(--muted);font-weight:600}
  .legend-swatch{width:12px;height:12px;border-radius:4px}
  .map-feedback{font-size:.78rem;color:var(--muted);margin-left:auto;font-weight:600}
  .region-acc{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
  .region-head{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;user-select:none}
  .region-head:hover{background:var(--warm)}
  .region-head .name{font-weight:700;font-size:.9rem;flex-shrink:0}
  .region-head .prog-txt{font-size:.72rem;color:var(--muted);font-weight:600;white-space:nowrap}
  .region-head .chev{margin-left:auto;flex-shrink:0;color:var(--muted);transition:transform .2s}
  .region-acc.open .chev{transform:rotate(180deg)}
  .region-body{display:none;border-top:1px solid var(--line-soft);padding:6px 18px 12px}
  .region-acc.open .region-body{display:block}
  .country-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft)}
  .country-row:last-child{border-bottom:none}
  .country-row .nm{flex:1;font-size:.85rem;min-width:0}
  .country-row .terr{font-size:.62rem;color:var(--muted);font-weight:700;letter-spacing:.5px}
  .tog{border:1px solid var(--line);background:#fff;color:var(--muted);padding:5px 12px;border-radius:16px;font-size:.7rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
  .tog.v.on{background:var(--sage);border-color:var(--sage);color:#fff}
  .tog.w.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .map-search{width:100%;margin-bottom:14px}

  /* ── BUCKET TAB ── */
  .bk-item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:9px;display:flex;align-items:center;gap:12px;min-width:0}
  .bk-item.done{opacity:.62}
  .bk-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .bk-label{font-size:.88rem;font-weight:600}
  .bk-item.done .bk-label{text-decoration:line-through;color:var(--muted)}
  .bk-sub{font-size:.72rem;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .stars{display:flex;gap:2px}
  .stars button{background:none;border:none;cursor:pointer;padding:0;color:#ddd6c4;font-size:15px;line-height:1}
  .stars button.on{color:var(--amber)}

  /* ── LOG TAB ── */
  .moment{padding:13px 2px;border-bottom:1px solid var(--line-soft)}
  .moment:last-child{border-bottom:none}
  .moment-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
  .moment-title{font-weight:700;font-size:.88rem}
  .moment-txt{font-size:.84rem;color:var(--muted);line-height:1.55;white-space:pre-wrap}
  .month-label{font-family:'Fraunces',serif;font-size:.95rem;font-weight:600;margin:16px 0 4px;color:var(--ink)}
  .month-label:first-child{margin-top:0}
  .lg-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-soft)}
  .lg-row:last-child{border-bottom:none}
  .lg-row .nm{flex:1;font-size:.85rem;font-weight:600;min-width:0}
  .lg-row .v{font-size:.8rem;color:var(--muted);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}

  /* ── MODAL ── */
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(26,22,18,.45);z-index:60;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
  .modal-bg.open{display:flex}
  .modal{background:var(--surface);border-radius:20px;padding:26px;width:100%;max-width:480px;box-shadow:0 18px 50px rgba(0,0,0,.18)}
  .modal h3{font-family:'Fraunces',serif;font-size:1.3rem;font-weight:600;margin-bottom:18px}
  .m-field{margin-bottom:14px}
  .m-field label{display:block;font-size:.72rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .m-field input,.m-field select,.m-field textarea{width:100%}
  .m-two{display:flex;gap:10px}
  .m-two .m-field{flex:1}
  .swatches{display:flex;gap:9px}
  .swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:all .15s}
  .swatch.sel{border-color:var(--ink)}
  .cc-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .cc-chip{display:inline-flex;align-items:center;gap:6px;background:var(--warm);border-radius:14px;padding:4px 10px;font-size:.74rem;font-weight:600}
  .cc-chip button{background:none;border:none;cursor:pointer;color:var(--muted);font-size:12px;padding:0}
  .m-actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}

  @media print{
    .topbar,.tabnav,.pill-add,.add-btn,.ghost-btn,.composer,.tx,.td-actions,.map-search,.tog,.chk{display:none !important}
    .wrap{max-width:none;padding:0}
  }
  @media(max-width:860px){
    .topbar{padding:14px 18px}
    .wrap{padding:22px 16px 70px}
    .statsbar{gap:12px;padding:13px 16px;justify-content:space-around}
    .stat-divider{display:none}
    .td-meta-grid{gap:14px}
    .trip-grid{grid-template-columns:repeat(auto-fill,minmax(min(165px,100%),1fr))}
    .cat-row .lbl{width:100px}
  }
</style>
</head>
<body>

<!-- ─────────── TOP BAR ─────────── -->
<div class="topbar">
  <div class="topbar-left">
    <a href="../" class="back-btn">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      Brain 2.0
    </a>
    <div class="topbar-title">Travel</div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <span class="topbar-date" id="today-date"></span>
  </div>
</div>

<!-- ─────────── TABNAV ─────────── -->
<nav class="tabnav">
  <button class="active" id="tt-trips" onclick="switchTab('trips')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg> Trips</button>
  <button id="tt-map" onclick="switchTab('map')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></svg> Map</button>
  <button id="tt-bucket" onclick="switchTab('bucket')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg> Bucket List</button>
  <button id="tt-log" onclick="switchTab('log')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/></svg> Log</button>
</nav>

<div class="wrap">

  <!-- TAB: TRIPS -->
  <div id="tab-trips" class="ttab-pane show">
    <div id="tr-list-view"></div>
    <div id="tr-detail-view" style="display:none"></div>
  </div>

  <!-- TAB: MAP -->
  <div id="tab-map" class="ttab-pane">
    <div class="statsbar" id="mp-stats"></div>
    <div class="map-card">
      <div id="mp-svg-holder"><svg version="1.1"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     x="0px"
     y="0px"
     viewBox="30.767 241.591 784.077 458.627"
     id="worldmap">
<g>

const KEY='travelTracker1';

function load(){

  S.countries=S.countries||{}; S.trips=S.trips||[]; S.bucket=S.bucket||[]; S.moments=S.moments||[];
}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return '$'+(Math.round(n*100)/100).toLocaleString('en-US',{maximumFractionDigits:2})}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(iso){if(!iso)return'';const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function fmtShort(iso){if(!iso)return'';const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000)}
function daysUntil(iso){return daysBetween(todayISO(),iso)}
const STATUS_COLOR={wish:'#b099e0',planned:'#cb9a4f',current:'#7e9cc4',done:'#7aa37a'};
const STATUS_LABEL={wish:'Wishlist',planned:'Planned',current:'Current',done:'Completed'};
const CAT_LIST=['Flights & Transport','Accommodation','Food & Drinks','Activities','Shopping','Visas & Documents','Other'];

/* trip cover: SVG gradient placeholder w/ plane (same pattern as media tile placeholders) */
const SHAPE_CACHE={};
function countryShape(code){
  if(code in SHAPE_CACHE)return SHAPE_CACHE[code];
  let out=null;
  const bb=COUNTRY_BBOX[code];
  const el=bb?document.querySelector('#worldmap [id="'+code+'"]'):null;
  if(el){
    const clone=el.cloneNode(true);
    clone.removeAttribute('id');clone.removeAttribute('class');
    clone.querySelectorAll('[id]').forEach(x=>x.removeAttribute('id'));
    clone.querySelectorAll('[class]').forEach(x=>x.removeAttribute('class'));
    const [x,y,w2,h2]=bb, pad=Math.max(w2,h2)*.1;
    out=`<svg class="shape" viewBox="${x-pad} ${y-pad} ${w2+2*pad} ${h2+2*pad}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${clone.outerHTML}</svg>`;
  }
  SHAPE_CACHE[code]=out;return out;
}
function coverHTML(t){
  const c=STATUS_COLOR[t.status]||'#b099e0';
  const code=(t.country||[]).find(x=>COUNTRY_BBOX[x]);
  const shape=code?countryShape(code):null;
  const inner=shape||`<svg class="plane" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>`;
  return `<div class="trip-cover" style="background:linear-gradient(135deg,${c},${c}99)">${inner}</div>`;
}
function tripSpent(t){return (t.expenses||[]).filter(e=>e.paid!==false).reduce((s,e)=>s+(Number(e.amt)||0),0)}
function tripPlanned(t){return (t.expenses||[]).filter(e=>e.paid===false).reduce((s,e)=>s+(Number(e.amt)||0),0)}
function budgetColor(pct){return pct>100?'var(--rose)':pct>=70?'var(--amber)':'var(--sage)'}
function countryChips(t){return (t.country||[]).map(c=>C_NAME[c]||c).join(', ')}

/* ════════════════ TABS ════════════════ */
function switchTab(t){
  ['trips','map','bucket','log'].forEach(x=>{
    const btn=document.getElementById('tt-'+x), pane=document.getElementById('tab-'+x);
    if(btn)btn.classList.toggle('active',x===t);
    if(pane)pane.classList.toggle('show',x===t);
  });
  if(t==='map')MP.render();
  if(t==='bucket')BK.render();
  if(t==='log')LG.render();
  if(t==='trips')TR.render();
}

/* ════════════════ TRIPS ════════════════ */
const TR=(()=>{
let activeTripId=null, activeSec='overview', editId=null, modalCountries=[];

function get(id){return S.trips.find(t=>t.id===id)}
function active(){return get(activeTripId)}

function countdownChip(t){
  if(t.status==='done') return t.end?`<span class="tag">${esc((t.end||'').slice(0,4))}</span>`:'';
  if(t.status==='current'){
    if(t.start&&t.end){const total=daysBetween(t.start,t.end)+1;const day=daysBetween(t.start,todayISO())+1;return `<span class="countdown">Day ${Math.max(1,Math.min(day,total))} of ${total}</span>`}
    return '<span class="countdown">Now</span>';
  }
  if(t.start){const d=daysUntil(t.start); if(d>=0)return `<span class="countdown">${d===0?'Today':d+' days away'}</span>`}
  return t.status==='planned'?'<span class="tag">Dates TBD</span>':'<span class="tag">Someday</span>';
}
function nights(t){return t.start&&t.end?Math.max(0,daysBetween(t.start,t.end)):null}

function cardHTML(t){
  const spent=tripSpent(t), b=Number(t.budget)||0, pct=b?Math.round(spent/b*100):0;
  const n=nights(t);
  return `<div class="trip-card" onclick="TR.open('${t.id}')">
    ${coverHTML(t)}
    <div class="trip-body">
      <div class="trip-name truncate">${esc(t.name)}</div>
      <div class="trip-meta">
        ${t.places?`<span class="truncate">${esc(t.places)}</span>`:t.country&&t.country.length?`<span class="truncate">${esc(countryChips(t))}</span>`:''}
        ${t.start?`<span>${fmtShort(t.start)}${t.end?' → '+fmtShort(t.end):''}</span>`:''}
        ${n!=null?`<span>· ${n} nights</span>`:''}
      </div>
      <div>${countdownChip(t)}</div>
      ${b?`<div class="budget-mini"><div class="bar-track"><div class="bar-fill" style="width:${Math.min(pct,100)}%;background:${budgetColor(pct)}"></div></div><span>${pct}%</span></div>`:''}
    </div>
  </div>`;
}

function render(){
  const lv=document.getElementById('tr-list-view'), dv=document.getElementById('tr-detail-view');
  if(activeTripId&&active()){lv.style.display='none';dv.style.display='block';renderDetail();return}
  activeTripId=null; lv.style.display='block'; dv.style.display='none';
  const groups=[['current','Current'],['planned','Planned'],['wish','Wishlist'],['done','Past trips']];
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px">
    <a class="ghost-btn" href="https://wanderlog.com/home" target="_blank" rel="noopener" style="text-decoration:none">Open Wanderlog ↗</a>
    <button class="add-btn" onclick="TR.openModal()">+ New trip</button></div>`;
  let any=false;
  groups.forEach(([st,label])=>{
    let list=S.trips.filter(t=>t.status===st);
    if(st==='done') list=list.slice().sort((a,b)=>(b.start||'').localeCompare(a.start||''));
    else list=list.slice().sort((a,b)=>(a.start||'9999').localeCompare(b.start||'9999'));
    if(!list.length)return;
    any=true;
    h+=`<div class="status-group">
      <div class="status-head"><span class="dot" style="width:9px;height:9px;border-radius:50%;background:${STATUS_COLOR[st]}"></span><span class="mini-label">${label}</span><span class="count">${list.length}</span></div>
      <div class="trip-grid">${list.map(cardHTML).join('')}</div></div>`;
  });
  if(!any) h+=`<div class="empty">No trips yet. Start with the one you keep daydreaming about — even a wishlist entry counts.</div>`;
  lv.innerHTML=h;
}

/* ── detail ── */
function open(id){activeTripId=id;activeSec='overview';render()}
function back(){activeTripId=null;render()}
function setSec(s){activeSec=s;renderDetail()}
function dueClass(iso){if(!iso)return'';const d=daysUntil(iso);return d<0?'overdue':d<=3?'soon':''}

function renderDetail(){
  const t=active(); if(!t){back();return}
  const spent=tripSpent(t), planned=tripPlanned(t), b=Number(t.budget)||0, pct=b?Math.round(spent/b*100):0;
  const pctAll=b?Math.round((spent+planned)/b*100):0;
  const secs=[['overview','Overview'],['tasks','Tasks'],['bookings','Bookings'],['expenses','Expenses'],['itin','Itinerary'],['bucket','Bucket list'],['packing','Packing'],['notes','Notes']];
  let h=`<button class="back-btn td-back" onclick="TR.back()"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg> All trips</button>
  <div class="td-head">
    <div class="td-title-row">
      <div class="td-title">${esc(t.name)}</div>
      <div class="td-actions">
        <select class="row-input" onchange="TR.setStatus(this.value)" style="font-size:.78rem">${Object.entries(STATUS_LABEL).map(([k,v])=>`<option value="${k}" ${t.status===k?'selected':''}>${v}</option>`).join('')}</select>
        <button class="ghost-btn" onclick="TR.openModal('${t.id}')">Edit</button>
      </div>
    </div>
    <div class="td-meta-grid">
      ${t.start?`<div class="td-meta-item"><span class="mini-label">Dates</span><span class="val">${fmtDate(t.start)}${t.end?' → '+fmtDate(t.end):''}</span></div>`:''}
      ${nights(t)!=null?`<div class="td-meta-item"><span class="mini-label">Length</span><span class="val">${nights(t)} nights</span></div>`:''}
      ${t.country&&t.country.length?`<div class="td-meta-item"><span class="mini-label">Where</span><span class="val">${esc(countryChips(t))}${t.places?' · '+esc(t.places):''}</span></div>`:''}
      <div class="td-meta-item" style="flex:1;min-width:170px"><span class="mini-label">Budget${b?` · ${money(spent)} spent of ${money(b)}${planned?` · ${money(planned)} planned`:''}`:''}</span>
        ${b?`<div style="display:flex;align-items:center;gap:8px;margin-top:4px"><div class="bar-track" style="display:flex"><div class="bar-fill" style="width:${Math.min(pct,100)}%;background:${budgetColor(pct)};border-radius:4px 0 0 4px"></div><div class="bar-fill" style="width:${Math.max(0,Math.min(pctAll,100)-Math.min(pct,100))}%;background:${budgetColor(pctAll)};opacity:.35;border-radius:0"></div></div><span style="font-size:.72rem;font-weight:700;color:${budgetColor(pctAll)}">${pctAll}%</span></div>`
        :`<span class="val" style="color:var(--muted)">${spent?money(spent)+' spent':''}${planned?(spent?' · ':'')+money(planned)+' planned':''}${!spent&&!planned?'No budget set':''}</span>`}
      </div>
    </div>
  </div>
  <div class="sec-pills">${secs.map(([k,v])=>`<button class="pill ${activeSec===k?'active':''}" onclick="TR.setSec('${k}')">${v}</button>`).join('')}</div>
  <div id="td-sec">${secHTML(t)}</div>`;
  document.getElementById('tr-detail-view').innerHTML=h;
}

function secHTML(t){
  if(activeSec==='overview')return ovHTML(t);
  if(activeSec==='tasks')return tasksHTML(t);
  if(activeSec==='bookings')return bookingsHTML(t);
  if(activeSec==='expenses')return expensesHTML(t);
  if(activeSec==='itin')return itinHTML(t);
  if(activeSec==='bucket')return tripBucketHTML(t);
  if(activeSec==='packing')return packingHTML(t);
  return notesHTML(t);
}

function ovHTML(t){

  const spent=tripSpent(t);
  const byCat={}; (t.expenses||[]).filter(e=>e.paid!==false).forEach(e=>{byCat[e.cat||'Other']=(byCat[e.cat||'Other']||0)+(Number(e.amt)||0)});
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  return `<div class="ov-grid">

/* ── CRUD ── */
function toggleComposer(k){const el=document.getElementById('cmp-'+k);if(el){el.classList.toggle('open');if(el.classList.contains('open')){const first=el.querySelector('input');if(first)first.focus()}}}
function toggleItem(arr,id){const t=active();const x=(t[arr]||[]).find(i=>i.id===id);if(x){x.done=!x.done;save();renderDetail()}}
function delItem(arr,id){const t=active();t[arr]=(t[arr]||[]).filter(i=>i.id!==id);save();renderDetail()}
function addTask(){const t=active();const l=document.getElementById('new-task-label').value.trim();if(!l)return;t.tasks=t.tasks||[];t.tasks.push({id:uid(),label:l,due:document.getElementById('new-task-due').value||'',done:false});save();renderDetail()}
function addBooking(){const t=active();const l=document.getElementById('new-bk-label').value.trim();if(!l)return;t.bookings=t.bookings||[];let bu=document.getElementById('new-bk-url').value.trim();if(bu&&!/^https?:\/\//i.test(bu))bu='https://'+bu;t.bookings.push({id:uid(),label:l,type:document.getElementById('new-bk-type').value,when:document.getElementById('new-bk-when').value||'',notes:document.getElementById('new-bk-notes').value.trim(),url:bu,done:false});save();renderDetail()}
function addExpense(){const t=active();const l=document.getElementById('new-ex-label').value.trim();const a=parseFloat(document.getElementById('new-ex-amt').value);if(!l||!(a>=0))return;t.expenses=t.expenses||[];t.expenses.push({id:uid(),label:l,amt:a,date:document.getElementById('new-ex-date').value||todayISO(),cat:document.getElementById('new-ex-cat').value,paid:document.getElementById('new-ex-state').value!=='planned'});save();renderDetail()}
function addItin(){const t=active();const l=document.getElementById('new-it-label').value.trim();if(!l)return;t.itin=t.itin||[];let iu=document.getElementById('new-it-url').value.trim();if(iu&&!/^https?:\/\//i.test(iu))iu='https://'+iu;t.itin.push({id:uid(),day:Math.max(1,parseInt(document.getElementById('new-it-day').value)||1),time:document.getElementById('new-it-time').value.trim(),label:l,url:iu});save();renderDetail()}
function addPack(){const t=active();const l=document.getElementById('new-pk-label').value.trim();if(!l)return;t.packing=t.packing||[];t.packing.push({id:uid(),label:l,due:document.getElementById('new-pk-due').value||'',done:false});save();renderDetail()}
function addIdea(){const t=active();const l=document.getElementById('new-pi-label').value.trim();if(!l)return;t.photoIdeas=t.photoIdeas||[];t.photoIdeas.push({id:uid(),label:l,done:false});save();renderDetail()}
function addLink(){const t=active();const l=document.getElementById('new-ln-label').value.trim();let u=document.getElementById('new-ln-url').value.trim();if(!l||!u)return;if(!/^https?:\/\//i.test(u))u='https://'+u;t.links=t.links||[];t.links.push({id:uid(),label:l,url:u});save();renderDetail()}
function saveNotes(v){const t=active();t.notes=v;save()}
function setStatus(v){const t=active();t.status=v;save();renderDetail()}
function togglePaid(id){const t=active();const x=(t.expenses||[]).find(i=>i.id===id);if(x){x.paid=x.paid===false?true:false;if(x.paid&&!x.date)x.date=todayISO();save();renderDetail()}}
function bkToggleFromTrip(id){const b=S.bucket.find(x=>x.id===id);if(b){b.done=!b.done;if(!b.done)b.rating=0;save();renderDetail()}}
function bkRateFromTrip(id,n){const b=S.bucket.find(x=>x.id===id);if(b){b.rating=b.rating===n?0:n;save();renderDetail()}}

/* ── modal ── */
function openModal(id){
  editId=id||null; modalCountries=[];
  const t=id?get(id):null;
  document.getElementById('tm-title').textContent=t?'Edit trip':'New trip';
  document.getElementById('tm-name').value=t?t.name:'';
  document.getElementById('tm-status').value=t?t.status:'wish';
  document.getElementById('tm-budget').value=t&&t.budget?t.budget:'';
  document.getElementById('tm-start').value=t?t.start||'':'';
  document.getElementById('tm-end').value=t?t.end||'':'';
  document.getElementById('tm-places').value=t?t.places||'':'';
  document.getElementById('tm-delete').style.display=t?'block':'none';
  modalCountries=t?(t.country||[]).slice():[];
  renderModalCountries();
  document.getElementById('trip-modal-bg').classList.add('open');
  document.getElementById('tm-name').focus();
}
function closeModal(){document.getElementById('trip-modal-bg').classList.remove('open')}
function renderModalCountries(){document.getElementById('tm-country-chips').innerHTML=modalCountries.map(c=>`<span class="cc-chip">${esc(C_NAME[c]||c)}<button onclick="TR.rmModalCountry('${c}')">✕</button></span>`).join('')}
function addModalCountry(){
  const inp=document.getElementById('tm-country-input');const v=inp.value.trim().toLowerCase();if(!v)return;
  const code=C_CODE[v]||( C_NAME[v]?v:null );
  if(!code){inp.style.borderColor='var(--rose)';setTimeout(()=>inp.style.borderColor='',900);return}
  if(!modalCountries.includes(code))modalCountries.push(code);
  inp.value='';renderModalCountries();
}
function rmModalCountry(c){modalCountries=modalCountries.filter(x=>x!==c);renderModalCountries()}
const STARTER_TASKS=['Book accommodation','Book flights','Arrange airport transfer','Exchange currency','Print / save confirmations'];
const STARTER_PACKING=['Passport / ID','Chargers & adapter','Toiletries','Medications','Clothes for the weather'];
function saveModal(){
  const name=document.getElementById('tm-name').value.trim();if(!name)return;
  // capture any country still typed but not chipped
  if(document.getElementById('tm-country-input').value.trim())addModalCountry();
  const vals={name,status:document.getElementById('tm-status').value,budget:parseFloat(document.getElementById('tm-budget').value)||0,
    start:document.getElementById('tm-start').value||'',end:document.getElementById('tm-end').value||'',
    country:modalCountries.slice(),places:document.getElementById('tm-places').value.trim()};
  if(editId){Object.assign(get(editId),vals)}
  else{
    const t=Object.assign({id:uid(),tasks:[],bookings:[],expenses:[],itin:[],packing:[],photoIdeas:[],links:[],notes:''},vals);
    if(t.status==='wish'||t.status==='planned'){
      t.tasks=STARTER_TASKS.map(l=>({id:uid(),label:l,due:'',done:false}));
      t.packing=STARTER_PACKING.map(l=>({id:uid(),label:l,done:false}));
    }
    S.trips.push(t); activeTripId=t.id; activeSec='overview';
  }
  save();closeModal();render();
}
function deleteTrip(){
  if(!editId)return;
  const t=get(editId);
  if(!confirm(`Delete "${t.name}" and everything in it? This can't be undone.`))return;
  S.trips=S.trips.filter(x=>x.id!==editId);
  S.moments.forEach(m=>{if(m.tripId===editId)m.tripId=''});
  activeTripId=null;save();closeModal();render();
}

return {render,open,back,setSec,toggleComposer,toggleItem,delItem,addTask,addBooking,addExpense,addItin,addPack,addIdea,addLink,saveNotes,setStatus,togglePaid,bkToggleFromTrip,bkRateFromTrip,openModal,closeModal,saveModal,deleteTrip,addModalCountry,rmModalCountry};
})();

/* ════════════════ MAP ════════════════ */
const MP=(()=>{
let openRegions={}, query='';
function st(code){return S.countries[code]||{v:0,w:0}}
function setSt(code,v,w){ if(!v&&!w)delete S.countries[code]; else S.countries[code]={v:v?1:0,w:w?1:0}; save(); }

function paint(){
  document.querySelectorAll('#worldmap .visited, #worldmap .want').forEach(el=>el.classList.remove('visited','want'));
  Object.entries(S.countries).forEach(([code,x])=>{
    const el=document.querySelector('#worldmap [id="'+code+'"]'); if(!el)return;
    if(x.v)el.classList.add('visited'); else if(x.w)el.classList.add('want');
  });
}
function stats(){
  let v=0,w=0,vw=0; const regTouched=new Set();
  COUNTRIES.forEach(g=>g.list.forEach(c=>{
    const x=st(c.c);
    if(x.v){v++;regTouched.add(g.r)}
    if(x.w){w++; if(x.v)vw++;}
  }));
  const pct=w?Math.round(vw/w*100):0;
  document.getElementById('mp-stats').innerHTML=`
    <div class="stat"><div class="stat-num" style="color:var(--sage)">${v}</div><div class="stat-label">Visited</div></div>
    <div class="stat-divider"></div>
    <div class="stat"><div class="stat-num" style="color:var(--blue)">${w}</div><div class="stat-label">On wishlist</div></div>
    <div class="stat-divider"></div>
    <div class="stat"><div class="stat-num">${pct}%</div><div class="stat-label">Of wishlist visited</div></div>
    <div class="stat-divider"></div>
    <div class="stat"><div class="stat-num">${regTouched.size}<span style="font-size:14px;color:var(--muted)">/${COUNTRIES.length}</span></div><div class="stat-label">Regions</div></div>`;
}
function rowHTML(c){
  const x=st(c.c);
  return `<div class="country-row" data-name="${esc(c.n.toLowerCase())}">
    <span class="nm truncate">${esc(c.n)}${c.t?' <span class="terr">TERR</span>':''}</span>
    <button class="tog v ${x.v?'on':''}" onclick="MP.tog('${c.c}','v')">Visited</button>
    <button class="tog w ${x.w?'on':''}" onclick="MP.tog('${c.c}','w')">Want</button>
  </div>`;
}
function regionsHTML(){
  return COUNTRIES.map((g,gi)=>{
    let list=g.list;
    if(query)list=list.filter(c=>c.n.toLowerCase().includes(query));
    if(query&&!list.length)return '';
    let v=0,w=0,vw=0;
    g.list.forEach(c=>{const x=st(c.c);if(x.v)v++;if(x.w){w++;if(x.v)vw++}});
    const pct=w?Math.round(vw/w*100):0;
    const open=query?true:!!openRegions[gi];
    return `<div class="region-acc ${open?'open':''}">
      <div class="region-head" onclick="MP.toggleRegion(${gi})">
        <span class="name">${esc(g.r)}</span>
        <span class="prog-txt">${v} visited${w?` · ${vw} of ${w} wanted`:''}</span>
        ${w?`<div class="bar-track" style="max-width:110px"><div class="bar-fill" style="width:${pct}%"></div></div><span class="prog-txt">${pct}%</span>`:''}
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="region-body">${list.map(rowHTML).join('')}</div>
    </div>`;
  }).join('');
}
function render(){stats();document.getElementById('mp-regions').innerHTML=regionsHTML();paint();bindMap()}
function toggleRegion(i){openRegions[i]=!openRegions[i];render()}
function tog(code,which){
  const x=st(code);
  if(which==='v')setSt(code,!x.v,x.w); else setSt(code,x.v,!x.w);
  render();
}
function search(v){query=v.trim().toLowerCase();document.getElementById('mp-regions').innerHTML=regionsHTML()}
let bound=false;
function bindMap(){
  if(bound)return;bound=true;
  const root=document.getElementById('worldmap'); if(!root)return;
  root.addEventListener('click',e=>{
    let el=e.target;
    while(el&&el!==root&&!(el.id&&el.id.length===2))el=el.parentNode;
    if(!el||el===root||!C_NAME[el.id])return;
    const code=el.id, x=st(code);
    // cycle: none → want → visited → none
    let nv,nw;
    if(!x.v&&!x.w){nv=0;nw=1}
    else if(x.w&&!x.v){nv=1;nw=x.w}
    else {nv=0;nw=0}
    setSt(code,nv,nw);
    const label=nv?'Visited':nw?'Want to visit':'Cleared';
    document.getElementById('mp-feedback').textContent=`${C_NAME[code]} — ${label}`;
    render();
  });
}
return {render,toggleRegion,tog,search};
})();

/* ════════════════ BUCKET ════════════════ */
const BK=(()=>{
let filter='all';
const TYPES=[['all','All'],['exp','Experiences'],['dine','Dining'],['food','Food & Drinks'],['contact','Contacts']];
const TYPE_LABEL={exp:'Experience',dine:'Dining',food:'Food & Drink',contact:'Contact'};
function pills(){
  document.getElementById('bk-pills').innerHTML=TYPES.map(([k,v])=>{
    const n=k==='all'?S.bucket.length:S.bucket.filter(b=>b.type===k).length;
    return `<button class="pill ${filter===k?'active':''}" onclick="BK.setFilter('${k}')">${v}${n?` <span style="opacity:.6">${n}</span>`:''}</button>`;
  }).join('');
}
function countryFilterOpts(){
  const used=[...new Set(S.bucket.map(b=>b.country).filter(Boolean))].sort((a,b)=>(C_NAME[a]||a).localeCompare(C_NAME[b]||b));
  const sel=document.getElementById('bk-country-filter');
  const cur=sel.value;
  sel.innerHTML='<option value="">All countries</option>'+used.map(c=>`<option value="${c}">${esc(C_NAME[c]||c)}</option>`).join('');
  sel.value=cur&&used.includes(cur)?cur:'';
}
function starHTML(b){
  return `<div class="stars">${[1,2,3,4,5].map(i=>`<button class="${(b.rating||0)>=i?'on':''}" onclick="BK.rate('${b.id}',${i})">★</button>`).join('')}</div>`;
}
function itemHTML(b){
  const isContact=b.type==='contact';
  return `<div class="bk-item ${b.done?'done':''}">
    ${isContact?'':`<div class="chk ${b.done?'on':''}" onclick="BK.toggle('${b.id}')">${b.done?'✓':''}</div>`}
    <div class="bk-main">
      <span class="bk-label truncate">${esc(b.label)}</span>
      <div class="bk-sub">
        <span class="tag">${TYPE_LABEL[b.type]||b.type}</span>
        ${b.country?`<span>${esc(C_NAME[b.country]||b.country)}</span>`:''}
        ${b.place?`<span>· ${esc(b.place)}</span>`:''}
        ${b.notes?`<span class="truncate" style="max-width:280px">· ${esc(b.notes)}</span>`:''}
      </div>
    </div>
    ${b.done&&!isContact?starHTML(b):''}
    <button class="tx" onclick="BK.editNotes('${b.id}')" title="Notes">✎</button>
    <button class="tx" onclick="BK.del('${b.id}')">✕</button>
  </div>`;
}
function render(){
  pills();countryFilterOpts();
  const cf=document.getElementById('bk-country-filter').value;
  let list=S.bucket.slice();
  if(filter!=='all')list=list.filter(b=>b.type===filter);
  if(cf)list=list.filter(b=>b.country===cf);
  list.sort((a,b)=>(a.done-b.done)||((b.rating||0)-(a.rating||0))||a.label.localeCompare(b.label));
  document.getElementById('bk-list').innerHTML=list.length?list.map(itemHTML).join(''):
    `<div class="empty">Nothing on the list${filter!=='all'?' in this category':''}. Bucket lists don't have to be Machu Picchu — the climbing gym you keep driving past counts too.</div>`;
}
function setFilter(f){filter=f;render()}
function toggleComposer(){const el=document.getElementById('bk-composer-card');el.style.display=el.style.display==='none'?'block':'none';if(el.style.display==='block')document.getElementById('bk-new-label').focus()}
function add(){
  const label=document.getElementById('bk-new-label').value.trim();if(!label)return;
  const cin=document.getElementById('bk-new-country').value.trim().toLowerCase();
  const country=C_CODE[cin]||'';
  S.bucket.push({id:uid(),type:document.getElementById('bk-new-type').value,label,country,place:document.getElementById('bk-new-place').value.trim(),done:false,rating:0,notes:''});
  document.getElementById('bk-new-label').value='';document.getElementById('bk-new-place').value='';
  save();render();
}
function toggle(id){const b=S.bucket.find(x=>x.id===id);b.done=!b.done;if(!b.done)b.rating=0;save();render()}
function rate(id,n){const b=S.bucket.find(x=>x.id===id);b.rating=b.rating===n?0:n;save();render()}
function del(id){S.bucket=S.bucket.filter(x=>x.id!==id);save();render()}
function editNotes(id){const b=S.bucket.find(x=>x.id===id);const v=prompt('Notes for "'+b.label+'":',b.notes||'');if(v!==null){b.notes=v.trim();save();render()}}
return {render,setFilter,toggleComposer,add,toggle,rate,del,editNotes};
})();

/* ════════════════ LOG ════════════════ */
const LG=(()=>{
function stats(){
  const done=S.trips.filter(t=>t.status==='done'||t.status==='current');
  const visited=Object.values(S.countries).filter(x=>x.v).length;
  let nightsTotal=0;
  done.forEach(t=>{if(t.start&&t.end)nightsTotal+=Math.max(0,daysBetween(t.start,t.end))});
  const spend=S.trips.reduce((s,t)=>s+tripSpent(t),0);
  const citySet=new Set(); done.forEach(t=>cityTokens(t).forEach(p=>citySet.add(p.toLowerCase())));
  document.getElementById('lg-stats').innerHTML=`
    <div class="stat"><div class="stat-num">${done.length}</div><div class="stat-label">Trips taken</div></div>
    <div class="stat-divider"></div>
    <div class="stat"><div class="stat-num" style="color:var(--sage)">${visited}</div><div class="stat-label">Countries</div></div>
    <div class="stat-divider"></div>
    <div class="stat"><div class="stat-num" style="color:var(--blue)">${citySet.size}</div><div class="stat-label">Cities</div></div>
    <div class="stat-divider"></div>
    <div class="stat"><div class="stat-num">${nightsTotal}</div><div class="stat-label">Nights away</div></div>
    <div class="stat-divider"></div>
    <div class="stat"><div class="stat-num">${spend?money(spend):'—'}</div><div class="stat-label">All-time spend</div></div>`;
}
function momentsHTML(){
  const list=S.moments.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(!list.length)return '<div style="font-size:.82rem;color:var(--muted);padding:6px 0">The funny thing the waiter said, the sunset you almost missed — write it down before it fades.</div>';
  let h='',lastMonth='';
  list.forEach(m=>{
    const month=m.date?new Date(m.date+'T12:00').toLocaleDateString('en-US',{month:'long',year:'numeric'}):'Undated';
    if(month!==lastMonth){h+=`<div class="month-label">${month}</div>`;lastMonth=month}
    const trip=S.trips.find(t=>t.id===m.tripId);
    h+=`<div class="moment">
      <div class="moment-head"><span class="moment-title">${esc(m.label)}</span>
      ${m.date?`<span class="due-chip">${fmtShort(m.date)}</span>`:''}
      ${trip?`<span class="tag">${esc(trip.name)}</span>`:''}
      <button class="tx" style="margin-left:auto" onclick="LG.delMoment('${m.id}')">✕</button></div>
      ${m.text?`<div class="moment-txt">${esc(m.text)}</div>`:''}
    </div>`;
  });
  return h;
}
function daysPerCountry(){
  const map={};
  S.trips.filter(t=>(t.status==='done'||t.status==='current')&&t.start&&t.end).forEach(t=>{
    const n=Math.max(0,daysBetween(t.start,t.end))+1;
    (t.country||[]).forEach(c=>{map[c]=(map[c]||0)+n});
  });
  const rows=Object.entries(map).sort((a,b)=>b[1]-a[1]);
  if(!rows.length)return '<div style="font-size:.82rem;color:var(--muted)">Add dates + countries to past trips and this fills itself in.</div>';
  const max=rows[0][1];
  return rows.slice(0,10).map(([c,n])=>`<div class="lg-row"><span class="nm truncate">${esc(C_NAME[c]||c)}</span><div class="bar-track" style="max-width:130px"><div class="bar-fill" style="width:${Math.round(n/max*100)}%"></div></div><span class="v">${n} days</span></div>`).join('');
}
function cityTokens(t){return (t.places||'').split(/[,;·]/).map(s=>s.trim()).filter(s=>s&&!/^[A-Z]{2}$/.test(s))}
function placesLog(){
  const map={};
  S.trips.filter(t=>(t.status==='done'||t.status==='current')&&t.places).forEach(t=>{
    const n=(t.start&&t.end)?Math.max(0,daysBetween(t.start,t.end))+1:0;
    cityTokens(t).forEach(p=>{
      const k=p.toLowerCase();
      if(!map[k])map[k]={name:p,trips:0,days:0};
      map[k].trips++;map[k].days+=n;
    });
  });
  const rows=Object.values(map).sort((a,b)=>(b.days-a.days)||(b.trips-a.trips));
  if(!rows.length)return '<div style="font-size:.82rem;color:var(--muted)">Add cities to your trips ("Canggu, Ubud") and they show up here — state abbreviations like "WV" are skipped as noise.</div>';
  return rows.slice(0,12).map(p=>`<div class="lg-row"><span class="nm truncate">${esc(p.name)}</span><span class="v">${p.trips} trip${p.trips>1?'s':''}${p.days?` · ${p.days}d`:''}</span></div>`).join('');
}
function spendByYear(){
  const map={};
  S.trips.forEach(t=>{
    (t.expenses||[]).forEach(e=>{
      const y=(e.date||t.start||'').slice(0,4)||'—';
      map[y]=(map[y]||0)+(Number(e.amt)||0);
    });
  });
  const rows=Object.entries(map).filter(([y])=>y!=='—').sort((a,b)=>b[0].localeCompare(a[0]));
  if(!rows.length)return '<div style="font-size:.82rem;color:var(--muted)">Log trip expenses and yearly totals show up here.</div>';
  const max=Math.max(...rows.map(r=>r[1]));
  return rows.map(([y,v])=>`<div class="lg-row"><span class="nm">${y}</span><div class="bar-track" style="max-width:130px"><div class="bar-fill" style="width:${max?Math.round(v/max*100):0}%"></div></div><span class="v">${money(v)}</span></div>`).join('');
}
function pastByYear(){
  const done=S.trips.filter(t=>t.status==='done').sort((a,b)=>(b.start||'').localeCompare(a.start||''));
  if(!done.length)return '<div style="font-size:.82rem;color:var(--muted)">Completed trips get archived here, newest first.</div>';
  let h='',lastY='';
  done.forEach(t=>{
    const y=(t.start||'').slice(0,4)||'Undated';
    if(y!==lastY){h+=`<div class="month-label">${y}</div>`;lastY=y}
    const n=t.start&&t.end?Math.max(0,daysBetween(t.start,t.end)):null;
    h+=`<div class="lg-row" style="cursor:pointer" onclick="LG.openTrip('${t.id}')">
      <span class="dot" style="width:9px;height:9px;border-radius:50%;background:${STATUS_COLOR[t.status]||'#7aa37a'};flex-shrink:0"></span>
      <span class="nm truncate">${esc(t.name)}</span>
      <span class="v">${t.places?esc(t.places):t.country&&t.country.length?esc(countryChips(t)):''}${n!=null?` · ${n}n`:''}${tripSpent(t)?` · ${money(tripSpent(t))}`:''}</span>
    </div>`;
  });
  return h;
}
function render(){
  stats();
  document.getElementById('lg-moments').innerHTML=momentsHTML();
  document.getElementById('lg-days').innerHTML=daysPerCountry();
  document.getElementById('lg-places').innerHTML=placesLog();
  document.getElementById('lg-spend').innerHTML=spendByYear();
  document.getElementById('lg-past').innerHTML=pastByYear();
  const sel=document.getElementById('lg-new-trip');
  sel.innerHTML='<option value="">No trip</option>'+S.trips.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');
}
function toggleComposer(){const el=document.getElementById('lg-composer');el.classList.toggle('open');if(el.classList.contains('open')){document.getElementById('lg-new-date').value=todayISO();document.getElementById('lg-new-title').focus()}}
function addMoment(){
  const label=document.getElementById('lg-new-title').value.trim();if(!label)return;
  S.moments.push({id:uid(),date:document.getElementById('lg-new-date').value||todayISO(),tripId:document.getElementById('lg-new-trip').value,label,text:document.getElementById('lg-new-text').value.trim()});
  document.getElementById('lg-new-title').value='';document.getElementById('lg-new-text').value='';
  document.getElementById('lg-composer').classList.remove('open');
  save();render();
}
function delMoment(id){if(!confirm('Delete this moment?'))return;S.moments=S.moments.filter(m=>m.id!==id);save();render()}
function openTrip(id){switchTab('trips');TR.open(id)}
return {render,toggleComposer,addMoment,delMoment,openTrip};
})();

/* ════════════════ INIT ════════════════ */
(function init(){
  load();
  document.getElementById('today-date').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}).toUpperCase();
  const dl=document.getElementById('country-datalist');
  dl.innerHTML=COUNTRIES.map(g=>g.list.map(c=>`<option value="${esc(c.n)}">`).join('')).join('');
  TR.render();
})();
</script>
