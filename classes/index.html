<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning · Brain 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3ecd8; --surface:#fff; --sb-bg:#f8f1dd; --sidebar:#f8f1dd; --sidebar-line:#e6dec5;
    --lilac:#c9b6ee; --lilac-d:#b099e0;
    --ink:#1a1612; --muted:#7a7468; --line:#ececec;
    --line-soft:#f0ead9;
    --rose:#cf8a93; --amber:#cb9a4f; --sage:#7aa37a; --blue:#7e9cc4;
    --sb-w:230px;
    /* aliases so lifted Courses styles map onto the v4 palette */
    --accent:var(--lilac); --accent-deep:var(--lilac-d); --accent-soft:#ede5fb; --warm:#faf6ec;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Plus Jakarta Sans',sans-serif;
    background:var(--bg); color:var(--ink);
    min-height:100vh;
  }

  /* ── TOP BAR ── */
  .topbar{background:var(--sidebar);border-bottom:1px solid var(--sidebar-line);padding:16px 32px;display:flex;align-items:center;justify-content:space-between}
  .topbar-left{display:flex;align-items:center;gap:14px}
  .back-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1.5px solid #d9d2bd;border-radius:20px;font-size:12px;color:var(--muted);cursor:pointer;background:transparent;font-family:inherit;text-decoration:none;transition:all .15s}
  .back-btn:hover{border-color:var(--accent-deep);color:var(--ink)}
  .topbar-title{font-family:'Fraunces',serif;font-size:22px;font-weight:600;letter-spacing:-0.4px}
  .topbar-date{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:500}

  /* ── MAIN ── */
  .wrap{max-width:1080px;margin:0 auto;padding:28px 38px 80px}
  .page-head{margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  .page-head h1{font-family:'Fraunces',serif;font-size:2.1rem;font-weight:500;letter-spacing:.3px}
  .page-head p{color:var(--muted);font-size:.9rem;margin-top:3px;font-weight:400}
  .print-btn{background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:11px;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:7px}
  .print-btn:hover{border-color:var(--lilac-d);color:var(--lilac-d);box-shadow:0 2px 10px rgba(176,153,224,.18)}
  .print-stamp{display:none}
  .notes-print{display:none}

  /* ── TOP TABS ── */
  .ltabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:26px}
  .ltab-btn{background:none;border:none;font-family:inherit;font-size:.86rem;font-weight:600;cursor:pointer;color:var(--muted);padding:11px 18px;border-bottom:2.5px solid transparent;margin-bottom:-1px;transition:all .15s;white-space:nowrap}
  .ltab-btn:hover{color:var(--ink)}
  .ltab-btn.active{color:var(--lilac-d);border-bottom-color:var(--lilac-d)}
  .ltab-pane{display:none}
  .ltab-pane.show{display:block}

  /* ── CLASS PILLS ── */
  .pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;align-items:center}
  .pill{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 16px;border-radius:30px;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:8px}
  .pill:hover{color:var(--ink);border-color:var(--lilac)}
  .pill .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .pill.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pill-add{border:1px dashed var(--lilac-d);background:transparent;color:var(--lilac-d);padding:8px 15px;border-radius:30px;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
  .pill-add:hover{background:rgba(176,153,224,.12)}

  .empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:54px 30px;text-align:center;color:var(--muted)}
  .empty h3{font-family:'Fraunces',serif;font-weight:500;color:var(--ink);font-size:1.3rem;margin-bottom:6px}
  .empty p{font-size:.9rem;line-height:1.5;max-width:440px;margin:0 auto}

  /* ── CARDS ── */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px}
  .card-accent{border-left:4px solid var(--cls,#b099e0)}

  .ov{margin-bottom:18px;position:relative}
  .ov h2{font-family:'Fraunces',serif;font-size:1.55rem;font-weight:500;line-height:1.15}
  .ov .code{color:var(--cls,#b099e0);font-weight:700;font-size:.8rem;letter-spacing:.4px;margin-bottom:7px}
  .ov-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chip{background:var(--line-soft);border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:.74rem;color:var(--ink);font-weight:500;display:flex;gap:6px;align-items:center}
  .chip b{color:var(--muted);font-weight:600}
  .chip a{color:var(--lilac-d);text-decoration:none}
  .ov-actions{position:absolute;top:20px;right:20px;display:flex;gap:6px}
  .icon-btn{background:var(--line-soft);border:1px solid var(--line);border-radius:8px;cursor:pointer;width:30px;height:30px;font-size:.8rem;color:var(--muted);transition:all .14s;display:flex;align-items:center;justify-content:center;font-family:inherit}
  .icon-btn:hover{color:var(--ink);border-color:var(--lilac)}
  .icon-btn.danger:hover{color:var(--rose);border-color:var(--rose)}

  .row3{display:grid;grid-template-columns:1fr 1.3fr 1.3fr;gap:14px;margin-bottom:18px}
  .mini-label{font-size:.6rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:12px}
  .ring-wrap{display:flex;align-items:center;gap:16px}
  .ring{position:relative;width:84px;height:84px;flex-shrink:0}
  .ring svg{transform:rotate(-90deg)}
  .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:1.25rem;font-weight:500}
  .ring-txt .big{font-size:1rem;font-weight:700}
  .ring-txt .sub{font-size:.76rem;color:var(--muted);margin-top:2px}
  .next-title{font-family:'Fraunces',serif;font-size:1.15rem;font-weight:500;margin-bottom:2px}
  .next-due{font-size:.8rem;color:var(--muted);margin-bottom:10px}
  .countdown{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700;margin-left:8px}
  .cd-soon{background:rgba(203,154,79,.16);color:var(--amber)}
  .cd-over{background:rgba(207,138,147,.18);color:var(--rose)}
  .cd-ok{background:rgba(176,153,224,.18);color:var(--lilac-d)}
  .next-tasks{list-style:none;font-size:.82rem;color:var(--ink)}
  .next-tasks li{padding:3px 0;display:flex;gap:7px;align-items:center}
  .next-tasks li::before{content:"○";color:var(--cls,#b099e0);font-size:.7rem}
  .all-done{color:var(--sage);font-weight:600;font-size:.88rem}
  .grade-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:.82rem}
  .grade-row:last-of-type{border-bottom:none}
  .grade-row .wt{font-weight:700;color:var(--cls,#b099e0)}
  .grade-row .lbl{color:var(--ink);padding-right:10px}
  .grade-row .lbl small{display:block;color:var(--muted);font-weight:400;font-size:.72rem}
  .scale{margin-top:11px;font-size:.72rem;color:var(--muted);background:var(--line-soft);border-radius:9px;padding:8px 11px;text-align:center}

  .sec-head{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 14px}
  .sec-head h3{font-family:'Fraunces',serif;font-size:1.3rem;font-weight:500}
  .add-btn{background:var(--cls,#b099e0);color:#fff;border:none;border-radius:9px;cursor:pointer;padding:8px 14px;font-size:.78rem;font-weight:600;font-family:inherit;transition:filter .14s}
  .add-btn:hover{filter:brightness(.94)}
  .add-btn.ghost{background:transparent;color:var(--lilac-d);border:1px dashed var(--lilac-d)}
  .add-btn.ghost:hover{background:rgba(176,153,224,.12);filter:none}

  .mod{margin-bottom:13px;padding:18px 20px;transition:opacity .2s}
  .mod.done{opacity:.66}
  .mod-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .mod-title{font-family:'Fraunces',serif;font-size:1.18rem;font-weight:500;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .mod-prog{font-size:.72rem;color:var(--muted);font-weight:600;background:var(--line-soft);border-radius:20px;padding:3px 9px}
  .mod-prog.full{background:rgba(122,163,122,.18);color:var(--sage)}
  .mod-obj{font-style:italic;color:var(--muted);font-size:.84rem;margin:8px 0 13px;line-height:1.45}
  .mod-actions{display:flex;gap:5px;flex-shrink:0}
  .tasks{list-style:none}
  .task{display:flex;align-items:center;gap:11px;padding:7px 0;border-top:1px solid var(--line-soft)}
  .task:first-child{border-top:none}
  .chk{width:19px;height:19px;border:2px solid var(--line);border-radius:6px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .13s;background:#fff}
  .chk:hover{border-color:var(--cls,#b099e0)}
  .chk.on{background:var(--cls,#b099e0);border-color:var(--cls,#b099e0);color:#fff;font-size:.7rem}
  .task .tlabel{flex:1;font-size:.86rem;cursor:pointer}
  .task.checked .tlabel{text-decoration:line-through;color:var(--muted)}
  .task .tx{opacity:0;background:none;border:none;cursor:pointer;color:var(--muted);font-size:.85rem;transition:opacity .14s;padding:2px 5px;border-radius:5px}
  .task:hover .tx{opacity:1}
  .task .tx:hover{color:var(--rose)}
  .add-task{display:flex;gap:8px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line-soft)}
  .add-task input{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-family:inherit;font-size:.82rem;color:var(--ink);background:var(--line-soft)}
  .add-task input:focus{outline:none;border-color:var(--lilac);background:#fff}
  .add-task button{background:var(--line-soft);border:1px solid var(--line);border-radius:8px;cursor:pointer;padding:0 13px;color:var(--muted);font-family:inherit;font-weight:600;font-size:.8rem}
  .add-task button:hover{color:var(--cls,#b099e0);border-color:var(--lilac)}
  .add-task input[type=date]{flex:0 0 auto;width:auto;max-width:150px}
  .tdue-wrap{position:relative;display:inline-flex;flex-shrink:0}
  .tdue-wrap input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:none;pointer-events:none}
  .tdue{font-size:.7rem;font-weight:700;padding:2px 9px;border-radius:14px;cursor:pointer;white-space:nowrap}
  .tdue.empty{color:var(--muted);font-weight:600;background:var(--line-soft);opacity:0;transition:opacity .14s}
  .task:hover .tdue.empty{opacity:1}
  .tdue.cd-soon{background:rgba(203,154,79,.16);color:var(--amber)}
  .tdue.cd-over{background:rgba(207,138,147,.18);color:var(--rose)}
  .tdue.cd-ok{background:rgba(176,153,224,.16);color:var(--lilac-d)}
  .tdue.ok{background:var(--line-soft);color:var(--muted)}
  .nt-d{font-size:.7rem;font-weight:700;margin-left:auto;white-space:nowrap}
  .nt-d.cd-over{color:var(--rose)} .nt-d.cd-soon{color:var(--amber)} .nt-d.cd-ok{color:var(--lilac-d)} .nt-d.ok{color:var(--muted)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
  .link-list{list-style:none;margin-top:6px}
  .link-list li{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:.83rem;border-top:1px solid var(--line-soft)}
  .link-list li:first-child{border-top:none}
  .link-list a{color:var(--ink);text-decoration:none;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .link-list a:hover{color:var(--lilac-d)}
  .link-list .tx{opacity:0;background:none;border:none;cursor:pointer;color:var(--muted);transition:opacity .14s}
  .link-list li:hover .tx{opacity:1}
  .link-list .tx:hover{color:var(--rose)}
  textarea.notes{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:inherit;font-size:.85rem;color:var(--ink);background:var(--line-soft);resize:vertical;line-height:1.5;margin-top:6px}
  textarea.notes:focus{outline:none;border-color:var(--lilac);background:#fff}

  /* ── COURSES TAB ── */
  .filter-section{margin-bottom:20px;display:flex;flex-direction:column;gap:8px}
  .filter-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .filter-label{font-size:.6rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;min-width:60px}
  .filter-pill{padding:5px 13px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-family:inherit;font-size:.72rem;font-weight:600;cursor:pointer;color:var(--muted);transition:all .15s}
  .filter-pill:hover{border-color:var(--lilac-d);color:var(--ink)}
  .filter-pill.active{background:var(--ink);border-color:var(--ink);color:#fff}
  .co-list{display:flex;flex-direction:column;gap:14px}
  .program-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;border-left:4px solid var(--pc,#b099e0)}
  .program-header{padding:16px 20px 12px;display:flex;align-items:flex-start;gap:12px;cursor:pointer;user-select:none}
  .program-header:hover{background:var(--line-soft)}
  .program-meta-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:3px}
  .program-meta{font-size:.6rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);font-weight:700}
  .status-pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:8px;font-size:.55rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
  .status-active{background:rgba(122,163,122,.2);color:var(--sage)}
  .status-queued{background:rgba(203,154,79,.18);color:var(--amber)}
  .status-hold{background:var(--line-soft);color:var(--muted);border:1px solid var(--line)}
  .due-badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:8px;font-size:.55rem;font-weight:700;letter-spacing:.3px}
  .due-ok{background:rgba(176,153,224,.18);color:var(--lilac-d)}
  .due-soon{background:rgba(203,154,79,.18);color:var(--amber)}
  .due-overdue{background:rgba(207,138,147,.18);color:var(--rose)}
  .program-name{font-family:'Fraunces',serif;font-size:1.05rem;font-weight:500;color:var(--ink);letter-spacing:-.2px;line-height:1.3}
  .prog-right{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-top:2px}
  .prog-pct-badge{font-family:'Fraunces',serif;font-size:1.15rem;font-weight:500;color:var(--lilac-d)}
  .prog-open-link{display:inline-flex;align-items:center;gap:3px;padding:4px 9px;border:1px solid var(--line);border-radius:10px;font-size:.62rem;font-weight:600;color:var(--muted);text-decoration:none;transition:all .15s;white-space:nowrap}
  .prog-open-link:hover{border-color:var(--lilac-d);color:var(--ink);background:rgba(176,153,224,.1)}
  .chevron{font-size:.7rem;color:var(--muted);transition:transform .2s;display:inline-block;flex-shrink:0;margin-top:4px}
  .chevron.open{transform:rotate(180deg)}
  .prog-bar-wrap{padding:0 20px 14px}
  .prog-bar{height:6px;background:var(--line-soft);border-radius:4px;overflow:hidden}
  .prog-fill{height:100%;border-radius:4px;transition:width .4s;background:var(--lilac-d)}
  .prog-notes-section{border-top:1px solid var(--line-soft);padding:10px 20px}
  .prog-notes-toggle{display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;color:var(--muted);cursor:pointer;background:none;border:none;font-family:inherit;padding:2px 0;transition:color .15s}
  .prog-notes-toggle:hover{color:var(--ink)}
  .prog-notes-body{margin-top:8px;display:none}
  .prog-notes-body.open{display:block}
  .prog-notes-textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:.78rem;font-family:inherit;color:var(--ink);background:var(--line-soft);outline:none;resize:vertical;min-height:70px;transition:border .15s}
  .prog-notes-textarea:focus{border-color:var(--lilac-d)}
  .courses-wrap{border-top:1px solid var(--line-soft)}
  .course-row{display:flex;align-items:center;gap:9px;padding:10px 20px;border-bottom:1px solid var(--line-soft)}
  .course-row:last-child{border-bottom:none}
  .course-status{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.55rem;flex-shrink:0;cursor:pointer;transition:all .15s}
  .course-status.done{background:rgba(122,163,122,.2);border-color:rgba(122,163,122,.5);color:var(--sage)}
  .course-status.in-progress{background:rgba(176,153,224,.18);border-color:var(--lilac);color:var(--lilac-d)}
  .course-status.not-started{background:var(--line-soft);border-color:var(--line)}
  .course-info{flex:1;min-width:0}
  .course-name{font-size:.78rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .course-meta{font-size:.62rem;color:var(--muted);margin-top:1px}
  .mini-prog{width:70px;height:6px;background:var(--line-soft);border-radius:4px;overflow:hidden;flex-shrink:0;cursor:pointer;position:relative}
  .mini-prog:hover{opacity:.8}
  .mini-fill{height:100%;border-radius:4px;pointer-events:none;background:var(--lilac-d)}
  .course-pct-input{width:44px;border:1px solid var(--line);border-radius:8px;padding:3px 5px;font-size:.72rem;font-family:inherit;color:var(--ink);text-align:center;background:var(--line-soft);outline:none;transition:border .15s}
  .course-pct-input:focus{border-color:var(--lilac-d)}
  .pct-label{font-size:.7rem;color:var(--muted);flex-shrink:0}
  .course-link-btn{background:none;border:none;font-size:.82rem;cursor:pointer;padding:2px 4px;border-radius:5px;transition:all .15s;flex-shrink:0;opacity:.5;line-height:1}
  .course-link-btn:hover{opacity:1;background:rgba(176,153,224,.14)}
  .course-link-btn.has-link{opacity:1;color:var(--lilac-d)}
  .del-btn{font-size:.7rem;color:#d4cdbb;background:transparent;border:none;cursor:pointer;padding:2px 5px;border-radius:5px;transition:all .15s;flex-shrink:0}
  .del-btn:hover{background:rgba(207,138,147,.14);color:var(--rose)}
  .add-course-row{padding:8px 20px;background:var(--line-soft);border-top:1px dashed var(--line)}
  .add-course-btn{font-size:.72rem;font-weight:700;color:var(--lilac-d);background:transparent;border:none;cursor:pointer;font-family:inherit;transition:color .15s}
  .add-course-btn:hover{color:var(--lilac)}
  .inline-add-wrap{display:none;align-items:center;gap:7px}
  .inline-add-wrap.show{display:flex}
  .inline-course-input{flex:1;border:1px solid var(--lilac-d);border-radius:10px;padding:6px 10px;font-size:.78rem;font-family:inherit;color:var(--ink);background:var(--surface);outline:none}
  .inline-save-btn{padding:5px 12px;background:var(--ink);color:#fff;border:none;border-radius:10px;font-size:.72rem;font-weight:700;cursor:pointer;font-family:inherit}
  .inline-cancel-btn{padding:5px 8px;background:transparent;color:var(--muted);border:none;font-size:.82rem;cursor:pointer;font-family:inherit}
  .card-footer{padding:8px 20px 12px;display:flex;align-items:center;justify-content:space-between;background:var(--line-soft);border-radius:0 0 12px 12px;border-top:1px solid var(--line-soft)}
  .edit-prog-btn{font-size:.68rem;color:var(--lilac-d);background:transparent;border:none;cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s;padding:3px 8px;border-radius:7px}
  .edit-prog-btn:hover{background:rgba(176,153,224,.14)}
  .del-prog-btn{font-size:.68rem;color:#d4cdbb;background:transparent;border:none;cursor:pointer;font-family:inherit;transition:all .15s;padding:3px 8px;border-radius:7px}
  .del-prog-btn:hover{background:rgba(207,138,147,.14);color:var(--rose)}
  .link-popover{display:none;position:absolute;z-index:100;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.12);width:280px;right:0;top:calc(100% + 4px)}
  .link-popover.show{display:block}
  .link-popover-input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:.74rem;font-family:inherit;color:var(--ink);background:var(--line-soft);outline:none;margin-bottom:7px}
  .link-popover-input:focus{border-color:var(--lilac-d)}
  .link-popover-actions{display:flex;gap:6px}
  .link-save-btn{flex:1;padding:6px;background:var(--ink);color:#fff;border:none;border-radius:8px;font-size:.72rem;font-weight:700;cursor:pointer;font-family:inherit}
  .link-clear-btn{padding:6px 10px;background:var(--line-soft);color:var(--muted);border:1px solid var(--line);border-radius:8px;font-size:.72rem;cursor:pointer;font-family:inherit}
  .co-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
  .co-coursera{font-size:.72rem;font-weight:600;color:var(--muted);text-decoration:none}
  .co-coursera:hover{color:var(--lilac-d)}

  /* ── COURSES GRID (browse) ── */
  .pg-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .pg-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;border-left:4px solid var(--pc,#b099e0);padding:16px 18px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:9px}
  .pg-card:hover{border-color:var(--lilac);box-shadow:0 4px 16px rgba(176,153,224,.16);transform:translateY(-1px)}
  .pg-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .pg-plat{font-size:.6rem;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);font-weight:700}
  .pg-name{font-family:'Fraunces',serif;font-size:1.1rem;font-weight:500;line-height:1.25;color:var(--ink)}
  .pg-why{font-size:.78rem;color:var(--muted);line-height:1.45;font-style:italic;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pg-bar{height:6px;background:var(--line-soft);border-radius:4px;overflow:hidden;margin-top:2px}
  .pg-fill{height:100%;background:var(--pc,#b099e0);border-radius:4px;transition:width .4s}
  .pg-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.7rem;color:var(--muted);font-weight:600}
  .pg-next{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pg-next b{color:var(--muted);font-weight:600}

  /* ── COURSE MODULES (sub-level) ── */
  .mods{list-style:none;margin:4px 0 8px 31px;padding-left:13px;border-left:2px solid var(--line-soft)}
  .mod-row{display:flex;align-items:center;gap:9px;padding:5px 0}
  .mod-row .chk{width:16px;height:16px;border-radius:5px;font-size:.6rem}
  .mod-row span{flex:1;font-size:.8rem}
  .mod-row.done span{text-decoration:line-through;color:var(--muted)}
  .mod-row .tx{opacity:0;background:none;border:none;cursor:pointer;color:var(--muted);font-size:.8rem;transition:opacity .14s;padding:2px 5px;border-radius:5px}
  .mod-row:hover .tx{opacity:1}
  .mod-row .tx:hover{color:var(--rose)}
  .mod-add{display:flex;gap:7px;margin-top:5px}
  .mod-add input{flex:1;border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:.78rem;font-family:inherit;background:var(--line-soft);color:var(--ink)}
  .mod-add input:focus{outline:none;border-color:var(--lilac);background:#fff}
  .mod-add button{background:var(--line-soft);border:1px solid var(--line);border-radius:7px;padding:0 11px;font-size:.75rem;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit}
  .mod-add button:hover{color:var(--cls,#b099e0);border-color:var(--lilac)}
  .co-expand{background:none;border:none;cursor:pointer;color:var(--muted);font-size:.62rem;transition:transform .2s,color .15s;padding:2px 5px;flex-shrink:0}
  .co-expand:hover{color:var(--ink)}
  .co-expand.open{transform:rotate(180deg)}
  .add-course-link{font-size:.74rem;color:var(--lilac-d);background:none;border:none;cursor:pointer;font-family:inherit;font-weight:600;margin-top:10px;padding:4px 0}
  .add-course-link:hover{text-decoration:underline}

  /* ── SELF-STUDY · MULTI-PLAN ── */
  /* field atoms (shared) */
  .ss-fieldwrap{margin-bottom:14px}
  .ss-fieldwrap:last-child{margin-bottom:0}
  .ss-lab{font-size:.62rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px;display:block}
  .ss-lab .q{text-transform:none;letter-spacing:0;color:var(--muted);font-weight:400;font-size:.76rem}
  .ss-field{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-family:inherit;font-size:.86rem;color:var(--ink);background:var(--line-soft);resize:vertical;line-height:1.55;outline:none;transition:border .15s;min-height:62px}
  .ss-field:focus{border-color:var(--lilac);background:#fff}
  .ss-inp{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-family:inherit;font-size:.86rem;color:var(--ink);background:var(--line-soft);outline:none;transition:border .15s}
  .ss-inp:focus{border-color:var(--lilac);background:#fff}
  .ss-sec-label{font-size:.6rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 10px}
  .ss-none{font-size:.83rem;color:var(--muted);padding:4px 0 6px;line-height:1.5}
  .sec-hint{font-size:.7rem;color:var(--muted);font-weight:500;margin-left:10px}
  .sec-head{display:flex;align-items:baseline;gap:4px}
  /* idea bank */
  .ss-bank{background:var(--surface);border:1px solid var(--line);border-radius:16px;border-left:4px solid var(--lilac-d);padding:16px 18px;margin-bottom:26px}
  .ss-bank-head{display:flex;align-items:center;justify-content:space-between}
  .ss-bank h3{font-family:'Fraunces',serif;font-size:1.15rem;font-weight:500}
  .ss-bank-sub{font-size:.78rem;color:var(--muted);margin:3px 0 12px;line-height:1.5}
  .ss-bank-empty{font-size:.82rem;color:var(--muted);padding:2px 0}
  .ss-idea{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line-soft)}
  .ss-idea:first-of-type{border-top:none}
  .ss-idea-text{flex:1;font-size:.86rem;line-height:1.4}
  .ss-promote{font-size:.66rem;letter-spacing:.5px;text-transform:uppercase;font-weight:700;color:var(--lilac-d);background:rgba(176,153,224,.13);border:1px solid transparent;border-radius:9px;padding:5px 10px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .ss-promote:hover{background:rgba(176,153,224,.24)}
  .ss-idea .tx{opacity:0;background:none;border:none;cursor:pointer;color:var(--muted);font-size:.8rem;padding:2px 5px;transition:opacity .14s}
  .ss-idea:hover .tx{opacity:1}
  .ss-idea .tx:hover{color:var(--rose)}
  .ss-idea-add{display:flex;gap:8px;margin-top:12px}
  .ss-idea-add input{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:.84rem;font-family:inherit;background:var(--line-soft);color:var(--ink)}
  .ss-idea-add input:focus{outline:none;border-color:var(--lilac);background:#fff}
  .ss-idea-add button{background:var(--ink);color:#fff;border:none;border-radius:9px;padding:0 16px;font-size:.78rem;font-weight:600;cursor:pointer;font-family:inherit}
  /* plans head + chips */
  .ss-plans-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .ss-plans-head h3{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:500}
  .ss-plans-actions{display:flex;gap:8px}
  .ss-chip{font-size:.72rem;letter-spacing:.3px;font-weight:600;font-family:inherit;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:7px 13px;cursor:pointer;transition:all .14s}
  .ss-chip:hover{border-color:var(--lilac-d);color:var(--lilac-d)}
  .ss-chip.on{background:var(--accent-soft);border-color:var(--lilac);color:var(--lilac-d)}
  /* plan cards — cover on TOP, content below */
  .ss-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .ss-pc{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:all .15s;display:flex;flex-direction:column}
  .ss-pc:hover{border-color:var(--lilac);box-shadow:0 6px 20px rgba(176,153,224,.16);transform:translateY(-2px)}
  .ss-pc-cover{height:112px;background:var(--accent-soft);background-size:cover;background-position:center;background-repeat:no-repeat}
  .ss-pc-noimg{display:flex;align-items:center;justify-content:center;font-size:1.8rem;color:var(--lilac-d)}
  .ss-pc-body{padding:15px 17px;display:flex;flex-direction:column;gap:7px;flex:1}
  .ss-pc-title{font-family:'Fraunces',serif;font-size:1.12rem;font-weight:500;line-height:1.2;color:var(--ink)}
  .ss-pc-obj{font-size:.78rem;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ss-pc-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .ss-pc-date{font-size:.68rem;font-weight:700;color:var(--lilac-d);background:var(--accent-soft);padding:3px 8px;border-radius:7px}
  .ss-pc-next{font-size:.68rem;color:var(--muted);background:var(--line-soft);padding:3px 8px;border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
  .ss-pc-foot{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:.66rem;color:var(--muted);font-weight:600;padding-top:5px}
  .ss-pc-bar{flex:1;height:6px;background:var(--line-soft);border-radius:3px;overflow:hidden}
  .ss-pc-bar>i{display:block;height:100%;background:var(--lilac-d);border-radius:3px}
  .ss-pc-add{border:1px dashed var(--lilac-d);background:transparent;border-radius:16px;display:flex;align-items:center;justify-content:center;min-height:120px;cursor:pointer;color:var(--lilac-d);font-weight:600;font-size:.9rem;font-family:inherit;transition:all .15s}
  .ss-pc-add:hover{background:rgba(176,153,224,.1)}
  .ss-empty{font-size:.86rem;color:var(--muted);padding:8px 0 16px}
  /* detail shell */
  .ss-back{background:none;border:none;font-family:inherit;font-size:.8rem;font-weight:600;color:var(--muted);cursor:pointer;padding:4px 0;margin-bottom:14px;transition:color .15s}
  .ss-back:hover{color:var(--lilac-d)}
  .ss-dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
  .ss-dhead h2{font-family:'Fraunces',serif;font-size:1.6rem;font-weight:500;line-height:1.15}
  .ss-dh-dates{font-size:.76rem;color:var(--muted);font-weight:600;margin-top:5px}
  .ss-dh-actions{display:flex;gap:6px;flex-shrink:0}
  .ss-dh-cover{width:100%;max-height:150px;object-fit:cover;border-radius:12px;margin-top:14px;display:block}
  .cw-kind{font-size:.6rem;letter-spacing:2px;text-transform:uppercase;color:var(--lilac-d);font-weight:700;margin-bottom:4px}
  /* timeline mini */
  .ss-tl-bar{height:8px;background:var(--line-soft);border-radius:5px;overflow:hidden;margin-top:4px}
  .ss-tl-bar>i{display:block;height:100%;background:var(--lilac-d);border-radius:5px}
  .ss-tl-meta{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);font-weight:600;margin-top:7px}
  /* tasks / milestones */
  .ss-task{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line-soft)}
  .ss-task:first-of-type{border-top:none}
  .ss-task-chk{width:19px;height:19px;border:2px solid var(--line);border-radius:6px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.68rem;color:#fff;background:#fff;transition:all .13s}
  .ss-task-chk.on{background:var(--lilac-d);border-color:var(--lilac-d)}
  .ss-task-label{flex:1;border:1px solid transparent;border-radius:8px;padding:7px 9px;font-family:inherit;font-size:.86rem;color:var(--ink);background:transparent;outline:none;transition:all .14s;min-width:0}
  .ss-task-label:hover{background:var(--line-soft)}
  .ss-task-label:focus{background:#fff;border-color:var(--lilac)}
  .ss-task.done .ss-task-label{text-decoration:line-through;color:var(--muted)}
  .ss-task-due{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-family:inherit;font-size:.76rem;color:var(--muted);background:var(--line-soft);outline:none;flex-shrink:0;width:140px}
  .ss-task-due:focus{border-color:var(--lilac);background:#fff;color:var(--ink)}
  .ss-task .tx{opacity:0;background:none;border:none;cursor:pointer;color:var(--muted);font-size:.8rem;padding:2px 5px;transition:opacity .14s;flex-shrink:0}
  .ss-task:hover .tx{opacity:1}
  .ss-task .tx:hover{color:var(--rose)}
  .ss-task-add{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .ss-task-add input:first-child{flex:1;min-width:160px}
  .ss-task-add input{border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:.84rem;font-family:inherit;background:var(--line-soft);color:var(--ink)}
  .ss-task-add input[type=date]{width:150px;color:var(--muted)}
  .ss-task-add input:focus{outline:none;border-color:var(--lilac);background:#fff}
  .ss-task-add button{background:var(--ink);color:#fff;border:none;border-radius:9px;padding:0 16px;font-size:.78rem;font-weight:600;cursor:pointer;font-family:inherit}
  /* resource planner */
  .pc-addbar{display:grid;grid-template-columns:1fr 200px auto;gap:9px;margin:2px 0 12px}
  .pc-addbar input,.pc-addbar select{border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:.85rem;font-family:inherit;background:var(--line-soft);color:var(--ink);height:40px}
  .pc-addbar input:focus,.pc-addbar select:focus{outline:none;border-color:var(--lilac);background:#fff}
  .pc-addbar button{background:var(--ink);color:#fff;border:none;border-radius:9px;padding:0 18px;font-size:.78rem;font-weight:600;cursor:pointer;font-family:inherit;height:40px}
  .ss-res-legend{font-size:.72rem;color:var(--muted);line-height:1.55;margin-bottom:10px}
  .ss-plan-wrap{overflow-x:auto}
  .ss-plan{width:100%;border-collapse:collapse;font-size:.83rem;min-width:560px}
  .ss-plan th{font-size:.56rem;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:8px 9px;border-bottom:2px solid var(--line);white-space:nowrap}
  .ss-plan td{border-bottom:1px solid var(--line-soft);padding:9px;vertical-align:top}
  .ss-plan tr:last-child td{border-bottom:none}
  .ss-plan tr.done .ss-rn{text-decoration:line-through;color:var(--muted)}
  .ss-rn{font-weight:600;color:var(--ink)}
  .ss-rn a{font-size:.74rem}
  .pc-type{font-size:.72rem;color:var(--muted)}
  .ss-plan select{font-family:inherit;font-size:.78rem;padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);max-width:128px}
  .pc-why{display:block;font-size:.64rem;color:var(--muted);margin-top:3px;max-width:128px;line-height:1.35}
  .pc-wk input{width:42px;text-align:center;border:1px solid var(--line);border-radius:7px;padding:5px;font-family:inherit;font-size:.78rem;background:var(--line-soft);color:var(--ink)}
  .pc-wk input:focus{outline:none;border-color:var(--lilac);background:#fff}
  .ss-rdue{border:1px solid var(--line);border-radius:7px;padding:5px;font-family:inherit;font-size:.72rem;background:var(--line-soft);color:var(--muted);width:128px}
  .ss-rdue:focus{outline:none;border-color:var(--lilac);background:#fff;color:var(--ink)}
  .ss-plan input[type=checkbox]{width:17px;height:17px;accent-color:var(--lilac-d);cursor:pointer}
  .pc-gen{font-size:.62rem;letter-spacing:.5px;text-transform:uppercase;font-weight:700;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .pc-gen:hover{border-color:var(--lilac-d);color:var(--lilac-d)}
  .pc-gen.has{border-color:var(--lilac-d);color:var(--lilac-d);background:var(--accent-soft)}
  .pc-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.05rem;line-height:1;padding:2px 5px;font-family:inherit}
  .pc-del:hover{color:var(--rose)}
  /* coursework instance card */
  .pc-ct{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:14px 0}
  .pc-ct:first-child{margin-top:0}
  .pc-ct-head{background:var(--accent-soft);border-bottom:1px solid var(--line);border-left:4px solid var(--lilac-d);padding:15px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
  .pc-ct-kind{font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--lilac-d);font-weight:700;margin-bottom:3px}
  .pc-ct-head h4{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:500;color:var(--ink);line-height:1.2}
  .pc-ct-tag{font-size:.74rem;color:var(--muted);margin-top:4px;font-style:italic}
  .pc-ct-ctl{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}
  .pc-donebtn{display:flex;align-items:center;gap:7px;font-size:.64rem;letter-spacing:.5px;text-transform:uppercase;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
  .pc-donebtn input{width:16px;height:16px;accent-color:var(--lilac-d)}
  .pc-ct-x{font-size:.6rem;letter-spacing:.5px;text-transform:uppercase;font-weight:700;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:4px 9px;cursor:pointer;font-family:inherit}
  .pc-ct-x:hover{border-color:var(--rose);color:var(--rose)}
  .pc-ct.done{opacity:.62}
  .pc-ct-body{padding:20px 22px}
  /* coursework field layouts */
  .cw-row{display:grid;gap:14px}
  .cw-row.two{grid-template-columns:1fr 1fr}
  .cw-row.three{grid-template-columns:1fr 1fr 1fr}
  .cw-conv{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin:8px 0}
  .cw-conv-row{display:grid;grid-template-columns:96px 1fr 1fr 1fr}
  .cw-conv-row>.rl,.cw-conv-row>.hl{font-size:.58rem;text-transform:uppercase;letter-spacing:.5px;padding:9px 10px;background:var(--line-soft);border-right:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--muted);font-weight:700;display:flex;align-items:center}
  .cw-conv-row>.hl:last-child{border-right:none}
  .cw-conv-row textarea{border:none;border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;background:#fff;min-height:66px;font-family:inherit;font-size:.83rem;padding:9px;color:var(--ink);resize:vertical;line-height:1.5}
  .cw-conv-row textarea:last-child{border-right:none}
  .cw-conv-row textarea:focus{outline:1px solid var(--lilac);outline-offset:-1px}
  .cw-quad{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .cw-qbox{border:1px solid var(--line);border-radius:11px;padding:14px;background:#fff}
  .cw-qbox .qt{font-family:'Fraunces',serif;font-weight:500;color:var(--ink);font-size:1rem;margin-bottom:2px}
  .cw-qbox .qp{font-size:.72rem;color:var(--muted);margin-bottom:9px;line-height:1.45}
  .cw-qbox textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--line-soft);min-height:72px;font-family:inherit;font-size:.83rem;padding:9px;color:var(--ink);resize:vertical;line-height:1.5;outline:none}
  .cw-qbox textarea:focus{border-color:var(--lilac);background:#fff}
  .cw-steps{border-left:2px solid var(--lilac-d);margin:8px 0 0 5px;padding-left:18px}
  .cw-step{position:relative;margin-bottom:15px}
  .cw-step::before{content:"";position:absolute;left:-24px;top:5px;width:9px;height:9px;background:var(--lilac-d);border-radius:50%}
  .cw-step .sl{font-size:.6rem;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:700;display:block;margin-bottom:6px}
  .cw-step textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--line-soft);min-height:58px;font-family:inherit;font-size:.83rem;padding:9px;color:var(--ink);resize:vertical;line-height:1.5;outline:none}
  .cw-step textarea:focus{border-color:var(--lilac);background:#fff}
  .cw-choices{display:flex;gap:20px;flex-wrap:wrap;font-size:.84rem;margin-top:3px}
  .cw-ch{display:flex;align-items:center;gap:6px;cursor:pointer}
  .cw-ch input{accent-color:var(--lilac-d)}
  /* print-all read-only */

}

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw){DB=seed();save();return;}
    const p=JSON.parse(raw);
    if(Array.isArray(p)){DB={classes:p,active:(p[0]&&p[0].id)||null};}
    else{DB=p;}
    if(!DB.classes)DB.classes=[];
    if(!DB.active||!DB.classes.some(c=>c.id===DB.active))DB.active=(DB.classes[0]&&DB.classes[0].id)||null;
  }catch(e){DB=seed();save();}
}
function save(){localStorage.setItem(KEY,JSON.stringify(DB))}
function activeCls(){return DB.classes.find(c=>c.id===DB.active)}

function daysUntil(iso){if(!iso)return null;const t=new Date();t.setHours(0,0,0,0);const d=new Date(iso+'T00:00:00');return Math.round((d-t)/86400000);}
function fmtDate(iso){if(!iso)return '—';const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
function cdChip(iso){const n=daysUntil(iso);if(n===null)return '';if(n<0)return `<span class="countdown cd-over">${Math.abs(n)}d overdue</span>`;if(n===0)return `<span class="countdown cd-soon">due today</span>`;if(n<=3)return `<span class="countdown cd-soon">${n}d left</span>`;return `<span class="countdown cd-ok">${n}d left</span>`;}
function fmtShort(iso){if(!iso)return '';const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function tdClass(iso){const n=daysUntil(iso);if(n===null)return 'ok';if(n<0)return 'cd-over';if(n<=3)return 'cd-soon';return 'cd-ok';}
function esc(s){return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}

function sortTasksForDisplay(tasks){
  return tasks.slice().sort((a,b)=>{
    if(!a.due&&!b.due)return 0; if(!a.due)return 1; if(!b.due)return -1;
    return a.due.localeCompare(b.due);
  });
}
function clsProgress(c){let done=0,total=0;c.modules.forEach(m=>m.tasks.forEach(t=>{total++;if(t.done)done++}));return {done,total,pct:total?Math.round(done/total*100):0};}
function modProgress(m){const done=m.tasks.filter(t=>t.done).length;return {done,total:m.tasks.length};}
function nextTasks(c){
  const arr=[];
  c.modules.forEach(m=>m.tasks.forEach(t=>{if(t.done)return;arr.push({label:t.label, mod:m.title, eff:t.due||m.due||''});}));
  arr.sort((a,b)=>{if(!a.eff&&!b.eff)return 0;if(!a.eff)return 1;if(!b.eff)return -1;return a.eff.localeCompare(b.eff);});
  return arr;
}

function render(){
  const pills=document.getElementById('cl-pills');
  pills.innerHTML=DB.classes.map(c=>
    `<button class="pill ${c.id===DB.active?'active':''}" onclick="CL.setActive('${c.id}')"><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</button>`
  ).join('')+`<button class="pill-add" onclick="CL.openClass()">+ Add class</button>`;

  const c=activeCls();
  const det=document.getElementById('cl-detail');
  if(!c){det.innerHTML=`<div class="empty"><h3>No classes yet</h3><p>Add a class with a syllabus to start tracking modules and deadlines.</p></div>`;return;}
  document.documentElement.style.setProperty('--cls',c.color);

  const prog=clsProgress(c), nts=nextTasks(c);
  const r=33, circ=2*Math.PI*r, off=circ*(1-prog.pct/100);

  const chips=[];
  if(c.instr)chips.push(`<span class="chip"><b>👤</b>${esc(c.instr)}</span>`);
  if(c.email)chips.push(`<span class="chip"><b>✉️</b><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></span>`);
  if(c.format)chips.push(`<span class="chip"><b>💻</b>${esc(c.format)}</span>`);
  if(c.units)chips.push(`<span class="chip"><b>🎓</b>${esc(c.units)} units</span>`);
  if(c.start||c.end)chips.push(`<span class="chip"><b>📆</b>${fmtDate(c.start)} – ${fmtDate(c.end)}</span>`);
  if(c.inst)chips.push(`<span class="chip"><b>🏫</b>${esc(c.inst)}</span>`);

  const gradeHtml=(c.grading||[]).map(g=>
    `<div class="grade-row"><span class="lbl">${esc(g.label)}${g.note?`<small>${esc(g.note)}</small>`:''}</span><span class="wt">${g.pct}%</span></div>`
  ).join('')+(c.scale?`<div class="scale">${esc(c.scale)}</div>`:'');

  let nextHtml;
  if(nts.length){
    const top=nts[0];
    nextHtml=`<div class="next-title">${esc(top.label)}</div>
      <div class="next-due">${esc(top.mod)} · ${top.eff?fmtDate(top.eff):'no date'} ${cdChip(top.eff)}</div>
      <ul class="next-tasks">${nts.slice(1,5).map(t=>`<li>${esc(t.label)}<span class="nt-d ${tdClass(t.eff)}">${t.eff?fmtShort(t.eff):'—'}</span></li>`).join('')}</ul>`;
  }else{nextHtml=`<div class="all-done">✓ Everything's done — nice work.</div>`;}

  const modsHtml=c.modules.map(m=>{
    const mp=modProgress(m), full=mp.total>0&&mp.done===mp.total;
    const tasks=sortTasksForDisplay(m.tasks).map(t=>{
      const chip=t.due?`<span class="tdue ${tdClass(t.due)}">${fmtShort(t.due)}</span>`:`<span class="tdue empty">＋ date</span>`;
      return `<li class="task ${t.done?'checked':''}">
        <div class="chk ${t.done?'on':''}" onclick="CL.toggleTask('${m.id}','${t.id}')">${t.done?'✓':''}</div>
        <span class="tlabel" onclick="CL.toggleTask('${m.id}','${t.id}')">${esc(t.label)}</span>
        <span class="tdue-wrap" onclick="CL.pickTaskDue(this)">${chip}<input type="date" value="${t.due||''}" onchange="CL.setTaskDue('${m.id}','${t.id}',this.value)"></span>
        <button class="tx" onclick="CL.delTask('${m.id}','${t.id}')">✕</button>
      </li>`;
    }).join('');
    return `<div class="card card-accent mod ${full?'done':''}">
      <div class="mod-top">
        <div class="mod-title">${esc(m.title)}<span class="mod-prog ${full?'full':''}">${full?'✓ complete':`${mp.done}/${mp.total}`}</span>${cdChip(m.due)}</div>
        <div class="mod-actions"><button class="icon-btn" onclick="CL.openModule('${m.id}')">✎</button></div>
      </div>
      ${m.objective?`<div class="mod-obj">${esc(m.objective)}</div>`:''}
      <ul class="tasks">${tasks}</ul>
      <div class="add-task">
        <input id="nt-${m.id}" placeholder="Add a task…" onkeydown="if(event.key==='Enter')CL.addTask('${m.id}')">
        <input type="date" id="ntd-${m.id}" title="Optional due date">
        <button onclick="CL.addTask('${m.id}')">Add</button>
      </div>
    </div>`;
  }).join('');

  const linksHtml=(c.links||[]).map((l,i)=>
    `<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a><button class="tx" onclick="CL.delLink(${i})">✕</button></li>`
  ).join('')||`<li style="color:var(--muted)">No links yet.</li>`;

  det.innerHTML=`
    <div class="print-stamp">${esc(c.name)}${c.code?' · '+esc(c.code):''} — printed ${new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</div>
    <div class="card card-accent ov">
      <div class="code">${esc(c.code||'')}</div>
      <h2>${esc(c.name)}</h2>
      <div class="ov-meta">${chips.join('')}</div>
      <div class="ov-actions"><button class="icon-btn" onclick="CL.openClass('${c.id}')">✎</button></div>
    </div>
    <div class="row3">
      <div class="card"><div class="mini-label">Progress</div>
        <div class="ring-wrap"><div class="ring">
          <svg width="84" height="84" viewBox="0 0 84 84">
            <circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--line)" stroke-width="9"/>
            <circle cx="42" cy="42" r="${r}" fill="none" stroke="${c.color}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}"/>
          </svg><div class="pct">${prog.pct}%</div></div>
          <div class="ring-txt"><div class="big">${prog.done} of ${prog.total}</div><div class="sub">tasks complete</div></div>
        </div>
      </div>
      <div class="card"><div class="mini-label">Up Next</div>${nextHtml}</div>
      <div class="card"><div class="mini-label">Grade Weighting</div>${gradeHtml}</div>
    </div>
    <div class="sec-head"><h3>Modules</h3><button class="add-btn" onclick="CL.openModule()">+ Add module</button></div>
    ${modsHtml||`<div class="empty"><p>No modules yet — add one to start.</p></div>`}
    <div class="two">
      <div class="card">
        <div class="sec-head" style="margin:0 0 4px"><h3 style="font-size:1.1rem">Links & Resources</h3><button class="add-btn ghost" onclick="CL.addLink()">+ Link</button></div>
        <ul class="link-list">${linksHtml}</ul>
      </div>
      <div class="card">
        <h3 style="font-size:1.1rem;font-family:'Fraunces',serif;font-weight:500">Notes</h3>
        <textarea class="notes" id="notesBox" placeholder="Key dates, policies, reminders…" onchange="CL.saveNotes()">${esc(c.notes||'')}</textarea>
        <div class="notes-print">${esc(c.notes||'')}</div>
      </div>
    </div>`;
}

function setActive(id){DB.active=id;save();render()}
function toggleTask(mid,tid){const c=activeCls();const m=c.modules.find(x=>x.id===mid);const t=m.tasks.find(x=>x.id===tid);t.done=!t.done;save();render();}
function addTask(mid){const inp=document.getElementById('nt-'+mid);const v=inp.value.trim();if(!v)return;const dd=document.getElementById('ntd-'+mid);const due=dd?dd.value:'';const c=activeCls();c.modules.find(x=>x.id===mid).tasks.push({id:uid(),label:v,done:false,due});save();render();}
function pickTaskDue(wrap){const inp=wrap.querySelector('input[type=date]');if(!inp)return;try{inp.showPicker();}catch(e){inp.focus();}}
function setTaskDue(mid,tid,val){const c=activeCls();const m=c.modules.find(x=>x.id===mid);const t=m.tasks.find(x=>x.id===tid);if(t){t.due=val||'';save();render();}}
function delTask(mid,tid){const c=activeCls();const m=c.modules.find(x=>x.id===mid);m.tasks=m.tasks.filter(x=>x.id!==tid);save();render();}
function saveNotes(){activeCls().notes=document.getElementById('notesBox').value;save()}
function addLink(){const label=prompt('Link label:');if(!label)return;let url=prompt('URL:');if(!url)return;if(!/^https?:\/\//i.test(url))url='https://'+url;activeCls().links.push({label,url});save();render();}
function delLink(i){activeCls().links.splice(i,1);save();render()}

function openClass(id){
  editClsId=id||null;
  const m=document.getElementById('classModal');
  const sw=document.getElementById('cmSwatches');
  sw.innerHTML=PALETTE.map(p=>`<div class="swatch" data-c="${p}" style="background:${p}" onclick="CL.pickColor('${p}')"></div>`).join('');
  if(id){
    const c=DB.classes.find(x=>x.id===id);
    document.getElementById('cmTitle').textContent='Edit class';
    cmName.value=c.name||'';cmCode.value=c.code||'';cmInst.value=c.inst||'';
    cmInstr.value=c.instr||'';cmEmail.value=c.email||'';cmFormat.value=c.format||'';
    cmUnits.value=c.units||'';cmStart.value=c.start||'';cmEnd.value=c.end||'';cmScale.value=c.scale||'';
    pickColor(c.color);
    document.getElementById('cmDelete').style.display='block';
  }else{
    document.getElementById('cmTitle').textContent='Add a class';
    ['cmName','cmCode','cmInst','cmInstr','cmEmail','cmFormat','cmUnits','cmStart','cmEnd','cmScale'].forEach(i=>document.getElementById(i).value='');
    pickColor(PALETTE[DB.classes.length%PALETTE.length]);
    document.getElementById('cmDelete').style.display='none';
  }
  m.classList.add('show');
}
function pickColor(c){pickedColor=c;document.querySelectorAll('#cmSwatches .swatch').forEach(s=>s.classList.toggle('sel',s.dataset.c===c))}
function saveClass(){
  const name=cmName.value.trim();if(!name){alert('Class name is required.');return;}
  const data={name,code:cmCode.value.trim(),inst:cmInst.value.trim(),instr:cmInstr.value.trim(),
    email:cmEmail.value.trim(),format:cmFormat.value.trim(),units:cmUnits.value.trim(),
    start:cmStart.value,end:cmEnd.value,scale:cmScale.value.trim(),color:pickedColor};
  if(editClsId){Object.assign(DB.classes.find(x=>x.id===editClsId),data);}
  else{const c={id:uid(),...data,grading:[],links:[],notes:'',modules:[]};DB.classes.push(c);DB.active=c.id;}
  save();closeModal('classModal');render();
}
function deleteClass(){
  if(!editClsId)return;
  if(!confirm('Delete this class and all its modules?'))return;
  DB.classes=DB.classes.filter(x=>x.id!==editClsId);
  DB.active=(DB.classes[0]&&DB.classes[0].id)||null;
  save();closeModal('classModal');render();
}
function openModule(id){
  editModId=id||null;
  if(id){
    const m=activeCls().modules.find(x=>x.id===id);
    document.getElementById('mmTitle').textContent='Edit module';
    mmName.value=m.title||'';mmObj.value=m.objective||'';mmDue.value=m.due||'';
    document.getElementById('mmDelete').style.display='block';
  }else{
    document.getElementById('mmTitle').textContent='Add a module';
    mmName.value='';mmObj.value='';mmDue.value='';
    document.getElementById('mmDelete').style.display='none';
  }
  document.getElementById('modModal').classList.add('show');
}
function saveModule(){
  const title=mmName.value.trim();if(!title){alert('Module title is required.');return;}
  const c=activeCls();
  if(editModId){const m=c.modules.find(x=>x.id===editModId);m.title=title;m.objective=mmObj.value.trim();m.due=mmDue.value;}
  else{c.modules.push({id:uid(),title,objective:mmObj.value.trim(),due:mmDue.value,tasks:[]});}
  c.modules.sort((a,b)=>(a.due||'9').localeCompare(b.due||'9'));
  save();closeModal('modModal');render();
}
function deleteModule(){
  if(!editModId)return;
  if(!confirm('Delete this module?'))return;
  const c=activeCls();c.modules=c.modules.filter(x=>x.id!==editModId);
  save();closeModal('modModal');render();
}
function closeModal(id){document.getElementById(id).classList.remove('show')}
document.querySelectorAll('#classModal,#modModal').forEach(bg=>bg.addEventListener('click',e=>{if(e.target===bg)bg.classList.remove('show')}));

window.CL={setActive,toggleTask,addTask,pickTaskDue,setTaskDue,delTask,saveNotes,addLink,delLink,openClass,pickColor,saveClass,deleteClass,openModule,saveModule,deleteModule,closeModal,init:function(){load();render();}};
})();
</script>

    {name:'Consumption, Marketing and Culture',pct:0,num:4,total:4,link:''}]}
];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return 'p_'+Math.random().toString(36).slice(2,8);}
function cuid(){return 'c_'+Math.random().toString(36).slice(2,8);}

function loadData(){
  let raw=null;try{raw=localStorage.getItem(SK);}catch(e){}
  if(raw){try{programs=JSON.parse(raw);}catch(e){programs=JSON.parse(JSON.stringify(DEFAULT_PROGRAMS));}}
  else{programs=JSON.parse(JSON.stringify(DEFAULT_PROGRAMS));}
  if(!Array.isArray(programs))programs=[];
  programs.forEach(function(p){
    if(!p.id)p.id=uid();
    if(typeof p.purpose!=='string')p.purpose='';
    if(!Array.isArray(p.links))p.links=[];
    if(!p.status)p.status='active'; if(!p.url)p.url=''; if(!p.targetDate)p.targetDate=''; if(!p.notes)p.notes='';
    if(!Array.isArray(p.courses))p.courses=[];
    p.courses.forEach(function(c){
      if(!c.cid)c.cid=cuid();
      if(!Array.isArray(c.modules))c.modules=[];
      c.modules.forEach(function(m){if(!m.id)m.id=cuid();if(typeof m.done!=='boolean')m.done=false;});
      if(typeof c.done!=='boolean')c.done=(typeof c.pct==='number'&&c.pct>=100);
      if(!c.link)c.link='';
    });
  });
  saveData();
}
function saveData(){try{localStorage.setItem(SK,JSON.stringify(programs));}catch(e){}}
function getById(id){return programs.find(function(p){return p.id===id;});}

function courseComplete(c){return c.modules.length?c.modules.every(function(m){return m.done;}):!!c.done;}
function courseFrac(c){return c.modules.length?(c.modules.filter(function(m){return m.done;}).length/c.modules.length):(c.done?1:0);}
function isFlat(p){return p.courses.length<=1;}

function stats(p){
  if(isFlat(p)){
    const c=p.courses[0];
    if(!c)return {pct:0,dn:0,tt:0,unit:'modules'};
    if(c.modules.length){const dn=c.modules.filter(function(m){return m.done;}).length;return {pct:Math.round(dn/c.modules.length*100),dn:dn,tt:c.modules.length,unit:'modules'};}
    return {pct:c.done?100:0,dn:c.done?1:0,tt:1,unit:'course'};
  }
  const fr=p.courses.map(courseFrac);
  const pct=Math.round(fr.reduce(function(a,b){return a+b;},0)/fr.length*100);
  return {pct:pct,dn:p.courses.filter(courseComplete).length,tt:p.courses.length,unit:'courses'};
}
function nextLabel(p){
  if(isFlat(p)){
    const c=p.courses[0];if(!c)return null;
    if(c.modules.length){const m=c.modules.find(function(x){return !x.done;});return m?m.name:null;}
    return c.done?null:c.name;
  }
  const c=p.courses.find(function(x){return !courseComplete(x);});
  return c?c.name:null;
}
function daysUntil(d){if(!d)return null;const now=new Date();now.setHours(0,0,0,0);const t=new Date(d+'T00:00:00');return Math.ceil((t-now)/86400000);}
function dueBadge(d){const n=daysUntil(d);if(n===null)return '';if(n<0)return '<span class="due-badge due-overdue">Overdue</span>';if(n===0)return '<span class="due-badge due-soon">Due today</span>';if(n<=7)return '<span class="due-badge due-soon">'+n+'d left</span>';return '<span class="due-badge due-ok">'+n+'d left</span>';}
function statusPill(s){const map={active:['status-active','Active'],queued:['status-queued','Queued'],hold:['status-hold','On Hold']};const x=map[s]||map.active;return '<span class="status-pill '+x[0]+'">'+x[1]+'</span>';}
function fmtDate(iso){if(!iso)return '';const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function cd(d){const n=daysUntil(d);if(n===null)return '';if(n<0)return '<span class="countdown cd-over">'+Math.abs(n)+'d ago</span>';if(n===0)return '<span class="countdown cd-soon">today</span>';if(n<=7)return '<span class="countdown cd-soon">'+n+'d</span>';return '<span class="countdown cd-ok">'+n+'d</span>';}

/* ---- filters ---- */
function renderFilters(){
  const host=document.getElementById('co-filters');
  let statusHtml='<div class="filter-row"><span class="filter-label">Status</span>'+
    ['all','active','queued','hold'].map(function(s){
      const labels={all:'All',active:'Active',queued:'Queued',hold:'On Hold'};
      return '<button class="filter-pill'+(currentStatusFilter===s?' active':'')+'" onclick="CO.setStatusFilter(\''+s+'\')">'+labels[s]+'</button>';
    }).join('')+'</div>';
  const usedCats={};programs.forEach(function(p){usedCats[p.category]=true;});
  const cats=Object.keys(usedCats).sort();
  let catHtml='';
  if(cats.length>1){
    catHtml='<div class="filter-row"><span class="filter-label">Category</span>'+
      '<button class="filter-pill'+(currentCatFilter==='all'?' active':'')+'" onclick="CO.setCatFilter(\'all\')">All</button>'+
      cats.map(function(cat){
        const isA=currentCatFilter===cat, color=CAT_COLORS[cat]||'#b8b0a8';
        const style=isA?'background:'+color+';border-color:'+color+';color:#fff;':'';
        return '<button class="filter-pill'+(isA?' active':'')+'" style="'+style+'" onclick="CO.setCatFilter(\''+esc(cat)+'\')">'+esc(cat)+'</button>';
      }).join('')+'</div>';
  }
  host.innerHTML=statusHtml+catHtml;
}
function getFiltered(){
  return programs.filter(function(p){
    if(currentStatusFilter!=='all'&&p.status!==currentStatusFilter)return false;
    if(currentCatFilter!=='all'&&p.category!==currentCatFilter)return false;
    return true;
  });
}

/* ---- grid ---- */
function renderGrid(){
  renderFilters();
  const grid=document.getElementById('co-grid');
  const list=getFiltered();
  if(!list.length){
    grid.innerHTML='<div class="empty" style="grid-column:1/-1"><h3>No programs here</h3><p>Nothing matches this filter yet. Add a program or clear the filter.</p></div>';
  }else{
    grid.innerHTML=list.map(function(p){
      const accent=CAT_COLORS[p.category]||'#b8b0a8', s=stats(p), nx=nextLabel(p);
      return '<div class="pg-card" style="--pc:'+accent+'" onclick="CO.openProgram(\''+p.id+'\')">'+
        '<div class="pg-top"><span class="pg-plat">'+esc(p.platform)+'</span>'+statusPill(p.status)+dueBadge(p.targetDate)+'</div>'+
        '<div class="pg-name">'+esc(p.name)+'</div>'+
        (p.purpose?'<div class="pg-why">'+esc(p.purpose)+'</div>':'')+
        '<div class="pg-bar"><div class="pg-fill" style="width:'+s.pct+'%"></div></div>'+
        '<div class="pg-foot"><span class="pg-next">'+(nx?'<b>Next:</b> '+esc(nx):'\u2713 All done')+'</span><span>'+s.dn+'/'+s.tt+' \u00b7 '+s.pct+'%</span></div>'+
      '</div>';
    }).join('');
  }
  document.getElementById('co-grid-view').style.display='block';
  document.getElementById('co-detail').style.display='none';
}

/* ---- detail ---- */
function modListHtml(ci,c){
  let rows=c.modules.map(function(m,mi){
    return '<li class="mod-row '+(m.done?'done':'')+'"><div class="chk '+(m.done?'on':'')+'" onclick="CO.toggleModule('+ci+','+mi+')">'+(m.done?'\u2713':'')+'</div><span>'+esc(m.name)+'</span><button class="tx" onclick="CO.delModule('+ci+','+mi+')">\u2715</button></li>';
  }).join('');
  rows+='<li class="mod-add"><input id="co-newmod-'+ci+'" placeholder="Add a module\u2026" onkeydown="if(event.key===\'Enter\')CO.addModule('+ci+')"><button onclick="CO.addModule('+ci+')">Add</button></li>';
  return '<ul class="mods">'+rows+'</ul>';
}

function renderDetail(){
  const p=getById(openId), host=document.getElementById('co-detail');
  if(!p){renderGrid();return;}
  const accent=CAT_COLORS[p.category]||'#b8b0a8', s=stats(p), nx=nextLabel(p);
  const r=33, circ=2*Math.PI*r, off=circ*(1-s.pct/100);
  host.style.setProperty('--cls',accent);

  const chips=[];
  chips.push('<span class="chip"><b>\ud83d\udcda</b>'+esc(p.platform)+'</span>');
  chips.push('<span class="chip"><b>\ud83c\udff7</b>'+esc(p.category)+'</span>');
  if(p.targetDate)chips.push('<span class="chip"><b>\ud83c\udfaf</b>'+fmtDate(p.targetDate)+' '+cd(p.targetDate)+'</span>');
  if(p.url)chips.push('<span class="chip"><b>\ud83d\udd17</b><a href="'+esc(p.url)+'" target="_blank" rel="noopener">Open program</a></span>');

  let upHtml;
  if(nx){upHtml='<div class="next-title">'+esc(nx)+'</div>';}
  else if(s.tt){upHtml='<div class="all-done">\u2713 Everything complete \u2014 nice work.</div>';}
  else{upHtml='<div style="color:var(--muted);font-size:.86rem">Nothing tracked yet \u2014 add modules below.</div>';}

  const aboutHtml=(p.purpose?'<div style="font-size:.86rem;line-height:1.5;color:var(--ink)">'+esc(p.purpose)+'</div>':'<div style="font-size:.84rem;color:var(--muted)">No purpose noted \u2014 add one with \u270e.</div>')+
    '<div class="ov-meta" style="margin-top:10px">'+statusPill(p.status)+(p.targetDate?'<span class="chip"><b>\ud83c\udfaf</b>'+fmtDate(p.targetDate)+'</span>':'')+'</div>';

  /* ---- courses / modules section ---- */
  let workHtml;
  if(isFlat(p)){
    const c=p.courses[0];
    let body;
    if(c&&c.modules.length){
      body=modListHtml(0,c);
    }else if(c){
      body='<ul class="tasks"><li class="task '+(c.done?'checked':'')+'"><div class="chk '+(c.done?'on':'')+'" onclick="CO.toggleCourse(0)">'+(c.done?'\u2713':'')+'</div><span class="tlabel" onclick="CO.toggleCourse(0)">'+esc(c.name)+'</span></li></ul>'+modListHtml(0,c);
    }else{
      body=modListHtml(0,{modules:[]});
    }
    workHtml='<div class="sec-head"><h3>Modules</h3></div><div class="card">'+body+
      '<button class="add-course-link" onclick="CO.addCourse()">+ This is actually multiple courses \u2014 add another</button></div>';
  }else{
    const rows=p.courses.map(function(c,ci){
      const complete=courseComplete(c), hasMods=c.modules.length>0, open=!!expanded[c.cid];
      const mDone=c.modules.filter(function(m){return m.done;}).length;
      const badge=hasMods?' <span class="mod-prog '+(complete?'full':'')+'">'+mDone+'/'+c.modules.length+'</span>':'';
      const linkHtml=c.link?'<a class="course-link-btn has-link" href="'+esc(c.link)+'" target="_blank" rel="noopener" title="Open study notes" onclick="event.stopPropagation()">\ud83d\udd17</a>':'';
      return '<li class="task '+(complete?'checked':'')+'">'+
          '<div class="chk '+(complete?'on':'')+'" onclick="CO.toggleCourse('+ci+')">'+(complete?'\u2713':'')+'</div>'+
          '<span class="tlabel" onclick="CO.toggleExpand(\''+c.cid+'\')">'+esc(c.name)+badge+'</span>'+
          '<button class="co-expand '+(open?'open':'')+'" onclick="CO.toggleExpand(\''+c.cid+'\')" title="Modules">\u25be</button>'+
          linkHtml+
          '<button class="tx" onclick="CO.editCourseLink('+ci+')" title="Study-notes link">\u270e</button>'+
          '<button class="tx" onclick="CO.delCourse('+ci+')">\u2715</button>'+
        '</li>'+(open?modListHtml(ci,c):'');
    }).join('');
    workHtml='<div class="sec-head"><h3>Courses</h3></div><div class="card"><ul class="tasks">'+rows+'</ul>'+
      '<div class="add-task"><input id="co-newcourse" placeholder="Add a course\u2026" onkeydown="if(event.key===\'Enter\')CO.addCourse()"><button onclick="CO.addCourse()">Add</button></div></div>';
  }

  const linksHtml=(p.links||[]).map(function(l,i){
    return '<li><a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+'</a><button class="tx" onclick="CO.delLink('+i+')">\u2715</button></li>';
  }).join('')||'<li style="color:var(--muted);border:none">No resources yet.</li>';

  host.innerHTML=
    '<button class="ss-back" onclick="CO.closeProgram()">\u2190 All programs</button>'+
    '<div class="print-stamp">'+esc(p.name)+' \u2014 printed '+new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})+'</div>'+
    '<div class="card card-accent ov">'+
      '<div class="code">'+esc(p.platform)+'</div>'+
      '<h2>'+esc(p.name)+'</h2>'+
      '<div class="ov-meta">'+chips.join('')+'</div>'+
      '<div class="ov-actions"><button class="icon-btn" onclick="CO.openEditModal(\''+p.id+'\')">\u270e</button></div>'+
    '</div>'+
    '<div class="row3">'+
      '<div class="card"><div class="mini-label">Progress</div>'+
        '<div class="ring-wrap"><div class="ring">'+
          '<svg width="84" height="84" viewBox="0 0 84 84">'+
            '<circle cx="42" cy="42" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="9"/>'+
            '<circle cx="42" cy="42" r="'+r+'" fill="none" stroke="'+accent+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+off+'"/>'+
          '</svg><div class="pct">'+s.pct+'%</div></div>'+
          '<div class="ring-txt"><div class="big">'+s.dn+' of '+s.tt+'</div><div class="sub">'+s.unit+' done</div></div>'+
        '</div></div>'+
      '<div class="card"><div class="mini-label">Up Next</div>'+upHtml+'</div>'+
      '<div class="card"><div class="mini-label">About</div>'+aboutHtml+'</div>'+
    '</div>'+
    workHtml+
    '<div class="two">'+
      '<div class="card"><div class="sec-head" style="margin:0 0 4px"><h3 style="font-size:1.1rem">Resources</h3><button class="add-btn ghost" onclick="CO.addLink()">+ Link</button></div><ul class="link-list">'+linksHtml+'</ul></div>'+
      '<div class="card"><h3 style="font-size:1.1rem;font-family:\'Fraunces\',serif;font-weight:500">Notes</h3><textarea class="notes" id="co-notes" placeholder="What to focus on, where you left off\u2026" onchange="CO.saveNotes(this.value)">'+esc(p.notes)+'</textarea><div class="notes-print">'+esc(p.notes||'')+'</div></div>'+
    '</div>';
  document.getElementById('co-grid-view').style.display='none';
  host.style.display='block';
  window.scrollTo(0,0);
}

function syncNotes(){const p=getById(openId);if(!p)return;const n=document.getElementById('co-notes');if(n)p.notes=n.value;}

window.CO={
  setStatusFilter:function(s){currentStatusFilter=s;renderGrid();},
  setCatFilter:function(c){currentCatFilter=c;renderGrid();},
  openProgram:function(id){openId=id;expanded={};renderDetail();},
  closeProgram:function(){syncNotes();saveData();openId=null;renderGrid();},
  toggleExpand:function(cid){expanded[cid]=!expanded[cid];renderDetail();},
  toggleCourse:function(ci){syncNotes();const p=getById(openId);if(!p||!p.courses[ci])return;const c=p.courses[ci];if(c.modules.length){const all=c.modules.every(function(m){return m.done;});c.modules.forEach(function(m){m.done=!all;});}else{c.done=!c.done;}saveData();renderDetail();},
  toggleModule:function(ci,mi){syncNotes();const p=getById(openId);if(!p||!p.courses[ci]||!p.courses[ci].modules[mi])return;p.courses[ci].modules[mi].done=!p.courses[ci].modules[mi].done;saveData();renderDetail();},
  addModule:function(ci){syncNotes();const p=getById(openId);if(!p)return;if(!p.courses[ci])p.courses[ci]={cid:cuid(),name:p.name,link:'',done:false,modules:[]};const inp=document.getElementById('co-newmod-'+ci);const name=inp?inp.value.trim():'';if(!name)return;p.courses[ci].modules.push({id:cuid(),name:name,done:false});saveData();renderDetail();const fresh=document.getElementById('co-newmod-'+ci);if(fresh)fresh.focus();},
  delModule:function(ci,mi){syncNotes();const p=getById(openId);if(!p||!p.courses[ci])return;p.courses[ci].modules.splice(mi,1);saveData();renderDetail();},
  addCourse:function(){syncNotes();const p=getById(openId);if(!p)return;const inp=document.getElementById('co-newcourse');let name;if(inp){name=inp.value.trim();if(!name)return;}else{name=prompt('Name of the next course:');if(!name)return;name=name.trim();if(!name)return;}p.courses.push({cid:cuid(),name:name,link:'',done:false,modules:[]});saveData();renderDetail();},
  delCourse:function(ci){syncNotes();const p=getById(openId);if(!p)return;if(!confirm('Remove this course and its modules?'))return;p.courses.splice(ci,1);saveData();renderDetail();},
  editCourseLink:function(ci){const p=getById(openId);if(!p||!p.courses[ci])return;let url=prompt('Study-notes link for this course:',p.courses[ci].link||'');if(url===null)return;url=url.trim();if(url&&!/^https?:\/\//i.test(url))url='https://'+url;p.courses[ci].link=url;saveData();renderDetail();},
  addLink:function(){syncNotes();const p=getById(openId);if(!p)return;const label=prompt('Resource name:');if(!label)return;let url=prompt('URL:')||'';if(url&&!/^https?:\/\//i.test(url))url='https://'+url;p.links.push({label:label.trim(),url:url.trim()});saveData();renderDetail();},
  delLink:function(i){syncNotes();const p=getById(openId);if(!p)return;p.links.splice(i,1);saveData();renderDetail();},
  saveNotes:function(v){const p=getById(openId);if(p){p.notes=v;saveData();}},
  openAddModal:function(){
    editingId=null;
    document.getElementById('pmTitle').textContent='Add program';
    document.getElementById('pm-save').textContent='Add program';
    ['pm-name','pm-platform','pm-url','pm-purpose','pm-notes','pm-first-course'].forEach(function(id){document.getElementById(id).value='';});
    document.getElementById('pm-target').value='';
    document.getElementById('pm-status').value='active';
    document.getElementById('pm-category').value='Data & Analytics';
    document.getElementById('pm-first-course-wrap').style.display='block';
    document.getElementById('pm-delete').style.display='none';
    document.getElementById('progModal').classList.add('show');
    setTimeout(function(){document.getElementById('pm-name').focus();},80);
  },
  openEditModal:function(id){
    const p=getById(id);if(!p)return;
    editingId=id;
    document.getElementById('pmTitle').textContent='Edit program';
    document.getElementById('pm-save').textContent='Save changes';
    document.getElementById('pm-name').value=p.name;
    document.getElementById('pm-platform').value=p.platform;
    document.getElementById('pm-category').value=p.category;
    document.getElementById('pm-status').value=p.status||'active';
    document.getElementById('pm-target').value=p.targetDate||'';
    document.getElementById('pm-url').value=p.url||'';
    document.getElementById('pm-purpose').value=p.purpose||'';
    document.getElementById('pm-notes').value=p.notes||'';
    document.getElementById('pm-first-course-wrap').style.display='none';
    document.getElementById('pm-delete').style.display='block';
    document.getElementById('progModal').classList.add('show');
  },
  saveProgram:function(){
    const name=document.getElementById('pm-name').value.trim();
    if(!name){document.getElementById('pm-name').focus();return;}
    const platform=document.getElementById('pm-platform').value.trim()||'Coursera';
    const category=document.getElementById('pm-category').value;
    const status=document.getElementById('pm-status').value;
    const targetDate=document.getElementById('pm-target').value;
    const url=document.getElementById('pm-url').value.trim();
    const purpose=document.getElementById('pm-purpose').value.trim();
    const notes=document.getElementById('pm-notes').value.trim();
    if(editingId){
      const p=getById(editingId);
      if(p){p.name=name;p.platform=platform;p.category=category;p.status=status;p.targetDate=targetDate;p.url=url;p.purpose=purpose;p.notes=notes;}
    }else{
      const fc=document.getElementById('pm-first-course').value.trim();
      const np={id:uid(),name:name,platform:platform,category:category,status:status,targetDate:targetDate,url:url,purpose:purpose,notes:notes,links:[],courses:fc?[{cid:cuid(),name:fc,done:false,link:'',modules:[]}]:[]};
      programs.push(np);editingId=np.id;
    }
    saveData();
    document.getElementById('progModal').classList.remove('show');
    if(openId){openId=editingId;renderDetail();}else{renderGrid();}
  },
  deleteProgram:function(){
    if(!editingId)return;
    if(!confirm('Remove this entire program?'))return;
    programs=programs.filter(function(p){return p.id!==editingId;});
    if(openId===editingId)openId=null;
    saveData();
    document.getElementById('progModal').classList.remove('show');
    renderGrid();
  },
  closeModal:function(){document.getElementById('progModal').classList.remove('show');},
  init:function(){
    loadData();renderGrid();
    document.getElementById('progModal').addEventListener('click',function(e){if(e.target===this)window.CO.closeModal();});
  }
};
})();
</script>
